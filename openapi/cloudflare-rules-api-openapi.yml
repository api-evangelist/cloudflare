openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Rules API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Rules
paths:
  /accounts/{account_id}/cloudforce-one/rules:
    delete:
      operationId: cloudforce-one-delete-all-rules
      summary: Delete all rules
      description: Delete all rules in an account.
      parameters:
      - $ref: '#/components/parameters/cloudforce-one_account_id'
      responses:
        '200':
          description: All rules deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_DeleteAllResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
        '409':
          description: Bulk delete blocked because email rules require individual approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: cloudforce-one.rules
      x-fern-sdk-method-name: deleteAll
    get:
      operationId: cloudforce-one-list-rules
      summary: List rules
      description: Returns all rules for an account with optional filtering.
      parameters:
      - $ref: '#/components/parameters/cloudforce-one_account_id'
      - name: namespace
        in: query
        description: Selects namespaces. Repeat the parameter to select multiple namespaces (for example, namespace=foo&namespace=bar).
        schema:
          description: Selects namespaces. Repeat the parameter to select multiple namespaces (for example, namespace=foo&namespace=bar).
          example:
          - yara/workers
          - yara/dns_record
          anyOf:
          - type: string
          - items:
              type: string
            maxItems: 50
            type: array
      - name: path
        in: query
        description: Selects paths with exact-match semantics. Omit the parameter to return rules from all paths. Pass an empty string (path=) to return only rules with an empty or uncategorized path. Pass a value (for example, path=yara) to match that exact path. Repeat the parameter (for example, path=yara&path=expr) to OR-match multiple paths with SQL `IN (...)` semantics. The `recursive` flag affects only customer-account namespace selection.
        schema:
          description: Selects paths with exact-match semantics. Omit the parameter to return rules from all paths. Pass an empty string (path=) to return only rules with an empty or uncategorized path. Pass a value (for example, path=yara) to match that exact path. Repeat the parameter (for example, path=yara&path=expr) to OR-match multiple paths with SQL `IN (...)` semantics. The `recursive` flag affects only customer-account namespace selection.
          example:
          - yara/workers
          anyOf:
          - type: string
          - items:
              type: string
            maxItems: 50
            type: array
      - name: recursive
        in: query
        description: For customer accounts, true enables descendant matching for namespaces. Paths always use exact matching.
        schema:
          description: For customer accounts, true enables descendant matching for namespaces. Paths always use exact matching.
          type: string
          example: 'true'
          enum:
          - 'true'
          - 'false'
      - name: search
        in: query
        schema:
          type: string
          example: malicious
      - name: is_public
        in: query
        description: Limits rules to the specified public visibility.
        schema:
          description: Limits rules to the specified public visibility.
          type: string
          example: 'true'
          enum:
          - 'true'
          - 'false'
      - name: limit
        in: query
        schema:
          type: number
          example: 50
          default: 50
          maximum: 100
          minimum: 1
      - name: offset
        in: query
        schema:
          type:
          - number
          - 'null'
          example: 0
          default: 0
          minimum: 0
      responses:
        '200':
          description: List of rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_RulesPreviewListResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: cloudforce-one.rules
      x-fern-sdk-method-name: list
    post:
      operationId: cloudforce-one-create-rule
      summary: Create a rule
      description: Create a new detection rule.
      parameters:
      - $ref: '#/components/parameters/cloudforce-one_account_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cloudforce-one_CreateRule'
      responses:
        '201':
          description: Rule created (non-email customer accounts, or silent warning-free customer email rules).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_Rule'
        '202':
          description: Rule pending approval (internal accounts, blocking customer email rules, and customer email rules with compiler warnings).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ApprovalPendingResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: cloudforce-one.rules
      x-fern-sdk-method-name: create
  /accounts/{account_id}/cloudforce-one/rules/exemptions:
    delete:
      operationId: cloudforce-one-remove-account-exemptions
      summary: Remove patterns from exemption rules
      description: Remove regex patterns from per-account exemption rules. Missing keys leave that type untouched; non-existent patterns are silently skipped.
      parameters:
      - $ref: '#/components/parameters/cloudforce-one_account_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cloudforce-one_PartialAccountExemptions'
      responses:
        '200':
          description: Full exemption state after the subtraction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_AccountExemptions'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: cloudforce-one.rules.exemptions
      x-fern-sdk-method-name: delete
    get:
      operationId: cloudforce-one-get-exemptions
      summary: Get exemption rules for an account
      description: Get all exemption rule patterns for the account, grouped by type.
      parameters:
      - $ref: '#/components/parameters/cloudforce-one_account_id'
      responses:
        '200':
          description: Exemption rules grouped by type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_AccountExemptions'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: cloudforce-one.rules.exemptions
      x-fern-sdk-method-name: get
    post:
      operationId: cloudforce-one-add-account-exemptions
      summary: Add patterns to exemption rules
      description: Add regex patterns to per-account exemption rules (union semantics). Missing keys leave that type untouched; duplicates are silently deduped.
      parameters:
      - $ref: '#/components/parameters/cloudforce-one_account_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cloudforce-one_PartialAccountExemptions'
      responses:
        '200':
          description: Full exemption state after the union.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_AccountExemptions'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: cloudforce-one.rules.exemptions
      x-fern-sdk-method-name: create
    put:
      operationId: cloudforce-one-update-account-exemptions
      summary: Update exemption rule patterns
      description: Replace existing exemption patterns with new values. Each key maps to an array of {old_pattern, new_pattern} entries. Missing keys leave that type untouched. Fails if any old pattern is not found or any new pattern already exists.
      parameters:
      - $ref: '#/components/parameters/cloudforce-one_account_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cloudforce-one_UpdateAccountExemptionsBody'
      responses:
        '200':
          description: Full exemption state after the updates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_AccountExemptions'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
        '404':
          description: Pattern not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
        '409':
          description: New pattern already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: cloudforce-one.rules.exemptions
      x-fern-sdk-method-name: update
  /accounts/{account_id}/cloudforce-one/rules/managed:
    get:
      operationId: cloudforce-one-get-managed-rules
      summary: Get managed rules
      description: Get DFP managed rule metadata (name and description) from YARA rules.
      parameters:
      - $ref: '#/components/parameters/cloudforce-one_account_id'
      responses:
        '200':
          description: Managed rules metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      fetched_at:
                        type: string
                      total_rules:
                        type: number
                    required:
                    - total_rules
                    - fetched_at
                  rules:
                    type: array
                    items:
                      properties:
                        description:
                          type: string
                        name:
                          type: string
                      required:
                      - name
                      - description
                      type: object
                required:
                - rules
                - metadata
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: cloudforce-one.rules.managed
      x-fern-sdk-method-name: get
  /accounts/{account_id}/cloudforce-one/rules/search:
    get:
      operationId: cloudforce-one-search-rules
      summary: Search rules
      description: Search rules using hybrid, vector, keyword, or exact retrieval, backed by AI Search with a SQL fallback.
      parameters:
      - $ref: '#/components/parameters/cloudforce-one_account_id'
      - name: namespace
        in: query
        description: Selects namespaces. Repeat the parameter to select multiple namespaces (for example, namespace=foo&namespace=bar).
        schema:
          description: Selects namespaces. Repeat the parameter to select multiple namespaces (for example, namespace=foo&namespace=bar).
          example:
          - yara/workers
          - yara/dns_record
          anyOf:
          - type: string
          - items:
              type: string
            maxItems: 50
            type: array
      - name: path
        in: query
        description: Selects paths with exact-match semantics. Omit the parameter to return rules from all paths. Pass an empty string (path=) to return only rules with an empty or uncategorized path. Pass a value (for example, path=yara) to match that exact path. Repeat the parameter (for example, path=yara&path=expr) to OR-match multiple paths with SQL `IN (...)` semantics. The `recursive` flag affects only customer-account namespace selection.
        schema:
          description: Selects paths with exact-match semantics. Omit the parameter to return rules from all paths. Pass an empty string (path=) to return only rules with an empty or uncategorized path. Pass a value (for example, path=yara) to match that exact path. Repeat the parameter (for example, path=yara&path=expr) to OR-match multiple paths with SQL `IN (...)` semantics. The `recursive` flag affects only customer-account namespace selection.
          example:
          - yara/workers
          anyOf:
          - type: string
          - items:
              type: string
            maxItems: 50
            type: array
      - name: recursive
        in: query
        description: For customer accounts, true enables descendant matching for namespaces. Paths always use exact matching.
        schema:
          description: For customer accounts, true enables descendant matching for namespaces. Paths always use exact matching.
          type: string
          example: 'true'
          enum:
          - 'true'
          - 'false'
      - name: search
        in: query
        schema:
          type: string
          example: malicious
      - name: is_public
        in: query
        description: Limits rules to the specified public visibility.
        schema:
          description: Limits rules to the specified public visibility.
          type: string
          example: 'true'
          enum:
          - 'true'
          - 'false'
      - name: limit
        in: query
        schema:
          type: number
          example: 50
          default: 50
          maximum: 100
          minimum: 1
      - name: offset
        in: query
        schema:
          type:
          - number
          - 'null'
          example: 0
          default: 0
          minimum: 0
      - name: query
        in: query
        description: Natural-language or keyword search query.
        required: true
        schema:
          description: Natural-language or keyword search query.
          type: string
          example: obfuscated proxy worker
          maxLength: 500
          minLength: 1
      - name: mode
        in: query
        description: Retrieval strategy used for the query.
        schema:
          description: Retrieval strategy used for the query.
          type: string
          example: hybrid
          default: hybrid
          enum:
          - exact
          - hybrid
          - vector
          - keyword
        x-fern-parameter-name: search-mode
      - name: language
        in: query
        description: Limits results to the specified rule language.
        schema:
          description: Limits results to the specified rule language.
          type: string
          example: yara
          enum:
          - yara
          - js
      responses:
        '200':
          description: Hybrid and semantic rule search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_RulesSearchResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
        '503':
          description: AI Search unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: cloudforce-one.rules
      x-fern-sdk-method-name: search
  /accounts/{account_id}/cloudforce-one/rules/stats:
    get:
      operationId: cloudforce-one-get-rule-stats
      summary: Get dashboard stats
      description: Get statistics about rules for the dashboard.
      parameters:
      - $ref: '#/components/parameters/cloudforce-one_account_id'
      responses:
        '200':
          description: Dashboard statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_StatsResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: cloudforce-one.rules.stats
      x-fern-sdk-method-name: get
  /accounts/{account_id}/cloudforce-one/rules/structured:
    get:
      operationId: cloudforce-one-list-email-rules
      summary: List email rules
      description: Returns structured email rules.
      parameters:
      - $ref: '#/components/parameters/cloudforce-one_account_id'
      - name: limit
        in: query
        schema:
          type: number
          default: 50
          maximum: 100
          minimum: 1
      - name: offset
        in: query
        schema:
          type:
          - number
          - 'null'
          default: 0
          minimum: 0
      - name: search
        in: query
        schema:
          type: string
      responses:
        '200':
          description: List of rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_EmailRulesListResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: cloudforce-one.rules.email
      x-fern-sdk-method-name: list
    post:
      operationId: cloudforce-one-create-email-rule
      summary: Create an email rule
      description: Create a structured email rule.
      parameters:
      - $ref: '#/components/parameters/cloudforce-one_account_id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                condition:
                  $ref: '#/components/schemas/cloudforce-one_EmailRuleConditionGroup'
                description:
                  type: string
                  maxLength: 1000
                enabled:
                  type: boolean
                  default: true
                meta:
                  type: array
                  items:
                    $ref: '#/components/schemas/cloudforce-one_MetaInputEntry'
                  maxItems: 50
                name:
                  type: string
                  maxLength: 255
                  minLength: 1
                status:
                  description: Disposition for matching email. This emits status metadata with the selected value.
                  type: string
                  default: silent
                  enum:
                  - silent
                  - blocking
                strings:
                  type: array
                  items:
                    properties:
                      identifier:
                        type: string
                        maxLength: 128
                        minLength: 1
                        pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
                      match_type:
                        type: string
                        default: text
                        enum:
                        - text
                        - hex
                        - regex
                      modifiers:
                        type: array
                        items:
                          enum:
                          - nocase
                          - wide
                          - ascii
                          - fullword
                          type: string
                        default: []
                      type:
                        type: string
                        enum:
                        - string_match
                      value:
                        type: string
                        maxLength: 10000
                        minLength: 1
                    required:
                    - type
                    - identifier
                    - value
                    type: object
                  default: []
                  maxItems: 50
              required:
              - name
              - condition
      responses:
        '201':
          description: Email rule created immediately when submitted by a customer with silent status and no compiler warnings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_RulePreview'
        '202':
          description: Rule pending approval (internal accounts, blocking customer rules, and customer rules with compiler warnings).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ApprovalPendingResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: cloudforce-one.rules.email
      x-fern-sdk-method-name: create
  /accounts/{account_id}/cloudforce-one/rules/structured/approvals/{id}:
    put:
      operationId: cloudforce-one-update-pending-email-rule-approval
      summary: Update a pending structured email rule approval
      description: Validate, compile, and replace the proposed structured email rule on a pending approval. Only the original requester may update it.
      parameters:
      - $ref: '#/components/parameters/cloudforce-one_account_id'
      - name: id
        in: path
        description: The unique identifier for the approval.
        required: true
        schema:
          description: The unique identifier for the approval.
          type: string
          example: '1'
      - name: module
        in: query
        description: Structured rule module.
        schema:
          description: Structured rule module.
          type: string
          example: eml
          default: eml
          enum:
          - eml
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                condition:
                  $ref: '#/components/schemas/cloudforce-one_EmailRuleConditionGroup'
                description:
                  type: string
                  maxLength: 1000
                enabled:
                  type: boolean
                  default: true
                meta:
                  type: array
                  items:
                    $ref: '#/components/schemas/cloudforce-one_MetaInputEntry'
                  maxItems: 50
                name:
                  type: string
                  maxLength: 255
                  minLength: 1
                status:
                  description: Disposition for matching email. This emits status metadata with the selected value.
                  type: string
                  default: silent
                  enum:
                  - silent
                  - blocking
                strings:
                  type: array
                  items:
                    properties:
                      identifier:
                        type: string
                        maxLength: 128
                        minLength: 1
                        pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
                      match_type:
                        type: string
                        default: text
                        enum:
                        - text
                        - hex
                        - regex
                      modifiers:
                        type: array
                        items:
                          enum:
                          - nocase
                          - wide
                          - ascii
                          - fullword
                          type: string
                        default: []
                      type:
                        type: string
                        enum:
                        - string_match
                      value:
                        type: string
                        maxLength: 10000
                        minLength: 1
                    required:
                    - type
                    - identifier
                    - value
                    type: object
                  default: []
                  maxItems: 50
              required:
              - name
              - condition
      responses:
        '200':
          description: Pending approval updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_EditApprovalResponse'
        '400':
          description: Structured rule validation or compilation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
        '403':
          description: Not authorized to update this approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
        '404':
          description: Approval not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloudforce-one_ErrorResponse'
        '409':
