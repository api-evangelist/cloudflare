openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Zone API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Zone
paths:
  /zones:
    get:
      operationId: zones-get
      summary: List Zones
      description: 'Lists, searches, sorts, and filters your zones. Listing zones across more than 500 accounts

        is currently not allowed.'
      parameters:
      - name: name
        in: query
        schema:
          description: "A domain name. Optional filter operators can be provided to extend refine the search:\n  * `equal` (default)\n  * `not_equal`\n  * `starts_with`\n  * `ends_with`\n  * `contains`\n  * `starts_with_case_sensitive`\n  * `ends_with_case_sensitive`\n  * `contains_case_sensitive`\n"
          type: string
          maxLength: 253
        examples:
          Basic Query:
            summary: Simple Query
            value: example.com
          Contains Query:
            summary: Contains Query
            value: contains:.org
          Ends With Query:
            summary: Ends With Query
            value: ends_with:arpa
          Starts With Query:
            summary: Starts With Query
            value: starts_with:dev
      - name: status
        in: query
        schema:
          description: Specify a zone status to filter by.
          type: string
          enum:
          - initializing
          - pending
          - active
          - moved
      - name: type
        in: query
        schema:
          description: Zone types to filter by. Multiple types can be specified as a comma-separated list (e.g., ?type=full,partial,secondary). When this parameter is not provided, zones with type "internal" are excluded from the results.
          type: array
          items:
            enum:
            - full
            - partial
            - secondary
            - internal
            type: string
        explode: false
        style: form
      - name: account.id
        in: query
        schema:
          description: Filter by an account ID.
          type: string
      - name: account.name
        in: query
        schema:
          description: "An account Name. Optional filter operators can be provided to extend refine the search:\n  * `equal` (default)\n  * `not_equal`\n  * `starts_with`\n  * `ends_with`\n  * `contains`\n  * `starts_with_case_sensitive`\n  * `ends_with_case_sensitive`\n  * `contains_case_sensitive`\n"
          type: string
          maxLength: 253
        examples:
          Basic Query:
            summary: Simple Query
            value: Dev Account
          Contains Query:
            summary: Contains Query
            value: contains:Test
      - name: page
        in: query
        schema:
          description: Page number of paginated results.
          type: number
          default: 1
          minimum: 1
      - name: per_page
        in: query
        schema:
          description: Number of zones per page.
          type: number
          default: 20
          maximum: 50
          minimum: 5
      - name: order
        in: query
        schema:
          description: Field to order zones by.
          type: string
          example: status
          enum:
          - name
          - status
          - account.id
          - account.name
          - plan.id
      - name: direction
        in: query
        schema:
          description: Direction to order zones.
          type: string
          example: desc
          enum:
          - asc
          - desc
      - name: match
        in: query
        schema:
          description: Whether to match all search requirements or at least one (any).
          type: string
          default: all
          enum:
          - any
          - all
      responses:
        '200':
          description: List Zones response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/zones_api-response-common'
                - properties:
                    result_info:
                      $ref: '#/components/schemas/zones_result_info'
                - properties:
                    result:
                      type: array
                      items:
                        $ref: '#/components/schemas/zones_zone'
        4XX:
          description: List Zones response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zones_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Zone
      x-api-token-group:
      - Zone Zone Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zones
      x-fern-sdk-method-name: list
    post:
      operationId: zones-post
      summary: Create Zone
      description: 'Creates a new zone (domain) in your Cloudflare account.


        The zone is created in a pending state and must be activated by updating your domain''s

        nameservers to point to Cloudflare, or by completing the verification process for partial

        (CNAME) setups.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account:
                  type: object
                  properties:
                    id:
                      $ref: '#/components/schemas/zones_identifier'
                name:
                  $ref: '#/components/schemas/zones_name'
                type:
                  $ref: '#/components/schemas/zones_type'
              required:
              - name
              - account
      responses:
        '200':
          description: Create Zone response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/zones_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/zones_zone'
                  type: object
        4XX:
          description: Create Zone response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zones_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Zone
      x-api-token-group:
      - Zone Zone Edit
      - Zone DNS Edit
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zones
      x-fern-sdk-method-name: create
  /zones/{zone_id}:
    delete:
      operationId: zones-0-delete
      summary: Delete Zone
      description: Deletes an existing zone.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/zones_identifier'
      responses:
        '200':
          description: Delete Zone response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zones_api-response-single-id'
        4XX:
          description: Delete Zone response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zones_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Zone
      x-api-token-group:
      - Zone Write
      x-cfPermissionsRequired:
        enum:
        - '#zone:edit'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zones
      x-fern-sdk-method-name: delete
    get:
      operationId: zones-0-get
      summary: Zone Details
      description: 'Retrieves detailed information about a specific zone identified by its zone ID.


        Returns zone configuration, status, nameservers, and associated metadata.'
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/zones_identifier'
      responses:
        '200':
          description: Zone Details response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/zones_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/zones_zone'
                  type: object
        4XX:
          description: Zone Details response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zones_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Zone
      x-api-token-group:
      - Trust and Safety Write
      - Trust and Safety Read
      - 'Zero Trust: PII Read'
      - Zaraz Edit
      - Zaraz Read
      - Zaraz Admin
      - 'Access: Apps and Policies Revoke'
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Read'
      - 'Access: Apps and Policies Revoke'
      - 'Access: Mutual TLS Certificates Write'
      - 'Access: Organizations, Identity Providers, and Groups Write'
      - Zone Settings Write
      - Zone Settings Read
      - Zone Read
      - DNS Read
      - Workers Scripts Write
      - Workers Scripts Read
      - Zone Write
      - Workers Routes Write
      - Workers Routes Read
      - Stream Write
      - Stream Read
      - SSL and Certificates Write
      - SSL and Certificates Read
      - Logs Write
      - Logs Read
      - Cache Purge
      - Page Rules Write
      - Page Rules Read
      - Load Balancers Write
      - Load Balancers Read
      - Firewall Services Write
      - Firewall Services Read
      - DNS Write
      - Apps Write
      - Analytics Read
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Read'
      x-cfPermissionsRequired:
        enum:
        - '#zone:read'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zones
      x-fern-sdk-method-name: get
    patch:
      operationId: zones-0-patch
      summary: Edit Zone
      description: Edits a zone. Only one zone property can be changed at a time.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/zones_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paused:
                  $ref: '#/components/schemas/zones_paused'
                plan:
                  description: '(Deprecated) Please use the `/zones/{zone_id}/subscription` API

                    to update a zone''s plan. Changing this value will create/cancel

                    associated subscriptions. To view available plans for this zone,

                    see Zone Plans.

                    '
                  type: object
                  properties:
                    id:
                      $ref: '#/components/schemas/zones_identifier'
                type:
                  description: 'A full zone implies that DNS is hosted with Cloudflare. A partial

                    zone is typically a partner-hosted zone or a CNAME setup. This

                    parameter is only available to Enterprise customers or if it has

                    been explicitly enabled on a zone.

                    '
                  type: string
                  example: full
                  enum:
                  - full
                  - partial
                  - secondary
                  - internal
                vanity_name_servers:
                  $ref: '#/components/schemas/zones_vanity_name_servers'
              example:
                paused: true
      responses:
        '200':
          description: Edit Zone response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/zones_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/zones_zone'
                  type: object
        4XX:
          description: Edit Zone response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zones_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Zone
      x-api-token-group:
      - Zone Write
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zones
      x-fern-sdk-method-name: edit
  /zones/{zone_id}/activation_check:
    put:
      operationId: put-zones-zone_id-activation_check
      summary: Rerun the Activation Check
      description: 'Triggeres a new activation check for a PENDING Zone. This can be

        triggered every 5 min for paygo/ent customers, every hour for FREE

        Zones.'
      parameters:
      - name: zone_id
        in: path
        description: Zone ID
        required: true
        schema:
          $ref: '#/components/schemas/zone-activation_identifier'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/zone-activation_api-response-single'
                - properties:
                    result:
                      type: object
                      properties:
                        id:
                          $ref: '#/components/schemas/zone-activation_identifier'
                  type: object
        4XX:
          description: Client Error
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/zone-activation_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Zone
      x-api-token-group:
      - Zone Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zone
      x-fern-sdk-method-name: activate
  /zones/{zone_id}/environments/{environment_id}/invalidate_cache:
    post:
      operationId: zone-environment-invalidate
      summary: Invalidate Cached Content by Environment
      description: 'Marks cached content as stale for one environment of the zone. Content cached for the zone''s other environments, including production, is not affected. Otherwise this works like `POST /zones/{zone_id}/invalidate_cache`: the next request for invalidated content makes Cloudflare revalidate it with your origin, and the request body takes the same fields.


        Environments are part of Version Management. To delete the content instead, use `POST /zones/{zone_id}/environments/{environment_id}/purge_cache`.


        Invalidating by URL (`files`) does not work for environments that select requests by IP address, country, ASN, or threat score, and fails with error `1136`. Use `tags`, `hosts`, `prefixes`, or `purge_everything` for those environments.


        ### Availability and limits


        Rate limits and the number of items you can send in one request depend on your plan. See Purge cache: availability and limits.'
      parameters:
      - name: zone_id
        in: path
        description: The zone ID.
        required: true
        schema:
          $ref: '#/components/schemas/cache-purge_identifier'
      - name: environment_id
        in: path
        description: The environment ID, from Version Management.
        required: true
        schema:
          $ref: '#/components/schemas/cache-purge_identifier'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              Cache tags:
                summary: Content with these Cache-Tag values
                value:
                  tags:
                  - product-1234
                  - homepage
              Everything:
                summary: All cached content
                value:
                  purge_everything: true
              Hostnames:
                summary: Content cached for these hostnames
                value:
                  hosts:
                  - www.example.com
                  - images.example.com
              Prefixes:
                summary: Content under these URL prefixes
                value:
                  prefixes:
                  - www.example.com/blog/
                  - images.example.com/avatars/
              URLs:
                summary: Specific URLs
                value:
                  files:
                  - https://www.example.com/css/styles.css
                  - https://www.example.com/js/index.js
              URLs with cache key headers:
                summary: URLs cached with request headers in the cache key
                value:
                  files:
                  - headers:
                      Accept-Language: zh-CN
                      CF-Device-Type: desktop
                      CF-IPCountry: US
                    url: https://www.example.com/cat_picture.jpg
                  - headers:
                      Accept-Language: en-US
                      CF-Device-Type: mobile
                      CF-IPCountry: DE
                    url: https://www.example.com/dog_picture.jpg
            schema:
              anyOf:
              - $ref: '#/components/schemas/cache-purge_FlexPurgeByTags'
              - $ref: '#/components/schemas/cache-purge_FlexPurgeByHostnames'
              - $ref: '#/components/schemas/cache-purge_FlexPurgeByPrefixes'
              - $ref: '#/components/schemas/cache-purge_Everything'
              - $ref: '#/components/schemas/cache-purge_SingleFile'
              - $ref: '#/components/schemas/cache-purge_SingleFileWithUrlAndHeaders'
      responses:
        '200':
          description: 'Cloudflare accepted the request. If Cloudflare could not accept some of the items, `success` is `false` and `errors` lists them, followed by error `1016`.

            '
          content:
            application/json:
              example:
                errors: []
                messages: []
                result:
                  id: 023e105f4ecef8ad9ca31a8372d0c353
                success: true
              schema:
                $ref: '#/components/schemas/cache-purge_api-response-single-id'
        4XX:
          description: Cloudflare rejected the request. `errors` explains why.
          content:
            application/json:
              examples:
                Invalid request body:
                  summary: purge_everything sent with other fields (HTTP 400)
                  value:
                    errors:
                    - code: 1092
                      message: Request cannot contain "purge_everything" and any of "files", "tags", "hosts" or "prefixes"
                    messages: []
                    result: null
                    success: false
                Rate limited:
                  summary: Rate limit reached (HTTP 429)
                  value:
                    errors:
                    - code: 1134
                      message: Unable to purge, rate limit reached. Please wait and consider throttling your request speed
                    messages: []
                    result: null
                    success: false
              schema:
                allOf:
                - $ref: '#/components/schemas/cache-purge_api-response-single-id'
                - $ref: '#/components/schemas/cache-purge_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Zone
      x-api-token-group:
      - Zone Versioning Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: cache
      x-fern-sdk-method-name: invalidate-environment
      x-forge-require-confirmation: This operation marks the selected content in the environment's cache as stale.
  /zones/{zone_id}/environments/{environment_id}/purge_cache:
    post:
      operationId: zone-environment-purge
      summary: Purge Cached Content by Environment
      description: 'Deletes cached content for one environment of the zone. Content cached for the zone''s other environments, including production, is not affected. Otherwise this works like `POST /zones/{zone_id}/purge_cache`: the next request for purged content is a cache `MISS`, and the request body takes the same fields.


        Environments are part of Version Management. To keep content cached and have Cloudflare revalidate it instead, use `POST /zones/{zone_id}/environments/{environment_id}/invalidate_cache`.


        Purging by URL (`files`) does not work for environments that select requests by IP address, country, ASN, or threat score, and fails with error `1136`. Use `tags`, `hosts`, `prefixes`, or `purge_everything` for those environments.


        ### Availability and limits


        Rate limits and the number of items you can send in one request depend on your plan. See Purge cache: availability and limits.'
      parameters:
      - name: zone_id
        in: path
        description: The zone ID.
        required: true
        schema:
          $ref: '#/components/schemas/cache-purge_identifier'
      - name: environment_id
        in: path
        description: The environment ID, from Version Management.
        required: true
        schema:
          $ref: '#/components/schemas/cache-purge_identifier'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              Cache tags:
                summary: Content with these Cache-Tag values
                value:
                  tags:
                  - product-1234
                  - homepage
              Everything:
                summary: All cached content
                value:
                  purge_everything: true
              Hostnames:
                summary: Content cached for these hostnames
                value:
                  hosts:
                  - www.example.com
                  - images.example.com
              Prefixes:
                summary: Content under these URL prefixes
                value:
                  prefixes:
                  - www.example.com/blog/
                  - images.example.com/avatars/
              URLs:
                summary: Specific URLs
                value:
                  files:
                  - https://www.example.com/css/styles.css
                  - https://www.example.com/js/index.js
              URLs with cache key headers:
                summary: URLs cached with request headers in the cache key
                value:
                  files:
                  - headers:
                      Accept-Language: zh-CN
                      CF-Device-Type: desktop
                      CF-IPCountry: US
                    url: https://www.example.com/cat_picture.jpg
                  - headers:
                      Accept-Language: en-US
                      CF-Device-Type: mobile
                      CF-IPCountry: DE
                    url: https://www.example.com/dog_picture.jpg
            schema:
              anyOf:
              - $ref: '#/components/schemas/cache-purge_FlexPurgeByTags'
              - $ref: '#/components/schemas/cache-purge_FlexPurgeByHostnames'
              - $ref: '#/components/schemas/cache-purge_FlexPurgeByPrefixes'
              - $ref: '#/components/schemas/cache-purge_Everything'
              - $ref: '#/components/schemas/cache-purge_SingleFile'
              - $ref: '#/components/schemas/cache-purge_SingleFileWithUrlAndHeaders'
      responses:
        '200':
          description: 'Cloudflare accepted the request. If Cloudflare could not accept some of the items, `success` is `false` and `errors` lists them, followed by error `1016`.

            '
          content:
            application/json:
              example:
                errors: []
                messages: []
                result:
                  id: 023e105f4ecef8ad9ca31a8372d0c353
                success: true
              schema:
                $ref: '#/components/schemas/cache-purge_api-response-single-id'
        4XX:
          description: Cloudflare rejected the request. `errors` explains why.
          content:
            application/json:
              examples:
                Invalid request body:
                  summary: purge_everything sent with other fields (HTTP 400)
                  value:
                    errors:
                    - code: 1092
                      message: Request cannot contain "purge_everything" and any of "files", "tags", "hosts" or "prefixes"
                    messages: []
                    result: null
                    success: false
                Rate limited:
                  summary: Rate limit reached (HTTP 429)
                  value:
                    errors:
                    - code: 1134
                      message: Unable to purge, rate limit reached. Please wait and consider throttling your request speed
                    messages: []
                    result: null
                    success: false
              schema:
                allOf:
                - $ref: '#/components/schemas/cache-purge_api-response-single-id'
                - $ref: '#/components/schemas/cache-purge_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Zone
      x-api-token-group:
      - Cache Purge
      x-cfPermissionsRequired:
        enum:
        - '#cache_purge:edit'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: cache
      x-fern-sdk-method-name: purge-environment
      x-forge-require-confirmation: This operation deletes the selected content from the environment's cache.
  /zones/{zone_id}/invalidate_cache:
    post:
      operationId: zone-invalidate
      summary: Invalidate Cached Content
      description: 'Marks cached content as stale in every Cloudflare data center and cache tier, including Cache Reserve. The content stays in cache. The next request for it makes Cloudflare revalidate it with your origin, using the `ETag` and `Last-Modified` values it was cached with:


        - If your origin answers `304 Not Modified`, Cloudflare serves the cached copy without downloading it again, and `CF-Cache-Status` is `REVALIDATED`.

        - If your origin sends a full response, Cloudflare serves and caches the new content, and `CF-Cache-Status` is `EXPIRED`.


        With Tiered Cache, each tier revalidates with the tier above it, so a visitor can see `EXPIRED` even when your origin answered `304`.


        Until content is revalidated, your `stale-while-revalidate` and `stale-if-error` directives still apply, counted from the time you invalidated it. For example, if your origin fails during revalidation, Cloudflare can keep serving the stale copy for the `stale-if-error` window.


        ### Invalidate or purge?


        - **Invalidate** when content may not have changed, for example after a deploy. Unchanged content costs your origin a `304` instead of a full response. That saving needs an origin that sends `ETag` or `Last-Modified` and answers conditional requests. Otherwise, every revalidation downloads the full response.

        - **Purge**, with `POST /zones/{zone_id}/purge_cache`, when content must not be served again, for example content you removed for legal or security reasons.


        Invalidating takes the same request bodies as purging, needs the same permission, and counts against the same rate limits. After a broad invalidation, such as `purge_everything`, expect more conditional requests to your origin while visitors request the invalidated content again.


        ### Choose what to invalidate


        Send one of these fields in the request body:


        - `files`: specific URLs. If your cache key includes request headers, send each URL with the header values it was cached with.

        - `tags`: all content whose `Cache-Tag` response header contains one of the tags.

        - `hosts`: all content cached for the hostnames.

        - `prefixes`: all content whose URL starts with one of the prefixes.

        - `purge_everything`: all cached content in the zone.


        ### Check the result


        A `200` response with `success: true` means Cloudflare accepted the request. To check, request an invalidated URL and confirm that the `CF-Cache-Status` response header is `REVALIDATED` or `EXPIRED`.


        ### Availability and limits


        Rate limits and the number of items you can send in one request depend on your plan. See Purge cache: availability and limits.'
      parameters:
      - name: zone_id
        in: path
        description: The zone ID.
        required: true
        schema:
          $ref: '#/components/schemas/cache-purge_identifier'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              Cache tags:
                summary: Content with these Cache-Tag values
                value:
                  tags:
                  - product-1234
                  - homepage
              Everything:
                summary: All cached content
                value:
                  purge_everything: true
              Hostnames:
                summary: Content cached for these hostnames
                value:
                  hosts:
                  - www.example.com
                  - images.example.com
              Prefixes:
                summary: Content under these URL prefixes
                value:
                  prefixes:
                  - www.example.com/blog/
                  - images.example.com/avatars/
