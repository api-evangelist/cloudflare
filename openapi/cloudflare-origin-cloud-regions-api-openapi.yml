                  $ref: '#/components/examples/cache-settings_origin_cloud_region_v2_single'
              schema:
                allOf:
                - $ref: '#/components/schemas/cache-settings_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/cache-settings_origin_cloud_region_v2_entry'
                  type: object
        4XX:
          description: Create or replace origin cloud region mapping failure.
          content:
            application/json:
              examples:
                invalid_vendor_region:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_v2_invalid_vendor_region'
                ip_mismatch:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_v2_ip_mismatch'
                too_many_mappings:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_v2_too_many_mappings'
              schema:
                $ref: '#/components/schemas/cache-settings_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Origin Cloud Regions
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: cache.origin-cloud-regions
      x-fern-sdk-method-name: update
      x-forge-hidden: true
