openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Origin Cloud Regions API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Origin Cloud Regions
paths:
  /zones/{zone_id}/cache/origin_cloud_regions:
    get:
      operationId: origin-cloud-regions-list
      summary: List origin cloud region mappings
      description: Returns all IP-to-cloud-region mappings configured for the zone. Each mapping tells Cloudflare which cloud vendor and region hosts the origin at that IP, enabling the edge to route via the nearest Tiered Cache upper-tier co-located with that cloud provider. Returns an empty array when no mappings exist.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cache-settings_identifier'
      responses:
        '200':
          description: List origin cloud region mappings response.
          content:
            application/json:
              examples:
                empty:
                  $ref: '#/components/examples/cache-settings_origin_cloud_regions_empty'
                two_mappings:
                  $ref: '#/components/examples/cache-settings_origin_cloud_regions_list'
              schema:
                allOf:
                - $ref: '#/components/schemas/cache-settings_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/cache-settings_origin_cloud_regions_list_result'
                  type: object
        4XX:
          description: List origin cloud region mappings failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cache-settings_api-response-common-failure'
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Origin Cloud Regions
      x-cfDeprecation:
        description: Use the v2 endpoints under `/zones/{zone_id}/origin/cloud_regions` instead. The v2 API uses idempotent PUT semantics for create+update, provides a flat response shape, and is the supported path for Terraform and SDK clients. The v1 endpoints under `/zones/{zone_id}/cache/origin_cloud_regions` will be removed on 2026-10-01.
        display: true
        eol: '2026-10-01T00:00:00Z'
        id: opcr_v1_deprecation
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: deprecated
      x-fern-sdk-group-name: cache.origin-cloud-regions
      x-fern-sdk-method-name: list-v1
      x-forge-hidden: true
    patch:
      operationId: origin-cloud-regions-upsert
      summary: Create or update an origin cloud region mapping
      description: Adds or updates a single IP-to-cloud-region mapping for the zone. Unlike POST, this operation is idempotent — if a mapping for the IP already exists it is overwritten. Returns the complete updated list of all mappings for the zone. Returns 403 (code 1164) when the zone has reached the limit of 3,500 IP mappings.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cache-settings_identifier'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              gcp:
                $ref: '#/components/examples/cache-settings_origin_cloud_region_request_gcp'
            schema:
              $ref: '#/components/schemas/cache-settings_origin_cloud_region_request'
      responses:
        '200':
          description: Create or update origin cloud region mapping response.
          content:
            application/json:
              examples:
                patched:
                  $ref: '#/components/examples/cache-settings_origin_cloud_regions_list'
              schema:
                allOf:
                - $ref: '#/components/schemas/cache-settings_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/cache-settings_origin_cloud_regions_list_result'
                  type: object
        4XX:
          description: Create or update origin cloud region mapping failure.
          content:
            application/json:
              examples:
                invalid_vendor_region:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_invalid_vendor_region'
                too_many_mappings:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_too_many_mappings'
              schema:
                $ref: '#/components/schemas/cache-settings_api-response-common-failure'
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Origin Cloud Regions
      x-cfDeprecation:
        description: Use the v2 endpoints under `/zones/{zone_id}/origin/cloud_regions` instead. The v2 API uses idempotent PUT semantics for create+update, provides a flat response shape, and is the supported path for Terraform and SDK clients. The v1 endpoints under `/zones/{zone_id}/cache/origin_cloud_regions` will be removed on 2026-10-01.
        display: true
        eol: '2026-10-01T00:00:00Z'
        id: opcr_v1_deprecation
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: deprecated
      x-fern-sdk-group-name: cache.origin-cloud-regions
      x-fern-sdk-method-name: edit-v1
      x-forge-hidden: true
    post:
      operationId: origin-cloud-regions-create
      summary: Create an origin cloud region mapping
      description: Adds a single IP-to-cloud-region mapping for the zone. The IP must be a valid IPv4 or IPv6 address and is normalized to canonical form before storage (RFC 5952 for IPv6). Returns 400 (code 1145) if a mapping for that IP already exists — use PATCH to update an existing entry. The vendor and region are validated against the list from `GET /zones/{zone_id}/cache/origin_cloud_regions/supported_regions`.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cache-settings_identifier'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              aws:
                $ref: '#/components/examples/cache-settings_origin_cloud_region_request_aws'
            schema:
              $ref: '#/components/schemas/cache-settings_origin_cloud_region_request'
      responses:
        '200':
          description: Create origin cloud region mapping response.
          content:
            application/json:
              examples:
                created:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_single'
              schema:
                allOf:
                - $ref: '#/components/schemas/cache-settings_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/cache-settings_origin_cloud_region_single_result'
                  type: object
        4XX:
          description: Create origin cloud region mapping failure.
          content:
            application/json:
              examples:
                already_exists:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_already_exists'
                invalid_ip:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_invalid_ip'
                invalid_vendor_region:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_invalid_vendor_region'
              schema:
                $ref: '#/components/schemas/cache-settings_api-response-common-failure'
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Origin Cloud Regions
      x-cfDeprecation:
        description: Use the v2 endpoints under `/zones/{zone_id}/origin/cloud_regions` instead. The v2 API uses idempotent PUT semantics for create+update, provides a flat response shape, and is the supported path for Terraform and SDK clients. The v1 endpoints under `/zones/{zone_id}/cache/origin_cloud_regions` will be removed on 2026-10-01.
        display: true
        eol: '2026-10-01T00:00:00Z'
        id: opcr_v1_deprecation
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: deprecated
      x-fern-sdk-group-name: cache.origin-cloud-regions
      x-fern-sdk-method-name: create-v1
      x-forge-hidden: true
  /zones/{zone_id}/cache/origin_cloud_regions/batch:
    delete:
      operationId: origin-cloud-regions-batch-delete
      summary: Batch delete origin cloud region mappings
      description: Removes up to 100 IP-to-cloud-region mappings in a single request. Each IP is validated independently — successfully deleted items are returned in the `succeeded` array and IPs that could not be found or are invalid are returned in the `failed` array.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cache-settings_identifier'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              batch_delete:
                $ref: '#/components/examples/cache-settings_origin_cloud_region_batch_delete_request'
            schema:
              type: array
              items:
                description: Origin IP address to delete.
                example: 192.0.2.1
                type: string
              maxItems: 100
      responses:
        '200':
          description: Batch delete origin cloud region mappings successful.
          content:
            application/json:
              examples:
                batch_deleted:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_batch_delete_response'
              schema:
                allOf:
                - $ref: '#/components/schemas/cache-settings_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/cache-settings_origin_cloud_region_batch_result'
                  type: object
        4XX:
          description: Batch delete origin cloud region mappings failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cache-settings_api-response-common-failure'
        5XX:
          description: Batch delete origin cloud region mappings internal error.
          content:
            application/json:
              examples:
                internal_error:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_batch_delete_internal_error'
              schema:
                $ref: '#/components/schemas/cache-settings_api-response-common-failure'
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Origin Cloud Regions
      x-cfDeprecation:
        description: Use the v2 endpoints under `/zones/{zone_id}/origin/cloud_regions` instead. The v2 API uses idempotent PUT semantics for create+update, provides a flat response shape, and is the supported path for Terraform and SDK clients. The v1 endpoints under `/zones/{zone_id}/cache/origin_cloud_regions` will be removed on 2026-10-01.
        display: true
        eol: '2026-10-01T00:00:00Z'
        id: opcr_v1_deprecation
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: deprecated
      x-fern-sdk-group-name: cache.origin-cloud-regions
      x-fern-sdk-method-name: bulk-delete-v1
      x-forge-hidden: true
    patch:
      operationId: origin-cloud-regions-batch-upsert
      summary: Batch create or update origin cloud region mappings
      description: Adds or updates up to 100 IP-to-cloud-region mappings in a single request. Each item is validated independently — valid items are applied and invalid items are returned in the `failed` array. The vendor and region for every item are validated against the list from `GET /zones/{zone_id}/cache/origin_cloud_regions/supported_regions`.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cache-settings_identifier'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              batch_patch:
                $ref: '#/components/examples/cache-settings_origin_cloud_region_batch_patch_request'
            schema:
              type: array
              items:
                $ref: '#/components/schemas/cache-settings_origin_cloud_region_request'
              maxItems: 100
      responses:
        '200':
          description: Batch create or update origin cloud region mappings successful.
          content:
            application/json:
              examples:
                batch_patched:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_batch_patch_response'
              schema:
                allOf:
                - $ref: '#/components/schemas/cache-settings_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/cache-settings_origin_cloud_region_batch_result'
                  type: object
        4XX:
          description: Batch create or update origin cloud region mappings failure.
          content:
            application/json:
              examples:
                too_many_mappings:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_too_many_mappings'
              schema:
                $ref: '#/components/schemas/cache-settings_api-response-common-failure'
        5XX:
          description: Batch create or update origin cloud region mappings internal error.
          content:
            application/json:
              examples:
                internal_error:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_batch_patch_internal_error'
                region_validation_error:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_region_validation_error'
              schema:
                $ref: '#/components/schemas/cache-settings_api-response-common-failure'
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Origin Cloud Regions
      x-cfDeprecation:
        description: Use the v2 endpoints under `/zones/{zone_id}/origin/cloud_regions` instead. The v2 API uses idempotent PUT semantics for create+update, provides a flat response shape, and is the supported path for Terraform and SDK clients. The v1 endpoints under `/zones/{zone_id}/cache/origin_cloud_regions` will be removed on 2026-10-01.
        display: true
        eol: '2026-10-01T00:00:00Z'
        id: opcr_v1_deprecation
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: deprecated
      x-fern-sdk-group-name: cache.origin-cloud-regions
      x-fern-sdk-method-name: bulk-edit-v1
      x-forge-hidden: true
  /zones/{zone_id}/cache/origin_cloud_regions/supported_regions:
    get:
      operationId: origin-cloud-regions-supported-regions
      summary: List supported cloud vendors and regions
      description: Returns the cloud vendors and regions that are valid values for origin cloud region mappings. Each region includes the Tiered Cache upper-tier colocation codes that will be used for cache routing when a mapping targeting that region is active. Requires the zone to have Tiered Cache enabled.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cache-settings_identifier'
      responses:
        '200':
          description: List supported cloud vendors and regions response.
          content:
            application/json:
              examples:
                vendors:
                  $ref: '#/components/examples/cache-settings_supported_cloud_regions'
              schema:
                allOf:
                - $ref: '#/components/schemas/cache-settings_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/cache-settings_supported_cloud_regions_result'
                  type: object
        4XX:
          description: List supported cloud vendors and regions failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cache-settings_api-response-common-failure'
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Origin Cloud Regions
      x-cfDeprecation:
        description: Use the v2 endpoints under `/zones/{zone_id}/origin/cloud_regions` instead. The v2 API uses idempotent PUT semantics for create+update, provides a flat response shape, and is the supported path for Terraform and SDK clients. The v1 endpoints under `/zones/{zone_id}/cache/origin_cloud_regions` will be removed on 2026-10-01.
        display: true
        eol: '2026-10-01T00:00:00Z'
        id: opcr_v1_deprecation
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: deprecated
      x-fern-sdk-group-name: cache.origin-cloud-regions
      x-fern-sdk-method-name: supported-regions-v1
      x-forge-hidden: true
  /zones/{zone_id}/cache/origin_cloud_regions/{origin_ip}:
    delete:
      operationId: origin-cloud-regions-delete
      summary: Delete an origin cloud region mapping
      description: Removes the cloud region mapping for a single origin IP address. The IP path parameter is normalized before lookup. Returns the deleted entry on success. Returns 404 (code 1163) if no mapping exists for the specified IP. When the last mapping for the zone is removed the underlying rule record is also deleted.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cache-settings_identifier'
      - name: origin_ip
        in: path
        description: Origin IP address whose mapping should be deleted.
        required: true
        schema:
          type: string
          example: 192.0.2.1
      responses:
        '200':
          description: Delete origin cloud region mapping response.
          content:
            application/json:
              examples:
                deleted:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_single'
              schema:
                allOf:
                - $ref: '#/components/schemas/cache-settings_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/cache-settings_origin_cloud_region_single_result'
                  type: object
        4XX:
          description: Delete origin cloud region mapping failure.
          content:
            application/json:
              examples:
                not_found:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_not_found'
              schema:
                $ref: '#/components/schemas/cache-settings_api-response-common-failure'
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Origin Cloud Regions
      x-cfDeprecation:
        description: Use the v2 endpoints under `/zones/{zone_id}/origin/cloud_regions` instead. The v2 API uses idempotent PUT semantics for create+update, provides a flat response shape, and is the supported path for Terraform and SDK clients. The v1 endpoints under `/zones/{zone_id}/cache/origin_cloud_regions` will be removed on 2026-10-01.
        display: true
        eol: '2026-10-01T00:00:00Z'
        id: opcr_v1_deprecation
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: deprecated
      x-fern-sdk-group-name: cache.origin-cloud-regions
      x-fern-sdk-method-name: delete-v1
      x-forge-hidden: true
    get:
      operationId: origin-cloud-regions-get
      summary: Get an origin cloud region mapping
      description: Returns the cloud region mapping for a single origin IP address. The IP path parameter is normalized before lookup (RFC 5952 for IPv6). Returns 404 (code 1142) if the zone has no mappings or if the specified IP has no mapping.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cache-settings_identifier'
      - name: origin_ip
        in: path
        description: Origin IP address to look up. IPv4 and IPv6 are supported.
        required: true
        schema:
          type: string
          example: 192.0.2.1
      responses:
        '200':
          description: Get origin cloud region mapping response.
          content:
            application/json:
              examples:
                found:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_single'
              schema:
                allOf:
                - $ref: '#/components/schemas/cache-settings_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/cache-settings_origin_cloud_region_single_result'
                  type: object
        4XX:
          description: Get origin cloud region mapping failure.
          content:
            application/json:
              examples:
                not_found:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_not_found'
              schema:
                $ref: '#/components/schemas/cache-settings_api-response-common-failure'
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Origin Cloud Regions
      x-cfDeprecation:
        description: Use the v2 endpoints under `/zones/{zone_id}/origin/cloud_regions` instead. The v2 API uses idempotent PUT semantics for create+update, provides a flat response shape, and is the supported path for Terraform and SDK clients. The v1 endpoints under `/zones/{zone_id}/cache/origin_cloud_regions` will be removed on 2026-10-01.
        display: true
        eol: '2026-10-01T00:00:00Z'
        id: opcr_v1_deprecation
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: deprecated
      x-fern-sdk-group-name: cache.origin-cloud-regions
      x-fern-sdk-method-name: get-v1
      x-forge-hidden: true
  /zones/{zone_id}/origin/cloud_regions:
    get:
      operationId: origin-cloud-regions-v2-list
      summary: List origin cloud region mappings
      description: Returns all IP-to-cloud-region mappings configured for the zone with pagination support. Each mapping tells Cloudflare which cloud vendor and region hosts the origin at that IP, enabling the edge to route via the nearest Tiered Cache upper-tier co-located with that cloud provider. Returns an empty array when no mappings exist.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cache-settings_identifier'
      - name: page
        in: query
        description: Page number of paginated results.
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        description: Number of items per page.
        schema:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: List origin cloud region mappings response.
          content:
            application/json:
              examples:
                empty:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_v2_list_empty'
                two_mappings:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_v2_list'
              schema:
                allOf:
                - $ref: '#/components/schemas/cache-settings_api-response-common'
                - properties:
                    result:
                      type: array
                      items:
                        $ref: '#/components/schemas/cache-settings_origin_cloud_region_v2_entry'
                    result_info:
                      $ref: '#/components/schemas/cache-settings_origin_cloud_region_v2_result_info'
                  required:
                  - result
                  - result_info
                  type: object
        4XX:
          description: List origin cloud region mappings failure.
          content:
            application/json:
              examples:
                invalid_pagination:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_v2_invalid_pagination'
              schema:
                $ref: '#/components/schemas/cache-settings_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Origin Cloud Regions
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: cache.origin-cloud-regions
      x-fern-sdk-method-name: list
      x-forge-hidden: true
  /zones/{zone_id}/origin/cloud_regions/batch:
    delete:
      operationId: origin-cloud-regions-v2-batch-delete
      summary: Batch delete origin cloud region mappings
      description: Removes up to 100 IP-to-cloud-region mappings in a single request. Each IP is validated independently — successfully deleted items are returned in the `succeeded` array and IPs that could not be found or are invalid are returned in the `failed` array.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cache-settings_identifier'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              batch_delete:
                $ref: '#/components/examples/cache-settings_origin_cloud_region_v2_batch_delete_request'
            schema:
              type: array
              items:
                description: Origin IP address to delete.
                example: 192.0.2.1
                type: string
              maxItems: 100
      responses:
        '200':
          description: Batch delete origin cloud region mappings successful.
          content:
            application/json:
              examples:
                batch_deleted:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_v2_batch_delete_response'
              schema:
                allOf:
                - $ref: '#/components/schemas/cache-settings_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/cache-settings_origin_cloud_region_v2_batch_result'
                  type: object
        4XX:
          description: Batch delete origin cloud region mappings failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cache-settings_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Origin Cloud Regions
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: cache.origin-cloud-regions
      x-fern-sdk-method-name: bulk-delete
      x-forge-hidden: true
      x-forge-require-confirmation: Are you sure you want to delete these Origin Cloud Region configurations?
    put:
      operationId: origin-cloud-regions-v2-batch-upsert
      summary: Batch create or replace origin cloud region mappings
      description: Upserts up to 100 IP-to-cloud-region mappings in a single request. Items in the request body are created or replaced; mappings not included in the request body are preserved unchanged (this is a merge operation, not a full collection replacement). Each item is validated independently — valid items are applied and invalid items are returned in the `failed` array. The vendor and region for every item are validated against the list from `GET /zones/{zone_id}/origin/cloud_regions/supported_regions`.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cache-settings_identifier'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              batch_put:
                $ref: '#/components/examples/cache-settings_origin_cloud_region_v2_batch_put_request'
            schema:
              type: array
              items:
                $ref: '#/components/schemas/cache-settings_origin_cloud_region_v2_request'
              maxItems: 100
      responses:
        '200':
          description: Batch create or replace origin cloud region mappings successful.
          content:
            application/json:
              examples:
                batch_upserted:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_v2_batch_put_response'
              schema:
                allOf:
                - $ref: '#/components/schemas/cache-settings_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/cache-settings_origin_cloud_region_v2_batch_result'
                  type: object
        4XX:
          description: Batch create or replace origin cloud region mappings failure.
          content:
            application/json:
              examples:
                too_many_mappings:
                  $ref: '#/components/examples/cache-settings_origin_cloud_region_v2_too_many_mappings'
              schema:
                $ref: '#/components/schemas/cache-settings_api-response-common-failure'
