openapi: 3.0.3
info:
  title: Cloudflare / Accounts Datasets API
  description: Needs description.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  version: 4.0.0
servers:
- url: https://api.cloudflare.com/client/v4
  description: Client API
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Datasets
  description: List available datasets and their fields for log exports.
paths:
  /zones/{zone_id}/logpush/datasets/{dataset_id}/fields:
    get:
      operationId: listDatasetFields
      summary: Cloudflare List Dataset Fields
      description: Returns the available fields for a specific log dataset.
      tags:
      - Datasets
      parameters:
      - $ref: '#/components/parameters/ZoneId'
      - name: dataset_id
        in: path
        required: true
        description: The dataset identifier such as http_requests, firewall_events, dns_logs, or spectrum_events.
        schema:
          type: string
        example: '500123'
      responses:
        '200':
          description: Dataset fields.
        '401':
          description: Unauthorized.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  parameters:
    ZoneId:
      name: zone_id
      in: path
      required: true
      description: The unique identifier of the zone.
      schema:
        type: string
