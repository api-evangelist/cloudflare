      x-fern-sdk-group-name: kv.keys
      x-fern-sdk-method-name: put
components:
  schemas:
    workers-kv_jurisdiction:
      description: Specify the jurisdiction to restrict the KV namespace to durably store data within. Can only be set at namespace creation time.
      type: string
      example: eu
      enum:
      - eu
      - fedramp
      - us
      x-auditable: true
    workers-kv_api-response-collection:
      type: object
      allOf:
      - $ref: '#/components/schemas/workers-kv_api-response-common'
      - properties:
          result_info:
            $ref: '#/components/schemas/workers-kv_result_info'
        type: object
    workers-kv_api-response-common:
      type: object
      properties:
        errors:
          $ref: '#/components/schemas/workers-kv_messages'
        messages:
          $ref: '#/components/schemas/workers-kv_messages'
        success:
          description: Whether the API call was successful.
          type: boolean
          example: true
          enum:
          - true
      required:
      - success
      - errors
      - messages
    workers-kv_bulk_write:
      type: array
      items:
        properties:
          base64:
            description: Indicates whether or not the server should base64 decode the value before storing it. Useful for writing values that wouldn't otherwise be valid JSON strings, such as images.
            type: boolean
            default: false
          expiration:
            $ref: '#/components/schemas/workers-kv_expiration'
          expiration_ttl:
            $ref: '#/components/schemas/workers-kv_expiration_ttl'
          key:
            $ref: '#/components/schemas/workers-kv_key_name_bulk'
          metadata:
            $ref: '#/components/schemas/workers-kv_list_metadata'
          value:
            description: A UTF-8 encoded string to be stored, up to 25 MiB in length.
            type: string
            example: Some string
            maxLength: 26214400
        required:
        - key
        - value
        type: object
      maxItems: 10000
    workers-kv_any:
      anyOf:
      - type: string
      - type: number
      - type: integer
      - type: boolean
      - additionalProperties: true
        type:
        - object
        - 'null'
      - items:
          $ref: '#/components/schemas/workers-kv_any'
        type: array
      x-stainless-override-schema:
        type: unknown
    workers-kv_bulk-get-result-with-metadata:
      type: object
      properties:
        values:
          description: Requested keys are paired with their values and metadata in an object.
          type: object
          example:
            key1:
              expiration: 1577836800
              metadata:
                someMetadataKey: someMetadataValue
              value: value1
            key2:
              metadata:
                anotherKey: anotherValue
              value: value2
          additionalProperties:
            properties:
              expiration:
                $ref: '#/components/schemas/workers-kv_expiration'
              metadata:
                allOf:
                - $ref: '#/components/schemas/workers-kv_any'
                - description: The metadata associated with the key.
              value:
                allOf:
                - $ref: '#/components/schemas/workers-kv_any'
                - description: The value associated with the key.
            required:
            - value
            - metadata
            type:
            - object
            - 'null'
    workers-kv_namespace:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/workers-kv_namespace_identifier'
        jurisdiction:
          $ref: '#/components/schemas/workers-kv_jurisdiction'
        mode:
          $ref: '#/components/schemas/workers-kv_namespace_mode'
        supports_url_encoding:
          description: True if keys written on the URL will be URL-decoded before storing. For example, if set to "true", a key written on the URL as "%3F" will be stored as "?".
          type: boolean
          example: true
          readOnly: true
          x-auditable: true
        title:
          $ref: '#/components/schemas/workers-kv_namespace_title'
      required:
      - id
      - title
    workers-kv_bulk-result:
      type: object
      properties:
        successful_key_count:
          description: Number of keys successfully written or deleted by the bulk operation.
          type: number
          example: 100
        unsuccessful_keys:
          description: Names of keys that failed to be written or deleted. Retry the operation for these keys.
          type: array
          items:
            type: string
    workers-kv_key_name_bulk:
      description: A key's name. The name may be at most 512 bytes. All printable, non-whitespace characters are valid.
      type: string
      example: My-Key
      maxLength: 512
    workers-kv_result_info:
      type: object
      properties:
        count:
          description: Total number of results for the requested service.
          type: number
          example: 1
        page:
          description: Current page within paginated list of results.
          type: number
          example: 1
        per_page:
          description: Number of results per page of results.
          type: number
          example: 20
        total_count:
          description: Total results available without any search parameters.
          type: number
          example: 2000
    workers-kv_create_namespace_body:
      type: object
      properties:
        jurisdiction:
          $ref: '#/components/schemas/workers-kv_jurisdiction'
        mode:
          description: The mode of the Workers KV namespace. Specify `instant` when creating a namespace to create a KV Instant namespace. Omit this field when creating a namespace to create a classic namespace. Currently, `instant` is the only supported explicit value.
          type: string
          example: instant
          enum:
          - instant
          x-fern-property-name: namespaceMode
        title:
          $ref: '#/components/schemas/workers-kv_namespace_title'
      required:
      - title
    workers-kv_cursor:
      description: Opaque pagination token returned in `result_info.cursor`. Pass it unchanged as the `cursor` query parameter to request the next page of keys.
      type: string
      example: 6Ck1la0VxJ0djhidm1MdX2FyDGxLKVeeHZZmORS_8XeSuhz9SjIJRaSa2lnsF01tQOHrfTGAP3R5X1Kv5iVUuMbNKhWNAXHOl6ePB0TUL8nw
      x-stainless-pagination-property:
        purpose: next_cursor_field
    workers-kv_value:
      description: A byte sequence to be stored, up to 25 MiB in length.
      example: Some Value
      anyOf:
      - type: string
      - format: binary
        type: string
    workers-kv_messages:
      type: array
      items:
        properties:
          code:
            type: integer
            minimum: 1000
          message:
            type: string
        required:
        - code
        - message
        type: object
      example: []
      uniqueItems: true
    workers-kv_list_metadata:
      allOf:
      - $ref: '#/components/schemas/workers-kv_any'
      - description: Arbitrary JSON that is associated with a key.
        example:
          someMetadataKey: someMetadataValue
    workers-kv_namespace_identifier:
      description: ID of the Workers KV namespace.
      type: string
      example: 0f2ac74b498b48028cb68387c421e279
      maxLength: 32
      readOnly: true
      x-auditable: true
    workers-kv_metadata:
      allOf:
      - $ref: '#/components/schemas/workers-kv_any'
      - description: Associates arbitrary JSON data with a key/value pair.
        example:
          someMetadataKey: someMetadataValue
    workers-kv_namespace_mode:
      description: The mode of the Workers KV namespace. Specify `instant` when creating a namespace to create a KV Instant namespace. Omit this field when creating a namespace to create a classic namespace. Currently, `instant` is the only supported explicit value.
      type: string
      example: instant
      enum:
      - instant
    workers-kv_expiration_ttl:
      description: Number of seconds until the key expires. Must be at least 60. Takes precedence over `expiration` when both are specified.
      type: number
      example: 300
      minimum: 60
    workers-kv_bulk_delete:
      type: array
      items:
        $ref: '#/components/schemas/workers-kv_key_name_bulk'
      maxItems: 10000
    workers-kv_namespace_title:
      description: Human-readable string name for a Workers KV namespace.
      type: string
      example: My Own Namespace
      maxLength: 512
      x-auditable: true
    workers-kv_key:
      description: A name for a value. A value stored under a given key may be retrieved via the same key.
      type: object
      properties:
        expiration:
          description: The time, measured in number of seconds since the UNIX epoch, at which the key will expire. This property is omitted for keys that will not expire.
          type: number
          example: 1577836800
        metadata:
          $ref: '#/components/schemas/workers-kv_list_metadata'
        name:
          $ref: '#/components/schemas/workers-kv_key_name'
      required:
      - name
    workers-kv_key_name:
      description: A key's name. The name may be at most 512 bytes. All printable, non-whitespace characters are valid. Use percent-encoding to define key names as part of a URL.
      type: string
      example: My-Key
      maxLength: 512
    workers-kv_api-response-common-failure:
      type: object
      properties:
        errors:
          example:
          - code: 7003
            message: No route for the URI
          allOf:
          - $ref: '#/components/schemas/workers-kv_messages'
          minLength: 1
        messages:
          example: []
          allOf:
          - $ref: '#/components/schemas/workers-kv_messages'
        result:
          type:
          - object
          - 'null'
          x-stainless-empty-object: true
        success:
          description: Whether the API call was successful.
          type: boolean
          example: false
          enum:
          - false
      required:
      - success
      - errors
      - messages
      - result
    workers-kv_bulk-get-result:
      type: object
      properties:
        values:
          description: Requested keys are paired with their values in an object.
          type: object
          example:
            key1: value1
            key2: value2
          additionalProperties:
            description: The value associated with the key.
            oneOf:
            - type: string
            - type: number
            - type: boolean
            - additionalProperties: true
              type: object
    workers-kv_api-response-common-no-result:
      allOf:
      - $ref: '#/components/schemas/workers-kv_api-response-common'
      - properties:
          result:
            type:
            - object
            - 'null'
            x-stainless-empty-object: true
        type: object
    workers-kv_cursor_result_info:
      type: object
      properties:
        count:
          description: Total results returned based on your list parameters.
          type: number
          example: 1
        cursor:
          $ref: '#/components/schemas/workers-kv_cursor'
    workers-kv_create_rename_namespace_body:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/workers-kv_namespace_title'
      required:
      - title
    workers-kv_identifier:
      description: ID of the Cloudflare account that owns the Workers KV namespaces.
      type: string
      example: 023e105f4ecef8ad9ca31a8372d0c353
      maxLength: 32
      readOnly: true
      x-auditable: true
    workers-kv_expiration:
      description: Expires the key at a certain time, measured in number of seconds since the UNIX epoch.
      type: number
      example: 1578435000
  securitySchemes:
    api_email:
      in: header
      name: X-Auth-Email
      type: apiKey
    api_key:
      in: header
      name: X-Auth-Key
      type: apiKey
