openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Workers KV Namespace API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Workers KV Namespace
paths:
  /accounts/{account_id}/storage/kv/namespaces:
    get:
      operationId: workers-kv-namespace-list-namespaces
      summary: List namespaces
      description: Lists Workers KV namespaces owned by the specified account. Use `page` and `per_page` to select a page of results, and `order` and `direction` to control sorting.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_identifier'
      - name: page
        in: query
        schema:
          description: Page number of paginated results.
          type: number
          default: 1
          minimum: 1
      - name: per_page
        in: query
        schema:
          description: Maximum number of results per page.
          type: number
          default: 20
          maximum: 1000
          minimum: 1
      - name: order
        in: query
        schema:
          description: Namespace field to sort by (`id` or `title`).
          type: string
          example: id
          enum:
          - id
          - title
      - name: direction
        in: query
        schema:
          description: Sort namespaces in ascending (`asc`) or descending (`desc`) order.
          type: string
          example: asc
          enum:
          - asc
          - desc
      responses:
        '200':
          description: List Namespaces response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers-kv_api-response-collection'
                - properties:
                    result:
                      type: array
                      items:
                        $ref: '#/components/schemas/workers-kv_namespace'
                  type: object
        4XX:
          description: List Namespaces response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers-kv_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Workers KV Namespace
      x-api-token-group:
      - Workers KV Storage Write
      - Workers KV Storage Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: kv.namespaces
      x-fern-sdk-method-name: list
    post:
      operationId: workers-kv-namespace-create-a-namespace
      summary: Create a namespace
      description: Creates a Workers KV namespace in the specified account with the given title. Returns `400` if the account already owns a namespace with that title; an existing namespace must be explicitly deleted before it can be replaced. An optional jurisdiction restricts where data is durably stored and can only be set at creation time.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workers-kv_create_namespace_body'
      responses:
        '200':
          description: Create a Namespace response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers-kv_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/workers-kv_namespace'
                  type: object
        4XX:
          description: Create a Namespace response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers-kv_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Workers KV Namespace
      x-api-token-group:
      - Workers KV Storage Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: kv.namespaces
      x-fern-sdk-method-name: create
  /accounts/{account_id}/storage/kv/namespaces/{namespace_id}:
    delete:
      operationId: workers-kv-namespace-remove-a-namespace
      summary: Delete a namespace
      description: Deletes the specified Workers KV namespace and its stored key-value pairs from the account.
      parameters:
      - name: namespace_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_namespace_identifier'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_identifier'
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        '200':
          description: Remove a Namespace response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers-kv_api-response-common-no-result'
        4XX:
          description: Remove a Namespace response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers-kv_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Workers KV Namespace
      x-api-token-group:
      - Workers KV Storage Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: kv.namespaces
      x-fern-sdk-method-name: delete
      x-forge-require-confirmation: This operation deletes the selected Workers KV namespace and all of its key-value pairs.
    get:
      operationId: workers-kv-namespace-get-a-namespace
      summary: Get a namespace
      description: Returns the Workers KV namespace for the specified account and namespace ID.
      parameters:
      - name: namespace_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_namespace_identifier'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_identifier'
      responses:
        '200':
          description: Get a Namespace response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers-kv_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/workers-kv_namespace'
                  type: object
        4XX:
          description: Get a Namespace response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers-kv_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Workers KV Namespace
      x-api-token-group:
      - Workers KV Storage Write
      - Workers KV Storage Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: kv.namespaces
      x-fern-sdk-method-name: get
    put:
      operationId: workers-kv-namespace-rename-a-namespace
      summary: Rename a namespace
      description: Changes the title of the specified Workers KV namespace and returns the updated namespace. The namespace ID and stored key-value pairs are unchanged.
      parameters:
      - name: namespace_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_namespace_identifier'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workers-kv_create_rename_namespace_body'
      responses:
        '200':
          description: Rename a Namespace response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers-kv_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/workers-kv_namespace'
                  required:
                  - result
                  type: object
        4XX:
          description: Rename a Namespace response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers-kv_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Workers KV Namespace
      x-api-token-group:
      - Workers KV Storage Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: kv.namespaces
      x-fern-sdk-method-name: update
  /accounts/{account_id}/storage/kv/namespaces/{namespace_id}/bulk:
    delete:
      operationId: workers-kv-namespace-delete-multiple-key-value-pairs-deprecated
      summary: Delete multiple key-value pairs
      description: Remove multiple KV pairs from the namespace. Body should be an array of up to 10,000 keys to be removed.
      parameters:
      - name: namespace_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_namespace_identifier'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workers-kv_bulk_delete'
      responses:
        '200':
          description: Delete multiple key-value pairs response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers-kv_api-response-common-no-result'
                - properties:
                    result:
                      $ref: '#/components/schemas/workers-kv_bulk-result'
                  type: object
        4XX:
          description: Delete multiple key-value pairs response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers-kv_api-response-common-no-result'
                - properties:
                    result:
                      $ref: '#/components/schemas/workers-kv_bulk-result'
                  type: object
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Workers KV Namespace
      x-api-token-group:
      - Workers KV Storage Write
      x-fern-availability: deprecated
      x-fern-sdk-group-name: kv.bulk-deprecated
      x-fern-sdk-method-name: delete
      x-forge-hidden: true
    put:
      operationId: workers-kv-namespace-write-multiple-key-value-pairs
      summary: Write multiple key-value pairs
      description: Writes up to 10,000 key-value pairs to the specified Workers KV namespace from a JSON array, with optional metadata and expiration settings for each pair. Existing values and expirations are overwritten. If neither `expiration` nor `expiration_ttl` is specified, the key-value pair will not expire. If both are set, `expiration_ttl` takes precedence. The entire request must be 100 megabytes or less. The result reports the number of successful writes and any keys that failed and should be retried.
      parameters:
      - name: namespace_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_namespace_identifier'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workers-kv_bulk_write'
      responses:
        '200':
          description: Write multiple key-value pairs response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers-kv_api-response-common-no-result'
                - properties:
                    result:
                      $ref: '#/components/schemas/workers-kv_bulk-result'
                  type: object
        4XX:
          description: Write multiple key-value pairs response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers-kv_api-response-common-no-result'
                - properties:
                    result:
                      $ref: '#/components/schemas/workers-kv_bulk-result'
                  type: object
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Workers KV Namespace
      x-api-token-group:
      - Workers KV Storage Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: kv.bulk
      x-fern-sdk-method-name: put
  /accounts/{account_id}/storage/kv/namespaces/{namespace_id}/bulk/delete:
    post:
      operationId: workers-kv-namespace-delete-multiple-key-value-pairs
      summary: Delete multiple key-value pairs
      description: Deletes up to 10,000 key-value pairs from the specified Workers KV namespace. Send a JSON array of the key names to delete. The result reports the number of successful deletions and any keys that failed and should be retried.
      parameters:
      - name: namespace_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_namespace_identifier'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workers-kv_bulk_delete'
      responses:
        '200':
          description: Delete multiple key-value pairs response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers-kv_api-response-common-no-result'
                - properties:
                    result:
                      $ref: '#/components/schemas/workers-kv_bulk-result'
                  type: object
        4XX:
          description: Delete multiple key-value pairs response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers-kv_api-response-common-no-result'
                - properties:
                    result:
                      $ref: '#/components/schemas/workers-kv_bulk-result'
                  type: object
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Workers KV Namespace
      x-api-token-group:
      - Workers KV Storage Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: kv.bulk
      x-fern-sdk-method-name: delete
      x-forge-require-confirmation: This operation deletes the specified keys and their values from the Workers KV namespace.
  /accounts/{account_id}/storage/kv/namespaces/{namespace_id}/bulk/get:
    post:
      operationId: workers-kv-namespace-get-multiple-key-value-pairs
      summary: Get multiple key-value pairs
      description: Retrieves the text-based values of up to 100 keys from the specified Workers KV namespace. The result maps each requested key to its value. Set `type` to `json` to parse JSON values instead of returning strings, and set `withMetadata` to `true` to include metadata with each value. Binary values are not supported by this operation.
      parameters:
      - name: namespace_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_namespace_identifier'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keys:
                  description: Array of keys to retrieve (maximum of 100).
                  type: array
                  items:
                    $ref: '#/components/schemas/workers-kv_key_name_bulk'
                  maxItems: 100
                type:
                  description: Return values as strings with `text`, or parse stored JSON values with `json`.
                  type: string
                  default: text
                  enum:
                  - text
                  - json
                withMetadata:
                  description: Whether to include metadata in the response.
                  type: boolean
                  default: false
              required:
              - keys
      responses:
        '200':
          description: Get multiple key-value pairs response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers-kv_api-response-common-no-result'
                - properties:
                    result:
                      oneOf:
                      - $ref: '#/components/schemas/workers-kv_bulk-get-result'
                      - $ref: '#/components/schemas/workers-kv_bulk-get-result-with-metadata'
                  type: object
        4XX:
          description: Get multiple key-value pairs response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers-kv_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Workers KV Namespace
      x-api-token-group:
      - Workers KV Storage Write
      - Workers KV Storage Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: kv.bulk
      x-fern-sdk-method-name: get
  /accounts/{account_id}/storage/kv/namespaces/{namespace_id}/keys:
    get:
      operationId: workers-kv-namespace-list-a-namespace'-s-keys
      summary: List keys in a namespace
      description: Lists key names in the specified Workers KV namespace, with expiration times and metadata when present. Use `prefix` to filter names and `cursor` to request the next page. Values are not included.
      parameters:
      - name: namespace_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_namespace_identifier'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_identifier'
      - name: limit
        in: query
        schema:
          description: Maximum number of keys to return in one response. Pass `result_info.cursor` from the response as `cursor` to request the next page.
          type: number
          default: 1000
          maximum: 1000
          minimum: 10
      - name: prefix
        in: query
        schema:
          description: Filters returned keys by a name prefix. Exact matches and any key names that begin with the prefix will be returned.
          type: string
          example: My-Prefix
      - name: cursor
        in: query
        schema:
          description: Opaque pagination token from `result_info.cursor` in the previous response. Pass it unchanged to request the next page of keys.
          type: string
          example: 6Ck1la0VxJ0djhidm1MdX2FyDGxLKVeeHZZmORS_8XeSuhz9SjIJRaSa2lnsF01tQOHrfTGAP3R5X1Kv5iVUuMbNKhWNAXHOl6ePB0TUL8nw
          x-stainless-pagination-property:
            purpose: next_cursor_param
      responses:
        '200':
          description: List a Namespace's Keys response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers-kv_api-response-common'
                - properties:
                    result:
                      type: array
                      items:
                        $ref: '#/components/schemas/workers-kv_key'
                      x-stainless-pagination-property:
                        purpose: items
                    result_info:
                      $ref: '#/components/schemas/workers-kv_cursor_result_info'
                  type: object
        4XX:
          description: List a Namespace's Keys response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers-kv_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Workers KV Namespace
      x-api-token-group:
      - Workers KV Storage Write
      - Workers KV Storage Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: kv.keys
      x-fern-sdk-method-name: list
  /accounts/{account_id}/storage/kv/namespaces/{namespace_id}/metadata/{key_name}:
    get:
      operationId: workers-kv-namespace-read-the-metadata-for-a-key
      summary: Get a key's metadata
      description: Returns the JSON metadata associated with the specified key in the Workers KV namespace, without retrieving its value. Use URL-encoding for special characters (for example, `:`, `!`, `%`) in the key name when constructing the request URL.
      parameters:
      - name: key_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_key_name'
      - name: namespace_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_namespace_identifier'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_identifier'
      responses:
        '200':
          description: Read the metadata for a key response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers-kv_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/workers-kv_list_metadata'
                  type: object
        4XX:
          description: Read the metadata for a key response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers-kv_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Workers KV Namespace
      x-api-token-group:
      - Workers KV Storage Write
      - Workers KV Storage Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: kv.metadata
      x-fern-sdk-method-name: get
  /accounts/{account_id}/storage/kv/namespaces/{namespace_id}/values/{key_name}:
    delete:
      operationId: workers-kv-namespace-delete-key-value-pair
      summary: Delete a key-value pair
      description: Deletes the specified key and its value from the Workers KV namespace. Use URL-encoding for special characters (for example, `:`, `!`, `%`) in the key name when constructing the request URL.
      parameters:
      - name: key_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_key_name'
      - name: namespace_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_namespace_identifier'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_identifier'
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        '200':
          description: Delete key-value pair response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers-kv_api-response-common-no-result'
        4XX:
          description: Delete key-value pair response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers-kv_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Workers KV Namespace
      x-api-token-group:
      - Workers KV Storage Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: kv.keys
      x-fern-sdk-method-name: delete
      x-forge-require-confirmation: This operation deletes the selected key-value pair from the Workers KV namespace.
    get:
      operationId: workers-kv-namespace-read-key-value-pair
      summary: Get a key's value
      description: Returns the value stored under the specified key in the Workers KV namespace as raw bytes. Use URL-encoding for special characters (for example, `:`, `!`, `%`) in the key name when constructing the request URL. If the key-value pair expires, the `expiration` response header contains its expiration time in seconds since the UNIX epoch.
      parameters:
      - name: key_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_key_name'
      - name: namespace_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_namespace_identifier'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_identifier'
      responses:
        '200':
          description: Read key-value pair response.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/workers-kv_value'
        4XX:
          description: Read key-value pair response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers-kv_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Workers KV Namespace
      x-api-token-group:
      - Workers KV Storage Write
      - Workers KV Storage Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: kv.keys
      x-fern-sdk-method-name: get
    put:
      operationId: workers-kv-namespace-write-key-value-pair-with-metadata
      summary: Write a key-value pair with optional metadata
      description: Writes a value under the specified key in the Workers KV namespace, creating the key-value pair or replacing its existing value, expiration, and metadata. Send the value as an `application/octet-stream` request body, or use `multipart/form-data` with a `value` part and an optional JSON `metadata` part. Use URL-encoding for special characters (for example, `:`, `!`, `%`) in the key name when constructing the request URL. If neither `expiration` nor `expiration_ttl` is specified, the key-value pair will not expire. If both are set, `expiration_ttl` takes precedence.
      parameters:
      - name: key_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_key_name'
      - name: namespace_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_namespace_identifier'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers-kv_identifier'
      - name: expiration
        in: query
        schema:
          $ref: '#/components/schemas/workers-kv_expiration'
      - name: expiration_ttl
        in: query
        schema:
          $ref: '#/components/schemas/workers-kv_expiration_ttl'
      requestBody:
        required: true
        content:
