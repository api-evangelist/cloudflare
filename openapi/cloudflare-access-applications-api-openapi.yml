openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Access applications API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Access applications
paths:
  /accounts/{account_id}/access/apps:
    get:
      operationId: access-applications-list-access-applications
      summary: List Access applications
      description: Lists all Access applications in an account.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      - name: name
        in: query
        schema:
          description: The name of the app.
          type: string
      - name: domain
        in: query
        schema:
          description: The domain of the app.
          type: string
      - name: aud
        in: query
        schema:
          description: The aud of the app.
          type: string
      - name: target_attributes
        in: query
        schema:
          description: Target Criteria attributes in key=value format.
          type: string
      - name: exact
        in: query
        schema:
          description: True for only exact string matches against passed name/domain query parameters.
          type: boolean
      - name: search
        in: query
        schema:
          description: Search for apps by other listed query parameters.
          type: string
      - $ref: '#/components/parameters/access_page'
      - $ref: '#/components/parameters/access_per_page'
      responses:
        '200':
          description: List Access applications response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_response_collection-8'
        4XX:
          description: List Access applications response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access applications
      x-api-token-group:
      - 'Access: Apps and Policies Revoke'
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Read'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.access.applications
      x-fern-sdk-method-name: list
      x-stability: beta
    post:
      operationId: access-applications-add-an-application
      summary: Add an Access application
      description: Adds a new application to Access.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/access_app_request'
      responses:
        '201':
          description: Add an Access application response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/access_single_response-9'
                - properties:
                    result:
                      $ref: '#/components/schemas/access_app_response'
                  type: object
        4XX:
          description: Add an Access application response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access applications
      x-api-token-group:
      - 'Access: Apps and Policies Write'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.access.applications
      x-fern-sdk-method-name: create
      x-stability: beta
  /accounts/{account_id}/access/apps/{app_id}:
    delete:
      operationId: access-applications-delete-an-access-application
      summary: Delete an Access application
      description: Deletes an application from Access.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_app_id'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      responses:
        '202':
          description: Delete an Access application response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_id_response'
        4XX:
          description: Delete an Access application response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access applications
      x-api-token-group:
      - 'Access: Apps and Policies Write'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.access.applications
      x-fern-sdk-method-name: delete
    get:
      operationId: access-applications-get-an-access-application
      summary: Get an Access application
      description: Fetches information about an Access application.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_app_id'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      responses:
        '200':
          description: Get an Access application response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_single_response-9'
        4XX:
          description: Get an Access application response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access applications
      x-api-token-group:
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Read'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.access.applications
      x-fern-sdk-method-name: get
      x-stability: beta
    put:
      operationId: access-applications-update-an-access-application
      summary: Update an Access application
      description: Updates an Access application.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_app_id'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/access_app_request'
      responses:
        '200':
          description: Update an Access application response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/access_single_response-9'
                - properties:
                    result:
                      $ref: '#/components/schemas/access_app_response'
                  type: object
        4XX:
          description: Update an Access application response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access applications
      x-api-token-group:
      - 'Access: Apps and Policies Write'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.access.applications
      x-fern-sdk-method-name: update
      x-stability: beta
  /accounts/{account_id}/access/apps/{app_id}/revoke_tokens:
    post:
      operationId: access-applications-revoke-service-tokens
      summary: Revoke application tokens
      description: Revokes all tokens issued for an application.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_app_id'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      responses:
        '202':
          description: Revoke application tokens response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_empty_response-2'
        4XX:
          description: Revoke application tokens response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access applications
      x-api-token-group:
      - 'Access: Apps and Policies Revoke'
      - 'Access: Apps and Policies Write'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.access.applications
      x-fern-sdk-method-name: revoke-tokens
      x-forge-require-confirmation: This operation invalidates every service token for the app.
  /accounts/{account_id}/access/apps/{app_id}/settings:
    patch:
      operationId: access-applications-patch-update-access-application-settings
      summary: Update Access application settings
      description: Updates Access application settings.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_app_id'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/access_app_settings_request'
      responses:
        '202':
          description: Update Access application settings response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/access_single_response_update'
        4XX:
          description: Update Access application settings response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access applications
      x-fern-availability: generally-available
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.access.applications.settings
      x-fern-sdk-method-name: edit
    put:
      operationId: access-applications-put-update-access-application-settings
      summary: Update Access application settings
      description: Updates Access application settings.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_app_id'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/access_app_settings_request'
      responses:
        '202':
          description: Update Access application settings response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/access_single_response_update'
        4XX:
          description: Update Access application settings response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access applications
      x-api-token-group:
      - 'Access: Apps and Policies Write'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.access.applications.settings
      x-fern-sdk-method-name: update
  /accounts/{account_id}/access/apps/{app_id}/user_policy_checks:
    get:
      operationId: access-applications-test-access-policies
      summary: Test Access policies
      description: Tests if a specific user has permission to access an application.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_app_id'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      responses:
        '200':
          description: Test Access policies response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_policy_check_response'
        4XX:
          description: Test Access policies response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access applications
      x-api-token-group:
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Read'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.access.applications.user-policy-checks
      x-fern-sdk-method-name: list
components:
  schemas:
    access_skip_app_launcher_login_page:
      description: Determines when to skip the App Launcher landing page.
      type: boolean
      example: true
      default: false
    access_proxy_endpoint_props:
      allOf:
      - $ref: '#/components/schemas/access_feature_app_props'
      - properties:
          domain:
            description: 'The proxy endpoint domain in the format: 10 alphanumeric characters followed by .proxy.cloudflare-gateway.com'
            type: string
            example: abcd123456.proxy.cloudflare-gateway.com
            pattern: ^[A-Za-z0-9]{10}\.proxy\.cloudflare-gateway\.com$
          name:
            type: string
            example: Gateway Proxy
            default: Gateway Proxy
          type:
            allOf:
            - $ref: '#/components/schemas/access_type'
            - example: proxy_endpoint
              type: string
        type: object
    access_app_launcher_visible:
      description: Displays the application in the App Launcher.
      type: boolean
      example: true
      default: true
    access_domain_rule:
      description: Match an entire email domain.
      type: object
      properties:
        email_domain:
          type: object
          properties:
            domain:
              description: The email domain to match.
              type: string
              example: example.com
          required:
          - domain
      required:
      - email_domain
      title: Email domain
    access_any_valid_service_token_rule:
      description: Matches any valid Access Service Token
      type: object
      properties:
        any_valid_service_token:
          description: An empty object which matches on all service tokens.
          type: object
          example: {}
          x-stainless-empty-object: true
      required:
      - any_valid_service_token
      title: Any Valid Service Token
    access_country_rule:
      description: Matches a specific country
      type: object
      properties:
        geo:
          type: object
          properties:
            country_code:
              description: The country code that should be matched.
              type: string
              example: US
          required:
          - country_code
      required:
      - geo
      title: Country
    access_cloudflare_account_member_rule:
      description: 'Matches users who are members of a specific Cloudflare account.

        Requires a Cloudflare identity provider.'
      type: object
      properties:
        cloudflare_account_member:
          type: object
          properties:
            account_id:
              $ref: '#/components/schemas/access_identifier'
      required:
      - cloudflare_account_member
      title: Cloudflare Account Member
    access_bookmark_props:
      type: object
      properties:
        app_launcher_visible:
          $ref: '#/components/schemas/access_app_launcher_visible'
        domain:
          description: The URL or domain of the bookmark.
          type: string
          example: https://mybookmark.com
        logo_url:
          $ref: '#/components/schemas/access_logo_url'
        name:
          $ref: '#/components/schemas/access_name-8'
        tags:
          $ref: '#/components/schemas/access_tags'
        type:
          allOf:
          - $ref: '#/components/schemas/access_type'
          - example: bookmark
            type: string
      title: Bookmark application
    access_scim_config_authentication_http_basic:
      description: Attributes for configuring HTTP Basic authentication scheme for SCIM provisioning to an application.
      type: object
      properties:
        password:
          description: Password used to authenticate with the remote SCIM service.
          type: string
          x-sensitive: true
        scheme:
          description: The authentication scheme to use when making SCIM requests to this application.
          type: string
          enum:
          - httpbasic
        user:
          description: User name used to authenticate with the remote SCIM service.
          type: string
      required:
      - scheme
      - user
      - password
      title: HTTP Basic
    access_app_launcher_props:
      allOf:
      - $ref: '#/components/schemas/access_feature_app_props'
      - properties:
          app_launcher_logo_url:
            $ref: '#/components/schemas/access_app_launcher_logo_url'
          bg_color:
            $ref: '#/components/schemas/access_bg_color'
          domain:
            type: string
            example: authdomain.cloudflareaccess.com
            readOnly: true
          footer_links:
            $ref: '#/components/schemas/access_footer_links'
          header_bg_color:
            $ref: '#/components/schemas/access_header_bg_color'
          landing_page_design:
            $ref: '#/components/schemas/access_landing_page_design'
          name:
            type: string
            example: App Launcher
            default: App Launcher
            readOnly: true
          skip_app_launcher_login_page:
            $ref: '#/components/schemas/access_skip_app_launcher_login_page'
          type:
            allOf:
            - $ref: '#/components/schemas/access_type'
            - example: app_launcher
              type: string
        type: object
    access_auto_redirect_to_identity-2:
      description: When set to `true`, users skip the identity provider selection step during login. You must specify only one identity provider in allowed_idps.
      type: boolean
      default: false
    access_app_response:
      anyOf:
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props'
        - $ref: '#/components/schemas/access_end_user_props'
        title: End User Application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props'
        - $ref: '#/components/schemas/access_self_hosted_props'
        - $ref: '#/components/schemas/access_app_resp_embedded_policies'
        title: Self Hosted Application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props'
        - $ref: '#/components/schemas/access_saas_props'
        - $ref: '#/components/schemas/access_app_resp_embedded_policies'
        title: SaaS Application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props'
        - $ref: '#/components/schemas/access_ssh_props'
        - $ref: '#/components/schemas/access_app_resp_embedded_policies'
        title: Browser SSH Application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props'
        - $ref: '#/components/schemas/access_vnc_props'
        - $ref: '#/components/schemas/access_app_resp_embedded_policies'
        title: Browser VNC Application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props'
        - $ref: '#/components/schemas/access_app_launcher_props'
        - $ref: '#/components/schemas/access_app_resp_embedded_policies'
        title: App Launcher Application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props'
        - $ref: '#/components/schemas/access_warp_props'
        - $ref: '#/components/schemas/access_app_resp_embedded_policies'
        title: Device Enrollment Permissions Application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props'
        - $ref: '#/components/schemas/access_biso_props'
        - $ref: '#/components/schemas/access_app_resp_embedded_policies'
        title: Browser Isolation Permissions Application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props'
        - $ref: '#/components/schemas/access_proxy_endpoint_props'
        - $ref: '#/components/schemas/access_app_resp_embedded_policies'
        title: Gateway Identity Proxy Endpoint Application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props'
        - $ref: '#/components/schemas/access_bookmark_props'
        - $ref: '#/components/schemas/access_app_resp_embedded_policies'
        title: Bookmark application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props'
        - $ref: '#/components/schemas/access_infra_props'
        - $ref: '#/components/schemas/access_infra_app_resp_embedded_policies'
        title: Infrastructure application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props'
        - $ref: '#/components/schemas/access_rdp_props'
        - $ref: '#/components/schemas/access_app_resp_embedded_policies'
        title: Browser RDP Application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props'
        - $ref: '#/components/schemas/access_mcp_props'
        - $ref: '#/components/schemas/access_app_resp_embedded_policies'
        title: MCP Server Application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props'
        - $ref: '#/components/schemas/access_mcp_portal_props'
        - $ref: '#/components/schemas/access_app_resp_embedded_policies'
        title: MCP Server Portal Application
        type: object
    access_connection_rules_rdp:
      description: The RDP-specific rules that define clipboard behavior for RDP connections.
      type: object
      properties:
        allowed_clipboard_local_to_remote_formats:
          $ref: '#/components/schemas/access_allowed_clipboard_local_to_remote_formats'
        allowed_clipboard_remote_to_local_formats:
          $ref: '#/components/schemas/access_allowed_clipboard_remote_to_local_formats'
      title: RDP Connection Rules
    access_target_rule_attributes:
      description: Hostname selector map for include, require, or exclude rules. This is distinct from the deprecated top-level target_attributes field and only supports the hostname key.
      type: object
      properties:
        hostname:
          type: array
          items:
            minLength: 1
            type: string
          maxItems: 5000
          minItems: 1
      example:
        hostname:
        - web-*
      additionalProperties: false
      maxProperties: 1
      minProperties: 1
    access_access_group_rule:
      description: Matches an Access group.
      type: object
      properties:
        group:
          type: object
          properties:
            id:
              description: The ID of a previously created Access group.
              type: string
              example: aa0a4aab-672b-4bdb-bc33-a59f1130a11f
          required:
          - id
      required:
      - group
      title: Access groups
    access_allowed_methods:
      description: Allowed HTTP request methods.
      type: array
      items:
        enum:
        - GET
        - POST
        - HEAD
        - PUT
        - DELETE
        - CONNECT
        - OPTIONS
        - TRACE
        - PATCH
        type: string
      example:
      - GET
    access_okta_group_rule:
      description: 'Matches an Okta group.

        Requires an Okta identity provider.'
      type: object
      properties:
        okta:
          type: object
          properties:
            identity_provider_id:
              description: The ID of your Okta identity provider.
              type: string
              example: ea85612a-29c8-46c2-bacb-669d65136971
            name:
              description: The name of the Okta group.
              type: string
              example: devs
          required:
          - name
          - identity_provider_id
      required:
      - okta
      title: Okta group
    access_protocol_self_hosted_app:
      description: The communication protocol your application secures.
      type: string
      example: RDP
      enum:
      - RDP
      x-auditable: true
    access_mcp_portal_props:
      type: object
      properties:
        allow_authenticate_via_warp:
          $ref: '#/components/schemas/access_allow_authenticate_via_warp-2'
        allowed_idps:
          $ref: '#/components/schemas/access_allowed_idps'
        auto_redirect_to_identity:
          $ref: '#/components/schemas/access_auto_redirect_to_identity-2'
        custom_deny_message:
          $ref: '#/components/schemas/access_custom_deny_message'
        custom_deny_url:
          $ref: '#/components/schemas/access_custom_deny_url'
        custom_non_identity_deny_url:
          $ref: '#/components/schemas/access_custom_non_identity_deny_url'
        custom_pages:
          $ref: '#/components/schemas/access_custom_pages-2'
        destinations:
          $ref: '#/components/schemas/access_destinations'
        domain:
          $ref: '#/components/schemas/access_domain'
        http_only_cookie_attribute:
          $ref: '#/components/schemas/access_http_only_cookie_attribute'
        logo_url:
          $ref: '#/components/schemas/access_logo_url'
        name:
          $ref: '#/components/schemas/access_name-8'
        oauth_configuration:
          $ref: '#/components/schemas/access_oauth_configuration'
        options_preflight_bypass:
