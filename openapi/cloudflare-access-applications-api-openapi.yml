          type: object
          allOf:
          - $ref: '#/components/schemas/access_target_attributes'
      oneOf:
      - not:
          anyOf:
          - required:
            - include
            type: object
          - required:
            - require
            type: object
          - required:
            - exclude
            type: object
          type: object
        required:
        - target_attributes
        type: object
      - not:
          required:
          - target_attributes
          type: object
        required:
        - include
        type: object
      required:
