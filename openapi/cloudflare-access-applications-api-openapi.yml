    access_destinations:
      description: 'List of destinations secured by Access. This supersedes `self_hosted_domains` to allow for more flexibility in defining different types of domains. If `destinations` are provided, then `self_hosted_domains` will be ignored.

        '
      type: array
      items:
        oneOf:
        - description: 'A public hostname that Access will secure. Public destinations support sub-domain and path. Wildcard ''*'' can be used in the definition.

            '
          properties:
            overrides:
              $ref: '#/components/schemas/access_destination_overrides'
            type:
              type: string
              enum:
              - public
            uri:
              description: 'The URI of the destination. Public destinations'' URIs can include a domain and path with [wildcards](https://developers.cloudflare.com/cloudflare-one/policies/access/app-paths/).

                '
              type: string
          title: Public destination
          type: object
        - properties:
            cidr:
              description: The CIDR range of the destination. Single IPs will be computed as /32.
              type: string
            hostname:
              description: The hostname of the destination. Matches a valid SNI served by an HTTPS origin.
              type: string
            l4_protocol:
              description: The L4 protocol of the destination. When omitted, both UDP and TCP traffic will match.
              type: string
              enum:
              - tcp
              - udp
            port_range:
              description: 'The port range of the destination. Can be a single port or a range of ports. When omitted, all ports will match.

                '
              type: string
            type:
              type: string
              enum:
              - private
            vnet_id:
              description: The VNET ID to match the destination. When omitted, all VNETs will match.
              type: string
          title: Private destination
          type: object
        - description: 'A MCP server id configured in ai-controls. Access will secure the MCP server if accessed through a MCP portal.

            '
          properties:
            mcp_server_id:
              description: The MCP server id configured in ai-controls.
              type: string
            type:
              type: string
              enum:
              - via_mcp_server_portal
          title: Via MCP Server Portal destination
          type: object
        - description: 'A specific Cloudflare Worker that Access will secure. All requests routed to the specified Worker, including its preview deployments, will be protected. The `preview_worker` and `public` destination types takes precedence, so you can create separate applications to override the policies for the Worker''s previews or specific paths.

            '
          properties:
            overrides:
              $ref: '#/components/schemas/access_destination_overrides'
            type:
              type: string
              enum:
              - worker
            worker_id:
              description: The ID of the Cloudflare Worker to protect with Access.
              type: string
          required:
          - type
          - worker_id
          title: Worker destination
          type: object
        - description: 'A specific Cloudflare Worker whose preview deployments Access will secure. Only requests routed to the preview deployments of the specified Worker will be protected. The `public` destination type takes precedence, so you can create separate applications to override the policies for specific paths.

            '
          properties:
            overrides:
              $ref: '#/components/schemas/access_destination_overrides'
            type:
              type: string
              enum:
              - preview_worker
            worker_id:
              description: The ID of the Cloudflare Worker whose preview deployments to protect with Access.
              type: string
          required:
          - type
          - worker_id
          title: Preview Worker destination
          type: object
        - description: 'Protects all Cloudflare Workers on the account with Access, including their preview deployments. At most one destination of this type can exist per account. The `worker`, `preview_worker`, `all_preview_workers`, and `public` destination types take precedence, so you can create separate applications to override the policies for specific Workers, their previews, or specific paths.

            '
          properties:
            overrides:
              $ref: '#/components/schemas/access_destination_overrides'
            type:
              type: string
              enum:
              - all_workers
          required:
          - type
          title: All Workers destination
          type: object
        - description: 'Protects the preview deployments of all Cloudflare Workers on the account with Access. At most one destination of this type can exist per account. The `worker`, `preview_worker`, and `public` destination types take precedence, so you can create separate applications to override the policies for specific Workers, their previews, or specific paths.

            '
          properties:
            overrides:
              $ref: '#/components/schemas/access_destination_overrides'
            type:
              type: string
              enum:
              - all_preview_workers
          required:
          - type
          title: All Preview Workers destination
          type: object
      example:
      - type: public
        uri: test.example.com/admin
      - type: public
        uri: test.anotherexample.com/staff
      - cidr: 10.5.0.0/24
        port_range: 80-90
        type: private
      - cidr: 10.5.0.3/32
        port_range: '80'
        type: private
      - hostname: private-sni.example.com
        type: private
      - mcp_server_id: mcp-server-1
        type: via_mcp_server_portal
      - overrides:
        - behavior: public
          path_pattern: /health/*
        type: worker
        worker_id: 617f1d0431a98306ff61e336d79fce86
      - type: preview_worker
        worker_id: 617f1d0431a98306ff61e336d79fce86
      - type: all_workers
      - type: all_preview_workers
      default: []
