        skip_interstitial:
          $ref: '#/components/schemas/access_skip_interstitial'
    access_custom_pages-2:
      description: The custom pages that will be displayed when applicable for this application
      type: array
      items:
        description: The custom pages selected for application.
        example: 699d98642c564d2e855e9661899b7252
        type: string
    access_oauth_configuration:
      description: '**Beta:** Optional configuration for managing an OAuth authorization flow controlled by Access. When set, Access will act as the OAuth authorization server for this application. Only compatible with OAuth clients that support [RFC 8707](https://datatracker.ietf.org/doc/html/rfc8707) (Resource Indicators for OAuth 2.0). This feature is currently in beta.

        '
      type: object
      properties:
        dynamic_client_registration:
          description: Settings for OAuth dynamic client registration.
          type: object
          properties:
            allow_any_on_localhost:
              description: Allows any client with redirect URIs on localhost.
              type: boolean
            allow_any_on_loopback:
              description: Allows any client with redirect URIs on 127.0.0.1.
              type: boolean
            allowed_uris:
              description: 'The URIs that are allowed as redirect URIs for dynamically registered clients. HTTP and HTTPS paths may end in `/*` to match all sub-paths. Custom-scheme URIs must be explicitly configured and match exactly.

                '
              type: array
              items:
                type: string
              example:
              - https://example.com/callback
              - com.example.app:/oauth/callback
            enabled:
              description: Whether dynamic client registration is enabled.
              type: boolean
        enabled:
          description: 'Whether the OAuth configuration is enabled for this application. When set to `false`, Access will not handle OAuth for this application. Defaults to `true` if omitted.

            '
          type: boolean
          default: true
        grant:
          description: Settings for OAuth grant behavior.
          type: object
          properties:
            access_token_lifetime:
              description: The lifetime of the access token. Must be in the format `300ms` or `2h45m`. Valid time units are ns, us (or µs), ms, s, m, h.
              type: string
              example: 5m
            session_duration:
              description: The duration of the OAuth session. Must be in the format `300ms` or `2h45m`. Valid time units are ns, us (or µs), ms, s, m, h.
              type: string
              example: 24h
