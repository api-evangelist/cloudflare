                                x-auditable: true
                              provider:
                                type: string
                                enum:
                                - fastly
                                x-auditable: true
                              type:
                                type: string
                                enum:
                                - provider
                              version:
                                type: number
                            required:
                            - enabled
                            - type
                            - provider
                            - version
                            type: object
                          - properties:
                              enabled:
                                type: boolean
                                x-auditable: true
                              name:
                                type: string
                                x-auditable: true
                              transformations:
                                type: array
                                items:
                                  properties:
                                    key:
                                      type: string
                                    value:
                                      type: string
                                  required:
