                                  type: object
                              type:
                                type: string
                                enum:
                                - query-param
                            required:
                            - type
                            - params
                            type: object
                        type:
                          type: string
                          enum:
                          - custom
                      required:
                      - enabled
                      - type
                      - name
                      - trigger
                      - transformations
                      type: object
                  maxItems: 10
                version:
                  type: number
                  enum:
                  - 2
                  x-fern-property-name: config-version
              required:
              - version
              - flows
      responses:
        '200':
          description: Update flows config
          content:
