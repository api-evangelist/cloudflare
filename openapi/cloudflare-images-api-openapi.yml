                                      enum:
                                      - path
                                  required:
                                  - type
                                  - paths
                                  type: object
                                - properties:
                                    extensions:
                                      type: array
                                      items:
                                        type: string
                                    type:
                                      type: string
                                      enum:
                                      - extension
                                  required:
