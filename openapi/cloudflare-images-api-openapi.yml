openapi: 3.2.0
info:
  title: Cloudflare Images API
  version: '1.0'
  description: 'Operations tagged Images across 2 of this provider''s published API definitions: cloudflare-images-openapi.yml, cloudflare-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.cloudflare.com/client/v4
  description: Cloudflare API v4 Production Server
tags:
- name: Images
  description: Upload, list, update, and delete image assets.
paths:
  /accounts/{account_id}/images/v1:
    get:
      operationId: listImages
      summary: Cloudflare List Images
      description: Returns a paginated list of all images in the account.
      tags:
      - Images
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: page
        in: query
        description: Page number for pagination.
        schema:
          type: integer
        example: 10
      - name: per_page
        in: query
        description: Number of images per page.
        schema:
          type: integer
        example: 10
      responses:
        '200':
          description: List of images.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'
              examples:
                Listimages200Example:
                  summary: Default listImages 200 response
                  x-microcks-default: true
                  value:
                    result:
                      images:
                      - {}
                    success: true
        '401':
          description: Unauthorized.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - bearerAuth: []
    post:
      operationId: uploadImage
      summary: Cloudflare Upload Image
      description: Upload an image via file upload or URL. Supports JPEG, PNG, GIF, WebP, and SVG formats.
      tags:
      - Images
      parameters:
      - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The image file to upload.
                url:
                  type: string
                  format: uri
                  description: URL of an image to fetch and store.
                id:
                  type: string
                  description: Custom identifier for the image.
                metadata:
                  type: object
                  description: User-defined metadata.
                requireSignedURLs:
                  type: boolean
                  description: Whether signed URLs are required.
            examples:
              UploadimageRequestExample:
                summary: Default uploadImage request
                x-microcks-default: true
                value:
                  file: example_value
                  url: https://www.example.com
                  id: abc123
                  metadata: example_value
                  requireSignedURLs: https://www.example.com
      responses:
        '200':
          description: Image uploaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
              examples:
                Uploadimage200Example:
                  summary: Default uploadImage 200 response
                  x-microcks-default: true
                  value:
                    result:
                      id: abc123
                      filename: example_value
                      metadata: example_value
                      uploaded: '2026-01-15T10:30:00Z'
                      requireSignedURLs: https://www.example.com
                      variants:
                      - {}
                    success: true
                    errors:
                    - {}
                    messages:
                    - {}
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - bearerAuth: []
    servers:
    - url: https://api.cloudflare.com/client/v4
      description: Cloudflare API v4 Production Server
  /accounts/{account_id}/images/v1/{image_id}:
    get:
      operationId: getImage
      summary: Cloudflare Get Image Details
      description: Retrieve details of a specific image.
      tags:
      - Images
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ImageId'
      responses:
        '200':
          description: Image details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
              examples:
                Getimage200Example:
                  summary: Default getImage 200 response
                  x-microcks-default: true
                  value:
                    result:
                      id: abc123
                      filename: example_value
                      metadata: example_value
                      uploaded: '2026-01-15T10:30:00Z'
                      requireSignedURLs: https://www.example.com
                      variants:
                      - {}
                    success: true
                    errors:
                    - {}
                    messages:
                    - {}
        '401':
          description: Unauthorized.
        '404':
          description: Image not found.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - bearerAuth: []
    patch:
      operationId: updateImage
      summary: Cloudflare Update Image
      description: Update image metadata and settings.
      tags:
      - Images
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ImageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  type: object
                requireSignedURLs:
                  type: boolean
            examples:
              UpdateimageRequestExample:
                summary: Default updateImage request
                x-microcks-default: true
                value:
                  metadata: example_value
                  requireSignedURLs: https://www.example.com
      responses:
        '200':
          description: Image updated.
        '401':
          description: Unauthorized.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - bearerAuth: []
    delete:
      operationId: deleteImage
      summary: Cloudflare Delete Image
      description: Delete an image and all its variants.
      tags:
      - Images
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ImageId'
      responses:
        '200':
          description: Image deleted.
        '401':
          description: Unauthorized.
        '404':
          description: Image not found.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - bearerAuth: []
    servers:
    - url: https://api.cloudflare.com/client/v4
      description: Cloudflare API v4 Production Server
  /zones/{zone_id}/images/v1/flows:
    get:
      operationId: get_FlowsGet
      summary: Get transformation flows
      description: Get the current transformation flows configuration for a zone.
      parameters:
      - name: zone_id
        in: path
        description: Zone identifier.
        required: true
        schema:
          description: Zone identifier.
          type: string
          x-auditable: true
      responses:
        '200':
          description: Get flows config
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      etag:
                        type: string
                      flows:
                        type: array
                        items:
                          oneOf:
                          - properties:
                              enabled:
                                type: boolean
                                x-auditable: true
                              provider:
                                type: string
                                enum:
                                - fastly
                                x-auditable: true
                              type:
                                type: string
                                enum:
                                - provider
                              version:
                                type: number
                            required:
                            - enabled
                            - type
                            - provider
                            - version
                            type: object
                          - properties:
                              enabled:
                                type: boolean
                                x-auditable: true
                              name:
                                type: string
                                x-auditable: true
                              transformations:
                                type: array
                                items:
                                  properties:
                                    key:
                                      type: string
                                    value:
                                      type: string
                                  required:
                                  - key
                                  - value
                                  type: object
                              trigger:
                                oneOf:
                                - properties:
                                    triggers:
                                      type: array
                                      items:
                                        type: object
                                      minItems: 1
                                    type:
                                      type: string
                                      enum:
                                      - and
                                  required:
                                  - type
                                  - triggers
                                  type: object
                                - properties:
                                    triggers:
                                      type: array
                                      items:
                                        type: object
                                      minItems: 1
                                    type:
                                      type: string
                                      enum:
                                      - or
                                  required:
                                  - type
                                  - triggers
                                  type: object
                                - properties:
                                    paths:
                                      type: array
                                      items:
                                        type: string
                                    type:
                                      type: string
                                      enum:
                                      - path
                                  required:
                                  - type
                                  - paths
                                  type: object
                                - properties:
                                    extensions:
                                      type: array
                                      items:
                                        type: string
                                    type:
                                      type: string
                                      enum:
                                      - extension
                                  required:
                                  - type
                                  - extensions
                                  type: object
                                - properties:
                                    params:
                                      type: array
                                      items:
                                        properties:
                                          key:
                                            type: string
                                          value:
                                            type: string
                                        required:
                                        - key
                                        - value
                                        type: object
                                    type:
                                      type: string
                                      enum:
                                      - query-param
                                  required:
                                  - type
                                  - params
                                  type: object
                              type:
                                type: string
                                enum:
                                - custom
                            required:
                            - enabled
                            - type
                            - name
                            - trigger
                            - transformations
                            type: object
                        maxItems: 10
                      version:
                        type: number
                        enum:
                        - 2
                        x-fern-property-name: config-version
                    required:
                    - version
                    - flows
                  success:
                    type: boolean
                required:
                - success
                - result
        4XX:
          description: Get flows config failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                  success:
                    type: boolean
                required:
                - success
                - error
      security:
      - api_token: []
      tags:
      - Images
      x-fern-availability: generally-available
      x-fern-sdk-group-name: images.flows
      x-fern-sdk-method-name: get
      x-stability: stable
    put:
      operationId: put_FlowsUpdate
      summary: Update transformation flows
      description: Replace the entire transformation flows configuration for a zone.
      parameters:
      - name: zone_id
        in: path
        description: Zone identifier.
        required: true
        schema:
          description: Zone identifier.
          type: string
          x-auditable: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                etag:
                  type: string
                flows:
                  type: array
                  items:
                    oneOf:
                    - properties:
                        enabled:
                          type: boolean
                          x-auditable: true
                        provider:
                          type: string
                          enum:
                          - fastly
                          x-auditable: true
                        type:
                          type: string
                          enum:
                          - provider
                        version:
                          type: number
                      required:
                      - enabled
                      - type
                      - provider
                      - version
                      type: object
                    - properties:
