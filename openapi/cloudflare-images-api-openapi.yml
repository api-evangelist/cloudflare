                                  - value
                                  type: object
                              trigger:
                                oneOf:
                                - properties:
                                    triggers:
                                      type: array
                                      items:
                                        type: object
                                      minItems: 1
                                    type:
                                      type: string
                                      enum:
                                      - and
                                  required:
                                  - type
                                  - triggers
                                  type: object
                                - properties:
                                    triggers:
                                      type: array
                                      items:
                                        type: object
                                      minItems: 1
                                    type:
                                      type: string
                                      enum:
                                      - or
                                  required:
