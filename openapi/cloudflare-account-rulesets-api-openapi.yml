        value:
          description: A value to rewrite the URI query to.
          type: string
          example: foo=bar
          title: Query Value
      maxProperties: 1
      minProperties: 1
      title: URI Query
    rulesets_RewriteRule:
      allOf:
      - $ref: '#/components/schemas/rulesets_Rule'
      - properties:
          action:
            type: string
            enum:
            - rewrite
          action_parameters:
            type: object
            minProperties: 1
            properties:
              headers:
                $ref: '#/components/schemas/rulesets_RewriteHeaders'
              uri:
                $ref: '#/components/schemas/rulesets_RewriteUri'
          description:
            type: string
            example: Rewrite properties of the request or response.
        title: Rewrite Rule
        type: object
    rulesets_Messages:
      description: A list of warning messages.
      type: array
      items:
        $ref: '#/components/schemas/rulesets_Message'
      title: Messages
      uniqueItems: true
    rulesets_SetCacheSettingsCustomCacheKeyHeader:
      description: Which headers to include in the cache key.
      type: object
      properties:
        check_presence:
          description: A list of headers to check for the presence of. The presence of these headers is included in the cache key.
          type: array
          items:
            description: The name of the header to check for the presence of.
            example: my-header
            minLength: 1
            title: Header
            type: string
          minItems: 1
          title: Check Presence
          uniqueItems: true
        contains:
          description: A mapping of header names to a list of values. If a header is present in the request and contains any of the values provided, its value is included in the cache key.
          type: object
          example:
            my-header:
            - my-header-value-1
            - my-header-value-2
          additionalProperties:
            description: A list of values to match the header against.
            items:
              description: The header value to match against.
              example: my-header-value
              minLength: 1
              title: Header Value
              type: string
            minItems: 1
            title: Header Values
            type: array
            uniqueItems: true
          minProperties: 1
          title: Contains
        exclude_origin:
          description: Whether to exclude the origin header in the cache key.
          type: boolean
          example: true
          title: Exclude Origin
        include:
          description: A list of headers to include in the cache key.
          type: array
          items:
            description: The name of the header to include.
            example: my-header
            minLength: 1
            title: Header
            type: string
          minItems: 1
          title: Include
          uniqueItems: true
      title: Headers
    rulesets_PerPage:
      description: The number of rulesets to return per page.
      type: integer
      example: 3
      maximum: 50
      minimum: 1
      title: Per Page
    rulesets_ExecuteSensitivityLevel:
      type: string
      example: default
      enum:
      - default
      - medium
      - low
      - eoff
      title: Sensitivity Level
    rulesets_SetCacheSettingsServeStale:
      description: When to serve stale content from cache.
      type: object
      properties:
        disable_stale_while_updating:
          description: Whether Cloudflare should disable serving stale content while getting the latest content from the origin.
          type: boolean
          example: true
          title: Disable Stale While Updating
      title: Serve Stale
    rulesets_SetCacheControlDirectiveWithValue:
      description: A cache-control directive configuration that accepts a duration value in seconds.
      oneOf:
      - description: Set the directive with a duration value in seconds.
        properties:
          cloudflare_only:
            $ref: '#/components/schemas/rulesets_SetCacheControlCloudflareOnly'
          operation:
            allOf:
            - $ref: '#/components/schemas/rulesets_SetCacheControlOperation'
            - enum:
              - set
              type: string
          value:
            description: The duration value in seconds for the directive.
            type: integer
            example: 3600
            minimum: 0
            title: Value
        required:
        - operation
        - value
        title: Set Directive
        type: object
      - description: Remove the directive.
        properties:
          cloudflare_only:
            $ref: '#/components/schemas/rulesets_SetCacheControlCloudflareOnly'
          operation:
            allOf:
            - $ref: '#/components/schemas/rulesets_SetCacheControlOperation'
            - enum:
              - remove
              type: string
        required:
        - operation
        title: Remove Directive
        type: object
      title: Cache Control Directive With Duration Seconds Value
    rulesets_RouteHostHeader:
      description: A value to rewrite the HTTP host header to.
      type: string
      example: static.example.com
      minLength: 1
      title: Host Header
    rulesets_SetCacheTagsOperation:
      description: The operation to perform on the cache tags.
      type: string
      example: add
      enum:
      - add
      - remove
      - set
      title: Operation
    rulesets_SetCacheSettingsCacheReserve:
      description: Settings to determine whether the request's response from origin is eligible for Cache Reserve (requires a Cache Reserve add-on plan).
      type: object
      properties:
        eligible:
          description: Whether Cache Reserve is enabled. If this is true and a request meets eligibility criteria, Cloudflare will write the resource to Cache Reserve.
          type: boolean
          example: true
          title: Eligible
        minimum_file_size:
          description: The minimum file size eligible for storage in Cache Reserve.
          type: integer
          example: 1024
          minimum: 0
          title: Minimum File Size
      required:
      - eligible
      title: Cache Reserve
    rulesets_RewriteHeaderOperation:
      description: The operation to perform on the header.
      type: string
      title: Operation
    rulesets_SetCacheControlDirectiveWithQualifiers:
      description: A cache-control directive configuration that accepts optional qualifiers (header names).
      oneOf:
      - description: Set the directive with optional qualifiers.
        properties:
          cloudflare_only:
            $ref: '#/components/schemas/rulesets_SetCacheControlCloudflareOnly'
          operation:
            allOf:
            - $ref: '#/components/schemas/rulesets_SetCacheControlOperation'
            - enum:
              - set
              type: string
          qualifiers:
            description: Optional list of header names to qualify the directive (e.g., for "private" or "no-cache" directives).
            type: array
            items:
              description: A header name to qualify the directive.
              example: X-Custom-Header
              minLength: 1
              title: Qualifier
              type: string
            title: Qualifiers
            uniqueItems: true
        required:
        - operation
        title: Set Directive
        type: object
      - description: Remove the directive.
        properties:
          cloudflare_only:
            $ref: '#/components/schemas/rulesets_SetCacheControlCloudflareOnly'
          operation:
            allOf:
            - $ref: '#/components/schemas/rulesets_SetCacheControlOperation'
            - enum:
              - remove
              type: string
        required:
        - operation
        title: Remove Directive
        type: object
      title: Cache Control Directive With Optional Qualifiers
    rulesets_ExecuteOverrides:
      description: A set of overrides to apply to the target ruleset.
      type: object
      properties:
        action:
          allOf:
          - $ref: '#/components/schemas/rulesets_RuleAction'
          - description: An action to override all rules with. This option has lower precedence than rule and category overrides.
            example: log
            type: string
        categories:
          $ref: '#/components/schemas/rulesets_ExecuteCategoryOverrides'
        enabled:
          allOf:
          - $ref: '#/components/schemas/rulesets_RuleEnabled'
          - description: Whether to enable execution of all rules. This option has lower precedence than rule and category overrides.
            type: boolean
        rules:
          $ref: '#/components/schemas/rulesets_ExecuteRuleOverrides'
        sensitivity_level:
          allOf:
          - $ref: '#/components/schemas/rulesets_ExecuteSensitivityLevel'
          - description: A sensitivity level to set for all rules. This option has lower precedence than rule and category overrides and is only applicable for DDoS phases.
            type: string
      minProperties: 1
      title: Overrides
    rulesets_SetCacheSettingsEdgeTTL:
      description: How long the Cloudflare edge network should cache the response.
      type: object
      properties:
        default:
          description: The edge TTL (in seconds) if you choose the "override_origin" mode.
          type: integer
          example: 60
          minimum: 0
          title: Default TTL
        mode:
          description: The edge TTL mode.
          type: string
          example: override_origin
          enum:
          - respect_origin
          - bypass_by_default
          - override_origin
          title: TTL Mode
        status_code_ttl:
          $ref: '#/components/schemas/rulesets_SetCacheSettingsStatusCodeTTL'
      required:
      - mode
      title: Edge TTL
    rulesets_BlockRule:
      allOf:
      - $ref: '#/components/schemas/rulesets_Rule'
      - properties:
          action:
            type: string
            enum:
            - block
          action_parameters:
            type: object
            properties:
              response:
                description: The response to show when the block is applied.
                type: object
                properties:
                  content:
                    description: The content to return.
                    example: "{\n  \"success\": false,\n  \"error\": \"you have been blocked\"\n}"
                    minLength: 1
                    title: Content
                    type: string
                  content_type:
                    description: The type of the content to return.
                    type: string
                    example: application/json
                    minLength: 1
                    title: Content Type
                  status_code:
                    description: The status code to return.
                    type: integer
                    maximum: 499
                    minimum: 400
                    title: Status Code
                required:
                - status_code
                - content
                - content_type
                title: Response
          description:
            type: string
            example: Block the request.
        title: Block Rule
        type: object
    rulesets_CompressResponseRule:
      allOf:
      - $ref: '#/components/schemas/rulesets_Rule'
      - properties:
          action:
            type: string
            enum:
            - compress_response
          action_parameters:
            type: object
            properties:
              algorithms:
                description: Custom order for compression algorithms.
                type: array
                items:
                  description: Compression algorithm to enable.
                  properties:
                    name:
                      description: Name of the compression algorithm to enable.
                      type: string
                      example: none
                      enum:
                      - none
                      - auto
                      - default
                      - gzip
                      - brotli
                      - zstd
                      title: Algorithm Name
                  title: Algorithm
                  type: object
                minItems: 1
                title: Algorithms
                uniqueItems: true
            required:
            - algorithms
          description:
            type: string
            example: Modify the compression algorithm used in the response.
        title: Response Compression Rule
        type: object
    rulesets_ExecuteRule:
      allOf:
      - $ref: '#/components/schemas/rulesets_Rule'
      - properties:
          action:
            type: string
            enum:
            - execute
          action_parameters:
            type: object
            properties:
              id:
                allOf:
                - $ref: '#/components/schemas/rulesets_RulesetId'
                - description: The ID of the ruleset to execute.
                  example: 4814384a9e5d4991b9815dcfc25d2f1f
                  type: string
              matched_data:
                $ref: '#/components/schemas/rulesets_ExecuteMatchedData'
              overrides:
                $ref: '#/components/schemas/rulesets_ExecuteOverrides'
            required:
            - id
          description:
            type: string
            example: Execute another ruleset.
        title: Execute Rule
        type: object
    rulesets_ExecuteRuleOverrides:
      description: A list of rule-level overrides. This option has the highest precedence.
      type: array
      items:
        description: A rule-level override.
        minProperties: 2
        properties:
          action:
            allOf:
            - $ref: '#/components/schemas/rulesets_RuleAction'
            - description: The action to override the rule with.
              example: log
              type: string
          enabled:
            allOf:
            - $ref: '#/components/schemas/rulesets_RuleEnabled'
            - description: Whether to enable execution of the rule.
              type: boolean
          id:
            allOf:
            - $ref: '#/components/schemas/rulesets_RuleId'
            - description: The ID of the rule to override.
              example: 8ac8bc2a661e475d940980f9317f28e1
              type: string
          score_threshold:
            description: The score threshold to use for the rule.
            type: integer
            title: Score Threshold
          sensitivity_level:
            allOf:
            - $ref: '#/components/schemas/rulesets_ExecuteSensitivityLevel'
            - description: The sensitivity level to use for the rule. This option is only applicable for DDoS phases.
              type: string
        required:
        - id
        title: Rule Override
        type: object
      minItems: 1
      title: Rule Overrides
      uniqueItems: true
    rulesets_RuleAction:
      description: The action to perform when the rule matches.
      type: string
      pattern: ^[a-z_]+$
      title: Action
    rulesets_SetCacheSettingsCustomCacheKeyHost:
      description: How to use the host in the cache key.
      type: object
      properties:
        resolved:
          description: Whether to use the resolved host in the cache key.
          type: boolean
          example: true
          title: Use Resolved Host
      title: Host
    rulesets_SetConfigRule:
      allOf:
      - $ref: '#/components/schemas/rulesets_Rule'
      - properties:
          action:
            type: string
            enum:
            - set_config
          action_parameters:
            type: object
            minProperties: 1
            properties:
              automatic_https_rewrites:
                description: Whether to enable Automatic HTTPS Rewrites.
                type: boolean
                example: true
                title: Automatic HTTPS Rewrites
              autominify:
                $ref: '#/components/schemas/rulesets_SetConfigAutominify'
              bic:
                description: Whether to enable Browser Integrity Check (BIC).
                type: boolean
                example: true
                title: Browser Integrity Check
              content_converter:
                description: Whether to enable content conversion (e.g., HTML to Markdown).
                type: boolean
                example: true
                title: Content Converter
              disable_apps:
                description: Whether to disable Cloudflare Apps.
                type: boolean
                enum:
                - true
                deprecated: true
                title: Disable Apps
                x-stainless-deprecation-message: Cloudflare Apps are deprected.
              disable_pay_per_crawl:
                description: Whether to disable Pay Per Crawl.
                type: boolean
                enum:
                - true
                title: Disable Pay Per Crawl
              disable_rum:
                description: Whether to disable Real User Monitoring (RUM).
                type: boolean
                enum:
                - true
                title: Disable RUM
              disable_zaraz:
                description: Whether to disable Zaraz.
                type: boolean
                enum:
                - true
                title: Disable Zaraz
              email_obfuscation:
                description: Whether to enable Email Obfuscation.
                type: boolean
                example: true
                title: Email Obfuscation
              fonts:
                description: Whether to enable Cloudflare Fonts.
                type: boolean
                example: true
                title: Cloudflare Fonts
              hotlink_protection:
                description: Whether to enable Hotlink Protection.
                type: boolean
                example: true
                title: Hotlink Protection
              mirage:
                description: Whether to enable Mirage.
                type: boolean
                example: true
                deprecated: true
                title: Mirage
                x-stainless-deprecation-message: Mirage is deprecated. More information at https://developers.cloudflare.com/speed/optimization/images/mirage/.
              opportunistic_encryption:
                description: Whether to enable Opportunistic Encryption.
                type: boolean
                example: true
                title: Opportunistic Encryption
              polish:
                description: The Polish level to configure.
                type: string
                example: 'off'
                enum:
                - 'off'
                - lossless
                - lossy
                - webp
                title: Polish
              redirects_for_ai_training:
                description: Whether to redirect verified AI training crawlers to canonical URLs found in the HTML response.
                type: boolean
                example: true
                title: Redirects for AI Training
              request_body_buffering:
                description: The request body buffering mode.
                type: string
                example: standard
                enum:
                - none
                - standard
                - full
                title: Request body buffering
              response_body_buffering:
                description: The response body buffering mode.
                type: string
                example: standard
                enum:
                - none
                - standard
                title: Response body buffering
              rocket_loader:
                description: Whether to enable Rocket Loader.
                type: boolean
                example: true
                title: Rocket Loader
              security_level:
                description: The Security Level to configure.
                type: string
                example: 'off'
                enum:
                - 'off'
                - essentially_off
                - low
                - medium
                - high
                - under_attack
                title: Security Level
              server_side_excludes:
                description: Whether to enable Server-Side Excludes.
                type: boolean
                example: true
                title: Server-Side Excludes
              ssl:
                description: The SSL level to configure.
                type: string
                example: 'off'
                enum:
                - 'off'
                - flexible
                - full
                - strict
                - origin_pull
                title: SSL
              sxg:
                description: Whether to enable Signed Exchanges (SXG).
                type: boolean
                example: true
                deprecated: true
                title: Signed Exchanges
                x-stainless-deprecation-message: Signed Exchanges (SXG) is deprecated.
              webmcp_enabled:
                description: Whether to serve the WebMCP bridge script, which exposes the page's tools to browser AI agents.
                type: boolean
                example: true
                title: WebMCP
              webmcp_packs:
                description: Bundled WebMCP tool packs to activate for matching requests. An empty array disables all packs. Omitting this parameter leaves the pack selection unchanged. Does not enable the WebMCP bridge itself. Non-empty selections require the WebMCP Configuration Rules entitlement.
                type: array
                items:
                  description: A tool-pack identifier understood by the WebMCP interceptor.
                  maxLength: 128
                  minLength: 1
                  pattern: ^[A-Za-z0-9._:/@-]+$
                  type: string
                example:
                - c2pa
                - mcp-server-client
                maxItems: 100
                title: WebMCP Tool Packs
                uniqueItems: true
          description:
            type: string
            example: Configure settings for the request and response.
        title: Set Configuration Rule
        type: object
    rulesets_SetCacheSettingsCustomCacheKeyCookie:
      description: Which cookies to include in the cache key.
      type: object
      properties:
        check_presence:
          description: A list of cookies to check for the presence of. The presence of these cookies is included in the cache key.
          type: array
          items:
            description: The name of the cookie to check for the presence of.
            example: myCookie
            minLength: 1
            title: Cookie Name
            type: string
          minItems: 1
          title: Check Presence
          uniqueItems: true
        include:
          description: A list of cookies to include in the cache key.
          type: array
          items:
            description: The name of the cookie to include.
            example: myCookie
            minLength: 1
            title: Cookie Name
            type: string
          minItems: 1
          title: Include
          uniqueItems: true
      title: Cookies
    rulesets_RulePosition:
      description: An object configuring where the rule will be placed.
      type: object
      title: Position
    rulesets_SetCacheSettingsRespectStrongEtags:
      description: Whether Cloudflare should respect strong ETag (entity tag) headers. If false, Cloudflare converts strong ETag headers to weak ETag headers.
      type: boolean
      example: true
      title: Respect Strong ETags
    rulesets_LogCustomFieldCookieFields:
      description: The cookie fields to log.
      type: array
      items:
        description: The cookie field to log.
        properties:
          name:
            description: The name of the cookie.
            type: string
            example: myCookie
            minLength: 1
            title: Cookie Name
        required:
        - name
        title: Cookie Field
        type: object
      minItems: 1
      title: Cookie Fields
    rulesets_ExecuteCategoryOverrides:
      description: A list of category-level overrides. This option has the second-highest precedence after rule-level overrides.
      type: array
      items:
        description: A category-level override.
        minProperties: 2
        properties:
          action:
            allOf:
            - $ref: '#/components/schemas/rulesets_RuleAction'
            - description: The action to override rules in the category with.
              example: log
              type: string
          category:
            allOf:
            - $ref: '#/components/schemas/rulesets_RuleCategory'
            - description: The name of the category to override.
              type: string
          enabled:
            allOf:
            - $ref: '#/components/schemas/rulesets_RuleEnabled'
            - description: Whether to enable execution of rules in the category.
              type: boolean
          sensitivity_level:
            allOf:
            - $ref: '#/components/schemas/rulesets_ExecuteSensitivityLevel'
            - description: The sensitivity level to use for rules in the category. This option is only applicable for DDoS phases.
              type: string
        required:
        - category
        title: Category Override
        type: object
      minItems: 1
      title: Category Overrides
      uniqueItems: true
    rulesets_Errors:
      description: A list of error messages.
      type: array
      items:
        $ref: '#/components/schemas/rulesets_Message'
      title: Errors
      uniqueItems: true
    rulesets_RewriteUri:
      allOf:
      - anyOf:
        - description: A URI path rewrite.
          properties:
            path:
              $ref: '#/components/schemas/rulesets_RewriteUriPath'
          required:
          - path
          title: URI Path
          type: object
        - description: A URI query rewrite.
          properties:
            query:
              $ref: '#/components/schemas/rulesets_RewriteUriQuery'
          required:
          - query
          title: URI Query
          type: object
      - properties:
          origin:
            description: Whether to propagate the rewritten URI to origin.
            type: boolean
            example: false
            readOnly: true
            title: Origin
        type: object
    rulesets_RuleExposedCredentialCheck:
      description: Configuration for exposed credential checking.
      type: object
      properties:
        password_expression:
          description: An expression that selects the password used in the credentials check.
          type: string
          example: url_decode(http.request.body.form[\"password\"][0])
          minLength: 1
          title: Password Expression
        username_expression:
          description: An expression that selects the user ID used in the credentials check.
          type: string
          example: url_decode(http.request.body.form[\"username\"][0])
          minLength: 1
          title: Username Expression
      required:
      - username_expression
      - password_expression
      title: Exposed Credential Check
  requestBodies:
    rulesets_UpdateEntrypointRuleset:
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/rulesets_Ruleset'
            - properties:
                rules:
                  $ref: '#/components/schemas/rulesets_RequestRules'
              type: object
      required: true
    rulesets_CreateRuleset:
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/rulesets_Ruleset'
            - properties:
                kind:
                  $ref: '#/components/schemas/rulesets_RulesetKind'
                phase:
                  $ref: '#/components/schemas/rulesets_RulesetPhase'
                rules:
                  $ref: '#/components/schemas/rulesets_RequestRules'
              type: object
            required:
            - name
            - kind
            - phase
      required: true
    rulesets_UpdateRuleset:
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/rulesets_Ruleset'
            - properties:
                kind:
                  $ref: '#/components/schemas/rulesets_RulesetKind'
                phase:
                  $ref: '#/components/schemas/rulesets_RulesetPhase'
                rules:
                  $ref: '#/components/schemas/rulesets_RequestRules'
              type: object
      required: true
    rulesets_Rule:
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/rulesets_RequestRule'
            - properties:
                position:
                  oneOf:
                  - allOf:
                    - $ref: '#/components/schemas/rulesets_RulePosition'
                    - properties:
                        before:
                          description: The ID of another rule to place the rule before. An empty value causes the rule to be placed at the top.
                          type: string
                          example: da5e8e506c8e7877fe06cdf4c41add54
                          pattern: ^[0-9a-f]{32}$
                          title: Before
                      title: Before Position
                      type: object
                  - allOf:
                    - $ref: '#/components/schemas/rulesets_RulePosition'
                    - properties:
                        after:
                          description: The ID of another rule to place the rule after. An empty value causes the rule to be placed at the bottom.
                          type: string
                          example: 5bccdbb2a5142cd25cad8591255bd209
                          pattern: ^[0-9a-f]{32}$
                          title: After
                      title: After Position
                      type: object
                  - allOf:
                    - $ref: '#/components/schemas/rulesets_RulePosition'
                    - properties:
                        index:
                          description: An index at which to place the rule, where index 1 is the first rule.
                          type: integer
                          example: 1
                          minimum: 1
                          title: Index
                      title: Index Position
                      type: object
              type: object
      required: true
  responses:
    rulesets_Ruleset:
      description: A ruleset response.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/rulesets_Response'
            - properties:
                errors:
                  type: array
                  items: {}
                  enum:
                  - []
                result:
                  allOf:
                  - $ref: '#/components/schemas/rulesets_Ruleset'
                  - properties:
                      kind:
                        $ref: '#/components/schemas/rulesets_RulesetKind'
                      name:
                        type: string
                      phase:
                        $ref: '#/components/schemas/rulesets_RulesetPhase'
                      rules:
                        $ref: '#/components/schemas/rulesets_ResponseRules'
                    required:
                    - name
                    - kind
                    - phase
                    - rules
                    type: object
                success:
                  type: boolean
                  enum:
                  - true
              type: object
    rulesets_Rulesets:
      description: A rulesets response.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/rulesets_Response'
            - properties:
                errors:
                  type: array
                  items: {}
                  enum:
                  - []
                result:
                  description: A list of rulesets. The returned information will not include the rules in each ruleset.
                  type: array
                  items:
                    allOf:
                    - $ref: '#/components/schemas/rulesets_Ruleset'
                    - properties:
                        kind:
                          $ref: '#/components/schemas/rulesets_RulesetKind'
                        name:
                          type: string
                        phase:
                          $ref: '#/components/schemas/rulesets_RulesetPhase'
                      required:
                      - name
                      - kind
                      - phase
                      type: object
                  title: Rulesets
                result_info:
                  $ref: '#/components/schemas/rulesets_ResultInfo'
                success:
                  type: boolean
                  enum:
                  - true
              type: object
    rulesets_RulesetOrDryRun:
      description: A ruleset response, or a successful dry-run validation response.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/rulesets_Response'
            - properties:
                errors:
                  type: array
                  items: {}
                  enum:
                  - []
                result:
                  oneOf:
                  - allOf:
                    - $ref: '#/components/schemas/rulesets_Ruleset'
                    - properties:
                        kind:
                          $ref: '#/components/schemas/rulesets_RulesetKind'
                        name:
                          type: string
                        phase:
                          $ref: '#/components/schemas/rulesets_RulesetPhase'
                        rules:
                          $ref: '#/components/schemas/rulesets_ResponseRules'
                      required:
                      - name
                      - kind
                      - phase
                      - rules
                      type: object
                  - description: Returned when dry_run is true.
                    enum:
                    - null
                    type:
                    - object
                    - 'null'
                success:
                  type: boolean
                  enum:
                  - true
              type: object
    rulesets_Failure:
      description: A failure response.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/rulesets_Response'
            - properties:
                result:
                  type:
                  - object
                  - 'null'
                  enum:
                  - null
                success:
                  type: boolean
                  enum:
                  - false
              type: object
    rulesets_Empty:
      description: An empty response.
  parameters:
    rulesets_DryRun:
      description: 'Validates the request without persisting changes when set to `true`. Responses that normally return 200 return `result: null`; endpoints that normally return 204 continue to return 204.'
