        schema:
          $ref: '#/components/schemas/dns-records_identifier'
      - $ref: '#/components/parameters/dns-records_include_shadow_metadata'
      responses:
        '200':
          description: DNS Record Details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dns-records_dns_response_single'
        4XX:
          description: DNS Record Details response failure
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/dns-records_dns_response_single'
                - $ref: '#/components/schemas/dns-records_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DNS Records for a Zone
      x-api-token-group:
      - DNS Read
      - DNS Write
      x-cfPermissionsRequired:
        enum:
        - '#dns_records:read'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: dns.records
      x-fern-sdk-method-name: get
    patch:
      operationId: dns-records-for-a-zone-patch-dns-record
      summary: Update DNS Record
      description: 'Update an existing DNS record.


        Notes:

        - A/AAAA records cannot exist on the same name as CNAME records.

        - NS records cannot exist on the same name as any other record type.

        - Domain names are always represented in Punycode, even if Unicode

        characters were used when creating the record.'
      parameters:
      - name: dns_record_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/dns-records_identifier'
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/dns-records_identifier'
      - $ref: '#/components/parameters/dns-records_include_shadow_metadata'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dns-records_dns-record-patch'
      responses:
        '200':
          description: Patch DNS Record response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dns-records_dns_response_single'
        4XX:
          description: Patch DNS Record response failure
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/dns-records_dns_response_single'
                - $ref: '#/components/schemas/dns-records_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DNS Records for a Zone
      x-api-token-group:
      - DNS Write
      x-cfPermissionsRequired:
        enum:
        - '#dns_records:edit'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: dns.records
      x-fern-sdk-method-name: edit
    put:
      operationId: dns-records-for-a-zone-update-dns-record
      summary: Overwrite DNS Record
      description: 'Overwrite an existing DNS record.


        Notes:

        - A/AAAA records cannot exist on the same name as CNAME records.

        - NS records cannot exist on the same name as any other record type.

        - Domain names are always represented in Punycode, even if Unicode

        characters were used when creating the record.'
      parameters:
      - name: dns_record_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/dns-records_identifier'
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/dns-records_identifier'
      - $ref: '#/components/parameters/dns-records_include_shadow_metadata'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dns-records_dns-record-post'
      responses:
        '200':
          description: Update DNS Record response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dns-records_dns_response_single'
        4XX:
          description: Update DNS Record response failure
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/dns-records_dns_response_single'
                - $ref: '#/components/schemas/dns-records_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DNS Records for a Zone
      x-api-token-group:
      - DNS Write
      x-cfPermissionsRequired:
        enum:
