      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: dns.records
      x-fern-sdk-method-name: update
components:
  schemas:
    dns-records_page:
      description: Page number of paginated results.
      type: number
      default: 1
      minimum: 1
    dns-records_NSRecord:
      type: object
      allOf:
      - $ref: '#/components/schemas/dns-records_dns-record-shared-fields'
      - properties:
          content:
            description: A valid name server host name.
            example: ns1.example.com
            type: string
            x-auditable: true
          type:
            description: Record type.
            type: string
            example: NS
            enum:
            - NS
            x-auditable: true
        type: object
      title: NS Record
    dns-records_type:
      description: Record type.
      type: string
      example: A
      enum:
      - A
      - AAAA
      - CAA
      - CERT
      - CNAME
      - DNSKEY
      - DS
      - HTTPS
      - LOC
      - MX
      - NAPTR
      - NS
      - OPENPGPKEY
      - PTR
      - SMIMEA
      - SRV
      - SSHFP
      - SVCB
      - TLSA
      - TXT
      - URI
      x-auditable: true
    dns-records_SVCBRecord:
      type: object
      allOf:
      - $ref: '#/components/schemas/dns-records_dns-record-shared-fields'
      - properties:
          content:
            description: Formatted SVCB content. See 'data' to set SVCB properties.
            readOnly: true
            type: string
            x-auditable: true
          data:
            description: Components of a SVCB record.
            type: object
            properties:
              priority:
                description: Priority.
                type: number
                example: 1
                maximum: 65535
                minimum: 0
                x-auditable: true
              target:
                description: Target.
                type: string
                example: .
                x-auditable: true
              value:
                description: Value.
                type: string
                example: alpn="h3,h2" ipv4hint="127.0.0.1" ipv6hint="::1"
                x-auditable: true
          type:
            description: Record type.
            type: string
            example: SVCB
            enum:
            - SVCB
            x-auditable: true
        type: object
      title: SVCB Record
    dns-records_api-response-single:
      type: object
      allOf:
      - $ref: '#/components/schemas/dns-records_api-response-common'
    dns-records_priority:
      description: Required for MX and URI records; ignored for other record types (but may still be returned by the API). Records with lower priorities are preferred. This field is to be deprecated in favor of the priority field within the data map.
      type: number
      example: 10
      maximum: 65535
      minimum: 0
      x-auditable: true
    dns-records_ttl:
      description: Time To Live (TTL) of the DNS record in seconds. Setting to 1 means 'automatic'. Value must be between 60 and 86400, with the minimum reduced to 30 for Enterprise zones.
      type: number
      example: 3600
      default: 1
      anyOf:
      - example: 3600
        maximum: 86400
        minimum: 30
        type: number
      - enum:
        - 1
        type: number
      x-auditable: true
    dns-records_order:
      description: Field to order DNS records by.
      type: string
      default: type
      enum:
      - type
      - name
      - content
      - ttl
      - proxied
    dns-records_tag_match:
      description: 'Whether to match all tag search requirements or at least one (any). If set to `all`, acts like a logical AND between tag filters. If set to `any`, acts like a logical OR instead. Note that the regular `match` parameter is still used to combine the resulting condition with other filters that aren''t related to tags.

        '
      type: string
      example: any
      default: all
      enum:
      - any
      - all
    dns-records_dns-response-review-scan-object:
      type: object
      properties:
        accepts:
          type: array
          items:
            $ref: '#/components/schemas/dns-records_dns-record-response'
        rejects:
          type: array
          items:
            $ref: '#/components/schemas/dns-records_identifier'
    dns-records_proxied:
      description: Whether the record is receiving the performance and security benefits of Cloudflare.
      type: boolean
      example: true
      default: false
      x-auditable: true
    dns-records_URIRecord:
      type: object
      allOf:
      - $ref: '#/components/schemas/dns-records_dns-record-shared-fields'
      - properties:
          content:
            description: Formatted URI content. See 'data' to set URI properties.
            readOnly: true
            type: string
            x-auditable: true
          data:
            description: Components of a URI record.
            type: object
            properties:
              target:
                description: The record content.
                type: string
                example: http://example.com/example.html
                x-auditable: true
              weight:
                description: The record weight.
                type: number
                example: 20
                maximum: 65535
                minimum: 0
                x-auditable: true
          priority:
            $ref: '#/components/schemas/dns-records_priority'
          type:
            description: Record type.
            type: string
            example: URI
            enum:
            - URI
            x-auditable: true
        type: object
      title: URI Record
    dns-records_CAARecord:
      type: object
      allOf:
      - $ref: '#/components/schemas/dns-records_dns-record-shared-fields'
      - properties:
          content:
            description: Formatted CAA content. See 'data' to set CAA properties.
            readOnly: true
            type: string
            x-auditable: true
          data:
            description: Components of a CAA record.
            type: object
            properties:
              flags:
                description: Flags for the CAA record.
                type: number
                example: 1
                maximum: 255
                minimum: 0
                x-auditable: true
              tag:
                description: 'Name of the property controlled by this record (e.g.: issue, issuewild, iodef).'
                type: string
                example: issue
                x-auditable: true
              value:
                description: Value of the record. This field's semantics depend on the chosen tag.
                type: string
                x-auditable: true
          type:
            description: Record type.
            type: string
            example: CAA
            enum:
            - CAA
            x-auditable: true
        type: object
      title: CAA Record
    dns-records_name:
      description: Complete DNS record name, including the zone name, in Punycode.
      type: string
      example: example.com
      maxLength: 255
      minLength: 1
      x-auditable: true
    dns-records_comment:
      description: Comments or notes about the DNS record. This field has no effect on DNS responses.
      type: string
      example: Domain verification record
      x-auditable: true
    dns-records_dns-record-with-data:
      type: object
      oneOf:
      - $ref: '#/components/schemas/dns-records_CAARecord'
      - $ref: '#/components/schemas/dns-records_CERTRecord'
      - $ref: '#/components/schemas/dns-records_DNSKEYRecord'
      - $ref: '#/components/schemas/dns-records_DSRecord'
      - $ref: '#/components/schemas/dns-records_HTTPSRecord'
      - $ref: '#/components/schemas/dns-records_LOCRecord'
      - $ref: '#/components/schemas/dns-records_NAPTRRecord'
      - $ref: '#/components/schemas/dns-records_SMIMEARecord'
      - $ref: '#/components/schemas/dns-records_SRVRecord'
      - $ref: '#/components/schemas/dns-records_SSHFPRecord'
      - $ref: '#/components/schemas/dns-records_SVCBRecord'
      - $ref: '#/components/schemas/dns-records_TLSARecord'
      - $ref: '#/components/schemas/dns-records_URIRecord'
    dns-records_dns-response-batch-object:
      type: object
      properties:
        deletes:
          type: array
          items:
            $ref: '#/components/schemas/dns-records_dns-record-response'
        patches:
          type: array
          items:
            $ref: '#/components/schemas/dns-records_dns-record-response'
        posts:
          type: array
          items:
            $ref: '#/components/schemas/dns-records_dns-record-response'
        puts:
          type: array
          items:
            $ref: '#/components/schemas/dns-records_dns-record-response'
    dns-records_MXRecord:
      type: object
      allOf:
      - $ref: '#/components/schemas/dns-records_dns-record-shared-fields'
      - properties:
          content:
            description: A valid mail server hostname.
            example: mx.example.com
            format: hostname
            type: string
            x-auditable: true
          priority:
            $ref: '#/components/schemas/dns-records_priority'
          type:
            description: Record type.
            type: string
            example: MX
            enum:
            - MX
            x-auditable: true
        type: object
      title: MX Record
    dns-records_dns-record-without-data:
      type: object
      oneOf:
      - $ref: '#/components/schemas/dns-records_ARecord'
      - $ref: '#/components/schemas/dns-records_AAAARecord'
      - $ref: '#/components/schemas/dns-records_CNAMERecord'
      - $ref: '#/components/schemas/dns-records_MXRecord'
      - $ref: '#/components/schemas/dns-records_NSRecord'
      - $ref: '#/components/schemas/dns-records_OPENPGPKEYRecord'
      - $ref: '#/components/schemas/dns-records_PTRRecord'
      - $ref: '#/components/schemas/dns-records_TXTRecord'
    dns-records_SMIMEARecord:
      type: object
      allOf:
      - $ref: '#/components/schemas/dns-records_dns-record-shared-fields'
      - properties:
          content:
            description: Formatted SMIMEA content. See 'data' to set SMIMEA properties.
            readOnly: true
            type: string
            x-auditable: true
          data:
            description: Components of a SMIMEA record.
            type: object
            properties:
              certificate:
                description: Certificate.
                type: string
                x-auditable: true
              matching_type:
                description: Matching Type.
                type: number
                example: 0
                maximum: 255
                minimum: 0
                x-auditable: true
              selector:
                description: Selector.
                type: number
                example: 0
                maximum: 255
                minimum: 0
                x-auditable: true
              usage:
                description: Usage.
                type: number
                example: 3
                maximum: 255
                minimum: 0
                x-auditable: true
          type:
            description: Record type.
            type: string
            example: SMIMEA
            enum:
            - SMIMEA
            x-auditable: true
        type: object
      title: SMIMEA Record
    dns-records_TLSARecord:
      type: object
      allOf:
      - $ref: '#/components/schemas/dns-records_dns-record-shared-fields'
      - properties:
          content:
            description: Formatted TLSA content. See 'data' to set TLSA properties.
            readOnly: true
            type: string
            x-auditable: true
          data:
            description: Components of a TLSA record.
            type: object
            properties:
              certificate:
                description: Certificate.
                type: string
                x-auditable: true
              matching_type:
                description: Matching Type.
                type: number
                example: 1
                maximum: 255
                minimum: 0
                x-auditable: true
              selector:
                description: Selector.
                type: number
                example: 0
                maximum: 255
                minimum: 0
                x-auditable: true
              usage:
                description: Usage.
                type: number
                example: 0
                maximum: 255
                minimum: 0
                x-auditable: true
          type:
            description: Record type.
            type: string
            example: TLSA
            enum:
            - TLSA
            x-auditable: true
        type: object
      title: TLSA Record
    dns-records_CNAMERecord:
      type: object
      allOf:
      - $ref: '#/components/schemas/dns-records_dns-record-shared-fields'
      - properties:
          content:
            description: A valid hostname. Must not match the record's name.
            type: string
            x-auditable: true
          settings:
            type: object
            properties:
              flatten_cname:
                description: If enabled, causes the CNAME record to be resolved externally and the resulting address records (e.g., A and AAAA) to be returned instead of the CNAME record itself. This setting is unavailable for proxied records, since they are always flattened.
                type: boolean
                example: true
                default: false
                x-auditable: true
          type:
            description: Record type.
            type: string
            example: CNAME
            enum:
            - CNAME
            x-auditable: true
        type: object
      title: CNAME Record
    dns-records_api-response-common:
      type: object
      properties:
        errors:
          $ref: '#/components/schemas/dns-records_messages'
        messages:
          $ref: '#/components/schemas/dns-records_messages'
        success:
          description: Whether the API call was successful.
          type: boolean
          example: true
          enum:
          - true
      required:
      - success
      - errors
      - messages
    dns-records_ARecord:
      type: object
      allOf:
      - $ref: '#/components/schemas/dns-records_dns-record-shared-fields'
      - properties:
          content:
            description: A valid IPv4 address.
            example: 198.51.100.4
            format: ipv4
            type: string
            x-auditable: true
          private_routing:
            description: Enables private network routing to the origin.
            type: boolean
            example: true
            default: false
            x-auditable: true
          type:
            description: Record type.
            type: string
            example: A
            enum:
            - A
            x-auditable: true
        type: object
      title: A Record
    dns-records_OPENPGPKEYRecord:
      type: object
      allOf:
      - $ref: '#/components/schemas/dns-records_dns-record-shared-fields'
      - properties:
          content:
            description: A single Base64-encoded OpenPGP Transferable Public Key (RFC 4880 Section 11.1)
            type: string
            x-auditable: true
          type:
            description: Record type.
            type: string
            example: OPENPGPKEY
            enum:
            - OPENPGPKEY
            x-auditable: true
        type: object
      title: OPENPGPKEY Record
    dns-records_dns-record-scan-batch-accept:
      type: object
      allOf:
      - $ref: '#/components/schemas/dns-records_dns-record-patch'
    dns-records_dns-record-patch:
      type: object
      anyOf:
      - $ref: '#/components/schemas/dns-records_dns-record-without-data'
      - $ref: '#/components/schemas/dns-records_dns-record-with-data'
    dns-records_dns_response_collection:
      type: object
      allOf:
      - $ref: '#/components/schemas/dns-records_api-response-collection'
      - properties:
          result:
            type: array
            items:
              $ref: '#/components/schemas/dns-records_dns-record-response'
        type: object
    dns-records_SRVRecord:
      type: object
      allOf:
      - $ref: '#/components/schemas/dns-records_dns-record-shared-fields'
      - properties:
          content:
            description: Priority, weight, port, and SRV target. See 'data' for setting the individual component values.
            example: 10 IN SRV 5 8806 example.com.
            readOnly: true
            type: string
            x-auditable: true
          data:
            description: Components of a SRV record.
            type: object
            properties:
              port:
                description: The port of the service.
                type: number
                example: 8806
                maximum: 65535
                minimum: 0
                x-auditable: true
              priority:
                $ref: '#/components/schemas/dns-records_priority'
              target:
                description: A valid hostname.
                type: string
                format: hostname
                example: example.com
                x-auditable: true
              weight:
                description: The record weight.
                type: number
                example: 5
                maximum: 65535
                minimum: 0
                x-auditable: true
          type:
            description: Record type.
            type: string
            example: SRV
            enum:
            - SRV
            x-auditable: true
        type: object
      title: SRV Record
    dns-records_dns-record-batch-patch:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/dns-records_identifier'
      allOf:
      - $ref: '#/components/schemas/dns-records_dns-record-patch'
      required:
      - id
    dns-records_dns_response_trigger_scan:
      type: object
      allOf:
      - $ref: '#/components/schemas/dns-records_api-response-single'
    dns-records_HTTPSRecord:
      type: object
      allOf:
      - $ref: '#/components/schemas/dns-records_dns-record-shared-fields'
      - properties:
          content:
            description: Formatted HTTPS content. See 'data' to set HTTPS properties.
            readOnly: true
            type: string
            x-auditable: true
          data:
            description: Components of a HTTPS record.
            type: object
            properties:
              priority:
                description: Priority.
                type: number
                example: 1
                maximum: 65535
                minimum: 0
                x-auditable: true
              target:
                description: Target.
                type: string
                example: .
                x-auditable: true
              value:
                description: Value.
                type: string
                example: alpn="h3,h2" ipv4hint="127.0.0.1" ipv6hint="::1"
                x-auditable: true
          type:
            description: Record type.
            type: string
            example: HTTPS
            enum:
            - HTTPS
            x-auditable: true
        type: object
      title: HTTPS Record
    dns-records_messages:
      type: array
      items:
        properties:
          code:
            type: integer
            minimum: 1000
          documentation_url:
            type: string
          message:
            type: string
          source:
            type: object
            properties:
              pointer:
                type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      example: []
    dns-records_SSHFPRecord:
      type: object
      allOf:
      - $ref: '#/components/schemas/dns-records_dns-record-shared-fields'
      - properties:
          content:
            description: Formatted SSHFP content. See 'data' to set SSHFP properties.
            readOnly: true
            type: string
            x-auditable: true
          data:
            description: Components of a SSHFP record.
            type: object
            properties:
              algorithm:
                description: Algorithm.
                type: number
                example: 2
                maximum: 255
                minimum: 0
                x-auditable: true
              fingerprint:
                description: Fingerprint.
                type: string
                x-auditable: true
              type:
                description: Type.
                type: number
                example: 1
                maximum: 255
                minimum: 0
                x-auditable: true
          type:
            description: Record type.
            type: string
            example: SSHFP
            enum:
            - SSHFP
            x-auditable: true
        type: object
      title: SSHFP Record
    dns-records_LOCRecord:
      type: object
      allOf:
      - $ref: '#/components/schemas/dns-records_dns-record-shared-fields'
      - properties:
          content:
