openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare DNS Records for a Zone API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: DNS Records for a Zone
paths:
  /zones/{zone_id}/dns_records:
    get:
      operationId: dns-records-for-a-zone-list-dns-records
      summary: List DNS Records
      description: List, search, sort, and filter a zones' DNS records.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/dns-records_identifier'
      - name: name
        in: query
        schema:
          description: 'Exact value of the DNS record name. This is a convenience alias for `name.exact`.

            '
          type: string
          example: www.example.com
      - name: name.exact
        in: query
        schema:
          description: 'Exact value of the DNS record name. Name filters are case-insensitive.

            '
          type: string
          example: www.example.com
      - name: name.contains
        in: query
        schema:
          description: 'Substring of the DNS record name. Name filters are case-insensitive.

            '
          type: string
          example: w.example.
      - name: name.startswith
        in: query
        schema:
          description: 'Prefix of the DNS record name. Name filters are case-insensitive.

            '
          type: string
          example: www.example
      - name: name.endswith
        in: query
        schema:
          description: 'Suffix of the DNS record name. Name filters are case-insensitive.

            '
          type: string
          example: .example.com
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/dns-records_type'
      - name: content
        in: query
        schema:
          description: 'Exact value of the DNS record content. This is a convenience alias for `content.exact`.

            '
          type: string
          example: 127.0.0.1
      - name: content.exact
        in: query
        schema:
          description: 'Exact value of the DNS record content. Content filters are case-insensitive.

            '
          type: string
          example: 127.0.0.1
      - name: content.contains
        in: query
        schema:
          description: 'Substring of the DNS record content. Content filters are case-insensitive.

            '
          type: string
          example: 7.0.0.
      - name: content.startswith
        in: query
        schema:
          description: 'Prefix of the DNS record content. Content filters are case-insensitive.

            '
          type: string
          example: 127.0.
      - name: content.endswith
        in: query
        schema:
          description: 'Suffix of the DNS record content. Content filters are case-insensitive.

            '
          type: string
          example: .0.1
      - name: proxied
        in: query
        schema:
          $ref: '#/components/schemas/dns-records_proxied'
      - name: match
        in: query
        schema:
          $ref: '#/components/schemas/dns-records_match'
      - name: comment
        in: query
        schema:
          description: 'Exact value of the DNS record comment. This is a convenience alias for `comment.exact`.

            '
          type: string
          example: Hello, world
      - name: comment.present
        in: query
        schema:
          description: 'If this parameter is present, only records *with* a comment are returned.

            '
          type: string
      - name: comment.absent
        in: query
        schema:
          description: 'If this parameter is present, only records *without* a comment are returned.

            '
          type: string
      - name: comment.exact
        in: query
        schema:
          description: 'Exact value of the DNS record comment. Comment filters are case-insensitive.

            '
          type: string
          example: Hello, world
      - name: comment.contains
        in: query
        schema:
          description: 'Substring of the DNS record comment. Comment filters are case-insensitive.

            '
          type: string
          example: ello, worl
      - name: comment.startswith
        in: query
        schema:
          description: 'Prefix of the DNS record comment. Comment filters are case-insensitive.

            '
          type: string
          example: Hello, w
      - name: comment.endswith
        in: query
        schema:
          description: 'Suffix of the DNS record comment. Comment filters are case-insensitive.

            '
          type: string
          example: o, world
      - name: tag
        in: query
        schema:
          description: 'Condition on the DNS record tag.


            Parameter values can be of the form `<tag-name>:<tag-value>` to search for an exact `name:value` pair, or just `<tag-name>` to search for records with a specific tag name regardless of its value.


            This is a convenience shorthand for the more powerful `tag.<predicate>` parameters.

            Examples:

            - `tag=important` is equivalent to `tag.present=important`

            - `tag=team:DNS` is equivalent to `tag.exact=team:DNS`

            '
          type: string
          example: team:DNS
      - name: tag.present
        in: query
        schema:
          description: 'Name of a tag which must be present on the DNS record. Tag filters are case-insensitive.

            '
          type: string
          example: important
      - name: tag.absent
        in: query
        schema:
          description: 'Name of a tag which must *not* be present on the DNS record. Tag filters are case-insensitive.

            '
          type: string
          example: important
      - name: tag.exact
        in: query
        schema:
          description: 'A tag and value, of the form `<tag-name>:<tag-value>`. The API will only return DNS records that have a tag named `<tag-name>` whose value is `<tag-value>`. Tag filters are case-insensitive.

            '
          type: string
          example: greeting:Hello, world
      - name: tag.contains
        in: query
        schema:
          description: 'A tag and value, of the form `<tag-name>:<tag-value>`. The API will only return DNS records that have a tag named `<tag-name>` whose value contains `<tag-value>`. Tag filters are case-insensitive.

            '
          type: string
          example: greeting:ello, worl
      - name: tag.startswith
        in: query
        schema:
          description: 'A tag and value, of the form `<tag-name>:<tag-value>`. The API will only return DNS records that have a tag named `<tag-name>` whose value starts with `<tag-value>`. Tag filters are case-insensitive.

            '
          type: string
          example: greeting:Hello, w
      - name: tag.endswith
        in: query
        schema:
          description: 'A tag and value, of the form `<tag-name>:<tag-value>`. The API will only return DNS records that have a tag named `<tag-name>` whose value ends with `<tag-value>`. Tag filters are case-insensitive.

            '
          type: string
          example: greeting:o, world
      - name: search
        in: query
        schema:
          $ref: '#/components/schemas/dns-records_search'
      - name: tag_match
        in: query
        schema:
          $ref: '#/components/schemas/dns-records_tag_match'
      - name: page
        in: query
        schema:
          $ref: '#/components/schemas/dns-records_page'
      - name: per_page
        in: query
        schema:
          $ref: '#/components/schemas/dns-records_per_page'
      - name: order
        in: query
        schema:
          $ref: '#/components/schemas/dns-records_order'
      - name: direction
        in: query
        schema:
          $ref: '#/components/schemas/dns-records_direction'
      - $ref: '#/components/parameters/dns-records_include_shadow_metadata'
      - name: shadowed_by_name
        in: query
        schema:
          description: 'Filters the response to records at or below the specified NS delegation name. NS, DS, and NSEC records at the delegation name are excluded because they are not shadowed by that delegation. Those record types are included only when they exist below the delegation. The value must be a non-apex subdomain of the zone. Requires `include_shadow_metadata=true`. See [Shadowed records](https://developers.cloudflare.com/dns/manage-dns-records/reference/shadowed-records).

            '
          type: string
          example: sub.example.com
      - name: shadowing_name
        in: query
        schema:
          description: 'Returns NS records that shadow the given name, searching at the name itself and each of its ancestor names within the zone, excluding the zone apex. The value must be a subdomain of the zone; the zone apex is not accepted. See [Shadowed records](https://developers.cloudflare.com/dns/manage-dns-records/reference/shadowed-records).

            '
          type: string
          example: www.sub.example.com
      responses:
        '200':
          description: List DNS Records response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dns-records_dns_response_collection'
        4XX:
          description: List DNS Records response failure
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/dns-records_dns_response_collection'
                - $ref: '#/components/schemas/dns-records_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DNS Records for a Zone
      x-api-token-group:
      - DNS Read
      - DNS Write
      x-cfPermissionsRequired:
        enum:
        - '#dns_records:read'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: dns.records
      x-fern-sdk-method-name: list
      x-forge-params:
        zone_id:
          description: Zone ID
    post:
      operationId: dns-records-for-a-zone-create-dns-record
      summary: Create DNS Record
      description: 'Create a new DNS record for a zone.


        Notes:

        - A/AAAA records cannot exist on the same name as CNAME records.

        - NS records cannot exist on the same name as any other record type.

        - Domain names are always represented in Punycode, even if Unicode

        characters were used when creating the record.'
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/dns-records_identifier'
      - $ref: '#/components/parameters/dns-records_include_shadow_metadata'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dns-records_dns-record-post'
      responses:
        '200':
          description: Create DNS Record response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dns-records_dns_response_single'
        4XX:
          description: Create DNS Record response failure
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/dns-records_dns_response_single'
                - $ref: '#/components/schemas/dns-records_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DNS Records for a Zone
      x-api-token-group:
      - DNS Write
      x-cfPermissionsRequired:
        enum:
        - '#dns_records:edit'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: dns.records
      x-fern-sdk-method-name: create
  /zones/{zone_id}/dns_records/batch:
    post:
      operationId: dns-records-for-a-zone-batch-dns-records
      summary: Batch DNS Records
      description: 'Send a Batch of DNS Record API calls to be executed together.


        Notes:

        - Although Cloudflare will execute the batched operations in a single database transaction, Cloudflare''s distributed KV store must treat each record change as a single key-value pair. This means that the propagation of changes is not atomic. See the documentation for more information.

        - The operations you specify within the /batch request body are always executed in the following order:


        - Deletes

        - Patches

        - Puts

        - Posts'
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/dns-records_identifier'
      - $ref: '#/components/parameters/dns-records_include_shadow_metadata'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dns-records_dns-request-batch-object'
      responses:
        '200':
          description: Batch DNS Records response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dns-records_dns_response_batch'
        4XX:
          description: Batch DNS Records response failure
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/dns-records_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DNS Records for a Zone
      x-api-token-group:
      - DNS Write
      x-cfPermissionsRequired:
        enum:
        - '#dns_records:batch'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: dns.records
      x-fern-sdk-method-name: batch
  /zones/{zone_id}/dns_records/export:
    get:
      operationId: dns-records-for-a-zone-export-dns-records
      summary: Export DNS Records
      description: 'You can export your BIND config through this endpoint.


        See the documentation for more information.'
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/dns-records_identifier'
      responses:
        '200':
          description: Export DNS Records response
          content:
            text/plain:
              schema:
                description: Exported BIND zone file.
                type: string
                example: 'www.example.com. 300 IN  A 127.0.0.1

                  '
        4XX:
          description: Export DNS Records response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dns-records_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DNS Records for a Zone
      x-api-token-group:
      - DNS Read
      - DNS Write
      x-cfPermissionsRequired:
        enum:
        - '#dns_records:read'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: dns.records
      x-fern-sdk-method-name: export
  /zones/{zone_id}/dns_records/import:
    post:
      operationId: dns-records-for-a-zone-import-dns-records
      summary: Import DNS Records
      description: 'You can upload your BIND config through this endpoint. It assumes that cURL is called from a location with bind_config.txt (valid BIND config) present.


        See the documentation for more information.'
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/dns-records_identifier'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  description: 'BIND config to import.


                    **Tip:** When using cURL, a file can be uploaded using `--form ''file=@bind_config.txt''`.

                    '
                  type: string
                  example: www.example.com. 300 IN  A 127.0.0.1
                proxied:
                  description: 'Whether or not proxiable records should receive the performance and security benefits of Cloudflare.


                    The value should be either `true` or `false`.'
                  type: string
                  example: 'true'
                  default: 'false'
              required:
              - file
      responses:
        '200':
          description: Import DNS Records response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dns-records_dns_response_import_scan'
        4XX:
          description: Import DNS Records response failure
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/dns-records_dns_response_import_scan'
                - $ref: '#/components/schemas/dns-records_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DNS Records for a Zone
      x-api-token-group:
      - DNS Write
      x-cfPermissionsRequired:
        enum:
        - '#dns_records:edit'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: dns.records
      x-fern-sdk-method-name: import
  /zones/{zone_id}/dns_records/scan:
    post:
      operationId: dns-records-for-a-zone-scan-dns-records
      summary: Scan DNS Records
      description: Scan for common DNS records on your domain and automatically add them to your zone. Useful if you haven't updated your nameservers yet.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/dns-records_identifier'
      responses:
        '200':
          description: Scan DNS Records response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dns-records_dns_response_import_scan'
        4XX:
          description: Scan DNS Records response failure
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/dns-records_dns_response_import_scan'
                - $ref: '#/components/schemas/dns-records_api-response-common-failure'
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DNS Records for a Zone
      x-api-token-group:
      - DNS Write
      x-cfPermissionsRequired:
        enum:
        - '#dns_records:edit'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: dns.records
      x-fern-sdk-method-name: scan
      x-stainless-deprecation-message: 'This endpoint is deprecated in favor of a new asynchronous version. Please use the [/scan/trigger](https://developers.cloudflare.com/api/resources/dns/subresources/records/methods/scan/trigger) and [/scan/review](https://developers.cloudflare.com/api/resources/dns/subresources/records/methods/scan/review) endpoints instead.

        '
  /zones/{zone_id}/dns_records/scan/review:
    get:
      operationId: dns-records-for-a-zone-review-dns-scan
      summary: List Scanned DNS Records
      description: Retrieves the list of DNS records discovered up to this point by the asynchronous scan. These records are temporary until explicitly accepted or rejected via `POST /scan/review`. Additional records may be discovered by the scan later.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/dns-records_identifier'
      responses:
        '200':
          description: List of discovered DNS records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dns-records_dns_response_collection'
        4XX:
          description: Scan review failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dns-records_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DNS Records for a Zone
      x-api-token-group:
      - DNS Read
      - DNS Write
      x-cfPermissionsRequired:
        enum:
        - '#dns_records:read'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: dns.records
      x-fern-sdk-method-name: scan-list
    post:
      operationId: dns-records-for-a-zone-apply-dns-scan-results
      summary: Review Scanned DNS Records
      description: Accept or reject DNS records found by the DNS records scan. Accepted records will be permanently added to the zone, while rejected records will be permanently deleted.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/dns-records_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dns-records_dns-request-review-scan-object'
      responses:
        '200':
          description: Records reviewed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dns-records_dns_response_review_scan'
        4XX:
          description: Review failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dns-records_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DNS Records for a Zone
      x-api-token-group:
      - DNS Write
      x-cfPermissionsRequired:
        enum:
        - '#dns_records:edit'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: dns.records
      x-fern-sdk-method-name: scan-review
  /zones/{zone_id}/dns_records/scan/trigger:
    post:
      operationId: dns-records-for-a-zone-trigger-dns-scan
      summary: Trigger DNS Record Scan
      description: Initiates an asynchronous scan for common DNS records on your domain. Note that this **does not** automatically add records to your zone. The scan runs in the background, and results can be reviewed later using the `/scan/review` endpoints. Useful if you haven't updated your nameservers yet.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/dns-records_identifier'
      responses:
        '200':
          description: Trigger DNS Records Scan Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dns-records_dns_response_trigger_scan'
        4XX:
          description: Trigger DNS Records Scan response failure
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/dns-records_dns_response_trigger_scan'
                - $ref: '#/components/schemas/dns-records_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DNS Records for a Zone
      x-api-token-group:
      - DNS Write
      x-cfPermissionsRequired:
        enum:
        - '#dns_records:edit'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: dns.records
      x-fern-sdk-method-name: scan-trigger
  /zones/{zone_id}/dns_records/usage:
    get:
      operationId: dns-records-for-a-zone-get-usage
      summary: Get DNS Record Usage
      description: Get the current DNS record usage for a zone, including the number of records and the quota limit.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/dns-records_identifier'
      responses:
        '200':
          description: Get DNS Record Usage response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dns-records_dns_response_zone_usage'
        4XX:
          description: Get DNS Record Usage response failure.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/dns-records_dns_response_zone_usage'
                - $ref: '#/components/schemas/dns-records_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DNS Records for a Zone
      x-api-token-group:
      - Zone DNS Settings Write
      - Zone DNS Settings Read
      - DNS Read
      - DNS Write
      x-cfPermissionsRequired:
        enum:
        - '#dns_records:read'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: dns.usage.zone
      x-fern-sdk-method-name: get
  /zones/{zone_id}/dns_records/{dns_record_id}:
    delete:
      operationId: dns-records-for-a-zone-delete-dns-record
      summary: Delete DNS Record
      description: Permanently removes a DNS record from the zone.
      parameters:
      - name: dns_record_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/dns-records_identifier'
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/dns-records_identifier'
      responses:
        '200':
          description: Delete DNS Record response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      id:
                        $ref: '#/components/schemas/dns-records_identifier'
        4XX:
          description: Delete DNS Record response failure
          content:
            application/json:
              schema:
                type: object
                allOf:
                - properties:
                    result:
                      type: object
                      properties:
                        id:
                          $ref: '#/components/schemas/dns-records_identifier'
                  type: object
                - $ref: '#/components/schemas/dns-records_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DNS Records for a Zone
      x-api-token-group:
      - DNS Write
      x-cfPermissionsRequired:
        enum:
        - '#dns_records:edit'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: dns.records
      x-fern-sdk-method-name: delete
    get:
      operationId: dns-records-for-a-zone-dns-record-details
