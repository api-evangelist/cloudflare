        '
      type: string
      example: www.cloudflare.com
    dns-records_dns-record-shared-fields:
      type: object
      properties:
        comment:
          $ref: '#/components/schemas/dns-records_comment'
        name:
          $ref: '#/components/schemas/dns-records_name'
        proxied:
          $ref: '#/components/schemas/dns-records_proxied'
        settings:
          $ref: '#/components/schemas/dns-records_settings'
        tags:
          $ref: '#/components/schemas/dns-records_tags'
        ttl:
          $ref: '#/components/schemas/dns-records_ttl'
    dns-records_dns-record-response:
      type: object
      allOf:
      - anyOf:
        - $ref: '#/components/schemas/dns-records_dns-record-without-data'
        - $ref: '#/components/schemas/dns-records_dns-record-with-data'
        type: object
      - properties:
          comment_modified_on:
            description: When the record comment was last modified. Omitted if there is no comment.
            type: string
            format: date-time
            example: '2024-01-01T05:20:00.12345Z'
            readOnly: true
            x-stainless-terraform-configurability: computed
          created_on:
            description: When the record was created.
            type: string
            format: date-time
            example: '2014-01-01T05:20:00.12345Z'
            readOnly: true
            x-stainless-terraform-configurability: computed
          id:
            $ref: '#/components/schemas/dns-records_identifier'
          meta:
            description: Extra Cloudflare-specific metadata about the record.
            type: object
            properties:
              dead_glue:
                description: 'Whether this glue record is not served because a shallower NS delegation takes precedence over the deeper delegation that needs it. Present only when true; reachable glue carries only `is_glue`. See [Unreachable glue records](https://developers.cloudflare.com/dns/manage-dns-records/reference/shadowed-records#unreachable-glue-records).

                  '
                type: boolean
                example: true
                readOnly: true
              is_glue:
                description: 'Whether this A or AAAA record is glue for a subdomain NS delegation. See [Glue records](https://developers.cloudflare.com/dns/manage-dns-records/reference/shadowed-records#glue-records).

                  '
                type: boolean
                example: true
                readOnly: true
              shadowed_by:
                description: 'IDs of the NS records that shadow this record. See [Shadowed records](https://developers.cloudflare.com/dns/manage-dns-records/reference/shadowed-records).

                  '
                type: array
                items:
                  example: 372e67954025e0ba6aaa6d586b9e0b59
                  type: string
                readOnly: true
              shadowed_records_count:
                description: 'Number of records shadowed by this NS delegation. See [Shadowed records](https://developers.cloudflare.com/dns/manage-dns-records/reference/shadowed-records).

                  '
                type: integer
                example: 42
                maximum: 10000
                minimum: 0
                readOnly: true
            readOnly: true
            x-stainless-terraform-configurability: computed
          modified_on:
            description: When the record was last modified.
            type: string
            format: date-time
            example: '2014-01-01T05:20:00.12345Z'
            readOnly: true
            x-stainless-terraform-configurability: computed
          proxiable:
            description: Whether the record can be proxied by Cloudflare or not.
            type: boolean
            example: true
            readOnly: true
            x-stainless-terraform-configurability: computed
          tags_modified_on:
            description: When the record tags were last modified. Omitted if there are no tags.
            type: string
            format: date-time
            example: '2025-01-01T05:20:00.12345Z'
            readOnly: true
            x-stainless-terraform-configurability: computed
        required:
        - id
        - proxiable
        - created_on
        - modified_on
        - meta
        type: object
      required:
      - name
      - type
      - content
      - data
      - proxied
      - ttl
      - settings
      - comment
      - tags
