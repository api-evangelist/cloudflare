      tags:
      - R2 Bucket
      x-api-token-group:
      - Workers R2 Storage Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: r2.buckets.jobs
      x-fern-sdk-method-name: create
      x-forge-require-confirmation: This starts a background job that either permanently deletes every object under the given prefix (every object in the bucket for an empty prefix) or migrates every object in the bucket between storage classes.
