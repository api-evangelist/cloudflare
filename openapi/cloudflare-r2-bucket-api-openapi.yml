openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare R2 Bucket API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: R2 Bucket
paths:
  /accounts/{account_id}/event_notifications/r2/{bucket_name}/configuration:
    get:
      operationId: r2-get-event-notification-configs
      summary: List Event Notification Rules
      description: Lists event notification rules for an R2 bucket, grouped by the Cloudflare Queue that receives matching object events.
      parameters:
      - name: bucket_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_bucket_name'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_account_identifier'
      - $ref: '#/components/parameters/r2_cf-r2-jurisdiction'
      responses:
        '200':
          description: Read Configuration response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/r2_v4_response'
                - properties:
                    result:
                      $ref: '#/components/schemas/r2_bucket-config'
                  type: object
        '404':
          description: No Configuration Found response.
          content:
            application/json:
              example:
                errors:
                - code: 11015
                  message: workers.api.error.no_configs_found_for_bucket
                messages:
                - Request failed.
                result: null
                success: false
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
        4XX:
          description: Read Configuration failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
      security:
      - api_token: []
      tags:
      - R2 Bucket
      x-api-token-group:
      - Workers R2 Storage Write
      - Workers R2 Storage Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: r2.buckets.event-notifications
      x-fern-sdk-method-name: list
  /accounts/{account_id}/event_notifications/r2/{bucket_name}/configuration/queues/{queue_id}:
    delete:
      operationId: r2-event-notification-delete-config
      summary: Delete Event Notification Rules
      description: Deletes the specified event notification rules for an R2 bucket and Cloudflare Queue. Provide ruleIds in the request body to select rules. If no body is provided, all rules for that bucket and queue are deleted.
      parameters:
      - name: queue_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_queue_identifier'
      - name: bucket_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_bucket_name'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_account_identifier'
      - $ref: '#/components/parameters/r2_cf-r2-jurisdiction'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ruleIds:
                  description: Array of rule ids to delete.
                  type: array
                  items:
                    description: rule ids to be deleted.
                    type: string
      responses:
        '200':
          description: Delete Configuration response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/r2_v4_response'
                - type: object
        4XX:
          description: Delete Configuration failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
      security:
      - api_token: []
      tags:
      - R2 Bucket
      x-api-token-group:
      - Workers R2 Storage Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: r2.buckets.event-notifications
      x-fern-sdk-method-name: delete
      x-forge-require-confirmation: This deletes event notification rules for the selected R2 bucket and queue. Without a request body, all rules for that bucket and queue are deleted.
    get:
      operationId: r2-get-event-notification-config
      summary: Get Event Notification Rules for a Queue
      description: Gets the event notification rules for the specified R2 bucket and Cloudflare Queue. The response includes the queue's configuration and its array of rules.
      parameters:
      - name: queue_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_queue_identifier'
      - name: bucket_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_bucket_name'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_account_identifier'
      - $ref: '#/components/parameters/r2_cf-r2-jurisdiction'
      responses:
        '200':
          description: Read Configuration response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/r2_v4_response'
                - properties:
                    result:
                      $ref: '#/components/schemas/r2_queues-config'
                  type: object
        '404':
          description: No Configuration Found response.
          content:
            application/json:
              example:
                errors:
                - code: 11015
                  message: workers.api.error.no_configs_found_for_bucket
                messages:
                - Request failed.
                result: null
                success: false
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
        4XX:
          description: Read Configuration failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
      security:
      - api_token: []
      tags:
      - R2 Bucket
      x-api-token-group:
      - Workers R2 Storage Write
      - Workers R2 Storage Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: r2.buckets.event-notifications
      x-fern-sdk-method-name: get
    put:
      operationId: r2-put-event-notification-config
      summary: Create Event Notification Rules
      description: Creates rules that send notifications for matching R2 object events to the specified Cloudflare Queue. Rules can filter objects by key prefix and suffix. New rules are added to any existing rules for the queue; a rule that overlaps an existing rule is rejected.
      parameters:
      - name: queue_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_queue_identifier'
      - name: bucket_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_bucket_name'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_account_identifier'
      - $ref: '#/components/parameters/r2_cf-r2-jurisdiction'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rules:
                  description: Array of rules to drive notifications.
                  type: array
                  items:
                    $ref: '#/components/schemas/r2_rule'
                  minItems: 1
              required:
              - rules
      responses:
        '200':
          description: Create Configuration response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/r2_v4_response'
                - type: object
        4XX:
          description: Create Configuration failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
      security:
      - api_token: []
      tags:
      - R2 Bucket
      x-api-token-group:
      - Workers R2 Storage Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: r2.buckets.event-notifications
      x-fern-sdk-method-name: update
  /accounts/{account_id}/r2/buckets:
    get:
      operationId: r2-list-buckets
      summary: List Buckets
      description: Lists a page of R2 buckets in the account and selected jurisdiction. Use the returned cursor to retrieve the next page.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_account_identifier'
      - name: name_contains
        in: query
        schema:
          description: Bucket names to filter by. Only buckets with this phrase in their name will be returned.
          type: string
          example: my-bucket
      - name: start_after
        in: query
        schema:
          description: Bucket name to start searching after. Buckets are ordered lexicographically.
          type: string
          example: my-bucket
      - name: per_page
        in: query
        schema:
          description: Maximum number of buckets to return in a single call.
          type: number
          default: 20
          maximum: 1000
          minimum: 1
      - name: order
        in: query
        schema:
          description: Field to order buckets by.
          type: string
          enum:
          - name
      - name: direction
        in: query
        schema:
          description: Direction to order buckets.
          type: string
          example: desc
          enum:
          - asc
          - desc
      - name: cursor
        in: query
        schema:
          description: Pagination cursor received during the last List Buckets call. R2 buckets are paginated using cursors instead of page numbers.
          type: string
      - $ref: '#/components/parameters/r2_cf-r2-jurisdiction'
      responses:
        '200':
          description: List Buckets response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/r2_v4_response_list'
                - properties:
                    result:
                      type: object
                      properties:
                        buckets:
                          type: array
                          items:
                            $ref: '#/components/schemas/r2_bucket'
                  type: object
        4XX:
          description: List Buckets response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
      security:
      - api_token: []
      tags:
      - R2 Bucket
      x-api-token-group:
      - Workers R2 Storage Write
      - Workers R2 Storage Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: r2.buckets
      x-fern-sdk-method-name: list
    post:
      operationId: r2-create-bucket
      summary: Create Bucket
      description: Creates an R2 bucket in the account and selected jurisdiction, with an optional location hint and default storage class.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_account_identifier'
      - $ref: '#/components/parameters/r2_cf-r2-jurisdiction'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locationHint:
                  $ref: '#/components/schemas/r2_bucket_location'
                name:
                  $ref: '#/components/schemas/r2_bucket_name'
                storageClass:
                  $ref: '#/components/schemas/r2_storage_class'
              example: '{"name": "example-bucket"}'
              required:
              - name
      responses:
        '200':
          description: Create Bucket response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/r2_v4_response'
                - properties:
                    result:
                      $ref: '#/components/schemas/r2_bucket'
                  type: object
        4XX:
          description: Create Bucket response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
      security:
      - api_token: []
      tags:
      - R2 Bucket
      x-api-token-group:
      - Workers R2 Storage Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: r2.buckets
      x-fern-sdk-method-name: create
  /accounts/{account_id}/r2/buckets/{bucket_name}:
    delete:
      operationId: r2-delete-bucket
      summary: Delete Bucket
      description: Deletes an empty R2 bucket and its configuration. The bucket must have no objects, no in-progress multipart uploads, and no event notification rules; otherwise the request fails.
      parameters:
      - name: bucket_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_bucket_name'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_account_identifier'
      - $ref: '#/components/parameters/r2_cf-r2-jurisdiction'
      responses:
        '200':
          description: Delete Bucket response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/r2_v4_response'
        4XX:
          description: Delete Bucket response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
      security:
      - api_token: []
      tags:
      - R2 Bucket
      x-api-token-group:
      - Workers R2 Storage Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: r2.buckets
      x-fern-sdk-method-name: delete
      x-forge-require-confirmation: This permanently deletes the empty R2 bucket and its configuration.
    get:
      operationId: r2-get-bucket
      summary: Get Bucket
      description: Gets properties of an existing R2 bucket.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_account_identifier'
      - name: bucket_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_bucket_name'
      - $ref: '#/components/parameters/r2_cf-r2-jurisdiction'
      responses:
        '200':
          description: Get Bucket response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/r2_v4_response'
                - properties:
                    result:
                      $ref: '#/components/schemas/r2_bucket'
                  type: object
        4XX:
          description: Get Bucket response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
      security:
      - api_token: []
      tags:
      - R2 Bucket
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.r2.bucket.read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: r2.buckets
      x-fern-sdk-method-name: get
    patch:
      operationId: r2-patch-bucket
      summary: Patch Bucket
      description: Changes the default storage class for newly uploaded objects in an existing R2 bucket. Existing objects retain their storage class, and individual uploads can override the bucket default.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_account_identifier'
      - name: bucket_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_bucket_name'
      - $ref: '#/components/parameters/r2_cf-r2-jurisdiction'
      - name: cf-r2-storage-class
        in: header
        required: true
        schema:
          allOf:
          - $ref: '#/components/schemas/r2_storage_class'
          x-stainless-param: storage_class
      responses:
        '200':
          description: Patch Bucket response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/r2_v4_response'
                - properties:
                    result:
                      $ref: '#/components/schemas/r2_bucket'
                  type: object
        4XX:
          description: Get Bucket response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
      security:
      - api_token: []
      tags:
      - R2 Bucket
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.r2.bucket.write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: r2.buckets
      x-fern-sdk-method-name: edit
    put:
      operationId: r2-create-bucket-by-name
      summary: Create Bucket (by name)
      description: Creates a new R2 bucket using the name from the URL path. Similar to `r2-create-bucket` (POST), but the bucket name comes from the path and the optional storage class is supplied via the `cf-r2-storage-class` header. There is no request body. Unlike the POST variant, this endpoint does not accept a location hint — the bucket is placed in the R2 region for the caller's edge colo. Use the POST variant if you need to set a `locationHint`.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_account_identifier'
      - name: bucket_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_bucket_name'
      - $ref: '#/components/parameters/r2_cf-r2-jurisdiction'
      - name: cf-r2-storage-class
        in: header
        schema:
          allOf:
          - $ref: '#/components/schemas/r2_storage_class'
          x-stainless-param: storage_class
      responses:
        '200':
          description: Create Bucket response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/r2_v4_response'
                - properties:
                    result:
                      $ref: '#/components/schemas/r2_bucket'
                  type: object
        4XX:
          description: Create Bucket response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
      security:
      - api_token: []
      tags:
      - R2 Bucket
      x-api-token-group:
      - Workers R2 Storage Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: r2.buckets
      x-fern-sdk-method-name: create-by-name
      x-forge-hidden: true
  /accounts/{account_id}/r2/buckets/{bucket_name}/cors:
    delete:
      operationId: r2-delete-bucket-cors-policy
      summary: Delete Bucket CORS Policy
      description: Delete the CORS policy for a bucket.
      parameters:
      - name: bucket_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_bucket_name'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_account_identifier'
      - $ref: '#/components/parameters/r2_cf-r2-jurisdiction'
      responses:
        '200':
          description: Success Response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/r2_v4_response'
                - type: object
        4XX:
          description: Error Response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
      security:
      - api_token: []
      tags:
      - R2 Bucket
      x-fern-availability: generally-available
      x-fern-sdk-group-name: r2.buckets.cors
      x-fern-sdk-method-name: delete
      x-forge-require-confirmation: This removes the R2 bucket's CORS policy. Browser requests that depend on these cross-origin permissions may fail.
    get:
      operationId: r2-get-bucket-cors-policy
      summary: Get Bucket CORS Policy
      description: Get the CORS policy for a bucket.
      parameters:
      - name: bucket_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_bucket_name'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_account_identifier'
      - $ref: '#/components/parameters/r2_cf-r2-jurisdiction'
      responses:
        '200':
          description: Success Response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/r2_v4_response'
                - properties:
                    result:
                      type: object
                      properties:
                        rules:
                          type: array
                          items:
                            $ref: '#/components/schemas/r2_cors-rule'
                  type: object
        4XX:
          description: Error Response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
      security:
      - api_token: []
      tags:
      - R2 Bucket
      x-fern-availability: generally-available
      x-fern-sdk-group-name: r2.buckets.cors
      x-fern-sdk-method-name: get
    put:
      operationId: r2-put-bucket-cors-policy
      summary: Set Bucket CORS Policy
      description: Replaces the Cross-Origin Resource Sharing (CORS) rules for an R2 bucket. Rules specify which origins, methods, and headers are allowed for browser requests to objects in the bucket.
      parameters:
      - name: bucket_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_bucket_name'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_account_identifier'
      - $ref: '#/components/parameters/r2_cf-r2-jurisdiction'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rules:
                  type: array
                  items:
                    $ref: '#/components/schemas/r2_cors-rule'
      responses:
        '200':
          description: Success Response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/r2_v4_response'
                - type: object
        4XX:
          description: Error Response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
      security:
      - api_token: []
      tags:
      - R2 Bucket
      x-fern-availability: generally-available
      x-fern-sdk-group-name: r2.buckets.cors
      x-fern-sdk-method-name: update
      x-forge-require-confirmation: This replaces the R2 bucket's CORS policy. Browser requests that relied on the previous rules may fail.
  /accounts/{account_id}/r2/buckets/{bucket_name}/domains/custom:
    get:
      operationId: r2-list-custom-domains
      summary: List Custom Domains of Bucket
      description: Gets a list of all custom domains registered with an existing R2 bucket.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_account_identifier'
      - name: bucket_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_bucket_name'
      - $ref: '#/components/parameters/r2_cf-r2-jurisdiction'
      responses:
        '200':
          description: List Custom Domains response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/r2_v4_response'
                - properties:
                    result:
                      $ref: '#/components/schemas/r2_list_custom_domains_response'
                  type: object
        4XX:
          description: List Custom Domains response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
      security:
      - api_token: []
      tags:
      - R2 Bucket
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.r2.bucket.read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: r2.buckets.domains.custom
      x-fern-sdk-method-name: list
    post:
      operationId: r2-add-custom-domain
      summary: Attach Custom Domain To Bucket
      description: Register a new custom domain for an existing R2 bucket.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_account_identifier'
      - name: bucket_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_bucket_name'
      - $ref: '#/components/parameters/r2_cf-r2-jurisdiction'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/r2_add_custom_domain_request'
      responses:
        '200':
          description: Add Custom Domain response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/r2_v4_response'
                - properties:
                    result:
                      $ref: '#/components/schemas/r2_add_custom_domain_response'
                  type: object
        4XX:
          description: Add Custom Domain response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
      security:
      - api_token: []
      tags:
      - R2 Bucket
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.r2.bucket.write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: r2.buckets.domains.custom
      x-fern-sdk-method-name: create
  /accounts/{account_id}/r2/buckets/{bucket_name}/domains/custom/{domain}:
    delete:
