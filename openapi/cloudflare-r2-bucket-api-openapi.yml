components:
  schemas:
    r2_enable_sippy_aws:
      properties:
        destination:
          description: R2 bucket to copy objects to.
          type: object
          properties:
            accessKeyId:
              description: 'ID of a Cloudflare API token.

                This is the value labelled "Access Key ID" when creating an API.

                token from the [R2 dashboard](https://dash.cloudflare.com/?to=/:account/r2/api-tokens).


                Sippy will use this token when writing objects to R2, so it is

                best to scope this token to the bucket you''re enabling Sippy for.

                '
              type: string
            provider:
              type: string
              enum:
              - r2
              x-auditable: true
            secretAccessKey:
              description: 'Value of a Cloudflare API token.

                This is the value labelled "Secret Access Key" when creating an API.

                token from the [R2 dashboard](https://dash.cloudflare.com/?to=/:account/r2/api-tokens).


                Sippy will use this token when writing objects to R2, so it is

                best to scope this token to the bucket you''re enabling Sippy for.

                '
              type: string
              x-sensitive: true
        source:
          description: AWS S3 bucket to copy objects from.
          type: object
          properties:
            accessKeyId:
              description: Access Key ID of an IAM credential (ideally scoped to a single S3 bucket).
              type: string
            bucket:
              description: Name of the AWS S3 bucket.
              type: string
              x-auditable: true
            provider:
              type: string
              enum:
              - aws
              x-auditable: true
            region:
              description: AWS region containing the source S3 bucket.
              type: string
              x-auditable: true
            secretAccessKey:
              description: Secret Access Key of an IAM credential (ideally scoped to a single S3 bucket).
              type: string
              x-sensitive: true
    r2_managed_domain_response:
      type: object
      properties:
        bucketId:
          description: Bucket ID.
          type: string
          maxLength: 32
          x-auditable: true
        domain:
          description: Domain name of the bucket's r2.dev domain.
          type: string
          x-auditable: true
        enabled:
          description: Whether this bucket is publicly accessible at the r2.dev domain.
          type: boolean
          x-auditable: true
      example:
        bucketId: 0113a9e4549cf9b1ff1bf56e04da0cef
        domain: pub-0113a9e4549cf9b1ff1bf56e04da0cef.r2.dev
        enabled: true
      required:
      - bucketId
      - domain
      - enabled
    r2_r2_create_storage_class_migration_job_request:
      description: Request body that creates a storage-class migration job.
      type: object
      properties:
        destinationStorageClass:
          type: string
          enum:
          - Standard
          - InfrequentAccess
        jobType:
          type: string
          enum:
          - storageClassMigration
        sourceStorageClass:
          type: string
          enum:
          - Standard
          - InfrequentAccess
      additionalProperties: false
      required:
      - jobType
      title: Storage Class Migration Job
    r2_add_custom_domain_request:
      type: object
      properties:
        ciphers:
          description: An allowlist of ciphers for TLS termination. These ciphers must be in the BoringSSL format.
          type: array
          items:
            type: string
          x-auditable: true
        domain:
          description: Name of the custom domain to be added.
          type: string
          x-auditable: true
        enabled:
          description: Whether to enable public bucket access at the custom domain. If undefined, the domain will be enabled.
          type: boolean
          x-auditable: true
        minTLS:
          description: Minimum TLS Version the custom domain will accept for incoming connections. If not set, defaults to 1.0.
          type: string
          enum:
          - '1.0'
          - '1.1'
          - '1.2'
          - '1.3'
          x-auditable: true
        zoneId:
          description: Zone ID of the custom domain.
          type: string
          x-auditable: true
      example:
        domain: prefix.example-domain.com
        enabled: true
        zoneId: 36ca64a6d92827b8a6b90be344bb1bfd
      required:
      - domain
      - zoneId
      - enabled
    r2_sippy:
      type: object
      properties:
        destination:
          description: Details about the configured destination bucket.
          type: object
          properties:
            accessKeyId:
              description: 'ID of the Cloudflare API token used when writing objects to this

                bucket.

                '
              type: string
            account:
              type: string
              x-auditable: true
            bucket:
              description: Name of the bucket on the provider.
              type: string
              x-auditable: true
            provider:
              type: string
              enum:
              - r2
              x-auditable: true
        enabled:
          description: State of Sippy for this bucket.
          type: boolean
          x-auditable: true
        source:
          description: Details about the configured source bucket.
          type: object
          properties:
            bucket:
              description: Name of the bucket on the provider (AWS, GCS only).
              type:
              - string
              - 'null'
              x-auditable: true
            bucketUrl:
              description: S3-compatible URL (Generic S3-compatible providers only).
              type:
              - string
              - 'null'
              x-auditable: true
            container:
              description: Name of the Azure Blob Storage container (Azure only).
              type:
              - string
              - 'null'
              x-auditable: true
            provider:
              type: string
              enum:
              - aws
              - gcs
              - s3
              - azure
              x-auditable: true
            region:
              description: Region where the bucket resides (AWS only).
              type:
              - string
              - 'null'
              x-auditable: true
    r2_bucket:
      description: A single R2 bucket.
      type: object
      properties:
        creation_date:
          description: Creation timestamp.
          type: string
        jurisdiction:
          $ref: '#/components/schemas/r2_jurisdiction'
        location:
          $ref: '#/components/schemas/r2_bucket_location'
        name:
          $ref: '#/components/schemas/r2_bucket_name'
        storage_class:
          $ref: '#/components/schemas/r2_storage_class'
    r2_lifecycle-age-condition:
      description: Condition for lifecycle transitions to apply after an object reaches an age in seconds.
      type: object
      properties:
        maxAge:
          type: integer
          x-auditable: true
        type:
          type: string
          enum:
          - Age
          x-auditable: true
      required:
      - type
      - maxAge
    r2_get_custom_domain_response:
      type: object
      properties:
        ciphers:
          description: An allowlist of ciphers for TLS termination. These ciphers must be in the BoringSSL format.
          type: array
          items:
            type: string
          x-auditable: true
        domain:
          description: Domain name of the custom domain to be added.
          type: string
          x-auditable: true
        enabled:
          description: Whether this bucket is publicly accessible at the specified custom domain.
          type: boolean
          x-auditable: true
        minTLS:
          description: Minimum TLS Version the custom domain will accept for incoming connections. If not set, defaults to 1.0.
          type: string
          enum:
          - '1.0'
          - '1.1'
          - '1.2'
          - '1.3'
          x-auditable: true
        status:
          type: object
          properties:
            ownership:
              description: Ownership status of the domain.
              type: string
              enum:
              - pending
              - active
              - deactivated
              - blocked
              - error
              - unknown
              x-auditable: true
            ssl:
              description: SSL certificate status.
              type: string
              enum:
              - initializing
              - pending
              - active
              - deactivated
              - error
              - unknown
              x-auditable: true
          required:
          - ssl
          - ownership
        zoneId:
          description: Zone ID of the custom domain resides in.
          type: string
          x-auditable: true
        zoneName:
          description: Zone that the custom domain resides in.
          type: string
          x-auditable: true
      example:
        domain: prefix.example-domain.one.com
        enabled: false
        status:
          ownership: deactivated
          ssl: pending
        zoneId: 36ca64a6d92827b8a6b90be344bb1bfd
        zoneName: example-domain.one.com
      required:
      - domain
      - status
      - enabled
    r2_remove_custom_domain_response:
      type: object
      properties:
        domain:
          description: Name of the removed custom domain.
          type: string
          x-auditable: true
      example:
        domain: example-domain/custom-domain.com
      required:
      - domain
    r2_cors-rule:
      type: object
      properties:
        allowed:
          description: Object specifying allowed origins, methods and headers for this CORS rule.
          type: object
          properties:
            headers:
              description: Specifies the value for the Access-Control-Allow-Headers header R2 sets when requesting objects in this bucket from a browser. Cross-origin requests that include custom headers (e.g. x-user-id) should specify these headers as AllowedHeaders.
              type: array
              items:
                example: x-requested-by
                type: string
                x-auditable: true
            methods:
              description: Specifies the value for the Access-Control-Allow-Methods header R2 sets when requesting objects in a bucket from a browser.
              type: array
              items:
                enum:
                - GET
                - PUT
                - POST
                - DELETE
                - HEAD
                type: string
                x-auditable: true
            origins:
              description: Specifies the value for the Access-Control-Allow-Origin header R2 sets when requesting objects in a bucket from a browser.
              type: array
              items:
                example: http://localhost:3000
                type: string
                x-auditable: true
          required:
          - methods
          - origins
        exposeHeaders:
          description: Specifies the headers that can be exposed back, and accessed by, the JavaScript making the cross-origin request. If you need to access headers beyond the safelisted response headers, such as Content-Encoding or cf-cache-status, you must specify it here.
          type: array
          items:
            example: Content-Encoding
            type: string
            x-auditable: true
        id:
          description: Identifier for this rule.
          type: string
          example: Allow Local Development
          x-auditable: true
        maxAgeSeconds:
          description: Specifies the amount of time (in seconds) browsers are allowed to cache CORS preflight responses. Browsers may limit this to 2 hours or less, even if the maximum value (86400) is specified.
          type: number
          example: 3600
          x-auditable: true
      required:
      - allowed
    r2_lock-rule-indefinite-condition:
      description: Condition to apply a lock rule indefinitely.
      type: object
      properties:
        type:
          type: string
          enum:
          - Indefinite
          x-auditable: true
      required:
      - type
    r2_lock-rule-age-condition:
      description: Condition to apply a lock rule to an object for how long in seconds.
      type: object
      properties:
        maxAgeSeconds:
          type: integer
          example: 100
          x-auditable: true
        type:
          type: string
          enum:
          - Age
          x-auditable: true
      required:
      - type
      - maxAgeSeconds
    r2_add_custom_domain_response:
      type: object
      properties:
        ciphers:
          description: An allowlist of ciphers for TLS termination. These ciphers must be in the BoringSSL format.
          type: array
          items:
            type: string
          x-auditable: true
        domain:
          description: Domain name of the affected custom domain.
          type: string
          x-auditable: true
        enabled:
          description: Whether this bucket is publicly accessible at the specified custom domain.
          type: boolean
        minTLS:
          description: Minimum TLS Version the custom domain will accept for incoming connections. If not set, defaults to 1.0.
          type: string
          enum:
          - '1.0'
          - '1.1'
          - '1.2'
          - '1.3'
          x-auditable: true
        zoneId:
          description: Zone ID of the custom domain.
          type: string
          x-auditable: true
      example:
        domain: example-domain.com
        enabled: true
        zoneId: 36ca64a6d92827b8a6b90be344bb1bfd
      required:
      - domain
      - enabled
      - zoneId
    r2_queue_identifier:
      description: ID of the Cloudflare Queue that receives notifications for matching R2 object events.
      type: string
      example: 11111aa1-11aa-111a-a1a1-a1a111a11a11
      maxLength: 32
      x-auditable: true
    r2_lock-rule-date-condition:
      description: Condition to apply a lock rule to an object until a specific date.
      type: object
      properties:
        date:
          type: string
          format: date-time
          x-auditable: true
        type:
          type: string
          enum:
          - Date
          x-auditable: true
      required:
      - type
      - date
    r2_r2-action:
      type: string
      enum:
      - PutObject
      - CopyObject
      - DeleteObject
      - CompleteMultipartUpload
      - LifecycleDeletion
      x-auditable: true
    r2_r2_prefix_delete_job:
      description: 'Descriptor of a prefix-delete job. An empty prefix indicates a job that empties the

        whole bucket.

        '
      type: object
      properties:
        endTime:
          description: 'When the job finished. Absent while the job is still `ENQUEUED` or `RUNNING`.

            '
          type: string
          format: date-time
        id:
          description: Unique identifier used to poll the job.
          type: string
        jobType:
          description: The job kind.
          type: string
          enum:
          - prefixDelete
        prefixDelete:
          description: Details specific to the prefix-delete job.
          type: object
          properties:
            deletedObjects:
              description: Number of objects deleted by the job so far.
              type: integer
              example: 0
            isBucketClear:
              description: 'True when the job was created to clear the entire bucket. This field can be absent

                on jobs created before Empty Bucket job tracking was introduced.

                '
              type: boolean
            prefix:
              description: The prefix matched against object keys. An empty string means the entire bucket.
              type: string
              example: path/to/
          required:
          - prefix
          - deletedObjects
        startTime:
          description: When the job was created.
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/r2_r2_bucket_job_status'
      required:
      - id
      - jobType
      - status
      - startTime
      - prefixDelete
    r2_messages:
      type: array
      items:
        type: string
    r2_v4_response:
      type: object
      properties:
        errors:
          $ref: '#/components/schemas/r2_errors'
        messages:
          $ref: '#/components/schemas/r2_messages'
        result:
          type: object
        success:
          description: Whether the API call was successful.
          type: boolean
          enum:
          - true
      required:
      - success
      - errors
      - messages
      - result
    r2_result_info:
      type: object
      properties:
        cursor:
          description: A continuation token that should be used to fetch the next page of results.
          type: string
