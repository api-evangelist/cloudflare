          type: array
          items:
            type: string
            x-auditable: true
        parentAccessKeyId:
          description: Access key ID of the parent R2 API token. The temporary credentials cannot exceed this token's permissions.
          type: string
        permission:
          description: Permissions allowed on the credentials.
          type: string
          enum:
          - admin-read-write
          - admin-read-only
          - object-read-write
          - object-read-only
          x-auditable: true
        prefixes:
          description: Optional prefix paths to scope the credentials to.
          type: array
          items:
            type: string
            x-auditable: true
        ttlSeconds:
          description: Lifetime of the temporary credentials in seconds, up to 604800 seconds (7 days).
          type: number
          default: 900
          maximum: 604800
          x-auditable: true
      example:
        bucket: example-bucket
        objects:
        - example-object
        parentAccessKeyId: example-access-key-id
        permission: object-read-write
        prefixes:
        - example-prefix/
        ttlSeconds: 3600
      required:
