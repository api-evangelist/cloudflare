                classes always differ.

                '
              type: string
              enum:
              - Standard
              - InfrequentAccess
            failedBytes:
              description: Payload bytes belonging to failed object versions.
              type: integer
              minimum: 0
            failedObjects:
              description: Number of object versions that failed migration.
              type: integer
              minimum: 0
            migratedBytes:
              description: Object payload bytes migrated successfully. Present for Metadata Worker jobs.
              type: integer
              minimum: 0
            migratedMetadataBytes:
              description: Object metadata bytes migrated successfully. Present for Metadata Worker jobs.
              type: integer
              minimum: 0
            migratedObjects:
              description: Number of object versions migrated successfully.
              type: integer
              minimum: 0
            skippedBytes:
              description: Payload bytes belonging to skipped object versions.
              type: integer
              minimum: 0
            skippedObjects:
              description: Number of object versions skipped.
              type: integer
              minimum: 0
            sourceStorageClass:
              description: The storage class objects are migrated from.
              type: string
              enum:
              - Standard
              - InfrequentAccess
          required:
          - sourceStorageClass
          - destinationStorageClass
          - migratedObjects
      required:
      - id
      - jobType
      - status
      - startTime
      - storageClassMigration
