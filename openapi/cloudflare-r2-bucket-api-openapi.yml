  /accounts/{account_id}/r2/buckets/{bucket_name}/jobs:
    get:
      operationId: r2-list-bucket-jobs
      summary: List Bucket Jobs
      description: 'Lists background jobs for an R2 bucket, including prefix-delete (and bucket-emptying)

        jobs and storage-class migration jobs. Jobs of every type are returned unless `jobType`

        is provided.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_account_identifier'
      - name: bucket_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_bucket_name'
      - $ref: '#/components/parameters/r2_cf-r2-jurisdiction'
      - name: jobType
        in: query
        description: Restricts results to jobs of the specified type.
        schema:
          type: string
          enum:
          - prefixDelete
          - storageClassMigration
      - name: status
        in: query
        description: Restricts results to jobs with the specified status. `jobType` is required when this parameter is provided.
        schema:
          $ref: '#/components/schemas/r2_r2_bucket_job_status'
      - name: maxKeys
        in: query
        description: Maximum number of jobs to return.
        schema:
          type: integer
          maximum: 1000
          minimum: 0
      - name: continuationToken
        in: query
        description: Pagination token received as `nextContinuationToken` in the previous response.
        schema:
          type: string
      responses:
        '200':
          description: List Bucket Jobs response.
          content:
            application/json:
              examples:
                running-job:
                  summary: A bucket-emptying job is still running
                  value:
                    errors: []
                    messages: []
                    result:
                      jobs:
                      - id: 7f24658b-31d7-4b91-9a12-cb5a2c99b294
                        jobType: prefixDelete
                        prefixDelete:
                          deletedObjects: 1350
                          isBucketClear: true
                          prefix: ''
                        startTime: '2026-07-20T12:00:00Z'
                        status: RUNNING
                      nextContinuationToken: eyJ2IjoxLCJzdGFydEFmdGVyIjoiLi4uIn0=
                    success: true
              schema:
                allOf:
                - $ref: '#/components/schemas/r2_v4_response'
                - properties:
                    result:
                      $ref: '#/components/schemas/r2_r2_bucket_jobs_result'
                  type: object
        4XX:
          description: List Bucket Jobs response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
      security:
      - api_token: []
      tags:
      - R2 Bucket
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.edge.r2.bucket.read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: r2.buckets.jobs
      x-fern-sdk-method-name: list
    post:
      operationId: r2-create-bucket-job
      summary: Create Bucket Job
      description: 'Creates a background job for an R2 bucket. The `jobType` field selects the job:


        - **`prefixDelete`**: deletes every object whose key begins with `prefix`. A non-empty

        prefix must end in `/`. An empty prefix (`""`) empties the entire bucket.

        - **`storageClassMigration`**: migrates every object in the bucket between storage

        classes. `sourceStorageClass` and `destinationStorageClass` must be provided together

        and must differ; omitting both migrates from `InfrequentAccess` to `Standard`.


        Poll the returned `id` with the Get Bucket Job endpoint. Small prefix-delete jobs can

        finish synchronously and return `COMPLETED`. Objects uploaded after a background job

        starts are not affected by that job.


        For prefix-delete jobs: abort active multipart uploads before submitting the request,

        since a synchronously completed job does not abort them, and avoid writing objects or

        starting multipart uploads while a bucket-emptying job is in progress. Each request

        creates a distinct job, and the number of active prefix-delete jobs is limited per

        bucket; wait for an existing job to finish before retrying a request rejected with

        HTTP 429. A bucket cannot be emptied while event notifications are configured (HTTP 409

        / error code 10083). To protect a bucket with R2 Data Catalog enabled, send the

        `cf-r2-data-catalog-check` header; a conflict is returned with HTTP 409 / error code

        10081.


        Prefix-delete jobs require permission to delete objects; storage-class migration jobs

        require permission to write to the bucket.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_account_identifier'
      - name: bucket_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/r2_bucket_name'
      - $ref: '#/components/parameters/r2_cf-r2-jurisdiction'
      - name: cf-r2-data-catalog-check
        in: header
        description: For prefix-delete jobs, set this header to reject the request when R2 Data Catalog is enabled for the bucket.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            examples:
              delete-prefix:
                summary: Delete every object under a prefix
                value:
                  jobType: prefixDelete
                  prefix: logs/2026/
              empty-bucket:
                summary: Empty the entire bucket
                value:
                  jobType: prefixDelete
                  prefix: ''
              migrate-to-infrequent-access:
                summary: Migrate every object to Infrequent Access
                value:
                  destinationStorageClass: InfrequentAccess
                  jobType: storageClassMigration
                  sourceStorageClass: Standard
            schema:
              discriminator:
                mapping:
                  prefixDelete: '#/components/schemas/r2_create_prefix_delete_job_request'
                  storageClassMigration: '#/components/schemas/r2_create_storage_class_migration_job_request'
                propertyName: jobType
              oneOf:
              - $ref: '#/components/schemas/r2_r2_create_prefix_delete_job_request'
              - $ref: '#/components/schemas/r2_r2_create_storage_class_migration_job_request'
      responses:
        '200':
          description: The created job.
          content:
            application/json:
              examples:
                empty-bucket-completed:
                  summary: A small or already empty bucket completed immediately
                  value:
                    errors: []
                    messages: []
                    result:
                      endTime: '2026-07-20T12:00:00Z'
                      id: 69f94626-a3fe-47bc-9615-e791b4d53c53
                      jobType: prefixDelete
                      prefixDelete:
                        deletedObjects: 0
                        isBucketClear: true
                        prefix: ''
                      startTime: '2026-07-20T12:00:00Z'
                      status: COMPLETED
                    success: true
                empty-bucket-submitted:
                  summary: Empty Bucket job submitted
                  value:
                    errors: []
                    messages: []
                    result:
                      id: 7f24658b-31d7-4b91-9a12-cb5a2c99b294
                      jobType: prefixDelete
                      prefixDelete:
                        deletedObjects: 0
                        isBucketClear: true
                        prefix: ''
                      startTime: '2026-07-20T12:00:00Z'
                      status: ENQUEUED
                    success: true
                migration-submitted:
                  summary: Storage-class migration job submitted
                  value:
                    errors: []
                    messages: []
                    result:
                      id: 3c1f9a52-0b8e-4f5d-9d0e-4a1b2c3d4e5f
                      jobType: storageClassMigration
                      startTime: '2026-09-04T12:00:00Z'
                      status: ENQUEUED
                      storageClassMigration:
                        destinationStorageClass: InfrequentAccess
                        migratedObjects: 0
                        sourceStorageClass: Standard
                    success: true
              schema:
                allOf:
                - $ref: '#/components/schemas/r2_v4_response'
                - properties:
                    result:
                      $ref: '#/components/schemas/r2_r2_bucket_job'
                  type: object
        '409':
          description: 'Prefix-delete conflict. Event notification rules are still configured (error code

            10083), or the Data Catalog check was requested and R2 Data Catalog is enabled for

            the bucket (error code 10081). Remove the conflicting configuration before retrying.

            '
          content:
            application/json:
              examples:
                event-notifications-active:
                  summary: Event notification rules must be removed first
                  value:
                    errors:
                    - code: 10083
                      message: Remove all event notification rules from bucket (example-bucket) before emptying it (account 023e105f4ecef8ad9ca31a8372d0c353).
                    messages:
                    - Request failed.
                    result: null
                    success: false
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
        '429':
          description: Too many active prefix-delete or bucket-emptying jobs. Wait for an existing job to finish, then retry.
          content:
            application/json:
              examples:
                too-many-jobs:
                  summary: The per-bucket active job limit was reached
                  value:
                    errors:
                    - code: 10058
                      message: Too many concurrent prefix delete jobs for this bucket. Please wait for existing jobs to complete.
                    messages:
                    - Request failed.
                    result: null
                    success: false
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
        4XX:
          description: Create Bucket Job response failure. The request body may be invalid, the bucket may not exist, or the caller may not be authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/r2_v4_response_failure'
      security:
