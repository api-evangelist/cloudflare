          flagName: namespace
        namespace:
          hidden: true
    post:
      operationId: ai-search-namespace-create-instance
      summary: Create an AI Search instance (Search for Agents requires the default namespace)
      description: Create a new AI Search instance with the given configuration. If type is omitted or null, a non-blank HTTP(S) source infers web-crawler and an existing R2 bucket source infers r2. A missing or blank source without a type creates a managed upload-only instance. Search for Agents instances require the default namespace.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          example: c3dc5f0b34a14ff8e1b3ec04895e1b22
      - name: name
        in: path
        description: Namespace name
        required: true
        schema:
          type: string
        example: my-namespace
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ai_gateway_id:
                  type:
                  - string
                  - 'null'
                  x-auditable: true
                ai_search_model:
                  description: A Workers AI model ID or an AI Gateway model ID compatible with the OpenAI Chat Completions API. An empty string uses the configured or default model.
                  type:
                  - string
                  - 'null'
                  x-auditable: true
                cache:
                  type: boolean
                  default: true
                  x-auditable: true
                cache_threshold:
                  type: string
                  default: close_enough
                  enum:
                  - super_strict_match
                  - close_enough
                  - flexible_friend
                  - anything_goes
                  x-auditable: true
                cache_ttl:
                  description: 'Cache entry TTL in seconds. Allowed values: 600 (10min), 1800 (30min), 3600 (1h), 7200 (2h), 21600 (6h), 43200 (12h), 86400 (24h), 172800 (48h), 259200 (72h), 518400 (6d).'
                  default: 172800
                  anyOf:
                  - enum:
                    - 600
                    type: number
                  - enum:
                    - 1800
                    type: number
                  - enum:
                    - 3600
                    type: number
                  - enum:
                    - 7200
                    type: number
                  - enum:
                    - 21600
                    type: number
                  - enum:
                    - 43200
                    type: number
                  - enum:
                    - 86400
                    type: number
                  - enum:
                    - 172800
                    type: number
                  - enum:
                    - 259200
                    type: number
                  - enum:
                    - 518400
                    type: number
                  x-auditable: true
                chunk:
                  type: boolean
                  default: true
                  x-auditable: true
                chunk_overlap:
                  type: integer
                  default: 10
                  maximum: 30
                  minimum: 0
                  x-auditable: true
                chunk_size:
                  type: integer
                  minimum: 64
                  x-auditable: true
                custom_metadata:
                  type: array
                  items:
                    properties:
                      data_type:
                        type: string
                        enum:
                        - text
                        - number
                        - boolean
                        - datetime
                      field_name:
                        type: string
                        maxLength: 64
                        minLength: 1
                    required:
                    - field_name
                    - data_type
                    type: object
                  maxItems: 5
                  x-auditable: true
                embedding_model:
                  type:
                  - string
                  - 'null'
                  x-auditable: true
                fusion_method:
                  type: string
                  default: rrf
                  enum:
                  - max
                  - rrf
                  x-auditable: true
                hybrid_search_enabled:
                  description: Deprecated — use index_method instead. Defaults to true for new instances; set false to create a vector-only instance.
                  type: boolean
                  default: true
                  deprecated: true
                  x-auditable: true
                id:
                  description: AI Search instance ID. Lowercase alphanumeric, hyphens, and underscores.
                  type: string
                  example: my-ai-search
                  maxLength: 64
                  minLength: 1
                  pattern: ^[a-z0-9_]+(?:-[a-z0-9_]+)*$
                  x-auditable: true
                index_method:
                  description: Controls which storage backends are used during indexing. Defaults to vector and keyword indexing for new instances.
                  type: object
                  default:
                    keyword: true
                    vector: true
                  properties:
                    keyword:
                      description: Enable keyword (BM25) storage backend.
                      type: boolean
                    vector:
                      description: Enable vector (embedding) storage backend.
                      type: boolean
                  required:
                  - vector
                  - keyword
                  x-auditable: true
                indexing_options:
                  type:
                  - object
                  - 'null'
                  properties:
                    keyword_tokenizer:
                      description: Tokenizer used for keyword search indexing. porter provides word-level tokenization with Porter stemming (good for natural language queries). trigram enables character-level substring matching (good for partial matches, code, identifiers). Changing this triggers a full re-index. Defaults to porter.
                      type: string
                      default: porter
                      enum:
                      - porter
                      - trigram
                    use_ocr:
                      description: Enables OCR ingestion for PDFs and images. Changing this triggers a full re-index. Defaults to false.
                      type: boolean
                      default: false
                  x-auditable: true
                max_num_results:
                  type: integer
                  default: 10
                  maximum: 50
                  minimum: 1
                  x-auditable: true
                metadata:
                  type: object
                  properties:
                    created_from_aisearch_wizard:
                      type: boolean
                    worker_domain:
                      type: string
                  x-auditable: true
                public_endpoint_params:
                  type: object
                  properties:
                    authorized_hosts:
                      type: array
                      items:
                        type: string
                    chat_completions_endpoint:
                      type: object
                      properties:
                        disabled:
                          description: Disable chat completions endpoint for this public endpoint
                          type: boolean
                          default: false
                    custom_domains:
                      description: Custom domain hostnames that alias this public endpoint. GET and create responses return the current set; on update (PUT) this field is only echoed back when supplied in the request body, otherwise it is null (omit it to leave domains unchanged).
                      type:
                      - array
                      - 'null'
                      items:
                        description: Custom domain hostname (must be a Verified zone on this account).
                        example: search.example.com
                        maxLength: 253
                        minLength: 1
                        type: string
                      maxItems: 1
                      x-auditable: true
                    default_domain_enabled:
                      description: When false, the instance is reachable only via a registered custom domain and the default <public_endpoint_id>.search.ai.cloudflare.com host returns 404. Requires at least one custom domain. Defaults to true. public_endpoint_params is replaced wholesale on update, so resend default_domain_enabled on every update to keep the default host off — omitting it resets to true.
                      type: boolean
                      default: true
                      x-auditable: true
                    enabled:
                      type: boolean
                      default: false
                    mcp:
                      type: object
                      properties:
                        description:
                          type: string
                          default: Finds exactly what you're looking for
                        disabled:
                          description: Disable MCP endpoint for this public endpoint
                          type: boolean
                          default: false
                    rate_limit:
                      type: object
                      properties:
                        period_ms:
                          type: integer
                          maximum: 3600000
                          minimum: 60000
                        requests:
                          type: integer
                          minimum: 1
                        technique:
                          type: string
                          enum:
                          - fixed
                          - sliding
                    search_endpoint:
                      type: object
                      properties:
                        disabled:
                          description: Disable search endpoint for this public endpoint
                          type: boolean
                          default: false
                  x-auditable: true
                reranking:
                  type: boolean
                  default: false
                  x-auditable: true
                reranking_model:
                  type:
                  - string
                  - 'null'
                  x-auditable: true
                retrieval_options:
                  type:
                  - object
                  - 'null'
                  properties:
                    boost_by:
                      description: Metadata fields to boost search results by. Each entry specifies a metadata field and an optional direction. Direction defaults to 'asc' for numeric/datetime fields and 'exists' for text/boolean fields. Fields must match 'timestamp' or a defined custom_metadata field.
                      type: array
                      items:
                        properties:
                          direction:
                            description: Boost direction. 'desc' = higher values rank higher (e.g. newer timestamps). 'asc' = lower values rank higher. 'exists' = boost chunks that have the field. 'not_exists' = boost chunks that lack the field. Optional — defaults to 'asc' for numeric/datetime fields, 'exists' for text/boolean fields.
                            type: string
                            enum:
                            - asc
                            - desc
                            - exists
                            - not_exists
                          field:
                            description: Metadata field name to boost by. Use 'timestamp' for document freshness, or any custom_metadata field. Numeric and datetime fields support all four directions (asc, desc, exists, not_exists); text/boolean fields only support exists/not_exists.
                            type: string
                            example: timestamp
                            maxLength: 64
                            minLength: 1
                        required:
                        - field
                        type: object
                      example:
                      - direction: desc
                        field: timestamp
                      maxItems: 3
                    keyword_match_mode:
                      description: Controls which documents are candidates for BM25 scoring. 'and' restricts candidates to documents containing all query terms; 'or' includes any document containing at least one term, ranked by BM25 relevance. When omitted on an update, the existing stored value is preserved; when never set, search falls back to 'and'.
                      type: string
                      enum:
                      - and
                      - or
                  x-auditable: true
                rewrite_model:
                  description: A Workers AI model ID or an AI Gateway model ID compatible with the OpenAI Chat Completions API. An empty string uses the configured or default model.
                  type:
                  - string
                  - 'null'
                  x-auditable: true
                rewrite_query:
                  type: boolean
                  default: false
                  x-auditable: true
                score_threshold:
                  type: number
                  default: 0.4
                  maximum: 1
                  minimum: 0
                  x-auditable: true
                source:
                  type:
                  - string
                  - 'null'
                  x-auditable: true
                source_params:
                  type:
                  - object
                  - 'null'
                  properties:
                    exclude_items:
                      description: 'List of path patterns to exclude. Uses micromatch glob syntax: * matches within a path segment, ** matches across path segments (e.g., /admin/** matches /admin/users and /admin/settings/advanced). Most accounts are limited to 10 rules; contact support to raise it.'
                      type: array
                      items:
                        maxLength: 500
                        pattern: ^[*/\\]?[\w\-/.\\?*:=&%]+$
                        type: string
                      example:
                      - /admin/**
                      - /private/**
                      - '**\temp\**'
                      maxItems: 10
                    include_items:
                      description: 'List of path patterns to include. Uses micromatch glob syntax: * matches within a path segment, ** matches across path segments (e.g., /blog/** matches /blog/post and /blog/2024/post). Most accounts are limited to 10 rules; contact support to raise it.'
                      type: array
                      items:
                        maxLength: 500
                        pattern: ^[*/\\]?[\w\-/.\\?*:=&%]+$
                        type: string
                      example:
                      - /blog/**
                      - /docs/**/*.html
                      - '**\blog\**.html'
                      maxItems: 10
                    prefix:
                      type: string
                    r2_jurisdiction:
                      type: string
                      default: default
                    web_crawler:
                      type: object
                      default:
                        parse_type: sitemap
                      properties:
                        discover_options:
                          description: Options for parse_type 'discover', where Browser Run discovers URLs by link following and sitemaps. Ignored for 'sitemap'.
                          type: object
                          properties:
                            depth:
                              description: Maximum link-follow depth from the seed URL.
                              type: number
                              example: 5
                              default: 5
                              maximum: 100000
                              minimum: 1
                            include_external_links:
                              description: Follow links that point outside the source domain. Must stay `false` — discover crawls are restricted to the zone you own.
                              type: boolean
                              example: false
                              default: false
                            include_subdomains:
                              description: Follow links to subdomains of the source host.
                              type: boolean
                              example: false
                              default: false
                            limit:
                              description: Maximum number of pages to crawl (1-100000).
                              type: number
                              example: 10000
                              default: 100000
                              maximum: 100000
                              minimum: 1
                            max_age:
                              description: Maximum content age in seconds to accept (0–604800).
                              type: number
                              example: 86400
                              default: 86400
                              maximum: 604800
                              minimum: 0
                            source:
                              description: 'Where the crawler looks for URLs: ''sitemaps'' reads sitemap XML only, ''links'' follows page links only, ''all'' does both.'
                              type: string
                              example: all
                              default: all
                              enum:
                              - all
                              - sitemaps
                              - links
                        parse_options:
                          type: object
                          properties:
                            content_selector:
                              description: List of path-to-selector mappings for extracting specific content from crawled pages. Each entry pairs a URL glob pattern with a CSS selector. The first matching path wins. Only the matched HTML fragment is stored and indexed. Omit the field to disable content selection — empty arrays are rejected.
                              type: array
                              items:
                                properties:
                                  path:
                                    description: 'Glob pattern to match against the page URL path. Uses standard glob syntax: * matches within a segment, ** crosses directories.'
                                    type: string
                                    example: '**/article/**'
                                    maxLength: 200
                                    minLength: 1
                                  selector:
                                    description: CSS selector to extract content from pages matching the path pattern. Must not contain disallowed characters (;, `, $, {, }, \). Must target a single element; if multiple elements match, the selector is ignored and the full page is used.
                                    type: string
                                    example: article div.post-body
                                    maxLength: 200
                                    minLength: 1
                                required:
                                - path
                                - selector
                                type: object
                              example:
                              - path: '**/blog/**'
                                selector: article div.post-body
                              - path: '**/docs/**'
                                selector: main
                              maxItems: 10
                              minItems: 1
                            include_headers:
                              description: Up to 5 custom HTTP headers sent with each crawl request. Names must be RFC-7230 token characters (no spaces, colons, or control characters); values must be HTAB + printable ASCII (no CR/LF).
                              type: object
                              example:
                                cache-control: no-cache, no-store
                              additionalProperties:
                                maxLength: 8192
                                pattern: ^[\t\x20-\x7E]*$
                                type: string
                            include_images:
                              type: boolean
                              default: false
                            specific_sitemaps:
                              description: List of specific sitemap URLs to use for crawling. Only valid when parse_type is 'sitemap'.
                              type: array
                              items:
                                format: uri
                                type: string
                              example:
                              - https://example.com/sitemap.xml
                              - https://example.com/blog-sitemap.xml
                              maxItems: 10
                            use_browser_rendering:
                              type: boolean
                              default: true
                        parse_type:
                          description: How URLs are discovered. 'sitemap' reads XML sitemaps; 'discover' follows links recursively and requires the source to be a Verified zone on this account.
                          type: string
                          example: sitemap
                          default: sitemap
                          enum:
                          - sitemap
                          - discover
                  x-auditable: true
                sync_interval:
                  description: 'Interval between automatic syncs, in seconds. Allowed values: 900 (15min), 1800 (30min), 3600 (1h), 7200 (2h), 14400 (4h), 21600 (6h), 43200 (12h), 86400 (24h).'
                  default: 21600
                  anyOf:
                  - enum:
                    - 900
                    type: number
                  - enum:
                    - 1800
                    type: number
                  - enum:
                    - 3600
                    type: number
                  - enum:
                    - 7200
                    type: number
                  - enum:
                    - 14400
                    type: number
                  - enum:
                    - 21600
                    type: number
                  - enum:
                    - 43200
                    type: number
                  - enum:
                    - 86400
                    type: number
                  x-auditable: true
                token_id:
                  type: string
                  format: uuid
                  x-auditable: true
                type:
                  description: Source type. When omitted or null with a non-blank source, HTTP(S) URLs infer web-crawler and existing R2 bucket names infer r2. A missing or blank source without a type uses managed upload-only storage.
                  type:
                  - string
                  - 'null'
                  enum:
                  - r2
                  - web-crawler
                  - null
                  x-auditable: true
              required:
              - id
      responses:
        '201':
          description: Returns the new instance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      ai_gateway_id:
                        type:
                        - string
                        - 'null'
                        x-auditable: true
                      ai_search_model:
                        description: A Workers AI model ID or an AI Gateway model ID compatible with the OpenAI Chat Completions API. An empty string uses the configured or default model.
                        type:
                        - string
                        - 'null'
                        x-auditable: true
                      cache:
                        type: boolean
                        default: true
                        x-auditable: true
                      cache_threshold:
                        type: string
                        default: close_enough
                        enum:
                        - super_strict_match
                        - close_enough
                        - flexible_friend
                        - anything_goes
                        x-auditable: true
                      cache_ttl:
                        description: 'Cache entry TTL in seconds. Allowed values: 600 (10min), 1800 (30min), 3600 (1h), 7200 (2h), 21600 (6h), 43200 (12h), 86400 (24h), 172800 (48h), 259200 (72h), 518400 (6d).'
                        default: 172800
                        anyOf:
                        - enum:
                          - 600
                          type: number
                        - enum:
                          - 1800
                          type: number
                        - enum:
                          - 3600
                          type: number
                        - enum:
                          - 7200
                          type: number
                        - enum:
                          - 21600
                          type: number
                        - enum:
                          - 43200
                          type: number
                        - enum:
                          - 86400
                          type: number
                        - enum:
                          - 172800
                          type: number
                        - enum:
                          - 259200
                          type: number
                        - enum:
                          - 518400
                          type: number
                        x-auditable: true
                      chunk_overlap:
                        type: integer
                        default: 10
