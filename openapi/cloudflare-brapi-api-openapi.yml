                      type: string
                    timeout:
                      type: number
                      maximum: 120000
                    visible:
                      type: boolean
                      enum:
                      - true
                  required:
                  - selector
                waitForTimeout:
                  description: Waits for a specified timeout before continuing.
                  type: number
                  maximum: 120000
              additionalProperties: false
              oneOf:
              - not:
                  properties:
                    html:
                      type: string
                  required:
                  - html
                  type: object
                properties:
                  html:
                    type: string
                  url:
                    type: string
                required:
                - url
                type: object
              - not:
                  properties:
                    url:
                      type: string
                  required:
                  - url
                  type: object
                properties:
                  html:
                    type: string
                  url:
                    type: string
                required:
                - html
                type: object
      responses:
        '200':
          description: Returns the requested formats information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          description: Error code.
                          type: number
                        message:
                          description: Error message.
                          type: string
                      required:
                      - message
                      - code
                      type: object
                  meta:
                    type: object
                    properties:
                      finalUrl:
                        description: URL that served the response, after any redirects the browser followed.
                        type: string
                      headers:
                        description: Origin response headers, lowercased. Repeated headers are joined with a newline. Credential and transport-only headers that do not survive rendering are omitted.
                        type: object
                        additionalProperties:
                          type: string
                      redirectChain:
                        description: HTTP redirects followed to reach `finalUrl`, oldest first. Omitted for direct navigation and for client-side redirects such as meta refresh. An empty array means redirects occurred but their intermediate responses could not be read.
                        type: array
                        items:
                          properties:
                            headers:
                              description: Redirect response headers, including `location`.
                              type: object
                              additionalProperties:
                                type: string
                            status:
                              description: HTTP status of the redirect.
                              type: number
                            url:
                              description: URL that returned the redirect.
                              type: string
                          required:
                          - url
                          - status
                          - headers
                          type: object
                      status:
                        description: HTTP status returned by the origin.
                        type: number
                      title:
                        description: Page title.
                        type: string
                  result:
                    type: object
                    properties:
                      accessibilityTree:
                        $ref: '#/components/schemas/brapi_SerializedAXNode'
                      content:
                        description: HTML content.
                        type: string
                      markdown:
                        description: Markdown content. Prefixed with YAML frontmatter (e.g. `title`) when the page provides that metadata.
                        type: string
                      screenshot:
                        description: Base64 encoded image.
                        type: string
                  success:
                    description: Response status.
                    type: boolean
                required:
                - success
                - meta
        '400':
          description: The request contains errors or didn't properly encode content.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          description: Error code.
                          type: number
                        message:
                          description: Error message.
                          type: string
                      required:
                      - message
                      - code
                      type: object
                  success:
                    description: Response status.
                    type: boolean
                required:
                - success
        '422':
          description: Request failed due to site-related issues such as timeouts, SSL errors, or inaccessible content.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          description: Error code.
                          type: number
                        message:
                          description: Error message.
                          type: string
                      required:
                      - message
                      - code
                      type: object
                  success:
                    description: Response status.
                    type: boolean
                required:
                - success
        '429':
          description: Request failed due to rate limiting. The Retry-After header indicates when the client should retry the request.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying the request.
              required: true
              schema:
                description: Number of seconds to wait before retrying the request.
                type: number
                example: 60
          content:
            application/json:
              example:
                errors:
                - code: 2001
                  message: Rate limit exceeded
                success: false
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          description: Error code.
                          type: number
                        message:
                          description: Error message.
                          type: string
                      required:
                      - message
                      - code
                      type: object
                  success:
                    description: Response status.
                    type: boolean
                required:
                - success
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          description: Error code.
                          type: number
                        message:
                          description: Error message.
                          type: string
                      required:
                      - message
                      - code
                      type: object
                  success:
                    description: Response status.
                    type: boolean
                required:
                - success
