                    height:
                      type: number
                    isLandscape:
                      type: boolean
                    isMobile:
                      type: boolean
                    width:
                      type: number
                  required:
                  - width
                  - height
                waitForSelector:
                  description: Wait for the selector to appear in page. Check [options](https://pptr.dev/api/puppeteer.page.waitforselector).
                  type: object
                  properties:
                    hidden:
                      type: boolean
                      enum:
                      - true
