openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Brapi API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: brapi
paths:
  /accounts/{account_id}/browser-rendering/accessibilityTree:
    post:
      operationId: brapi-post_AccessibilityTree
      summary: Get accessibility tree page
      description: Returns the page's accessibility tree. Use `interestingOnly` to only return semantically meaningful nodes; use `root` to scope the tree to a CSS-selector-anchored subtree. Control page loading with `gotoOptions` and `waitFor*` options.
      parameters:
      - name: account_id
        in: path
        description: Account ID.
        required: true
        schema:
          description: Account ID.
          type: string
      - name: cacheTTL
        in: query
        description: Cache TTL default is 5s. Set to 0 to disable.
        schema:
          description: Cache TTL default is 5s. Set to 0 to disable.
          type: number
          default: 5
          maximum: 86400
          minimum: 0
      - name: browser
        in: query
        description: Rendering backend. Set to `kitesurf` to use Kitesurf (beta).
        schema:
          description: Rendering backend. Set to `kitesurf` to use Kitesurf (beta).
          type: string
          enum:
          - kitesurf
      requestBody:
        required: true
        content:
          application/json:
            examples:
              example1:
                value:
                  url: https://www.example.com/
            schema:
              type: object
              properties:
                actionTimeout:
                  description: The maximum duration allowed for the browser action to complete after the page has loaded (such as taking screenshots, extracting content, or generating PDFs). If this time limit is exceeded, the action stops and returns a timeout error.
                  type: number
                  maximum: 120000
                addScriptTag:
                  description: Adds a script element into the page with the desired URL or content.
                  type: array
                  items:
                    additionalProperties: false
                    properties:
                      content:
                        type: string
                      id:
                        type: string
                      type:
                        type: string
                      url:
                        type: string
                        format: uri
                    type: object
                addStyleTag:
                  description: Adds a `<link rel="stylesheet">` tag into the page with the desired URL or a `<style type="text/css">` tag with the content.
                  type: array
                  items:
                    properties:
                      content:
                        type: string
                      url:
                        type: string
                        format: uri
                    type: object
                allowRequestPattern:
                  description: Only allow requests that match the provided regex patterns, eg. '/^.*\.(css)'. Reject rules are applied first.
                  type: array
                  items:
                    type: string
                allowResourceTypes:
                  description: Only allow requests that match the provided resource types, eg. 'image' or 'script'. Reject rules are applied first.
                  type: array
                  items:
                    anyOf:
                    - enum:
                      - document
                      type: string
                    - enum:
                      - stylesheet
                      type: string
                    - enum:
                      - image
                      type: string
                    - enum:
                      - media
                      type: string
                    - enum:
                      - font
                      type: string
                    - enum:
                      - script
                      type: string
                    - enum:
                      - texttrack
                      type: string
                    - enum:
                      - xhr
                      type: string
                    - enum:
                      - fetch
                      type: string
                    - enum:
                      - prefetch
                      type: string
                    - enum:
                      - eventsource
                      type: string
                    - enum:
                      - websocket
                      type: string
                    - enum:
                      - manifest
                      type: string
                    - enum:
                      - signedexchange
                      type: string
                    - enum:
                      - ping
                      type: string
                    - enum:
                      - cspviolationreport
                      type: string
                    - enum:
                      - preflight
                      type: string
                    - enum:
                      - other
                      type: string
                authenticate:
                  description: Provide credentials for HTTP authentication.
                  type: object
                  properties:
                    password:
                      type: string
                      minLength: 1
                      x-sensitive: true
                    username:
                      type: string
                      minLength: 1
                  required:
                  - username
                  - password
                bestAttempt:
                  description: Attempt to proceed when 'awaited' events fail or timeout.
                  type: boolean
                cookies:
                  description: Check [options](https://pptr.dev/api/puppeteer.page.setcookie).
                  type: array
                  items:
                    properties:
                      domain:
                        type: string
                      expires:
                        type: number
                      httpOnly:
                        type: boolean
                      name:
                        description: Cookie name.
                        type: string
                      partitionKey:
                        type: string
                      path:
                        type: string
                      priority:
                        anyOf:
                        - enum:
                          - Low
                          type: string
                        - enum:
                          - Medium
                          type: string
                        - enum:
                          - High
                          type: string
                      sameParty:
                        type: boolean
                      sameSite:
                        anyOf:
                        - enum:
                          - Strict
                          type: string
                        - enum:
                          - Lax
                          type: string
                        - enum:
                          - None
                          type: string
                      secure:
                        type: boolean
                      sourcePort:
                        type: number
                      sourceScheme:
                        anyOf:
                        - enum:
                          - Unset
                          type: string
                        - enum:
                          - NonSecure
                          type: string
                        - enum:
                          - Secure
                          type: string
                      url:
                        type: string
                      value:
                        type: string
                    required:
                    - name
                    - value
                    type: object
                emulateMediaType:
                  type: string
                gotoOptions:
                  description: Check [options](https://pptr.dev/api/puppeteer.gotooptions).
                  type: object
                  default: {}
                  properties:
                    referer:
                      type: string
                    referrerPolicy:
                      type: string
                    timeout:
                      type: number
                      default: 30000
                      maximum: 60000
                    waitUntil:
                      default: domcontentloaded
                      anyOf:
                      - enum:
                        - load
                        type: string
                      - enum:
                        - domcontentloaded
                        type: string
                      - enum:
                        - networkidle0
                        type: string
                      - enum:
                        - networkidle2
                        type: string
                      - items:
                          anyOf:
                          - enum:
                            - load
                            type: string
                          - enum:
                            - domcontentloaded
                            type: string
                          - enum:
                            - networkidle0
                            type: string
                          - enum:
                            - networkidle2
                            type: string
                        type: array
                html:
                  description: 'Set the content of the page, eg: `<h1>Hello World!!</h1>`. Either `html` or `url` must be set.'
                  type: string
                  example: <h1>Hello World!</h1>
                  minLength: 1
                interestingOnly:
                  type: boolean
                rejectRequestPattern:
                  description: Block undesired requests that match the provided regex patterns, eg. '/^.*\.(css)'.
                  type: array
                  items:
                    type: string
                rejectResourceTypes:
                  description: Block undesired requests that match the provided resource types, eg. 'image' or 'script'.
                  type: array
                  items:
                    anyOf:
                    - enum:
                      - document
                      type: string
                    - enum:
                      - stylesheet
                      type: string
                    - enum:
                      - image
                      type: string
                    - enum:
                      - media
                      type: string
                    - enum:
                      - font
                      type: string
                    - enum:
                      - script
                      type: string
                    - enum:
                      - texttrack
                      type: string
                    - enum:
                      - xhr
                      type: string
                    - enum:
                      - fetch
                      type: string
                    - enum:
                      - prefetch
                      type: string
                    - enum:
                      - eventsource
                      type: string
                    - enum:
                      - websocket
                      type: string
                    - enum:
                      - manifest
                      type: string
                    - enum:
                      - signedexchange
                      type: string
                    - enum:
                      - ping
                      type: string
                    - enum:
                      - cspviolationreport
                      type: string
                    - enum:
                      - preflight
                      type: string
                    - enum:
                      - other
                      type: string
                root:
                  type: string
                setExtraHTTPHeaders:
                  type: object
                  additionalProperties:
                    type: string
                setJavaScriptEnabled:
                  type: boolean
                url:
                  description: URL to navigate to, eg. `https://example.com`.
                  type: string
                  format: uri
                  example: https://example.com/
                userAgent:
                  type: string
                  default: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
                viewport:
                  description: Check [options](https://pptr.dev/api/puppeteer.page.setviewport).
                  type: object
                  default:
                    height: 1080
                    width: 1920
                  properties:
                    deviceScaleFactor:
                      type: number
                    hasTouch:
                      type: boolean
                    height:
                      type: number
                    isLandscape:
                      type: boolean
                    isMobile:
                      type: boolean
                    width:
                      type: number
                  required:
                  - width
                  - height
                waitForSelector:
                  description: Wait for the selector to appear in page. Check [options](https://pptr.dev/api/puppeteer.page.waitforselector).
                  type: object
                  properties:
                    hidden:
                      type: boolean
                      enum:
                      - true
                    selector:
                      type: string
                    timeout:
                      type: number
                      maximum: 120000
                    visible:
                      type: boolean
                      enum:
                      - true
                  required:
                  - selector
                waitForTimeout:
                  description: Waits for a specified timeout before continuing.
                  type: number
                  maximum: 120000
              additionalProperties: false
              oneOf:
              - not:
                  properties:
                    html:
                      type: string
                  required:
                  - html
                  type: object
                properties:
                  html:
                    type: string
                  url:
                    type: string
                required:
                - url
                type: object
              - not:
                  properties:
                    url:
                      type: string
                  required:
                  - url
                  type: object
                properties:
                  html:
                    type: string
                  url:
                    type: string
                required:
                - html
                type: object
      responses:
        '200':
          description: Returns the requested formats information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          description: Error code.
                          type: number
                        message:
                          description: Error message.
                          type: string
                      required:
                      - message
                      - code
                      type: object
                  meta:
                    type: object
                    properties:
                      finalUrl:
                        description: URL that served the response, after any redirects the browser followed.
                        type: string
                      headers:
                        description: Origin response headers, lowercased. Repeated headers are joined with a newline. Credential and transport-only headers that do not survive rendering are omitted.
                        type: object
                        additionalProperties:
                          type: string
                      redirectChain:
                        description: HTTP redirects followed to reach `finalUrl`, oldest first. Omitted for direct navigation and for client-side redirects such as meta refresh. An empty array means redirects occurred but their intermediate responses could not be read.
                        type: array
                        items:
                          properties:
                            headers:
                              description: Redirect response headers, including `location`.
                              type: object
                              additionalProperties:
                                type: string
                            status:
                              description: HTTP status of the redirect.
                              type: number
                            url:
                              description: URL that returned the redirect.
                              type: string
                          required:
                          - url
                          - status
                          - headers
                          type: object
                      status:
                        description: HTTP status returned by the origin.
                        type: number
                      title:
                        description: Page title.
                        type: string
                  result:
                    type: object
                    properties:
                      accessibilityTree:
                        allOf:
                        - $ref: '#/components/schemas/brapi_SerializedAXNode'
                        - type:
                          - object
                          - 'null'
                    required:
                    - accessibilityTree
                  success:
                    description: Response status.
                    type: boolean
                required:
                - success
                - result
                - meta
        '400':
          description: The request contains errors or didn't properly encode content.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          description: Error code.
                          type: number
                        message:
                          description: Error message.
                          type: string
                      required:
                      - message
                      - code
                      type: object
                  success:
                    description: Response status.
                    type: boolean
                required:
                - success
        '422':
          description: Request failed due to site-related issues such as timeouts, SSL errors, or inaccessible content.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          description: Error code.
                          type: number
                        message:
                          description: Error message.
                          type: string
                      required:
                      - message
                      - code
                      type: object
                  success:
                    description: Response status.
                    type: boolean
                required:
                - success
        '429':
          description: Request failed due to rate limiting. The Retry-After header indicates when the client should retry the request.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying the request.
              required: true
              schema:
                description: Number of seconds to wait before retrying the request.
                type: number
                example: 60
          content:
            application/json:
              example:
                errors:
                - code: 2001
                  message: Rate limit exceeded
                success: false
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          description: Error code.
                          type: number
                        message:
                          description: Error message.
                          type: string
                      required:
                      - message
                      - code
                      type: object
                  success:
                    description: Response status.
                    type: boolean
                required:
                - success
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          description: Error code.
                          type: number
                        message:
                          description: Error message.
                          type: string
                      required:
                      - message
                      - code
                      type: object
                  success:
                    description: Response status.
                    type: boolean
                required:
                - success
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - brapi
      x-api-token-group:
      - Browser Rendering Write
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.brapi.read
        type: string
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: browser-run.quick-action
      x-fern-sdk-method-name: accessibility-tree
