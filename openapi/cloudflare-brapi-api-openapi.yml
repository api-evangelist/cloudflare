                      - enum:
                        - webp
                        type: string
                setExtraHTTPHeaders:
                  type: object
                  additionalProperties:
                    type: string
                setJavaScriptEnabled:
                  type: boolean
                url:
                  description: URL to navigate to, eg. `https://example.com`.
                  type: string
                  format: uri
                  example: https://example.com/
                userAgent:
