openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Resource Sharing API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Resource Sharing
paths:
  /accounts/{account_id}/shares:
    get:
      operationId: shares-list
      summary: List account shares
      description: Lists all account shares.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_account_id'
      - $ref: '#/components/parameters/resource-sharing_status'
      - $ref: '#/components/parameters/resource-sharing_kind'
      - $ref: '#/components/parameters/resource-sharing_target_type'
      - $ref: '#/components/parameters/resource-sharing_resource_types'
      - $ref: '#/components/parameters/resource-sharing_order'
      - $ref: '#/components/parameters/resource-sharing_direction'
      - $ref: '#/components/parameters/resource-sharing_page'
      - $ref: '#/components/parameters/resource-sharing_per_page'
      - $ref: '#/components/parameters/resource-sharing_include_resources'
      - $ref: '#/components/parameters/resource-sharing_include_recipient_counts'
      - $ref: '#/components/parameters/resource-sharing_tag'
      responses:
        '200':
          description: List account shares response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-sharing_share_response_collection'
        4XX:
          description: List account shares response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
        5XX:
          description: List account shares response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Sharing
      x-api-token-group: null
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: resource-sharing
      x-fern-sdk-method-name: list
    post:
      operationId: share-create
      summary: Trigger a share creation
      description: Creates a new resource share for sharing Cloudflare resources with other accounts or organizations.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_account_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resource-sharing_create_share_request'
      responses:
        '201':
          description: Share created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-sharing_share_response_single'
        4XX:
          description: Create share failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
        5XX:
          description: Create share failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Sharing
      x-api-token-group: null
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: resource-sharing
      x-fern-sdk-method-name: create
  /accounts/{account_id}/shares/{share_id}:
    delete:
      operationId: share-delete
      summary: Trigger a share deletion
      description: Deletion is not immediate, an updated share object with a new status will be returned.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_account_id'
      - name: share_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_share_id'
      responses:
        '200':
          description: Share deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-sharing_share_response_single'
        4XX:
          description: Delete share failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
        5XX:
          description: Delete share failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Sharing
      x-api-token-group: null
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: resource-sharing
      x-fern-sdk-method-name: delete
      x-forge-require-confirmation: Are you sure? This action cannot be undone.
    get:
      operationId: shares-get-by-id
      summary: Get account share by ID
      description: Fetches share by ID.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_account_id'
      - name: share_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_share_id'
      - $ref: '#/components/parameters/resource-sharing_include_resources'
      - $ref: '#/components/parameters/resource-sharing_include_recipient_counts'
      responses:
        '200':
          description: Get account share response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-sharing_share_response_single'
        4XX:
          description: Get account share response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
        5XX:
          description: Get account share response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Sharing
      x-api-token-group: null
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: resource-sharing
      x-fern-sdk-method-name: get
    put:
      operationId: share-update
      summary: Trigger a share rename
      description: 'Updates the share''s display name and tags. This endpoint does **not**

        modify recipients or resources — those are managed via dedicated

        subresource endpoints:


        - **Recipients**: Use `POST /accounts/{account_id}/shares/{share_id}/recipients`

        to add a single recipient, `PUT /accounts/{account_id}/shares/{share_id}/recipients`

        to replace the full recipient list, or

        `DELETE /accounts/{account_id}/shares/{share_id}/recipients/{recipient_id}`

        to remove a recipient.

        - **Resources**: Use the share''s resource subresource endpoints.


        Updating is not immediate; an updated share object with a new status

        will be returned.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_account_id'
      - name: share_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_share_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resource-sharing_update_share_request'
      responses:
        '200':
          description: Share updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-sharing_share_response_single'
        4XX:
          description: Update share failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
        5XX:
          description: Update share failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Sharing
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: resource-sharing
      x-fern-sdk-method-name: update
  /accounts/{account_id}/shares/{share_id}/excluded-recipients:
    get:
      operationId: share-excluded-recipients-list
      summary: List share excluded recipients by share ID
      description: Lists the accounts excluded from an organization-targeted share. Only valid for shares with `target_type=organization`.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_account_id'
      - name: share_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_share_id'
      - $ref: '#/components/parameters/resource-sharing_page'
      - $ref: '#/components/parameters/resource-sharing_per_page'
      responses:
        '200':
          description: List share excluded recipients response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-sharing_share_excluded_recipient_response_collection'
        4XX:
          description: List share excluded recipients response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
        5XX:
          description: List share excluded recipients response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Sharing
      x-api-token-group: null
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: resource-sharing.excluded-recipients
      x-fern-sdk-method-name: list
    post:
      operationId: share-excluded-recipient-create
      summary: Trigger an account exclusion from a share
      description: Excludes a single account from an organization-targeted share. The share continues to target the entire organization, but the excluded account is skipped during reconciliation.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_account_id'
      - name: share_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_share_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resource-sharing_create_share_excluded_recipient_request'
      responses:
        '201':
          description: Share excluded recipient created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-sharing_share_excluded_recipient_response_single'
        4XX:
          description: Create share excluded recipient failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
        5XX:
          description: Create share excluded recipient failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Sharing
      x-api-token-group: null
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: resource-sharing.excluded-recipients
      x-fern-sdk-method-name: create
    put:
      operationId: share-excluded-recipients-update
      summary: Trigger excluded-account reconciliation on a share
      description: Reconciles a share's excluded recipients to match the given list. Only valid for shares with `target_type=organization`.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_account_id'
      - name: share_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_share_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resource-sharing_update_share_excluded_recipients_request'
      responses:
        '204':
          description: Empty body
        4XX:
          description: Update share excluded recipients failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
        5XX:
          description: Update share excluded recipients failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Sharing
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: resource-sharing.excluded-recipients
      x-fern-sdk-method-name: update
  /accounts/{account_id}/shares/{share_id}/excluded-recipients/{excluded_recipient_id}:
    delete:
      operationId: share-excluded-recipient-delete
      summary: Trigger an account un-exclusion from a share
      description: Removes a single account from a share's excluded-recipient list. The account becomes eligible to receive the share again on the next reconciliation cycle.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_account_id'
      - name: share_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_share_id'
      - name: excluded_recipient_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_excluded_recipient_id'
      responses:
        '200':
          description: Share excluded recipient deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-sharing_share_excluded_recipient_response_single'
        4XX:
          description: Delete share excluded recipient failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
        5XX:
          description: Delete share excluded recipient failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Sharing
      x-api-token-group: null
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: resource-sharing.excluded-recipients
      x-fern-sdk-method-name: delete
    get:
      operationId: share-excluded-recipients-get-by-id
      summary: Get share excluded recipient by ID
      description: Gets a single excluded recipient of a share by its identifier tag.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_account_id'
      - name: share_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_share_id'
      - name: excluded_recipient_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_excluded_recipient_id'
      responses:
        '200':
          description: Get share excluded recipient response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-sharing_share_excluded_recipient_response_single'
        4XX:
          description: Get share excluded recipient response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
        5XX:
          description: Get share excluded recipient response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Sharing
      x-api-token-group: null
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: resource-sharing.excluded-recipients
      x-fern-sdk-method-name: get
  /accounts/{account_id}/shares/{share_id}/recipients:
    get:
      operationId: share-recipients-list
      summary: List share recipients by share ID
      description: 'List share recipients by share ID. Returns **all** recipients

        regardless of their `association_status` (associating, associated,

        disassociating, disassociated). Callers that want only "active"

        recipients must filter client-side on the `association_status` field.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_account_id'
      - name: share_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_share_id'
      - $ref: '#/components/parameters/resource-sharing_include_resources'
      - $ref: '#/components/parameters/resource-sharing_page'
      - $ref: '#/components/parameters/resource-sharing_per_page'
      responses:
        '200':
          description: List account share recipients response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-sharing_share_recipient_response_collection'
        4XX:
          description: List account share recipients response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
        5XX:
          description: List account share recipients response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Sharing
      x-api-token-group: null
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: resource-sharing.recipients
      x-fern-sdk-method-name: list
    post:
      operationId: share-recipient-create
      summary: Trigger a recipient addition to a share
      description: 'Adds a single recipient to an account-targeted resource share, granting

        them access to the shared resources. The recipient account must belong

        to the same organization as the share owner.


        To replace the entire recipient list in one call, use

        `PUT /accounts/{account_id}/shares/{share_id}/recipients` instead.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_account_id'
      - name: share_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_share_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resource-sharing_create_share_recipient_request'
      responses:
        '201':
          description: Share recipient created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-sharing_share_recipient_response_single'
        4XX:
          description: Create share recipient failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
        5XX:
          description: Create share recipient failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Sharing
      x-api-token-group: null
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: resource-sharing.recipients
      x-fern-sdk-method-name: create
    put:
      operationId: share-recipients-update
      summary: Trigger recipient reconciliation on a share
      description: 'Replaces the full recipient list for an account-targeted share. The

        server computes the diff between the current and desired recipients:

        new accounts are added, accounts no longer in the list are marked for

        disassociation, and unchanged accounts are left as-is.


        Returns an error if the share targets an organization

        (`target_type=organization`); org-targeted shares derive their

        recipients dynamically from org membership and cannot be modified

        through this endpoint.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_account_id'
      - name: share_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_share_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resource-sharing_update_share_recipients_request'
      responses:
        '204':
          description: Empty body
        4XX:
          description: Update share recipients failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
        5XX:
          description: Update share recipients failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Sharing
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: resource-sharing.recipients
      x-fern-sdk-method-name: update
  /accounts/{account_id}/shares/{share_id}/recipients/{recipient_id}:
    delete:
      operationId: share-recipient-delete
      summary: Trigger a recipient removal from a share
      description: 'Performs a **soft delete**: sets the recipient''s

        `desired_association_status` to `disassociated`, which signals the

        background reconciliation workflow (Temporal) to remove the shared

        resources from the recipient account. The recipient record remains in

        the database for audit purposes and is still returned by

        `GET /accounts/{account_id}/shares/{share_id}/recipients` with its

        updated status.


        Resource access is not fully removed until the workflow completes and

        `current_association_status` transitions to `disassociated`. The

        recipient record itself is never physically deleted.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_account_id'
      - name: share_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_share_id'
      - name: recipient_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_recipient_id'
      responses:
        '200':
          description: Share recipient deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-sharing_share_recipient_response_single'
        4XX:
          description: Delete share recipient failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
        5XX:
          description: Delete share recipient failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/resource-sharing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Sharing
      x-api-token-group: null
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: resource-sharing.recipients
      x-fern-sdk-method-name: delete
      x-forge-require-confirmation: Are you sure? This action cannot be undone.
    get:
      operationId: share-recipients-get-by-id
      summary: Get share recipient by ID
      description: Get share recipient by ID.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-sharing_account_id'
      - name: share_id
        in: path
        required: true
        schema:
