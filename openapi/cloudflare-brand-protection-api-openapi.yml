openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Brand Protection API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Brand Protection
paths:
  /accounts/{account_id}/cloudforce-one/v2/brand-protection/domain/matches:
    get:
      operationId: get_DomainMatchList
      summary: List saved query matches
      description: Get paginated list of domain matches for one or more brand protection queries. When multiple query_ids are provided (comma-separated), matches are deduplicated across queries and each match includes a match_details array with per-match query metadata and individual dismissed state.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: offset
        in: query
        schema:
          type: string
          default: '0'
      - name: limit
        in: query
        schema:
          type: string
          default: '50'
      - name: query_id
        in: query
        required: true
        schema:
          description: Query ID or comma-separated list of Query IDs. When multiple IDs are provided, matches are deduplicated across queries and each match includes a match_details array with per-match query metadata and dismissed state.
          type: array
          items:
            type: string
      - name: include_domain_id
        in: query
        schema:
          type: string
          default: 'false'
      - name: include_dismissed
        in: query
        schema:
          type: string
      - name: domain_search
        in: query
        schema:
          description: Filter matches by domain name (substring match)
          type: string
      - name: orderBy
        in: query
        schema:
          description: 'Column to sort by. Options: ''domain'', ''first_seen'', or ''registrar'''
          type: string
          enum:
          - domain
          - first_seen
          - registrar
      - name: order
        in: query
        schema:
          description: 'Sort order. Options: ''asc'' (ascending) or ''desc'' (descending)'
          type: string
          enum:
          - asc
          - desc
      responses:
        '200':
          description: Successfully retrieved query matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      properties:
                        dismissed:
                          description: Whether the match is dismissed. Only present for single-query requests. For multi-query requests, use the dismissed field in each match_details entry.
                          type: boolean
                        domain:
                          type: string
                        first_seen:
                          type: string
                        match_details:
                          description: Per-match detail objects with query metadata and individual dismissed state. Only present when multiple query_ids are requested.
                          type: array
                          items:
                            properties:
                              dismissed:
                                description: Individual dismissed state for this specific match.
                                type: boolean
                              match_id:
                                type: integer
                              query_id:
                                type: integer
                              query_tag:
                                description: Tag associated with the query, if one exists.
                                type:
                                - string
                                - 'null'
                            required:
                            - query_id
                            - query_tag
                            - match_id
                            - dismissed
                            type: object
                        public_scans:
                          type:
                          - object
                          - 'null'
                          properties:
                            submission_id:
                              type: string
                          required:
                          - submission_id
                        registrar:
                          type:
                          - string
                          - 'null'
                        scan_status:
                          type: string
                        scan_submission_id:
                          type:
                          - integer
                          - 'null'
                        source:
                          type:
                          - string
                          - 'null'
                      required:
                      - domain
                      - first_seen
                      - public_scans
                      - scan_status
                      - scan_submission_id
                      - source
                      - registrar
                      type: object
                  total:
                    type: integer
                    minimum: 0
                required:
                - matches
                - total
        4XX:
          $ref: '#/components/responses/cloudforce-one-events_ApiV4ClientError'
      security:
      - api_token: []
      tags:
      - Brand Protection
      x-api-token-group:
      - Cloudforce One Write
      - Cloudforce One Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: brand-protection.matches
      x-fern-sdk-method-name: get
      x-forge-hidden: true
  /accounts/{account_id}/cloudforce-one/v2/brand-protection/domain/matches/bulk-dismiss:
    post:
      operationId: post_BulkDismissMatches
      summary: Bulk dismiss or undismiss matches
      description: 'Dismiss or undismiss multiple matches in a single request. Accepts either the new format (matches: [{query_id, domain_id}]) for per-query control, or the legacy format (match_ids: [number]) which dismisses for all queries sharing each match''s hash. Returns per-item success/error results.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - dismiss
                  - undismiss
                match_ids:
                  type: array
                  items:
                    type: integer
                    exclusiveMinimum: 0
                  maxItems: 100
                  minItems: 1
                matches:
                  type: array
                  items:
                    properties:
                      domain_id:
                        type: integer
                        exclusiveMinimum: 0
                      query_id:
                        type: integer
                        exclusiveMinimum: 0
                    required:
                    - query_id
                    - domain_id
                    type: object
                  maxItems: 100
                  minItems: 1
              required:
              - action
      responses:
        '200':
          description: Bulk dismiss/undismiss results
          content:
            application/json:
              schema:
                anyOf:
                - properties:
                    result:
                      type: object
                      properties:
                        results:
                          type: array
                          items:
                            properties:
                              domain_id:
                                type: integer
                              error:
                                type: string
                              query_id:
                                type: integer
                              success:
                                type: boolean
                            required:
                            - query_id
                            - domain_id
                            - success
                            type: object
                      required:
                      - results
                    success:
                      type: boolean
                  required:
                  - success
                  - result
                  type: object
                - properties:
                    result:
                      type: object
                      properties:
                        results:
                          type: array
                          items:
                            properties:
                              error:
                                type: string
                              match_id:
                                type: integer
                              success:
                                type: boolean
                            required:
                            - match_id
                            - success
                            type: object
                      required:
                      - results
                    success:
                      type: boolean
                  required:
                  - success
                  - result
                  type: object
        4XX:
          $ref: '#/components/responses/cloudforce-one-events_ApiV4ClientError'
      security:
      - api_token: []
      tags:
      - Brand Protection
      x-api-token-group:
      - Cloudforce One Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: brand-protection.matches
      x-fern-sdk-method-name: bulk-dismiss
      x-forge-hidden: true
  /accounts/{account_id}/cloudforce-one/v2/brand-protection/domain/queries:
    get:
      operationId: get_GetDomainQueries
      summary: Get queries
      description: Get all saved brand protection queries for an account
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: id
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          description: Optional page number for paginated list requests. Defaults to 1 when only per_page is supplied. Omit page and per_page to preserve the legacy full-list response.
          type: integer
          maximum: 1000000
          exclusiveMinimum: 0
      - name: per_page
        in: query
        schema:
          description: Optional number of queries per page for paginated list requests. Defaults to 100 when only page is supplied. Maximum 100. Omit page and per_page to preserve the legacy full-list response.
          type: integer
          maximum: 100
          exclusiveMinimum: 0
      responses:
        '200':
          description: Successfully retrieved queries
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          anyOf:
                          - type: string
                          - type: number
                        message:
                          type: string
                      required:
                      - message
                      type: object
                  messages:
                    type: array
                    items:
                      properties:
                        code:
                          anyOf:
                          - type: string
                          - type: number
                        message:
                          type: string
                      required:
                      - message
                      type: object
                  result:
                    anyOf:
                    - items:
                        properties:
                          created:
                            type: string
                          parameters:
                            required:
                            - string_matches
                            properties:
                              max_time:
                                type: string
                              min_time:
                                type: string
                              string_matches:
                                type: array
                                items:
                                  properties:
                                    pattern:
                                      type: string
                                      maxLength: 200
                                      minLength: 1
                                  required:
                                  - pattern
                                  type: object
                            type:
                            - object
                            - 'null'
                          query_id:
                            type: integer
                          query_tag:
                            type: string
                          scan:
                            type: boolean
                          updated:
                            type: string
                        required:
                        - query_id
                        - query_tag
                        - scan
                        - parameters
                        - created
                        - updated
                        type: object
                      type: array
                    - properties:
                        created:
                          type: string
                        parameters:
                          required:
                          - string_matches
                          properties:
                            max_time:
                              type: string
                            min_time:
                              type: string
                            string_matches:
                              type: array
                              items:
                                properties:
                                  pattern:
                                    type: string
                                    maxLength: 200
                                    minLength: 1
                                required:
                                - pattern
                                type: object
                          type:
                          - object
                          - 'null'
                        query_id:
                          type: integer
                        query_tag:
                          type: string
                        scan:
                          type: boolean
                        updated:
                          type: string
                      required:
                      - query_id
                      - query_tag
                      - scan
                      - parameters
                      - created
                      - updated
                      type: object
                  result_info:
                    description: Present on paginated list responses when page or per_page is supplied.
                    type: object
                    properties:
                      count:
                        type: integer
                        minimum: 0
                      page:
                        type: integer
                        exclusiveMinimum: 0
                      per_page:
                        type: integer
                        exclusiveMinimum: 0
                      total_count:
                        type: integer
                        minimum: 0
                    required:
                    - count
                    - page
                    - per_page
                    - total_count
                  success:
                    type: boolean
                required:
                - success
                - result
                - errors
                - messages
        4XX:
          $ref: '#/components/responses/cloudforce-one-events_ApiV4ClientError'
      security:
      - api_token: []
      tags:
      - Brand Protection
      x-api-token-group:
      - Cloudforce One Write
      - Cloudforce One Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: brand-protection.queries
      x-fern-sdk-method-name: get
      x-forge-hidden: true
    post:
      operationId: post_InsertDomainQuery
      summary: Insert query
      description: Create a new saved brand protection query with string match patterns
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                max_time:
                  type: string
                min_time:
                  type: string
                scan:
                  type: boolean
                scan_matches:
                  type: boolean
                search_lookback:
                  description: If true, search recent domain lookback entries for matches
                  type: boolean
                  default: true
                string_matches:
                  type: array
                  items:
                    properties:
                      pattern:
                        type: string
                        maxLength: 200
                        minLength: 1
                    required:
                    - pattern
                    type: object
                  maxItems: 100
                  minItems: 1
                tag:
                  type: string
                  minLength: 1
              required:
              - tag
              - string_matches
      responses:
        '200':
          description: Query inserted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  query_id:
                    type: integer
                  success:
                    type: boolean
                required:
                - success
                - message
        4XX:
          $ref: '#/components/responses/cloudforce-one-events_ApiV4ClientError'
      security:
      - api_token: []
      tags:
      - Brand Protection
      x-api-token-group:
      - Cloudforce One Write
      x-fern-availability: generally-available
      x-fern-ignore: true
      x-fern-sdk-group-name: cloudforce-one.stakeout.domain-queries
      x-fern-sdk-method-name: create
      x-forge-hidden: true
  /accounts/{account_id}/cloudforce-one/v2/brand-protection/domain/queries/{query_id}:
    delete:
      operationId: delete_DeleteDomainQuery
      summary: Delete domain query
      description: Delete a saved brand protection domain query from the account_queries table. This operation will remove the query from the durable object database. Returns 404 if the query ID doesn't exist.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: query_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Domain query deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  success:
                    type: boolean
                required:
                - success
                - message
        4XX:
          $ref: '#/components/responses/cloudforce-one-events_ApiV4ClientError'
      security:
      - api_token: []
      tags:
      - Brand Protection
      x-api-token-group:
      - Cloudforce One Write
      x-fern-availability: generally-available
      x-fern-ignore: true
      x-fern-sdk-group-name: cloudforce-one.stakeout.domain-queries
      x-fern-sdk-method-name: delete
      x-forge-hidden: true
    patch:
      operationId: patch_UpdateDomainQuery
      summary: Update domain query
      description: Update a saved brand protection domain query with string match patterns
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: query_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                max_time:
                  type: string
                min_time:
                  type: string
                scan:
                  type: boolean
                scan_matches:
                  type: boolean
                search_lookback:
                  description: If true, search recent domain lookback entries for matches
                  type: boolean
                  default: true
                string_matches:
                  type: array
                  items:
                    properties:
                      pattern:
                        type: string
                        maxLength: 200
                        minLength: 1
                    required:
                    - pattern
                    type: object
                  maxItems: 100
                  minItems: 1
                tag:
                  type: string
                  minLength: 1
              required:
              - tag
              - string_matches
      responses:
        '200':
          description: Domain query updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  query_id:
                    type: integer
                  success:
                    type: boolean
                required:
                - success
                - message
        4XX:
          $ref: '#/components/responses/cloudforce-one-events_ApiV4ClientError'
      security:
      - api_token: []
      tags:
      - Brand Protection
      x-api-token-group:
      - Cloudforce One Write
      x-fern-availability: generally-available
      x-fern-ignore: true
      x-fern-sdk-group-name: cloudforce-one.stakeout.domain-queries
      x-fern-sdk-method-name: update
      x-forge-hidden: true
  /accounts/{account_id}/cloudforce-one/v2/brand-protection/domain/trial:
    post:
      operationId: post_DomainTrial
      summary: Analyze domains for brand impersonation
      description: Uses AI to scan all domains in the lookback table and identify potential phishing or impersonation attempts against the given brand string.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                brand:
                  type: string
                  maxLength: 200
                  minLength: 1
                  pattern: ^[\w\s.-]+$
              required:
              - brand
      responses:
        '200':
          description: Domain analysis results
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      properties:
                        confidence:
                          type: number
                          maximum: 1
                          minimum: 0
                        domain:
                          type: string
                        domain_id:
                          type: integer
                          minimum: 0
                        first_seen:
                          type: string
                          format: date-time
                        reason:
                          type: string
                          maxLength: 500
                      required:
                      - domain
                      - domain_id
                      - first_seen
                      - confidence
                      - reason
                      type: object
                  total_analyzed:
                    type: number
                  total_matches:
                    type: number
                  truncated:
                    type: boolean
                required:
                - matches
                - total_analyzed
                - total_matches
                - truncated
        '403':
          description: Brand is not a zone belonging to this account
        '502':
          description: Zone ownership check failed (upstream error)
        '503':
          description: Zone ownership check is not configured
      security:
      - api_token: []
      tags:
      - Brand Protection
      x-api-token-group:
      - Cloudforce One Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: brand-protection.trial
      x-fern-sdk-method-name: create
      x-forge-hidden: true
  /accounts/{account_id}/cloudforce-one/v2/brand-protection/letter/generate:
    post:
      operationId: post_LetterGenerate
      summary: Generate takedown letter
      description: Generate a takedown letter from a template. Returns V4 JSON for text format or a PDF binary for pdf format.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                createNotice:
                  type: boolean
                  default: false
                fields:
                  type: object
                  properties:
                    discoveryDate:
                      type: string
                      pattern: ^\d{4}-\d{2}-\d{2}$
                    domain:
                      type: string
                      maxLength: 500
                    generationDate:
                      type: string
                      pattern: ^\d{4}-\d{2}-\d{2}$
                    jurisdiction:
                      type: string
                      maxLength: 500
                    registrantEmail:
                      type: string
                      maxLength: 500
                    registrar:
                      type: string
                      maxLength: 500
                    registrarEmail:
                      type: string
                      maxLength: 500
                    resolutionByDate:
                      type: string
                      pattern: ^\d{4}-\d{2}-\d{2}$
                    senderCompany:
                      type: string
                      maxLength: 500
                    senderEmail:
                      type: string
                      maxLength: 500
                    senderName:
                      type: string
                      maxLength: 500
                    senderTitle:
                      type: string
                      maxLength: 500
                    trademarkName:
                      type: string
                      maxLength: 500
                    trademarkNumber:
                      type: string
                      maxLength: 500
                    trademarkOwner:
                      type: string
                      maxLength: 500
                format:
                  type: string
                  default: text
                  enum:
                  - text
                  - pdf
                noticeParams:
                  type: object
                  properties:
                    domain:
                      type: string
                      maxLength: 253
                      minLength: 1
                    queryId:
                      type: integer
                      exclusiveMinimum: 0
                    status:
                      type: string
                      default: sent
                      enum:
                      - draft
                      - sent
                      - resolved
                      - expired
                  required:
                  - domain
                templateId:
                  type: string
                  minLength: 1
              required:
              - templateId
              - fields
      responses:
        '200':
          description: 'Letter generated successfully. When format=text, returns V4 JSON with { result: { letter: string } }. When format=pdf, returns binary with Content-Type: application/pdf.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  letter:
                    type: string
                  letterId:
                    type: integer
                    exclusiveMinimum: 0
                  notice:
                    type: object
                    properties:
                      createdAt:
                        type:
                        - string
                        - 'null'
                      domain:
                        type: string
                      id:
                        type: number
                      matchId:
                        type:
                        - number
                        - 'null'
                      matchType:
                        type:
                        - string
                        - 'null'
                        enum:
                        - logo
                        - domain
                      queryId:
                        type:
                        - number
                        - 'null'
                      status:
                        type: string
                        enum:
                        - draft
                        - sent
                        - resolved
                        - expired
                      updatedAt:
                        type:
                        - string
                        - 'null'
                    required:
                    - id
                    - domain
                    - queryId
                    - status
                    - matchId
                    - matchType
                    - createdAt
                    - updatedAt
                required:
                - letter
            application/pdf:
              schema:
                type: string
                format: binary
        4XX:
          $ref: '#/components/responses/cloudforce-one-events_ApiV4ClientError'
      security:
      - api_token: []
      tags:
      - Brand Protection
      x-api-token-group:
      - Cloudforce One Write
      x-fern-availability: generally-available
      x-fern-ignore: true
      x-fern-sdk-group-name: cloudforce-one.stakeout.takedown-letters
      x-fern-sdk-method-name: generate
      x-forge-hidden: true
  /accounts/{account_id}/cloudforce-one/v2/brand-protection/letter/templates:
    get:
      operationId: get_LetterTemplateList
      summary: List letter templates
      description: List user-defined takedown letter templates. System example templates are available via the /templates/examples endpoint.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Templates listed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      properties:
                        category:
                          type: string
                        createdAt:
                          type:
                          - string
                          - 'null'
                        description:
                          type:
                          - string
                          - 'null'
                        id:
                          type: string
                        name:
                          type: string
                        source:
                          type: string
                          enum:
                          - system
                          - user
                        updatedAt:
                          type:
                          - string
                          - 'null'
                      required:
                      - id
                      - source
                      - name
                      - category
                      - description
                      - createdAt
                      - updatedAt
                      type: object
                required:
                - templates
        4XX:
          $ref: '#/components/responses/cloudforce-one-events_ApiV4ClientError'
      security:
      - api_token: []
      tags:
      - Brand Protection
      x-api-token-group:
      - Cloudforce One Write
      - Cloudforce One Read
      x-fern-availability: generally-available
      x-fern-ignore: true
      x-fern-sdk-group-name: cloudforce-one.stakeout.letter-templates
      x-fern-sdk-method-name: list
      x-forge-hidden: true
    post:
      operationId: post_LetterTemplateCreate
      summary: Create letter template
      description: Create a new user-defined takedown letter template
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  minLength: 1
                category:
                  type: string
                  maxLength: 100
                  minLength: 1
                description:
                  type: string
                  maxLength: 1000
                name:
                  type: string
                  maxLength: 255
                  minLength: 1
              required:
              - name
              - category
              - body
      responses:
        '200':
          description: Template created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: string
                  category:
                    type: string
                  createdAt:
                    type:
                    - string
                    - 'null'
                  description:
                    type:
                    - string
                    - 'null'
                  id:
                    type: string
                  name:
