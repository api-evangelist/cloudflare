                    minLength: 1
                    type: string
                  maxItems: 100
                  minItems: 1
                queryId:
                  type: integer
                  exclusiveMinimum: 0
                queryIds:
                  type: array
                  items:
                    type: integer
                    exclusiveMinimum: 0
                  maxItems: 100
