          type: array
          items:
            enum:
            - CHROME
            - EDGE
            - FIREFOX
            - SAFARI
            type: string
          example: CHROME
      - name: format
        in: query
        description: Format in which results will be returned.
        schema:
          description: Format in which results will be returned.
          type: string
          example: json
          enum:
          - JSON
          - CSV
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      meta:
                        description: Metadata for the results.
                        type: object
                        properties:
                          confidenceInfo:
                            type: object
                            properties:
                              annotations:
                                type: array
                                items:
                                  description: Annotation associated with the result (e.g. outage or other type of event).
                                  properties:
                                    dataSource:
                                      description: Data source for annotations.
                                      type: string
                                      enum:
                                      - ALL
                                      - AI_BOTS
                                      - AI_GATEWAY
                                      - BGP
                                      - BOTS
                                      - CONNECTION_ANOMALY
                                      - CT
                                      - DNS
                                      - DNS_MAGNITUDE
                                      - DNS_AS112
                                      - DOS
                                      - EMAIL_ROUTING
                                      - EMAIL_SECURITY
                                      - FW
                                      - FW_PG
                                      - HTTP
                                      - HTTP_CONTROL
                                      - HTTP_CRAWLER_REFERER
                                      - HTTP_ORIGINS
                                      - IQI
                                      - LEAKED_CREDENTIALS
                                      - NET
                                      - ROBOTS_TXT
                                      - SPEED
                                      - WORKERS_AI
                                    description:
                                      type: string
                                      example: Cable cut in Tonga
                                    endDate:
                                      type: string
                                      format: date-time
                                    eventType:
                                      description: Event type for annotations.
                                      type: string
                                      enum:
                                      - GENERAL
                                      - OUTAGE
                                      - PARTIAL_PROJECTION
                                      - PIPELINE
                                      - TRAFFIC_ANOMALY
                                    isInstantaneous:
                                      description: Whether event is a single point in time or a time range.
                                      type: boolean
                                    linkedUrl:
                                      type: string
                                      format: uri
                                    startDate:
                                      type: string
                                      format: date-time
                                    tags:
                                      type: array
                                      items:
                                        example: BOT_CLASS
                                        type: string
                                  required:
                                  - dataSource
                                  - eventType
                                  - description
                                  - startDate
                                  - endDate
                                  - linkedUrl
                                  - isInstantaneous
                                  type: object
                              level:
                                description: Provides an indication of how much confidence Cloudflare has in the data.
                                type: integer
                            required:
                            - level
                            - annotations
                          dateRange:
                            type: array
                            items:
                              properties:
                                endTime:
                                  description: Adjusted end of date range.
                                  type: string
                                  format: date-time
                                  example: '2022-09-17T10:22:57.555Z'
                                startTime:
                                  description: Adjusted start of date range.
                                  type: string
                                  format: date-time
                                  example: '2022-09-16T10:22:57.555Z'
                              required:
                              - startTime
                              - endTime
                              type: object
                          lastUpdated:
                            description: Timestamp of the last dataset update.
                            type: string
                            format: date-time
                          normalization:
                            description: Normalization method applied to the results. Refer to [Normalization methods](https://developers.cloudflare.com/radar/concepts/normalization/).
                            type: string
                            enum:
                            - PERCENTAGE
                            - MIN0_MAX
                            - MIN_MAX
                            - RAW_VALUES
                            - PERCENTAGE_CHANGE
                            - ROLLING_AVERAGE
                            - OVERLAPPED_PERCENTAGE
                            - RATIO
                          units:
                            description: Measurement units for the results.
                            type: array
                            items:
                              properties:
                                name:
                                  type: string
                                  example: '*'
                                value:
                                  type: string
                                  example: requests
                              required:
                              - name
                              - value
                              type: object
                        required:
                        - dateRange
                        - confidenceInfo
                        - normalization
                        - lastUpdated
                        - units
                      summary_0:
                        type: object
                        properties:
                          bot:
                            description: A numeric string.
                            type: string
                            example: '10'
                            pattern: ^-?\d+(\.\d+)?$
                          human:
                            description: A numeric string.
                            type: string
                            example: '10'
                            pattern: ^-?\d+(\.\d+)?$
                        required:
                        - human
                        - bot
                    required:
                    - summary_0
                    - meta
                  success:
                    type: boolean
                    example: true
                required:
                - result
                - success
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                  result:
                    type: object
                  success:
                    type: boolean
                    example: false
                required:
                - result
                - success
                - errors
