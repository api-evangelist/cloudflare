info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Radar HTTP API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Radar HTTP
paths:
  /radar/http/summary/bot_class:
    get:
      operationId: radar-get-http-summary-by-bot-class
      summary: Get HTTP requests by bot class summary
      description: Retrieves the distribution of bot-generated HTTP requests to genuine human traffic, as classified by Cloudflare. Visit https://developers.cloudflare.com/radar/concepts/bot-classes/ for more information.
      parameters:
      - name: name
        in: query
        description: Array of names used to label the series in the response.
        schema:
          description: Array of names used to label the series in the response.
          type: array
          items:
            example: main_series
            type: string
      - name: dateRange
        in: query
        description: 'Filters results by relative date range ending at the current time, with each value producing a separate series. Use `<n>d` for days (up to `364d`) or `<n>w` for weeks (up to `52w`). Append `control` to request the equivalent previous period for comparison: the comparison window is shifted back by the current window''s length rounded up to a whole number of weeks, so it keeps the same weekday alignment and does not overlap the current window (e.g. `7dcontrol` covers days -14 to -7, `10dcontrol` covers days -24 to -14). For example, pass `7d` and `7dcontrol` to compare this week with the previous week. All series must resolve to the same duration as the main series; relative ranges (including `control`) satisfy this automatically. Use this parameter or set specific start and end dates (`dateStart` and `dateEnd` parameters).'
        schema:
          description: 'Filters results by relative date range ending at the current time, with each value producing a separate series. Use `<n>d` for days (up to `364d`) or `<n>w` for weeks (up to `52w`). Append `control` to request the equivalent previous period for comparison: the comparison window is shifted back by the current window''s length rounded up to a whole number of weeks, so it keeps the same weekday alignment and does not overlap the current window (e.g. `7dcontrol` covers days -14 to -7, `10dcontrol` covers days -24 to -14). For example, pass `7d` and `7dcontrol` to compare this week with the previous week. All series must resolve to the same duration as the main series; relative ranges (including `control`) satisfy this automatically. Use this parameter or set specific start and end dates (`dateStart` and `dateEnd` parameters).'
          type: array
          items:
            example: 7d
            pattern: ^((([1-9]|[1-9][0-9]|[1-2][0-9][0-9]|3[0-5][0-9]|36[0-4])[d](control)?)|(([1-9]|[1-4][0-9]|5[0-2])[w](control)?))$
            type: string
          example: 7d
      - name: dateStart
        in: query
        description: Start of the date range. Alternative to `dateRange`; provide together with `dateEnd`. When requesting comparison series, every series must resolve to the same duration as the main series. Each `dateStart`/`dateEnd` is floored to the nearest 15 minutes before evaluation, so windows whose durations match only before alignment may be rejected.
        schema:
          description: Start of the date range. Alternative to `dateRange`; provide together with `dateEnd`. When requesting comparison series, every series must resolve to the same duration as the main series. Each `dateStart`/`dateEnd` is floored to the nearest 15 minutes before evaluation, so windows whose durations match only before alignment may be rejected.
          type: array
          items:
            format: date-time
            type: string
          example: '2023-09-01T11:41:33.782Z'
      - name: dateEnd
        in: query
        description: End of the date range (inclusive). Alternative to `dateRange`; provide together with `dateStart`. When requesting comparison series, every series must resolve to the same duration as the main series. Each `dateStart`/`dateEnd` is floored to the nearest 15 minutes before evaluation, so windows whose durations match only before alignment may be rejected.
        schema:
          description: End of the date range (inclusive). Alternative to `dateRange`; provide together with `dateStart`. When requesting comparison series, every series must resolve to the same duration as the main series. Each `dateStart`/`dateEnd` is floored to the nearest 15 minutes before evaluation, so windows whose durations match only before alignment may be rejected.
          type: array
          items:
            format: date-time
            type: string
          example: '2023-09-01T11:41:33.782Z'
      - name: asn
        in: query
        description: Filters results by Autonomous System. Specify one or more Autonomous System Numbers (ASNs) as a comma-separated list. Prefix with `-` to exclude ASNs from results. For example, `-174, 3356` excludes results from AS174, but includes results from AS3356.
        schema:
          description: Filters results by Autonomous System. Specify one or more Autonomous System Numbers (ASNs) as a comma-separated list. Prefix with `-` to exclude ASNs from results. For example, `-174, 3356` excludes results from AS174, but includes results from AS3356.
          type: array
          items:
            type: string
          example: '15169'
      - name: location
        in: query
        description: Filters results by location. Specify a comma-separated list of alpha-2 codes. Prefix with `-` to exclude locations from results. For example, `-US,PT` excludes results from the US, but includes results from PT.
        schema:
          description: Filters results by location. Specify a comma-separated list of alpha-2 codes. Prefix with `-` to exclude locations from results. For example, `-US,PT` excludes results from the US, but includes results from PT.
          type: array
          items:
            type: string
          example: US,CA
      - name: continent
        in: query
        description: Filters results by continent. Specify a comma-separated list of alpha-2 codes. Prefix with `-` to exclude continents from results. For example, `-EU,NA` excludes results from EU, but includes results from NA.
        schema:
          description: Filters results by continent. Specify a comma-separated list of alpha-2 codes. Prefix with `-` to exclude continents from results. For example, `-EU,NA` excludes results from EU, but includes results from NA.
          type: array
          items:
            type: string
          example: EU,NA
      - name: geoId
        in: query
        description: Filters results by Geolocation. Specify a comma-separated list of GeoNames IDs. Prefix with `-` to exclude geoIds from results. For example, `-2267056,360689` excludes results from the 2267056 (Lisbon), but includes results from 5128638 (New York).
        schema:
          description: Filters results by Geolocation. Specify a comma-separated list of GeoNames IDs. Prefix with `-` to exclude geoIds from results. For example, `-2267056,360689` excludes results from the 2267056 (Lisbon), but includes results from 5128638 (New York).
          type: array
          items:
            type: string
          example: 2267056,360689
      - name: deviceType
        in: query
        description: Filters results by device type.
        schema:
          description: Filters results by device type.
          type: array
          items:
            enum:
            - DESKTOP
            - MOBILE
            - OTHER
            type: string
          example: DESKTOP
      - name: httpProtocol
        in: query
        description: Filters results by HTTP protocol (HTTP vs. HTTPS).
        schema:
          description: Filters results by HTTP protocol (HTTP vs. HTTPS).
          type: array
          items:
            enum:
            - HTTP
            - HTTPS
            type: string
          example: HTTPS
      - name: httpVersion
        in: query
        description: Filters results by HTTP version.
        schema:
          description: Filters results by HTTP version.
          type: array
          items:
            enum:
            - HTTPv1
            - HTTPv2
            - HTTPv3
            type: string
          example: HTTPv1
      - name: ipVersion
        in: query
        description: Filters results by IP version (Ipv4 vs. IPv6).
        schema:
          description: Filters results by IP version (Ipv4 vs. IPv6).
          type: array
          items:
            enum:
            - IPv4
            - IPv6
            type: string
          example: IPv4
      - name: os
        in: query
        description: Filters results by operating system.
        schema:
          description: Filters results by operating system.
          type: array
          items:
            enum:
            - WINDOWS
            - MACOSX
            - IOS
            - ANDROID
            - CHROMEOS
            - LINUX
            - SMART_TV
            type: string
          example: WINDOWS
      - name: tlsVersion
        in: query
        description: Filters results by TLS version.
        schema:
          description: Filters results by TLS version.
          type: array
          items:
            enum:
            - TLSv1_0
            - TLSv1_1
            - TLSv1_2
            - TLSv1_3
            - TLSvQUIC
            type: string
          example: TLSv1_2
      - name: browserFamily
        in: query
