openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Audit Logs API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Audit Logs
paths:
  /accounts/{account_id}/audit_logs:
    get:
      operationId: audit-logs-get-account-audit-logs
      summary: Get account audit logs
      description: Gets a list of audit logs for an account. Can be filtered by who made the change, on which zone, and the timeframe of the change.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/aaa_identifier'
      - name: id
        in: query
        schema:
          description: Finds a specific log by its ID.
          type: string
          example: f174be97-19b1-40d6-954d-70cd5fbd52db
      - name: export
        in: query
        schema:
          description: Indicates that this request is an export of logs in CSV format.
          type: boolean
          example: true
      - name: action.type
        in: query
        schema:
          description: Filters by the action type.
          type: string
          example: add
      - name: actor.ip
        in: query
        schema:
          description: Filters by the IP address of the request that made the change by specific IP address or valid CIDR Range.
          type: string
          example: 17.168.228.63
      - name: actor.email
        in: query
        schema:
          description: Filters by the email address of the actor that made the change.
          type: string
          format: email
          example: alice@example.com
      - name: since
        in: query
        schema:
          oneOf:
          - description: Limits the returned results to logs newer than the specified date. A `full-date` that conforms to RFC3339.
            example: '2019-04-30'
            format: date
            type: string
          - description: Limits the returned results to logs newer than the specified date. A `date-time` that conforms to RFC3339.
            example: '2019-04-30T01:12:20Z'
            format: date-time
            type: string
      - name: before
        in: query
        schema:
          oneOf:
          - description: Limits the returned results to logs older than the specified date. A `full-date` that conforms to RFC3339.
            example: '2019-04-30'
            format: date
            type: string
          - description: Limits the returned results to logs older than the specified date. A `date-time` that conforms to RFC3339.
            example: '2019-04-30T01:12:20Z'
            format: date-time
            type: string
      - name: zone.name
        in: query
        schema:
          description: Filters by the name of the zone associated to the change.
          type: string
          example: example.com
      - name: direction
        in: query
        schema:
          description: Changes the direction of the chronological sorting.
          type: string
          example: desc
          default: desc
          enum:
          - desc
          - asc
      - name: per_page
        in: query
        schema:
          description: Sets the number of results to return per page.
          type: number
          example: 25
          default: 100
          maximum: 1000
          minimum: 1
      - name: page
        in: query
        schema:
          description: Defines which page of results to return.
          type: number
          example: 50
          default: 1
          minimum: 1
      - name: hide_user_logs
        in: query
        schema:
          description: Indicates whether or not to hide user level audit logs.
          type: boolean
          default: false
      responses:
        '200':
          description: Get account audit logs response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aaa_audit_logs_response_collection'
        4XX:
          description: Get account audit logs response failure
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/aaa_audit_logs_response_collection'
                - $ref: '#/components/schemas/aaa_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Audit Logs
      x-api-token-group:
      - Account Settings Write
      - Account Settings Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: audit-logs
      x-fern-sdk-method-name: list
      x-forge-hidden: true
  /accounts/{account_id}/logs/audit:
    get:
      operationId: audit-logs-v2-get-account-audit-logs
      summary: Get account audit logs (Version 2)
      description: Gets a list of audit logs for an account.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          description: The unique id that identifies the account.
          type: string
          example: a67e14daa5f8dceeb91fe5449ba496ef
      - name: account_name
        in: query
        schema:
          description: Filters by the account name.
          type: array
          items:
            type: string
      - name: action_result
        in: query
        schema:
          description: Filters by whether the action was successful or not.
          type: array
          items:
            enum:
            - success
            - failure
            type: string
          example: success
      - name: action_type
        in: query
        schema:
          description: Filters by the action type.
          type: array
          items:
            enum:
            - create
            - delete
            - view
            - update
            example: create
            type: string
      - name: actor_context
        in: query
        schema:
          description: 'Filters by the actor context.

            - `api`: The action was performed through the API. The specific credential type was not recorded.

            - `api_key`: The action was authenticated with a Cloudflare Global API Key.

            - `api_token`: The action was authenticated with an API token.

            - `dash`: The action was performed through the Cloudflare dashboard.

            - `oauth`: The action was authenticated with an OAuth token.

            - `origin_ca_key`: The action was authenticated with an Origin CA key.

            '
          type: array
          items:
            enum:
            - api
            - api_key
            - api_token
            - dash
            - oauth
            - origin_ca_key
            example: api_key
            type: string
      - name: actor_email
        in: query
        schema:
          description: Filters by the actor's email address.
          type: array
          items:
            example: alice@example.com
            format: email
            type: string
      - name: actor_id
        in: query
        schema:
          description: Filters by the actor ID. This can be either the Account ID or User ID.
          type: array
          items:
            example: 1d20c3afe174f18b642710cec6298a9d
            type: string
      - name: actor_ip_address
        in: query
        schema:
          description: The IP address where the action was initiated.
          type: array
          items:
            example: 17.168.228.63
            type: string
      - name: actor_token_id
        in: query
        schema:
          description: Filters by the API token ID when the actor context is an api_token or oauth.
          type: array
          items:
            example: 144cdb2e39c55e203cf225d8d8208647
            type: string
      - name: actor_token_name
        in: query
        schema:
          description: Filters by the API token name when the actor context is an api_token or oauth.
          type: array
          items:
            example: Test Token
            type: string
      - name: actor_type
        in: query
        schema:
          description: Filters by the actor type.
          type: array
          items:
            enum:
            - account
            - cloudflare_admin
            - delegated_service
            - system
            - user
            example: account
            type: string
      - name: audit_log_id
        in: query
        schema:
          description: Finds a specific log by its ID.
          type: array
          items:
            example: f174be97-19b1-40d6-954d-70cd5fbd52db
            type: string
          deprecated: true
      - name: id
        in: query
        schema:
          description: Finds a specific log by its ID.
          type: array
          items:
            example: f174be97-19b1-40d6-954d-70cd5fbd52db
            type: string
      - name: raw_cf_ray_id
        in: query
        schema:
          description: Filters by the response CF Ray ID.
          type: array
          items:
            example: 8e8dd2156ef28414
            type: string
      - name: raw_method
        in: query
        schema:
          description: The HTTP method for the API call.
          type: array
          items:
            example: GET
            type: string
      - name: raw_status_code
        in: query
        schema:
          description: The response status code that was returned.
          type: array
          items:
            example: 200
            type: integer
      - name: raw_uri
        in: query
        schema:
          description: Filters by the request URI.
          type: array
          items:
            type: string
      - name: resource_id
        in: query
        schema:
          description: Filters by the resource ID.
          type: array
          items:
            type: string
      - name: resource_product
        in: query
        schema:
          description: Filters audit logs by the Cloudflare product associated with the changed resource.
          type: array
          items:
            example: Stream
            type: string
      - name: resource_type
        in: query
        schema:
          description: Filters audit logs based on the unique type of resource changed by the action.
          type: array
          items:
            example: Video
            type: string
      - name: resource_scope
        in: query
        schema:
          description: Filters by the resource scope, specifying whether the resource is associated with an user, an account, a zone, or a membership.
          type: array
          items:
            enum:
            - accounts
            - user
            - zones
            - memberships
            example: accounts
            type: string
      - name: product_category
        in: query
        schema:
          description: Filters audit logs by one or more predefined product categories. Each product category expands into a curated set of resource_product values and is unioned with any explicit resource_product filter. Matched case-insensitively; unknown product categories return 400. Repeatable. Use the audit log product categories endpoint to discover the available values.
          type: array
          items:
            example: zerotrust
            type: string
      - name: zone_id
        in: query
        schema:
          description: Filters by the zone ID.
          type: array
          items:
            type: string
      - name: zone_name
        in: query
        schema:
          description: Filters by the zone name associated with the change.
          type: array
          items:
            example: example.com
            type: string
      - name: account_name.not
        in: query
        schema:
          description: Filters out audit logs by the account name.
          type: array
          items:
            type: string
      - name: action_result.not
        in: query
        schema:
          description: Filters out audit logs by whether the action was successful or not.
          type: array
          items:
            enum:
            - success
            - failure
            type: string
          example: success
      - name: action_type.not
        in: query
        schema:
          description: Filters out audit logs by the action type.
          type: array
          items:
            enum:
            - create
            - delete
            - view
            - update
            example: create
            type: string
      - name: actor_context.not
        in: query
        schema:
          description: 'Filters out audit logs by the actor context.

            - `api`: The action was performed through the API. The specific credential type was not recorded.

            - `api_key`: The action was authenticated with a Cloudflare Global API Key.

            - `api_token`: The action was authenticated with an API token.

            - `dash`: The action was performed through the Cloudflare dashboard.

            - `oauth`: The action was authenticated with an OAuth token.

            - `origin_ca_key`: The action was authenticated with an Origin CA key.

            '
          type: array
          items:
            enum:
            - api
            - api_key
            - api_token
            - dash
            - oauth
            - origin_ca_key
            example: api_key
            type: string
      - name: actor_email.not
        in: query
        schema:
          description: Filters out audit logs by the actor's email address.
          type: array
          items:
            example: alice@example.com
            format: email
            type: string
      - name: actor_id.not
        in: query
        schema:
          description: Filters out audit logs by the actor ID. This can be either the Account ID or User ID.
          type: array
          items:
            example: 1d20c3afe174f18b642710cec6298a9d
            type: string
      - name: actor_ip_address.not
        in: query
        schema:
          description: Filters out audit logs IP address where the action was initiated.
          type: array
          items:
            example: 17.168.228.63
            type: string
      - name: actor_token_id.not
        in: query
        schema:
          description: Filters out audit logs by the API token ID when the actor context is an api_token or oauth.
          type: array
          items:
            example: 144cdb2e39c55e203cf225d8d8208647
            type: string
      - name: actor_token_name.not
        in: query
        schema:
          description: Filters out audit logs by the API token name when the actor context is an api_token or oauth.
          type: array
          items:
            example: Test Token
            type: string
      - name: actor_type.not
        in: query
        schema:
          description: Filters out audit logs by the actor type.
          type: array
          items:
            enum:
            - account
            - cloudflare_admin
            - delegated_service
            - system
            - user
            example: account
            type: string
      - name: audit_log_id.not
        in: query
        schema:
          description: Filters out audit logs by their IDs.
          type: array
          items:
            example: f174be97-19b1-40d6-954d-70cd5fbd52db
            type: string
          deprecated: true
      - name: id.not
        in: query
        schema:
          description: Filters out audit logs by their IDs.
          type: array
          items:
            example: f174be97-19b1-40d6-954d-70cd5fbd52db
            type: string
      - name: raw_cf_ray_id.not
        in: query
        schema:
          description: Filters out audit logs by the response CF Ray ID.
          type: array
          items:
            example: 8e8dd2156ef28414
            type: string
      - name: raw_method.not
        in: query
        schema:
          description: Filters out audit logs by the HTTP method for the API call.
          type: array
          items:
            example: GET
            type: string
      - name: raw_status_code.not
        in: query
        schema:
          description: Filters out audit logs by the response status code that was returned.
          type: array
          items:
            example: 200
            type: integer
      - name: raw_uri.not
        in: query
        schema:
          description: Filters out audit logs by the request URI.
          type: array
          items:
            type: string
      - name: resource_id.not
        in: query
        schema:
          description: Filters out audit logs by the resource ID.
          type: array
          items:
            type: string
      - name: resource_product.not
        in: query
        schema:
          description: Filters out audit logs by the Cloudflare product associated with the changed resource.
          type: array
          items:
            example: Stream
            type: string
      - name: resource_type.not
        in: query
        schema:
          description: Filters out audit logs based on the unique type of resource changed by the action.
          type: array
          items:
            example: Video
            type: string
      - name: resource_scope.not
        in: query
        schema:
          description: Filters out audit logs by the resource scope, specifying whether the resource is associated with an user, an account, a zone, or a membership.
          type: array
          items:
            enum:
            - accounts
            - user
            - zones
            - memberships
            example: accounts
            type: string
      - name: zone_id.not
        in: query
        schema:
          description: Filters out audit logs by the zone ID.
          type: array
          items:
            type: string
      - name: zone_name.not
        in: query
        schema:
          description: Filters out audit logs by the zone name associated with the change.
          type: array
          items:
            example: example.com
            type: string
      - name: since
        in: query
        description: Limits the returned results to logs newer than the specified date. This can be a date string 2019-04-30 (interpreted in UTC) or an absolute timestamp that conforms to RFC3339.
        required: true
        schema:
          type: string
          format: date
          example: '2024-10-30'
      - name: before
        in: query
        description: Limits the returned results to logs older than the specified date. This can be a date string 2019-04-30 (interpreted in UTC) or an absolute timestamp that conforms to RFC3339.
        required: true
        schema:
          type: string
          format: date
          example: '2024-10-31'
      - name: direction
        in: query
        schema:
          description: Sets sorting order.
          type: string
          example: desc
          default: desc
          enum:
          - desc
          - asc
      - name: limit
        in: query
        schema:
          description: The number limits the objects to return. The cursor attribute may be used to iterate over the next batch of objects if there are more than the limit.
          type: number
          example: 25
          default: 100
          maximum: 1000
          minimum: 1
      - name: cursor
        in: query
        schema:
          description: The cursor is an opaque token used to paginate through large sets of records. It indicates the position from which to continue when requesting the next set of records. A valid cursor value can be obtained from the cursor object in the result_info structure of a previous response.
          type: string
          example: Q1buH-__DQqqig7SVYXT-SsMOTGY2Z3Y80W-fGgva7yaDdmPKveucH5ddOcHsJRhNb-xUK8agZQqkJSMAENGO8NU6g==
      responses:
        '200':
          description: Get account audit logs successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aaa_audit-logs-v2-response-collection'
        4XX:
          description: Get account audit logs failed response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aaa_api-response-common-failure-2'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Audit Logs
      x-api-token-group:
      - Account Settings Write
      - Account Settings Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: accounts.logs.audit
      x-fern-sdk-method-name: list
      x-forge-hidden: true
  /accounts/{account_id}/logs/audit/product_categories:
    get:
      operationId: audit-logs-v2-list-account-product-categories
      summary: List account audit log product categories (Version 2)
      description: Lists the available audit log product categories and the resource products each one expands to. Use these values with the product_category filter on the account audit logs endpoint.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          description: The unique id that identifies the account.
          type: string
          example: a67e14daa5f8dceeb91fe5449ba496ef
      responses:
        '200':
          description: List account audit log product categories successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aaa_audit-logs-v2-product-categories-response-collection'
        4XX:
          description: List account audit log product categories failed response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aaa_api-response-common-failure-2'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Audit Logs
      x-api-token-group:
      - Account Settings Write
      - Account Settings Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: accounts.logs.audit
      x-fern-sdk-method-name: product-categories
      x-forge-hidden: true
  /accounts/{account_id}/logs/audit/{id}/history:
    get:
      operationId: audit-logs-v2-get-account-audit-log-history
      summary: Get resource change history from an account audit log entry (Version 2)
      description: 'Returns the chronological change history for the resource identified by the given audit log entry.


        The endpoint first locates the source audit log entry by `id` (using `action_time` to narrow the lookup window), derives identifying filters from that entry, and then returns matching audit logs within the `since`/`before` window.


        The `result_info.history_status` field indicates the quality of the resource identification used:

        - `exact`: Resource was identified by the resource URI.

        - `approximate`: Resource was identified without the resource URI.

        - `unavailable`: The source audit log entry did not contain enough information to identify the resource; an empty result is returned.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          description: The unique ID that identifies the account.
          type: string
          example: a67e14daa5f8dceeb91fe5449ba496ef
      - name: id
        in: path
        required: true
        schema:
          description: The ID of the audit log to fetch resource history for.
          type: string
          format: uuid
          example: f174be97-19b1-40d6-954d-70cd5fbd52db
      - name: action_time
        in: query
        description: RFC3339 timestamp of the source audit log entry's action time. Used to narrow the source-entry lookup window. Provide the `action.time` value from the audit log identified by `id`.
        required: true
        schema:
          type: string
          format: date-time
          example: '2024-10-30T15:00:00Z'
      - name: since
        in: query
        description: Limits the returned results to logs newer than the specified date. This can be a date string 2019-04-30 (interpreted in UTC) or an absolute timestamp that conforms to RFC3339.
        required: true
        schema:
          type: string
          format: date
          example: '2024-10-30'
      - name: before
        in: query
        description: Limits the returned results to logs older than the specified date. This can be a date string 2019-04-30 (interpreted in UTC) or an absolute timestamp that conforms to RFC3339.
        required: true
        schema:
          type: string
          format: date
          example: '2024-10-31'
      - name: direction
        in: query
        schema:
          description: Sets sorting order.
          type: string
          example: desc
          default: desc
          enum:
          - desc
          - asc
      - name: limit
        in: query
        schema:
          description: The number limits the objects to return. The cursor attribute may be used to iterate over the next batch of objects if there are more than the limit.
          type: number
          example: 25
          default: 100
          maximum: 1000
          minimum: 1
      - name: cursor
        in: query
        schema:
          description: The cursor is an opaque token used to paginate through large sets of records. It indicates the position from which to continue when requesting the next set of records. A valid cursor value can be obtained from the cursor object in the result_info structure of a previous response.
          type: string
          example: Q1buH-__DQqqig7SVYXT-SsMOTGY2Z3Y80W-fGgva7yaDdmPKveucH5ddOcHsJRhNb-xUK8agZQqkJSMAENGO8NU6g==
      responses:
        '200':
          description: Get account resource history successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aaa_audit-logs-v2-history-response-collection'
        '404':
          description: Audit log entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aaa_audit-logs-v2-history-not-found'
        4XX:
          description: Get account resource history failed response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aaa_api-response-common-failure-2'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Audit Logs
      x-api-token-group:
      - Account Settings Write
      - Account Settings Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: accounts.logs.audit
      x-fern-sdk-method-name: history
      x-forge-hidden: true
  /organizations/{organization_id}/logs/audit:
    get:
      operationId: audit-logs-v2-get-organization-audit-logs
      summary: Get organization audit logs (Version 2)
      description: Gets a list of audit logs for an organization.
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          description: The unique id that identifies the organization.
          type: string
          example: a67e14daa5f8dceeb91fe5449ba496ef
      - name: action_result
        in: query
        schema:
          description: Filters by whether the action was successful or not.
          type: array
          items:
            enum:
            - success
            - failure
            type: string
          example: success
      - name: action_type
        in: query
        schema:
          description: Filters by the action type.
          type: array
          items:
            enum:
            - create
            - delete
            - view
            - update
            example: create
            type: string
      - name: actor_context
        in: query
        schema:
          description: 'Filters by the actor context.

            - `api`: The action was performed through the API. The specific credential type was not recorded.

