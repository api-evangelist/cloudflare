      required:
      - raw
  parameters:
    email-security_page:
      description: Current page within paginated list of results.
      in: query
      name: page
      schema:
        type: integer
        example: 1
        default: 1
        minimum: 1
    email-security_per_page:
      description: The number of results per page. Maximum value is 1000.
