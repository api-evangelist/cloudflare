        destination:
          description: Destination folder for the message.
          type:
          - string
          - 'null'
        item_count:
          description: 'Number of items moved. End of life: November 1, 2026.'
          type: integer
          deprecated: true
          x-stainless-deprecation-message: This field is deprecated.
        message_id:
          description: Message identifier.
          type:
          - string
          - 'null'
        operation:
          description: Type of operation performed.
          type:
          - string
          - 'null'
        recipient:
          description: Recipient email address.
          type:
          - string
          - 'null'
        status:
          description: Operation status.
          type:
          - string
          - 'null'
        success:
          description: Whether the operation succeeded.
          type: boolean
