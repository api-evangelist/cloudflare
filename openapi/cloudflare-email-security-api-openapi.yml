openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Email Security API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Email Security
paths:
  /accounts/{account_id}/email-security/investigate:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    get:
      operationId: email_security_investigate
      summary: Search email messages
      description: Returns information for each email that matches the provided search parameters.
      parameters:
      - name: start
        in: query
        description: The beginning of the search date range. Defaults to `now - 30 days`. Must not be in the future.
        schema:
          type: string
          format: date-time
        example: '2022-06-25T14:30:00Z'
      - name: end
        in: query
        description: The end of the search date range. Defaults to `now`.
        schema:
          type: string
          format: date-time
        example: '2022-07-25T14:30:00Z'
      - name: query
        in: query
        description: Space-delimited term matched case-insensitively against message metadata — sender, recipient, subject, attachment names and hashes, and message ID.
        schema:
          type: string
        example: bob jones
      - name: detections_only
        in: query
        description: Whether to include only detections in search results.
        schema:
          type: boolean
          default: true
      - name: final_disposition
        in: query
        description: Dispositions to filter by.
        schema:
          type: string
          enum:
          - MALICIOUS
          - SUSPICIOUS
          - SPOOF
          - SPAM
          - BULK
          - NONE
      - name: metric
        in: query
        description: Metric to aggregate the results by.
        schema:
          type: string
      - name: message_action
        in: query
        description: Message actions to filter by.
        schema:
          type: string
          enum:
          - PREVIEW
          - QUARANTINE_RELEASED
          - MOVED
      - name: recipient
        in: query
        description: Filter by recipient. Matches an email address or a domain.
        schema:
          type: string
        example: me@example.com
      - name: sender
        in: query
        description: Filter by sender. Matches an email address or a domain.
        schema:
          type: string
        example: noreply@example.com
      - name: smtp_helo_ip
        in: query
        description: Matches messages whose SMTP HELO server IP address equals this value.
        schema:
          type: string
        example: 192.0.2.1
      - name: alert_id
        in: query
        description: Filter by alert ID.
        schema:
          type: string
      - name: domain
        in: query
        description: Filter by a domain found in the email — sender domain, recipient domain, or a domain in a link.
        schema:
          type: string
        example: example.com
      - name: message_id
        in: query
        description: Filter by the RFC 5322 Message-ID header.
        schema:
          type: string
      - name: subject
        in: query
        description: Search for messages containing individual keywords in any order within the subject.
        schema:
          type: string
      - name: delivery_status
        in: query
        description: Delivery status to filter by.
        schema:
          $ref: '#/components/schemas/email-security_MessageDeliveryStatus'
      - name: cursor
        in: query
        description: Pagination cursor from the previous response's `result_info`.
        schema:
          type: string
        x-auditable: true
      - $ref: '#/components/parameters/email-security_per_page'
      - name: page
        in: query
        description: 'Deprecated: Use cursor pagination instead. End of life: November 1, 2026.'
        schema:
          type:
          - integer
          - 'null'
          default: 1
          minimum: 1
        deprecated: true
        x-stainless-deprecation-message: Use cursor pagination instead.
        x-sunset: '2026-11-01T00:00:00Z'
      responses:
        '200':
          description: Search results for the provided query.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-common'
                - properties:
                    result:
                      type: array
                      items:
                        $ref: '#/components/schemas/email-security_MessageDetails'
                    result_info:
                      $ref: '#/components/schemas/email-security_CursorResultInfo'
                  required:
                  - result
                  - result_info
                  type: object
        '202':
          description: The search is taking longer than expected. Use the Location header to poll for results.
          headers:
            Location:
              description: URL to poll for search results.
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-common'
                - properties:
                    result:
                      description: Always empty on 202; follow the Location header to retrieve results.
                      type: array
                      items:
                        type: string
                      maxItems: 0
                    result_info:
                      $ref: '#/components/schemas/email-security_CursorResultInfo'
                  required:
                  - result
                  - result_info
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security
      x-api-token-group:
      - 'Cloud Email Security: Write'
      - 'Cloud Email Security: Read'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.investigate
      x-fern-sdk-method-name: list
      x-stability: beta
  /accounts/{account_id}/email-security/investigate/bulk:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    get:
      operationId: email_security_get_bulk_jobs
      summary: List bulk action jobs
      description: Returns a paginated list of bulk action jobs for the account.
      parameters:
      - $ref: '#/components/parameters/email-security_page'
      - $ref: '#/components/parameters/email-security_per_page'
      - name: action_type
        in: query
        description: Filter jobs by the action they perform.
        schema:
          type: string
          enum:
          - MOVE
          - RELEASE
      - name: status
        in: query
        description: Filter jobs by their processing status.
        schema:
          $ref: '#/components/schemas/email-security_BulkJobStatus'
      responses:
        '200':
          description: Jobs retrieved successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-common'
                - properties:
                    result:
                      type: array
                      items:
                        $ref: '#/components/schemas/email-security_BulkJobDetail'
                    result_info:
                      $ref: '#/components/schemas/email-security_CursorResultInfo'
                  required:
                  - result
                  - result_info
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security
      x-api-token-group:
      - 'Cloud Email Security: Write'
      - 'Cloud Email Security: Read'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.bulk-actions
      x-fern-sdk-method-name: list
      x-stability: beta
    post:
      operationId: email_security_create_bulk_job
      summary: Create a bulk action job
      description: Creates a new bulk action job to move or release messages that match the provided search parameters. To move or release an explicit list of known messages instead of a search, use the move or release endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email-security_BulkActionRequest'
      responses:
        '201':
          description: Bulk job created.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_BulkJobDetail'
                  required:
                  - result
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security
      x-api-token-group:
      - 'Cloud Email Security: Write'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.bulk-actions
      x-fern-sdk-method-name: create
      x-stability: beta
  /accounts/{account_id}/email-security/investigate/bulk/{job_id}:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    - name: job_id
      in: path
      description: Identifier of the bulk action job.
      required: true
      schema:
        $ref: '#/components/schemas/email-security_BulkJobId'
    delete:
      operationId: email_security_delete_bulk_job
      summary: Delete a bulk action job
      description: Deletes the job, removing it from all list and detail endpoints. Only jobs in a terminal state (`COMPLETED`, `CANCELLED`, or `FAILED`) can be deleted. To stop an in-progress job without removing it, use the cancel endpoint instead.
      responses:
        '200':
          description: Job deleted.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-single'
                - properties:
                    result:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                      required:
                      - id
                  required:
                  - result
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.bulk-actions
      x-fern-sdk-method-name: delete
      x-forge-require-confirmation: This operation permanently deletes the completed, cancelled, or failed bulk action job from all list and detail endpoints.
      x-stability: beta
    get:
      operationId: email_security_get_bulk_job
      summary: Get bulk action job details
      description: Returns the status and details of a specific bulk action job.
      responses:
        '200':
          description: Job details retrieved.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_BulkJobDetail'
                  required:
                  - result
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security
      x-api-token-group:
      - 'Cloud Email Security: Write'
      - 'Cloud Email Security: Read'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.bulk-actions
      x-fern-sdk-method-name: get
      x-stability: beta
  /accounts/{account_id}/email-security/investigate/bulk/{job_id}/cancel:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    - name: job_id
      in: path
      description: Identifier of the bulk action job to cancel.
      required: true
      schema:
        $ref: '#/components/schemas/email-security_BulkJobId'
    post:
      operationId: email_security_cancel_bulk_job
      summary: Cancel a bulk action job
      description: Cancels the job, marking it as cancelled and stopping any pending message processing. The job record remains visible in list and detail endpoints.
      responses:
        '200':
          description: Job cancelled.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_BulkJobDetail'
                  required:
                  - result
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security
      x-api-token-group:
      - 'Cloud Email Security: Write'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.bulk-actions
      x-fern-sdk-method-name: cancel
      x-stability: beta
  /accounts/{account_id}/email-security/investigate/bulk/{job_id}/messages:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    - name: job_id
      in: path
      description: Identifier of the bulk action job whose messages to list.
      required: true
      schema:
        $ref: '#/components/schemas/email-security_BulkJobId'
    get:
      operationId: email_security_get_bulk_job_messages
      summary: List messages for a bulk action job
      description: Returns the individual messages associated with a bulk action job, including their processing status.
      parameters:
      - $ref: '#/components/parameters/email-security_page'
      - $ref: '#/components/parameters/email-security_per_page'
      - name: status
        in: query
        description: Filter the job's messages by their processing status.
        schema:
          $ref: '#/components/schemas/email-security_BulkActionMessageStatus'
      responses:
        '200':
          description: Messages for the bulk job.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-common'
                - properties:
                    result:
                      type: array
                      items:
                        $ref: '#/components/schemas/email-security_BulkActionMessageDetail'
                    result_info:
                      $ref: '#/components/schemas/email-security_CursorResultInfo'
                  required:
                  - result
                  - result_info
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security
      x-api-token-group:
      - 'Cloud Email Security: Write'
      - 'Cloud Email Security: Read'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.bulk-actions.messages
      x-fern-sdk-method-name: list
      x-stability: beta
  /accounts/{account_id}/email-security/investigate/move:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    post:
      operationId: email_security_post_bulk_move
      summary: Move messages
      description: Moves one or more messages to a specified mailbox folder (Inbox, JunkEmail, DeletedItems, RecoverableItemsDeletions, or RecoverableItemsPurges). Requires active integration. Operates on an explicit list of messages; to move all messages matching a search, create a bulk action job instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                destination:
                  $ref: '#/components/schemas/email-security_MailboxDestination'
                expected_disposition:
                  description: 'Nonfunctional field. End of life: December 1, 2026.'
                  type:
                  - string
                  - 'null'
                  allOf:
                  - $ref: '#/components/schemas/email-security_DispositionLabel'
                  deprecated: true
                  x-stainless-deprecation-message: This field is nonfunctional.
                ids:
                  description: List of message IDs to move.
                  type: array
                  items:
                    $ref: '#/components/schemas/email-security_InvestigateId'
                  maxItems: 1000
                  minItems: 1
                  x-auditable: true
                postfix_ids:
                  description: 'Deprecated, use `ids` instead. End of life: November 1, 2026.'
                  type: array
                  items:
                    $ref: '#/components/schemas/email-security_PostfixId'
                  deprecated: true
                  x-auditable: true
                  x-stainless-deprecation-message: Use `ids` instead.
              required:
              - destination
              - ids
      responses:
        '200':
          description: Bulk move operation results.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-common'
                - properties:
                    result:
                      type: array
                      items:
                        $ref: '#/components/schemas/email-security_MoveResponseItem'
                  required:
                  - result
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security
      x-api-token-group:
      - 'Cloud Email Security: Write'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.investigate
      x-fern-sdk-method-name: move
      x-stability: beta
  /accounts/{account_id}/email-security/investigate/preview:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    post:
      operationId: email_security_post_preview
      summary: Generate preview for a non-detection message
      description: Generates a preview image for a message that was not flagged as a detection. The message is rendered from the copy in the recipient's mailbox, so this requires an active integration and only works while the message is still in the recipient's inbox. Returns a base64-encoded PNG screenshot of the email body. For messages with a detection, use the detection preview endpoint instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  $ref: '#/components/schemas/email-security_InvestigateId'
              required:
              - id
      responses:
        '200':
          description: Email preview.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_MessagePreview'
                  required:
                  - result
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security
      x-api-token-group:
      - 'Cloud Email Security: Write'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.investigate.preview
      x-fern-sdk-method-name: generate
      x-stability: beta
  /accounts/{account_id}/email-security/investigate/release:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    post:
      operationId: email_security_post_release
      summary: Release messages from quarantine
      description: Delivers one or more quarantined messages to their intended recipients, for cases where a message was incorrectly quarantined. Operates on an explicit list of messages; to release all messages matching a search, create a bulk action job instead. The response includes delivery status for each recipient.
      requestBody:
        description: The messages to release, identified by their investigate IDs.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  description: Investigate IDs of the messages to release.
                  type: array
                  items:
                    $ref: '#/components/schemas/email-security_InvestigateId'
                  minItems: 1
                  x-auditable: true
              required:
              - ids
      responses:
        '200':
          description: Release operation results.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-common'
                - properties:
                    result:
                      type: array
                      items:
                        $ref: '#/components/schemas/email-security_ReleaseResponse'
                  required:
                  - result
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security
      x-api-token-group:
      - 'Cloud Email Security: Write'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.investigate
      x-fern-sdk-method-name: release
      x-stability: beta
  /accounts/{account_id}/email-security/investigate/{investigate_id}:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    - name: investigate_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/email-security_InvestigateId'
    - $ref: '#/components/parameters/email-security_submission'
    get:
      operationId: email_security_get_message
      summary: Get message details
      description: Retrieves comprehensive details for a specific email message including headers, recipients, sender information, and current quarantine status. Use the investigate_id from search results to fetch detailed information.
      responses:
        '200':
          description: Email message details.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_MessageDetails'
                  required:
                  - result
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security
      x-api-token-group:
      - 'Cloud Email Security: Write'
      - 'Cloud Email Security: Read'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.investigate
      x-fern-sdk-method-name: get
      x-stability: beta
  /accounts/{account_id}/email-security/investigate/{investigate_id}/action_log:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    - name: investigate_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/email-security_InvestigateId'
    get:
      operationId: email_security_get_message_action_log
      summary: List post-delivery actions for a message
      description: Returns the list of post-delivery actions (moves, quarantine releases, previews, etc.) that have been applied to a specific email message.
      parameters:
      - $ref: '#/components/parameters/email-security_page'
      - $ref: '#/components/parameters/email-security_per_page'
      responses:
        '200':
          description: Action log for the email.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-collection'
                - properties:
                    result:
                      type: array
                      items:
                        $ref: '#/components/schemas/email-security_ActionEntry'
                  required:
                  - result
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security
      x-api-token-group:
      - 'Cloud Email Security: Write'
      - 'Cloud Email Security: Read'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.investigate.action-log
      x-fern-sdk-method-name: list
      x-stability: beta
  /accounts/{account_id}/email-security/investigate/{investigate_id}/detections:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    - name: investigate_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/email-security_InvestigateId'
    get:
      operationId: email_security_get_message_detections
      summary: Get message detection details
      description: Returns detection details such as threat categories and sender information for messages with a detection.
      responses:
        '200':
          description: Email message detection details.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_MessageDetectionDetails'
                  required:
                  - result
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security
      x-api-token-group:
      - 'Cloud Email Security: Write'
      - 'Cloud Email Security: Read'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.investigate.detections
      x-fern-sdk-method-name: get
      x-stability: beta
  /accounts/{account_id}/email-security/investigate/{investigate_id}/move:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    - name: investigate_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/email-security_InvestigateId'
    post:
      operationId: email_security_post_message_move
      summary: Move a message
      description: Moves a single message to a specified mailbox folder (Inbox, JunkEmail, DeletedItems, RecoverableItemsDeletions, or RecoverableItemsPurges). Requires active integration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                destination:
                  $ref: '#/components/schemas/email-security_MailboxDestination'
                expected_disposition:
                  description: 'Nonfunctional field. End of life: December 1, 2026.'
                  type:
                  - string
                  - 'null'
                  allOf:
                  - $ref: '#/components/schemas/email-security_DispositionLabel'
                  deprecated: true
                  x-stainless-deprecation-message: This field is nonfunctional.
              required:
              - destination
      responses:
        '200':
