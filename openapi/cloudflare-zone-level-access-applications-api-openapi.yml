openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Zone-Level Access applications API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Zone-Level Access applications
paths:
  /zones/{zone_id}/access/apps:
    get:
      operationId: zone-level-access-applications-list-access-applications
      summary: List Access Applications
      description: List all Access Applications in a zone.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      responses:
        '200':
          description: List Access Applications response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_response_collection-23'
        4XX:
          description: List Access Applications response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Zone-Level Access applications
      x-api-token-group:
      - 'Access: Apps and Policies Revoke'
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Read'
      - 'Access: Apps and Policies Revoke'
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Read'
      x-fern-availability: deprecated
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.access.zone-apps
      x-fern-sdk-method-name: list
      x-stability: beta
    post:
      operationId: zone-level-access-applications-add-a-bookmark-application
      summary: Add an Access application
      description: Adds a new application to Access.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/access_apps'
      responses:
        '201':
          description: Add an Access application response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/access_single_response-22'
                - properties:
                    result:
                      $ref: '#/components/schemas/access_apps'
                  type: object
        4XX:
          description: Add an Access application response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Zone-Level Access applications
      x-api-token-group:
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Write'
      x-fern-availability: deprecated
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.access.zone-apps
      x-fern-sdk-method-name: create
      x-stability: beta
  /zones/{zone_id}/access/apps/{app_id}:
    delete:
      operationId: zone-level-access-applications-delete-an-access-application
      summary: Delete an Access application
      description: Deletes an application from Access.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_app_id'
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      responses:
        '202':
          description: Delete an Access application response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_id_response'
        4XX:
          description: Delete an Access application response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Zone-Level Access applications
      x-api-token-group:
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Write'
      x-fern-availability: deprecated
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.access.zone-apps
      x-fern-sdk-method-name: delete
    get:
      operationId: zone-level-access-applications-get-an-access-application
      summary: Get an Access application
      description: Fetches information about an Access application.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_app_id'
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      responses:
        '200':
          description: Get an Access application response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_single_response-22'
        4XX:
          description: Get an Access application response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Zone-Level Access applications
      x-api-token-group:
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Read'
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Read'
      x-fern-availability: deprecated
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.access.zone-apps
      x-fern-sdk-method-name: get
      x-stability: beta
    put:
      operationId: zone-level-access-applications-update-a-bookmark-application
      summary: Update an Access application
      description: Updates an Access application.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_app_id'
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/access_apps'
      responses:
        '200':
          description: Update an Access application response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/access_single_response-22'
                - properties:
                    result:
                      $ref: '#/components/schemas/access_apps'
                  type: object
        4XX:
          description: Update an Access application response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Zone-Level Access applications
      x-api-token-group:
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Write'
      x-fern-availability: deprecated
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.access.zone-apps
      x-fern-sdk-method-name: update
      x-stability: beta
  /zones/{zone_id}/access/apps/{app_id}/revoke_tokens:
    post:
      operationId: zone-level-access-applications-revoke-service-tokens
      summary: Revoke application tokens
      description: Revokes all tokens issued for an application.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_app_id'
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      responses:
        '202':
          description: Revoke application tokens response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_empty_response-2'
        4XX:
          description: Revoke application tokens response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Zone-Level Access applications
      x-api-token-group:
      - 'Access: Apps and Policies Revoke'
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Revoke'
      - 'Access: Apps and Policies Write'
      x-fern-availability: deprecated
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.access.zone-apps.revoke.tokens
      x-fern-sdk-method-name: create
      x-forge-require-confirmation: This operation revokes all service tokens for the application.
  /zones/{zone_id}/access/apps/{app_id}/settings:
    patch:
      operationId: zone-level-access-applications-patch-update-access-application-settings
      summary: Update application settings
      description: Updates application settings.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_app_id'
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/access_app_settings_request'
      responses:
        '202':
          description: Update application settings response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/access_single_response_update'
        4XX:
          description: Update application settings response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Zone-Level Access applications
      x-fern-availability: deprecated
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.access.zone-apps.settings
      x-fern-sdk-method-name: edit
    put:
      operationId: zone-level-access-applications-put-update-access-application-settings
      summary: Update application settings
      description: Updates application settings.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_app_id'
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/access_app_settings_request'
      responses:
        '202':
          description: Update application settings response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/access_single_response_update'
        4XX:
          description: Update application settings response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Zone-Level Access applications
      x-api-token-group:
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Write'
      x-fern-availability: deprecated
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.access.zone-apps.settings
      x-fern-sdk-method-name: update
  /zones/{zone_id}/access/apps/{app_id}/user_policy_checks:
    get:
      operationId: zone-level-access-applications-test-access-policies
      summary: Test Access policies
      description: Tests if a specific user has permission to access an application.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_app_id'
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      responses:
        '200':
          description: Test Access policies response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_policy_check_response-2'
        4XX:
          description: Test Access policies response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Zone-Level Access applications
      x-api-token-group:
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Read'
      - 'Access: Apps and Policies Write'
      - 'Access: Apps and Policies Read'
      x-fern-availability: deprecated
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.access.zone-apps.user.policy.checks
      x-fern-sdk-method-name: get
components:
  schemas:
    access_type-3:
      description: The application type.
      type: string
      example: self_hosted
      enum:
      - self_hosted
      - saas
      - ssh
      - vnc
      - app_launcher
      - warp
      - biso
      - bookmark
      - dash_sso
    access_scim_config_multi_authentication-2:
      description: Multiple authentication schemes
      type: array
      items:
        $ref: '#/components/schemas/access_scim_config_single_authentication-2'
    access_scim_config_authentication_oauth2:
      description: Attributes for configuring OAuth 2 authentication scheme for SCIM provisioning to an application.
      type: object
      properties:
        authorization_url:
          description: URL used to generate the auth code used during token generation.
          type: string
        client_id:
          description: Client ID used to authenticate when generating a token for authenticating with the remote SCIM service.
          type: string
        client_secret:
          description: Secret used to authenticate when generating a token for authenticating with the remove SCIM service.
          type: string
          x-sensitive: true
        scheme:
          description: The authentication scheme to use when making SCIM requests to this application.
          type: string
          enum:
          - oauth2
        scopes:
          description: The authorization scopes to request when generating the token used to authenticate with the remove SCIM service.
          type: array
          items:
            type: string
        token_url:
          description: URL used to generate the token used to authenticate with the remote SCIM service.
          type: string
      required:
      - scheme
      - client_id
      - client_secret
      - authorization_url
      - token_url
      title: OAuth 2
    access_messages:
      type: array
      items:
        properties:
          code:
            type: integer
            minimum: 1000
          documentation_url:
            type: string
          message:
            type: string
          source:
            type: object
            properties:
              pointer:
                type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      example: []
    access_eager_redirect_cookie_setting:
      description: Preemptively sets the Access session cookie on every hostname in a multi-hostname self-hosted application during the initial redirect chain, rather than setting it lazily on first visit. Defaults to true. Set to false to disable the eager redirect cookie behavior.
      type: boolean
      example: true
      default: true
    access_api-response-common-failure:
      type: object
      properties:
        errors:
          example:
          - code: 7003
            message: No route for the URI
          allOf:
          - $ref: '#/components/schemas/access_messages'
          minLength: 1
        messages:
          example: []
          allOf:
          - $ref: '#/components/schemas/access_messages'
        result:
          type:
          - object
          - 'null'
          enum:
          - null
        success:
          description: Whether the API call was successful.
          type: boolean
          example: false
          enum:
          - false
      required:
      - success
      - errors
      - messages
      - result
    access_basic_app_response_props-2:
      type: object
      properties:
        aud:
          $ref: '#/components/schemas/access_aud-2'
        created_at:
          $ref: '#/components/schemas/access_timestamp'
        id:
          $ref: '#/components/schemas/access_uuid'
        scim_config:
          $ref: '#/components/schemas/access_scim_config-2'
        updated_at:
          $ref: '#/components/schemas/access_timestamp'
    access_biso_props-2:
      allOf:
      - $ref: '#/components/schemas/access_feature_app_props-2'
      - properties:
          domain:
            type: string
            example: authdomain.cloudflareaccess.com/browser
            readOnly: true
          name:
            type: string
            example: Clientless Web Isolation
            default: Clientless Web Isolation
            readOnly: true
          type:
            description: The application type.
            type: string
            example: biso
        type: object
    access_allow_iframe:
      description: Enables loading application content in an iFrame.
      type: boolean
      example: true
    access_allowed_origins:
      description: Allowed origins.
      type: array
      items:
        type: string
      example:
      - https://example.com
    access_custom_deny_url-2:
      description: The custom URL a user is redirected to when they are denied access to the application.
      type: string
    access_saml_saas_app-2:
      type: object
      properties:
        auth_type:
          description: Optional identifier indicating the authentication protocol used for the saas app. Required for OIDC. Default if unset is "saml"
          type: string
          example: saml
          enum:
          - saml
          - oidc
        consumer_service_url:
          description: The service provider's endpoint that is responsible for receiving and parsing a SAML assertion.
          type: string
          example: https://example.com
        created_at:
          $ref: '#/components/schemas/access_timestamp'
        custom_attributes:
          type: array
          items:
            properties:
              friendly_name:
                description: The SAML FriendlyName of the attribute.
                type: string
                example: Last Name
              name:
                description: The name of the attribute.
                type: string
                example: family_name
              name_format:
                description: A globally unique name for an identity or service provider.
                type: string
                example: urn:oasis:names:tc:SAML:2.0:attrname-format:basic
                enum:
                - urn:oasis:names:tc:SAML:2.0:attrname-format:unspecified
                - urn:oasis:names:tc:SAML:2.0:attrname-format:basic
                - urn:oasis:names:tc:SAML:2.0:attrname-format:uri
              required:
                description: If the attribute is required when building a SAML assertion.
                type: boolean
                example: true
              source:
                type: object
                properties:
                  name:
                    description: The name of the IdP attribute.
                    type: string
                    example: last_name
                  name_by_idp:
                    description: A mapping from IdP ID to attribute name.
                    type: object
                    example:
                      exampleIdPID1: AttributeName1
                      exampleIdPID2: AttributeName2
                    additionalProperties:
                      type: string
            type: object
        idp_entity_id:
          description: The unique identifier for your SaaS application.
          type: string
          example: https://example.cloudflareaccess.com
          x-stainless-terraform-configurability: computed_optional
        name_id_format:
          description: The format of the name identifier sent to the SaaS application.
          type: string
          example: id
          enum:
          - id
          - email
        name_id_transform_jsonata:
          description: 'A [JSONata](https://jsonata.org/) expression that transforms an application''s user identities into a NameID value for its SAML assertion. This expression should evaluate to a singular string. The output of this expression can override the `name_id_format` setting.

            '
          type: string
          example: $substringBefore(email, '@') & '+sandbox@' & $substringAfter(email, '@')
        public_key:
          description: The Access public certificate that will be used to verify your identity.
          type: string
          example: example unique name
          x-stainless-terraform-configurability: computed
        sp_entity_id:
          description: A globally unique name for an identity or service provider.
          type: string
          example: example unique name
        sso_endpoint:
          description: The endpoint where your SaaS application will send login requests.
          type: string
          example: https://example.cloudflareaccess.com/cdn-cgi/access/sso/saml/b3f58a2b414e0b51d45c8c2af26fccca0e27c63763c426fa52f98dcf0b3b3bfd
          x-stainless-terraform-configurability: computed_optional
        updated_at:
          $ref: '#/components/schemas/access_timestamp'
      title: SAML SaaS App
    access_app_launcher_visible:
      description: Displays the application in the App Launcher.
      type: boolean
      example: true
      default: true
    access_domain-3:
      description: The domain and path that Access will secure.
      type: string
      example: test.example.com/admin
    access_scim_config_single_authentication-2:
      oneOf:
      - $ref: '#/components/schemas/access_scim_config_authentication_http_basic'
      - $ref: '#/components/schemas/access_scim_config_authentication_oauth_bearer_token-2'
      - $ref: '#/components/schemas/access_scim_config_authentication_oauth2'
      - $ref: '#/components/schemas/access_scim_config_authentication_access_service_token'
    access_session_duration-4:
      description: 'The amount of time that tokens issued for this application will be valid. Must be in the format `300ms` or `2h45m`. Valid time units are: ns, us (or µs), ms, s, m, h.'
      type: string
      example: 24h
      default: 24h
    access_apps:
      type: object
      anyOf:
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props-2'
        - $ref: '#/components/schemas/access_self_hosted_props-2'
        title: Self Hosted Application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props-2'
        - $ref: '#/components/schemas/access_saas_props-2'
        title: SaaS Application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props-2'
        - $ref: '#/components/schemas/access_ssh_props-2'
        title: Browser SSH Application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props-2'
        - $ref: '#/components/schemas/access_vnc_props-2'
        title: Browser VNC Application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props-2'
        - $ref: '#/components/schemas/access_app_launcher_props-2'
        title: App Launcher Application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props-2'
        - $ref: '#/components/schemas/access_warp_props-2'
        title: Device Enrollment Permissions Application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props-2'
        - $ref: '#/components/schemas/access_biso_props-2'
        title: Browser Isolation Permissions Application
        type: object
      - allOf:
        - $ref: '#/components/schemas/access_basic_app_response_props-2'
        - $ref: '#/components/schemas/access_bookmark_props-2'
        title: Bookmark application
        type: object
    access_api-response-common:
      type: object
      properties:
        errors:
          $ref: '#/components/schemas/access_messages'
        messages:
          $ref: '#/components/schemas/access_messages'
        success:
          description: Whether the API call was successful.
          type: boolean
          example: true
          enum:
          - true
      required:
      - success
      - errors
      - messages
    access_app_id:
      oneOf:
      - $ref: '#/components/schemas/access_identifier'
      - $ref: '#/components/schemas/access_uuid'
    access_allow_all_headers:
      description: Allows all HTTP request headers.
      type: boolean
      example: true
    access_options_preflight_bypass-2:
      description: Allows options preflight requests to bypass Access authentication and go directly to the origin. Cannot turn on if cors_headers is set.
      type: boolean
      example: true
      default: false
    access_scim_config_authentication_access_service_token:
      description: Attributes for configuring Access Service Token authentication scheme for SCIM provisioning to an application.
      type: object
      properties:
        client_id:
          description: Client ID of the Access service token used to authenticate with the remote service.
          type: string
        client_secret:
          description: Client secret of the Access service token used to authenticate with the remote service.
          type: string
          x-sensitive: true
        scheme:
          description: The authentication scheme to use when making SCIM requests to this application.
          type: string
          enum:
          - access_service_token
      required:
      - scheme
      - client_id
      - client_secret
      title: Access Service Token
    access_skip_interstitial:
      description: Enables automatic authentication through cloudflared.
      type: boolean
      example: true
    access_feature_app_props-2:
      type: object
      properties:
        allowed_idps:
          $ref: '#/components/schemas/access_allowed_idps'
        auto_redirect_to_identity:
          $ref: '#/components/schemas/access_auto_redirect_to_identity-2'
        domain:
          $ref: '#/components/schemas/access_domain-3'
        name:
          $ref: '#/components/schemas/access_name-8'
        session_duration:
          $ref: '#/components/schemas/access_session_duration-4'
        type:
