openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Workers Pipelines Other API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: workers_pipelines_other
paths:
  /accounts/{account_id}/pipelines:
    get:
      operationId: getV4AccountsByAccount_idPipelines_deprecated
      summary: '[DEPRECATED] List Pipelines'
      description: '[DEPRECATED] List, filter, and paginate pipelines in an account. Use the new /pipelines/v1/pipelines endpoint instead.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cloudflare-pipelines_workers-pipelines-account-id'
      - name: search
        in: query
        schema:
          description: Specifies the prefix of pipeline name to search.
          type: string
      - name: page
        in: query
        schema:
          description: Specifies which page to retrieve.
          type: string
          default: '1'
      - name: per_page
        in: query
        schema:
          description: Specifies the number of pipelines per page.
          type: string
          default: '25'
      responses:
        '200':
          description: '[DEPRECATED] Lists the pipelines. Use /pipelines/v1/pipelines instead.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  result_info:
                    type: object
                    properties:
                      count:
                        description: Indicates the number of items on current page.
                        type: number
                        example: 1
                      page:
                        description: Indicates the current page number.
                        type: number
                        example: 0
                      per_page:
                        description: Indicates the number of items per page.
                        type: number
                        example: 10
                      total_count:
                        description: Indicates the total number of items.
                        type: number
                        example: 1
                    required:
                    - count
                    - page
                    - per_page
                    - total_count
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/cloudflare-pipelines_workers-pipelines-pipeline'
                  success:
                    $ref: '#/components/schemas/cloudflare-pipelines_worker-pipelines-common-success'
                required:
                - success
                - results
                - result_info
        4XX:
          description: Indicates the error trying to list pipelines.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          type: number
                        message:
                          type: string
                      required:
                      - code
                      - message
                      type: object
                    example: []
                  results:
                    type:
                    - object
                    - 'null'
                    x-stainless-empty-object: true
                  success:
                    example: false
                    allOf:
                    - $ref: '#/components/schemas/cloudflare-pipelines_worker-pipelines-common-success'
                required:
                - success
                - results
                - errors
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - workers_pipelines_other
      x-api-token-group:
      - Pipelines Write
      - Pipelines Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: pipelines
      x-fern-sdk-method-name: legacy-list
      x-forge-hidden: true
    post:
      operationId: postV4AccountsByAccount_idPipelines_deprecated
      summary: '[DEPRECATED] Create Pipeline'
      description: '[DEPRECATED] Create a new pipeline. Use the new /pipelines/v1/pipelines endpoint instead.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cloudflare-pipelines_workers-pipelines-account-id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                destination:
                  type: object
                  properties:
                    batch:
                      type: object
                      properties:
                        max_bytes:
                          description: Specifies rough maximum size of files.
                          type: integer
                          default: 100000000
                          maximum: 100000000
                          minimum: 1000
                        max_duration_s:
                          description: Specifies duration to wait to aggregate batches files.
                          type: number
                          default: 300
                          maximum: 300
                          minimum: 0.25
                        max_rows:
                          description: Specifies rough maximum number of rows per file.
                          type: integer
                          default: 10000000
                          maximum: 10000000
                          minimum: 100
                    compression:
                      type: object
                      properties:
                        type:
                          description: Specifies the desired compression algorithm and format.
                          type: string
                          example: gzip
                          default: gzip
                          enum:
                          - none
                          - gzip
                          - deflate
                    credentials:
                      type: object
                      properties:
                        access_key_id:
                          description: Specifies the R2 Bucket Access Key Id.
                          type: string
                          example: <access key id>
                        endpoint:
                          description: Specifies the R2 Endpoint.
                          type: string
                          example: https://123f8a8258064ed892a347f173372359.r2.cloudflarestorage.com
                        secret_access_key:
                          description: Specifies the R2 Bucket Secret Access Key.
                          type: string
                          example: <secret key>
                      required:
                      - endpoint
                      - access_key_id
                      - secret_access_key
                    format:
                      description: Specifies the format of data to deliver.
                      type: string
                      enum:
                      - json
                    path:
                      type: object
                      example:
                        bucket: bucket
                        prefix: base
                      properties:
                        bucket:
                          description: Specifies the R2 Bucket to store files.
                          type: string
                          example: bucket
                        filename:
                          description: Specifies the name pattern to for individual data files.
                          example: ${slug}${extension}
                          allOf:
                          - type: string
                          - type: string
                        filepath:
                          description: Specifies the name pattern for directory.
                          type: string
                          example: ${date}/${hour}
                        prefix:
                          description: Specifies the base directory within the bucket.
                          type: string
                          example: base
                      required:
                      - bucket
                    type:
                      description: Specifies the type of destination.
                      type: string
                      enum:
                      - r2
                  required:
                  - type
                  - format
                  - batch
                  - compression
                  - path
                  - credentials
                name:
                  description: Defines the name of the pipeline.
                  type: string
                  example: sample_pipeline
                  maxLength: 128
                  minLength: 1
                source:
                  type: array
                  items:
                    discriminator:
                      mapping:
                        binding: '#/components/schemas/cloudflare-pipelines_workers_pipelines_binding_source'
                        http: '#/components/schemas/cloudflare-pipelines_workers_pipelines_http_source'
                      propertyName: type
                    oneOf:
                    - $ref: '#/components/schemas/cloudflare-pipelines_workers_pipelines_http_source'
                    - $ref: '#/components/schemas/cloudflare-pipelines_workers_pipelines_binding_source'
                  minItems: 1
              required:
              - name
              - source
              - destination
      responses:
        '200':
          description: '[DEPRECATED] Indicates a successfully created pipeline. Use /pipelines/v1/pipelines instead.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/cloudflare-pipelines_workers-pipelines-pipeline'
                  success:
                    $ref: '#/components/schemas/cloudflare-pipelines_worker-pipelines-common-success'
                required:
                - success
                - result
        4XX:
          description: Indicates an error in creating a pipeline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          type: number
                        message:
                          type: string
                      required:
                      - code
                      - message
                      type: object
                    example: []
                  results:
                    type:
                    - object
                    - 'null'
                    x-stainless-empty-object: true
                  success:
                    example: false
                    allOf:
                    - $ref: '#/components/schemas/cloudflare-pipelines_worker-pipelines-common-success'
                required:
                - success
                - results
                - errors
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - workers_pipelines_other
      x-api-token-group:
      - Pipelines Write
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: pipelines
      x-fern-sdk-method-name: legacy-create
      x-forge-hidden: true
  /accounts/{account_id}/pipelines/v1/pipelines:
    get:
      operationId: getV4AccountsByAccount_idPipelinesV1Pipelines
      summary: List Pipelines
      description: List/Filter Pipelines in Account.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cloudflare-pipelines_workers-pipelines-account-id'
      - name: page
        in: query
        schema:
          type: number
          default: 1
      - name: per_page
        in: query
        schema:
          type: number
      - name: name
        in: query
        description: Filters pipelines by name (case-insensitive substring).
        schema:
          type: string
          maxLength: 128
          minLength: 1
      responses:
        '200':
          description: Indicates a successfully listed Pipelines.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      properties:
                        created_at:
                          type: string
                        id:
                          description: Indicates a unique identifier for this pipeline.
                          type: string
                          example: 01234567890123457689012345678901
                        modified_at:
                          type: string
                        name:
                          description: Indicates the name of the Pipeline.
                          type: string
                          example: my_pipeline
                          maxLength: 128
                          minLength: 1
                        sql:
                          description: Specifies SQL for the Pipeline processing flow.
                          type: string
                          example: insert into sink select * from source;
                        status:
                          description: Indicates the current status of the Pipeline.
                          type: string
                      required:
                      - id
                      - name
                      - created_at
                      - modified_at
                      - sql
                      - status
                      type: object
                  result_info:
                    type: object
                    properties:
                      count:
                        description: Indicates the number of items on current page.
                        type: number
                        example: 1
                      page:
                        description: Indicates the current page number.
                        type: number
                        example: 0
                      per_page:
                        description: Indicates the number of items per page.
                        type: number
                        example: 10
                      total_count:
                        description: Indicates the total number of items.
                        type: number
                        example: 1
                    required:
                    - count
                    - page
                    - per_page
                    - total_count
                  success:
                    $ref: '#/components/schemas/cloudflare-pipelines_worker-pipelines-common-success'
                required:
                - success
                - result
                - result_info
        4XX:
          description: Indicates an error in listing Pipelines.
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - workers_pipelines_other
      x-api-token-group:
      - Pipelines Write
      - Pipelines Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: pipelines
      x-fern-sdk-method-name: list
      x-forge-hidden: false
    post:
      operationId: postV4AccountsByAccount_idPipelinesV1Pipelines
      summary: Create Pipeline
      description: Create a new Pipeline.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cloudflare-pipelines_workers-pipelines-account-id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Specifies the name of the Pipeline.
                  type: string
                  example: my_pipeline
                  maxLength: 128
                  minLength: 1
                sql:
                  description: Specifies SQL for the Pipeline processing flow.
                  type: string
                  example: insert into sink select * from source;
              required:
              - name
              - sql
      responses:
        '200':
          description: Indicates a successfully created Pipeline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      created_at:
                        type: string
                      id:
                        description: Indicates a unique identifier for this pipeline.
                        type: string
                        example: 01234567890123457689012345678901
                      modified_at:
                        type: string
                      name:
                        description: Indicates the name of the Pipeline.
                        type: string
                        example: my_pipeline
                        maxLength: 128
                        minLength: 1
                      sql:
                        description: Specifies SQL for the Pipeline processing flow.
                        type: string
                        example: insert into sink select * from source;
                      status:
                        description: Indicates the current status of the Pipeline.
                        type: string
                    required:
                    - id
                    - name
                    - created_at
                    - modified_at
                    - sql
                    - status
                  success:
                    $ref: '#/components/schemas/cloudflare-pipelines_worker-pipelines-common-success'
                required:
                - success
                - result
        4XX:
          description: Indicates an error in creating a Pipeline.
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - workers_pipelines_other
      x-api-token-group:
      - Pipelines Write
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: pipelines
      x-fern-sdk-method-name: create
      x-forge-hidden: false
  /accounts/{account_id}/pipelines/v1/pipelines/{pipeline_id}:
    delete:
      operationId: deleteV4AccountsByAccount_idPipelinesV1PipelinesByPipeline_id
      summary: Delete Pipeline
      description: Delete Pipeline in Account.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cloudflare-pipelines_workers-pipelines-account-id'
      - name: pipeline_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cloudflare-pipelines_workers-pipelines-pipeline-id'
      responses:
        '200':
          description: Indicates a successfully deleted Pipeline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                  success:
                    $ref: '#/components/schemas/cloudflare-pipelines_worker-pipelines-common-success'
                required:
                - success
                - result
        4XX:
          description: Indicates an error in listing Pipelines.
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - workers_pipelines_other
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: pipelines
      x-fern-sdk-method-name: delete
      x-forge-hidden: false
    get:
      operationId: getV4AccountsByAccount_idPipelinesV1PipelinesByPipeline_id
      summary: Get Pipeline Details
      description: Get Pipeline details.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cloudflare-pipelines_workers-pipelines-account-id'
      - name: pipeline_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cloudflare-pipelines_workers-pipelines-pipeline-id'
      responses:
        '200':
          description: Indicates a successfully retrieved Pipeline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      created_at:
                        type: string
                      failure_reason:
                        description: Indicates the reason for the failure of the Pipeline.
                        type: string
                      id:
                        description: Indicates a unique identifier for this pipeline.
                        type: string
                        example: 01234567890123457689012345678901
                      modified_at:
                        type: string
                      name:
                        description: Indicates the name of the Pipeline.
                        type: string
                        example: my_pipeline
                        maxLength: 128
                        minLength: 1
                      sql:
                        description: Specifies SQL for the Pipeline processing flow.
                        type: string
                        example: insert into sink select * from source;
                      status:
                        description: Indicates the current status of the Pipeline.
                        type: string
                      tables:
                        description: List of streams and sinks used by this pipeline.
                        type: array
                        items:
                          properties:
                            id:
                              description: Unique identifier for the connection (stream or sink).
                              type: string
                              example: 1c9200d5872c018bb34e93e2cd8a438e
                            latest:
                              description: Latest available version of the connection.
                              type: integer
                              example: 5
                            name:
                              description: Name of the connection.
                              type: string
                              example: my_table
                              maxLength: 128
                              minLength: 1
                            type:
                              description: Type of the connection.
                              type: string
                              example: stream
                              enum:
                              - stream
                              - sink
                            version:
                              description: Current version of the connection used by this pipeline.
                              type: integer
                              example: 4
                          required:
                          - id
                          - version
                          - latest
                          - type
                          - name
                          type: object
                    required:
                    - id
                    - name
                    - created_at
                    - modified_at
                    - sql
                    - status
                    - tables
                  success:
                    $ref: '#/components/schemas/cloudflare-pipelines_worker-pipelines-common-success'
                required:
                - success
                - result
        4XX:
          description: Indicates an error in retrieving Pipelines.
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - workers_pipelines_other
      x-api-token-group:
      - Pipelines Write
      - Pipelines Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: pipelines
      x-fern-sdk-method-name: get
      x-forge-hidden: false
  /accounts/{account_id}/pipelines/v1/sinks:
    get:
      operationId: getV4AccountsByAccount_idPipelinesV1Sinks
      summary: List Sinks
      description: List/Filter Sinks in Account.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cloudflare-pipelines_workers-pipelines-account-id'
      - name: pipeline_id
        in: query
        schema:
          type: string
      - name: name
        in: query
        description: Filters sinks by name (case-insensitive substring).
        schema:
          type: string
          maxLength: 128
          minLength: 1
      - name: page
        in: query
        schema:
          type: number
          default: 1
      - name: per_page
        in: query
        schema:
          type: number
      responses:
        '200':
          description: Indicates successfully listed Sinks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      properties:
                        config:
                          description: Defines the configuration of the R2 Sink.
                          oneOf:
                          - $ref: '#/components/schemas/cloudflare-pipelines_r2TablePublic'
                          - $ref: '#/components/schemas/cloudflare-pipelines_r2_data_catalogTablePublic'
                        created_at:
                          type: string
                          format: date-time
                        format:
                          $ref: '#/components/schemas/cloudflare-pipelines_SinkFormat'
                        id:
                          description: Indicates a unique identifier for this sink.
                          type: string
                          example: 01234567890123457689012345678901
                        modified_at:
                          type: string
                          format: date-time
                        name:
                          description: Defines the name of the Sink.
                          type: string
                          example: my_sink
                          maxLength: 128
                          minLength: 1
                        schema:
                          $ref: '#/components/schemas/cloudflare-pipelines_ConnectionSchema'
                        type:
                          description: Specifies the type of sink.
                          type: string
                          example: r2
                          enum:
                          - r2
                          - r2_data_catalog
                          - basin_catalog
                      required:
                      - id
                      - name
                      - created_at
                      - modified_at
                      - type
                      type: object
                  result_info:
                    type: object
                    properties:
                      count:
                        description: Indicates the number of items on current page.
                        type: number
                        example: 1
                      page:
                        description: Indicates the current page number.
                        type: number
                        example: 0
                      per_page:
                        description: Indicates the number of items per page.
                        type: number
                        example: 10
                      total_count:
                        description: Indicates the total number of items.
                        type: number
                        example: 1
                    required:
                    - count
                    - page
                    - per_page
                    - total_count
                  success:
                    $ref: '#/components/schemas/cloudflare-pipelines_worker-pipelines-common-success'
                required:
                - success
                - result
                - result_info
        4XX:
          description: Indicates an error in listing Sinks.
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - workers_pipelines_other
      x-api-token-group:
      - Pipelines Write
      - Pipelines Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: pipelines.sinks
      x-fern-sdk-method-name: list
      x-forge-hidden: false
    post:
      operationId: postV4AccountsByAccount_idPipelinesV1Sinks
      summary: Create Sink
      description: Create a new Sink.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cloudflare-pipelines_workers-pipelines-account-id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  description: Defines the configuration of the R2 Sink.
                  oneOf:
                  - $ref: '#/components/schemas/cloudflare-pipelines_r2Table'
                  - $ref: '#/components/schemas/cloudflare-pipelines_r2_data_catalogTable'
                format:
                  $ref: '#/components/schemas/cloudflare-pipelines_SinkFormat'
                name:
                  description: Defines the name of the Sink.
                  type: string
                  example: my_sink
                  maxLength: 128
                  minLength: 1
                schema:
                  $ref: '#/components/schemas/cloudflare-pipelines_ConnectionSchema'
                type:
                  description: Specifies the type of sink.
                  type: string
                  example: r2
                  enum:
                  - r2
                  - r2_data_catalog
                  - basin_catalog
              required:
              - name
              - type
      responses:
        '200':
          description: Indicates a successfully created Sink.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      config:
                        oneOf:
                        - $ref: '#/components/schemas/cloudflare-pipelines_r2Table'
                        - $ref: '#/components/schemas/cloudflare-pipelines_r2_data_catalogTable'
                      created_at:
                        type: string
                        format: date-time
                      format:
                        $ref: '#/components/schemas/cloudflare-pipelines_SinkFormat'
                      id:
                        description: Indicates a unique identifier for this sink.
                        type: string
                        example: 01234567890123457689012345678901
                      modified_at:
                        type: string
                        format: date-time
                      name:
                        description: Defines the name of the Sink.
                        type: string
                        example: my_sink
                        maxLength: 128
                        minLength: 1
                      schema:
                        $ref: '#/components/schemas/cloudflare-pipelines_ConnectionSchema'
                      type:
                        description: Specifies the type of sink.
                        type: string
                        example: r2
                        enum:
                        - r2
                        - r2_data_catalog
                        - basin_catalog
                    required:
                    - id
                    - name
                    - created_at
                    - modified_at
                    - type
                  success:
                    $ref: '#/components/schemas/cloudflare-pipelines_worker-pipelines-common-success'
                required:
                - success
                - result
        4XX:
          description: Indicates an error in creating a Sink.
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - workers_pipelines_other
      x-api-token-group:
      - Pipelines Write
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: true
