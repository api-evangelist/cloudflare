    get:
      operationId: get_IndicatorAggregate
      summary: Aggregate indicators by column(s)
      description: Aggregate threat indicators by one or more columns (e.g., indicatorType, value) across datasets. Returns top-N groups ordered by count.
      parameters:
      - name: account_id
        in: path
        description: Account ID.
        required: true
        schema:
          description: Account ID.
          type: string
      - name: aggregateBy
        in: query
        description: Column(s) to aggregate by - single column or comma-separated list (e.g., 'indicatorType', 'value', 'indicatorType,value')
        required: true
        schema:
          description: Column(s) to aggregate by - single column or comma-separated list (e.g., 'indicatorType', 'value', 'indicatorType,value')
          type: string
      - name: measure
        in: query
        description: 'What to count per group: ''indicators'' (catalog rows, default) or ''relationships'' (linked events per indicator). Use ''relationships'' for ''top indicator by event activity''.'
        schema:
          description: 'What to count per group: ''indicators'' (catalog rows, default) or ''relationships'' (linked events per indicator). Use ''relationships'' for ''top indicator by event activity''.'
          type: string
          default: indicators
          enum:
          - indicators
          - relationships
      - name: tagUuid
        in: query
        description: Scope to indicators associated with this tag/actor UUID. Combine with measure=relationships for 'top indicator for an actor'.
        schema:
          description: Scope to indicators associated with this tag/actor UUID. Combine with measure=relationships for 'top indicator for an actor'.
          type: string
      - name: datasetIds
        in: query
        description: 'Dataset UUIDs to filter by, or one standalone scope value: ''all''/''*'' for all accessible datasets, ''analytics'' for isAnalytics=true datasets, or ''operational'' for isAnalytics=false datasets. If not provided, aggregates across all accessible datasets.'
        schema:
          description: 'Dataset UUIDs to filter by, or one standalone scope value: ''all''/''*'' for all accessible datasets, ''analytics'' for isAnalytics=true datasets, or ''operational'' for isAnalytics=false datasets. If not provided, aggregates across all accessible datasets.'
          type: array
          items:
            type: string
      - name: createdAfter
        in: query
        description: Filter indicators created after this date/datetime (ISO 8601, e.g., '2024-01-01' or '2024-01-01T00:00:00Z')
        schema:
          description: Filter indicators created after this date/datetime (ISO 8601, e.g., '2024-01-01' or '2024-01-01T00:00:00Z')
          anyOf:
          - format: date-time
            type: string
          - pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
            type: string
      - name: createdBefore
        in: query
        description: Filter indicators created before this date/datetime (ISO 8601, e.g., '2024-12-31' or '2024-12-31T23:59:59Z')
        schema:
