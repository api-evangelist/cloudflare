paths:
  /accounts/{account_id}/cloudforce-one/events/dataset/{dataset_id}/indicators:
    get:
      operationId: get_IndicatorListLegacy
      summary: Lists indicators
      description: This method is deprecated. Please use /events/indicators to retrieve a paginated list of indicators.
      parameters:
      - name: account_id
        in: path
        description: Account ID.
        required: true
        schema:
          description: Account ID.
          type: string
      - name: dataset_id
        in: path
        description: Dataset UUID.
        required: true
        schema:
          description: Dataset UUID.
          type: string
          format: uuid
      - name: page
        in: query
        schema:
          type: number
      - name: pageSize
        in: query
        schema:
          type: number
      - name: name
        in: query
        description: Filter by indicator value (substring match)
        schema:
          description: Filter by indicator value (substring match)
          type: string
      - name: indicatorType
        in: query
        schema:
          type: string
      - name: relatedEvent
        in: query
        description: Filter indicators by related event UUID(s). Multiple UUIDs can be provided by repeating the parameter.
        schema:
          description: Filter indicators by related event UUID(s). Multiple UUIDs can be provided by repeating the parameter.
          type: array
          items:
            type: string
      responses:
        '200':
          description: Returns a list of indicators.
          content:
            application/json:
              schema:
                type: object
                properties:
                  indicators:
                    type: array
                    items:
                      properties:
                        createdAt:
                          type: string
                          format: date-time
                          example: '2022-04-01T00:00:00Z'
                        datasetId:
                          description: The dataset ID this indicator belongs to. Included in list responses.
                          type: string
                          example: dataset-uuid-123
                        indicatorType:
                          type: string
                          example: domain
                        relatedEvents:
                          description: Related events, capped by `relatedEventsLimit` (default 2). Check `relatedEventsHasMore` to detect a capped list; pass `relatedEventsLimit=-1` to retrieve all of them.
                          type: array
                          items:
                            properties:
                              datasetId:
                                type: string
                                example: dataset-uuid-123
                              eventDate:
                                description: ISO 8601 date of the related event. Null for legacy relationships created before event-date tracking was added.
                                type:
                                - string
                                - 'null'
                                example: '2024-06-15T00:00:00Z'
                              eventId:
                                type: string
                                example: event-uuid-456
                            required:
                            - datasetId
                            - eventId
                            type: object
                        relatedEventsHasMore:
                          description: True when this indicator appears in more events than `relatedEvents` contains because `relatedEventsLimit` capped the list. Pass `relatedEventsLimit=-1` to retrieve every related event.
                          type: boolean
                        sources:
                          description: RSS article sources from which this indicator was extracted.
                          type: array
                          items:
                            additionalProperties: false
                            properties:
                              resourceId:
                                type: string
                                format: uuid
                              resourceType:
                                type: string
                                enum:
                                - article
                              system:
                                type: string
                                enum:
                                - threat-signals
                              title:
                                description: Threat Signals article title; null for historical provenance without a stored title.
                                type:
                                - string
                                - 'null'
                            required:
                            - system
                            - resourceType
                            - resourceId
                            - title
                            type: object
                        tags:
                          type: array
                          items:
                            properties:
                              categoryId:
                                description: The UUID of the tag category, or null when the tag is uncategorized.
                                type:
                                - string
                                - 'null'
                              categoryName:
                                type: string
                              uuid:
                                type: string
                              value:
                                type: string
                            type: object
                        tlp:
                          description: 'Traffic Light Protocol designation. UPPERCASE. Possible values: CLEAR, GREEN, AMBER, AMBER-STRICT, RED, PURPLE. Null when not set.'
                          type:
                          - string
                          - 'null'
                          example: AMBER
                        updatedAt:
                          type: string
                          format: date-time
                          example: '2022-04-01T00:00:00Z'
                        uuid:
                          type: string
                          example: 12345678-1234-1234-1234-1234567890ab
                        value:
                          type: string
                          example: malicious-domain.com
                      required:
                      - uuid
                      - indicatorType
                      - value
                      - createdAt
                      - updatedAt
                      - sources
                      type: object
                  pagination:
                    type: object
                    properties:
                      page:
                        type: number
                      pageSize:
                        type: number
                      totalCount:
                        type: number
                      totalPages:
                        type: number
                    required:
                    - page
                    - pageSize
                    - totalCount
                    - totalPages
                required:
                - indicators
                - pagination
        4XX:
          $ref: '#/components/responses/cloudforce-one-events_ApiV4ClientError'
      deprecated: true
      security:
      - api_token: []
      tags:
      - Indicator
      x-api-token-group:
      - Cloudforce One Write
      - Cloudforce One Read
      x-fern-availability: deprecated
      x-fern-sdk-group-name: cloudforce-one.events.dataset.indicators.get
      x-fern-sdk-method-name: indicator-legacy
      x-forge-hidden: true
      x-forge-sunset:
        date: '2030-01-01T00:00:00Z'
  /accounts/{account_id}/cloudforce-one/events/dataset/{dataset_id}/indicators/bulk:
    post:
      operationId: post_IndicatorCreateBulk
      summary: Creates multiple indicators in bulk
      description: Creates multiple indicators at once with their respective types and related datasets.
      parameters:
      - name: account_id
        in: path
        description: Account ID.
        required: true
        schema:
          description: Account ID.
          type: string
      - name: dataset_id
        in: path
        description: Dataset UUID.
        required: true
        schema:
          description: Dataset UUID.
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                autoCreateType:
                  description: Global flag to automatically create indicator types if they don't exist. Individual indicators can override this with their own autoCreateType flag.
                  type: boolean
                indicators:
                  type: array
                  items:
                    properties:
                      autoCreateType:
                        description: If true, automatically create the indicator type if it doesn't exist. If false (default), throw an error when the indicator type doesn't exist.
                        type: boolean
                      indicatorType:
                        type: string
                        example: domain
                      relatedEvents:
                        type: array
                        items:
                          properties:
                            datasetId:
                              type: string
                              example: dataset-uuid-123
                            eventId:
                              type: string
                              example: event-uuid-456
                          required:
                          - datasetId
                          - eventId
                          type: object
                      tags:
                        type: array
                        items:
                          anyOf:
                          - type: string
                          - properties:
                              categoryName:
                                type: string
                              value:
                                type: string
                            required:
                            - value
                            type: object
                      tlp:
                        description: 'Traffic Light Protocol designation. Case-insensitive on input, stored and returned as UPPERCASE. Allowed values: clear, green, amber, amber-strict, red, purple.'
                        type: string
                        example: AMBER
                      value:
                        type: string
                        example: malicious-domain.com
                    required:
                    - indicatorType
                    - value
                    type: object
              required:
              - indicators
      responses:
        '200':
          description: Returns the number of created indicators.
          content:
            application/json:
              schema:
                description: Number of created indicators
                type: number
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                          example: An error occurred.
                      required:
                      - message
                      type: object
                  result:
                    type: object
                  success:
                    type: boolean
                required:
                - result
                - success
                - errors
      security:
      - api_token: []
      tags:
      - Indicator
      x-api-token-group:
      - Cloudforce One Write
      - Cloudforce One Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: cloudforce-one.events.dataset.indicators.bulk
      x-fern-sdk-method-name: create
      x-forge-hidden: true
