    access_saml:
      type: object
      allOf:
      - $ref: '#/components/schemas/access_identity-provider'
      - properties:
          config:
            type: object
            properties:
              attributes:
                description: A list of SAML attribute names that will be added to your signed JWT token and can be used in SAML policy rules.
                type: array
                items:
                  type: string
                example:
                - group
                - department_code
                - divison
              email_attribute_name:
                description: The attribute name for email in the SAML response.
                type: string
                example: Email
                x-auditable: true
              enable_encryption:
                description: "Enable SAML assertion encryption. When enabled, the Identity Provider will encrypt \nSAML assertions using the certificate from the assigned certificate set.\n\nTo enable encryption:\n1. Create a certificate set via POST to `/identity_providers/{id}/saml_certificate`\n2. Set this field to `true` and include `saml_certificate_set_id` in the PUT request\n3. Configure the public certificate in your external Identity Provider\n\nNote: Requires `saml_certificate_set_id` to be set when `true`.\n"
                type: boolean
                default: false
                x-auditable: true
              force_authn:
                description: Asks the IdP to reauthenticate the user for each SAML authentication request.
                type: boolean
                default: false
                x-auditable: true
              header_attributes:
                description: Add a list of attribute names that will be returned in the response header from the Access callback.
                type: array
                items:
                  properties:
                    attribute_name:
                      description: attribute name from the IDP
                      type: string
                    header_name:
                      description: header that will be added on the request to the origin
                      type: string
                  type: object
              idp_public_certs:
                description: X509 certificate to verify the signature in the SAML authentication response
                type: array
                items:
                  type: string
              issuer_url:
                description: IdP Entity ID or Issuer URL
                type: string
                example: https://whoami.com
                x-auditable: true
              max_sso_url_length:
                description: 'The maximum URL length the IdP accepts for the SSO redirect URL.

                  When the constructed SSO URL would exceed this length, the RelayState

                  is stored server-side and a short nonce is passed to the IdP instead.

                  Set this if your IdP enforces a URL length limit.

                  '
                type: integer
                example: 8192
                maximum: 100000
                minimum: 512
                x-auditable: true
              sign_request:
                description: Sign the SAML authentication request with Access credentials. To verify the signature, use the public key from the Access certs endpoints.
                type: boolean
                default: false
              sso_target_url:
                description: URL to send the SAML authentication requests to
                type: string
                example: https://edgeaccess.org/idp/saml/login
                x-auditable: true
        type: object
      title: Generic SAML
    access_cf_resource_id-2:
      description: 'The unique Cloudflare-generated Id of the SCIM User resource; also known as the "Id".

        Pass once for a single lookup (`?cf_resource_id=A`) or repeat the parameter

        (`?cf_resource_id=A&cf_resource_id=B`) to look up multiple users in one request,

        up to 50 values. Mutually exclusive with `idp_resource_id`, `username`, `email`,

        `name`, `search_contains`, and `search_starts_with`.'
      type: array
      items:
        type: string
      example:
      - bd97ef8d-7986-43e3-9ee0-c25dda33e4b0
      maxItems: 50
    access_oidc:
