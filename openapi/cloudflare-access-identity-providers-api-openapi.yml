openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Access identity providers API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Access identity providers
paths:
  /accounts/{account_id}/access/identity_providers:
    get:
      operationId: access-identity-providers-list-access-identity-providers
      summary: List Access identity providers
      description: Lists all configured identity providers.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      - name: scim_enabled
        in: query
        schema:
          description: Indicates to Access to only retrieve identity providers that have the System for Cross-Domain Identity Management (SCIM) enabled.
          type: string
          example: true
      - $ref: '#/components/parameters/access_page'
      - name: per_page
        in: query
        schema:
          description: Number of results per page.
          type: integer
          default: 200
          maximum: 1000
      responses:
        '200':
          description: List Access identity providers response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_response_collection'
        4XX:
          description: List Access identity providers response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access identity providers
      x-api-token-group:
      - 'Access: Organizations, Identity Providers, and Groups Write'
      - 'Access: Organizations, Identity Providers, and Groups Read'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.identity-providers
      x-fern-sdk-method-name: list
    post:
      operationId: access-identity-providers-add-an-access-identity-provider
      summary: Add an Access identity provider
      description: Adds a new identity provider to Access.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/access_identity-providers'
      responses:
        '201':
          description: Add an Access identity provider response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_single_response-3'
        4XX:
          description: Add an Access identity provider response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access identity providers
      x-api-token-group:
      - 'Access: Organizations, Identity Providers, and Groups Write'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.identity-providers
      x-fern-sdk-method-name: create
  /accounts/{account_id}/access/identity_providers/{identity_provider_id}:
    delete:
      operationId: access-identity-providers-delete-an-access-identity-provider
      summary: Delete an Access identity provider
      description: Deletes an identity provider from Access.
      parameters:
      - name: identity_provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_uuid'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      responses:
        '202':
          description: Delete an Access identity provider response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_id_response'
        4XX:
          description: Delete an Access identity provider response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access identity providers
      x-api-token-group:
      - 'Access: Organizations, Identity Providers, and Groups Write'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.identity-providers
      x-fern-sdk-method-name: delete
    get:
      operationId: access-identity-providers-get-an-access-identity-provider
      summary: Get an Access identity provider
      description: Fetches a configured identity provider.
      parameters:
      - name: identity_provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_uuid'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      responses:
        '200':
          description: Get an Access identity provider response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_single_response-3'
        4XX:
          description: Get an Access identity provider response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access identity providers
      x-api-token-group:
      - 'Access: Organizations, Identity Providers, and Groups Write'
      - 'Access: Organizations, Identity Providers, and Groups Read'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.identity-providers
      x-fern-sdk-method-name: get
    put:
      operationId: access-identity-providers-update-an-access-identity-provider
      summary: Update an Access identity provider
      description: Updates a configured identity provider.
      parameters:
      - name: identity_provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_uuid'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/access_identity-providers'
      responses:
        '200':
          description: Update an Access identity provider response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_single_response-3'
        4XX:
          description: Update an Access identity provider response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access identity providers
      x-api-token-group:
      - 'Access: Organizations, Identity Providers, and Groups Write'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.identity-providers
      x-fern-sdk-method-name: update
  /accounts/{account_id}/access/identity_providers/{identity_provider_id}/saml_certificate:
    post:
      operationId: access-identity-providers-create-saml-certificate-for-identity-provider
      summary: Create SAML encryption certificate for Identity Provider
      description: 'Creates a new SAML encryption certificate set and assigns it to the specified

        SAML Identity Provider. This endpoint is idempotent - if the IdP already has

        a certificate set assigned, the existing certificate set is returned with a 200 status.


        **Workflow for enabling SAML encryption:**

        1. Call this endpoint to create and assign a certificate set to the IdP

        2. Update the IdP configuration (PUT `/identity_providers/{id}`) with:

        - `config.enable_encryption: true`

        - `saml_certificate_set_id: `

        3. Configure the certificate''s public key in your external SAML Identity Provider'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      - name: identity_provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_uuid'
      responses:
        '200':
          description: IdP already has a certificate set assigned (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_saml_certificate_set_response'
        '201':
          description: SAML certificate set created and assigned to IdP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_saml_certificate_set_response'
        '403':
          description: SAML encryption not enabled for organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
        '404':
          description: Identity provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
        4XX:
          description: Create SAML certificate for IdP response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access identity providers
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.identity-providers.saml-certificate
      x-fern-sdk-method-name: create
  /accounts/{account_id}/access/identity_providers/{identity_provider_id}/scim/groups:
    get:
      operationId: access-identity-providers-list-scim-group-resources
      summary: List SCIM Group resources
      description: Lists SCIM Group resources synced to Cloudflare via the System for Cross-domain Identity Management (SCIM).
      parameters:
      - name: identity_provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_uuid'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      - name: cf_resource_id
        in: query
        schema:
          $ref: '#/components/schemas/access_cf_resource_id'
        explode: true
        style: form
      - name: idp_resource_id
        in: query
        schema:
          $ref: '#/components/schemas/access_idp_resource_id'
        explode: true
        style: form
      - name: name
        in: query
        schema:
          $ref: '#/components/schemas/access_name-4'
      - $ref: '#/components/parameters/access_page'
      - name: per_page
        in: query
        schema:
          description: Number of results per page.
          type: integer
          default: 100
          maximum: 100
      responses:
        '200':
          description: List SCIM Group resources response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_scim_groups_response'
        4XX:
          description: List SCIM Group resources response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access identity providers
      x-api-token-group:
      - 'Access: Organizations, Identity Providers, and Groups Write'
      - 'Access: Organizations, Identity Providers, and Groups Read'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.identity-providers.scim.groups
      x-fern-sdk-method-name: list
  /accounts/{account_id}/access/identity_providers/{identity_provider_id}/scim/groups/{group_id}:
    delete:
      operationId: access-identity-providers-delete-scim-group-resource
      summary: Delete a SCIM Group resource
      description: Deletes a SCIM Group resource from the identity provider's SCIM population.
      parameters:
      - name: identity_provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_uuid'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      - name: group_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      responses:
        '204':
          description: SCIM Group resource deleted.
        4XX:
          description: Failed to delete the SCIM Group resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access identity providers
      x-api-token-group:
      - 'Access: Organizations, Identity Providers, and Groups Write'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.identity-providers.scim.groups
      x-fern-sdk-method-name: delete
    get:
      operationId: access-identity-providers-get-scim-group-resource
      summary: Get a SCIM Group resource
      description: Returns a SCIM Group resource, including its direct members, synced to Cloudflare via the System for Cross-domain Identity Management (SCIM).
      parameters:
      - name: identity_provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_uuid'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      - name: group_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      responses:
        '200':
          description: Returns a SCIM Group resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_scim_group_response'
        4XX:
          description: Indicates a failure to get a SCIM Group resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access identity providers
      x-api-token-group:
      - 'Access: Organizations, Identity Providers, and Groups Write'
      - 'Access: Organizations, Identity Providers, and Groups Read'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.identity-providers.scim.groups
      x-fern-sdk-method-name: get
  /accounts/{account_id}/access/identity_providers/{identity_provider_id}/scim/users:
    get:
      operationId: access-identity-providers-list-scim-user-resources
      summary: List SCIM User resources
      description: Lists SCIM User resources synced to Cloudflare via the System for Cross-domain Identity Management (SCIM).
      parameters:
      - name: identity_provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_uuid'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      - name: cf_resource_id
        in: query
        schema:
          $ref: '#/components/schemas/access_cf_resource_id-2'
        explode: true
        style: form
      - name: idp_resource_id
        in: query
        schema:
          $ref: '#/components/schemas/access_idp_resource_id-2'
        explode: true
        style: form
      - name: username
        in: query
        schema:
          $ref: '#/components/schemas/access_username'
      - name: email
        in: query
        schema:
          $ref: '#/components/schemas/access_email'
      - name: name
        in: query
        schema:
          $ref: '#/components/schemas/access_name-5'
      - $ref: '#/components/parameters/access_page'
      - name: per_page
        in: query
        schema:
          description: Number of results per page.
          type: integer
          default: 100
          maximum: 100
      responses:
        '200':
          description: List SCIM User resources response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_scim_users_response'
        4XX:
          description: List SCIM User resources response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access identity providers
      x-api-token-group:
      - 'Access: Organizations, Identity Providers, and Groups Write'
      - 'Access: Organizations, Identity Providers, and Groups Read'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.identity-providers.scim.users
      x-fern-sdk-method-name: list
  /accounts/{account_id}/access/identity_providers/{identity_provider_id}/scim/users/{user_id}:
    delete:
      operationId: access-identity-providers-delete-scim-user-resource
      summary: Delete a SCIM User resource
      description: Deletes a SCIM User resource from the identity provider's SCIM population.
      parameters:
      - name: identity_provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_uuid'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      - name: user_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      responses:
        '204':
          description: SCIM User resource deleted.
        4XX:
          description: Failed to delete the SCIM User resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access identity providers
      x-api-token-group:
      - 'Access: Organizations, Identity Providers, and Groups Write'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.identity-providers.scim.users
      x-fern-sdk-method-name: delete
    get:
      operationId: access-identity-providers-get-scim-user-resource
      summary: Get a SCIM User resource
      description: Returns a SCIM User resource synced to Cloudflare via the System for Cross-domain Identity Management (SCIM).
      parameters:
      - name: identity_provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_uuid'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      - name: user_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/access_identifier'
      responses:
        '200':
          description: Returns a SCIM User resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_scim_user_response'
        4XX:
          description: Indicates a failure to get a SCIM User resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Access identity providers
      x-api-token-group:
      - 'Access: Organizations, Identity Providers, and Groups Write'
      - 'Access: Organizations, Identity Providers, and Groups Read'
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.identity-providers.scim.users
      x-fern-sdk-method-name: get
components:
  schemas:
    access_pingone:
      type: object
      allOf:
      - $ref: '#/components/schemas/access_identity-provider'
      - properties:
          config:
            allOf:
            - $ref: '#/components/schemas/access_generic-oauth-config'
            - $ref: '#/components/schemas/access_custom-claims-support'
            - properties:
                ping_env_id:
                  description: Your PingOne environment identifier
                  type: string
                  example: 342b5660-0c32-4936-a5a4-ce21fae57b0a
                  x-auditable: true
              type: object
        type: object
      title: PingOne
    access_github:
      type: object
      allOf:
      - $ref: '#/components/schemas/access_identity-provider'
      - properties:
          config:
            $ref: '#/components/schemas/access_generic-oauth-config'
        type: object
      title: GitHub
    access_messages:
      type: array
      items:
        properties:
          code:
            type: integer
            minimum: 1000
          documentation_url:
            type: string
          message:
            type: string
          source:
            type: object
            properties:
              pointer:
                type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      example: []
    access_linkedin:
      type: object
      allOf:
      - $ref: '#/components/schemas/access_identity-provider'
      - properties:
          config:
            $ref: '#/components/schemas/access_generic-oauth-config'
        type: object
      title: LinkedIn
    access_facebook:
      type: object
      allOf:
      - $ref: '#/components/schemas/access_identity-provider'
      - properties:
          config:
            $ref: '#/components/schemas/access_generic-oauth-config'
        type: object
      title: Facebook
    access_api-response-common-failure:
      type: object
      properties:
        errors:
          example:
          - code: 7003
            message: No route for the URI
          allOf:
          - $ref: '#/components/schemas/access_messages'
          minLength: 1
        messages:
          example: []
          allOf:
          - $ref: '#/components/schemas/access_messages'
        result:
          type:
          - object
          - 'null'
          enum:
          - null
        success:
          description: Whether the API call was successful.
          type: boolean
          example: false
          enum:
          - false
      required:
      - success
      - errors
      - messages
      - result
    access_saml_certificate_set:
      description: A SAML encryption certificate set containing current and optionally previous certificates for encryption key rotation.
      type: object
      properties:
        created_at:
          description: Timestamp when the certificate set was created
          type: string
          format: date-time
          example: '2026-05-07T19:16:19.821162Z'
        current_certificate:
          description: The currently active certificate used for encrypting SAML assertions
          allOf:
          - $ref: '#/components/schemas/access_saml_certificate'
        previous_certificate:
          description: The previous certificate, maintained during rotation to ensure continuity. Null if no rotation has occurred. Mirrors the structure of `saml_certificate`.
          type:
          - object
          - 'null'
        uid:
          description: Unique identifier for the certificate set
          type: string
          format: uuid
          example: c409ef44-e72c-41c8-8c0b-278c8a6f4fd8
        updated_at:
          description: Timestamp when the certificate set was last updated (e.g., during rotation)
          type: string
          format: date-time
          example: '2026-05-07T19:16:19.821162Z'
      required:
      - uid
      - created_at
      - updated_at
    access_passkeys:
      type: object
      allOf:
      - $ref: '#/components/schemas/access_identity-provider'
      - properties:
          config:
            type: object
            properties:
              login_page_auto_prompt:
                description: When enabled, the Access login page automatically prompts the user to authenticate with a passkey.
                type: boolean
                default: false
                x-auditable: true
              redirect_url:
                type: string
                readOnly: true
          type:
            type: string
            enum:
            - passkeys
        type: object
      title: Passkeys
    access_groups:
      type: object
      properties:
        displayName:
          description: The display name of the SCIM Group resource.
          type: string
          example: ALL EMPLOYEES
        externalId:
          $ref: '#/components/schemas/access_externalId'
        id:
          $ref: '#/components/schemas/access_id'
        meta:
          $ref: '#/components/schemas/access_meta'
        schemas:
          description: The list of URIs which indicate the attributes contained within a SCIM resource.
          type: array
          items:
            type: string
          example:
          - urn:ietf:params:scim:schemas:core:2.0:Group
    access_custom-claims-support:
      type: object
      properties:
        claims:
          description: Custom claims
          type: array
          items:
            type: string
          example:
          - email_verified
          - preferred_username
          - custom_claim_name
          x-auditable: true
        email_claim_name:
          description: The claim name for email in the id_token response.
          type: string
          example: custom_claim_name
          x-auditable: true
    access_generic-oauth-config:
      type: object
      properties:
        client_id:
          description: Your OAuth Client ID
          type: string
          example: <your client id>
        client_secret:
          description: Your OAuth Client Secret
          type: string
          example: <your client secret>
          x-sensitive: true
    access_api-response-common:
      type: object
      properties:
        errors:
          $ref: '#/components/schemas/access_messages'
        messages:
          $ref: '#/components/schemas/access_messages'
        success:
          description: Whether the API call was successful.
          type: boolean
          example: true
          enum:
          - true
      required:
      - success
      - errors
      - messages
    access_name-5:
      description: The name of the SCIM User resource.
      type: string
      example: John Smith
    access_email:
      description: The email address of the SCIM User resource.
      type: string
      example: john.smith@example.com
    access_api-response-collection:
      type: object
      allOf:
