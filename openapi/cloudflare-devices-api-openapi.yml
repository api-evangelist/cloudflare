openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Devices API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Devices
paths:
  /accounts/{account_id}/devices:
    get:
      operationId: devices-list-devices
      summary: List devices (deprecated)
      description: 'List WARP devices. Not supported when multi-user mode is enabled for the account.


        **Deprecated**: please use one of the following endpoints instead:

        - GET /accounts/{account_id}/devices/physical-devices

        - GET /accounts/{account_id}/devices/registrations'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      responses:
        '200':
          description: List devices response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_devices_response'
        4XX:
          description: List devices response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_api-response-common-failure'
      deprecated: true
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Devices
      x-fern-availability: deprecated
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.devices.v1
      x-fern-sdk-method-name: list
  /accounts/{account_id}/devices/policies:
    get:
      operationId: devices-list-device-settings-policies
      summary: List device settings profiles
      description: Fetches a list of the device settings profiles for an account.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      - name: profile_type
        in: query
        description: Filter profiles by client type. When omitted, only WARP profiles are returned.
        schema:
          $ref: '#/components/schemas/teams-devices_profile_type'
      responses:
        '200':
          description: List device settings profiles response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_device_settings_response_collection'
        4XX:
          description: List device settings profiles response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Devices
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.devices.profiles.custom
      x-fern-sdk-method-name: list
  /accounts/{account_id}/devices/policy:
    get:
      operationId: devices-get-default-device-settings-policy
      summary: Get the default device settings profile
      description: Fetches the default device settings profile for an account.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      responses:
        '200':
          description: Get the default device settings profile response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_default_device_settings_response'
        4XX:
          description: Get the default device settings profile response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Devices
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.devices.profiles.default
      x-fern-sdk-method-name: get
    patch:
      operationId: devices-update-default-device-settings-policy
      summary: Update the default device settings profile
      description: Updates the default device settings profile for an account.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allow_mode_switch:
                  $ref: '#/components/schemas/teams-devices_allow_mode_switch'
                allow_updates:
                  $ref: '#/components/schemas/teams-devices_allow_updates'
                allowed_to_leave:
                  $ref: '#/components/schemas/teams-devices_allowed_to_leave'
                auto_connect:
                  $ref: '#/components/schemas/teams-devices_auto_connect'
                captive_portal:
                  $ref: '#/components/schemas/teams-devices_captive_portal'
                disable_auto_fallback:
                  $ref: '#/components/schemas/teams-devices_disable_auto_fallback'
                dns_search_suffixes:
                  $ref: '#/components/schemas/teams-devices_dns_search_suffixes'
                exclude:
                  $ref: '#/components/schemas/teams-devices_exclude_request'
                exclude_office_ips:
                  $ref: '#/components/schemas/teams-devices_exclude_office_ips'
                global_acceleration:
                  $ref: '#/components/schemas/teams-devices_global_acceleration'
                include:
                  $ref: '#/components/schemas/teams-devices_include_request'
                lan_allow_minutes:
                  $ref: '#/components/schemas/teams-devices_lan_allow_minutes'
                lan_allow_subnet_size:
                  $ref: '#/components/schemas/teams-devices_lan_allow_subnet_size'
                register_interface_ip_with_dns:
                  $ref: '#/components/schemas/teams-devices_register_interface_ip_with_dns'
                sccm_vpn_boundary_support:
                  $ref: '#/components/schemas/teams-devices_sccm_vpn_boundary_support'
                service_mode_v2:
                  $ref: '#/components/schemas/teams-devices_service_mode_v2'
                support_url:
                  $ref: '#/components/schemas/teams-devices_support_url'
                switch_locked:
                  $ref: '#/components/schemas/teams-devices_switch_locked'
                tunnel_protocol:
                  $ref: '#/components/schemas/teams-devices_tunnel_protocol'
                uninstall_protection:
                  $ref: '#/components/schemas/teams-devices_uninstall_protection'
                virtual_networks:
                  $ref: '#/components/schemas/teams-devices_virtual_networks'
      responses:
        '200':
          description: Update the default device settings profile response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_default_device_settings_response'
        4XX:
          description: Update the default device settings profile response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Devices
      x-api-token-group:
      - Zero Trust Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.devices.profiles.default
      x-fern-sdk-method-name: update
    post:
      operationId: devices-create-device-settings-policy
      summary: Create a device settings profile
      description: Creates a device settings profile to be applied to certain devices matching the criteria.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allow_mode_switch:
                  $ref: '#/components/schemas/teams-devices_allow_mode_switch'
                allow_updates:
                  $ref: '#/components/schemas/teams-devices_allow_updates'
                allowed_to_leave:
                  $ref: '#/components/schemas/teams-devices_allowed_to_leave'
                auto_connect:
                  $ref: '#/components/schemas/teams-devices_auto_connect'
                browser_extension_config:
                  $ref: '#/components/schemas/teams-devices_browser_extension_config'
                captive_portal:
                  $ref: '#/components/schemas/teams-devices_captive_portal'
                default:
                  $ref: '#/components/schemas/teams-devices_default'
                description:
                  allOf:
                  - $ref: '#/components/schemas/teams-devices_schemas-description'
                  - default: ''
                    type: string
                    x-auditable: true
                disable_auto_fallback:
                  $ref: '#/components/schemas/teams-devices_disable_auto_fallback'
                dns_search_suffixes:
                  $ref: '#/components/schemas/teams-devices_dns_search_suffixes'
                enabled:
                  description: Whether the policy will be applied to matching devices.
                  type: boolean
                  example: true
                  default: true
                  x-auditable: true
                exclude:
                  $ref: '#/components/schemas/teams-devices_exclude_request'
                exclude_office_ips:
                  $ref: '#/components/schemas/teams-devices_exclude_office_ips'
                global_acceleration:
                  $ref: '#/components/schemas/teams-devices_global_acceleration'
                include:
                  $ref: '#/components/schemas/teams-devices_include_request'
                lan_allow_minutes:
                  $ref: '#/components/schemas/teams-devices_lan_allow_minutes'
                lan_allow_subnet_size:
                  $ref: '#/components/schemas/teams-devices_lan_allow_subnet_size'
                match:
                  $ref: '#/components/schemas/teams-devices_schemas-match'
                name:
                  description: The name of the device settings profile.
                  type: string
                  example: Allow Developers
                  maxLength: 100
                  x-auditable: true
                precedence:
                  $ref: '#/components/schemas/teams-devices_precedence'
                profile_type:
                  $ref: '#/components/schemas/teams-devices_profile_type'
                register_interface_ip_with_dns:
                  $ref: '#/components/schemas/teams-devices_register_interface_ip_with_dns'
                sccm_vpn_boundary_support:
                  $ref: '#/components/schemas/teams-devices_sccm_vpn_boundary_support'
                service_mode_v2:
                  $ref: '#/components/schemas/teams-devices_service_mode_v2'
                support_url:
                  $ref: '#/components/schemas/teams-devices_support_url'
                switch_locked:
                  $ref: '#/components/schemas/teams-devices_switch_locked'
                tunnel_protocol:
                  $ref: '#/components/schemas/teams-devices_tunnel_protocol'
                uninstall_protection:
                  $ref: '#/components/schemas/teams-devices_uninstall_protection'
                virtual_networks:
                  $ref: '#/components/schemas/teams-devices_virtual_networks'
              required:
              - name
      responses:
        '200':
          description: Create a device settings profile response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_device_settings_response'
        4XX:
          description: Create a device settings profile response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Devices
      x-api-token-group:
      - Zero Trust Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.devices.profiles.custom
      x-fern-sdk-method-name: create
  /accounts/{account_id}/devices/policy/exclude:
    delete:
      operationId: devices-delete-split-tunnel-exclude-list
      summary: Reset Split Tunnel exclude list
      description: Resets the Split Tunnel exclude list to the default value.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      - name: reset_defaults
        in: query
        description: Deprecated and ignored. Deleting the list always restores the defaults.
        schema:
          type: boolean
          default: true
        deprecated: true
      responses:
        '200':
          description: Reset the Split Tunnel exclude list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_split_tunnel_response_collection'
        4XX:
          description: Reset the Split Tunnel exclude list response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Devices
      x-api-token-group:
      - Zero Trust Write
      x-auditable: true
      x-fern-availability: generally-available
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.devices.profiles.default.excludes
      x-fern-sdk-method-name: delete
    get:
      operationId: devices-get-split-tunnel-exclude-list
      summary: Get the Split Tunnel exclude list
      description: Fetches the list of routes excluded from the WARP client's tunnel.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      responses:
        '200':
          description: Get the Split Tunnel exclude list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_split_tunnel_response_collection'
        4XX:
          description: Get the Split Tunnel exclude list response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Devices
      x-fern-availability: generally-available
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.devices.profiles.default.excludes
      x-fern-sdk-method-name: get
    put:
      operationId: devices-set-split-tunnel-exclude-list
      summary: Set the Split Tunnel exclude list
      description: Sets the list of routes excluded from the WARP client's tunnel.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/teams-devices_split_tunnel'
      responses:
        '200':
          description: Set the Split Tunnel exclude list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_split_tunnel_response_collection'
        4XX:
          description: Set the Split Tunnel exclude list response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Devices
      x-api-token-group:
      - Zero Trust Write
      x-fern-availability: generally-available
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.devices.profiles.default.excludes
      x-fern-sdk-method-name: update
  /accounts/{account_id}/devices/policy/fallback_domains:
    delete:
      operationId: devices-delete-local-domain-fallback-list
      summary: Reset Local Domain Fallback
      description: Restores the default Local Domain Fallback list for the default device profile.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      - name: reset_defaults
        in: query
        description: Deprecated and ignored. Deleting the list always restores the defaults.
        schema:
          type: boolean
          default: true
        deprecated: true
      responses:
        '200':
          description: Reset your Local Domain Fallback list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_fallback_domain_response_collection'
        4XX:
          description: Reset your Local Domain Fallback list response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Devices
      x-api-token-group:
      - Zero Trust Write
      x-auditable: true
      x-fern-availability: generally-available
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.devices.profiles.default.fallback-domains
      x-fern-sdk-method-name: delete
    get:
      operationId: devices-get-local-domain-fallback-list
      summary: Get your Local Domain Fallback list
      description: Fetches a list of domains to bypass Gateway DNS resolution. These domains will use the specified local DNS resolver instead.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      responses:
        '200':
          description: Get your Local Domain Fallback list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_fallback_domain_response_collection'
        4XX:
          description: Get your Local Domain Fallback list response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Devices
      x-fern-availability: generally-available
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.devices.profiles.default.fallback-domains
      x-fern-sdk-method-name: get
    put:
      operationId: devices-set-local-domain-fallback-list
      summary: Set your Local Domain Fallback list
      description: Sets the list of domains to bypass Gateway DNS resolution. These domains will use the specified local DNS resolver instead.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/teams-devices_fallback_domain'
      responses:
        '200':
          description: Set your Local Domain Fallback list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_fallback_domain_response_collection'
        4XX:
          description: Set your Local Domain Fallback list response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Devices
      x-api-token-group:
      - Zero Trust Write
      x-fern-availability: generally-available
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.devices.profiles.default.fallback-domains
      x-fern-sdk-method-name: update
  /accounts/{account_id}/devices/policy/include:
    get:
      operationId: devices-get-split-tunnel-include-list
      summary: Get the Split Tunnel include list
      description: Fetches the list of routes included in the WARP client's tunnel.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      responses:
        '200':
          description: Get the Split Tunnel include list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_split_tunnel_include_response_collection'
        4XX:
          description: Get the Split Tunnel include list response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Devices
      x-fern-availability: generally-available
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.devices.profiles.default.includes
      x-fern-sdk-method-name: get
    put:
      operationId: devices-set-split-tunnel-include-list
      summary: Set the Split Tunnel include list
      description: Sets the list of routes included in the WARP client's tunnel.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/teams-devices_split_tunnel_include'
      responses:
        '200':
          description: Set the Split Tunnel include list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_split_tunnel_include_response_collection'
        4XX:
          description: Set the Split Tunnel include list response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Devices
      x-api-token-group:
      - Zero Trust Write
      x-fern-availability: generally-available
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.devices.profiles.default.includes
      x-fern-sdk-method-name: update
  /accounts/{account_id}/devices/policy/{policy_id}:
    delete:
      operationId: devices-delete-device-settings-policy
      summary: Delete a device settings profile
      description: Deletes a device settings profile and fetches a list of the remaining profiles for an account.
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_schemas-uuid'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      responses:
        '200':
          description: Delete a device settings profile response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_device_settings_response_collection'
        4XX:
          description: Delete a device settings profile response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Devices
      x-api-token-group:
      - Zero Trust Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.devices.profiles.custom
      x-fern-sdk-method-name: delete
    get:
      operationId: devices-get-device-settings-policy-by-id
      summary: Get device settings profile by ID
      description: Fetches a device settings profile by ID.
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_schemas-uuid'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      responses:
        '200':
          description: Get device settings profile by ID response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_device_settings_response'
        4XX:
          description: Get device settings profile by ID response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/teams-devices_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Devices
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.devices.profiles.custom
      x-fern-sdk-method-name: get
    patch:
      operationId: devices-update-device-settings-policy
      summary: Update a device settings profile
      description: Updates a configured device settings profile.
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_schemas-uuid'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/teams-devices_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allow_mode_switch:
                  $ref: '#/components/schemas/teams-devices_allow_mode_switch'
                allow_updates:
                  $ref: '#/components/schemas/teams-devices_allow_updates'
                allowed_to_leave:
                  $ref: '#/components/schemas/teams-devices_allowed_to_leave'
                auto_connect:
                  $ref: '#/components/schemas/teams-devices_auto_connect'
                browser_extension_config:
                  $ref: '#/components/schemas/teams-devices_browser_extension_config'
                captive_portal:
                  $ref: '#/components/schemas/teams-devices_captive_portal'
                default:
                  $ref: '#/components/schemas/teams-devices_default'
                description:
                  $ref: '#/components/schemas/teams-devices_schemas-description'
                disable_auto_fallback:
                  $ref: '#/components/schemas/teams-devices_disable_auto_fallback'
                dns_search_suffixes:
                  $ref: '#/components/schemas/teams-devices_dns_search_suffixes'
                enabled:
