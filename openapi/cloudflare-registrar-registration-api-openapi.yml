  /accounts/{account_id}/registrar-sandbox/registrations/{domain_name}/registration-status:
    get:
      operationId: sandbox-registrar-domain-registration-get-status
      summary: Get Registration Status
      description: 'Returns the current status of a domain registration workflow.


        Use this endpoint to poll for completion when the POST response

        returned `202 Accepted`. The URL is provided in the `links.self`

        field of the workflow status response.


        Poll this endpoint until the workflow reaches a terminal state or a

        state that requires user attention.


        **Terminal states:** `succeeded` and `failed` are terminal and always

        have `completed: true`.


        **Non-terminal states:**

        - `action_required` has `completed: false` and will not resolve on its

        own. The workflow is paused pending user intervention.

        - `blocked` has `completed: false` and indicates the workflow is waiting

        on a third party such as the extension registry or losing registrar.

        Continue polling while informing the user of the delay.


        Use increasing backoff between polls. When `state: blocked`, use a

        longer polling interval and do not poll indefinitely.


        A naive polling loop that only checks `completed` can run indefinitely

        when `state: action_required`. Break explicitly on `action_required`:


        ```js

        let status;

        do {

        await new Promise(r => setTimeout(r, 2000));

        status = await cloudflare.request({

        method: ''GET'',

        path: reg.result.links.self,

        });

        } while (

        !status.result.completed &&

        status.result.state !== ''action_required''

        );


        if (status.result.state === ''action_required'') {

        // Surface context.action and context.confirmation_sent_to to the user.

        // Do not re-submit the registration request.

        }

        ```'
      parameters:
      - name: account_id
        in: path
        description: Cloudflare account ID. Required for all Registrar API operations.
        required: true
        schema:
          $ref: '#/components/schemas/registrar-api-sandbox_identifier'
      - name: domain_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/registrar-api-sandbox_domain_name'
      responses:
        '200':
          description: Registration workflow status.
          content:
            application/json:
              examples:
                action_required:
                  description: 'Non-terminal but not transient. The workflow is paused and

                    requires user action to proceed. An automated polling loop

                    must break on this state — it will not resolve on its own.

                    Surface context.action to the user.

                    '
                  summary: User action required
                  value:
                    errors: []
                    messages: []
                    result:
                      completed: false
                      context:
                        action: registrant_email_confirmation_pending
                        confirmation_sent_to: a***@example.com
                        domain_name: example.com
                      created_at: '2025-10-27T10:00:00Z'
                      links:
                        resource: /accounts/abc/registrar/registrations/example.com
                        self: /accounts/abc/registrar/registrations/example.com/registration-status
                      state: action_required
                      updated_at: '2025-10-27T10:01:00Z'
                    success: true
                blocked:
                  description: 'Non-terminal. The workflow cannot make progress due to a

                    third party (e.g., the extension''s registry or a losing

                    registrar). Unlike action_required, no user action will help.

                    Continue polling — the block may resolve when the third party

                    responds.

                    '
                  summary: Blocked by third party
                  value:
                    errors: []
                    messages: []
                    result:
                      completed: false
                      context:
                        domain_name: example.com
                      created_at: '2025-10-27T10:00:00Z'
                      links:
                        resource: /accounts/abc/registrar/registrations/example.com
                        self: /accounts/abc/registrar/registrations/example.com/registration-status
                      state: blocked
                      updated_at: '2025-10-27T10:05:00Z'
                    success: true
                failed:
                  description: 'Terminal state. The registration could not be completed.

                    See error.code and error.message for the reason. Do not

                    auto-retry without user review.

                    '
                  summary: Registration failed
                  value:
                    errors: []
                    messages: []
                    result:
                      completed: true
                      context:
                        domain_name: example.com
                      created_at: '2025-10-27T10:00:00Z'
                      error:
                        code: registry_rejected
                        message: Registry rejected the registration request.
                      links:
                        resource: /accounts/abc/registrar/registrations/example.com
                        self: /accounts/abc/registrar/registrations/example.com/registration-status
                      state: failed
                      updated_at: '2025-10-27T10:00:08Z'
                    success: true
                in_progress:
                  description: 'The registration is still being processed. Continue polling

                    this endpoint. In synchronous mode, the server only waits

                    for a bounded amount of time before returning `202` — this

                    status is what you see when polling after that timeout. Registrations

                    will not remain in this state indefinitely; the workflow has

                    an internal deadline after which it transitions to succeeded,

                    failed, or blocked.

                    '
                  summary: Registration in progress
                  value:
                    errors: []
                    messages: []
                    result:
                      completed: false
                      context:
                        domain_name: example.com
                      created_at: '2025-10-27T10:00:00Z'
                      links:
                        resource: /accounts/abc/registrar/registrations/example.com
                        self: /accounts/abc/registrar/registrations/example.com/registration-status
                      state: in_progress
                      updated_at: '2025-10-27T10:00:12Z'
                    success: true
                succeeded:
                  description: 'Terminal state. The domain has been registered. The full

                    registration resource is included in context.registration —

                    no additional GET request is needed.

                    '
                  summary: Registration completed successfully
                  value:
                    errors: []
                    messages: []
                    result:
                      completed: true
                      context:
                        domain_name: example.com
                        registration:
                          auto_renew: true
                          created_at: '2025-10-27T10:00:00Z'
                          domain_name: example.com
                          expires_at: '2026-10-27T10:00:00Z'
                          locked: true
                          privacy_mode: redaction
                          status: active
                      created_at: '2025-10-27T10:00:00Z'
                      links:
                        resource: /accounts/abc/registrar/registrations/example.com
                        self: /accounts/abc/registrar/registrations/example.com/registration-status
                      state: succeeded
                      updated_at: '2025-10-27T10:00:03Z'
                    success: true
              schema:
                $ref: '#/components/schemas/registrar-api-sandbox_workflow-status-response-single'
        4XX:
          description: Get status failure.
          content:
            application/json:
              examples:
                workflow_not_found:
                  summary: No workflow found
                  value:
                    errors:
                    - code: 10000
                      message: No workflow found for example.com
                    messages: []
                    result: null
                    success: false
              schema:
                $ref: '#/components/schemas/registrar-api-sandbox_api-response-common-failure'
