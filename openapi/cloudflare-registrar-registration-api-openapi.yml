paths:
  /accounts/{account_id}/registrar-sandbox/registrations:
    get:
      operationId: sandbox-registrar-domain-registration-list
      summary: List Registrations
      description: 'Returns a paginated list of domain registrations owned by the account.


        This endpoint uses cursor-based pagination. Results are ordered by registration

        date by default. To fetch the next page, pass the `cursor` value from the

        `result_info` object in the response as the `cursor` query parameter in

        your next request. An empty `cursor` string indicates there are no more

        pages.'
      parameters:
      - name: account_id
        in: path
        description: Cloudflare account ID.
        required: true
        schema:
          $ref: '#/components/schemas/registrar-api-sandbox_identifier'
      - $ref: '#/components/parameters/registrar-api-sandbox_cursor_pagination_cursor'
      - $ref: '#/components/parameters/registrar-api-sandbox_cursor_pagination_per_page'
      - $ref: '#/components/parameters/registrar-api-sandbox_cursor_pagination_direction'
      - name: sort_by
        in: query
        description: Column to sort results by. Defaults to registration date (`registry_created_at`) when omitted.
        schema:
          type: string
          default: registry_created_at
          enum:
          - registry_created_at
          - registry_expires_at
          - name
