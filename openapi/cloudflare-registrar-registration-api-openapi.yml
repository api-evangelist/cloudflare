          example: '+1.5555555555'
        phone:
          description: 'Phone number in E.164 format: `+{country_code}.{number}` without spaces or dashes. Examples: `+1.5555555555` (US), `+44.2071234567` (UK), `+81.312345678` (Japan).'
          type: string
          example: '+1.5555555555'
        postal_info:
          $ref: '#/components/schemas/registrar-api_registration_contact_postal_info'
      required:
      - phone
      - email
      - postal_info
    registrar-api-sandbox_registration_contact_address:
      description: Physical mailing address for the registrant contact.
      type: object
      properties:
        city:
          description: City or locality name.
          type: string
          example: Austin
        country_code:
          description: Two-letter country code per ISO 3166-1 alpha-2 (e.g., `US`, `GB`, `CA`, `DE`).
          type: string
          example: US
        postal_code:
          description: Postal or ZIP code.
          type: string
          example: '78701'
        state:
          description: State, province, or region. Use the standard abbreviation where applicable (e.g., `TX` for Texas, `ON` for Ontario).
          type: string
          example: TX
        street:
          description: Street address including building/suite number.
          type: string
          example: 123 Main St
      required:
      - street
      - city
      - state
      - postal_code
      - country_code
    registrar-api_registration-response-single:
      allOf:
      - $ref: '#/components/schemas/registrar-api_api-response-common'
      - properties:
          result:
            $ref: '#/components/schemas/registrar-api_registration'
        type: object
    registrar-api-sandbox_cursor_result_info:
      description: 'Provides cursor-based pagination metadata. List endpoints use this

        metadata for cursor pagination. Pass the `cursor` value as a query

        parameter in the next request to fetch the next page. An empty string

        indicates the end of pagination.

        '
      type: object
      properties:
        count:
          description: Number of items in the current result set.
          type: integer
          example: 20
        cursor:
          description: 'Opaque cursor for fetching the next page. Pass this value as the

            `cursor` query parameter in a subsequent request. An empty string

            indicates the end of pagination.

            '
          type: string
          example: eyJ0IjoiMjAyNS0wNi0xNVQxMjowMDowMC4wMDAwMDBaIiwibiI6ImJyYXZvLm5ldCJ9
        per_page:
          description: Maximum number of items per page.
          type: integer
          example: 20
      required:
      - cursor
      - per_page
      - count
    registrar-api_registration_contacts:
      description: 'Provides contact data for the registration request.


        The per-extension schema from

        `GET /accounts/{account_id}/registrar/extensions/{extension}` defines the

        accepted contact roles. Every currently supported extension requires only

        `contacts.registrant` from API callers. Callers may provide additional roles

        such as `technical`, `administrator`, and `billing` when the extension

        schema includes them. When a registry requires an omitted role, Cloudflare

        may derive that contact from `contacts.registrant`.


        When the request omits either the entire `contacts` object or

        `contacts.registrant`, the system uses the account''s default address book

        entry as the registrant contact. The account owner must configure this

        default at `https://dash.cloudflare.com/{account_id}/domains/registrations`,

        where they can create or update the address book entry and accept the

        required agreement. Dashboard settings currently provide the only way to

        manage address book entries.


        Without either a default address book entry or a registrant contact, the

        registration request fails validation.

        '
      type: object
      properties:
        administrator:
          description: 'Optional administrator contact. Accepted only when the extension

            schema includes this role. When the registry requires an omitted

            contact, Cloudflare may derive it from `contacts.registrant`.

            '
          allOf:
          - $ref: '#/components/schemas/registrar-api_registration_contact'
        billing:
          description: 'Optional billing contact. Accepted only when the extension schema

            includes this role. When the registry requires an omitted contact,

            Cloudflare may derive it from `contacts.registrant`.

            '
          allOf:
          - $ref: '#/components/schemas/registrar-api_registration_contact'
        registrant:
          description: 'Optional registrant contact. If omitted, the account''s default

            address book entry is used instead.

            '
          allOf:
          - $ref: '#/components/schemas/registrar-api_registration_contact'
        technical:
          description: 'Optional technical contact. Accepted only when the extension schema

            includes this role. When the registry requires an omitted contact,

            Cloudflare may derive it from `contacts.registrant`.

            '
          allOf:
          - $ref: '#/components/schemas/registrar-api_registration_contact'
    registrar-api_workflow_error:
      description: Provides error details when a workflow reaches the `failed` state. The workflow type (registration, update, etc.) and underlying registry response determine the specific codes and messages. Workflow error codes differ from immediate HTTP error `errors[].code` values in non-2xx responses. Surface `error.message` to the user for context.
      type: object
      properties:
        code:
          description: Machine-readable error code identifying the failure reason.
          type: string
          example: registry_rejected
        message:
          description: Human-readable explanation of the failure. May include registry-specific details.
          type: string
          example: Registry rejected the request.
      required:
      - code
      - message
    registrar-api-sandbox_api-response-common-failure:
      type: object
      properties:
        errors:
          example:
          - code: 7003
            message: No route for the URI
          allOf:
          - $ref: '#/components/schemas/registrar-api-sandbox_messages'
          minItems: 1
        messages:
          example: []
          allOf:
          - $ref: '#/components/schemas/registrar-api-sandbox_messages'
        result:
          type:
          - object
          - 'null'
          enum:
          - null
        success:
          description: Whether the API call was successful.
          type: boolean
          example: false
          enum:
          - false
      required:
      - success
      - errors
      - messages
      - result
    registrar-api-sandbox_registration:
      description: A domain registration resource representing the current state of a registered domain.
      type: object
      properties:
        auto_renew:
          description: Whether automatic renewal occurs before expiration.
          type: boolean
          example: true
        created_at:
          description: When the domain was registered. Present when the registration resource exists.
          type: string
          format: date-time
          example: '2025-01-15T10:00:00Z'
        domain_name:
          $ref: '#/components/schemas/registrar-api-sandbox_domain_name'
        expires_at:
          description: When the domain registration expires. Ready registrations include this value; only `registration_pending` and `transfer_pending` may return null.
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-01-15T10:00:00Z'
        locked:
          description: Whether the domain is locked for transfer.
          type: boolean
          example: true
        privacy_mode:
          description: Current WHOIS privacy mode for the registration.
          type: string
          example: redaction
          enum:
          - 'off'
          - redaction
        status:
          description: 'Current registration status.

            - `active`: The domain operates with an active registration.

            - `registration_pending`: Registration remains in progress.

            - `transfer_pending`: Domain transfer is in progress.

            - `expired`: The domain registration expired.

            - `suspended`: The registry suspended the domain.

            - `redemption_period`: The domain entered the redemption grace period.

            - `pending_delete`: The registry scheduled the domain for deletion.

            '
          type: string
          example: active
          enum:
          - active
          - registration_pending
          - transfer_pending
          - expired
          - suspended
          - redemption_period
          - pending_delete
      required:
      - domain_name
      - status
      - created_at
      - expires_at
      - auto_renew
      - privacy_mode
      - locked
    registrar-api_api-response-common:
      type: object
      properties:
        errors:
          $ref: '#/components/schemas/registrar-api_messages'
        messages:
          $ref: '#/components/schemas/registrar-api_messages'
        result:
          anyOf:
          - type: object
          - items:
              type: object
            type: array
          - type: string
        success:
          description: Whether the API call was successful.
          type: boolean
          example: true
          enum:
          - true
      required:
      - success
      - errors
      - messages
      - result
    registrar-api_registration_create_request:
      type: object
      properties:
        acknowledgements:
          description: 'Provides user acknowledgements for a specific extension or premium

            registration flow. The extension registration schema from the

            extension discovery endpoint identifies the required keys.

            '
          type: object
          example:
            fees:
              currency: USD
              registration_fee: 10
              renewal_fee: 10
          additionalProperties: true
        auto_renew:
          description: 'Enable or disable automatic renewal. Defaults to `false` if omitted.

            Setting this field to `true` is an explicit opt-in authorizing

            Cloudflare to charge the account''s default payment method up to 30

            days before domain expiry to renew the domain automatically.

            Renewal pricing may change over time based on registry pricing.

            '
          type: boolean
          example: false
          default: false
        contact_extensions:
          description: 'Provides registry-specific contact extension values for the registrant.

            `GET /accounts/{account_id}/registrar/extensions/{extension}` identifies

            the required keys and allowed values for each extension in the

            `registration_schema.properties.contact_extensions` object.


            Examples include `.us` nexus fields, `.uk` registrant type fields,

            and `.ca` legal type fields. Omit this object when the extension''s

            registration schema excludes `contact_extensions`.

            '
          type: object
          example:
            application_purpose: P3
            nexus_category: C11
          additionalProperties: true
        contacts:
          type: object
          allOf:
          - $ref: '#/components/schemas/registrar-api_registration_contacts'
        domain_name:
          $ref: '#/components/schemas/registrar-api_domain_name'
        privacy_mode:
          description: "Sets the WHOIS privacy mode for the registration. Defaults to `redaction`.\n- `off`: Disables WHOIS privacy.\n- `redaction`: Requests WHOIS redaction where the extension supports it.\n  Some extensions exclude privacy and redaction.\n"
          type: string
          example: redaction
          default: redaction
          enum:
          - 'off'
          - redaction
        years:
          description: 'Sets the registration term from 1 to 10 years. When omitted, this

            field defaults to the registry''s minimum registration period for the

            extension. Most extensions require 1 year, while some require longer

            minimum terms (e.g., `.ai` requires 2 years).


            Each registry may also enforce its own maximum registration term. A

            request above that maximum fails. When uncertain, omit this field to

            use the default.

            '
          type: integer
          example: 1
          maximum: 10
          minimum: 1
      required:
      - domain_name
    registrar-api-sandbox_workflow_links:
      type: object
      properties:
