          $ref: '#/components/schemas/digital-experience-monitoring_per_page'
      - name: sort_by
        in: query
        description: Dimension to sort results by.
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_sort_by'
      - name: colo
        in: query
        description: Cloudflare colo airport code.
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_colo'
      - name: device_id
        in: query
        description: Device-specific ID, given as UUID.
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_device_id'
      - name: mode
        in: query
        description: The mode under which the WARP client is run.
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_mode'
        x-fern-parameter-name: device-mode
      - name: status
        in: query
        description: Network status.
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_status'
      - name: platform
        in: query
        description: Operating system.
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_platform'
      - name: version
        in: query
        description: WARP client version.
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_version'
        x-fern-parameter-name: warp-version
      - name: source
        in: query
        description: "Source:\n  * `hourly` - device details aggregated hourly, up to 7 days prior\n  * `last_seen` - device details, up to 60 minutes prior. Time windows exceeding 60 minutes will be rejected from June 1st, 2026. Please use 'hourly' or 'raw' instead for longer time ranges.\n  * `raw` - device details, up to 7 days prior\n"
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_source'
      responses:
        '200':
          description: List devices response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_fleet_status_devices_response'
        4XX:
          description: List devices response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      - user_service_key: []
      tags:
      - DEX Synthetic Application Monitoring
      x-api-token-group:
      - Cloudflare DEX Write
      - Cloudflare DEX Read
      - Zero Trust Report
      - Zero Trust Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.dex.devices
      x-fern-sdk-method-name: list
      x-forge-hidden: true
