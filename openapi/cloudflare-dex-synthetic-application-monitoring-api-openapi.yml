openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare DEX Synthetic Application Monitoring API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: DEX Synthetic Application Monitoring
paths:
  /accounts/{account_id}/dex/colos:
    get:
      operationId: dex-endpoints-list-colos
      summary: List Cloudflare colos
      description: List Cloudflare colos that account's devices were connected to during a time period, sorted by usage starting from the most used colo. Colos without traffic are also returned and sorted alphabetically.
      parameters:
      - name: account_id
        in: path
        description: Unique Cloudflare account ID.
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - name: from
        in: query
        description: Start time for connection period in ISO (RFC3339 - ISO 8601) format.
        required: true
        schema:
          type: string
          example: '2023-08-20T20:45:00Z'
      - name: to
        in: query
        description: End time for connection period in ISO (RFC3339 - ISO 8601) format.
        required: true
        schema:
          type: string
          example: '2023-08-24T20:45:00Z'
      - name: sortBy
        in: query
        description: Type of usage that colos should be sorted by. If unspecified, returns all Cloudflare colos sorted alphabetically.
        schema:
          type: string
          enum:
          - fleet-status-usage
          - application-tests-usage
      responses:
        '200':
          description: List colos response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/digital-experience-monitoring_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/digital-experience-monitoring_colos_response'
                  type: object
        4XX:
          description: List colos failure response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      - user_service_key: []
      tags:
      - DEX Synthetic Application Monitoring
      x-api-token-group:
      - Cloudflare DEX Write
      - Cloudflare DEX Read
      - Zero Trust Report
      - Zero Trust Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.dex.colos
      x-fern-sdk-method-name: list
      x-forge-hidden: true
  /accounts/{account_id}/dex/devices/dex_tests:
    get:
      operationId: device-dex-test-details
      summary: List Device DEX tests
      description: Fetch all DEX tests.
      parameters:
      - name: account_id
        in: path
        description: Unique Cloudflare account ID.
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - name: page
        in: query
        description: Page number of paginated results.
        schema:
          type: number
          example: 1
          default: 1
          minimum: 1
      - name: per_page
        in: query
        description: Number of results per page.
        schema:
          type: number
          example: 10
          default: 10
          maximum: 50
          minimum: 1
      - name: testName
        in: query
        description: Filter by test name.
        schema:
          type: string
      - name: kind
        in: query
        description: Filter by test type.
        schema:
          type: string
          enum:
          - http
          - traceroute
      responses:
        '200':
          description: Device DEX test details response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_dex-response_collection'
        4XX:
          description: Device DEX test response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DEX Synthetic Application Monitoring
      x-api-token-group:
      - Cloudflare DEX Write
      - Cloudflare DEX Read
      - Zero Trust Report
      - Zero Trust Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.dex.tests
      x-fern-sdk-method-name: list
      x-forge-hidden: true
    post:
      operationId: device-dex-test-create-device-dex-test
      summary: Create Device DEX test
      description: Create a DEX test.
      parameters:
      - name: account_id
        in: path
        description: Unique Cloudflare account ID.
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/digital-experience-monitoring_device-dex-test-schemas-http'
      responses:
        '200':
          description: Update Dex test response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_dex-single_response'
        4XX:
          description: Update Dex test response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DEX Synthetic Application Monitoring
      x-api-token-group:
      - Cloudflare DEX Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.dex.tests
      x-fern-sdk-method-name: create
      x-forge-hidden: true
  /accounts/{account_id}/dex/devices/dex_tests/{dex_test_id}:
    delete:
      operationId: device-dex-test-delete-device-dex-test
      summary: Delete Device DEX test
      description: Delete a Device DEX test. Returns the remaining device dex tests for the account.
      parameters:
      - name: account_id
        in: path
        description: Unique Cloudflare account ID.
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - name: dex_test_id
        in: path
        description: Unique identifier for a DEX test.
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_uuid'
      responses:
        '200':
          description: Delete Device DEX test response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_dex-delete-response-collection'
        4XX:
          description: Delete DEX test response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/digital-experience-monitoring_dex-response_collection'
                - $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DEX Synthetic Application Monitoring
      x-api-token-group:
      - Cloudflare DEX Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.dex.tests
      x-fern-sdk-method-name: delete
      x-forge-hidden: true
    get:
      operationId: device-dex-test-get-device-dex-test
      summary: Get Device DEX test
      description: Fetch a single DEX test.
      parameters:
      - name: account_id
        in: path
        description: Unique Cloudflare account ID.
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - name: dex_test_id
        in: path
        description: Unique identifier for a DEX test.
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_schemas-test-id'
      responses:
        '200':
          description: Device DEX test details response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_dex-single_response'
        4XX:
          description: Device DEX test response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DEX Synthetic Application Monitoring
      x-api-token-group:
      - Cloudflare DEX Write
      - Cloudflare DEX Read
      - Zero Trust Report
      - Zero Trust Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.dex.tests
      x-fern-sdk-method-name: get
      x-forge-hidden: true
    put:
      operationId: device-dex-test-update-device-dex-test
      summary: Update Device DEX test
      description: Update a DEX test.
      parameters:
      - name: account_id
        in: path
        description: Unique Cloudflare account ID.
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - name: dex_test_id
        in: path
        description: Unique identifier for a DEX test.
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/digital-experience-monitoring_device-dex-test-schemas-http'
      responses:
        '200':
          description: Update Dex test response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_dex-single_response'
        4XX:
          description: Update Dex test response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - DEX Synthetic Application Monitoring
      x-api-token-group:
      - Cloudflare DEX Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.dex.tests
      x-fern-sdk-method-name: update
      x-forge-hidden: true
  /accounts/{account_id}/dex/devices/{device_id}/fleet-status/live:
    get:
      operationId: devices-live-status
      summary: Get the latest status of a device
      description: Get the latest status of a device given device_id from the device_state table.
      parameters:
      - name: account_id
        in: path
        description: Unique Cloudflare account ID.
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - name: device_id
        in: path
        description: Device-specific ID, given as UUID.
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_device_id'
      - name: since_minutes
        in: query
        description: Number of minutes before current time.
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_since_minutes'
      - name: time_now
        in: query
        description: Current time in ISO format.
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_time_now'
        deprecated: true
        x-stainless-deprecation-message: This parameter is deprecated and will be removed in the future.
      - name: colo
        in: query
        description: List of data centers to filter results.
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_colo'
      responses:
        '200':
          description: Get the latest status of a device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_device'
        4XX:
          description: Get the latest status of a device failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      - user_service_key: []
      tags:
      - DEX Synthetic Application Monitoring
      x-api-token-group:
      - Cloudflare DEX Write
      - Cloudflare DEX Read
      - Zero Trust Report
      - Zero Trust Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.dex.devices
      x-fern-sdk-method-name: get
      x-forge-hidden: true
  /accounts/{account_id}/dex/devices/{device_id}/fleet-status/over-time:
    get:
      operationId: dex-device-status-over-time
      summary: Get the status over time for a device
      description: Get time-bucketed status metrics for a specific device.
      parameters:
      - name: account_id
        in: path
        description: Unique Cloudflare account ID.
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - name: device_id
        in: path
        description: Device-specific ID, given as UUID.
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_device_id'
      - name: from
        in: query
        description: Start of the time range to query. Timestamp can be provided in ISO 8601 datetime format or milliseconds since epoch.
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_timestamp'
      - name: to
        in: query
        description: End of the time range to query. Timestamp can be provided in ISO 8601 datetime format or milliseconds since epoch.
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_timestamp'
      - name: interval
        in: query
        description: Time interval for aggregate time slots.
        required: true
        schema:
          type: string
          enum:
          - minute
          - hour
      - name: colo
        in: query
        description: List of data centers to filter results.
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_colo'
      responses:
        '200':
          description: Device status over time response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/digital-experience-monitoring_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/digital-experience-monitoring_device_status_over_time_result'
                  type: object
        4XX:
          description: Device status over time failure response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      - user_service_key: []
      tags:
      - DEX Synthetic Application Monitoring
      x-api-token-group:
      - Cloudflare DEX Write
      - Cloudflare DEX Read
      - Zero Trust Report
      - Zero Trust Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.dex.devices.over-time
      x-fern-sdk-method-name: get
      x-forge-hidden: true
  /accounts/{account_id}/dex/devices/{device_id}/isps:
    get:
      operationId: dex-endpoints-list-device-isps
      summary: List device ISPs
      description: List ISP information observed for a specific device during traceroute tests.
      parameters:
      - name: account_id
        in: path
        description: Unique Cloudflare account ID.
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_account_identifier'
      - name: device_id
        in: path
        description: Device-specific ID, given as UUID.
        required: true
        schema:
          $ref: '#/components/schemas/digital-experience-monitoring_uuid'
      - name: page
        in: query
        description: Page number of paginated results. Mutually exclusive with cursor.
        schema:
          type: integer
          example: 1
          default: 1
          minimum: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: true
        schema:
          type: integer
          example: 10
          maximum: 50
          minimum: 1
      - name: cursor
        in: query
        description: Cursor for cursor-based pagination. Mutually exclusive with page.
        schema:
          type: string
      - name: sort_by
        in: query
        description: The field to sort results by.
        schema:
          type: string
          default: time_start
          enum:
          - time_start
      - name: sort_order
        in: query
        description: The order to sort results.
        schema:
          type: string
          default: DESC
          enum:
          - ASC
          - DESC
      - name: from
        in: query
        description: Start time for the query in ISO 8601 format.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: End time for the query in ISO 8601 format.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: List of ISPs observed for the device.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/digital-experience-monitoring_api-response-collection'
                - properties:
                    result:
                      $ref: '#/components/schemas/digital-experience-monitoring_device_isps_response'
                  type: object
        4XX:
          description: List device ISPs failure response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/digital-experience-monitoring_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      - user_service_key: []
      tags:
      - DEX Synthetic Application Monitoring
      x-api-token-group:
      - Cloudflare DEX Write
      - Cloudflare DEX Read
      - Zero Trust Report
      - Zero Trust Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.dex.isps
      x-fern-sdk-method-name: list
      x-forge-hidden: true
  /accounts/{account_id}/dex/fleet-status/devices:
