components:
  schemas:
    speed_messages:
      type: array
      items:
        properties:
          code:
            type: integer
            minimum: 1000
            x-auditable: true
          message:
            type: string
            x-auditable: true
        required:
        - code
        - message
        type: object
        uniqueItems: true
      example: []
    speed_automatic_platform_optimization_value:
      description: 'Configuration for Automatic Platform Optimization (APO) for WordPress.

        Set to "off" to disable, or provide an object to configure APO settings.

        '
      oneOf:
      - description: Disable Automatic Platform Optimization.
        enum:
        - 'off'
        type: string
      - properties:
          cache_by_device_type:
            description: Whether to cache by device type.
            type: boolean
            example: false
          cf:
            description: Whether the zone is proxied through Cloudflare.
            type: boolean
            example: true
          enabled:
            description: Whether APO is enabled.
            type: boolean
            example: true
          hostnames:
            description: List of hostnames where APO is active.
            type: array
            items:
              type: string
            example:
            - www.example.com
          recheck:
            description: Whether to recheck WordPress and plugin detection.
            type: boolean
            example: false
          wordpress:
            description: Whether the site is a WordPress site.
            type: boolean
            example: true
          wp_plugin:
            description: Whether the Cloudflare WordPress plugin is installed.
            type: boolean
            example: true
        required:
        - cf
        - enabled
        - wordpress
        - wp_plugin
        type: object
      title: Automatic Platform Optimization value
    zones_security_header_value:
      type: object
      properties:
        strict_transport_security:
          description: Strict Transport Security.
          type: object
          properties:
            enabled:
              description: Whether or not strict transport security is enabled.
              type: boolean
              example: true
            include_subdomains:
              description: Include all subdomains for strict transport security.
              type: boolean
              example: true
            max_age:
              description: Max age in seconds of the strict transport security.
              type: number
              example: 86400
            nosniff:
              description: 'Whether or not to include ''X-Content-Type-Options: nosniff'' header.'
              type: boolean
              example: true
            preload:
              description: Enable automatic preload of the HSTS configuration.
              type: boolean
              example: true
      default:
        strict_transport_security:
          enabled: true
          include_subdomains: true
          max_age: 86400
          nosniff: true
          preload: false
    zones_sort_query_string_for_cache_value:
      description: Value of the zone setting.
      type: string
      default: 'off'
      enum:
      - 'on'
      - 'off'
    zones_true_client_ip_header-2:
      description: Allows customer to continue to use True Client IP (Akamai feature) in the headers we send to the origin. This is limited to Enterprise Zones.
      default: 'off'
      allOf:
      - $ref: '#/components/schemas/zones_base'
      - properties:
          id:
            description: ID of the zone setting.
            example: true_client_ip_header
            enum:
            - true_client_ip_header
          value:
            $ref: '#/components/schemas/zones_true_client_ip_header_value'
      title: True Client IP Header
    zones_ciphers:
      description: An allowlist of ciphers for TLS termination. These ciphers must be in the BoringSSL format.
      default: []
      allOf:
      - $ref: '#/components/schemas/zones_base'
      - properties:
          id:
            description: ID of the zone setting.
            example: ciphers
            enum:
            - ciphers
          value:
            $ref: '#/components/schemas/zones_ciphers_value'
      title: Zone ciphers allowed for TLS termination
    zones_cache-rules_aegis:
      description: Aegis provides dedicated egress IPs (from Cloudflare to your origin) for your layer 7 WAF and CDN services. The egress IPs are reserved exclusively for your account so that you can increase your origin security by only allowing traffic from a small list of IP addresses.
      type: object
      allOf:
      - $ref: '#/components/schemas/zones_cache-rules_base'
      - properties:
          id:
            description: ID of the zone setting.
            type: string
            example: aegis
            enum:
            - aegis
            x-auditable: true
          value:
