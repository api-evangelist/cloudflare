  /zones/{zone_id}/settings/origin_h2_max_streams:
    get:
      operationId: zone-cache-settings-get-origin-h2-max-streams-setting
      summary: Get Origin H2 Max Streams Setting
      description: Origin H2 Max Streams configures the max number of concurrent requests that Cloudflare will send within the same connection when communicating with the origin server, if the origin supports it. Note that if your origin does not support H2 multiplexing, 5xx errors may be observed, particularly 520s. Also note that the default value is `100` for all plan types except Enterprise where it is `1`. `1` means that H2 multiplexing is disabled.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cache-settings_identifier'
      responses:
        '200':
          description: Get Origin H2 Max Streams setting response.
          content:
            application/json:
              examples:
                origin_h2_max_streams_50:
                  $ref: '#/components/examples/cache-settings_origin_h2_max_streams_50'
              schema:
                $ref: '#/components/schemas/cache-settings_origin_h2_max_streams_response_value'
        4XX:
          description: Get Origin H2 Max Streams setting response failure.
          content:
            application/json:
              examples:
                Error:
                  $ref: '#/components/examples/cache-settings_dummy_error_response'
              schema:
                $ref: '#/components/schemas/cache-settings_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Zone Settings
      x-api-token-group:
      - Zone Settings Write
      - Zone Settings Read
      - Zone Read
      - Zone Write
      x-cfPermissionsRequired:
        enum:
        - '#zone_settings:read'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zones.origin-h2-max-streams
      x-fern-sdk-method-name: get
      x-forge-hidden: true
    patch:
      operationId: zone-cache-settings-change-origin-h2-max-streams-setting
      summary: Change Origin H2 Max Streams Setting
      description: Origin H2 Max Streams configures the max number of concurrent requests that Cloudflare will send within the same connection when communicating with the origin server, if the origin supports it. Note that if your origin does not support H2 multiplexing, 5xx errors may be observed, particularly 520s. Also note that the default value is `100` for all plan types except Enterprise where it is `1`. `1` means that H2 multiplexing is disabled.
      parameters:
      - name: zone_id
        in: path
        required: true
