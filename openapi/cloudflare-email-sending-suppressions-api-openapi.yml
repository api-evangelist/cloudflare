openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Email Sending suppressions API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Email Sending suppressions
paths:
  /accounts/{account_id}/email/sending/suppression:
    get:
      operationId: get_publicListSuppressionSending
      summary: List account email suppressions
      description: Lists email suppressions for the specified account.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          example: '54442216'
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 0
      - name: per_page
        in: query
        schema:
          type: integer
          default: 100
          maximum: 1000
          minimum: 0
      - name: order
        in: query
        schema:
          type: string
          default: created_at
          enum:
          - email
          - expires_at
          - created_at
      - name: direction
        in: query
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
      responses:
        '200':
          description: Returns suppressed emails.
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                    example: 0
                  per_page:
                    type: integer
                    example: 100
                  result:
                    type: array
                    items:
                      properties:
                        created_at:
                          type: string
                          format: date-time
                        email:
                          type: string
                          format: email
                          example: user@example.com
                        expires_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        id:
                          type: string
                          format: uuid
                        reason:
                          type: string
                          example: hard_bounce
                        zones:
                          type: array
                          items:
                            type: string
                          default: []
                      required:
                      - id
                      - email
                      - reason
                      - created_at
                      - expires_at
                      type: object
                  total:
                    type: integer
                    example: 1
                required:
                - page
                - per_page
                - total
                - result
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                  success:
                    type: boolean
                    example: false
                required:
                - success
                - errors
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Sending suppressions
      x-fern-ignore: true
      x-fern-sdk-group-name: email.suppressions
      x-fern-sdk-method-name: list
      x-forge-hidden: true
    post:
      operationId: post_publicNewSuppressionSending
      summary: Create account email suppression
      description: Creates a new email suppression for the specified account.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          example: '54442216'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                expires_at:
                  type:
                  - string
                  - 'null'
                  format: date-time
              required:
              - email
      responses:
        '200':
          description: Returns suppression.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                    required:
                    - id
                required:
                - result
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                  success:
                    type: boolean
                    example: false
                required:
                - success
                - errors
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Sending suppressions
      x-fern-ignore: true
      x-fern-sdk-group-name: email.suppressions
      x-fern-sdk-method-name: create
      x-forge-hidden: true
  /accounts/{account_id}/email/sending/suppression/{suppression_id}:
    delete:
      operationId: delete_publicDeleteSuppressionSending
      summary: Delete account email suppression
      description: Deletes an email suppression for the specified account.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          example: '54442216'
      - name: suppression_id
        in: path
        required: true
        schema:
          type: string
          example: 396a5436-d4b0-42a6-b3fc-48e8fa522321
      responses:
        '200':
          description: Deletes suppression.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                - success
        '404':
          description: Suppression not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  success:
                    type: boolean
                    example: false
                required:
                - success
                - error
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Sending suppressions
      x-fern-ignore: true
      x-fern-sdk-group-name: email.suppressions
      x-fern-sdk-method-name: delete
      x-forge-hidden: true
    get:
      operationId: get_publicGetSuppressionSending
      summary: Get account email suppression
      description: Retrieves a single email suppression for the specified account.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          example: '54442216'
      - name: suppression_id
        in: path
        required: true
        schema:
          type: string
          example: 396a5436-d4b0-42a6-b3fc-48e8fa522321
      responses:
        '200':
          description: Returns suppression.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      created_at:
                        type: string
                        format: date-time
                      email:
                        type: string
                        format: email
                        example: user@example.com
                      expires_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                      id:
                        type: string
                        format: uuid
                      reason:
                        type: string
                        example: hard_bounce
                      zones:
                        type: array
                        items:
                          type: string
                        default: []
                    required:
                    - id
                    - email
                    - reason
                    - created_at
                    - expires_at
                required:
                - result
        '404':
          description: Suppression not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  success:
                    type: boolean
                    example: false
                required:
                - success
                - error
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Sending suppressions
      x-fern-ignore: true
      x-fern-sdk-group-name: email.suppressions
      x-fern-sdk-method-name: get
      x-forge-hidden: true
  /accounts/{account_id}/email/sending/suppressions:
    get:
      operationId: get_publicListSendingSuppressions
      summary: List account Email Sending suppressions
      description: 'Lists every active Email Sending suppression owned by the account: sending-domain suppressions first, then account-wide suppressions (including legacy rows with internal zone memberships). Each group is newest first.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          description: Cloudflare account ID.
          type: string
          example: '12345678'
      - name: per_page
        in: query
        schema:
          description: Maximum number of suppressions to return per page.
          type: integer
          example: 100
          default: 100
          maximum: 1000
          minimum: 1
      - name: cursor
        in: query
        schema:
          description: Opaque pagination cursor returned as `result_info.next_cursor`. It carries the filters that produced it.
          type: string
          example: eyJ0Ijo0LCJwaCI6ImRvbWFpbiIsInAiOjEyMywiYyI6ImMzZGM1ZjBiMzRhMTRmZjhlMWIzZWMwNDg5NWUxYjIyIn0
          maxLength: 2048
      - name: email
        in: query
        schema:
          description: Exact email-address filter.
          type: string
          format: email
          example: user@example.com
      - name: search
        in: query
        schema:
          description: A complete address is an exact match; a value ending in `@` matches that username across every domain. Prefix searches may return short intermediate pages while the bounded account scan advances.
          type: string
          example: billing@
          maxLength: 320
          minLength: 1
      - name: reason
        in: query
        schema:
          description: Filter to suppressions with this reason.
          type: string
          example: hard_bounce
          enum:
          - manual
          - complaint
          - hard_bounce
          - soft_bounce
          - policy
      - name: scope_type
        in: query
        schema:
          description: 'Filter by scope: `account` returns only account-wide suppressions, `sending_domain` only sending-domain suppressions. Omit to list both, sending-domain suppressions first.'
          type: string
          example: sending_domain
          enum:
          - account
          - sending_domain
      - name: scope_value
        in: query
        schema:
          description: Exact sending-domain filter. Requires `scope_type=sending_domain`.
          type: string
          example: mail.example.com
          maxLength: 1024
      responses:
        '200':
          description: Returns Email Sending suppressions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                  messages:
                    type: array
                    items:
                      type: object
                  result:
                    type: array
                    items:
                      properties:
                        created_at:
                          description: When the suppression was created.
                          type: string
                          format: date-time
                          example: '2026-01-02T02:20:00Z'
                        email:
                          description: The suppressed email address.
                          type: string
                          format: email
                          example: user@example.com
                        expires_at:
                          description: When the suppression expires. Null for a permanent suppression.
                          type:
                          - string
                          - 'null'
                          format: date-time
                          example: '2027-01-01T00:00:00Z'
                        id:
                          description: Unique identifier for this suppression.
                          type: string
                          format: uuid
                          example: 396a5436-d4b0-42a6-b3fc-48e8fa522321
                        note:
                          description: Advisory note for this suppression, if any.
                          type:
                          - string
                          - 'null'
                          example: Imported from CRM
                        read_only:
                          description: Whether clients may mutate this suppression. This is determined by the server and must not be inferred from `reason`.
                          type: boolean
                          example: false
                        reason:
                          description: 'Why the address is suppressed: `manual`, `complaint`, `hard_bounce`, `soft_bounce`, or `policy`.'
                          type: string
                          example: hard_bounce
                        scope:
                          description: 'Where the suppression applies: `account` for every sending domain of the account, or `sending_domain` for one envelope MAIL FROM domain.'
                          example:
                            type: sending_domain
                            value: mail.example.com
                          oneOf:
                          - properties:
                              type:
                                description: Blocks the recipient for every sending domain of the account.
                                type: string
                                example: account
                                enum:
                                - account
                            required:
                            - type
                            type: object
                          - properties:
                              type:
                                description: Blocks the recipient only for mail whose envelope MAIL FROM uses `value`.
                                type: string
                                example: sending_domain
                                enum:
                                - sending_domain
                              value:
                                description: 'The sending domain: the domain part of the envelope MAIL FROM, lowercase, without a trailing dot.'
                                type: string
                                example: mail.example.com
                                maxLength: 1024
                            required:
                            - type
                            - value
                            type: object
                      required:
                      - id
                      - email
                      - reason
                      - created_at
                      - expires_at
                      - read_only
                      type: object
                  result_info:
                    description: Pagination metadata.
                    type: object
                    example:
                      count: 1
                      next_cursor: null
                      per_page: 100
                    properties:
                      count:
                        description: Number of suppressions in this page.
                        type: integer
                        example: 1
                      next_cursor:
                        description: Opaque cursor for the next page. Pass it back as the `cursor` query parameter and continue until it is `null`. A bounded large-account scan may return a short intermediate page. Sending-domain suppressions are listed before account suppressions; each group is newest first.
                        type:
                        - string
                        - 'null'
                        example: eyJ0Ijo0LCJwaCI6ImRvbWFpbiIsInAiOjEyMywiYyI6ImMzZGM1ZjBiMzRhMTRmZjhlMWIzZWMwNDg5NWUxYjIyIn0
                      per_page:
                        description: Maximum number of suppressions requested per page.
                        type: integer
                        example: 100
                    required:
                    - count
                    - per_page
                    - next_cursor
                  success:
                    type: boolean
                    example: true
                required:
                - errors
                - messages
                - success
                - result
                - result_info
        '400':
          description: Invalid list parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          description: 'Machine-readable error code, when one applies: `invalid_scope_value` (the sending domain is not valid), `scope_immutable` (scope cannot change after creation), or `scope_value_requires_type` (`scope_value` needs `scope_type=sending_domain`).'
                          type: string
                          example: invalid_scope_value
                          enum:
                          - invalid_scope_value
                          - scope_immutable
                          - scope_value_requires_type
                        message:
                          type: string
                          example: Suppression not found
                      required:
                      - message
                      type: object
                  messages:
                    type: array
                    items:
                      type: object
                  result:
                    type: object
                  success:
                    type: boolean
                    example: false
                required:
                - errors
                - messages
                - result
                - success
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Sending suppressions
      x-fern-availability: generally-available
      x-fern-sdk-group-name: email-sending.suppressions
      x-fern-sdk-method-name: list
    post:
      operationId: post_publicCreateSendingSuppression
      summary: Create account Email Sending suppression
      description: Creates a suppression for every sending domain of the account (default) or for one sending domain (`scope.type = sending_domain`). Creating an existing active suppression returns its identifier. If a mutable legacy zone-linked account row already exists, it is promoted without changing its identifier.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          description: Cloudflare account ID.
          type: string
          example: '12345678'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  description: The email address to suppress.
                  type: string
                  format: email
                  example: user@example.com
                expires_at:
                  description: Expiration timestamp for the suppression. Omit or set to null for a permanent suppression that never expires.
                  type:
                  - string
                  - 'null'
                  format: date-time
                  example: '2027-01-01T00:00:00Z'
                note:
                  description: Advisory note for this suppression. Not enforced or validated beyond length.
                  type: string
                  example: Imported from CRM
                  maxLength: 1000
                scope:
                  description: 'Where the suppression applies. Omit for `{ "type": "account" }`, which blocks the recipient for every sending domain of the account.'
                  example:
                    type: sending_domain
                    value: mail.example.com
                  oneOf:
                  - properties:
                      type:
                        description: Blocks the recipient for every sending domain of the account.
                        type: string
                        example: account
                        enum:
                        - account
                    required:
                    - type
                    type: object
                  - properties:
                      type:
                        description: Blocks the recipient only for mail whose envelope MAIL FROM uses `value`.
                        type: string
                        example: sending_domain
                        enum:
                        - sending_domain
                      value:
                        description: 'The sending domain to suppress for: the domain part of the envelope MAIL FROM. It is lowercased and trailing dots are removed. Internationalized domains must use the ASCII (punycode) form. Ownership is not checked; a domain the account does not send from never matches.'
                        type: string
                        example: mail.example.com
                        maxLength: 1024
                    required:
                    - type
                    - value
                    type: object
              required:
              - email
      responses:
        '200':
          description: Suppression mutation completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                  messages:
                    type: array
                    items:
                      type: object
                  result:
                    type: object
                    properties:
                      id:
                        description: The suppression's identifier.
                        type: string
                        format: uuid
                        example: 396a5436-d4b0-42a6-b3fc-48e8fa522321
                      scope:
                        description: 'Where the suppression applies: `account` for every sending domain of the account, or `sending_domain` for one envelope MAIL FROM domain.'
                        example:
                          type: sending_domain
                          value: mail.example.com
                        oneOf:
                        - properties:
                            type:
                              description: Blocks the recipient for every sending domain of the account.
                              type: string
                              example: account
                              enum:
                              - account
                          required:
                          - type
                          type: object
                        - properties:
                            type:
                              description: Blocks the recipient only for mail whose envelope MAIL FROM uses `value`.
                              type: string
                              example: sending_domain
                              enum:
                              - sending_domain
                            value:
                              description: 'The sending domain: the domain part of the envelope MAIL FROM, lowercase, without a trailing dot.'
                              type: string
                              example: mail.example.com
                              maxLength: 1024
                          required:
                          - type
                          - value
                          type: object
                    required:
                    - id
                  success:
                    type: boolean
                    example: true
                required:
                - errors
                - messages
                - success
                - result
        '400':
          description: Invalid suppression input.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          description: 'Machine-readable error code, when one applies: `invalid_scope_value` (the sending domain is not valid), `scope_immutable` (scope cannot change after creation), or `scope_value_requires_type` (`scope_value` needs `scope_type=sending_domain`).'
                          type: string
                          example: invalid_scope_value
                          enum:
                          - invalid_scope_value
                          - scope_immutable
                          - scope_value_requires_type
                        message:
                          type: string
                          example: Suppression not found
                      required:
                      - message
                      type: object
                  messages:
                    type: array
                    items:
                      type: object
                  result:
                    type: object
                  success:
                    type: boolean
                    example: false
                required:
                - errors
                - messages
                - result
                - success
        '403':
          description: This suppression is read-only.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          description: 'Machine-readable error code, when one applies: `invalid_scope_value` (the sending domain is not valid), `scope_immutable` (scope cannot change after creation), or `scope_value_requires_type` (`scope_value` needs `scope_type=sending_domain`).'
                          type: string
                          example: invalid_scope_value
                          enum:
                          - invalid_scope_value
                          - scope_immutable
                          - scope_value_requires_type
                        message:
                          type: string
                          example: Suppression not found
                      required:
                      - message
                      type: object
                  messages:
                    type: array
                    items:
                      type: object
                  result:
                    type: object
                  success:
                    type: boolean
                    example: false
                required:
                - errors
                - messages
                - result
                - success
        '404':
          description: Suppression not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          description: 'Machine-readable error code, when one applies: `invalid_scope_value` (the sending domain is not valid), `scope_immutable` (scope cannot change after creation), or `scope_value_requires_type` (`scope_value` needs `scope_type=sending_domain`).'
                          type: string
                          example: invalid_scope_value
                          enum:
                          - invalid_scope_value
                          - scope_immutable
                          - scope_value_requires_type
                        message:
                          type: string
                          example: Suppression not found
                      required:
                      - message
                      type: object
                  messages:
                    type: array
                    items:
                      type: object
                  result:
                    type: object
                  success:
                    type: boolean
                    example: false
                required:
                - errors
                - messages
                - result
                - success
        '409':
          description: Suppression conflicts with this operation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          description: 'Machine-readable error code, when one applies: `invalid_scope_value` (the sending domain is not valid), `scope_immutable` (scope cannot change after creation), or `scope_value_requires_type` (`scope_value` needs `scope_type=sending_domain`).'
                          type: string
                          example: invalid_scope_value
                          enum:
                          - invalid_scope_value
                          - scope_immutable
                          - scope_value_requires_type
                        message:
                          type: string
                          example: Suppression not found
                      required:
                      - message
                      type: object
                  messages:
                    type: array
                    items:
                      type: object
                  result:
                    type: object
                  success:
                    type: boolean
                    example: false
                required:
                - errors
                - messages
                - result
                - success
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Sending suppressions
      x-fern-availability: generally-available
      x-fern-sdk-group-name: email-sending.suppressions
      x-fern-sdk-method-name: create
  /accounts/{account_id}/email/sending/suppressions/bulk:
    post:
      operationId: post_publicBulkCreateSendingSuppressions
      summary: Bulk import account Email Sending suppressions
      description: Imports up to 1,000 Email Sending suppressions in one request. Each item applies to every sending domain of the account (default) or to one sending domain.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          description: Cloudflare account ID.
          type: string
          example: '12345678'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: Suppressions to import. Items with the same email address and scope are deduplicated before processing.
                  type: array
                  items:
                    properties:
                      email:
                        description: The email address to suppress.
                        type: string
                        example: user@example.com
                      expires_at:
                        description: Expiration timestamp for the suppression. Omit or set to null for a permanent suppression that never expires.
                        type:
                        - string
                        - 'null'
                        format: date-time
                        example: '2027-01-01T00:00:00Z'
                      note:
                        description: Advisory note for this suppression. Not enforced or validated beyond length.
                        type: string
                        example: Imported from CRM
                        maxLength: 1000
                      scope:
                        description: 'Where the suppression applies. Omit for `{ "type": "account" }`, which blocks the recipient for every sending domain of the account.'
                        example:
                          type: sending_domain
                          value: mail.example.com
                        oneOf:
                        - properties:
                            type:
                              description: Blocks the recipient for every sending domain of the account.
                              type: string
                              example: account
                              enum:
                              - account
                          required:
                          - type
                          type: object
                        - properties:
                            type:
                              description: Blocks the recipient only for mail whose envelope MAIL FROM uses `value`.
                              type: string
                              example: sending_domain
                              enum:
                              - sending_domain
                            value:
                              description: 'The sending domain to suppress for: the domain part of the envelope MAIL FROM. It is lowercased and trailing dots are removed. Internationalized domains must use the ASCII (punycode) form. Ownership is not checked; a domain the account does not send from never matches.'
                              type: string
                              example: mail.example.com
                              maxLength: 1024
                          required:
                          - type
                          - value
                          type: object
                    required:
                    - email
                    type: object
                  example:
