openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Load Balancers API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Load Balancers
paths:
  /zones/{zone_id}/load_balancers:
    get:
      operationId: load-balancers-list-load-balancers
      summary: List Load Balancers
      description: List configured load balancers.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-identifier'
      responses:
        '200':
          description: List Load Balancers response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-response_collection'
        4XX:
          description: List Load Balancers response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-response_collection'
                - $ref: '#/components/schemas/load-balancing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Load Balancers
      x-api-token-group:
      - Load Balancers Write
      - Load Balancers Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: load-balancers
      x-fern-sdk-method-name: list
      x-forge-hidden: true
    post:
      operationId: load-balancers-create-load-balancer
      summary: Create Load Balancer
      description: Create a new load balancer.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adaptive_routing:
                  $ref: '#/components/schemas/load-balancing_adaptive_routing'
                country_pools:
                  $ref: '#/components/schemas/load-balancing_country_pools'
                default_pools:
                  $ref: '#/components/schemas/load-balancing_default_pools'
                description:
                  $ref: '#/components/schemas/load-balancing_components-schemas-description'
                fallback_pool:
                  $ref: '#/components/schemas/load-balancing_fallback_pool'
                location_strategy:
                  $ref: '#/components/schemas/load-balancing_location_strategy'
                name:
                  $ref: '#/components/schemas/load-balancing_components-schemas-name'
                networks:
                  $ref: '#/components/schemas/load-balancing_networks'
                pop_pools:
                  $ref: '#/components/schemas/load-balancing_pop_pools'
                proxied:
                  $ref: '#/components/schemas/load-balancing_proxied'
                random_steering:
                  $ref: '#/components/schemas/load-balancing_random_steering'
                region_pools:
                  $ref: '#/components/schemas/load-balancing_region_pools'
                rules:
                  $ref: '#/components/schemas/load-balancing_rules'
                session_affinity:
                  $ref: '#/components/schemas/load-balancing_session_affinity'
                session_affinity_attributes:
                  $ref: '#/components/schemas/load-balancing_session_affinity_attributes'
                session_affinity_ttl:
                  $ref: '#/components/schemas/load-balancing_session_affinity_ttl'
                steering_policy:
                  $ref: '#/components/schemas/load-balancing_steering_policy'
                ttl:
                  $ref: '#/components/schemas/load-balancing_ttl'
              required:
              - name
              - default_pools
              - fallback_pool
      responses:
        '200':
          description: Create Load Balancer response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-single_response'
        4XX:
          description: Create Load Balancer response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-single_response'
                - $ref: '#/components/schemas/load-balancing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Load Balancers
      x-api-token-group:
      - Load Balancers Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: load-balancers
      x-fern-sdk-method-name: create
      x-forge-hidden: true
  /zones/{zone_id}/load_balancers/{load_balancer_id}:
    delete:
      operationId: load-balancers-delete-load-balancer
      summary: Delete Load Balancer
      description: Delete a configured load balancer.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-identifier'
      - name: load_balancer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-identifier'
      responses:
        '200':
          description: Delete Load Balancer response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/load-balancing_components-schemas-id_response'
        4XX:
          description: Delete Load Balancer response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/load-balancing_components-schemas-id_response'
                - $ref: '#/components/schemas/load-balancing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Load Balancers
      x-api-token-group:
      - Load Balancers Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: load-balancers
      x-fern-sdk-method-name: delete
      x-forge-hidden: true
    get:
      operationId: load-balancers-load-balancer-details
      summary: Load Balancer Details
      description: Fetch a single configured load balancer.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-identifier'
      - name: load_balancer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-identifier'
      responses:
        '200':
          description: Load Balancer Details response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-single_response'
        4XX:
          description: Load Balancer Details response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-single_response'
                - $ref: '#/components/schemas/load-balancing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Load Balancers
      x-api-token-group:
      - Load Balancers Write
      - Load Balancers Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: load-balancers
      x-fern-sdk-method-name: get
      x-forge-hidden: true
    patch:
      operationId: load-balancers-patch-load-balancer
      summary: Patch Load Balancer
      description: Apply changes to an existing load balancer, overwriting the supplied properties.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-identifier'
      - name: load_balancer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adaptive_routing:
                  $ref: '#/components/schemas/load-balancing_adaptive_routing'
                country_pools:
                  $ref: '#/components/schemas/load-balancing_country_pools'
                default_pools:
                  $ref: '#/components/schemas/load-balancing_default_pools'
                description:
                  $ref: '#/components/schemas/load-balancing_components-schemas-description'
                enabled:
                  $ref: '#/components/schemas/load-balancing_components-schemas-enabled'
                fallback_pool:
                  $ref: '#/components/schemas/load-balancing_fallback_pool'
                location_strategy:
                  $ref: '#/components/schemas/load-balancing_location_strategy'
                name:
                  $ref: '#/components/schemas/load-balancing_components-schemas-name'
                pop_pools:
                  $ref: '#/components/schemas/load-balancing_pop_pools'
                proxied:
                  $ref: '#/components/schemas/load-balancing_proxied'
                random_steering:
                  $ref: '#/components/schemas/load-balancing_random_steering'
                region_pools:
                  $ref: '#/components/schemas/load-balancing_region_pools'
                rules:
                  $ref: '#/components/schemas/load-balancing_rules'
                session_affinity:
                  $ref: '#/components/schemas/load-balancing_session_affinity'
                session_affinity_attributes:
                  $ref: '#/components/schemas/load-balancing_session_affinity_attributes'
                session_affinity_ttl:
                  $ref: '#/components/schemas/load-balancing_session_affinity_ttl'
                steering_policy:
                  $ref: '#/components/schemas/load-balancing_steering_policy'
                ttl:
                  $ref: '#/components/schemas/load-balancing_ttl'
      responses:
        '200':
          description: Patch Load Balancer response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-single_response'
        4XX:
          description: Patch Load Balancer response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-single_response'
                - $ref: '#/components/schemas/load-balancing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Load Balancers
      x-api-token-group:
      - Load Balancers Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: load-balancers
      x-fern-sdk-method-name: edit
      x-forge-hidden: true
    put:
      operationId: load-balancers-update-load-balancer
      summary: Update Load Balancer
      description: Update a configured load balancer.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-identifier'
      - name: load_balancer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adaptive_routing:
                  $ref: '#/components/schemas/load-balancing_adaptive_routing'
                country_pools:
                  $ref: '#/components/schemas/load-balancing_country_pools'
                default_pools:
                  $ref: '#/components/schemas/load-balancing_default_pools'
                description:
                  $ref: '#/components/schemas/load-balancing_components-schemas-description'
                enabled:
                  $ref: '#/components/schemas/load-balancing_components-schemas-enabled'
                fallback_pool:
                  $ref: '#/components/schemas/load-balancing_fallback_pool'
                location_strategy:
                  $ref: '#/components/schemas/load-balancing_location_strategy'
                name:
                  $ref: '#/components/schemas/load-balancing_components-schemas-name'
                networks:
                  $ref: '#/components/schemas/load-balancing_networks'
                pop_pools:
                  $ref: '#/components/schemas/load-balancing_pop_pools'
                proxied:
                  $ref: '#/components/schemas/load-balancing_proxied'
                random_steering:
                  $ref: '#/components/schemas/load-balancing_random_steering'
                region_pools:
                  $ref: '#/components/schemas/load-balancing_region_pools'
                rules:
                  $ref: '#/components/schemas/load-balancing_rules'
                session_affinity:
                  $ref: '#/components/schemas/load-balancing_session_affinity'
                session_affinity_attributes:
                  $ref: '#/components/schemas/load-balancing_session_affinity_attributes'
                session_affinity_ttl:
                  $ref: '#/components/schemas/load-balancing_session_affinity_ttl'
                steering_policy:
                  $ref: '#/components/schemas/load-balancing_steering_policy'
                ttl:
                  $ref: '#/components/schemas/load-balancing_ttl'
              required:
              - name
              - default_pools
              - fallback_pool
      responses:
        '200':
          description: Update Load Balancer response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-single_response'
        4XX:
          description: Update Load Balancer response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-single_response'
                - $ref: '#/components/schemas/load-balancing_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Load Balancers
      x-api-token-group:
      - Load Balancers Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: load-balancers
      x-fern-sdk-method-name: update
      x-forge-hidden: true
components:
  schemas:
    load-balancing_load-balancer_components-schemas-response_collection:
      allOf:
      - $ref: '#/components/schemas/load-balancing_api-paginated-response-collection'
      - properties:
          result:
            type: array
            items:
              $ref: '#/components/schemas/load-balancing_load-balancer'
        type: object
    load-balancing_pool_set:
      description: One entry in a load balancer's `pool_sets`. Pool sets are evaluated in array order; the first whose `match` succeeds applies its `overrides` (or `fixed_response`), and evaluation stops there.
      type: object
      properties:
        disabled:
          description: Disable this specific pool set. It will no longer be evaluated.
          type: boolean
          default: false
          x-auditable: true
        fixed_response:
          $ref: '#/components/schemas/load-balancing_fixed_response'
        match:
          $ref: '#/components/schemas/load-balancing_match'
        name:
          description: A human-readable name for this pool set.
          type: string
          example: wnam-primary
          maxLength: 200
          x-auditable: true
        overrides:
          $ref: '#/components/schemas/load-balancing_pool_set_overrides'
      example:
        match:
          topology:
            regions:
            - WNAM
        name: wnam-primary
        overrides:
          fallback_pool: 9290f38c5d07c2e2f4df57b1f61d4196
          pools:
          - 17b5962d775c646f3f9725cbc7a53df4
          steering_policy: random
      x-stainless-terraform-configurability: computed_optional
    load-balancing_location_strategy:
      description: Controls location-based steering for non-proxied requests. See `steering_policy` to learn how steering is affected.
      type: object
      properties:
        mode:
          description: 'Determines the authoritative location when ECS is not preferred, does not exist in the request, or its GeoIP lookup is unsuccessful.

            - `"pop"`: Use the Cloudflare PoP location.

            - `"resolver_ip"`: Use the DNS resolver GeoIP location. If the GeoIP lookup is unsuccessful, use the Cloudflare PoP location.'
          type: string
          example: resolver_ip
          default: pop
          enum:
          - pop
          - resolver_ip
          x-auditable: true
        prefer_ecs:
          description: 'Whether the EDNS Client Subnet (ECS) GeoIP should be preferred as the authoritative location.

            - `"always"`: Always prefer ECS.

            - `"never"`: Never prefer ECS.

            - `"proximity"`: Prefer ECS only when `steering_policy="proximity"`.

            - `"geo"`: Prefer ECS only when `steering_policy="geo"`.'
          type: string
          example: always
          default: proximity
          enum:
          - always
          - never
          - proximity
          - geo
          x-auditable: true
    load-balancing_ttl:
      description: Time to live (TTL) of the DNS entry for the IP address returned by this load balancer. This only applies to gray-clouded (unproxied) load balancers.
      type: number
      example: 30
      x-auditable: true
    load-balancing_session_affinity:
      description: 'Specifies the type of session affinity the load balancer should use unless specified as `"none"`. The supported types are: - `"cookie"`: On the first request to a proxied load balancer, a cookie is generated, encoding information of which origin the request will be forwarded to. Subsequent requests, by the same client to the same load balancer, will be sent to the origin server the cookie encodes, for the duration of the cookie and as long as the origin server remains healthy. If the cookie has expired or the origin server is unhealthy, then a new origin server is calculated and used. - `"ip_cookie"`: Behaves the same as `"cookie"` except the initial origin selection is stable and based on the client''s ip address. - `"header"`: On the first request to a proxied load balancer, a session key based on the configured HTTP headers (see `session_affinity_attributes.headers`) is generated, encoding the request headers used for storing in the load balancer session state which origin the request will be forwarded to. Subsequent requests to the load balancer with the same headers will be sent to the same origin server, for the duration of the session and as long as the origin server remains healthy. If the session has been idle for the duration of `session_affinity_ttl` seconds or the origin server is unhealthy, then a new origin server is calculated and used. See `headers` in `session_affinity_attributes` for additional required configuration.'
      type: string
      example: cookie
      default: none
      enum:
      - none
      - cookie
      - ip_cookie
      - header
      x-auditable: true
    load-balancing_match:
      description: 'Determines which requests a pool set applies to. Set `topology` to match by location or `default: true` to match all requests; the two are mutually exclusive. A pool set with no `match` matches all requests.'
      type: object
      properties:
        default:
          description: When true, matches every request. Cannot be combined with `topology`.
          type: boolean
          default: false
          x-auditable: true
        topology:
          $ref: '#/components/schemas/load-balancing_topology_match'
      x-stainless-terraform-configurability: computed_optional
    load-balancing_load-balancer:
      type: object
      properties:
        adaptive_routing:
          $ref: '#/components/schemas/load-balancing_adaptive_routing'
        country_pools:
          $ref: '#/components/schemas/load-balancing_country_pools'
        created_on:
          $ref: '#/components/schemas/load-balancing_timestamp'
        default_pools:
          $ref: '#/components/schemas/load-balancing_default_pools'
        description:
          $ref: '#/components/schemas/load-balancing_components-schemas-description'
        enabled:
          $ref: '#/components/schemas/load-balancing_components-schemas-enabled'
        fallback_pool:
          $ref: '#/components/schemas/load-balancing_fallback_pool'
        id:
          $ref: '#/components/schemas/load-balancing_load-balancer_components-schemas-identifier'
        location_strategy:
          $ref: '#/components/schemas/load-balancing_location_strategy'
        modified_on:
          $ref: '#/components/schemas/load-balancing_timestamp'
        name:
          $ref: '#/components/schemas/load-balancing_components-schemas-name'
        networks:
          $ref: '#/components/schemas/load-balancing_networks'
        pool_sets:
          $ref: '#/components/schemas/load-balancing_pool_sets'
        pop_pools:
          $ref: '#/components/schemas/load-balancing_pop_pools'
        proxied:
          $ref: '#/components/schemas/load-balancing_proxied'
        random_steering:
          $ref: '#/components/schemas/load-balancing_random_steering'
        region_pools:
          $ref: '#/components/schemas/load-balancing_region_pools'
        rules:
          $ref: '#/components/schemas/load-balancing_rules'
        session_affinity:
          $ref: '#/components/schemas/load-balancing_session_affinity'
        session_affinity_attributes:
          $ref: '#/components/schemas/load-balancing_session_affinity_attributes'
        session_affinity_ttl:
          $ref: '#/components/schemas/load-balancing_session_affinity_ttl'
        steering_policy:
          $ref: '#/components/schemas/load-balancing_steering_policy'
        ttl:
          $ref: '#/components/schemas/load-balancing_ttl'
        zone_name:
          $ref: '#/components/schemas/load-balancing_components-schemas-zone-name'
    load-balancing_country_pools:
      description: A mapping of country codes to a list of pool IDs (ordered by their failover priority) for the given country. Any country not explicitly defined will fall back to using the corresponding region_pool mapping if it exists else to default_pools.
      type: object
      example:
        GB:
        - abd90f38ced07c2e2f4df50b1f61d4194
        US:
        - de90f38ced07c2e2f4df50b1f61d4194
        - 00920f38ce07c2e2f4df50b1f61d4194
      additionalProperties:
        description: A `string:[string]` object of key-values. Country code maps to list of pool IDs.
        items:
          type: string
          x-auditable: true
        type: array
    load-balancing_load-balancer_components-schemas-identifier:
      type: string
      example: 699d98642c564d2e855e9661899b7252
      x-auditable: true
    load-balancing_api-paginated-response-collection:
      type: object
      allOf:
      - $ref: '#/components/schemas/load-balancing_api-response-common'
      - properties:
          result_info:
            $ref: '#/components/schemas/load-balancing_result_info'
        type: object
      required:
      - result_info
    load-balancing_components-schemas-zone-name:
      type: string
      example: example.com
      x-auditable: true
    load-balancing_pool_set_overrides:
      description: 'The behavior a pool set applies when its `match` succeeds. A strict subset of a rule''s `overrides`: a pool set replaces the topology wholesale with a flat pool list (`pools`), so only the declarative pool-routing fields plus `fallback_pool` and `steering_policy` are settable. All fields are optional.'
      type: object
      properties:
        fallback_pool:
          $ref: '#/components/schemas/load-balancing_fallback_pool'
        pool_default_weight:
          $ref: '#/components/schemas/load-balancing_pool_default_weight'
        pool_weights:
          $ref: '#/components/schemas/load-balancing_pool_weights'
        pools:
          $ref: '#/components/schemas/load-balancing_pools'
        steering_policy:
          $ref: '#/components/schemas/load-balancing_steering_policy'
      x-stainless-terraform-configurability: computed_optional
    load-balancing_api-response-common:
      type: object
      properties:
        errors:
          $ref: '#/components/schemas/load-balancing_messages'
        messages:
          $ref: '#/components/schemas/load-balancing_messages'
        success:
          description: Whether the API call was successful.
          type: boolean
          example: true
          enum:
          - true
      required:
      - success
      - errors
      - messages
      - result
    load-balancing_topology_match:
      description: 'Matches requests by location. Set any combination of `pops`, `countries`, and `regions` (at least one is required); a request matches when its value appears in any populated list (e.g. `regions: ["WNAM"]` with `countries: ["US"]` matches a request in either WNAM or the US).'
      type: object
      properties:
        countries:
          description: A list of ISO 3166-1 alpha-2 country codes. Matches when the request's country is in this list.
          type: array
          items:
            type: string
            x-auditable: true
          maxItems: 1000
        pops:
          description: A list of Cloudflare PoP codes. Matches when the request's PoP is in this list.
          type: array
          items:
            type: string
            x-auditable: true
          maxItems: 1000
        regions:
          description: A list of Cloudflare region codes (e.g. `WNAM`, `ENAM`, `WEU`). Matches when the request's region is in this list.
          type: array
          items:
            type: string
            x-auditable: true
          maxItems: 1000
      x-stainless-terraform-configurability: computed_optional
    load-balancing_rules:
      description: 'BETA Field Not General Access: A list of rules for this load balancer to execute.'
      type: array
      items:
        additionalProperties: false
        description: A rule object containing conditions and overrides for this load balancer to evaluate.
        properties:
          condition:
            description: The condition expressions to evaluate. If the condition evaluates to true, the overrides or fixed_response in this rule will be applied. An empty condition is always true. For more details on condition expressions, please see https://developers.cloudflare.com/load-balancing/understand-basics/load-balancing-rules/expressions.
            type: string
            example: http.request.uri.path contains "/testing"
            x-auditable: true
          disabled:
            description: Disable this specific rule. It will no longer be evaluated by this load balancer.
            type: boolean
            default: false
