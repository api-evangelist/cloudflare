                  maxItems: 1000
                posts:
                  description: Trusted domain patterns to create.
                  type: array
                  items:
                    $ref: '#/components/schemas/email-security_CreateTrustedDomain'
                  maxItems: 1000
                puts:
                  description: Full replacements to apply — each entry carries the pattern's ID and every field of its new value.
