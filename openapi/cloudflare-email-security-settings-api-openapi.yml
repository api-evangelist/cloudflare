openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Email Security Settings API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Email Security Settings
paths:
  /accounts/{account_id}/email-security/settings/allow_policies:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    get:
      operationId: email_security_list_allow_policies
      summary: List email allow policies
      description: Returns a paginated list of email allow policies. These policies exempt matching emails from security detection, allowing them to bypass disposition actions. Supports filtering by pattern type and policy attributes.
      parameters:
      - $ref: '#/components/parameters/email-security_page'
      - $ref: '#/components/parameters/email-security_per_page'
      - $ref: '#/components/parameters/email-security_search'
      - name: order
        in: query
        description: Field to sort by.
        schema:
          type: string
          enum:
          - pattern
          - created_at
      - $ref: '#/components/parameters/email-security_direction'
      - name: is_exempt_recipient
        in: query
        description: Filter to show only policies where messages to the recipient bypass all detections.
        schema:
          type: boolean
      - name: is_trusted_sender
        in: query
        description: Filter to show only policies where messages from the sender bypass all detections and link following.
        schema:
          type: boolean
      - name: is_acceptable_sender
        in: query
        description: Filter to show only policies where messages from the sender are exempted from Spam, Spoof, and Bulk dispositions (not Malicious or Suspicious).
        schema:
          type: boolean
      - name: verify_sender
        in: query
        description: Filter to show only policies that enforce DMARC, SPF, or DKIM authentication.
        schema:
          type: boolean
      - name: pattern_type
        in: query
        description: Filter by pattern type.
        schema:
          allOf:
          - $ref: '#/components/schemas/email-security_PatternType'
      - name: pattern
        in: query
        description: Filter by exact pattern value.
        schema:
          type: string
      responses:
        '200':
          description: List of allow policies.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-collection'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_AllowPolicyList'
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security Settings
      x-api-token-group:
      - 'Cloud Email Security: Write'
      - 'Cloud Email Security: Read'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.allow-policies
      x-fern-sdk-method-name: list
      x-stability: beta
    post:
      operationId: email_security_create_allow_policy
      summary: Create email allow policy
      description: Creates a new allow policy that exempts matching emails from security detections. Use with caution as this bypasses email security scanning. Policies can match on sender patterns and apply to specific detections or all detections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email-security_CreateAllowPolicy'
      responses:
        '201':
          description: Created allow policy.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_AllowPolicy'
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security Settings
      x-api-token-group:
      - 'Cloud Email Security: Write'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.allow-policies
      x-fern-sdk-method-name: create
      x-stability: beta
  /accounts/{account_id}/email-security/settings/allow_policies/batch:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    post:
      operationId: email_security_batch_allow_policies
      summary: Batch allow policy operations
      description: 'Executes multiple allow policy operations atomically: delete, partially update,

        replace, and create allow policies in a single request. All four operation arrays

        (deletes, patches, puts, posts) are required and executed in order.

        Send empty arrays for unused operations.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deletes:
                  description: IDs of the allow policies to delete.
                  type: array
                  items:
                    properties:
                      id:
                        $ref: '#/components/schemas/email-security_AllowPolicyId'
                    required:
                    - id
                    type: object
                  maxItems: 1000
                patches:
                  description: Partial updates to apply — each entry carries the policy's ID and only the fields to change.
                  type: array
                  items:
                    allOf:
                    - $ref: '#/components/schemas/email-security_UpdateAllowPolicy'
                    - properties:
                        id:
                          allOf:
                          - $ref: '#/components/schemas/email-security_AllowPolicyId'
                      required:
                      - id
                      type: object
                  maxItems: 1000
                posts:
                  description: Allow policies to create.
                  type: array
                  items:
                    $ref: '#/components/schemas/email-security_CreateAllowPolicy'
                  maxItems: 1000
                puts:
                  description: Full replacements to apply — each entry carries the policy's ID and every field of its new value.
                  type: array
                  items:
                    allOf:
                    - $ref: '#/components/schemas/email-security_CreateAllowPolicy'
                    - properties:
                        id:
                          allOf:
                          - $ref: '#/components/schemas/email-security_AllowPolicyId'
                      required:
                      - id
                      type: object
                  maxItems: 1000
              required:
              - deletes
              - patches
              - puts
              - posts
      responses:
        '200':
          description: Batch operation results.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-single'
                - properties:
                    result:
                      type: object
                      properties:
                        deletes:
                          type: array
                          items:
                            $ref: '#/components/schemas/email-security_DeletedAllowPolicy'
                        patches:
                          $ref: '#/components/schemas/email-security_AllowPolicyList'
                        posts:
                          $ref: '#/components/schemas/email-security_AllowPolicyList'
                        puts:
                          $ref: '#/components/schemas/email-security_AllowPolicyList'
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security Settings
      x-api-token-group:
      - 'Cloud Email Security: Write'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.allow-policies
      x-fern-sdk-method-name: batch
      x-forge-require-confirmation: This operation may delete the selected allow policies and restore normal security scanning and disposition actions for matching emails.
      x-stability: beta
  /accounts/{account_id}/email-security/settings/allow_policies/{policy_id}:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    - name: policy_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/email-security_AllowPolicyId'
    delete:
      operationId: email_security_delete_allow_policy
      summary: Delete an email allow policy
      description: Removes an allow policy. After deletion, emails matching this pattern will be subject to normal security scanning and disposition actions.
      responses:
        '200':
          description: Deleted allow policy.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_DeletedAllowPolicy'
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security Settings
      x-api-token-group:
      - 'Cloud Email Security: Write'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.allow-policies
      x-fern-sdk-method-name: delete
      x-forge-require-confirmation: This operation deletes the allow policy and restores normal security scanning and disposition actions for matching emails.
      x-stability: beta
    get:
      operationId: email_security_get_allow_policy
      summary: Get an email allow policy
      description: Retrieves details for a specific allow policy including its pattern, dispositions that are exempted, and whether it applies to all detections.
      responses:
        '200':
          description: Allow policy details.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_AllowPolicy'
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security Settings
      x-api-token-group:
      - 'Cloud Email Security: Write'
      - 'Cloud Email Security: Read'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.allow-policies
      x-fern-sdk-method-name: get
      x-stability: beta
    patch:
      operationId: email_security_update_allow_policy
      summary: Update an email allow policy
      description: Updates an existing allow policy. Only provided fields will be modified. Changes take effect for new emails matching the pattern.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email-security_UpdateAllowPolicy'
      responses:
        '200':
          description: Updated allow policy.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_AllowPolicy'
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security Settings
      x-api-token-group:
      - 'Cloud Email Security: Write'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.allow-policies
      x-fern-sdk-method-name: edit
      x-stability: beta
    put:
      operationId: email_security_replace_allow_policy
      summary: Replace an email allow policy
      description: Replaces an existing allow policy in full. Unlike PATCH, every field is taken from the request body, so optional fields that are omitted are reset rather than left untouched. Use this when managing policies declaratively.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email-security_CreateAllowPolicy'
      responses:
        '200':
          description: Replaced allow policy.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_AllowPolicy'
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security Settings
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.allow-policies
      x-fern-sdk-method-name: update
      x-stability: beta
  /accounts/{account_id}/email-security/settings/block_senders:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    get:
      operationId: email_security_list_blocked_senders
      summary: List blocked email senders
      description: Returns a paginated list of blocked email sender patterns. These patterns prevent emails from matching senders from being delivered. Supports filtering by pattern type and searching across patterns.
      parameters:
      - $ref: '#/components/parameters/email-security_page'
      - $ref: '#/components/parameters/email-security_per_page'
      - $ref: '#/components/parameters/email-security_search'
      - name: order
        in: query
        description: Field to sort by.
        schema:
          type: string
          enum:
          - pattern
          - created_at
      - $ref: '#/components/parameters/email-security_direction'
      - name: pattern_type
        in: query
        description: Filter by pattern type.
        schema:
          allOf:
          - $ref: '#/components/schemas/email-security_PatternType'
      - name: pattern
        in: query
        description: Filter by pattern value.
        schema:
          type: string
      responses:
        '200':
          description: List of blocked senders.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-collection'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_BlockedSenderList'
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security Settings
      x-api-token-group:
      - 'Cloud Email Security: Write'
      - 'Cloud Email Security: Read'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.block-senders
      x-fern-sdk-method-name: list
      x-stability: beta
    post:
      operationId: email_security_create_blocked_sender
      summary: Create blocked email sender
      description: Creates a new blocked sender pattern. Emails matching this pattern will be blocked from delivery. Patterns can be email addresses, domains, or IP addresses, and support regular expressions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email-security_CreateBlockedSender'
      responses:
        '201':
          description: Created blocked sender.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_BlockedSender'
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security Settings
      x-api-token-group:
      - 'Cloud Email Security: Write'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.block-senders
      x-fern-sdk-method-name: create
      x-stability: beta
  /accounts/{account_id}/email-security/settings/block_senders/batch:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    post:
      operationId: email_security_batch_blocked_senders
      summary: Batch blocked sender operations
      description: 'Executes multiple blocked sender operations atomically: delete, partially update,

        replace, and create blocked sender patterns in a single request. All four operation

        arrays (deletes, patches, puts, posts) are required and executed in order.

        Send empty arrays for unused operations.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deletes:
                  description: IDs of the blocked sender patterns to delete.
                  type: array
                  items:
                    properties:
                      id:
                        $ref: '#/components/schemas/email-security_BlockedSenderId'
                    required:
                    - id
                    type: object
                  maxItems: 1000
                patches:
                  description: Partial updates to apply — each entry carries the pattern's ID and only the fields to change.
                  type: array
                  items:
                    allOf:
                    - $ref: '#/components/schemas/email-security_UpdateBlockedSender'
                    - properties:
                        id:
                          allOf:
                          - $ref: '#/components/schemas/email-security_BlockedSenderId'
                      required:
                      - id
                      type: object
                  maxItems: 1000
                posts:
                  description: Blocked sender patterns to create.
                  type: array
                  items:
                    $ref: '#/components/schemas/email-security_CreateBlockedSender'
                  maxItems: 1000
                puts:
                  description: Full replacements to apply — each entry carries the pattern's ID and every field of its new value.
                  type: array
                  items:
                    allOf:
                    - $ref: '#/components/schemas/email-security_CreateBlockedSender'
                    - properties:
                        id:
                          allOf:
                          - $ref: '#/components/schemas/email-security_BlockedSenderId'
                      required:
                      - id
                      type: object
                  maxItems: 1000
              required:
              - deletes
              - patches
              - puts
              - posts
      responses:
        '200':
          description: Batch operation results.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-single'
                - properties:
                    result:
                      type: object
                      properties:
                        deletes:
                          type: array
                          items:
                            $ref: '#/components/schemas/email-security_DeletedBlockedSender'
                        patches:
                          $ref: '#/components/schemas/email-security_BlockedSenderList'
                        posts:
                          $ref: '#/components/schemas/email-security_BlockedSenderList'
                        puts:
                          $ref: '#/components/schemas/email-security_BlockedSenderList'
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security Settings
      x-api-token-group:
      - 'Cloud Email Security: Write'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.block-senders
      x-fern-sdk-method-name: batch
      x-forge-require-confirmation: This operation may delete the selected blocked sender patterns and stop automatically blocking matching emails based on those rules.
      x-stability: beta
  /accounts/{account_id}/email-security/settings/block_senders/{pattern_id}:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    - name: pattern_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/email-security_BlockedSenderId'
    delete:
      operationId: email_security_delete_blocked_sender
      summary: Delete a blocked email sender
      description: Removes a blocked sender pattern. After deletion, emails from this sender will no longer be automatically blocked based on this rule.
      responses:
        '200':
          description: Deleted blocked sender.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_DeletedBlockedSender'
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security Settings
      x-api-token-group:
      - 'Cloud Email Security: Write'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.block-senders
      x-fern-sdk-method-name: delete
      x-forge-require-confirmation: This operation deletes the blocked sender pattern and stops automatically blocking matching emails based on this rule.
      x-stability: beta
    get:
      operationId: email_security_get_blocked_sender
      summary: Get a blocked email sender
      description: Retrieves details for a specific blocked sender pattern including its pattern type, value, and metadata.
      responses:
        '200':
          description: Blocked sender details.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_BlockedSender'
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security Settings
      x-api-token-group:
      - 'Cloud Email Security: Write'
      - 'Cloud Email Security: Read'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.block-senders
      x-fern-sdk-method-name: get
      x-stability: beta
    patch:
      operationId: email_security_update_blocked_sender
      summary: Update a blocked email sender
      description: Updates an existing blocked sender pattern. Only provided fields will be modified. The pattern will continue blocking emails until deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email-security_UpdateBlockedSender'
      responses:
        '200':
          description: Updated blocked sender.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_BlockedSender'
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security Settings
      x-api-token-group:
      - 'Cloud Email Security: Write'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.block-senders
      x-fern-sdk-method-name: edit
      x-stability: beta
    put:
      operationId: email_security_replace_blocked_sender
      summary: Replace a blocked email sender
      description: Replaces an existing blocked sender pattern in full. Unlike PATCH, every field is taken from the request body, so optional fields that are omitted are reset rather than left untouched. Use this when managing blocked senders declaratively.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email-security_CreateBlockedSender'
      responses:
        '200':
          description: Replaced blocked sender.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_BlockedSender'
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security Settings
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.block-senders
      x-fern-sdk-method-name: update
      x-stability: beta
  /accounts/{account_id}/email-security/settings/content_policies:
    parameters:
    - $ref: '#/components/parameters/email-security_account_id'
    get:
      operationId: email_security_list_content_policies
      summary: List content policies
      description: Returns a paginated list of content policies. These policies match against the subject or body of emails using a pattern. Supports filtering by name or enabled status, and searching across name and pattern fields.
      parameters:
      - $ref: '#/components/parameters/email-security_page'
      - $ref: '#/components/parameters/email-security_per_page'
      - $ref: '#/components/parameters/email-security_search'
      - name: order
        in: query
        description: Field to sort by.
        schema:
          type: string
          enum:
          - name
          - created_at
      - $ref: '#/components/parameters/email-security_direction'
      - name: enabled
        in: query
        description: Filter by enabled status.
        schema:
          type: boolean
      - name: name
        in: query
        description: Filter by exact policy name.
        schema:
          type: string
      responses:
        '200':
          description: List of content policies.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-collection'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_ContentPolicyList'
                  type: object
        4XX:
          $ref: '#/components/responses/email-security_ClientError'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Email Security Settings
      x-api-token-group:
      - 'Cloud Email Security: Write'
      - 'Cloud Email Security: Read'
      x-fern-availability: beta
      x-fern-sdk-group-name: email-security.content-policies
      x-fern-sdk-method-name: list
      x-stability: beta
    post:
      operationId: email_security_create_content_policy
      summary: Create a content policy
      description: Creates a new content policy. Emails whose subject or body matches the pattern will be subject to the configured action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email-security_CreateContentPolicy'
      responses:
        '201':
          description: Created content policy.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/email-security_api-response-single'
                - properties:
                    result:
                      $ref: '#/components/schemas/email-security_ContentPolicy'
                  type: object
        4XX:
