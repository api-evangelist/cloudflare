          example: false
          x-auditable: true
        is_exempt_recipient:
          description: Bypasses all detections for messages to this recipient.
          type: boolean
          example: false
          x-auditable: true
        is_recipient:
          description: 'Deprecated as of July 1, 2025. Use `is_exempt_recipient` instead. End of life: July 1, 2026.'
          type: boolean
          example: false
          deprecated: true
          x-auditable: true
          x-stainless-deprecation-message: Use `is_exempt_recipient` instead.
