openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare URL Scanner (Deprecated) API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: URL Scanner (Deprecated)
paths:
  /accounts/{account_id}/urlscanner/response/{response_id}:
    get:
      operationId: urlscanner-get-response-text
      summary: Get raw response
      description: Returns the plain response of the network request.
      parameters:
      - name: response_id
        in: path
        description: Response hash.
        required: true
        schema:
          description: Response hash.
          type: string
      - name: account_id
        in: path
        description: Account ID.
        required: true
        schema:
          description: Account ID.
          type: string
      responses:
        '200':
          description: When `har.log.entries[].response._cf.contentAvailable` is `true`, use `response._cf.hash` value to fetch the raw response.
          content:
            text/plain:
              schema:
                description: Web resource text/image.
                type: string
        '400':
          description: Invalid params.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                          example: Scan ID is not a valid UUID.
                      required:
                      - message
                      type: object
                  messages:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                  success:
                    description: Whether request was successful or not
                    type: boolean
                required:
                - messages
                - errors
                - success
        '404':
          description: Scan not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                          example: Scan not found.
                      required:
                      - message
                      type: object
                  messages:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                  success:
                    description: Whether request was successful or not
                    type: boolean
                required:
                - messages
                - errors
                - success
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - URL Scanner (Deprecated)
      x-api-token-group:
      - URL Scanner Write
      - URL Scanner Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: deprecated
      x-fern-sdk-group-name: url-scanner.response
      x-fern-sdk-method-name: get
      x-forge-hidden: true
      x-forge-sunset:
        date: '2030-01-01T00:00:00Z'
      x-stainless-deprecation-message: Use [V2](https://developers.cloudflare.com/api/resources/url_scanner/subresources/responses/methods/get/) instead.
  /accounts/{account_id}/urlscanner/scan:
    get:
      operationId: urlscanner-search-scans
      summary: Search URL scans
      description: 'Search scans by date and webpages'' requests, including full URL (after redirects), hostname, and path.

        A successful scan will appear in search results a few minutes after finishing but may take much longer if the system in under load. By default, only successfully completed scans will appear in search results, unless searching by `scanId`. Please take into account that older scans may be removed from the search index at an unspecified time.'
      parameters:
      - name: account_id
        in: path
        description: Account ID.
        required: true
        schema:
          description: Account ID.
          type: string
      - name: scan_id
        in: query
        description: Scan UUID.
        schema:
          description: Scan UUID.
          type: string
          format: uuid
      - name: limit
        in: query
        description: Limit the number of objects in the response.
        schema:
          description: Limit the number of objects in the response.
          type: integer
          example: 100
      - name: next_cursor
        in: query
        description: Pagination cursor to get the next set of results.
        schema:
          description: Pagination cursor to get the next set of results.
          type: string
      - name: date_start
        in: query
        description: Filter scans requested after date (inclusive).
        schema:
          description: Filter scans requested after date (inclusive).
          type: string
          format: date-time
      - name: date_end
        in: query
        description: Filter scans requested before date (inclusive).
        schema:
          description: Filter scans requested before date (inclusive).
          type: string
          format: date-time
      - name: url
        in: query
        description: Filter scans by URL of _any_ request made by the webpage
        schema:
          description: Filter scans by URL of _any_ request made by the webpage
          type: string
          example: https://example.com/?hello
      - name: hostname
        in: query
        description: Filter scans by hostname of _any_ request made by the webpage.
        schema:
          description: Filter scans by hostname of _any_ request made by the webpage.
          type: string
          example: example.com
      - name: path
        in: query
        description: Filter scans by url path of _any_ request made by the webpage.
        schema:
          description: Filter scans by url path of _any_ request made by the webpage.
          type: string
          example: /samples/subresource-integrity/
      - name: ip
        in: query
        description: Filter scans by IP address (IPv4 or IPv6) of _any_ request made by the webpage.
        schema:
          description: Filter scans by IP address (IPv4 or IPv6) of _any_ request made by the webpage.
          type: string
          example: 1.1.1.1
      - name: hash
        in: query
        description: Filter scans by hash of any html/js/css request made by the webpage.
        schema:
          description: Filter scans by hash of any html/js/css request made by the webpage.
          type: string
      - name: page_url
        in: query
        description: Filter scans by submitted or scanned URL
        schema:
          description: Filter scans by submitted or scanned URL
          type: string
      - name: page_hostname
        in: query
        description: Filter scans by main page hostname (domain of effective URL).
        schema:
          description: Filter scans by main page hostname (domain of effective URL).
          type: string
      - name: page_path
        in: query
        description: Filter scans by exact match of effective URL path (also supports suffix search).
        schema:
          description: Filter scans by exact match of effective URL path (also supports suffix search).
          type: string
      - name: page_asn
        in: query
        description: Filter scans by main page Autonomous System Number (ASN).
        schema:
          description: Filter scans by main page Autonomous System Number (ASN).
          type: string
      - name: page_ip
        in: query
        description: Filter scans by  main page IP address (IPv4 or IPv6).
        schema:
          description: Filter scans by  main page IP address (IPv4 or IPv6).
          type: string
      - name: account_scans
        in: query
        description: Return only scans created by account.
        schema:
          description: Return only scans created by account.
          type: boolean
      - name: is_malicious
        in: query
        description: Filter scans by malicious verdict.
        schema:
          description: Filter scans by malicious verdict.
          type: boolean
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                          example: Error
                      required:
                      - message
                      type: object
                  messages:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                          example: OK
                      required:
                      - message
                      type: object
                  result:
                    type: object
                    properties:
                      tasks:
                        type: array
                        items:
                          properties:
                            country:
                              description: Alpha-2 country code
                              type: string
                            success:
                              description: Whether scan was successful or not
                              type: boolean
                            time:
                              description: When scan was submitted (UTC)
                              type: string
                              format: date-time
                            url:
                              description: Scan url (after redirects)
                              type: string
                              example: https://www.example.com/
                            uuid:
                              description: Scan id
                              type: string
                              format: uuid
                            visibility:
                              description: Submitted visibility status.
                              type: string
                              example: public
                              enum:
                              - public
                              - unlisted
                          required:
                          - uuid
                          - url
                          - success
                          - time
                          - country
                          - visibility
                          type: object
                    required:
                    - tasks
                  success:
                    description: Whether search request was successful or not
                    type: boolean
                required:
                - messages
                - errors
                - success
                - result
        '400':
          description: Invalid params.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                          example: Scan ID is not a valid UUID.
                      required:
                      - message
                      type: object
                  messages:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                  success:
                    description: Whether request was successful or not
                    type: boolean
                required:
                - messages
                - errors
                - success
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - URL Scanner (Deprecated)
      x-api-token-group:
      - URL Scanner Write
      - URL Scanner Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: deprecated
      x-fern-sdk-group-name: url-scanner.scan.get.urlscanner
      x-fern-sdk-method-name: scans
      x-forge-hidden: true
      x-forge-sunset:
        date: '2030-01-01T00:00:00Z'
      x-stainless-deprecation-message: Use [V2](https://developers.cloudflare.com/api/resources/url_scanner/subresources/scans/methods/list/) instead.
    post:
      operationId: urlscanner-create-scan
      summary: Create URL Scan
      description: Submit a URL to scan. You can also set some options, like the visibility level and custom headers. Check limits at https://developers.cloudflare.com/security-center/investigate/scan-limits/.
