  /accounts/{account_id}/urlscanner/scan/{scan_id}:
    get:
      operationId: urlscanner-get-scan
      summary: Get URL scan
      description: Get URL scan by uuid
      parameters:
      - name: scan_id
        in: path
        description: Scan UUID.
        required: true
        schema:
          description: Scan UUID.
          type: string
          format: uuid
      - name: account_id
        in: path
        description: Account ID.
        required: true
        schema:
          description: Account ID.
          type: string
      - name: full
        in: query
        description: Whether to return full report (scan summary and network log).
        schema:
          description: Whether to return full report (scan summary and network log).
          type: boolean
      responses:
        '200':
          description: Scan has finished. It may or may not have been successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                          example: Error
                      required:
                      - message
                      type: object
                  messages:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                          example: OK
                      required:
                      - message
                      type: object
                  result:
                    type: object
                    properties:
                      scan:
                        type: object
                        properties:
                          asns:
                            description: Dictionary of Autonomous System Numbers where ASN's are the keys
                            type: object
                            properties:
                              asn:
                                description: ASN's contacted
                                type: object
                                properties:
                                  asn:
                                    type: string
                                    example: '15133'
                                  description:
                                    type: string
                                    example: EDGECAST
                                  location_alpha2:
                                    type: string
                                    example: US
                                  name:
                                    type: string
                                    example: EDGECAST
                                  org_name:
                                    type: string
                                    example: Edgecast Inc.
                                required:
                                - asn
                                - name
                                - description
                                - org_name
                                - location_alpha2
                          certificates:
                            type: array
                            items:
                              properties:
                                issuer:
                                  type: string
                                subjectName:
                                  type: string
                                  example: rkmod.somee.com
                                validFrom:
                                  type: number
                                  example: 1682684400
                                validTo:
                                  type: number
                                  example: 1696698000
                              required:
                              - issuer
                              - subjectName
                              - validFrom
                              - validTo
                              type: object
                          domains:
                            type: object
                            properties:
                              example.com:
                                type: object
                                properties:
                                  categories:
                                    type: object
                                    properties:
                                      content:
                                        items:
                                          properties:
                                            id:
                                              type: integer
                                            name:
                                              type: string
                                              example: Technology
                                            super_category_id:
                                              type: integer
                                          required:
                                          - id
                                          - name
                                          type: object
                                        type: array
                                      inherited:
                                        type: object
                                        properties:
                                          content:
                                            items:
                                              properties:
                                                id:
                                                  type: integer
                                                name:
                                                  type: string
                                                  example: Technology
                                                super_category_id:
                                                  type: integer
                                              required:
                                              - id
                                              - name
                                              type: object
                                            type: array
                                          from:
                                            type: string
                                            example: example.com
                                          risks:
                                            type: array
                                            items:
                                              properties:
                                                id:
                                                  type: integer
                                                name:
                                                  type: string
                                                  example: Technology
                                                super_category_id:
                                                  type: integer
                                              required:
                                              - id
                                              - name
                                              type: object
                                      risks:
                                        type: array
                                        items:
                                          properties:
                                            id:
                                              type: integer
                                            name:
                                              type: string
                                              example: Technology
                                            super_category_id:
                                              type: integer
                                          required:
                                          - id
                                          - name
                                          type: object
                                    required:
                                    - inherited
                                  dns:
                                    type: array
                                    items:
                                      properties:
                                        address:
                                          type: string
                                          example: 93.184.216.34
                                        dnssec_valid:
                                          type: boolean
                                        name:
                                          type: string
                                          example: example.com
                                        type:
                                          type: string
                                          example: A
                                      required:
                                      - name
                                      - address
                                      - type
                                      - dnssec_valid
                                      type: object
                                  name:
                                    type: string
                                    example: example.com
                                  rank:
                                    type: object
                                    properties:
                                      bucket:
                                        type: string
                                        example: '500'
                                      name:
