  parameters:
    resource-tagging_tag:
      description: 'Filter resources by tag criteria. This parameter can be repeated multiple times, with AND logic between parameters.


        Supported syntax:

        - **Key-only**: `tag=<key>` - Resource must have the tag key (e.g., `tag=production`)

        - **Key-value**: `tag=<key>=<value>` - Resource must have the tag with specific value (e.g., `tag=env=prod`)

        - **Multiple values (OR)**: `tag=<key>=<v1>,<v2>` - Resource must have tag with any of the values (e.g., `tag=env=prod,staging`)

        - **Negate key-only**: `tag=!<key>` - Resource must not have the tag key (e.g., `tag=!archived`)

        - **Negate key-value**: `tag=<key>!=<value>` - Resource must not have the tag with specific value (e.g., `tag=region!=us-west-1`)


        Multiple tag parameters are combined with AND logic.

        '
      explode: true
      in: query
      name: tag
      schema:
        type: array
        items:
          type: string
        example:
        - production
        - env=prod
        - env=prod,staging
        - '!archived'
        - region!=us-west-1
    resource-tagging_if_match:
      description: 'ETag value for optimistic concurrency control. When provided, the server will

        verify the current resource ETag matches before applying the write. Returns

        412 Precondition Failed if the resource has been modified since the ETag was

        obtained. Omit this header for unconditional writes.

        '
      in: header
      name: If-Match
      schema:
        type: string
        example: '"v1:RBNvo1WzZ4oRRq0W9-hkng"'
    resource-tagging_cursor:
      description: Cursor for pagination.
      in: query
      name: cursor
      schema:
        type: string
        example: eyJhY2NvdW50X2lkIjoxMjM0NTY3ODkwfQ
    resource-tagging_type:
      description: Filter by resource type.
      in: query
      name: type
      schema:
        $ref: '#/components/schemas/resource-tagging_resource_type'
  securitySchemes:
    api_email:
      in: header
      name: X-Auth-Email
      type: apiKey
    api_key:
      in: header
      name: X-Auth-Key
      type: apiKey
    api_token:
      scheme: bearer
      type: http
    user_service_key:
      in: header
      name: X-Auth-User-Service-Key
      type: apiKey
