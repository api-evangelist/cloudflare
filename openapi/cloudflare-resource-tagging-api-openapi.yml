openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Resource Tagging API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Resource Tagging
paths:
  /accounts/{account_id}/tags:
    delete:
      operationId: tags-delete
      summary: Delete tags from an account-level resource
      description: Removes all tags from a specific account-level resource.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-tagging_account_id'
      - $ref: '#/components/parameters/resource-tagging_if_match'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resource-tagging_delete_tags_request_account_level'
      responses:
        '204':
          description: Tags successfully deleted (no content).
        '412':
          description: Precondition failed. The resource has been modified since the provided ETag was obtained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
        4XX:
          description: Delete tags response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
        5XX:
          description: Delete tags response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Tagging
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: beta
      x-fern-sdk-group-name: account-tags
      x-fern-sdk-method-name: delete
      x-stability: beta
    get:
      operationId: tags-get
      summary: Get tags for an account-level resource
      description: Retrieves tags for a specific account-level resource.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-tagging_account_id'
      - name: resource_id
        in: query
        description: The ID of the resource to retrieve tags for.
        required: true
        schema:
          $ref: '#/components/schemas/resource-tagging_resource_id'
      - name: resource_type
        in: query
        description: The type of the resource.
        required: true
        schema:
          $ref: '#/components/schemas/resource-tagging_account_resource_type'
      - name: worker_id
        in: query
        description: Worker identifier. Required for worker_version resources.
        schema:
          $ref: '#/components/schemas/resource-tagging_worker_id'
      responses:
        '200':
          description: Get tags for single resource response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_tagged_resource_response_single'
        4XX:
          description: Get tags for single resource response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
        5XX:
          description: Get tags for single resource response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Tagging
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: beta
      x-fern-sdk-group-name: account-tags
      x-fern-sdk-method-name: get
      x-stability: beta
    put:
      operationId: tags-set
      summary: Set tags for an account-level resource
      description: Creates or updates tags for a specific account-level resource. Replaces all existing tags for the resource.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-tagging_account_id'
      - $ref: '#/components/parameters/resource-tagging_if_match'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resource-tagging_set_tags_request_account_level'
      responses:
        '200':
          description: Set tags response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_tagged_resource_response_single'
        '412':
          description: Precondition failed. The resource has been modified since the provided ETag was obtained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
        4XX:
          description: Set tags response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
        5XX:
          description: Set tags response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Tagging
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: beta
      x-fern-sdk-group-name: account-tags
      x-fern-sdk-method-name: update
      x-stability: beta
  /accounts/{account_id}/tags/keys:
    get:
      operationId: tags-list-keys
      summary: List tag keys
      description: Lists all distinct tag keys used across resources in an account.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-tagging_account_id'
      - $ref: '#/components/parameters/resource-tagging_cursor'
      responses:
        '200':
          description: List tag keys response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_tag_keys_response_collection'
        4XX:
          description: List tag keys response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
        5XX:
          description: List tag keys response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Tagging
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: beta
      x-fern-sdk-group-name: keys
      x-fern-sdk-method-name: list
      x-stability: beta
  /accounts/{account_id}/tags/resources:
    get:
      operationId: tags-list
      summary: List tagged resources
      description: Lists all tagged resources for an account.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-tagging_account_id'
      - name: type
        in: query
        description: 'Filter by resource type. Can be repeated to filter by multiple types (OR logic). Example: ?type=zone&type=worker'
        schema:
          type: array
          items:
            $ref: '#/components/schemas/resource-tagging_resource_type'
        explode: true
        style: form
      - name: name
        in: query
        description: 'Filter by resource name. Performs a case-insensitive substring match. Example: ?name=my-zone'
        schema:
          type: string
          maxLength: 256
      - name: id
        in: query
        description: 'Filter by resource ID. Can be repeated up to 50 times to filter by multiple IDs. Example: ?id=abc&id=def'
        schema:
          type: array
          items:
            $ref: '#/components/schemas/resource-tagging_resource_id'
          maxItems: 50
        explode: true
        style: form
      - name: case_insensitive
        in: query
        description: 'Match `tag` keys and values case-insensitively. Stored casing is unchanged. Example: ?tag=environment=production&case_insensitive=true'
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/resource-tagging_tag'
      - $ref: '#/components/parameters/resource-tagging_cursor'
      responses:
        '200':
          description: List tagged resources response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_tagged_resource_response_collection'
        4XX:
          description: List tagged resources response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
        5XX:
          description: List tagged resources response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Tagging
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: beta
      x-fern-sdk-group-name: tags.resources
      x-fern-sdk-method-name: list
      x-stability: beta
  /accounts/{account_id}/tags/summary:
    get:
      operationId: tags-list-key-summary
      summary: List tag key summary
      description: Lists all distinct tag keys and their distinct values across resources in an account.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-tagging_account_id'
      - $ref: '#/components/parameters/resource-tagging_cursor'
      responses:
        '200':
          description: List tag key summary response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_tag_key_summary_response_collection'
        4XX:
          description: List tag key summary response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
        5XX:
          description: List tag key summary response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Tagging
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: beta
      x-fern-sdk-group-name: resource-tagging.summary
      x-fern-sdk-method-name: get
      x-stability: beta
  /accounts/{account_id}/tags/values/{tag_key}:
    get:
      operationId: tags-list-values
      summary: List tag values
      description: Lists all distinct values for a given tag key, optionally filtered by resource type.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-tagging_account_id'
      - name: tag_key
        in: path
        description: The tag key to retrieve values for.
        required: true
        schema:
          type: string
          example: environment
      - $ref: '#/components/parameters/resource-tagging_type'
      - $ref: '#/components/parameters/resource-tagging_cursor'
      responses:
        '200':
          description: List tag values response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_tag_values_response_collection'
        4XX:
          description: List tag values response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
        5XX:
          description: List tag values response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Tagging
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: beta
      x-fern-sdk-group-name: values
      x-fern-sdk-method-name: list
      x-stability: beta
  /zones/{zone_id}/tags:
    delete:
      operationId: tags-zone-delete
      summary: Delete tags from a zone-level resource
      description: Removes all tags from a specific zone-level resource.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-tagging_zone_id'
      - $ref: '#/components/parameters/resource-tagging_if_match'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resource-tagging_delete_tags_request_zone_level'
      responses:
        '204':
          description: Tags successfully deleted (no content).
        '412':
          description: Precondition failed. The resource has been modified since the provided ETag was obtained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
        4XX:
          description: Delete tags response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
        5XX:
          description: Delete tags response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Tagging
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: beta
      x-fern-sdk-group-name: zone-tags
      x-fern-sdk-method-name: delete
      x-stability: beta
    get:
      operationId: tags-zone-get
      summary: Get tags for a zone-level resource
      description: Retrieves tags for a specific zone-level resource.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-tagging_zone_id'
      - name: resource_id
        in: query
        description: The ID of the resource to retrieve tags for.
        required: true
        schema:
          $ref: '#/components/schemas/resource-tagging_resource_id'
      - name: resource_type
        in: query
        description: The type of the resource.
        required: true
        schema:
          $ref: '#/components/schemas/resource-tagging_zone_resource_type'
      - name: access_application_id
        in: query
        description: Access application ID identifier. Required for access_application_policy resources.
        schema:
          $ref: '#/components/schemas/resource-tagging_access_application_id'
      responses:
        '200':
          description: Get tags for single resource response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_tagged_resource_response_single'
        4XX:
          description: Get tags for single resource response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
        5XX:
          description: Get tags for single resource response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Tagging
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: beta
      x-fern-sdk-group-name: zone-tags
      x-fern-sdk-method-name: get
      x-stability: beta
    put:
      operationId: tags-zone-set
      summary: Set tags for a zone-level resource
      description: Creates or updates tags for a specific zone-level resource. Replaces all existing tags for the resource.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/resource-tagging_zone_id'
      - $ref: '#/components/parameters/resource-tagging_if_match'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resource-tagging_set_tags_request_zone_level'
      responses:
        '200':
          description: Set tags response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_tagged_resource_response_single'
        '412':
          description: Precondition failed. The resource has been modified since the provided ETag was obtained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
        4XX:
          description: Set tags response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
        5XX:
          description: Set tags response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resource-tagging_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Resource Tagging
      x-cfPlanAvailability:
        business: false
        enterprise: true
        free: false
        pro: false
      x-fern-availability: beta
      x-fern-sdk-group-name: zone-tags
      x-fern-sdk-method-name: update
      x-stability: beta
components:
  schemas:
    resource-tagging_tagged_resource_object_zone_ruleset:
      description: Response for zone_ruleset resources
      allOf:
      - properties:
          type:
            type: string
            enum:
            - zone_ruleset
        required:
        - type
        type: object
      - $ref: '#/components/schemas/resource-tagging_tagged_resource_object_zone_level_base'
    resource-tagging_tagged_resource_object_kv_namespace:
      description: Response for kv_namespace resources
      allOf:
      - properties:
          type:
            type: string
            enum:
            - kv_namespace
        required:
        - type
        type: object
      - $ref: '#/components/schemas/resource-tagging_tagged_resource_object_account_level_base'
    resource-tagging_tagged_resource_object_cws_policy_set:
      description: Response for cws_policy_set resources
      allOf:
      - properties:
          type:
            type: string
            enum:
            - cws_policy_set
        required:
        - type
        type: object
      - $ref: '#/components/schemas/resource-tagging_tagged_resource_object_account_level_base'
    resource-tagging_resource_name:
      description: Human-readable name of the resource.
      type: string
      example: my-worker-script
    resource-tagging_tagged_resource_object_access_group:
      description: Response for access_group resources
      allOf:
      - properties:
          type:
            type: string
            enum:
            - access_group
        required:
        - type
        type: object
      - $ref: '#/components/schemas/resource-tagging_tagged_resource_object_account_level_base'
    resource-tagging_tagged_resource_object_stream_video:
      description: Response for stream_video resources
      allOf:
      - properties:
          type:
            type: string
            enum:
            - stream_video
        required:
        - type
        type: object
      - $ref: '#/components/schemas/resource-tagging_tagged_resource_object_account_level_base'
    resource-tagging_tagged_resource_object_account_ruleset:
      description: Response for account_ruleset resources
      allOf:
      - properties:
          type:
            type: string
            enum:
            - account_ruleset
        required:
        - type
        type: object
      - $ref: '#/components/schemas/resource-tagging_tagged_resource_object_account_level_base'
    resource-tagging_tagged_resource_object_vectorize_index:
      description: Response for vectorize_index resources
      allOf:
      - properties:
          type:
            type: string
            enum:
            - vectorize_index
        required:
        - type
        type: object
      - $ref: '#/components/schemas/resource-tagging_tagged_resource_object_account_level_base'
    resource-tagging_tagged_resource_object_access_application:
      description: Response for access_application resources
      allOf:
      - properties:
          type:
            type: string
            enum:
            - access_application
        required:
        - type
        type: object
      - $ref: '#/components/schemas/resource-tagging_tagged_resource_object_account_level_base'
    resource-tagging_resource_type:
      description: Identifies the type of resource.
      type: string
      example: zone
      enum:
      - access_application
      - access_application_policy
      - access_group
      - account
      - account_ruleset
      - ai_gateway
      - alerting_policy
      - alerting_webhook
      - api_gateway_operation
      - cloudflared_tunnel
      - custom_certificate
      - custom_hostname
      - cws_deployment
      - cws_policy
      - cws_policy_set
      - cws_workload
      - d1_database
      - device
      - dns_record
      - durable_object_namespace
      - gateway_list
      - gateway_rule
      - healthcheck
      - image
      - infrastructure_target
      - kv_namespace
      - load_balancer
      - load_balancer_monitor
      - load_balancer_pool
      - managed_client_certificate
      - pages_project
      - queue
      - r2_bucket
      - resource_share
      - stream_live_input
      - stream_video
      - vectorize_index
      - worker
      - worker_route
      - worker_version
      - zone
      - zone_ruleset
      x-auditable: true
    resource-tagging_tagged_resource_object_infrastructure_target:
      description: Response for infrastructure_target resources
      allOf:
      - properties:
          type:
            type: string
            enum:
            - infrastructure_target
        required:
        - type
        type: object
      - $ref: '#/components/schemas/resource-tagging_tagged_resource_object_account_level_base'
    resource-tagging_delete_tags_request_account_level_base:
      description: Request body schema for deleting tags from account-level resources.
      type: object
      properties:
        resource_id:
          $ref: '#/components/schemas/resource-tagging_resource_id'
        resource_type:
          $ref: '#/components/schemas/resource-tagging_account_resource_type_base_enum'
      required:
      - resource_type
      - resource_id
    resource-tagging_tags:
      description: Contains key-value pairs of tags. Keys may contain at most 256 characters. Values may contain at most 1024 characters and may be empty for key-only tags.
      type: object
      example:
        environment: production
        team: engineering
      additionalProperties:
        maxLength: 1024
        type: string
      x-auditable: true
    resource-tagging_tagged_resource_object_zone:
      description: Response for zone resources
      allOf:
      - properties:
          type:
            type: string
            enum:
            - zone
        required:
        - type
        type: object
      - $ref: '#/components/schemas/resource-tagging_tagged_resource_object_zone_level_base'
    resource-tagging_zone_resource_type_base_enum:
      description: Enum for base zone-level resource types (those with no extra required fields).
      type: string
      example: zone
      enum:
      - api_gateway_operation
      - custom_certificate
      - custom_hostname
      - dns_record
      - healthcheck
      - load_balancer
      - managed_client_certificate
      - worker_route
      - zone
      - zone_ruleset
      x-auditable: true
    resource-tagging_tagged_resource_object_managed_client_certificate:
      description: Response for managed_client_certificate resources
      allOf:
      - properties:
          type:
            type: string
            enum:
            - managed_client_certificate
        required:
        - type
        type: object
      - $ref: '#/components/schemas/resource-tagging_tagged_resource_object_zone_level_base'
    resource-tagging_access_application_id:
      description: Access application ID is required only for access_application_policy resources
      type: string
      format: uuid
      example: f174e90a-fafe-4643-bbbc-4a0ed4fc8415
    resource-tagging_tagged_resource_object_d1_database:
      description: Response for d1_database resources
      allOf:
      - properties:
          type:
            type: string
            enum:
            - d1_database
        required:
        - type
        type: object
      - $ref: '#/components/schemas/resource-tagging_tagged_resource_object_account_level_base'
    resource-tagging_etag:
      description: 'ETag identifier for optimistic concurrency control. Formatted as "v1:<hash>" where

        the hash is the base64url-encoded SHA-256 (truncated to 128 bits) of the tags map

        canonicalized using RFC 8785 (JSON Canonicalization Scheme). Clients should treat

        ETags as opaque strings and pass them back via the If-Match header on write operations.

        '
      type: string
      example: v1:RBNvo1WzZ4oRRq0W9-hkng
      readOnly: true
    resource-tagging_tagged_resource_object_alerting_webhook:
      description: Response for alerting_webhook resources
      allOf:
      - properties:
          type:
            type: string
            enum:
            - alerting_webhook
        required:
        - type
        type: object
      - $ref: '#/components/schemas/resource-tagging_tagged_resource_object_account_level_base'
    resource-tagging_zone_id:
      description: Zone ID is required only for zone-level resources
      type: string
