    resource-tagging_tags_updated_at:
      description: 'Monotonic version of the resource''s tags: the timestamp assigned when the

        tags were last written. Returned by read endpoints, by 2PC prepare (the

        version that will be assigned on commit, unless a concurrent write lands

        first, in which case a newer version is assigned), and by 2PC commit (the

        authoritative committed version). Omitted for untagged resources and

        delete commits: a deleted resource has no current version, and deletions

        are ordered by event order rather than by version.

