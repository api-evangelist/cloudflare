    abuse-reports_CloudflareAPIErrorResponse:
      description: Cloudflare's API layer uses this standard error envelope for requests that fail authentication or authorization before they reach the Abuse Reports API. The example shows error code `10000`, returned for missing or invalid credentials (HTTP 401) and for a token or OAuth grant that lacks the required Trust and Safety permission (HTTP 403).
      type: object
      properties:
        errors:
          description: Cloudflare API error details.
          type: array
          items:
            $ref: '#/components/schemas/abuse-reports_ErrorMessage'
          example:
          - code: 10000
            message: Authentication error
        messages:
          description: Informational messages.
          type: array
          items:
            $ref: '#/components/schemas/abuse-reports_Message'
          example: []
        result:
          description: Always null for this error response.
          type:
          - object
          - 'null'
        success:
          description: Whether the request succeeded.
          type: boolean
          example: false
      example:
        errors:
        - code: 10000
          message: Authentication error
        messages: []
        result: null
        success: false
      required:
      - success
      - errors
      - messages
      - result
    abuse-reports_SubmitReportResponse:
      type: object
      properties:
        abuse_rand:
          description: The identifier for the submitted abuse report.
          type: string
        request:
          type: object
          properties:
            act:
              $ref: '#/components/schemas/abuse-reports_SubmissionReportType'
          required:
          - act
        result:
          description: The result should be 'success' for successful response
          type: string
      required:
      - request
      - result
      - abuse_rand
