openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Tseng Abuse Complaint Processor Other API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: tseng-abuse-complaint-processor_other
paths:
  /accounts/{account_id}/abuse-reports:
    get:
      operationId: ListAbuseReports
      summary: List abuse reports against the account
      description: List abuse reports made against domains or other content associated with the account. To list reports that the account submitted, use the submitted abuse reports endpoint instead.
      parameters:
      - name: account_id
        in: path
        description: Cloudflare Account ID
        required: true
        schema:
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
          maxLength: 32
      - name: page
        in: query
        description: Where in pagination to start listing abuse reports
        schema:
          type: integer
      - name: per_page
        in: query
        description: How many abuse reports per page to list
        schema:
          type: integer
      - name: sort
        in: query
        description: A property to sort by, followed by the order (id, cdate, domain, type, status)
        schema:
          type: string
        example: cdate,desc
      - name: domain
        in: query
        description: Filter by domain name related to the abuse report
        schema:
          type: string
        example: example.com
      - name: created_before
        in: query
        description: Returns reports created before the specified date
        schema:
          description: Time in RFC 3339 format (https://www.rfc-editor.org/rfc/rfc3339.html)
          type: string
          example: '2009-11-10T23:00:00Z'
        example: '2009-11-10T23:00:00Z'
      - name: created_after
        in: query
        description: Returns reports created after the specified date
        schema:
          description: Time in RFC 3339 format (https://www.rfc-editor.org/rfc/rfc3339.html)
          type: string
          example: '2009-11-10T23:00:00Z'
        example: '2009-11-10T23:00:00Z'
      - name: status
        in: query
        description: Filter by the status of the report.
        schema:
          $ref: '#/components/schemas/abuse-reports_ReportStatus'
        example: denied
      - name: type
        in: query
        description: Filter by the type of the report.
        schema:
          $ref: '#/components/schemas/abuse-reports_ReportType'
        example: denied
      - name: mitigation_status
        in: query
        description: Filter reports that have any mitigations in the given status.
        schema:
          $ref: '#/components/schemas/abuse-reports_MitigationStatus'
        example: active
      responses:
        '200':
          description: Abuse report list successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  result:
                    type: object
                    properties:
                      reports:
                        type: array
                        items:
                          $ref: '#/components/schemas/abuse-reports_AbuseReport'
                    required:
                    - reports
                  result_info:
                    type: object
                    properties:
                      count:
                        type: number
                      page:
                        type: number
                      per_page:
                        type: number
                      total_count:
                        type: number
                      total_pages:
                        type: number
                    required:
                    - page
                    - per_page
                    - count
                    - total_count
                    - total_pages
                  success:
                    type: boolean
                required:
                - success
        '401':
          description: 'The request is not authorized. Missing or invalid credentials may be

            rejected with the standard Cloudflare API authentication error. If

            credentials are valid, the API token does not have the

            `Trust and Safety Read` or `Trust and Safety Write` permission for

            this account.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_UnauthorizedErrorResponse'
        '403':
          description: 'Cloudflare''s API layer rejected the request because the API token or

            OAuth grant does not have the required Trust and Safety permission for

            this account. The response uses error code `10000`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_CloudflareAPIErrorResponse'
        '500':
          description: Failed to retrieve abuse reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  success:
                    type: boolean
                required:
                - success
      security:
      - api_token: []
      tags:
      - tseng-abuse-complaint-processor_other
      x-api-token-group:
      - Trust and Safety Write
      - Trust and Safety Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: abuse-reports
      x-fern-sdk-method-name: list
  /accounts/{account_id}/abuse-reports/submitted:
    get:
      operationId: ListSubmittedAbuseReports
      summary: List submitted abuse reports
      description: List abuse reports submitted by the account.
      parameters:
      - name: account_id
        in: path
        description: Cloudflare Account ID
        required: true
        schema:
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
          maxLength: 32
      - name: page
        in: query
        description: Page of submitted reports to return.
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        description: Number of submitted reports per page.
        schema:
          type: integer
          default: 100
          maximum: 200
          minimum: 1
      - name: sort
        in: query
        description: A property and direction to sort by (id, cdate, domain, type, status).
        schema:
          type: string
        example: cdate,desc
      - name: id
        in: query
        description: Filter by report code.
        schema:
          type: string
      - name: domain
        in: query
        description: Filter by reported domain. This parameter can be specified multiple times.
        schema:
          type: array
          items:
            type: string
        explode: true
        style: form
      - name: created_before
        in: query
        description: Return reports submitted before this time.
        schema:
          type: string
          format: date-time
      - name: created_after
        in: query
        description: Return reports submitted after this time.
        schema:
          type: string
          format: date-time
      - name: status
        in: query
        description: Filter by submitter-facing status. This parameter can be specified multiple times.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/abuse-reports_SubmittedAbuseReportStatus'
        explode: true
        style: form
      - name: type
        in: query
        description: Filter by report type. This parameter can be specified multiple times.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/abuse-reports_ReportType'
        explode: true
        style: form
      responses:
        '200':
          description: Submitted abuse reports listed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_SubmittedAbuseReportListResponse'
        '400':
          description: Invalid account or query parameters.
        '401':
          description: 'The request is not authorized to read abuse reports for this account.

            The API token needs the `Trust and Safety Read` or

            `Trust and Safety Write` permission.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_UnauthorizedErrorResponse'
        '403':
          description: 'Cloudflare''s API layer rejected the request because the API token or

            OAuth grant does not have the required Trust and Safety permission for

            this account. The response uses error code `10000`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_CloudflareAPIErrorResponse'
        '500':
          description: Failed to retrieve submitted abuse reports.
      security:
      - api_token: []
      tags:
      - tseng-abuse-complaint-processor_other
      x-api-token-group:
      - Trust and Safety Write
      - Trust and Safety Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: abuse-reports
      x-fern-sdk-method-name: list-submitted
  /accounts/{account_id}/abuse-reports/submitted/{report_id}:
    get:
      operationId: GetSubmittedAbuseReport
      summary: Get a submitted abuse report
      description: Retrieve a report submitted by the account.
      parameters:
      - name: account_id
        in: path
        description: Cloudflare Account ID
        required: true
        schema:
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
          maxLength: 32
      - name: report_id
        in: path
        description: Public report code.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Submitted abuse report found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_SubmittedAbuseReportDetailResponse'
        '400':
          description: Invalid account or report code.
        '401':
          description: 'The request is not authorized to read abuse reports for this account.

            The API token needs the `Trust and Safety Read` or

            `Trust and Safety Write` permission.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_UnauthorizedErrorResponse'
        '403':
          description: 'Cloudflare''s API layer rejected the request because the API token or

            OAuth grant does not have the required Trust and Safety permission for

            this account. The response uses error code `10000`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_CloudflareAPIErrorResponse'
        '404':
          description: No matching submitted report was found for the account.
        '500':
          description: Failed to retrieve the submitted abuse report.
      security:
      - api_token: []
      tags:
      - tseng-abuse-complaint-processor_other
      x-api-token-group:
      - Trust and Safety Write
      - Trust and Safety Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: abuse-reports
      x-fern-sdk-method-name: get-submitted
  /accounts/{account_id}/abuse-reports/submitted/{report_id}/emails:
    get:
      operationId: ListSubmittedAbuseReportEmails
      summary: List emails sent to an abuse report submitter
      description: List successful emails sent to the submitter of a report submitted by the account. Does not include emails sent to customers or hosts.
      parameters:
      - name: account_id
        in: path
        description: Cloudflare Account ID
        required: true
        schema:
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
          maxLength: 32
      - name: report_id
        in: path
        description: Public report code.
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number to retrieve (default 1).
        schema:
          type: integer
      - name: per_page
        in: query
        description: Number of emails per page (default 20, max 100).
        schema:
          type: integer
      responses:
        '200':
          description: Submitted abuse report emails listed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_EmailListResponse'
        '400':
          description: Invalid account, report, or query parameters.
        '401':
          description: 'The request is not authorized to read abuse reports for this account.

            The API token needs the `Trust and Safety Read` or

            `Trust and Safety Write` permission.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_UnauthorizedErrorResponse'
        '403':
          description: 'Cloudflare''s API layer rejected the request because the API token or

            OAuth grant does not have the required Trust and Safety permission for

            this account. The response uses error code `10000`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_CloudflareAPIErrorResponse'
        '404':
          description: Submitted abuse report not found for the selected account.
        '500':
          description: Failed to retrieve submitted abuse report emails.
      security:
      - api_token: []
      tags:
      - tseng-abuse-complaint-processor_other
      x-api-token-group:
      - Trust and Safety Write
      - Trust and Safety Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: abuse-reports.emails
      x-fern-sdk-method-name: list-submitted
  /accounts/{account_id}/abuse-reports/{report_id}/appeals/eligibility:
    get:
      operationId: CheckAppealEligibility
      summary: Check whether a report can be appealed
      description: 'Returns whether the report is currently appealable, along with the signals behind that decision: whether it already has an open appeal, how many appeals have been submitted against it, and whether it has at least one mitigation that an appeal could reverse.

        Report-level appeals are currently available only for DMCA (copyright) reports. For other report types this operation returns the same `404 Report not found` response as a report that does not exist for the account.'
      parameters:
      - name: account_id
        in: path
        description: Cloudflare Account ID
        required: true
        schema:
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
          maxLength: 32
      - name: report_id
        in: path
        description: Abuse Report ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Appeal eligibility for the report
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  result:
                    $ref: '#/components/schemas/abuse-reports_AppealEligibility'
                  success:
                    type: boolean
                required:
                - success
        '401':
          description: 'The request is not authorized. Missing or invalid credentials may be

            rejected with the standard Cloudflare API authentication error. If

            credentials are valid, the API token does not have the

            `Trust and Safety Read` or `Trust and Safety Write` permission for

            this account.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_UnauthorizedErrorResponse'
        '403':
          description: 'Cloudflare''s API layer rejected the request because the API token or

            OAuth grant does not have the required Trust and Safety permission for

            this account. The response uses error code `10000`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_CloudflareAPIErrorResponse'
        '404':
          description: The report was not found for this account, or its type does not support report-level appeals (currently DMCA reports only).
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  success:
                    type: boolean
                required:
                - success
        '500':
          description: Failed to check appeal eligibility.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  success:
                    type: boolean
                required:
                - success
      security:
      - api_token: []
      tags:
      - tseng-abuse-complaint-processor_other
      x-api-token-group:
      - Trust and Safety Write
      - Trust and Safety Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: abuse-reports.appeals
      x-fern-sdk-method-name: eligibility
  /accounts/{account_id}/abuse-reports/{report_id}/emails:
    get:
      operationId: ListEmails
      summary: List abuse report emails
      description: List emails sent to the customer for an abuse report. Returns all successful customer emails sent for the specified abuse report. Does not include emails sent to hosts or submitters.
      parameters:
      - name: account_id
        in: path
        description: Cloudflare Account ID
        required: true
        schema:
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
          maxLength: 32
      - name: report_id
        in: path
        description: Abuse Report ID
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number to retrieve (default 1)
        schema:
          type: integer
      - name: per_page
        in: query
        description: Number of emails per page (default 20, max 100)
        schema:
          type: integer
      responses:
        '200':
          description: List abuse report emails successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  result:
                    type: object
                    properties:
                      emails:
                        type: array
                        items:
                          $ref: '#/components/schemas/abuse-reports_EmailListItem'
                    required:
                    - emails
                  result_info:
                    type: object
                    properties:
                      count:
                        type: number
                      page:
                        type: number
                      per_page:
                        type: number
                      total_count:
                        type: number
                      total_pages:
                        type: number
                    required:
                    - page
                    - per_page
                    - count
                    - total_count
                    - total_pages
                  success:
                    type: boolean
                required:
                - success
        '400':
          description: Bad request - invalid parameters or report not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  success:
                    type: boolean
                required:
                - success
        '401':
          description: 'The request is not authorized. Missing or invalid credentials may be

            rejected with the standard Cloudflare API authentication error. If

            credentials are valid, the API token does not have the

            `Trust and Safety Read` or `Trust and Safety Write` permission for

            this account.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_UnauthorizedErrorResponse'
        '403':
          description: 'Cloudflare''s API layer rejected the request because the API token or

            OAuth grant does not have the required Trust and Safety permission for

            this account. The response uses error code `10000`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_CloudflareAPIErrorResponse'
        '500':
          description: Failed to list abuse report emails
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  success:
                    type: boolean
                required:
                - success
      security:
      - api_token: []
      tags:
      - tseng-abuse-complaint-processor_other
      x-api-token-group:
      - Trust and Safety Write
      - Trust and Safety Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: abuse-reports.emails
      x-fern-sdk-method-name: list
  /accounts/{account_id}/abuse-reports/{report_id}/mitigations:
    get:
      operationId: ListMitigations
      summary: List abuse report mitigations
      description: List mitigations done to remediate the abuse report.
      parameters:
      - name: account_id
        in: path
        description: Cloudflare Account ID
        required: true
        schema:
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
          maxLength: 32
      - name: report_id
        in: path
        description: Abuse Report ID
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Where in pagination to start listing abuse reports
        schema:
          type: integer
      - name: per_page
        in: query
        description: How many abuse reports per page to list
        schema:
          type: integer
      - name: sort
        in: query
        description: A property to sort by, followed by the order
        schema:
          type: string
          enum:
          - type,asc
          - type,desc
          - effective_date,asc
          - effective_date,desc
          - status,asc
          - status,desc
          - entity_type,asc
          - entity_type,desc
        example: type,desc
      - name: type
        in: query
        description: Filter by the type of mitigation. This filter parameter can be specified multiple times to include multiple types of mitigations in the result set.
        schema:
          $ref: '#/components/schemas/abuse-reports_MitigationType'
      - name: effective_before
        in: query
        description: Returns mitigations that were dispatched before the given date
        schema:
          description: Time in RFC 3339 format (https://www.rfc-editor.org/rfc/rfc3339.html)
          type: string
          example: '2009-11-10T23:00:00Z'
        example: '2009-11-10T23:00:00Z'
      - name: effective_after
        in: query
        description: Returns mitigation that were dispatched after the given date
        schema:
          description: Time in RFC 3339 format (https://www.rfc-editor.org/rfc/rfc3339.html)
          type: string
          example: '2009-11-10T23:00:00Z'
        example: '2009-11-10T23:00:00Z'
      - name: status
        in: query
        description: Filter by the status of the mitigation.
        schema:
          $ref: '#/components/schemas/abuse-reports_MitigationStatus'
      - name: entity_type
        in: query
        description: Filter by the type of entity the mitigation impacts.
        schema:
          $ref: '#/components/schemas/abuse-reports_MitigatedEntityType'
      responses:
        '200':
          description: List abuse report mitigations successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  result:
                    type: object
                    properties:
                      mitigations:
                        type: array
                        items:
                          $ref: '#/components/schemas/abuse-reports_MitigationListItem'
                    required:
                    - mitigations
                  result_info:
                    type: object
                    properties:
                      count:
                        type: number
                      page:
                        type: number
                      per_page:
                        type: number
                      total_count:
                        type: number
                      total_pages:
                        type: number
                    required:
                    - page
                    - per_page
                    - count
                    - total_count
                    - total_pages
                  success:
                    type: boolean
                required:
                - success
        '401':
          description: 'The request is not authorized. Missing or invalid credentials may be

            rejected with the standard Cloudflare API authentication error. If

            credentials are valid, the API token does not have the

            `Trust and Safety Read` or `Trust and Safety Write` permission for

            this account.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_UnauthorizedErrorResponse'
        '403':
          description: 'Cloudflare''s API layer rejected the request because the API token or

            OAuth grant does not have the required Trust and Safety permission for

            this account. The response uses error code `10000`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_CloudflareAPIErrorResponse'
        '500':
          description: Failed to list abuse report mitigations
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  success:
                    type: boolean
                required:
                - success
      security:
      - api_token: []
      tags:
      - tseng-abuse-complaint-processor_other
      x-api-token-group:
      - Trust and Safety Write
      - Trust and Safety Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: abuse-reports.mitigations
      x-fern-sdk-method-name: list
  /accounts/{account_id}/abuse-reports/{report_id}/mitigations/appeal:
    post:
      operationId: RequestReview
      summary: Request review on mitigations
      description: 'Request a review of mitigations applied because of an abuse report, or submit a report-level appeal.


        - To request a review of specific mitigations, send `appeals` with the mitigation IDs and reasons. Repeating a request for a mitigation with an unresolved appeal is idempotent and returns that mitigation in the in-review state.

        - To submit a report-level appeal, send `type` and, for a `counter_notice`, the counter-notice details in `data`. Report-level appeals are currently available only for DMCA (copyright) reports.'
      parameters:
      - name: account_id
        in: path
        description: Cloudflare Account ID
        required: true
        schema:
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
          maxLength: 32
      - name: report_id
        in: path
        description: Abuse Report ID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/abuse-reports_MitigationAppealRequest'
      responses:
        '200':
          description: Mitigation appeals received, including idempotent replays of unresolved appeals.
