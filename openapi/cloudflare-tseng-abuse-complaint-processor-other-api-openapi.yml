      - name: report_param
        in: path
        description: Public report ID.
        required: true
        schema:
          type: string
        x-fern-parameter-name: report-id
      responses:
        '200':
          description: Abuse report found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_ErrorMessage'
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_Message'
                  result:
                    $ref: '#/components/schemas/abuse-reports_AbuseReport'
