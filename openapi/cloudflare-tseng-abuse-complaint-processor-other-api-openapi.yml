      x-fern-sdk-group-name: abuse-reports
      x-fern-sdk-method-name: get
    post:
      operationId: SubmitAbuseReport
      summary: Submit an abuse report
      description: 'Submit an abuse report of a particular type.


        Requires the abuse-reports entitlement on the account (Enterprise

        accounts have it by default; other accounts must request access) and an

        API token with the `Trust and Safety Write` permission. If the account

        is not entitled, the request is rejected with an HTTP `401` response

        (see below).'
      parameters:
      - name: account_id
        in: path
        description: Cloudflare Account ID
        required: true
        schema:
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
          maxLength: 32
      - name: report_param
        in: path
        description: 'The report type to be submitted. Example: abuse_general'
        required: true
        schema:
          $ref: '#/components/schemas/abuse-reports_SubmissionReportType'
        x-fern-parameter-name: report-type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/abuse-reports_SubmitReportRequest'
      responses:
        '200':
          description: Report submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_SubmitReportResponse'
        '400':
          description: Report submitted with an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_SubmitErrorResponse'
        '401':
          description: 'The request is not authorized to submit abuse reports. Missing or

            invalid credentials may be rejected with the standard Cloudflare API

            authentication error. If credentials are valid, this is most commonly

            because the account does not have the abuse-reports entitlement

            (Enterprise accounts have it by default; other accounts must request

            access), or because the API token is missing the

            `Trust and Safety Write` permission. Entitlement failures

            return the message `Not entitled to use feature: Abuse Report API`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_UnauthorizedErrorResponse'
        '403':
          description: 'Cloudflare''s API layer rejected the request because the API token or

            OAuth grant does not have the required Trust and Safety permission for

            this account. The response uses error code `10000`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_CloudflareAPIErrorResponse'
        '500':
          description: Report submitted with an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/abuse-reports_SubmitErrorResponse'
      security:
      - api_token: []
      tags:
