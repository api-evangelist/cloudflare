        '400':
          description: Report submitted with an error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/abuse-reports_ErrorMessage'
                  messages:
                    type: array
                    items:
