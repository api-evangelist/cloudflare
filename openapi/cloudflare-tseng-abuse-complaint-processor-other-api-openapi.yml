components:
  schemas:
    abuse-reports_NCSEIReport:
      type: object
      allOf:
      - $ref: '#/components/schemas/abuse-reports_BaseReportFields'
      - properties:
          act:
            type: string
            enum:
            - abuse_ncsei
          country:
            description: 'Text not exceeding 255 characters. This field may be released by Cloudflare to third parties such as the Lumen Database (https://lumendatabase.org/).

              '
            type: string
            maxLength: 255
            minLength: 1
          host_notification:
            description: 'Notification type based on the abuse type. NOTE: Copyright (DMCA) and Trademark reports cannot be anonymous.

              '
            type: string
            enum:
            - send
            - send-anon
          ncsei_subject_representation:
            description: If the submitter is the target of NCSEI in the URLs of the abuse report.
            type: boolean
          owner_notification:
            description: 'Notification type based on the abuse type. NOTE: Copyright (DMCA) and Trademark reports cannot be anonymous.

              '
            type: string
            enum:
            - send
            - send-anon
            - none
        required:
        - host_notification
        - ncsei_subject_representation
        - owner_notification
        title: NCSEI Report
        type: object
    abuse-reports_ReportStatus:
      description: An enum value that represents the status of an abuse record
      type: string
      enum:
      - accepted
      - in_review
    abuse-reports_SubmittedAbuseReportStatus:
      description: Status visible to the account that submitted the report.
      type: string
      enum:
      - submitted
      - accepted
