  /accounts/{account_id}/ai-gateway/billing/topup:
    post:
      operationId: aig-billing-create-topup
      summary: Create a top-up
      description: Create a credit top-up for the given account, charged to the account's default payment method.
      parameters:
      - name: account_id
        in: path
        description: Cloudflare account ID.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  description: Top-up amount in cents (min 1000).
                  type: integer
                  example: 5000
                  minimum: 1000
                payment_method_id:
                  description: Stripe PaymentMethod to charge instead of the customer's default payment method.
                  type: string
                  example: pm_123
              additionalProperties: false
              required:
              - amount
      responses:
        '200':
          description: Top-up initiated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aig-billing_CreateTopupResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aig-billing_ErrorResponse'
        '402':
          description: Payment required — the payment method was declined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aig-billing_ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
