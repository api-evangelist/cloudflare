    aig-billing_GetTopupEligibilityResult:
      type: object
      properties:
        account_payment_method_state:
          description: Account-level PM posture derived from the passed-in list.
          type: string
          example: SUPPORTED_PRESENT
          enum:
          - NONE
          - UNSUPPORTED_ONLY
          - SUPPORTED_PRESENT
          - UNKNOWN
        aig_customer_state:
          description: AIG Stripe customer resolution outcome.
          type: string
          example: RESOLVED
          enum:
          - RESOLVED
          - RESOLUTION_FAILED
        aig_default_payment_method_state:
          description: Whether the AIG Stripe customer has a default PM attached.
          type: string
          example: MISSING
          enum:
          - PRESENT
          - MISSING
        display_payment_method:
          description: Card to reference in the UI, e.g. "use card ending 1234".
          type:
          - object
          - 'null'
          properties:
            brand:
              type: string
              example: visa
            last4:
              type: string
              example: '1234'
          required:
          - last4
        eligible:
          description: True only when reason === ELIGIBLE.
          type: boolean
          example: false
        reason:
          description: Canonical (in)eligibility cause. Drives Stratus copy + support triage.
          type: string
          example: ACCOUNT_PAYMENT_METHOD_NOT_LINKED_TO_AIG
          enum:
          - ELIGIBLE
          - NO_ACCOUNT_PAYMENT_METHOD
          - UNSUPPORTED_ACCOUNT_PAYMENT_METHOD
          - ACCOUNT_PAYMENT_METHOD_NOT_DEFAULT
          - ACCOUNT_PAYMENT_METHOD_NOT_LINKED_TO_AIG
          - CONTRACT_BILLING_NOT_SELF_SERVE
          - AIG_CUSTOMER_RESOLUTION_FAILED
          - PENDING_3DS_AUTHENTICATION
          - PAYMENT_AUTHENTICATION_FAILED
        recommended_action:
          description: Machine-readable next step.
          type: string
          example: USE_EXISTING_CARD
          enum:
          - NONE
          - ADD_SUPPORTED_PAYMENT_METHOD
          - USE_EXISTING_CARD
          - SET_CARD_AS_DEFAULT
          - CONTACT_SUPPORT
          - RESUME_AUTHENTICATION
          - RETRY
        recoverable:
          description: Whether the customer can resolve this themselves (vs contact support).
          type: boolean
          example: true
      required:
      - eligible
      - reason
      - recoverable
      - recommended_action
      - account_payment_method_state
      - aig_customer_state
      - aig_default_payment_method_state
      - display_payment_method
