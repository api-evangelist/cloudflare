  /accounts/{account_id}/ai-gateway/billing/usage-history:
    get:
      operationId: aig-billing-get-usage-history
      summary: Get usage history
      description: Retrieve aggregated usage meter event summaries for the given time range.
      parameters:
      - name: account_id
        in: path
        description: Cloudflare account ID.
        required: true
        schema:
          type: string
      - name: value_grouping_window
        in: query
        description: Grouping window for usage data.
        required: true
        schema:
          description: Grouping window for usage data.
          type: string
          example: day
          enum:
          - day
          - hour
      - name: start_time
        in: query
        description: Start time as Unix timestamp in milliseconds.
        schema:
          description: Start time as Unix timestamp in milliseconds.
          type:
          - number
          - 'null'
          example: 1700000000000
      - name: end_time
        in: query
        description: End time as Unix timestamp in milliseconds.
        schema:
          description: End time as Unix timestamp in milliseconds.
          type:
          - number
          - 'null'
          example: 1700086400000
      responses:
        '200':
          description: Usage history retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aig-billing_GetUsageHistoryResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aig-billing_ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aig-billing_ErrorResponse'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aig-billing_ErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - AI Gateway
      x-api-token-group:
      - AI Gateway Write
      - AI Gateway Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.aig
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-ignore: true
      x-fern-sdk-group-name: ai-gateway.billing
      x-fern-sdk-method-name: usage-history
  /accounts/{account_id}/ai/websearch:
    post:
      operationId: workers-ai-ai-gateway-web-search
      summary: Search the web through AI Gateway
      description: Run a web search through a configured AI Gateway.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                byokAlias:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{1,64}$
                limit:
                  type: integer
                  maximum: 10
                  minimum: 1
                options:
                  type: object
                  properties:
                    gateway:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                      required:
                      - id
                  required:
                  - gateway
                provider:
                  type: string
                  maxLength: 1024
                  minLength: 1
                query:
                  minLength: 1
                  type: string
              additionalProperties: false
              required:
              - query
              - options
      responses:
        '200':
          description: Web search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      properties:
                        description:
                          type: string
                        faviconUrl:
                          type: string
                          format: uri
                        imageUrl:
                          type: string
                          format: uri
                        lastModifiedDate:
                          type: string
                          format: date-time
                        title:
                          type: string
                        url:
                          type: string
                          format: uri
                      required:
                      - url
                      - title
                      type: object
                  metadata:
                    type: object
                    properties:
                      latencyMs:
                        type: number
                      query:
                        type: string
                      requestId:
                        type: string
                    required:
                    - query
                    - requestId
                    - latencyMs
                required:
                - items
                - metadata
        '400':
          description: Invalid request or gateway configuration
          content:
            application/json:
              schema:
                anyOf:
                - properties:
                    errors:
                      type: array
                      items:
                        properties:
                          code:
                            type: number
                          message:
                            type: string
                        required:
                        - code
                        - message
                        type: object
                    messages:
                      type: array
                      items: {}
                    result:
                      anyOf:
                      - {}
                      - type: object
                      - {}
                    success:
                      type: boolean
                      enum:
                      - false
                  required:
                  - success
                  - errors
                  - messages
                  - result
                  type: object
                - properties:
                    error:
                      type: object
                      properties:
                        category:
                          type: string
                          enum:
                          - gateway
                          - credential
                          - provider
                          - internal
                        code:
                          type: string
                        gatewayRequestId:
                          type: string
                        retryable:
                          type: boolean
                        status:
                          type: integer
                      required:
                      - category
                      - code
                      - status
                      - retryable
                      - gatewayRequestId
                    ok:
                      type: boolean
                      enum:
                      - false
                  required:
                  - ok
                  - error
                  type: object
        '403':
          description: Web search is not enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      category:
                        type: string
                        enum:
                        - gateway
                        - credential
                        - provider
                        - internal
                      code:
                        type: string
                      gatewayRequestId:
                        type: string
                      retryable:
                        type: boolean
                      status:
                        type: integer
                    required:
                    - category
                    - code
                    - status
                    - retryable
                    - gatewayRequestId
                  ok:
                    type: boolean
                    enum:
                    - false
                required:
                - ok
                - error
        '502':
          description: Web search provider failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      category:
                        type: string
                        enum:
                        - gateway
                        - credential
                        - provider
                        - internal
                      code:
                        type: string
                      gatewayRequestId:
                        type: string
                      retryable:
                        type: boolean
                      status:
                        type: integer
                    required:
                    - category
                    - code
                    - status
                    - retryable
                    - gatewayRequestId
                  ok:
                    type: boolean
                    enum:
                    - false
                required:
                - ok
                - error
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - AI Gateway
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.ai
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: ai
      x-fern-sdk-method-name: websearch
