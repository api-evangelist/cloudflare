                  type: integer
                  example: 10000
                  minimum: 100
                duration:
                  description: Spending limit duration.
                  type: string
                  example: monthly
                  enum:
                  - daily
                  - weekly
                  - monthly
                strategy:
                  description: Spending limit strategy.
                  type: string
                  example: fixed
                  enum:
                  - fixed
                  - sliding
              additionalProperties: false
              required:
              - amount
              - strategy
              - duration
