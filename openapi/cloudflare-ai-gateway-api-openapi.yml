  /accounts/{account_id}/ai-gateway/billing/topup/eligibility:
    post:
      operationId: aig-billing-topup-eligibility
      summary: Get top-up eligibility
      description: Determine whether an account can self-serve a credit top-up, and if not, why. The dashboard forwards the account's payment-method list in the body; the reason logic is owned here.
      parameters:
      - name: account_id
        in: path
        description: Cloudflare account ID.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_methods:
                  description: Account-level payment methods, forwarded by the dashboard.
                  type: array
                  items:
                    properties:
                      default:
                        description: Whether this is the account default payment method.
                        type: boolean
                        example: true
                      last_four:
                        description: Last 4 digits, for display copy only.
                        type: string
                        example: '4242'
                      type:
                        description: 'Payment-method type. Absent or unrecognized is treated as non-card (does not error). Known values: PAYPAL, CREDIT_CARD, APPLE_PAY, GOOGLE_PAY, ACH_DIRECT_DEBIT, SEPA_DEBIT, CASHAPP, LINK, CRYPTO.'
                        type: string
                        example: CREDIT_CARD
                    type: object
                  maxItems: 100
      responses:
        '200':
          description: Eligibility determined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aig-billing_GetTopupEligibilityResponse'
        '400':
