      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-ignore: true
      x-fern-sdk-group-name: ai-gateway.billing.topup
      x-fern-sdk-method-name: create
      x-forge-require-confirmation: This purchases AI Gateway credits and charges the amount to the account's default payment method.
