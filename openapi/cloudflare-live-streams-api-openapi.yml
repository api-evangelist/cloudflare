        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_app_id'
      - name: livestream-session-id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                example-1:
                  value:
                    data:
                      created_at: '2023-07-15T07:08:40.742Z'
                      err_message: null
                      id: cf55a850-c3fd-46b5-b5d2-25b3b9aa1686
