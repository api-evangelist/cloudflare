  /accounts/{account_id}/realtime/kit/{app_id}/meetings/{meeting_id}/active-livestream:
    parameters:
    - name: account_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/realtimekit_account_identifier'
    - name: app_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/realtimekit_app_id'
    - $ref: '#/components/parameters/realtimekit_meeting_id'
    get:
      operationId: get-v2-meetings-meetingId-active-livestream
      summary: Fetch active livestreams for a meeting
      description: Returns details of all active livestreams for the given meeting ID.
      parameters:
      - name: meeting_id
        in: path
        description: ID of the meeting
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
