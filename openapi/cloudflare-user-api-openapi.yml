      summary: Cloudflare Token Details
      description: Get information about a specific token.
      operationId: user-api-tokens-token-details
      parameters:
      - name: token_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/iam_schemas-identifier'
      responses:
        '200':
          description: Token Details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/iam_response_single'
        4XX:
          description: Token Details response failure
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/iam_response_single'
                - $ref: '#/components/schemas/iam_api-response-common-failure'
      security:
      - api_token: []
    put:
      tags:
      - User
      summary: Cloudflare Update Token
      description: Update an existing token.
      operationId: user-api-tokens-update-token
      parameters:
      - name: token_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/iam_schemas-identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/iam_schemas-token'
      responses:
        '200':
          description: Update Token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/iam_response_single'
        4XX:
          description: Update Token response failure
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/iam_response_single'
                - $ref: '#/components/schemas/iam_api-response-common-failure'
      security:
      - api_token: []
  /user/tokens/{token_id}/value:
    put:
      tags:
      - User
      summary: Cloudflare Roll Token
      description: Roll the token secret.
      operationId: user-api-tokens-roll-token
      parameters:
      - name: token_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/iam_schemas-identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Roll Token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/iam_response_single_value'
        4XX:
          description: Roll Token response failure
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/iam_response_single_value'
                - $ref: '#/components/schemas/iam_api-response-common-failure'
      security:
      - api_token: []
  /user/tokens/permission_groups:
    get:
      tags:
      - User
      summary: Cloudflare List Permission Groups
      description: Find all available permission groups.
      operationId: permission-groups-list-permission-groups
      responses:
        '200':
          description: List Permission Groups response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/iam_schemas-response_collection'
        4XX:
          description: List Permission Groups response failure
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/iam_schemas-response_collection'
                - $ref: '#/components/schemas/iam_api-response-common-failure'
      security:
      - api_token: []
  /user/tokens/verify:
    get:
      tags:
      - User
      summary: Cloudflare Verify Token
      description: Test whether a token works.
      operationId: user-api-tokens-verify-token
      responses:
        '200':
          description: Verify Token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/iam_response_single_segment'
        4XX:
          description: Verify Token response failure
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/iam_response_single_segment'
                - $ref: '#/components/schemas/iam_api-response-common-failure'
      security:
      - api_token: []
components:
  schemas:
    bill-subs-api_current_period_end:
      type: string
      format: date-time
      description: The end of the current period and also when the next billing is due.
      example: '2014-03-31T12:20:00Z'
      readOnly: true
    iam_country:
      type: string
      description: The country in which the user lives.
      example: US
      nullable: true
      maxLength: 30
    load-balancing_monitor-editable:
      type: object
      properties:
        allow_insecure:
          $ref: '#/components/schemas/load-balancing_allow_insecure'
        consecutive_down:
          $ref: '#/components/schemas/load-balancing_consecutive_down'
        consecutive_up:
          $ref: '#/components/schemas/load-balancing_consecutive_up'
        description:
          $ref: '#/components/schemas/load-balancing_description'
        expected_body:
          $ref: '#/components/schemas/load-balancing_expected_body'
        expected_codes:
          $ref: '#/components/schemas/load-balancing_expected_codes'
        follow_redirects:
          $ref: '#/components/schemas/load-balancing_follow_redirects'
        header:
          $ref: '#/components/schemas/load-balancing_header'
        interval:
          $ref: '#/components/schemas/load-balancing_interval'
        method:
          $ref: '#/components/schemas/load-balancing_method'
        path:
          $ref: '#/components/schemas/load-balancing_path'
        port:
          $ref: '#/components/schemas/load-balancing_port'
        probe_zone:
          $ref: '#/components/schemas/load-balancing_probe_zone'
        retries:
          $ref: '#/components/schemas/load-balancing_retries'
        timeout:
          $ref: '#/components/schemas/load-balancing_timeout'
        type:
          $ref: '#/components/schemas/load-balancing_type'
    load-balancing_notification_filter:
      type: object
      description: Filter pool and origin health notifications by resource type or health status. Use null to reset.
      example:
        origin:
          disable: true
        pool:
          healthy: false
      nullable: true
      properties:
        origin:
          $ref: '#/components/schemas/load-balancing_filter_options'
        pool:
          $ref: '#/components/schemas/load-balancing_filter_options'
    load-balancing_check_regions:
      type: array
      description: A list of regions from which to run health checks. Null means every Cloudflare data center.
      example:
      - WEU
      - ENAM
      nullable: true
      items:
        type: string
        description: 'WNAM: Western North America, ENAM: Eastern North America, WEU: Western Europe, EEU: Eastern Europe, NSAM: Northern South America, SSAM: Southern South America, OC: Oceania, ME: Middle East, NAF: North Africa, SAF: South Africa, SAS: Southern Asia, SEAS: South East Asia, NEAS: North East Asia, ALL_REGIONS: all regions (ENTERPRISE customers only).'
        enum:
        - WNAM
        - ENAM
        - WEU
        - EEU
        - NSAM
        - SSAM
        - OC
        - ME
        - NAF
        - SAF
        - SAS
        - SEAS
        - NEAS
        - ALL_REGIONS
    iam_permission_group:
      type: object
      description: A named group of permissions that map to a group of operations against resources.
      required:
      - id
      properties:
        id:
          type: string
          description: Identifier of the group.
          example: 6d7f2f5f5b1d4a0e9081fdc98d432fd1
          readOnly: true
        name:
          type: string
          description: Name of the group.
          example: Load Balancers Write
          readOnly: true
    load-balancing_preview_id:
      example: f1aba936b94213e5b8dca0c0dbf1f9cc
    load-balancing_expected_codes:
      type: string
      description: The expected HTTP response code or code range of the health check. This parameter is only valid for HTTP and HTTPS monitors.
      default: '200'
      example: 2xx
    bill-subs-api_component_value:
      type: object
      description: A component value for a subscription.
      properties:
        default:
          type: number
          description: The default amount assigned.
          example: 5
        name:
          type: string
          description: The name of the component value.
          example: page_rules
        price:
          type: number
          description: The unit price for the component value.
          example: 5
        value:
          type: number
          description: The amount of the component value assigned.
          example: 20
    load-balancing_schemas-response_collection:
      allOf:
      - $ref: '#/components/schemas/load-balancing_api-response-collection'
      - properties:
          result:
            type: array
            items:
              $ref: '#/components/schemas/load-balancing_pool'
    load-balancing_schemas-disabled_at:
      type: string
      format: date-time
      description: This field shows up only if the pool is disabled. This field is set with the time the pool was disabled at.
      readOnly: true
    iam_invited_by:
      type: string
      description: The email address of the user who created the invite.
      example: user@example.com
      maxLength: 90
    iam_request_ip:
      type: object
      description: Client IP restrictions.
      example:
        in:
        - 123.123.123.0/24
        - 2606:4700::/32
        not_in:
        - 123.123.123.100/24
        - 2606:4700:4700::/48
      properties:
        in:
          $ref: '#/components/schemas/iam_cidr_list'
        not_in:
          $ref: '#/components/schemas/iam_cidr_list'
    bill-subs-api_rate_plan:
      type: object
      description: The rate plan applied to the subscription.
      properties:
        currency:
          type: string
          description: The currency applied to the rate plan subscription.
          example: USD
        externally_managed:
          type: boolean
          description: Whether this rate plan is managed externally from Cloudflare.
          example: false
        id:
          description: The ID of the rate plan.
          example: free
        is_contract:
          type: boolean
          description: Whether a rate plan is enterprise-based (or newly adopted term contract).
          example: false
        public_name:
          type: string
          description: The full name of the rate plan.
          example: Business Plan
        scope:
          type: string
          description: The scope that this rate plan applies to.
          example: zone
        sets:
          type: array
          description: The list of sets this rate plan applies to.
          items:
            type: string
    legacy-jhs_rule:
      type: object
      required:
      - id
      - mode
      - allowed_modes
      - configuration
      properties:
        allowed_modes:
          type: array
          description: The available actions that a rule can apply to a matched request.
          example:
          - whitelist
          - block
          - challenge
          - js_challenge
          - managed_challenge
          readOnly: true
          items:
            $ref: '#/components/schemas/legacy-jhs_schemas-mode'
        configuration:
          $ref: '#/components/schemas/legacy-jhs_schemas-configuration'
        created_on:
          type: string
          format: date-time
          description: The timestamp of when the rule was created.
          example: '2014-01-01T05:20:00.12345Z'
          readOnly: true
        id:
          $ref: '#/components/schemas/legacy-jhs_rule_components-schemas-identifier'
        mode:
          $ref: '#/components/schemas/legacy-jhs_schemas-mode'
        modified_on:
          type: string
          format: date-time
          description: The timestamp of when the rule was last modified.
          example: '2014-01-01T05:20:00.12345Z'
          readOnly: true
        notes:
          $ref: '#/components/schemas/legacy-jhs_notes'
    iam_collection_organization_response:
      allOf:
      - $ref: '#/components/schemas/iam_api-response-collection'
      - type: object
        properties:
          result:
            type: array
            items:
              $ref: '#/components/schemas/iam_organization'
    iam_telephone:
      type: string
      description: User's telephone number
      example: +1 123-123-1234
      nullable: true
      maxLength: 20
    legacy-jhs_rule_collection_response:
      allOf:
      - $ref: '#/components/schemas/legacy-jhs_api-response-collection'
      - properties:
          result:
            type: array
            items:
              $ref: '#/components/schemas/legacy-jhs_rule'
    iam_user_invite:
      allOf:
      - $ref: '#/components/schemas/iam_base'
      - properties:
          status:
            description: Current status of the invitation.
            enum:
            - pending
            - accepted
            - rejected
            - expired
            example: accepted
    iam_response_collection:
      allOf:
      - $ref: '#/components/schemas/iam_api-response-collection'
      - type: object
        properties:
          result:
            type: array
            items:
              type: object
    load-balancing_health_details:
      allOf:
      - $ref: '#/components/schemas/load-balancing_api-response-single'
      - properties:
          result:
            type: object
            description: A list of regions from which to run health checks. Null means every Cloudflare data center.
            example:
              pool_id: 17b5962d775c646f3f9725cbc7a53df4
              pop_health:
                Amsterdam, NL:
                  healthy: true
                  origins:
                  - 2001:DB8::5:
                      failure_reason: No failures
                      healthy: true
                      response_code: 401
                      rtt: 12.1ms
    iam_components-schemas-name:
      type: string
      description: Role Name.
      example: Organization Admin
      readOnly: true
      maxLength: 120
    load-balancing_monitor-response-collection:
      allOf:
      - $ref: '#/components/schemas/load-balancing_api-response-collection'
      - properties:
          result:
            type: array
            items:
              $ref: '#/components/schemas/load-balancing_monitor'
    iam_api-response-single-id:
      allOf:
      - $ref: '#/components/schemas/iam_api-response-common'
      - properties:
          result:
            type: object
            nullable: true
            required:
            - id
            properties:
              id:
                $ref: '#/components/schemas/iam_common_components-schemas-identifier'
      type: object
    legacy-jhs_api-response-collection:
      allOf:
      - $ref: '#/components/schemas/legacy-jhs_api-response-common'
      - properties:
          result:
            type: array
            nullable: true
            items: {}
          result_info:
            $ref: '#/components/schemas/legacy-jhs_result_info'
      type: object
    iam_modified_on:
      type: string
      format: date-time
      description: Last time the token was modified.
      example: '2018-07-02T05:20:00Z'
      readOnly: true
    load-balancing_address:
      type: string
      description: The IP address (IPv4 or IPv6) of the origin, or its publicly addressable hostname. Hostnames entered here should resolve directly to the origin, and not be a hostname proxied by Cloudflare. To set an internal/reserved address, virtual_network_id must also be set.
      example: 0.0.0.0
    load-balancing_interval:
      type: integer
      description: The interval between each health check. Shorter intervals may improve failover time, but will increase load on the origins as we check from multiple locations.
      default: 60
    load-balancing_schemas-enabled:
      type: boolean
      description: Whether to enable (the default) this origin within the pool. Disabled origins will not receive traffic and are excluded from health checks. The origin will only be disabled for the current pool.
      default: true
      example: true
    iam_condition:
      type: object
      properties:
        request_ip:
          $ref: '#/components/schemas/iam_request_ip'
    load-balancing_expected_body:
      type: string
      description: A case-insensitive sub-string to look for in the response body. If this string is not found, the origin will be marked as unhealthy. This parameter is only valid for HTTP and HTTPS monitors.
      example: alive
    load-balancing_monitor-response-single:
      allOf:
      - $ref: '#/components/schemas/load-balancing_api-response-single'
      - properties:
          result:
            $ref: '#/components/schemas/load-balancing_monitor'
    iam_invite_components-schemas-identifier:
      type: string
      description: Invite identifier tag.
      example: 4f5f0c14a2a41d5063dd301b2f829f04
      readOnly: true
      maxLength: 32
    iam_schemas-invite:
      allOf:
      - $ref: '#/components/schemas/iam_user_invite'
      type: object
    legacy-jhs_api-response-common:
      type: object
      required:
      - success
      - errors
      - messages
      - result
      properties:
        errors:
          $ref: '#/components/schemas/legacy-jhs_messages'
        messages:
          $ref: '#/components/schemas/legacy-jhs_messages'
        result:
          anyOf:
          - type: object
          - type: array
            items: {}
          - type: string
        success:
          type: boolean
          description: Whether the API call was successful
          enum:
          - true
          example: true
    iam_common_components-schemas-identifier:
      type: string
      description: Identifier
      example: 023e105f4ecef8ad9ca31a8372d0c353
      readOnly: true
      maxLength: 32
    iam_single_user_response:
      allOf:
      - $ref: '#/components/schemas/iam_api-response-single'
      - type: object
        properties:
          result:
            type: object
    load-balancing_api-response-single:
      allOf:
      - $ref: '#/components/schemas/load-balancing_api-response-common'
      - properties:
          result:
            anyOf:
            - type: object
              nullable: true
            - type: string
              nullable: true
      type: object
    iam_schemas-response_collection:
      allOf:
      - $ref: '#/components/schemas/iam_api-response-collection'
      - type: object
        properties:
          result:
            type: array
            example:
            - id: 7cf72faf220841aabcfdfab81c43c4f6
              name: Billing Read
              scopes:
              - com.cloudflare.api.account
            - id: 9d24387c6e8544e2bc4024a03991339f
              name: 'Load Balancing: Monitors and Pools Read'
              scopes:
              - com.cloudflare.api.account
            - id: d2a1802cc9a34e30852f8b33869b2f3c
              name: 'Load Balancing: Monitors and Pools Write'
              scopes:
              - com.cloudflare.api.account
            - id: 8b47d2786a534c08a1f94ee8f9f599ef
              name: Workers KV Storage Read
              scopes:
              - com.cloudflare.api.account
            - id: f7f0eda5697f475c90846e879bab8666
              name: Workers KV Storage Write
              scopes:
              - com.cloudflare.api.account
            - id: 1a71c399035b4950a1bd1466bbe4f420
              name: Workers Scripts Read
              scopes:
              - com.cloudflare.api.account
            - id: e086da7e2179491d91ee5f35b3ca210a
              name: Workers Scripts Write
              scopes:
              - com.cloudflare.api.account
            items:
              type: object
    load-balancing_description:
      type: string
      description: Object description.
      example: Login page monitor
    load-balancing_pool:
      type: object
      properties:
        check_regions:
          $ref: '#/components/schemas/load-balancing_check_regions'
        created_on:
          $ref: '#/components/schemas/load-balancing_timestamp'
        description:
          $ref: '#/components/schemas/load-balancing_schemas-description'
        disabled_at:
          $ref: '#/components/schemas/load-balancing_schemas-disabled_at'
        enabled:
          $ref: '#/components/schemas/load-balancing_enabled'
        id:
          $ref: '#/components/schemas/load-balancing_schemas-identifier'
        latitude:
          $ref: '#/components/schemas/load-balancing_latitude'
        load_shedding:
          $ref: '#/components/schemas/load-balancing_load_shedding'
        longitude:
          $ref: '#/components/schemas/load-balancing_longitude'
        minimum_origins:
          $ref: '#/components/schemas/load-balancing_minimum_origins'
        modified_on:
          $ref: '#/components/schemas/load-balancing_timestamp'
        monitor:
          $ref: '#/components/schemas/load-balancing_monitor_id'
        name:
          $ref: '#/components/schemas/load-balancing_name'
        notification_email:
          $ref: '#/components/schemas/load-balancing_notification_email'
        notification_filter:
          $ref: '#/components/schemas/load-balancing_notification_filter'
        origin_steering:
          $ref: '#/components/schemas/load-balancing_origin_steering'
        origins:
          $ref: '#/components/schemas/load-balancing_origins'
    iam_description:
      type: string
      description: Description of role's permissions.
      example: Administrative access to the entire Organization
      readOnly: true
    load-balancing_notification_email:
      type: string
      description: This field is now deprecated. It has been moved to Cloudflare's Centralized Notification service https://developers.cloudflare.com/fundamentals/notifications/. The email address to send health status notifications to. This can be an individual mailbox or a mailing list. Multiple emails can be supplied as a comma delimited list.
      example: someone@example.com,sometwo@example.com
    iam_schemas-token:
      allOf:
      - $ref: '#/components/schemas/iam_token'
    load-balancing_references_response:
      allOf:
      - $ref: '#/components/schemas/load-balancing_api-response-collection'
      - properties:
          result:
            type: array
            description: List of resources that reference a given monitor.
            example:
            - reference_type: referrer
              resource_id: 17b5962d775c646f3f9725cbc7a53df4
              resource_name: primary-dc-1
              resource_type: pool
            items:
              type: object
              properties:
                reference_type:
                  type: string
                  enum:
                  - '*'
                  - referral
                  - referrer
                resource_id:
                  type: string
                resource_name:
                  type: string
                resource_type:
                  type: string
    iam_schemas-name:
      type: string
      description: Organization name.
      example: Cloudflare, Inc.
      maxLength: 100
    legacy-jhs_rule_single_id_response:
      allOf:
      - $ref: '#/components/schemas/legacy-jhs_api-response-single'
      - properties:
          result:
            type: object
            properties:
              id:
                $ref: '#/components/schemas/legacy-jhs_rule_components-schemas-identifier'
    load-balancing_path:
      type: string
      description: The endpoint path you want to conduct a health check against. This parameter is only valid for HTTP and HTTPS monitors.
      default: /
      example: /health
    iam_single_invite_response:
      allOf:
      - $ref: '#/components/schemas/iam_api-response-single'
      - type: object
        properties:
          result:
            type: object
    aaa_audit-logs:
      type: object
      properties:
        action:
          type: object
          properties:
            result:
              type: boolean
              description: A boolean that indicates if the action attempted was successful.
              example: true
            type:
              type: string
              description: A short string that describes the action that was performed.
              example: change_setting
        actor:
          type: object
          properties:
            email:
              type: string
              format: email
              description: The email of the user that performed the action.
              example: michelle@example.com
            id:
              type: string
              description: The ID of the actor that performed the action. If a user performed the action, this will be their User ID.
              example: f6b5de0326bb5182b8a4840ee01ec774
            ip:
              type: string
              description: The IP address of the request that performed the action.
              example: 198.41.129.166
            type:
              type: string
              description: The type of actor, whether a User, Cloudflare Admin, or an Automated System.
              enum:
              - user
              - admin
              - Cloudflare
              example: user
        id:
          type: string
          description: A string that uniquely identifies the audit log.
          example: d5b0f326-1232-4452-8858-1089bd7168ef
        interface:
          type: string
          description: The source of the event.
          example: API
        metadata:
          type: object
          description: An object which can lend more context to the action being logged. This is a flexible value and varies between different actions.
          example:
            name: security_level
            type: firewall
            value: high
            zone_name: example.com
        newValue:
          type: string
          description: The new value of the resource that was modified.
          example: low
        oldValue:
          type: string
          description: The value of the resource before it was modified.
          example: high
        owner:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/aaa_identifier'
        resource:
          type: object
          properties:
            id:
              type: string
              description: An identifier for the resource that was affected by the action.
              example: 023e105f4ecef8ad9ca31a8372d0c353
            type:
              type: string
              description: A short string that describes the resource that was affected by the action.
              example: zone
        when:
          type: string
          format: date-time
          description: A UTC RFC3339 timestamp that specifies when the action being logged occured.
          example: '2017-04-26T17:31:07Z'
    iam_effect:
      type: string
      description: Allow or deny operations against the resources.
      enum:
      - allow
      - deny
      example: allow
    legacy-jhs_country_configuration:
      title: A country configuration.
      properties:
        target:
          description: The configuration target. You must set the target to `country` when specifying a country code in the rule.
          enum:
          - country
          example: country
        value:
          type: string
          description: 'The two-letter ISO-3166-1 alpha-2 code to match. For more information, refer to [IP Access rules: Parameters](https://developers.cloudflare.com/waf/tools/ip-access-rules/parameters/#country).'
          example: US
    load-balancing_name:
      type: string
      description: A short name (tag) for the pool. Only alphanumeric characters, hyphens, and underscores are allowed.
      example: primary-dc-1
    load-balancing_type:
      type: string
      description: The protocol to use for the health check. Currently supported protocols are 'HTTP','HTTPS', 'TCP', 'ICMP-PING', 'UDP-ICMP', and 'SMTP'.
      enum:
      - http
      - https
      - tcp
      - udp_icmp
      - icmp_ping
      - smtp
      default: http
      example: https
    load-balancing_filter_options:
      type: object
      description: Filter options for a particular resource type (pool or origin). Use null to reset.
      nullable: true
      properties:
        disable:
          type: boolean
          description: If set true, disable notifications for this type of resource (pool or origin).
          default: false
        healthy:
          type: boolean
          description: If present, send notifications only for this health status (e.g. false for only DOWN events). Use null to reset (all events).
          nullable: true
    bill-subs-api_subscription:
      allOf:
      - $ref: '#/components/schemas/bill-subs-api_subscription-v2'
      type: object
    load-balancing_preview_result:
      type: object
      description: Resulting health data from a preview operation.
      example:
        abwlnp5jbqn45ecgxd03erbgtxtqai0d:
          healthy: true
          origins:
          - originone.example.com.:
              failure_reason: No failures
              healthy: true
              response_code: 200
              rtt: 66ms
    iam_components-schemas-status:
      type: string
      description: Whether the user is a member of the organization or has an inivitation pending.
      enum:
      - member
      - invited
      example: member
    load-balancing_allow_insecure:
      type: boolean
      description: Do not validate the certificate when monitor use HTTPS. This parameter is currently only valid for HTTP and HTTPS monitors.
      default: false
      example: true
    iam_response_single_segment:
      allOf:
      - $ref: '#/components/schemas/iam_api-response-single'
      - type: object
        properties:
          result:
            required:
            - id
            - status
            properties:
              expires_on:
                $ref: '#/components/schemas/iam_expires_on'
              id:
                $ref: '#/components/schemas/iam_components-schemas-identifier'
              not_before:
                $ref: '#/components/schemas/iam_not_before'
              status:
                $ref: '#/components/schemas/iam_status'
    bill-subs-api_state:
      type: string
      description: The state that the subscription is in.
      enum:
      - Trial
      - Provisioned
      - Paid
      - AwaitingPayment
      - Cancelled
      - Failed
      - Expired
      example: Paid
      readOnly: true
    legacy-jhs_schemas-filters:
      type: object
      properties:
        configuration.target:
          type: string
          description: The target to search in existing rules.
          enum:
          - ip
          - ip_range
          - asn
          - country
          example: ip
        configuration.value:
          type: string
          description: 'The target value to search for in existing rules: an IP address, an IP address range, or a country code, depending on the provided `configuration.target`.

            Notes: You can search for a single IPv4 address, an IP address range with a subnet of ''/16'' or ''/24'', or a two-letter ISO-3166-1 alpha-2 country code.'
          example: 198.51.100.4
        match:
          type: string
          description: When set to `all`, all the search requirements must match. When set to `any`, only one of the search requirements has to match.
          enum:
          - any
          - all
          default: all
        mode:
          $ref: '#/components/schemas/legacy-jhs_schemas-mode'
        notes:
          type: string
          description: 'The string to search for in the notes of existing IP Access rules.

            Notes: For example, the string ''attack'' would match IP Access rules with notes ''Attack 26/02'' and ''Attack 27/02''. The search is case insensitive.'
          example: my note
    load-balancing_until:
      type: string
      format: date-time
      description: End date and time of requesting data period in the ISO8601 format.
      example: '2016-11-11T13:00:00Z'
    legacy-jhs_schemas-configuration:
      oneOf:
      - $ref: '#/components/schemas/legacy-jhs_ip_configuration'
      - $ref: '#/components/schemas/legacy-jhs_ipv6_configuration'
      - $ref: '#/components/schemas/legacy-jhs_cidr_configuration'
      - $ref: '#/components/schemas/legacy-jhs_asn_configuration'
      - $ref: '#/components/schemas/legacy-jhs_country_configuration'
      type: object
      description: The rule configuration.
    load-balancing_load_shedding:
      type: object
      description: Configures load shedding policies and percentages for the pool.
      properties:
        default_percent:
          type: number
          description: The percent of traffic to shed from the pool, according to the default policy. Applies to new sessions and traffic without session affinity.
          default: 0
          minimum: 0
          maximum: 100
        default_policy:
          type: string
          description: The default policy to use when load shedding. A random policy randomly sheds a given percent of requests. A hash policy computes a hash over the CF-Connecting-IP address and sheds all requests originating from a percent of IPs.
          enum:
          - random
          - hash
          default: random
        session_percent:
          type: number
          description: The percent of existing sessions to shed from the pool, according to the session policy.
          default: 0
          minimum: 0
          maximum: 100
        session_policy:
          type: string
          description: Only the hash policy is supported for existing sessions (to avoid exponential decay).
          enum:
          - hash
          default: hash
    load-balancing_port:
      type: integer
      description: 'The port number to connect to for the health check. Required for TCP, UDP, and SMTP checks. HTTP and HTTPS checks should only define the port when using a non-standard port (HTTP: default 80, HTTPS: default 443).'
      default: 0
    iam_permission_groups:
      type: array
      description: A set of permission groups that are specified to the policy.
      example:
      - id: c8fed203ed3043cba015a93ad1616f1f
        name: Zone Read
      - id: 82e64a83756745bbbb1c9c2701bf816b
        name: DNS Read
      items:
        $ref: '#/components/schemas/iam_permission_group'
    load-balancing_latitude:
      type: number
      description: The latitude of the data center containing the origins used in this pool in decimal degrees. If this is set, longitude must also be set.
    load-balancing_retries:
      type: integer
      description: The number of retries to attempt in case of a timeout before marking the origin as unhealthy. Retries are attempted immediately.
      default: 2
    load-balancing_origin_healthy:
      type: boolean
      description: If true, filter events where the origin status is healthy. If false, filter events where the origin status is unhealthy.
      default: true
      example: true
    load-balancing_api-response-common:
      type: object
      required:
      - success
