openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Custom SSL for a Zone API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Custom SSL for a Zone
paths:
  /zones/{zone_id}/custom_certificates:
    get:
      operationId: custom-ssl-for-a-zone-list-ssl-configurations
      summary: List SSL Configurations
      description: List, search, and filter all of your custom SSL certificates. The higher priority will break ties across overlapping 'legacy_custom' certificates, but 'legacy_custom' certificates will always supercede 'sni_custom' certificates.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_identifier'
      - name: page
        in: query
        schema:
          description: Page number of paginated results.
          type: number
          default: 1
          minimum: 1
      - name: per_page
        in: query
        schema:
          description: Number of zones per page.
          type: number
          default: 20
          maximum: 50
          minimum: 5
      - name: match
        in: query
        schema:
          description: Whether to match all search requirements or at least one (any).
          type: string
          default: all
          enum:
          - any
          - all
      - name: status
        in: query
        schema:
          description: Status of the zone's custom SSL.
          type: string
          example: active
          enum:
          - active
          - expired
          - deleted
          - pending
          - initializing
          readOnly: true
      responses:
        '200':
          description: List SSL Configurations response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tls-certificates-and-hostnames_certificate_response_collection'
        4XX:
          description: List SSL Configurations response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_certificate_response_collection'
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Custom SSL for a Zone
      x-api-token-group:
      - 'Access: Mutual TLS Certificates Write'
      - 'Access: Mutual TLS Certificates Read'
      - SSL and Certificates Write
      - SSL and Certificates Read
      x-cfPermissionsRequired:
        enum:
        - '#ssl:read'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: custom-certificates
      x-fern-sdk-method-name: list
      x-forge-hidden: true
    post:
      operationId: custom-ssl-for-a-zone-create-ssl-configuration
      summary: Create SSL Configuration
      description: Upload a new SSL certificate for a zone.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bundle_method:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_bundle_method'
                certificate:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_certificate'
                custom_csr_id:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_custom_csr_id'
                deploy:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_deploy'
                geo_restrictions:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_geo_restrictions'
                policy:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_policy'
                private_key:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_private_key'
                type:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_type'
              required:
              - certificate
      responses:
        '200':
          description: Create SSL Configuration response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tls-certificates-and-hostnames_certificate_response_single'
        4XX:
          description: Create SSL Configuration response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_certificate_response_single'
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Custom SSL for a Zone
      x-api-token-group:
      - 'Access: Mutual TLS Certificates Write'
      - SSL and Certificates Write
      x-cfPermissionsRequired:
        enum:
        - '#ssl:edit'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: custom-certificates
      x-fern-sdk-method-name: create
      x-forge-hidden: true
  /zones/{zone_id}/custom_certificates/prioritize:
    put:
      operationId: custom-ssl-for-a-zone-re-prioritize-ssl-certificates
      summary: Re-prioritize SSL Certificates
      description: If a zone has multiple SSL certificates, you can set the order in which they should be used during a request. The higher priority will break ties across overlapping 'legacy_custom' certificates.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                certificates:
                  description: Array of ordered certificates.
                  type: array
                  items:
                    properties:
                      id:
                        $ref: '#/components/schemas/tls-certificates-and-hostnames_custom_certificate_identifier'
                      priority:
                        $ref: '#/components/schemas/tls-certificates-and-hostnames_priority'
                    type: object
                  example:
                  - id: 5a7805061c76ada191ed06f989cc3dac
                    priority: 2
                  - id: 9a7806061c88ada191ed06f989cc3dac
                    priority: 1
              required:
              - certificates
      responses:
        '200':
          description: Re-prioritize SSL Certificates response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tls-certificates-and-hostnames_certificate_response_collection'
        4XX:
          description: Re-prioritize SSL Certificates response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_certificate_response_collection'
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Custom SSL for a Zone
      x-api-token-group:
      - 'Access: Mutual TLS Certificates Write'
      - SSL and Certificates Write
      x-cfPermissionsRequired:
        enum:
        - '#ssl:edit'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: custom-certificates.prioritize
      x-fern-sdk-method-name: update
      x-forge-hidden: true
  /zones/{zone_id}/custom_certificates/{custom_certificate_id}:
    delete:
      operationId: custom-ssl-for-a-zone-delete-ssl-configuration
      summary: Delete SSL Configuration
      description: Remove a SSL certificate from a zone.
      parameters:
      - name: custom_certificate_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_custom_certificate_identifier'
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_identifier'
      responses:
        '200':
          description: Delete SSL Configuration response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tls-certificates-and-hostnames_certificate_response_id_only'
        4XX:
          description: Delete SSL Configuration response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_certificate_response_id_only'
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Custom SSL for a Zone
      x-api-token-group:
      - 'Access: Mutual TLS Certificates Write'
      - SSL and Certificates Write
      x-cfPermissionsRequired:
        enum:
        - '#ssl:edit'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: custom-certificates
      x-fern-sdk-method-name: delete
      x-forge-hidden: true
    get:
      operationId: custom-ssl-for-a-zone-ssl-configuration-details
      summary: SSL Configuration Details
      description: Retrieves details for a specific custom SSL certificate, including certificate metadata, bundle method, geographic restrictions, and associated keyless server configuration.
      parameters:
      - name: custom_certificate_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_custom_certificate_identifier'
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_identifier'
      responses:
        '200':
          description: SSL Configuration Details response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tls-certificates-and-hostnames_certificate_response_single'
        4XX:
          description: SSL Configuration Details response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_certificate_response_single'
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Custom SSL for a Zone
      x-api-token-group:
      - 'Access: Mutual TLS Certificates Write'
      - 'Access: Mutual TLS Certificates Read'
      - SSL and Certificates Write
      - SSL and Certificates Read
      x-cfPermissionsRequired:
        enum:
        - '#ssl:read'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: custom-certificates
      x-fern-sdk-method-name: get
      x-forge-hidden: true
    patch:
      operationId: custom-ssl-for-a-zone-edit-ssl-configuration
      summary: Edit SSL Configuration
      description: 'Upload a new private key and/or PEM/CRT for the SSL certificate. Note: PATCHing a configuration for sni_custom certificates will result in a new resource id being returned, and the previous one being deleted.'
      parameters:
      - name: custom_certificate_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_custom_certificate_identifier'
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bundle_method:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_bundle_method'
                certificate:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_certificate'
                custom_csr_id:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_custom_csr_id'
                deploy:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_deploy'
                geo_restrictions:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_geo_restrictions'
                policy:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_policy'
                private_key:
                  $ref: '#/components/schemas/tls-certificates-and-hostnames_private_key'
      responses:
        '200':
          description: Edit SSL Configuration response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tls-certificates-and-hostnames_certificate_response_single'
        4XX:
          description: Edit SSL Configuration response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_certificate_response_single'
                - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Custom SSL for a Zone
      x-api-token-group:
      - 'Access: Mutual TLS Certificates Write'
      - SSL and Certificates Write
      x-cfPermissionsRequired:
        enum:
        - '#ssl:edit'
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: custom-certificates
      x-fern-sdk-method-name: edit
      x-forge-hidden: true
components:
  schemas:
    tls-certificates-and-hostnames_port:
      description: The keyless SSL port used to communicate between Cloudflare and the client's Keyless SSL server.
      type: number
      example: 24008
      default: 24008
      maxLength: 65535
      x-auditable: true
    tls-certificates-and-hostnames_enabled:
      description: Whether or not the Keyless SSL is on or off.
      type: boolean
      example: false
      readOnly: true
      x-auditable: true
    tls-certificates-and-hostnames_identifier:
      description: Identifier.
      type: string
      example: 023e105f4ecef8ad9ca31a8372d0c353
      maxLength: 32
      x-auditable: true
    tls-certificates-and-hostnames_expires_on:
      description: When the certificate from the authority expires.
      type: string
      format: date-time
      example: '2016-01-01T05:20:00Z'
      readOnly: true
      x-auditable: true
    tls-certificates-and-hostnames_certificate_response_id_only:
      allOf:
      - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-single'
      - properties:
          result:
            type: object
            properties:
              id:
                $ref: '#/components/schemas/tls-certificates-and-hostnames_custom_certificate_identifier'
        type: object
    tls-certificates-and-hostnames_keyless_private_ip:
      description: Private IP of the Key Server Host.
      type: string
      example: 10.0.0.1
      x-auditable: true
    tls-certificates-and-hostnames_type:
      description: The type 'legacy_custom' enables support for legacy clients which do not include SNI in the TLS handshake.
      type: string
      example: sni_custom
      default: legacy_custom
      enum:
      - legacy_custom
      - sni_custom
      x-auditable: true
    tls-certificates-and-hostnames_messages:
      type: array
      items:
        properties:
          code:
            type: integer
            minimum: 1000
          documentation_url:
            type: string
          message:
            type: string
          source:
            type: object
            properties:
              pointer:
                type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      example: []
    tls-certificates-and-hostnames_priority:
      description: The order/priority in which the certificate will be used in a request. The higher priority will break ties across overlapping 'legacy_custom' certificates, but 'legacy_custom' certificates will always supercede 'sni_custom' certificates.
      type: number
      example: 1
      default: 0
      x-auditable: true
    tls-certificates-and-hostnames_api-response-collection:
      type: object
      allOf:
      - $ref: '#/components/schemas/tls-certificates-and-hostnames_api-response-common'
      - properties:
          result_info:
            type: object
            properties:
              count:
                description: Total number of results for the requested service.
                type: number
                example: 1
              page:
                description: Current page within paginated list of results.
                type: number
                example: 1
              per_page:
                description: Number of results per page of results.
                type: number
                example: 20
              total_count:
                description: Total results available without any search parameters.
                type: number
                example: 2000
              total_pages:
                description: The number of total pages in the entire result set.
                type: number
                example: 100
        type: object
    tls-certificates-and-hostnames_policy:
      description: 'Specify the policy that determines the region where your private key will be held locally. HTTPS connections to any excluded data center will still be fully encrypted, but will incur some latency while Keyless SSL is used to complete the handshake with the nearest allowed data center. Any combination of countries, specified by their two letter country code (https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2#Officially_assigned_code_elements) can be chosen, such as ''country: IN'', as well as ''region: EU'' which refers to the EU region. If there are too few data centers satisfying the policy, it will be rejected.

        Note: The API accepts this field as either "policy" or "policy_restrictions" in requests. Responses return this field as "policy_restrictions".'
      type: string
      example: '(country: US) or (region: EU)'
      x-auditable: true
    tls-certificates-and-hostnames_api-response-common-failure:
      type: object
      properties:
        errors:
          example:
          - code: 7003
            message: No route for the URI
          allOf:
          - $ref: '#/components/schemas/tls-certificates-and-hostnames_messages'
          minLength: 1
        messages:
          example: []
          allOf:
          - $ref: '#/components/schemas/tls-certificates-and-hostnames_messages'
        result:
          type:
          - object
          - 'null'
          enum:
          - null
        success:
          description: Whether the API call was successful.
          type: boolean
          example: false
          enum:
          - false
      required:
      - success
      - errors
      - messages
      - result
    tls-certificates-and-hostnames_private_key:
      description: The zone's private key. Not required if custom_csr_id is provided, in which case the private key is retrieved from the CSR record held by Cloudflare.
      type: string
      example: '-----BEGIN RSA PRIVATE KEY-----

        MIIEowIBAAKCAQEAwQHoetcl9+5ikGzV6cMzWtWPJHqXT3wpbEkRU9Yz7lgvddmG

        dtcGbg/1CGZu0jJGkMoppoUo4c3dts3iwqRYmBikUP77wwY2QGmDZw2FvkJCJlKn

        abIRuGvBKwzESIXgKk2016aTP6/dAjEHyo6SeoK8lkIySUvK0fyOVlsiEsCmOpid

        tnKX/a+50GjB79CJH4ER2lLVZnhePFR/zUOyPxZQQ4naHf7yu/b5jhO0f8fwt+py

