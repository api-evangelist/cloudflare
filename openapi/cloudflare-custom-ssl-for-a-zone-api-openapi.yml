        mEbeqyLOP4Z4qSOcmghZBSECgYACvR9Xs0DGn+wCsW4vze/2ei77MD4OQvepPIFX

        dFZtlBy5ADcgE9z0cuVB6CiL8DbdK5kwY9pGNr8HUCI03iHkW6Zs+0L0YmihfEVe

        PG19PSzK9CaDdhD9KFZSbLyVFmWfxOt50H7YRTTiPMgjyFpfi5j2q348yVT0tEQS

        fhRqaQKBgAcWPokmJ7EbYQGeMbS7HC8eWO/RyamlnSffdCdSc7ue3zdVJxpAkQ8W

        qu80pEIF6raIQfAf8MXiiZ7auFOSnHQTXUbhCpvDLKi0Mwq3G8Pl07l+2s6dQG6T

        lv6XTQaMyf6n1yjzL+fzDrH3qXMxHMO/b13EePXpDMpY7HQpoLDi

        -----END RSA PRIVATE KEY-----

        '
      x-sensitive: true
    tls-certificates-and-hostnames_geo_restrictions:
      description: Specify the region where your private key can be held locally for optimal TLS performance. HTTPS connections to any excluded data center will still be fully encrypted, but will incur some latency while Keyless SSL is used to complete the handshake with the nearest allowed data center. Options allow distribution to only to U.S. data centers, only to E.U. data centers, or only to highest security data centers. Default distribution is to all Cloudflare datacenters, for optimal performance.
      type: object
      properties:
        label:
          type: string
          example: us
          enum:
          - us
          - eu
          - highest_security
          x-auditable: true
    tls-certificates-and-hostnames_custom_csr_id:
      description: The identifier for the Custom CSR that was used.
      type: string
      example: 7b163417-1d2b-4c84-a38a-2fb7a0cd7752
      x-auditable: true
    tls-certificates-and-hostnames_hosts:
      type: array
      items:
        description: The valid hosts for the certificates.
        example: example.com
        maxLength: 253
        readOnly: true
        type: string
        x-auditable: true
    tls-certificates-and-hostnames_keyless_tunnel:
      description: Configuration for using Keyless SSL through a Cloudflare Tunnel.
      type: object
      properties:
        private_ip:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_keyless_private_ip'
        vnet_id:
          $ref: '#/components/schemas/tls-certificates-and-hostnames_keyless_vnet_id'
      required:
      - private_ip
      - vnet_id
    tls-certificates-and-hostnames_keyless-certificate:
      type: object
      allOf:
      - $ref: '#/components/schemas/tls-certificates-and-hostnames_base'
    tls-certificates-and-hostnames_name:
      description: The keyless SSL name.
      type: string
      example: example.com Keyless SSL
      maxLength: 180
      readOnly: true
      x-auditable: true
    tls-certificates-and-hostnames_keyless_certificate_identifier:
      description: Keyless certificate identifier tag.
      type: string
      example: 4d2844d2ce78891c34d0b6c0535a291e
      maxLength: 32
      readOnly: true
      x-auditable: true
    tls-certificates-and-hostnames_policy_restrictions:
      description: 'The policy restrictions returned by the API. This field is returned in responses

        when a policy has been set. The API accepts the "policy" field in requests but

        returns this field as "policy_restrictions" in responses.


        Specifies the region(s) where your private key can be held locally for optimal

        TLS performance. Format is a boolean expression, for example:

        "(country: US) or (region: EU)"

        '
      type: string
      example: '(country: US) or (region: EU)'
      readOnly: true
