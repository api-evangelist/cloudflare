openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Zero Trust Gateway rules API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Zero Trust Gateway rules
paths:
  /accounts/{account_id}/gateway/rules:
    get:
      operationId: zero-trust-gateway-rules-list-zero-trust-gateway-rules
      summary: List Zero Trust Gateway rules
      description: List Zero Trust Gateway rules for an account.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_identifier-2'
      - name: filter
        in: query
        description: 'Filter the returned rules by one or more `field:value` pairs. Repeat the

          parameter to combine filters with logical AND.


          Supported fields are `name`, `id`, `action`, `enabled`, `source_account`,

          `is_shared`, `filters`, and `expression` (max 1024 bytes). The `source_account`

          value is matched as a normalized UUID substring. The `filters` value must

          be one of the rule filter names and matches a member of the rule''s `filters`

          array. The `expression` filter performs a case-insensitive literal

          substring match across traffic, identity, and device posture expressions.'
        schema:
          type: array
          items:
            anyOf:
            - pattern: ^name:.*$
              type: string
            - pattern: ^id:.*$
              type: string
            - pattern: ^action:(on|off|allow|block|scan|noscan|safesearch|ytrestricted|isolate|noisolate|override|l4_override|audit_ssh|egress|resolve|quarantine|redirect|custom)$
              type: string
            - pattern: ^enabled:(true|false)$
              type: string
            - pattern: ^source_account:.*$
              type: string
            - pattern: ^is_shared:(true|false)$
              type: string
            - pattern: ^filters:(http|dns|dns_resolver|l4|egress)$
              type: string
            - pattern: ^expression:.*$
              type: string
            type: string
        explode: true
        style: form
      - name: search
        in: query
        description: Case-insensitive substring search across rule name and description.
        schema:
          type: string
      - name: order_by
        in: query
        description: 'Field to sort the returned rules by. Supported values are `name`,

          `created_at`, `updated_at`, and `precedence`.'
        schema:
          type: string
          enum:
          - name
          - created_at
          - updated_at
          - precedence
      - name: direction
        in: query
        description: 'Sort direction. When `order_by` is omitted, this controls the direction

          of the existing precedence ordering. Shared rules remain first in either

          direction. Accepted values are `asc` and `desc`.'
        schema:
          type: string
          enum:
          - asc
          - desc
      responses:
        '200':
          description: List Zero Trust Gateway rules response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zero-trust-gateway_response_collection-6'
        4XX:
          description: List Zero Trust Gateway rules response failure.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                - $ref: '#/components/schemas/zero-trust-gateway_response_collection-6'
                - $ref: '#/components/schemas/zero-trust-gateway_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Zero Trust Gateway rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.gateway.rules
      x-fern-sdk-method-name: list
    patch:
      operationId: zero-trust-gateway-rules-patch-multiple-zero-trust-gateway-rules
      summary: Patch multiple Zero Trust Gateway rules
      description: Update select fields of multiple Zero Trust Gateway rules in a single request. This is commonly used to reorder rules by updating their precedence values. Only the fields provided for each rule are updated.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_identifier-2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                properties:
                  description:
                    $ref: '#/components/schemas/zero-trust-gateway_description-2'
                  enabled:
                    $ref: '#/components/schemas/zero-trust-gateway_enabled'
                  id:
                    $ref: '#/components/schemas/zero-trust-gateway_uuid-4'
                  name:
                    $ref: '#/components/schemas/zero-trust-gateway_name-3'
                  precedence:
                    $ref: '#/components/schemas/zero-trust-gateway_precedence'
                required:
                - id
                type: object
      responses:
        '200':
          description: Patch multiple Zero Trust Gateway rules response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zero-trust-gateway_response_collection-6'
        4XX:
          description: Patch multiple Zero Trust Gateway rules response failure.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/zero-trust-gateway_response_collection-6'
                - $ref: '#/components/schemas/zero-trust-gateway_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Zero Trust Gateway rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.gateway.rules
      x-fern-sdk-method-name: bulk-edit
      x-forge-hidden: true
    post:
      operationId: zero-trust-gateway-rules-create-zero-trust-gateway-rule
      summary: Create a Zero Trust Gateway rule
      description: Create a new Zero Trust Gateway rule.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_identifier-2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  $ref: '#/components/schemas/zero-trust-gateway_action'
                description:
                  $ref: '#/components/schemas/zero-trust-gateway_description-2'
                device_posture:
                  $ref: '#/components/schemas/zero-trust-gateway_device_posture'
                enabled:
                  $ref: '#/components/schemas/zero-trust-gateway_enabled'
                expiration:
                  $ref: '#/components/schemas/zero-trust-gateway_expiration'
                filters:
                  $ref: '#/components/schemas/zero-trust-gateway_filters'
                identity:
                  $ref: '#/components/schemas/zero-trust-gateway_identity'
                name:
                  $ref: '#/components/schemas/zero-trust-gateway_name-3'
                precedence:
                  $ref: '#/components/schemas/zero-trust-gateway_precedence'
                rule_settings:
                  $ref: '#/components/schemas/zero-trust-gateway_rule-settings'
                schedule:
                  $ref: '#/components/schemas/zero-trust-gateway_schedule'
                traffic:
                  $ref: '#/components/schemas/zero-trust-gateway_traffic'
              required:
              - name
              - action
      responses:
        '200':
          description: Create a Zero Trust Gateway rule response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zero-trust-gateway_single_response-4'
        4XX:
          description: Create a Zero Trust Gateway rule response failure.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                - $ref: '#/components/schemas/zero-trust-gateway_single_response-4'
                - $ref: '#/components/schemas/zero-trust-gateway_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Zero Trust Gateway rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.gateway.rules
      x-fern-sdk-method-name: create
  /accounts/{account_id}/gateway/rules/tenant:
    get:
      operationId: zero-trust-gateway-rules-list-zero-trust-gateway-rules-tenant
      summary: List Zero Trust Gateway rules inherited from the parent account
      description: List Zero Trust Gateway rules for the parent account of an account in the MSP configuration.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_identifier-2'
      responses:
        '200':
          description: List Zero Trust Gateway rules response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zero-trust-gateway_response_collection-6'
        4XX:
          description: List Zero Trust Gateway rules response failure.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                - $ref: '#/components/schemas/zero-trust-gateway_response_collection-6'
                - $ref: '#/components/schemas/zero-trust-gateway_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Zero Trust Gateway rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.gateway.rules
      x-fern-sdk-method-name: list-tenant
  /accounts/{account_id}/gateway/rules/{rule_id}:
    delete:
      operationId: zero-trust-gateway-rules-delete-zero-trust-gateway-rule
      summary: Delete a Zero Trust Gateway rule
      description: Delete a Zero Trust Gateway rule.
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_uuid-4'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_identifier-2'
      responses:
        '200':
          description: Delete a Zero Trust Gateway rule response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zero-trust-gateway_empty_response'
        4XX:
          description: Delete a Zero Trust Gateway rule response failure.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/zero-trust-gateway_empty_response'
                - $ref: '#/components/schemas/zero-trust-gateway_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Zero Trust Gateway rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.gateway.rules
      x-fern-sdk-method-name: delete
    get:
      operationId: zero-trust-gateway-rules-zero-trust-gateway-rule-details
      summary: Get Zero Trust Gateway rule details
      description: Get a single Zero Trust Gateway rule.
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_uuid-4'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_identifier-2'
      responses:
        '200':
          description: Get Zero Trust Gateway rule details response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zero-trust-gateway_single_response-4'
        4XX:
          description: Get Zero Trust Gateway rule details response failure.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                - $ref: '#/components/schemas/zero-trust-gateway_single_response-4'
                - $ref: '#/components/schemas/zero-trust-gateway_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Zero Trust Gateway rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.gateway.rules
      x-fern-sdk-method-name: get
    patch:
      operationId: zero-trust-gateway-rules-patch-zero-trust-gateway-rule
      summary: Patch a Zero Trust Gateway rule
      description: Update select fields of an existing Zero Trust Gateway rule. Only the fields provided in the request body are updated. This endpoint supports a limited subset of fields (`name`, `description`, `precedence`, `enabled`). To update other fields such as `action`, `traffic`, `identity`, `device_posture`, `rule_settings`, `schedule`, or `expiration`, use the PUT endpoint for a full rule replacement.
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_uuid-4'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_identifier-2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  $ref: '#/components/schemas/zero-trust-gateway_description-2'
                enabled:
                  $ref: '#/components/schemas/zero-trust-gateway_enabled'
                name:
                  $ref: '#/components/schemas/zero-trust-gateway_name-3'
                precedence:
                  $ref: '#/components/schemas/zero-trust-gateway_precedence'
      responses:
        '200':
          description: Patch a Zero Trust Gateway rule response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zero-trust-gateway_single_response-4'
        4XX:
          description: Patch a Zero Trust Gateway rule response failure.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/zero-trust-gateway_single_response-4'
                - $ref: '#/components/schemas/zero-trust-gateway_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Zero Trust Gateway rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.gateway.rules
      x-fern-sdk-method-name: edit
      x-forge-hidden: true
    put:
      operationId: zero-trust-gateway-rules-update-zero-trust-gateway-rule
      summary: Update a Zero Trust Gateway rule
      description: Update a configured Zero Trust Gateway rule.
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_uuid-4'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_identifier-2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  $ref: '#/components/schemas/zero-trust-gateway_action'
                description:
                  $ref: '#/components/schemas/zero-trust-gateway_description-2'
                device_posture:
                  $ref: '#/components/schemas/zero-trust-gateway_device_posture'
                enabled:
                  $ref: '#/components/schemas/zero-trust-gateway_enabled'
                expiration:
                  $ref: '#/components/schemas/zero-trust-gateway_expiration'
                filters:
                  $ref: '#/components/schemas/zero-trust-gateway_filters'
                identity:
                  $ref: '#/components/schemas/zero-trust-gateway_identity'
                name:
                  $ref: '#/components/schemas/zero-trust-gateway_name-3'
                precedence:
                  $ref: '#/components/schemas/zero-trust-gateway_precedence'
                rule_settings:
                  $ref: '#/components/schemas/zero-trust-gateway_rule-settings'
                schedule:
                  $ref: '#/components/schemas/zero-trust-gateway_schedule'
                traffic:
                  $ref: '#/components/schemas/zero-trust-gateway_traffic'
              required:
              - name
              - action
      responses:
        '200':
          description: Update a Zero Trust Gateway rule response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zero-trust-gateway_single_response-4'
        4XX:
          description: Update a Zero Trust Gateway rule response failure.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                - $ref: '#/components/schemas/zero-trust-gateway_single_response-4'
                - $ref: '#/components/schemas/zero-trust-gateway_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Zero Trust Gateway rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.gateway.rules
      x-fern-sdk-method-name: update
  /accounts/{account_id}/gateway/rules/{rule_id}/reset_expiration:
    post:
      operationId: zero-trust-gateway-rules-reset-expiration-zero-trust-gateway-rule
      summary: Reset the expiration of a Zero Trust Gateway Rule
      description: Resets the expiration of a Zero Trust Gateway Rule if its duration elapsed and it has a default duration. The Zero Trust Gateway Rule must have values for both `expiration.expires_at` and `expiration.duration`.
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_uuid-4'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/zero-trust-gateway_identifier-2'
      responses:
        '200':
          description: Reset the expiration of a Zero Trust Gateway rule response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zero-trust-gateway_single_response-4'
        4XX:
          description: Reset the expiration of a Zero Trust Gateway rule response failure.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/zero-trust-gateway_single_response-4'
                - $ref: '#/components/schemas/zero-trust-gateway_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - Zero Trust Gateway rules
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.gateway.rules
      x-fern-sdk-method-name: reset-expiration
components:
  schemas:
    zero-trust-gateway_response_collection-6:
      type: object
      allOf:
      - $ref: '#/components/schemas/zero-trust-gateway_api-response-collection'
      - properties:
          result:
            type: array
            items:
              $ref: '#/components/schemas/zero-trust-gateway_rules'
        type: object
    zero-trust-gateway_warning_status:
      description: Indicate a warning for a misconfigured rule, if any.
      type:
      - string
      - 'null'
      readOnly: true
      x-stainless-terraform-configurability: computed
    zero-trust-gateway_schedule:
      description: Defines the schedule for activating DNS policies. Settable only for `dns` and `dns_resolver` rules.
      type:
      - object
      - 'null'
      properties:
        fri:
          description: Specify the time intervals when the rule is active on Fridays, in the increasing order from 00:00-24:00.  If this parameter omitted, the rule is deactivated on Fridays. API returns a formatted version of this string, which may cause Terraform drift if a unformatted value is used.
          type: string
          example: 08:00-12:30,13:30-17:00
          x-auditable: true
        mon:
          description: Specify the time intervals when the rule is active on Mondays, in the increasing order from 00:00-24:00(capped at maximum of 6 time splits). If this parameter omitted, the rule is deactivated on Mondays. API returns a formatted version of this string, which may cause Terraform drift if a unformatted value is used.
          type: string
          example: 08:00-12:30,13:30-17:00
          x-auditable: true
        sat:
          description: Specify the time intervals when the rule is active on Saturdays, in the increasing order from 00:00-24:00.  If this parameter omitted, the rule is deactivated on Saturdays. API returns a formatted version of this string, which may cause Terraform drift if a unformatted value is used.
          type: string
          example: 08:00-12:30,13:30-17:00
          x-auditable: true
        sun:
          description: Specify the time intervals when the rule is active on Sundays, in the increasing order from 00:00-24:00. If this parameter omitted, the rule is deactivated on Sundays. API returns a formatted version of this string, which may cause Terraform drift if a unformatted value is used.
          type: string
          example: 08:00-12:30,13:30-17:00
          x-auditable: true
        thu:
          description: Specify the time intervals when the rule is active on Thursdays, in the increasing order from 00:00-24:00. If this parameter omitted, the rule is deactivated on Thursdays. API returns a formatted version of this string, which may cause Terraform drift if a unformatted value is used.
          type: string
          example: 08:00-12:30,13:30-17:00
          x-auditable: true
        time_zone:
          description: Specify the time zone for rule evaluation. When a [valid time zone city name](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List) is provided, Gateway always uses the current time for that time zone. When this parameter is omitted, Gateway uses the time zone determined from the user's IP address. Colo time zone is used when the user's IP address does not resolve to a location.
          type: string
          example: America/New York
          x-auditable: true
        tue:
          description: Specify the time intervals when the rule is active on Tuesdays, in the increasing order from 00:00-24:00. If this parameter omitted, the rule is deactivated on Tuesdays. API returns a formatted version of this string, which may cause Terraform drift if a unformatted value is used.
          type: string
          example: 08:00-12:30,13:30-17:00
          x-auditable: true
        wed:
          description: Specify the time intervals when the rule is active on Wednesdays, in the increasing order from 00:00-24:00. If this parameter omitted, the rule is deactivated on Wednesdays. API returns a formatted version of this string, which may cause Terraform drift if a unformatted value is used.
          type: string
          example: 08:00-12:30,13:30-17:00
          x-auditable: true
      x-stainless-terraform-configurability: computed_optional
    zero-trust-gateway_result_info:
      type: object
      properties:
        count:
          description: Indicate the total number of results for the requested service.
          type: number
          example: 1
        page:
          description: Indicate the current page within a paginated list of results.
          type: number
          example: 1
        per_page:
          description: Indicate the number of results per page.
          type: number
          example: 20
        total_count:
          description: Indicate the total results available without any search parameters.
          type: number
          example: 2000
    zero-trust-gateway_identifier-2:
      description: Specify the Cloudflare account identifier.
      type: string
      example: 699d98642c564d2e855e9661899b7252
      x-auditable: true
    zero-trust-gateway_version:
      description: Indicate the version number of the rule(read-only).
      type: integer
      example: 1
      readOnly: true
      x-auditable: true
      x-stainless-terraform-configurability: computed
    zero-trust-gateway_empty_response:
      type: object
      allOf:
      - $ref: '#/components/schemas/zero-trust-gateway_api-response-single'
      - properties:
          result:
            type: object
        type: object
    zero-trust-gateway_description-2:
      description: Specify the rule description.
      type: string
      example: Block bad websites based on their host name.
      x-auditable: true
    zero-trust-gateway_filters:
      description: Specify the protocol or layer to evaluate the traffic, identity, and device posture expressions. Can only contain a single value.
      type: array
      items:
        description: Specify the protocol or layer to use.
        enum:
        - http
        - dns
        - l4
        - egress
        - dns_resolver
        example: http
        type: string
        x-auditable: true
      example:
      - http
      maxItems: 1
      minItems: 1
    zero-trust-gateway_dns_resolver_settings_v4:
      type: object
      properties:
        ip:
          description: Specify the IPv4 address of the upstream resolver.
          type: string
          example: 2.2.2.2
          x-auditable: true
        port:
          description: Specify a port number to use for the upstream resolver. Defaults to 53 if unspecified.
          type: integer
          example: 5053
          x-auditable: true
        route_through_private_network:
          description: Indicate whether to connect to this resolver over a private network. Must set when vnet_id set.
          type: boolean
          example: true
          x-auditable: true
        vnet_id:
          description: Specify an optional virtual network for this resolver. Uses default virtual network id if omitted.
          type: string
          example: f174e90a-fafe-4643-bbbc-4a0ed4fc8415
          x-auditable: true
      required:
      - ip
      x-stainless-terraform-configurability: computed_optional
    zero-trust-gateway_api-response-common-failure:
      type: object
      properties:
        errors:
          type: object
          example:
          - code: 7003
            message: No route for the URI
          allOf:
          - $ref: '#/components/schemas/zero-trust-gateway_messages'
          minLength: 1
        messages:
          type: object
          example: []
          allOf:
          - $ref: '#/components/schemas/zero-trust-gateway_messages'
        result:
          type:
          - object
          - 'null'
          enum:
          - null
        success:
          description: Indicate whether the API call was successful.
          type: boolean
          example: false
          enum:
          - false
      required:
      - success
      - errors
      - messages
      - result
    zero-trust-gateway_enabled:
      description: Specify whether the rule is enabled.
      type: boolean
