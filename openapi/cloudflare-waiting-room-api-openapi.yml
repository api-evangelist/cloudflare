      description: 'Which Turnstile widget type to use for detecting bot traffic. See

        [the Turnstile documentation](https://developers.cloudflare.com/turnstile/concepts/widget/#widget-types)

        for the definitions of these widget types. Set to `off` to disable the

        Turnstile integration entirely. Setting this to anything other than

        `off` or `invisible` requires Advanced Waiting Room.

        '
      type: string
      default: invisible
      enum:
      - 'off'
      - invisible
      - visible_non_interactive
      - visible_managed
      x-auditable: true
    waitingroom_identifier:
      description: Identifier.
      type: string
      example: 023e105f4ecef8ad9ca31a8372d0c353
      maxLength: 32
      x-auditable: true
    waitingroom_event_session_duration:
      description: If set, the event will override the waiting room's `session_duration` property while it is active. If null, the event will inherit it.
      type:
      - integer
      - 'null'
      maximum: 30
      minimum: 1
      x-auditable: true
    waitingroom_next_event_prequeue_start_time:
      description: An ISO 8601 timestamp that marks when the next event will begin queueing.
      type:
      - string
      - 'null'
      example: '2021-09-28T15:00:00Z'
      x-auditable: true
    waitingroom_description:
      description: A note that you can use to add more details about the waiting room.
      type: string
      example: Production - DO NOT MODIFY
      default: ''
      x-auditable: true
    waitingroom_api-response-single:
      type: object
      allOf:
      - $ref: '#/components/schemas/waitingroom_api-response-common'
      - properties:
          result:
            type: object
            oneOf:
            - type: object
            - type: string
        type: object
    waitingroom_event_new_users_per_minute:
      description: If set, the event will override the waiting room's `new_users_per_minute` property while it is active. If null, the event will inherit it. This can only be set if the event's `total_active_users` property is also set.
      type:
      - integer
