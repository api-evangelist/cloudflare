      default: ''
      x-auditable: true
    waitingroom_custom_page_html:
      description: 'Only available for the Waiting Room Advanced subscription. This is a template html file that will be rendered at the edge. If no custom_page_html is provided, the default waiting room will be used. The template is based on mustache ( https://mustache.github.io/ ). There are several variables that are evaluated by the Cloudflare edge:

        1. {{`waitTimeKnown`}} Acts like a boolean value that indicates the behavior to take when wait time is not available, for instance when queue_all is **true**.

        2. {{`waitTimeFormatted`}} Estimated wait time for the user. For example, five minutes. Alternatively, you can use:

        3. {{`waitTime`}} Number of minutes of estimated wait for a user.

        4. {{`waitTimeHours`}} Number of hours of estimated wait for a user (`Math.floor(waitTime/60)`).

        5. {{`waitTimeHourMinutes`}} Number of minutes above the `waitTimeHours` value (`waitTime%60`).

        6. {{`queueIsFull`}} Changes to **true** when no more people can be added to the queue.


        To view the full list of variables, look at the `cfWaitingRoom` object described under the `json_response_enabled` property in other Waiting Room API calls.'
      type: string
      example: '{{#waitTimeKnown}} {{waitTime}} mins {{/waitTimeKnown}} {{^waitTimeKnown}} Queue all enabled {{/waitTimeKnown}}'
      default: ''
      x-auditable: true
    waitingroom_path:
      description: Sets the path within the host to enable the waiting room on. The waiting room will be enabled for all subpaths as well. If there are two waiting rooms on the same subpath, the waiting room for the most specific path will be chosen. Wildcards and query parameters are not supported.
      type: string
      example: /shop/checkout
      default: /
      x-auditable: true
    waitingroom_create_rule:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/waitingroom_rule_action'
        description:
          $ref: '#/components/schemas/waitingroom_rule_description'
        enabled:
          $ref: '#/components/schemas/waitingroom_rule_enabled'
        expression:
          $ref: '#/components/schemas/waitingroom_rule_expression'
      required:
      - action
      - expression
    waitingroom_preview_response:
      type: object
      allOf:
      - $ref: '#/components/schemas/waitingroom_api-response-single'
      - properties:
          result:
            type: object
            properties:
              preview_url:
                $ref: '#/components/schemas/waitingroom_preview_url'
        type: object
    waitingroom_event_name:
      description: A unique name to identify the event. Only alphanumeric characters, hyphens and underscores are allowed.
      type: string
      example: production_webinar_event
      x-auditable: true
    waitingroom_zone_settings:
      type: object
      properties:
        search_engine_crawler_bypass:
          $ref: '#/components/schemas/waitingroom_search_engine_crawler_bypass'
    waitingroom_event_description:
      description: A note that you can use to add more details about the event.
      type: string
      example: Production event - DO NOT MODIFY
      default: ''
      x-auditable: true
    waitingroom_event_turnstile_mode:
      description: If set, the event will override the waiting room's `turnstile_mode` property while it is active. If null, the event will inherit it.
      type:
      - string
      - 'null'
      enum:
      - 'off'
      - invisible
      - visible_non_interactive
      - visible_managed
      x-auditable: true
    waitingroom_event_prequeue_start_time:
      description: An ISO 8601 timestamp that marks when to begin queueing all users before the event starts. The prequeue must start at least five minutes before `event_start_time`.
      type:
      - string
      - 'null'
      example: '2021-09-28T15:00:00Z'
      x-auditable: true
    waitingroom_rule_version:
      description: The version of the rule.
      type: string
      example: '1'
      x-auditable: true
    waitingroom_new_users_per_minute:
      description: Sets the number of new users that will be let into the route every minute. This value is used as baseline for the number of users that are let in per minute. So it is possible that there is a little more or little less traffic coming to the route based on the traffic patterns at that time around the world.
      type: integer
      maximum: 2147483647
      minimum: 200
      x-auditable: true
    waitingroom_event_details_session_duration:
      type: integer
      x-auditable: true
    waitingroom_total_active_users:
      description: Sets the total number of active user sessions on the route at a point in time. A route is a combination of host and path on which a waiting room is available. This value is used as a baseline for the total number of active user sessions on the route. It is possible to have a situation where there are more or less active users sessions on the route based on the traffic patterns at that time around the world.
      type: integer
      maximum: 2147483647
      minimum: 200
      x-auditable: true
    waitingroom_rule_action:
      description: The action to take when the expression matches.
      type: string
      example: bypass_waiting_room
      enum:
      - bypass_waiting_room
      x-auditable: true
    waitingroom_update_rules:
      type: array
      items:
        $ref: '#/components/schemas/waitingroom_create_rule'
    waitingroom_patch_rule:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/waitingroom_rule_action'
        description:
          $ref: '#/components/schemas/waitingroom_rule_description'
        enabled:
          $ref: '#/components/schemas/waitingroom_rule_enabled'
        expression:
          $ref: '#/components/schemas/waitingroom_rule_expression'
        position:
          $ref: '#/components/schemas/waitingroom_rule_position'
      required:
      - action
      - expression
    waitingroom_name:
      description: A unique name to identify the waiting room. Only alphanumeric characters, hyphens and underscores are allowed.
      type: string
      example: production_webinar
      x-auditable: true
    waitingroom_event_details_custom_page_html:
      type: string
      example: '{{#waitTimeKnown}} {{waitTime}} mins {{/waitTimeKnown}} {{^waitTimeKnown}} Event is prequeueing / Queue all enabled {{/waitTimeKnown}}'
      x-auditable: true
    waitingroom_queueing_method:
      description: 'Sets the queueing method used by the waiting room. Changing this parameter from the **default** queueing method is only available for the Waiting Room Advanced subscription. Regardless of the queueing method, if `queue_all` is enabled or an event is prequeueing, users in the waiting room will not be accepted to the origin. These users will always see a waiting room page that refreshes automatically. The valid queueing methods are:

        1. `fifo` **(default)**: First-In-First-Out queue where customers gain access in the order they arrived.

        2. `random`: Random queue where customers gain access randomly, regardless of arrival time.

        3. `passthrough`: Users will pass directly through the waiting room and into the origin website. As a result, any configured limits will not be respected while this is enabled. This method can be used as an alternative to disabling a waiting room (with `suspended`) so that analytics are still reported. This can be used if you wish to allow all traffic normally, but want to restrict traffic during a waiting room event, or vice versa.

        4. `reject`: Users will be immediately rejected from the waiting room. As a result, no users will reach the origin website while this is enabled. This can be used if you wish to reject all traffic while performing maintenance, block traffic during a specified period of time (an event), or block traffic while events are not occurring. Consider a waiting room used for vaccine distribution that only allows traffic during sign-up events, and otherwise blocks all traffic. For this case, the waiting room uses `reject`, and its events override this with `fifo`, `random`, or `passthrough`. When this queueing method is enabled and neither `queueAll` is enabled nor an event is prequeueing, the waiting room page **will not refresh automatically**.'
      type: string
      example: fifo
      default: fifo
      enum:
      - fifo
      - random
      - passthrough
      - reject
      x-auditable: true
    waitingroom_queue_all:
      description: If queue_all is `true`, all the traffic that is coming to a route will be sent to the waiting room. No new traffic can get to the route once this field is set and estimated time will become unavailable.
      type: boolean
      example: true
      default: false
      x-auditable: true
    waitingroom_event_details_disable_session_renewal:
      type: boolean
      example: false
      x-auditable: true
    waitingroom_search_engine_crawler_bypass:
      description: 'Whether to allow verified search engine crawlers to bypass all waiting rooms on this zone.

        Verified search engine crawlers will not be tracked or counted by the waiting room system,

        and will not appear in waiting room analytics.

        '
      type: boolean
      example: true
      default: false
      x-auditable: true
    waitingroom_enabled_origin_commands:
      description: A list of enabled origin commands.
      type: array
      items:
        enum:
        - revoke
        type: string
        uniqueItems: true
        x-auditable: true
      default: []
    waitingroom_event_custom_page_html:
      description: If set, the event will override the waiting room's `custom_page_html` property while it is active. If null, the event will inherit it.
      type:
      - string
      - 'null'
      example: '{{#waitTimeKnown}} {{waitTime}} mins {{/waitTimeKnown}} {{^waitTimeKnown}} Event is prequeueing / Queue all enabled {{/waitTimeKnown}}'
      x-auditable: true
    waitingroom_event_details_total_active_users:
      type: integer
      x-auditable: true
    waitingroom_suspended:
      description: Suspends or allows traffic going to the waiting room. If set to `true`, the traffic will not go to the waiting room.
      type: boolean
      default: false
      x-auditable: true
    waitingroom_rules_response_collection:
      type: object
      allOf:
      - $ref: '#/components/schemas/waitingroom_api-response-collection'
      - properties:
          result:
            type: array
            items:
              $ref: '#/components/schemas/waitingroom_rule_result'
        type: object
  parameters:
    waitingroom_page:
      description: Page number of paginated results.
      in: query
      name: page
      schema:
        type: number
        default: 1
        minimum: 1
    waitingroom_per_page:
      description: Maximum number of results per page. Must be a multiple of 5.
