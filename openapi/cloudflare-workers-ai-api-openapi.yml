openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Workers AI API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Workers AI
paths:
  /accounts/{account_id}/ai/authors/search:
    get:
      operationId: workers-ai-search-author
      summary: Author Search
      description: Searches Workers AI models by author or organization name.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
      responses:
        '200':
          description: Returns a list of authors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                  messages:
                    type: array
                    items:
                      type: string
                  result:
                    type: array
                    items:
                      type: object
                  success:
                    type: boolean
                required:
                - success
                - result
                - errors
                - messages
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                  result:
                    type: object
                  success:
                    type: boolean
                    example: false
                required:
                - result
                - success
                - errors
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Workers AI
      x-api-token-group:
      - Workers AI Write
      - Workers AI Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.ai
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: ai.authors
      x-fern-sdk-method-name: list
      x-forge-hidden: true
  /accounts/{account_id}/ai/models/schema:
    get:
      operationId: workers-ai-get-model-schema
      summary: Get an AI model's input and output schemas
      description: Retrieves the input and output JSON Schema definitions for an AI model. Use these definitions to determine the model-specific request fields and response format.
      parameters:
      - name: account_id
        in: path
        description: Cloudflare account ID used for this AI model request.
        required: true
        schema:
          description: Cloudflare account ID used for this AI model request.
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
      - name: model
        in: query
        description: AI model identifier, including its namespace and model name.
        required: true
        schema:
          description: AI model identifier, including its namespace and model name.
          type: string
          example: '@cf/meta/llama-3.1-8b-instruct'
      responses:
        '200':
          description: Model Schema
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      input:
                        type: object
                        properties:
                          additionalProperties:
                            type: boolean
                            example: true
                          description:
                            type: string
                            example: JSON Schema definition for the model's input parameters
                          type:
                            type: string
                            example: object
                        required:
                        - type
                        - description
                        - additionalProperties
                      output:
                        type: object
                        properties:
                          additionalProperties:
                            type: boolean
                            example: true
                          description:
                            type: string
                            example: JSON Schema definition for the model's output format
                          type:
                            type: string
                            example: object
                        required:
                        - type
                        - description
                        - additionalProperties
                    required:
                    - input
                    - output
                  success:
                    type: boolean
                required:
                - success
                - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                  result:
                    type: object
                  success:
                    type: boolean
                    example: false
                required:
                - result
                - success
                - errors
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Workers AI
      x-api-token-group:
      - Workers AI Write
      - Workers AI Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.ai
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-sdk-group-name: ai
      x-fern-sdk-method-name: get-model-schema
  /accounts/{account_id}/ai/models/search:
    get:
      operationId: workers-ai-search-model
      summary: Model Search
      description: Searches Workers AI models by name or description.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
      - name: per_page
        in: query
        schema:
          type: integer
          default: 100
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: task
        in: query
        description: Filter by Task Name.
        schema:
          description: Filter by Task Name.
          type: string
          example: Text Generation
          default: ''
      - name: author
        in: query
        description: Filter by Author.
        schema:
          description: Filter by Author.
          type: string
          default: ''
      - name: source
        in: query
        description: Filter by Source Id.
        schema:
          description: Filter by Source Id.
          type: number
      - name: hide_experimental
        in: query
        description: Filter to hide experimental models.
        schema:
          description: Filter to hide experimental models.
          type: boolean
          default: false
      - name: search
        in: query
        description: Search.
        schema:
          description: Search.
          type: string
          default: ''
      - name: include_deprecated
        in: query
        description: If true, include models for up to three months after their deprecation date. Defaults to false.
        schema:
          description: If true, include models for up to three months after their deprecation date. Defaults to false.
          type: boolean
          default: false
      - name: format
        in: query
        description: If set, return models in the requested marketplace format instead of the default response.
        schema:
          description: If set, return models in the requested marketplace format instead of the default response.
          type: string
          enum:
          - openrouter
      responses:
        '200':
          description: Returns a list of models. Default shape is the standard envelope; when `format` is supplied the marketplace-specific shape is returned instead.
          content:
            application/json:
              schema:
                anyOf:
                - properties:
                    errors:
                      type: array
                      items:
                        type: object
                    messages:
                      type: array
                      items:
                        type: string
                    result:
                      type: array
                      items:
                        type: object
                    success:
                      type: boolean
                  required:
                  - success
                  - result
                  - errors
                  - messages
                  type: object
                - description: Marketplace-format response. See https://openrouter.ai/docs/guides/get-started/for-providers.
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                  required:
                  - data
                  type: object
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                  success:
                    type: boolean
                required:
                - success
                - errors
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Workers AI
      x-api-token-group:
      - Workers AI Write
      - Workers AI Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.ai
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: ai.models
      x-fern-sdk-method-name: list
      x-forge-hidden: true
  /accounts/{account_id}/ai/run:
    post:
      operationId: workers-ai-post-run-generic
      summary: Run an AI model with request options
      description: 'Runs an AI model using a JSON body containing model, input, and optional options fields. Unlike the model-specific URL endpoint, this endpoint takes the model identifier in the body and nests the model''s inputs under input.


        Use options.extraHeaders to pass additional provider headers. Accepts Workers AI model identifiers and AI Gateway provider model identifiers.


        See the Workers AI model catalog for Workers AI model inputs, or the provider''s documentation for models accessed through AI Gateway.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          description: Cloudflare account ID used for this AI model request.
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  description: JSON object containing the selected model's input fields, such as prompt or messages. Do not include model or options inside this object.
                  type: object
                  example:
                    prompt: Tell me a joke
                model:
                  description: The AI model to execute (e.g., @cf/google/gemma-4-26b-a4b-it, openai/gpt-5.5, anthropic/claude-opus-4.7)
                  type: string
                  example: openai/gpt-5.5
                options:
                  type: object
                  properties:
                    extraHeaders:
                      description: Additional headers to pass to the AI provider
                      type: object
                      additionalProperties:
                        type: string
                    gateway:
                      type: object
                      properties:
                        cacheTtl:
                          description: Cache TTL in seconds
                          type: number
                          example: 3600
                        id:
                          description: AI Gateway ID for caching and logging
                          type: string
                          example: my-gateway
                        skipCache:
                          description: Skip cache lookup for this request
                          type: boolean
              required:
              - model
              - input
      responses:
        '200':
          description: Model response
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                  messages:
                    type: array
                    items:
                      type: object
                  result:
                    description: Model-specific output. Format varies by model type.
                    type: object
                  success:
                    type: boolean
                required:
                - success
                - result
                - errors
                - messages
        '400':
          description: Bad request - missing required fields or invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          type: number
                        message:
                          type: string
                      required:
                      - code
                      - message
                      type: object
                  success:
                    type: boolean
                required:
                - success
                - errors
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Workers AI
      x-api-token-group:
      - Workers AI Write
      - Workers AI Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.ai
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: ai
      x-fern-sdk-method-name: run
  /accounts/{account_id}/ai/run/{model_name}:
    post:
      operationId: workers-ai-post-run-model
      summary: Run a Workers AI model
      description: 'Runs the Workers AI model specified in the URL path. Send the model''s inputs directly in the request body, without a model/input/options wrapper.


        Accepts model-specific JSON or binary input. The response format depends on the model and the requested output.


        See the model catalog for supported models and their input formats.'
      parameters:
      - name: account_id
        in: path
        description: Cloudflare account ID used for this AI model request.
        required: true
        schema:
          description: Cloudflare account ID used for this AI model request.
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
      - name: model_name
        in: path
        description: Workers AI model identifier, including its namespace and model name.
        required: true
        schema:
          description: Workers AI model identifier, including its namespace and model name.
          type: string
          example: '@cf/meta/llama-3.1-8b-instruct'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              oneOf:
              - properties:
                  text:
                    description: The text that you want to classify
                    type: string
                    minLength: 1
                required:
                - text
                title: Text Classification
                type: object
              - properties:
                  guidance:
                    description: Controls how closely the generated image should adhere to the prompt; higher values make the image more aligned with the prompt
                    type: number
                    default: 7.5
                  height:
                    description: The height of the generated image in pixels
                    type: integer
                    maximum: 2048
                    minimum: 256
                  image:
                    description: For use with img2img tasks. An array of integers that represent the image data constrained to 8-bit unsigned integer values
                    type: array
                    items:
                      description: A value between 0 and 255
                      type: number
                  image_b64:
                    description: For use with img2img tasks. A base64-encoded string of the input image
                    type: string
                  mask:
                    description: An array representing An array of integers that represent mask image data for inpainting constrained to 8-bit unsigned integer values
                    type: array
                    items:
                      description: A value between 0 and 255
                      type: number
                  negative_prompt:
                    description: Text describing elements to avoid in the generated image
                    type: string
                  num_steps:
                    description: The number of diffusion steps; higher values can improve quality but take longer
                    type: integer
                    default: 20
                    maximum: 20
                  prompt:
                    description: A text description of the image you want to generate
                    type: string
                    minLength: 1
                  seed:
                    description: Random seed for reproducibility of the image generation
                    type: integer
                  strength:
                    description: A value between 0 and 1 indicating how strongly to apply the transformation during img2img tasks; lower values make the output closer to the input image
                    type: number
                    default: 1
                  width:
                    description: The width of the generated image in pixels
                    type: integer
                    maximum: 2048
                    minimum: 256
                required:
                - prompt
                title: Text To Image
                type: object
              - properties:
                  lang:
                    description: The speech language (e.g., 'en' for English, 'fr' for French). Defaults to 'en' if not specified
                    type: string
                    default: en
                  prompt:
                    description: A text description of the audio you want to generate
                    type: string
                    minLength: 1
                required:
                - prompt
                title: Text To Speech
                type: object
              - properties:
                  text:
                    oneOf:
                    - description: The text to embed
                      minLength: 1
                      type: string
                    - description: Batch of text values to embed
                      items:
                        description: The text to embed
                        minLength: 1
                        type: string
                      maxItems: 100
                      type: array
                required:
                - text
                title: Text Embeddings
                type: object
              - oneOf:
                - format: binary
                  type: string
                - properties:
                    audio:
                      description: An array of integers that represent the audio data constrained to 8-bit unsigned integer values
                      type: array
                      items:
                        description: A value between 0 and 255
                        type: number
                    source_lang:
                      description: The language of the recorded audio
                      type: string
                    target_lang:
                      description: The language to translate the transcription into. Currently only English is supported.
                      type: string
                  required:
                  - audio
                  type: object
                title: Automatic Speech Recognition
                type: object
              - oneOf:
                - description: The image to classify
                  format: binary
                  type: string
                - properties:
                    image:
                      description: An array of integers that represent the image data constrained to 8-bit unsigned integer values
                      type: array
                      items:
                        description: A value between 0 and 255 (unsigned 8bit)
                        type: number
                  required:
                  - image
                  type: object
                title: Image Classification
                type: object
              - oneOf:
                - description: The image to use for detection
                  format: binary
                  type: string
                - properties:
                    image:
                      description: An array of integers that represent the image data constrained to 8-bit unsigned integer values
                      type: array
                      items:
                        description: A value between 0 and 255 (unsigned 8bit)
                        type: number
                  type: object
                title: Object Detection
                type: object
              - oneOf:
                - properties:
                    frequency_penalty:
                      description: Decreases the likelihood of the model repeating the same lines verbatim.
                      type: number
                      maximum: 2
                      minimum: -2
                    lora:
                      description: Name of the LoRA (Low-Rank Adaptation) model to fine-tune the base model.
                      type: string
                    max_tokens:
                      description: The maximum number of tokens to generate in the response.
                      type: integer
                      default: 256
                    presence_penalty:
                      description: Increases the likelihood of the model introducing new topics.
                      type: number
                      maximum: 2
                      minimum: -2
                    prompt:
                      description: The input text prompt for the model to generate a response.
                      type: string
                      minLength: 1
                    raw:
                      description: If true, a chat template is not applied and you must adhere to the specific model's expected formatting.
                      type: boolean
                      default: false
                    repetition_penalty:
                      description: Penalty for repeated tokens; higher values discourage repetition.
                      type: number
                      maximum: 2
                      minimum: 0
                    response_format:
                      type: object
                      properties:
                        json_schema: {}
                        type:
                          type: string
                          enum:
                          - json_object
                          - json_schema
                      title: JSON Mode
                    seed:
                      description: Random seed for reproducibility of the generation.
                      type: integer
                      maximum: 9999999999
                      minimum: 1
                    stream:
                      description: If true, the response will be streamed back incrementally using SSE, Server Sent Events.
                      type: boolean
                      default: false
                    temperature:
                      description: Controls the randomness of the output; higher values produce more random results.
                      type: number
                      default: 0.6
                      maximum: 5
                      minimum: 0
                    top_k:
                      description: Limits the AI to choose from the top 'k' most probable words. Lower values make responses more focused; higher values introduce more variety and potential surprises.
                      type: integer
                      maximum: 50
                      minimum: 1
                    top_p:
                      description: Adjusts the creativity of the AI's responses by controlling how many possible words it considers. Lower values make outputs more predictable; higher values allow for more varied and creative responses.
                      type: number
                      maximum: 1
                      minimum: 0.001
                  required:
                  - prompt
                  title: Prompt
                - properties:
                    frequency_penalty:
                      description: Decreases the likelihood of the model repeating the same lines verbatim.
                      type: number
                      maximum: 2
                      minimum: -2
                    functions:
                      type: array
                      items:
                        properties:
                          code:
                            type: string
                          name:
                            type: string
                        required:
                        - name
                        - code
                        type: object
                    max_tokens:
                      description: The maximum number of tokens to generate in the response.
                      type: integer
                      default: 256
                    messages:
                      description: An array of message objects representing the conversation history.
                      type: array
                      items:
                        properties:
                          content:
                            oneOf:
                            - description: The content of the message as a string.
                              type: string
                            - description: Array of text content parts.
                              items:
                                properties:
                                  text:
                                    description: Text content
                                    type: string
                                  type:
                                    description: Type of the content (text)
                                    type: string
                                type: object
                              type: array
                          role:
                            description: The role of the message sender (e.g., 'user', 'assistant', 'system', 'tool').
                            type: string
                        required:
                        - role
                        - content
                        type: object
                    presence_penalty:
                      description: Increases the likelihood of the model introducing new topics.
                      type: number
                      maximum: 2
                      minimum: -2
                    raw:
                      description: If true, a chat template is not applied and you must adhere to the specific model's expected formatting.
                      type: boolean
                      default: false
                    repetition_penalty:
                      description: Penalty for repeated tokens; higher values discourage repetition.
                      type: number
                      maximum: 2
                      minimum: 0
                    response_format:
                      type: object
                      properties:
                        json_schema: {}
                        type:
                          type: string
                          enum:
                          - json_object
                          - json_schema
                      title: JSON Mode
                    seed:
                      description: Random seed for reproducibility of the generation.
                      type: integer
                      maximum: 9999999999
                      minimum: 1
                    stream:
                      description: If true, the response will be streamed back incrementally using SSE, Server Sent Events.
                      type: boolean
                      default: false
                    temperature:
                      description: Controls the randomness of the output; higher values produce more random results.
                      type: number
                      default: 0.6
                      maximum: 5
                      minimum: 0
                    tools:
                      description: A list of tools available for the assistant to use.
                      type: array
                      items:
                        oneOf:
                        - properties:
                            description:
                              description: A brief description of what the tool does.
                              type: string
                            name:
                              description: The name of the tool. More descriptive the better.
                              type: string
                            parameters:
                              description: Schema defining the parameters accepted by the tool.
                              required:
                              - type
                              - properties
                              properties:
                                properties:
                                  description: Definitions of each parameter.
                                  type: object
                                  additionalProperties:
                                    properties:
                                      description:
                                        description: A description of the expected parameter.
                                        type: string
                                      type:
                                        description: The data type of the parameter.
                                        type: string
                                    required:
                                    - type
                                    - description
                                    type: object
                                required:
                                  description: List of required parameter names.
                                  type: array
                                  items:
                                    type: string
                                type:
                                  description: The type of the parameters object (usually 'object').
                                  type: string
                              type: object
                          required:
                          - name
                          - description
                          - parameters
                        - properties:
                            function:
                              description: Details of the function tool.
                              type: object
                              properties:
                                description:
                                  description: A brief description of what the function does.
                                  type: string
                                name:
                                  description: The name of the function.
                                  type: string
                                parameters:
                                  description: Schema defining the parameters accepted by the function.
                                  required:
                                  - type
                                  - properties
                                  properties:
                                    properties:
                                      description: Definitions of each parameter.
                                      type: object
                                      additionalProperties:
                                        properties:
                                          description:
                                            description: A description of the expected parameter.
                                            type: string
                                          type:
                                            description: The data type of the parameter.
                                            type: string
                                        required:
                                        - type
                                        - description
                                        type: object
                                    required:
                                      description: List of required parameter names.
                                      type: array
                                      items:
                                        type: string
                                    type:
                                      description: The type of the parameters object (usually 'object').
                                      type: string
                                  type: object
                              required:
                              - name
                              - description
                              - parameters
                            type:
                              description: Specifies the type of tool (e.g., 'function').
                              type: string
                          required:
                          - type
                          - function
                        type: object
                    top_k:
                      description: Limits the AI to choose from the top 'k' most probable words. Lower values make responses more focused; higher values introduce more variety and potential surprises.
                      type: integer
                      maximum: 50
                      minimum: 1
                    top_p:
                      description: Adjusts the creativity of the AI's responses by controlling how many possible words it considers. Lower values make outputs more predictable; higher values allow for more varied and creative responses.
                      type: number
                      maximum: 1
                      minimum: 0.001
                  required:
                  - messages
                  title: Messages
                title: Text Generation
                type: object
              - properties:
                  source_lang:
                    description: The language code of the source text (e.g., 'en' for English). Defaults to 'en' if not specified
                    type: string
                    default: en
                  target_lang:
                    description: The language code to translate the text into (e.g., 'es' for Spanish)
                    type: string
                  text:
                    description: The text to be translated
                    type: string
                    minLength: 1
                required:
                - text
                - target_lang
                title: Translation
                type: object
              - properties:
                  input_text:
                    description: The text that you want the model to summarize
                    type: string
                    minLength: 1
                  max_length:
                    description: The maximum length of the generated summary in tokens
                    type: integer
                    default: 1024
                required:
                - input_text
                title: Summarization
                type: object
              - oneOf:
                - description: Binary string representing the image contents.
                  format: binary
                  type: string
                - properties:
                    frequency_penalty:
                      description: Decreases the likelihood of the model repeating the same lines verbatim.
                      type: number
                    image:
                      oneOf:
                      - description: An array of integers that represent the image data constrained to 8-bit unsigned integer values
                        items:
                          description: A value between 0 and 255
                          type: number
                        type: array
                      - description: Binary string representing the image contents.
                        format: binary
                        type: string
                    max_tokens:
                      description: The maximum number of tokens to generate in the response.
                      type: integer
                      default: 512
                    presence_penalty:
                      description: Increases the likelihood of the model introducing new topics.
                      type: number
                    prompt:
                      description: The input text prompt for the model to generate a response.
                      type: string
                    raw:
                      description: If true, a chat template is not applied and you must adhere to the specific model's expected formatting.
                      type: boolean
                      default: false
                    repetition_penalty:
