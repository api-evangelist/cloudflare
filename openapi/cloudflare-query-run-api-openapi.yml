    workers-observability_telemetry_event:
      description: A single telemetry event representing a log line, span, or metric data point emitted by a Worker.
      type: object
      properties:
        $containers:
          description: Cloudflare Containers event information that enriches your logs for identifying and debugging issues.
          type: object
          additionalProperties: true
        $metadata:
          description: Structured metadata extracted from the event. These fields are indexed and available for filtering and aggregation.
          type: object
          properties:
            account:
              description: Cloudflare account identifier.
              type: string
            cloudService:
              description: Cloudflare product that generated this event (e.g. workers, pages).
              type: string
            coldStart:
              type: integer
              exclusiveMinimum: 0
            cost:
              description: Estimated cost units for this invocation.
              type: integer
              exclusiveMinimum: 0
            duration:
              description: Span duration in milliseconds.
              type: integer
              exclusiveMinimum: 0
            endTime:
              description: Span end time as a Unix epoch in milliseconds.
              type: integer
              minimum: 0
            endTimeNs:
              description: Span end time as a Unix epoch in nanoseconds.
              type: string
            error:
              description: Error message, present when the log represents an error.
              type: string
            errorTemplate:
              description: Templatized version of the error message used for grouping similar errors.
              type: string
            fingerprint:
              description: Content-based fingerprint used to group similar events.
              type: string
            id:
              description: Unique event ID. Use as the cursor value for offset-based pagination.
              type: string
            level:
              description: Log level (e.g. log, debug, info, warn, error).
              type: string
            message:
              description: Log message text.
              type: string
            messageTemplate:
              description: Templatized version of the log message used for grouping similar messages.
              type: string
            metricName:
              description: Metric name when the event represents a metric data point.
              type: string
            origin:
              description: Origin of the event (e.g. fetch, scheduled, queue).
              type: string
            parentSpanId:
              description: Span ID of the parent span in the trace hierarchy.
              type: string
            provider:
              description: Infrastructure provider identifier.
              type: string
            rayId:
              description: Cloudflare Ray ID from the `cf-ray` header of the request that triggered the invocation.
              type: string
            region:
              description: Cloudflare data center / region that handled the request.
              type: string
            requestId:
              description: Cloudflare request ID that ties all logs from a single invocation together.
              type: string
            service:
              description: Worker script name that produced this event.
              type: string
            spanId:
              description: Span ID for this individual unit of work within a trace.
              type: string
            spanName:
              description: Human-readable name for this span.
              type: string
            stackId:
              description: Stack / deployment identifier.
              type: string
            startTime:
              description: Span start time as a Unix epoch in milliseconds.
              type: integer
              minimum: 0
            startTimeNs:
              description: Span start time as a Unix epoch in nanoseconds.
              type: string
            statusCode:
              description: HTTP response status code returned by the Worker.
              type: integer
              exclusiveMinimum: 0
            timestampNs:
              description: Event time as a Unix epoch in nanoseconds.
              type: string
            traceDuration:
              description: Total duration of the entire trace in milliseconds.
              type: integer
              exclusiveMinimum: 0
            traceId:
              description: Distributed trace ID linking spans across services.
              type: string
            transactionName:
              description: Logical transaction name for this request.
              type: string
            trigger:
              description: What triggered the invocation (e.g. GET /users, POST /orders, queue message).
              type: string
            type:
              description: Event type classifier (e.g. cf-worker-event, cf-worker-log).
              type: string
            url:
              description: Request URL that triggered the Worker invocation.
              type: string
          required:
          - id
        $workers:
          description: Cloudflare Workers event information that enriches your logs for identifying and debugging issues.
          anyOf:
          - properties:
              durableObjectId:
                type: string
              entrypoint:
                type: string
              event:
                type: object
                additionalProperties: true
              eventType:
                type: string
                enum:
                - fetch
                - scheduled
                - alarm
                - cron
                - queue
                - email
                - tail
                - rpc
                - jsrpc
                - websocket
                - workflow
                - unknown
              executionModel:
                type: string
                enum:
                - durableObject
                - stateless
              outcome:
                type: string
              preview:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  slug:
                    type: string
              requestId:
                type: string
              scriptName:
                type: string
              scriptVersion:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    type: string
                  tag:
                    type: string
              spanId:
                type: string
              traceId:
                type: string
              truncated:
                type: boolean
            required:
            - scriptName
            - eventType
            type: object
          - properties:
              cpuTimeMs:
                type: number
              diagnosticsChannelEvents:
                type: array
                items:
                  properties:
                    channel:
                      type: string
                    message:
                      type: string
                    timestamp:
                      type: number
                  required:
                  - timestamp
                  - channel
                  - message
                  type: object
              dispatchNamespace:
                type: string
              durableObjectId:
                type: string
              entrypoint:
                type: string
              event:
                type: object
                additionalProperties: true
              eventType:
                type: string
                enum:
                - fetch
                - scheduled
                - alarm
                - cron
                - queue
                - email
                - tail
                - rpc
                - jsrpc
                - websocket
                - workflow
                - unknown
              executionModel:
                type: string
                enum:
                - durableObject
                - stateless
              outcome:
                type: string
              preview:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  slug:
                    type: string
              requestId:
                type: string
              scriptName:
                type: string
              scriptVersion:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    type: string
                  tag:
                    type: string
              spanId:
                type: string
              traceId:
                type: string
              truncated:
                type: boolean
              wallTimeMs:
                type: number
            required:
            - scriptName
            - outcome
            - eventType
            - wallTimeMs
            - cpuTimeMs
            type: object
        dataset:
          description: The dataset this event belongs to (e.g. cloudflare-workers).
          type: string
        source:
          description: Raw log payload. May be a string or a structured object depending on how the log was emitted.
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
        timestamp:
          description: Event timestamp as a Unix epoch in milliseconds.
          type: integer
          minimum: 0
      additionalProperties: false
      required:
      - dataset
      - timestamp
      - source
      - $metadata
    workers-observability_filter_node:
      description: 'Supports nested groups via kind: ''group''.'
      type: object
      anyOf:
      - properties:
          filterCombination:
            type: string
            enum:
            - and
            - or
            - AND
            - OR
          filters:
            type: array
            items:
              $ref: '#/components/schemas/workers-observability_filter_node'
            minItems: 1
          kind:
            type: string
            enum:
            - group
        required:
        - kind
        - filterCombination
        - filters
        type: object
      - $ref: '#/components/schemas/workers-observability_filter_leaf'
    workers-observability_filter_leaf:
      description: A filter condition applied to query results. Use the keys and values endpoints to discover available fields and their values before constructing filters.
      type: object
      properties:
        key:
          description: Filter field name. Use verified keys from previous query results or the keys endpoint. Common keys include $metadata.service, $metadata.origin, $metadata.trigger, $metadata.message, and $metadata.error.
          type: string
        kind:
          description: Discriminator for leaf filter nodes. Always 'filter' when present; may be omitted.
          type: string
          enum:
          - filter
        operation:
          description: 'Comparison operator. String operators: includes, not_includes, starts_with, ends_with, regex. Existence: exists, is_null. Set membership: in, not_in (comma-separated values). Numeric: eq, neq, gt, gte, lt, lte.'
          type: string
          enum:
          - includes
          - not_includes
          - starts_with
          - ends_with
          - regex
          - exists
          - is_null
          - in
          - not_in
          - eq
          - neq
          - gt
          - gte
          - lt
          - lte
          - '='
          - '!='
          - '>'
          - '>='
          - <
          - <=
          - INCLUDES
          - DOES_NOT_INCLUDE
          - MATCH_REGEX
          - EXISTS
          - DOES_NOT_EXIST
          - IN
          - NOT_IN
          - STARTS_WITH
          - ENDS_WITH
        type:
          description: Data type of the filter field. Must match the actual type of the key being filtered.
          type: string
          enum:
          - string
          - number
          - boolean
        value:
          description: Comparison value. Must match actual values in your data — verify with the values endpoint. Ensure the value type (string/number/boolean) matches the field type. String comparisons are case-sensitive. Regex uses RE2 syntax (no lookaheads/lookbehinds).
          anyOf:
          - type: string
          - type: number
          - type: boolean
      required:
      - key
      - operation
      - type
