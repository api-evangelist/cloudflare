openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Query run API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Query run
paths:
  /accounts/{account_id}/workers/observability/telemetry/query:
    parameters:
    - name: account_id
      in: path
      description: Your Cloudflare account ID.
      required: true
      schema:
        type: string
    post:
      operationId: telemetry.query
      summary: Run a query
      description: Run a temporary or saved query.
      requestBody:
        description: Query your observability events, requests, and traces to build visualizations and identify insights.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chart:
                  description: When true, includes time-series data in the response.
                  type: boolean
                chartType:
                  description: 'Controls the SQL shape and response payload for the ''calculations'' view. Omitted or ''timeseries_and_aggregate'': current behaviour — both the time-series and aggregate queries. ''timeseries'': time-series only. ''aggregate'': aggregate only. ''distribution'': a bucketed 2D histogram (time × value buckets) returned in ''distribution'' instead of ''calculations''. ''distribution'' is not compatible with ''compare'' — combining them returns a 400.'
                  type: string
                  enum:
                  - timeseries_and_aggregate
                  - timeseries
                  - aggregate
                  - distribution
                compare:
                  description: When true, includes a comparison dataset from the previous time period of equal length.
                  type: boolean
                distributionScale:
                  description: 'Value-axis bucketing for chartType ''distribution''. Omitted or ''log'': geometric buckets, best for heavy-tailed latency. ''linear'': fixed-width buckets, clearer for narrow or additive ranges. Ignored for other chartTypes. The response echoes the scheme used in distribution.bucketMode.'
                  type: string
                  enum:
                  - log
                  - linear
                dry:
                  description: When true, executes the query without persisting the results. Useful for validation or previewing.
                  type: boolean
                  default: false
                  x-fern-property-name: preview
                granularity:
                  description: Number of time-series buckets. Only used when view is 'calculations'. Omit to let the system auto-detect an appropriate granularity.
                  type: number
                ignoreSeries:
                  description: When true, omits time-series data from the response and returns only aggregated values. Reduces response size when series are not needed.
                  type: boolean
                  default: false
                limit:
                  description: Maximum number of events to return when view is 'events'. Also controls the number of group-by rows when view is 'calculations'.
                  type: number
                  default: 50
                  maximum: 2000
                offset:
                  description: Cursor for pagination in event, trace, invocation, and agent views. Pass the $metadata.id of the last event, the trace cursor, or AgentRun.id to fetch the next page.
                  type: string
                offsetBy:
                  description: Numeric offset for paginating grouped/pattern results (top-N lists). Use together with limit. Not used by cursor-based pagination.
                  type: number
                offsetDirection:
                  description: 'Pagination direction: ''next'' for forward, ''prev'' for backward.'
                  type: string
                parameters:
                  description: Query parameters defining what data to retrieve — filters, calculations, group-bys, and ordering. In practice this should always be provided for ad-hoc queries. Only omit when executing a previously saved query by queryId. Use the keys and values endpoints to discover available fields before building filters.
                  properties:
                    calculations:
                      description: Aggregation calculations to compute (e.g. count, avg, p99). Each calculation produces aggregate values and optional time-series data.
                      type: array
                      items:
                        discriminator:
                          propertyName: operator
                        oneOf:
                        - properties:
                            alias:
                              description: Custom label for this calculation in the results. Useful for distinguishing multiple calculations.
                              type: string
                            key:
                              description: Field name to calculate over. Must exist in the data. Verify with the keys endpoint. Required for every operator except `count`, which aggregates whole rows and may omit it.
                              type: string
                            keyType:
                              description: Data type of the key. Required when key is provided to ensure correct aggregation.
                              type: string
                              enum:
                              - string
                              - number
                              - boolean
                            operator:
                              description: 'Aggregation operator to apply. Examples: count, avg, sum, min, max, median, p90, p95, p99, uniq, stddev, variance.'
                              type: string
                              enum:
                              - count
                              - COUNT
                          required:
                          - operator
                          type: object
                        - properties:
                            alias:
                              description: Custom label for this calculation in the results. Useful for distinguishing multiple calculations.
                              type: string
                            key:
                              description: Field name to calculate over. Must exist in the data. Verify with the keys endpoint. Required for every operator except `count`, which aggregates whole rows and may omit it.
                              type: string
                              pattern: \S
                            keyType:
                              description: Data type of the key. Required when key is provided to ensure correct aggregation.
                              type: string
                              enum:
                              - string
                              - number
                              - boolean
                            operator:
                              description: 'Aggregation operator to apply. Examples: count, avg, sum, min, max, median, p90, p95, p99, uniq, stddev, variance.'
                              type: string
                              enum:
                              - uniq
                              - max
                              - min
                              - sum
                              - avg
                              - median
                              - p001
                              - p01
                              - p05
                              - p10
                              - p25
                              - p75
                              - p90
                              - p95
                              - p99
                              - p999
                              - stddev
                              - variance
                              - COUNT_DISTINCT
                              - MAX
                              - MIN
                              - SUM
                              - AVG
                              - MEDIAN
                              - P001
                              - P01
                              - P05
                              - P10
                              - P25
                              - P75
                              - P90
                              - P95
                              - P99
                              - P999
                              - STDDEV
                              - VARIANCE
                          required:
                          - key
                          - operator
                          type: object
                    datasets:
                      description: Datasets to query. Leave empty to query all available datasets.
                      type: array
                      items:
                        type: string
                      example: []
                    filterCombination:
                      description: 'Logical operator for combining top-level filters: ''and'' (all must match) or ''or'' (any must match). Defaults to ''and''.'
                      type: string
                      enum:
                      - and
                      - or
                      - AND
                      - OR
                    filters:
                      description: 'Filters to narrow query results. Use the keys and values endpoints to discover available fields before building filters. Supports nested groups via kind: ''group''. Maximum nesting depth is 4.'
                      type: array
                      items:
                        allOf:
                        - $ref: '#/components/schemas/workers-observability_filter_node'
                        - anyOf:
                          - description: A group node that nests child filters combined with a logical operator.
                            properties:
                              filterCombination:
                                description: 'Logical operator for combining child filters: ''and'' (all must match) or ''or'' (any must match).'
                                type: string
                                enum:
                                - and
                                - or
                                - AND
                                - OR
                              filters:
                                description: Child filter nodes. Each can be a leaf filter or another nested group.
                                type: array
                                items:
                                  $ref: '#/components/schemas/workers-observability_filter_node'
                                minItems: 1
                              kind:
                                description: Discriminator indicating this is a nested filter group.
                                type: string
                                enum:
                                - group
                            required:
                            - kind
                            - filterCombination
                            - filters
                            type: object
                          - $ref: '#/components/schemas/workers-observability_filter_leaf'
                          description: 'Supports nested groups via kind: ''group''. Maximum nesting depth is 4.'
                    groupBys:
                      description: Fields to group calculation results by. Only applicable when the query view is 'calculations'. Produces per-group aggregate values.
                      type: array
                      items:
                        properties:
                          type:
                            description: Data type of the group-by field.
                            type: string
                            enum:
                            - string
                            - number
                            - boolean
                          value:
                            description: Field name to group results by (e.g. $metadata.service, $metadata.statusCode).
                            type: string
                        required:
                        - type
                        - value
                        type: object
                    havings:
                      description: Post-aggregation filters applied to calculation results. Use to filter groups after aggregation (e.g. only groups where count > 100).
                      type: array
                      items:
                        properties:
                          key:
                            description: Calculation alias or operator to filter on after aggregation.
                            type: string
                          operation:
                            description: 'Numeric comparison operator: eq, neq, gt, gte, lt, lte.'
                            type: string
                            enum:
                            - eq
                            - neq
                            - gt
                            - gte
                            - lt
                            - lte
                          value:
                            description: Threshold value to compare the calculation result against.
                            type: number
                        required:
                        - key
                        - operation
                        - value
                        type: object
                    limit:
                      description: Maximum number of group-by rows to return in calculation results. A value of 10 is a sensible default for most use cases.
                      type: integer
                      maximum: 2000
                      minimum: 0
                    needle:
                      description: Full-text search expression applied across all event fields. Matches events containing the specified text.
                      type: object
                      properties:
                        isRegex:
                          description: When true, treats the value as a regular expression (RE2 syntax).
                          type: boolean
                        matchCase:
                          description: When true, performs a case-sensitive search. Defaults to case-insensitive.
                          type: boolean
                        value:
                          description: The text or pattern to search for.
                          allOf:
                          - anyOf:
                            - type: string
                            - type: number
                            - type: boolean
                          - maxLength: 1000
                            type: string
                      required:
                      - value
                    orderBy:
                      description: Ordering for grouped calculation results. Only effective when a group-by is present.
                      type: object
                      properties:
                        order:
                          description: 'Sort direction: ''asc'' for ascending, ''desc'' for descending.'
                          type: string
                          enum:
                          - asc
                          - desc
                        value:
                          description: Alias of the calculation to order results by. Must match the alias (or operator) of a calculation in the query.
                          type: string
                      required:
                      - value
                  type: object
                queryId:
                  description: Identifier for the query. When parameters are omitted, this ID is used to load a previously saved query's parameters. When providing parameters inline, pass any identifier (e.g. an ad-hoc ID).
                  type: string
                timeframe:
                  description: Timeframe for the query using Unix timestamps in milliseconds. 'from' must be earlier than 'to'. Narrower timeframes produce faster responses and more specific results.
                  type: object
                  properties:
                    from:
                      description: Start timestamp for the query timeframe. Unix timestamp in milliseconds
                      type: integer
                      maximum: 253402300799999
                      minimum: 0
                    to:
                      description: End timestamp for the query timeframe. Unix timestamp in milliseconds
                      type: integer
                      maximum: 253402300799999
                      minimum: 0
                  required:
                  - to
                  - from
                view:
                  description: 'Controls the shape of the response. ''events'': individual log lines matching the query. ''calculations'': aggregated metrics (count, avg, p99, etc.) with optional group-by breakdowns and time-series. ''invocations'': events grouped by request ID. ''traces'': distributed trace summaries. ''agents'': agent-specific trace summaries.'
                  type: string
                  default: calculations
                  enum:
                  - traces
                  - events
                  - calculations
                  - invocations
                  - requests
                  - agents
              required:
              - queryId
              - timeframe
      responses:
        '200':
          description: Successful request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                  messages:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                          enum:
                          - Successful request
                      required:
                      - message
                      type: object
                  result:
                    $ref: '#/components/schemas/workers-observability_query_results'
                  success:
                    type: boolean
                    enum:
                    - true
                required:
                - messages
                - success
                - errors
                - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        detail:
                          type: string
                        message:
                          type: string
                          enum:
                          - Bad Request
                      required:
                      - message
                      type: object
                  messages:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                  success:
                    type: boolean
                    enum:
                    - false
                required:
                - errors
                - success
                - messages
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        detail:
                          type: string
                        message:
                          type: string
                          enum:
                          - Unauthorized
                      required:
                      - message
                      type: object
                  messages:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                  success:
                    type: boolean
                    enum:
                    - false
                required:
                - errors
                - success
                - messages
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        detail:
                          type: string
                        message:
                          type: string
                          enum:
                          - Forbidden
                      required:
                      - message
                      type: object
                  messages:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                  success:
                    type: boolean
                    enum:
                    - false
                required:
                - errors
                - success
                - messages
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        detail:
                          type: string
                        message:
                          type: string
                          enum:
                          - Too many requests
                      required:
                      - message
                      type: object
                  messages:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                  success:
                    type: boolean
                    enum:
                    - false
                required:
                - errors
                - success
                - messages
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        detail:
                          type: string
                        message:
                          type: string
                          enum:
                          - Internal error
                      required:
                      - message
                      type: object
                  messages:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                  success:
                    type: boolean
                    enum:
                    - false
                required:
                - errors
                - success
                - messages
        '504':
          description: Gateway timeout
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        detail:
                          type: string
                        message:
                          type: string
                          enum:
                          - Gateway timeout
                      required:
                      - message
                      type: object
                  messages:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                  success:
                    type: boolean
                    enum:
                    - false
                required:
                - errors
                - success
                - messages
      tags:
      - Query run
      x-api-token-group:
      - Workers Observability Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: observability.telemetry
      x-fern-sdk-method-name: query
components:
  schemas:
    workers-observability_query_run:
      description: Represents a single execution of a query against Workers Observability data, including the query definition, execution status, and performance statistics.
      type: object
      properties:
        accountId:
          description: Cloudflare account ID that owns this query run.
          type: string
        created:
          description: ISO-8601 timestamp when the query run was created.
          type: string
        dry:
          description: Whether this was a dry run (results not persisted).
          type: boolean
        granularity:
          description: Number of time-series buckets used for the query. Higher values produce more detailed series data.
          type: number
        id:
          description: Unique identifier for this query run.
          type: string
        query:
          description: A saved query definition with its parameters, metadata, and ownership information.
          allOf:
          - $ref: '#/components/schemas/workers-observability_query'
          - properties:
              created:
                anyOf:
                - type: string
                - format: date-time
                  type: string
              updated:
                anyOf:
                - type: string
                - format: date-time
                  type: string
            type: object
        statistics:
          description: Query performance statistics from the database (does not include network latency).
          type: object
          properties:
            abr_level:
              description: The level of Adaptive Bit Rate (ABR) sampling used for the query. If empty the ABR level is 1
              type: number
            bytes_read:
              description: Number of uncompressed bytes read from the table.
              type: number
            elapsed:
              description: Time in seconds for the query to run.
              type: number
            rows_read:
              description: Number of rows scanned from the table.
              type: number
          required:
          - elapsed
          - rows_read
          - bytes_read
        status:
          description: Current execution status of the query run.
          type: string
          enum:
          - STARTED
          - COMPLETED
        timeframe:
          description: Time range for the query execution. 'from' must be earlier than 'to'. No fractional milliseconds.
          type: object
          properties:
            from:
              description: Start timestamp for the query timeframe. Unix timestamp in milliseconds
              type: integer
              maximum: 253402300799999
              minimum: 0
            to:
              description: End timestamp for the query timeframe. Unix timestamp in milliseconds
              type: integer
              maximum: 253402300799999
              minimum: 0
          required:
          - to
          - from
        updated:
          description: ISO-8601 timestamp when the query run was last updated.
          type: string
        userId:
          description: ID of the user who initiated the query run.
          type: string
      required:
      - id
      - query
      - accountId
      - timeframe
      - userId
      - status
      - granularity
      - dry
    workers-observability_performance_information:
      description: Query performance statistics from the database. Includes execution time, rows scanned, and bytes read. Does not include network latency.
      type: object
      properties:
        abr_level:
          description: The level of Adaptive Bit Rate (ABR) sampling used for the query. If empty the ABR level is 1
          type: number
        bytes_read:
          description: Number of uncompressed bytes read from the table.
          type: number
        elapsed:
          description: Time in seconds for the query to run.
          type: number
        rows_read:
          description: Number of rows scanned from the table.
          type: number
      required:
      - elapsed
      - rows_read
      - bytes_read
    workers-observability_distribution_result:
      description: Bucketed 2D histogram of a numeric field over time. Present when chartType is 'distribution'.
      type: object
      properties:
        bins:
          description: Time-bucket labels (ISO-8601 strings), one per matrix column.
          type: array
          items:
            type: string
        bucketBoundaries:
          description: Raw bucket edges in the value's native unit, length buckets.length + 1. Used for the colour scale and percentile mapping.
          type: array
          items:
            type: number
        bucketMode:
          description: Bucketing scheme used to derive the boundaries. 'log' produces geometric edges; 'linear' produces fixed-width edges.
          type: string
          enum:
          - log
          - linear
        buckets:
          description: Value-range labels, one per matrix row (e.g. '50–100ms').
          type: array
          items:
            type: string
        matrix:
          description: Sampling-corrected counts. matrix[bucketIdx][binIdx] is the estimated number of events in value-bucket 'bucketIdx' during time-bin 'binIdx'.
          type: array
          items:
            items:
              type: number
            type: array
      required:
      - bins
      - buckets
      - matrix
      - bucketBoundaries
      - bucketMode
    workers-observability_query:
      type: object
      properties:
        adhoc:
          description: If the query wasn't explcitly saved
          type: boolean
        created:
          type: string
          format: date-time
        createdBy:
          type: string
        description:
          type:
          - string
          - 'null'
          example: Query description
          maxLength: 1000
        id:
          type: string
        name:
          description: Query name
          type: string
          maxLength: 250
          minLength: 1
        parameters:
          properties:
            calculations:
              description: Create Calculations to compute as part of the query.
              type: array
              items:
                discriminator:
                  propertyName: operator
                oneOf:
                - properties:
                    alias:
                      type: string
                    key:
                      type: string
                    keyType:
                      type: string
                      enum:
                      - string
                      - number
                      - boolean
                    operator:
                      type: string
                      enum:
                      - count
                      - COUNT
                  required:
                  - operator
                  type: object
                - properties:
                    alias:
                      type: string
                    key:
                      type: string
                      pattern: \S
                    keyType:
                      type: string
                      enum:
                      - string
                      - number
                      - boolean
                    operator:
                      type: string
                      enum:
                      - uniq
                      - max
                      - min
                      - sum
                      - avg
                      - median
                      - p001
                      - p01
                      - p05
                      - p10
                      - p25
                      - p75
                      - p90
                      - p95
                      - p99
                      - p999
                      - stddev
                      - variance
                      - COUNT_DISTINCT
                      - MAX
                      - MIN
                      - SUM
                      - AVG
                      - MEDIAN
                      - P001
                      - P01
                      - P05
                      - P10
                      - P25
                      - P75
                      - P90
                      - P95
                      - P99
                      - P999
                      - STDDEV
                      - VARIANCE
                  required:
                  - key
                  - operator
                  type: object
            datasets:
              description: Set the Datasets to query. Leave it empty to query all the datasets.
              type: array
              items:
                type: string
              example: []
            filterCombination:
              description: Set a Flag to describe how to combine the filters on the query.
              type: string
              enum:
              - and
              - or
              - AND
              - OR
            filters:
              description: 'Configure the Filters to apply to the query. Supports nested groups via kind: ''group''.'
              type: array
              items:
                $ref: '#/components/schemas/workers-observability_filter_node'
            groupBys:
              description: Define how to group the results of the query.
              type: array
              items:
                properties:
                  type:
                    type: string
                    enum:
                    - string
                    - number
                    - boolean
                  value:
                    type: string
                required:
                - type
                - value
                type: object
            havings:
              description: Configure the Having clauses that filter on calculations in the query result.
              type: array
              items:
                properties:
                  key:
                    type: string
                  operation:
                    type: string
                    enum:
                    - eq
                    - neq
                    - gt
                    - gte
                    - lt
                    - lte
                  value:
                    type: number
                required:
                - key
                - operation
                - value
                type: object
            limit:
              description: Set a limit on the number of results / records returned by the query
              type: integer
              maximum: 100
              minimum: 0
            needle:
              description: Define an expression to search using full-text search.
              type: object
              properties:
                isRegex:
                  type: boolean
                matchCase:
                  type: boolean
                value:
                  allOf:
                  - anyOf:
                    - type: string
                    - type: number
                    - type: boolean
                  - maxLength: 1000
                    type: string
              required:
              - value
            orderBy:
              description: Configure the order of the results returned by the query.
              type: object
              properties:
                order:
                  description: Set the order of the results
                  type: string
                  enum:
                  - asc
                  - desc
                value:
                  description: Configure which Calculation to order the results by.
                  type: string
              required:
              - value
          type: object
        updated:
          type: string
          format: date-time
        updatedBy:
          type: string
      required:
      - id
      - name
      - description
      - adhoc
      - parameters
      - created
      - createdBy
      - updated
      - updatedBy
    workers-observability_query_results:
      description: Complete results of a query run. The populated fields depend on the requested view type (events, calculations, invocations, traces, or agents).
      type: object
      properties:
        agents:
          description: Agent run summaries. Present when the query view is 'agents'. Each entry represents one trace containing at least one agent invocation.
          type: array
          items:
            properties:
              agentId:
                description: ID from the earliest agent invocation that provides one.
                type: string
              agentName:
                description: Name from the earliest agent invocation that provides one.
                type: string
              conversationId:
                description: Conversation ID from the earliest invocation that provides one.
                type: string
              errors:
                description: Distinct errors reported by spans in the run.
                type: array
                items:
                  type: string
              id:
                description: Stable pagination cursor for this agent run.
                type: string
              inputTokens:
