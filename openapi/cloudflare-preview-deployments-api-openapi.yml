          description: The kind of resource that the binding provides.
          type: string
          enum:
          - browser
          x-auditable: true
      required:
      - name
      - type
    workers_durable_object_transferred_export:
      description: 'A `transferred` tombstone (source side of a two-phase transfer):

        hands ownership of the provisioned namespace to another script in

        the same account, named by `transferred_to`. The target must have

        already deployed a matching `expecting-transfer` entry. The source

        class may stay in code during the rollout window (an info notice

        is emitted). `storage`, `renamed_to` and `transfer_from` are not

        allowed.

        '
      type: object
      properties:
        state:
          description: Tombstone that transfers the namespace to another script.
          type: string
          enum:
          - transferred
        transferred_to:
          description: 'The destination script name. Must be in the same account and

            the same dispatch-namespace context (or both non-dispatch).

            Cross-dispatch-namespace transfers are rejected. Write-only:

            never present in GET responses.

            '
          type: string
          example: target-worker
          maxLength: 128
          writeOnly: true
        type:
          description: Marks this entry as a Durable Object export.
          type: string
          enum:
          - durable-object
      additionalProperties: false
      required:
      - type
      - state
      - transferred_to
    workers_single_step_migrations:
      description: A single set of migrations to apply.
      allOf:
      - $ref: '#/components/schemas/workers_migration_tag_conditions'
      - $ref: '#/components/schemas/workers_migration_step'
    workers_binding_kind_ai_search_namespace:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/workers_binding_name'
        namespace:
          description: The user-chosen namespace name. Must exist before deploy -- Wrangler handles auto-creation on deploy failure (R2 bucket pattern). The "default" namespace is auto-created by config-api for new accounts. Grants full access (CRUD + search + chat) to all instances within the namespace.
          type: string
