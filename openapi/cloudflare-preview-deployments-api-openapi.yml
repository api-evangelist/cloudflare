        migrations:
          description: Migrations for Durable Objects associated with the deployment. Migrations are applied when the deployment is created.
          oneOf:
          - $ref: '#/components/schemas/workers_single_step_migrations'
          - $ref: '#/components/schemas/workers_multiple_step_migrations'
        placement:
          $ref: '#/components/schemas/workers_placement_info_no_status'
        usage_model:
          description: Usage model for the deployment.
          type: string
          example: standard
          default: standard
          enum:
          - standard
          - bundled
          - unbound
          deprecated: true
          x-auditable: true
    workers_binding_kind_browser:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/workers_binding_name'
