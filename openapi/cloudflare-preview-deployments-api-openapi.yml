openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Preview Deployments API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Preview Deployments
paths:
  /accounts/{account_id}/workers/workers/{worker_id}/previews/{preview_id}/deployments:
    get:
      operationId: workers.previews.deployments.list
      summary: List Preview Deployments
      description: List all deployments for a Preview.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: worker_id
        in: path
        required: true
        schema:
          description: Identifier for the Worker, which can be ID or name.
          type: string
      - name: preview_id
        in: path
        required: true
        schema:
          description: Identifier for the Preview, which can be ID, slug, or URL-encoded name.
          type: string
      - name: page
        in: query
        description: Current page.
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        description: Items per-page.
        schema:
          type: integer
          default: 10
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: List Preview Deployments success.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers_api-response-collection'
                - properties:
                    result:
                      type: array
                      items:
                        $ref: '#/components/schemas/workers_PreviewDeployment'
                  required:
                  - result
                  type: object
        4XX:
          description: List Preview Deployments failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Preview Deployments
      x-api-token-group:
      - Workers Tail Read
      - Workers Scripts Write
      - Workers Scripts Read
      x-fern-audiences:
      - sdk
      x-fern-availability: beta
      x-fern-sdk-group-name: workers.previews.deployments
      x-fern-sdk-method-name: list
    post:
      operationId: workers.previews.deployments.create
      summary: Create Preview Deployment
      description: Create a new deployment for a Preview.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: worker_id
        in: path
        required: true
        schema:
          description: Identifier for the Worker, which can be ID or name.
          type: string
      - name: preview_id
        in: path
        required: true
        schema:
          description: Identifier for the Preview, which can be ID, slug, or URL-encoded name.
          type: string
      - name: ignore_defaults
        in: query
        schema:
          description: If true, preview defaults from the parent Worker are ignored.
          type: boolean
      requestBody:
        description: Preview deployment creation parameters.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workers_PreviewDeploymentRequest'
          multipart/form-data:
            encoding:
              files:
                contentType: application/javascript+module, text/javascript+module, application/javascript, text/javascript, text/x-python, text/x-python-requirement, application/wasm, text/plain, application/octet-stream, application/source-map
              metadata:
                contentType: application/json
            schema:
              type: object
              properties:
                files:
                  description: 'Code, sourcemaps, and other content used at runtime. Each

                    part''s filename is the module name. Sourcemaps use

                    `application/source-map`.

                    '
                  type: array
                  items:
                    format: binary
                    type: string
                  x-stainless-collection-type: set
                metadata:
                  $ref: '#/components/schemas/workers_PreviewDeploymentConfig'
              required:
              - metadata
      responses:
        '200':
          description: Create Preview Deployment success.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/workers_PreviewDeployment'
                  required:
                  - result
                  type: object
        4XX:
          description: 'Create Preview Deployment failure. When the upload uses the

            declarative `exports` field and one or more entries fail

            reconciliation, the response is the exports reconciliation

            error envelope (error code 100402) with per-class detail in

            `errors[].meta.details`.

            '
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/workers_api-response-common-failure'
                - $ref: '#/components/schemas/workers_exports_reconciliation_error_response'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Preview Deployments
      x-fern-audiences:
      - sdk
      x-fern-availability: beta
      x-fern-sdk-group-name: workers.previews.deployments
      x-fern-sdk-method-name: create
  /accounts/{account_id}/workers/workers/{worker_id}/previews/{preview_id}/deployments/latest:
    patch:
      operationId: workers.previews.deployments.patchLatest
      summary: Patch Latest Preview Deployment
      description: Only `/deployments/latest` is supported. Creates a new preview deployment by applying a JSON Merge Patch (RFC 7396) to the latest deployment. Patching a specific deployment ID is not supported. Omitted fields are inherited from the latest deployment. Preview base config is used for the first deployment.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: worker_id
        in: path
        required: true
        schema:
          description: Identifier for the Worker, which can be ID or name.
          type: string
      - name: preview_id
        in: path
        required: true
        schema:
          description: Identifier for the Preview, which can be ID, slug, or URL-encoded name.
          type: string
      - name: ignore_defaults
        in: query
        schema:
          description: If true, preview defaults from the parent Worker are ignored.
          type: boolean
      requestBody:
        description: JSON Merge Patch to apply to the latest preview deployment. An empty object creates a new deployment with no changes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workers_PreviewDeploymentRequest'
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/workers_PreviewDeploymentRequest'
      responses:
        '200':
          description: Patch Preview Deployment success.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/workers_PreviewDeployment'
                  required:
                  - result
                  type: object
        4XX:
          description: 'Patch Preview Deployment failure. When the patch uses the

            declarative `exports` field and one or more entries fail

            reconciliation, the response is the exports reconciliation

            error envelope (error code 100402) with per-class detail in

            `errors[].meta.details`.

            '
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/workers_api-response-common-failure'
                - $ref: '#/components/schemas/workers_exports_reconciliation_error_response'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Preview Deployments
      x-fern-audiences:
      - sdk
      x-fern-availability: beta
      x-fern-sdk-group-name: workers.previews.deployments
      x-fern-sdk-method-name: edit
  /accounts/{account_id}/workers/workers/{worker_id}/previews/{preview_id}/deployments/{deployment_id}:
    delete:
      operationId: workers.previews.deployments.delete
      summary: Delete Preview Deployment
      description: Delete a preview deployment.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: worker_id
        in: path
        required: true
        schema:
          description: Identifier for the Worker, which can be ID or name.
          type: string
      - name: preview_id
        in: path
        required: true
        schema:
          description: Identifier for the Preview, which can be ID, slug, or URL-encoded name.
          type: string
      - name: deployment_id
        in: path
        required: true
        schema:
          description: Identifier for the deployment, which can be a UUID, a UUID prefix (minimum length 8), or the literal "latest" to operate on the most recently created deployment.
          type: string
      responses:
        '200':
          description: Delete Preview Deployment success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_api-response-common'
        4XX:
          description: Delete Preview Deployment failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Preview Deployments
      x-api-token-group:
      - Workers Scripts Write
      x-fern-audiences:
      - sdk
      x-fern-availability: beta
      x-fern-sdk-group-name: workers.previews.deployments
      x-fern-sdk-method-name: delete
      x-forge-require-confirmation: This will permanently delete the preview deployment.
    get:
      operationId: workers.previews.deployments.get
      summary: Get Preview Deployment
      description: Get details about a specific preview deployment.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: worker_id
        in: path
        required: true
        schema:
          description: Identifier for the Worker, which can be ID or name.
          type: string
      - name: preview_id
        in: path
        required: true
        schema:
          description: Identifier for the Preview, which can be ID, slug, or URL-encoded name.
          type: string
      - name: deployment_id
        in: path
        required: true
        schema:
          description: Identifier for the deployment, which can be a UUID, a UUID prefix (minimum length 8), or the literal "latest" to operate on the most recently created deployment.
          type: string
      - name: include
        in: query
        schema:
          description: Whether to include the `modules` property of the deployment in the response, which contains code and sourcemap content and may add several megabytes to the response size.
          type: string
          enum:
          - modules
      responses:
        '200':
          description: Get Preview Deployment success.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/workers_PreviewDeployment'
                  required:
                  - result
                  type: object
        4XX:
          description: Get Preview Deployment failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Preview Deployments
      x-api-token-group:
      - Workers Tail Read
      - Workers Scripts Write
      - Workers Scripts Read
      x-fern-audiences:
      - sdk
      x-fern-availability: beta
      x-fern-sdk-group-name: workers.previews.deployments
      x-fern-sdk-method-name: get
components:
  schemas:
    workers_assets:
      description: 'Configuration for assets within a Worker.


        [`_headers`](https://developers.cloudflare.com/workers/static-assets/headers/#custom-headers) and

        [`_redirects`](https://developers.cloudflare.com/workers/static-assets/redirects/) files should be

        included as modules named `_headers` and `_redirects` with content type `text/plain`.

        '
      type: object
      properties:
        config:
          description: Configuration for assets within a Worker.
          type: object
          properties:
            base_path:
              description: The public URL path prefix under which assets are served. A null request value resets it to `/`; responses represent the root as `/`. All versions in a gradual deployment must use the same canonical value. To change it, first deploy the version containing the change at 100%.
              type:
              - string
              - 'null'
              example: /docs/
              default: /
              x-auditable: true
              x-stainless-terraform-configurability: computed_optional
            html_handling:
              description: Determines the redirects and rewrites of requests for HTML content.
              type: string
              example: auto-trailing-slash
              default: auto-trailing-slash
              enum:
              - auto-trailing-slash
              - force-trailing-slash
              - drop-trailing-slash
              - none
              x-auditable: true
            not_found_handling:
              description: Determines the response when a request does not match a static asset, and there is no Worker script.
              type: string
              example: 404-page
              default: none
              enum:
              - none
              - 404-page
              - single-page-application
              x-auditable: true
            run_worker_first:
              default: false
              oneOf:
              - description: Contains a list path rules to control routing to either the Worker or assets. Glob (*) and negative (!) rules are supported. Rules must start with either '/' or '!/'. At least one non-negative rule must be provided, and negative rules have higher precedence than non-negative rules.
                example: '["/api/*", "/oauth/callback", "!/api/assets/*"]'
                items:
                  type: string
                type: array
              - description: Enables routing to always invoke the Worker script ahead of all requests. When true, this is equivalent to `["/*"]` in the string array version of this field.
                example: true
                type: boolean
        jwt:
          description: Token provided upon successful upload of all files from a registered manifest.
          type: string
          x-sensitive: true
    workers_api-response-collection:
      type: object
      allOf:
      - $ref: '#/components/schemas/workers_api-response-common'
      - properties:
          result_info:
            type: object
            properties:
              count:
                description: Total number of results for the requested service.
                type: number
                example: 1
              page:
                description: Current page within paginated list of results.
                type: number
                example: 1
              per_page:
                description: Number of results per page of results.
                type: number
                example: 20
              total_count:
                description: Total results available without any search parameters.
                type: number
                example: 2000
              total_pages:
                description: The number of total pages in the entire result set.
                type: number
                example: 100
        type: object
    workers_binding_kind_secrets_store_secret:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/workers_binding_name'
        secret_name:
          description: Name of the secret in the store.
          type: string
          example: my_secret
          x-auditable: true
        store_id:
          description: ID of the store containing the secret.
          type: string
          example: 8c8b1387108e49be85669169793e7bd2
          x-auditable: true
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - secrets_store_secret
          x-auditable: true
      required:
      - name
      - type
      - store_id
      - secret_name
    workers_binding_kind_data_blob:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/workers_binding_name'
        part:
          description: The name of the file containing the data content. Only accepted for `service worker syntax` Workers.
          type: string
          example: my-module.bin
          x-auditable: true
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - data_blob
          deprecated: true
          x-auditable: true
      required:
      - name
      - type
      - part
    workers_durable_object_export:
      description: 'A live Durable Object export (`state: created`, the default). The

        platform auto-provisions the namespace on first deploy, matches it

        on subsequent deploys, and never mutates or deletes it as a side

        effect of a code-only change. `storage` is required; `renamed_to`,

        `transferred_to` and `transfer_from` are not allowed on a live

        entry.

        '
      type: object
      properties:
        container:
          description: 'Name of the container (declared in the upload''s

            `metadata.containers`) that backs this Durable Object. When

            set, the namespace is container-enabled. Valid only on live

            entries.

            '
          type: string
          example: my-container
          maxLength: 128
        state:
          description: Live export. May be omitted; defaults to `created`.
          type: string
          default: created
          enum:
          - created
        storage:
          $ref: '#/components/schemas/workers_export_storage'
        type:
          description: Marks this entry as a Durable Object export.
          type: string
          enum:
          - durable-object
      additionalProperties: false
      required:
      - type
      - storage
    workers_binding_kind_ratelimit:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/workers_binding_name'
        namespace_id:
          description: Identifier of the rate limit namespace to bind to.
          type: string
          example: '1234'
          x-auditable: true
        simple:
          description: The rate limit configuration.
          type: object
          properties:
            limit:
              description: The limit (requests per period).
              type: number
              example: 100
              x-auditable: true
            mitigation_timeout:
              description: 'Duration in seconds to apply the mitigation action after the rate limit is exceeded. Valid values are 0 (disabled), 10, or multiples of 60 up to 86400. Must be greater than or equal to the period when non-zero.

                '
              type: integer
              example: 60
              x-auditable: true
            period:
              description: The period in seconds.
              type: integer
              example: 60
              x-auditable: true
          required:
          - limit
          - period
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - ratelimit
          x-auditable: true
      required:
      - name
      - type
      - namespace_id
      - simple
    workers_binding_kind_assets:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/workers_binding_name'
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - assets
          x-auditable: true
      required:
      - name
      - type
    workers_binding_kind_vectorize:
      type: object
      properties:
        index_name:
          description: Name of the Vectorize index to bind to.
          type: string
          example: my-index-name
          x-auditable: true
        name:
          $ref: '#/components/schemas/workers_binding_name'
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - vectorize
          x-auditable: true
      required:
      - name
      - type
      - index_name
    workers_binding_kind_inherit:
      type: object
      properties:
        name:
          description: The name of the inherited binding.
          type: string
          example: MY_BINDING
          x-auditable: true
        old_name:
          description: The old name of the inherited binding. If set, the binding will be renamed from `old_name` to `name` in the new version. If not set, the binding will keep the same name between versions.
          type: string
          example: MY_OLD_BINDING
          x-auditable: true
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - inherit
          x-auditable: true
        version_id:
          description: Identifier for the version to inherit the binding from, which can be the version ID or the literal "latest" to inherit from the latest version. Defaults to inheriting the binding from the latest version.
          type: string
          example: 8969331f-7192-434c-9938-6aea24ed58bf
          default: latest
          x-auditable: true
      required:
      - name
      - type
    workers_exports_config_map:
      description: 'Declarative exports for the Worker, keyed by export name. Worker

        entrypoint entries (`type: worker`) carry cache configuration for

        that entrypoint. Durable Object entries (`type: durable-object`)

        are also configured here and drive namespace reconciliation. At

        most 100 entries; class names are at most 128 characters.

        '
      type: object
      example:
        Admin:
          cache:
            enabled: true
          type: worker
        Counter:
          storage: sqlite
          type: durable-object
        OldCounter:
          renamed_to: Counter
          state: renamed
          type: durable-object
        default:
          cache:
            enabled: false
          type: worker
      additionalProperties:
        $ref: '#/components/schemas/workers_export_config'
      maxProperties: 100
    workers_binding_name:
      description: A JavaScript variable name for the binding.
      type: string
      example: myBinding
      x-auditable: true
    workers_exports_reconciliation_result:
      description: 'Summary of what the declarative exports reconciliation did on this

        upload. Present only on uploads that included an `exports` block.

        Reconciliation acts on Durable Object entries; `type: worker`

        entries in the same map do not participate. Every array is always

        present (possibly empty) so clients can iterate unconditionally.

        Clients should surface `warnings` prominently, render `info` at

        lower visibility, and use `removable_entries` as the "safe to

        delete from your config" hint.

        '
      type: object
      properties:
        created:
          description: Class names for which a new namespace was provisioned.
          type: array
          items:
            type: string
        deleted:
          description: Class names whose namespace was deleted by a `deleted` tombstone.
          type: array
          items:
            type: string
        info:
          description: 'Non-blocking info entries (stale tombstones, tombstone applied

            with class still in code). See `exports_reconciliation_info`.

            '
          type: array
          items:
            $ref: '#/components/schemas/workers_exports_reconciliation_info'
        removable_entries:
          description: 'Source class names whose tombstone entry is now stale and safe

            to delete from `exports` (no remaining referencing scripts).

            '
          type: array
          items:
            type: string
        renamed:
          description: Applied `renamed` tombstones.
          type: array
          items:
            $ref: '#/components/schemas/workers_exports_reconciliation_rename'
        transfer_pending:
          description: Phase-1 transfer hints recorded on the target side.
          type: array
          items:
            $ref: '#/components/schemas/workers_exports_reconciliation_transfer_pending'
        transferred:
          description: Committed `transferred` tombstones (phase-2).
          type: array
          items:
            $ref: '#/components/schemas/workers_exports_reconciliation_transfer'
        updated:
          description: Class names whose provisioned namespace was mutated in place.
          type: array
          items:
            type: string
        warnings:
          description: Non-blocking warnings. See `exports_reconciliation_warning`.
          type: array
          items:
            $ref: '#/components/schemas/workers_exports_reconciliation_warning'
      readOnly: true
      required:
      - created
      - updated
      - deleted
      - renamed
      - transferred
      - transfer_pending
      - warnings
      - info
      - removable_entries
    workers_migration_step:
      type: object
      properties:
        deleted_classes:
          description: A list of classes to delete Durable Object namespaces from.
          type: array
          items:
            type: string
            x-auditable: true
          writeOnly: true
        new_classes:
          description: A list of classes to create Durable Object namespaces from.
          type: array
          items:
            type: string
            x-auditable: true
          writeOnly: true
        new_sqlite_classes:
          description: A list of classes to create Durable Object namespaces with SQLite from.
          type: array
          items:
            type: string
            x-auditable: true
          writeOnly: true
        renamed_classes:
          description: A list of classes with Durable Object namespaces that were renamed.
          type: array
          items:
            properties:
              from:
                type: string
                writeOnly: true
                x-auditable: true
              to:
                type: string
                writeOnly: true
                x-auditable: true
            type: object
          writeOnly: true
        transferred_classes:
          description: A list of transfers for Durable Object namespaces from a different Worker and class to a class defined in this Worker.
          type: array
          items:
            properties:
              from:
                type: string
                writeOnly: true
                x-auditable: true
              from_script:
                type: string
                writeOnly: true
                x-auditable: true
              to:
                type: string
                writeOnly: true
                x-auditable: true
            type: object
          writeOnly: true
    workers_binding_item:
      description: A binding to allow the Worker to communicate with resources.
      type: object
      discriminator:
        mapping:
          ai: '#/components/schemas/workers_binding_kind_ai'
          ai_search: '#/components/schemas/workers_binding_kind_ai_search'
          ai_search_namespace: '#/components/schemas/workers_binding_kind_ai_search_namespace'
          analytics_engine: '#/components/schemas/workers_binding_kind_analytics_engine'
          artifacts: '#/components/schemas/workers_binding_kind_artifacts'
          assets: '#/components/schemas/workers_binding_kind_assets'
          browser: '#/components/schemas/workers_binding_kind_browser'
          d1: '#/components/schemas/workers_binding_kind_d1'
          data_blob: '#/components/schemas/workers_binding_kind_data_blob'
          dispatch_namespace: '#/components/schemas/workers_binding_kind_dispatch_namespace'
          durable_object_namespace: '#/components/schemas/workers_binding_kind_durable_object_namespace'
          flagship: '#/components/schemas/workers_binding_kind_flagship'
