          example:
          - user1@example.com
          - user2@example.com
          x-auditable: true
        destination_address:
          description: Destination address for the email.
          type: string
          format: email
          example: user@example.com
          x-auditable: true
        name:
          $ref: '#/components/schemas/workers_binding_name'
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - send_email
          x-auditable: true
      required:
      - name
      - type
    workers_binding_kind_vpc_service:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/workers_binding_name'
        service_id:
          description: Identifier of the VPC service to bind to.
          type: string
          example: 8c8b1387108e49be85669169793e7bd2
          x-auditable: true
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - vpc_service
          x-auditable: true
      required:
      - name
      - type
      - service_id
    workers_durable_object_deleted_export:
      description: 'A `deleted` tombstone: retires the provisioned namespace for this

        class and all of its data. The class must be absent from the

        uploaded code and no other Worker in the account may bind to the

        namespace, otherwise the deploy is rejected. No other fields are

        allowed. Deletion is irreversible.

        '
      type: object
      properties:
        state:
          description: Tombstone that deletes the namespace.
          type: string
          enum:
          - deleted
        type:
          description: Marks this entry as a Durable Object export.
          type: string
          enum:
          - durable-object
      additionalProperties: false
      required:
      - type
      - state
    workers_durable_object_renamed_export:
      description: 'A `renamed` tombstone: rewrites the provisioned namespace''s class

        name from this map key to `renamed_to`. The source class may stay

        in code during the rollout window (an info notice is emitted).

        `storage`, `transferred_to` and `transfer_from` are not allowed.

        '
      type: object
      properties:
        renamed_to:
          description: 'The destination class name. Must differ from the source class

            (the map key) and must be declared as a live (`created`) entry

            in the same `exports` map. Write-only: never present in GET

            responses.

            '
          type: string
          example: NewName
          maxLength: 128
          writeOnly: true
        state:
          description: Tombstone that renames the namespace's class.
          type: string
          enum:
          - renamed
        type:
          description: Marks this entry as a Durable Object export.
          type: string
          enum:
          - durable-object
      additionalProperties: false
      required:
      - type
      - state
      - renamed_to
    workers_binding_kind_d1:
      type: object
      properties:
        database_id:
          description: Identifier of the D1 database to bind to.
          type: string
          example: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
          x-auditable: true
        id:
          description: Identifier of the D1 database to bind to.
          type: string
          example: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
          deprecated: true
          x-auditable: true
          x-stainless-deprecation-message: This property has been renamed to `database_id`.
        name:
          $ref: '#/components/schemas/workers_binding_name'
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - d1
          x-auditable: true
      required:
      - name
      - type
      - database_id
    workers_binding_kind_analytics_engine:
      type: object
      properties:
        dataset:
          description: The name of the dataset to bind to.
          type: string
          example: some_dataset
          x-auditable: true
        name:
          $ref: '#/components/schemas/workers_binding_name'
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - analytics_engine
          x-auditable: true
      required:
      - name
      - type
      - dataset
    workers_PreviewDeploymentRequest:
      description: Preview deployment configuration with base64-encoded modules.
      allOf:
      - $ref: '#/components/schemas/workers_PreviewDeploymentConfig'
      - properties:
          modules:
            description: Code, sourcemaps, and other content used at runtime.
            type: array
            items:
              properties:
                content_base64:
                  description: The base64-encoded module content.
                  type: string
                  format: byte
                  example: ZXhwb3J0IGRlZmF1bHQgewogIGFzeW5jIGZldGNoKHJlcXVlc3QsIGVudiwgY3R4KSB7CiAgICByZXR1cm4gbmV3IFJlc3BvbnNlKCdIZWxsbyBXb3JsZCEnKQogIH0KfQ==
                content_type:
                  description: The content type of the module.
                  type: string
                  example: application/javascript+module
                name:
                  description: The name of the module.
                  type: string
                  example: index.js
              required:
              - name
              - content_type
              - content_base64
              type: object
            x-stainless-collection-type: set
        type: object
    workers_cache_options:
      description: 'Global CacheW configuration for the Worker. When caching is on,

        the platform provisions a `cloudflare.app` zone for the Worker.

        A `type: worker` entry in the `exports` map can override this

        value for a single entrypoint.

        '
      type: object
      properties:
        cross_version_cache:
          description: 'Whether cached responses are shared across Worker version

            uploads. This is independent of `enabled`. It can stay true

            while caching is off, so the preference survives turning

            caching off and back on.

            '
          type: boolean
          example: true
          default: false
          x-auditable: true
        enabled:
          description: Whether caching is enabled for this Worker.
          type: boolean
          example: true
          default: false
          x-auditable: true
      additionalProperties: false
      required:
      - enabled
    workers_binding_kind_json:
      type: object
      properties:
        json:
          description: JSON data to use.
          type: object
          x-stainless-any: true
        name:
          $ref: '#/components/schemas/workers_binding_name'
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - json
          x-auditable: true
      required:
      - name
      - type
      - json
    workers_exports_reconciliation_transfer:
      description: A single committed `transferred` tombstone (phase-2 commit).
      type: object
      properties:
        class:
          description: The source class name that was transferred.
          type: string
        phase:
          description: The transfer phase. Currently always `committed`.
          type: string
          example: committed
          enum:
          - committed
        to:
          description: The destination script that now owns the namespace.
          type: string
      required:
      - class
      - to
      - phase
    workers_export_config:
      description: 'A single entry in the `exports` map, keyed by export name (a

        `WorkerEntrypoint` class name, a Durable Object class name, or

        `default` for the Worker''s default export). The `type`

        discriminator selects the top-level shape: `worker` entrypoint

        entries may carry `cache` configuration, while `durable-object`

        entries are further refined by the optional `state` field

        (default `created`). Tombstone states (`deleted`, `renamed`,

        `transferred`) express destructive lifecycle operations

        declaratively; `expecting-transfer` is the live target side of a

        transfer. The server validates the exact per-(type, state) field

        combinations; fields not listed for a variant are rejected.

        '
      discriminator:
        mapping:
          durable-object: '#/components/schemas/workers_durable_object_export_variants'
          worker: '#/components/schemas/workers_worker_export'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/workers_worker_export'
      - $ref: '#/components/schemas/workers_durable_object_export_variants'
    workers_containers:
      description: List of containers attached to a Worker. Containers can only be attached to Durable Object classes of this Worker script.
      type: array
      items:
        $ref: '#/components/schemas/workers_container_item'
      example:
      - class_name: MyDurableObject
      x-stainless-collection-type: set
    workers_placement_target:
      description: A target to run your Worker near.
      type: object
      oneOf:
      - additionalProperties: false
        properties:
          region:
            description: Cloud region in format 'provider:region'.
            type: string
            example: aws:us-east-1
        required:
        - region
        type: object
      - additionalProperties: false
        properties:
          hostname:
            description: HTTP hostname for targeted placement.
            type: string
            example: api.example.com
        required:
        - hostname
        type: object
      - additionalProperties: false
        properties:
          host:
            description: TCP host:port for targeted placement.
            type: string
            example: db.example.com:5432
        required:
        - host
        type: object
    workers_binding_kind_mtls_certificate:
      type: object
      properties:
        certificate_id:
          description: Identifier of the certificate to bind to.
          type: string
          example: efwu2n6s-q69d-2kr9-184j-4913e8h391k6
          x-auditable: true
        name:
          $ref: '#/components/schemas/workers_binding_name'
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - mtls_certificate
          x-auditable: true
      required:
      - name
      - type
      - certificate_id
    workers_container_item:
      description: Container configuration for a Worker.
      type: object
      properties:
        class_name:
          description: Select which Durable Object class should get this container attached.
          type: string
          x-auditable: true
      required:
      - class_name
    workers_binding_kind_durable_object_namespace:
      type: object
      properties:
        class_name:
          description: The exported class name of the Durable Object.
          type: string
          example: MyDurableObject
          x-auditable: true
          x-stainless-terraform-configurability: computed_optional
        dispatch_namespace:
          description: The dispatch namespace the Durable Object script belongs to.
          type: string
          example: my-dispatch-namespace
          x-auditable: true
        environment:
          description: The environment of the script_name to bind to.
          type: string
          example: production
          x-auditable: true
        name:
          $ref: '#/components/schemas/workers_binding_name'
        namespace_id:
          allOf:
          - $ref: '#/components/schemas/workers_namespace_identifier'
          - type: string
            x-auditable: true
            x-stainless-terraform-configurability: computed_optional
        script_name:
          description: The script where the Durable Object is defined, if it is external to this Worker.
          type: string
          example: my-other-worker
          x-auditable: true
          x-stainless-terraform-configurability: computed_optional
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - durable_object_namespace
          x-auditable: true
      required:
      - name
      - type
    workers_binding_kind_plain_text:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/workers_binding_name'
        text:
          description: The text value to use.
          type: string
          example: Hello, world!
          x-auditable: true
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - plain_text
          x-auditable: true
      required:
      - name
      - type
      - text
    workers_worker_export:
      description: 'A named Worker entrypoint export (`type: worker`). Worker

        entrypoints are always live (`state: created`) and carry no

        storage or lifecycle fields. The optional `cache` block overrides

        the Worker''s global `cache_options.enabled` for this entrypoint.

        '
      type: object
      properties:
        cache:
          description: 'Cache override for this entrypoint. Overrides the Worker''s

            global `cache_options.enabled` for this entrypoint only.

            '
          allOf:
          - $ref: '#/components/schemas/workers_entrypoint_cache_options'
        state:
          description: Live export. May be omitted; defaults to `created`.
          type: string
          default: created
          enum:
          - created
        type:
          description: Marks this entry as a Worker entrypoint export.
          type: string
          enum:
          - worker
      additionalProperties: false
      required:
      - type
    workers_binding_kind_r2_bucket:
      type: object
      properties:
        bucket_name:
          description: R2 bucket to bind to.
          type: string
          example: my-r2-bucket
          x-auditable: true
        jurisdiction:
          description: The [jurisdiction](https://developers.cloudflare.com/r2/reference/data-location/#jurisdictional-restrictions) of the R2 bucket.
          type: string
          example: eu
          enum:
          - eu
          - fedramp
          - fedramp-high
          - us
          x-auditable: true
        name:
          $ref: '#/components/schemas/workers_binding_name'
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - r2_bucket
          x-auditable: true
      required:
      - name
      - type
      - bucket_name
    workers_compatibility_date:
      description: Date indicating targeted support in the Workers runtime. Backwards incompatible fixes to the runtime following this date will not affect this Worker.
      type: string
      example: '2021-01-01T00:00:00Z'
      x-auditable: true
    workers_durable_object_expecting_transfer_export:
      description: 'The target side of a two-phase transfer (`state:

        expecting-transfer`). Declares that this script expects to receive

        a namespace for this class from the `transfer_from` script. This

        is a live entry, not a tombstone: bindings resolve through the

        source''s namespace until the source commits with a `transferred`

        tombstone. `storage` and `transfer_from` are required; `renamed_to`

        and `transferred_to` are not allowed.

        '
      type: object
      properties:
        container:
          description: 'Name of the container (declared in the upload''s

            `metadata.containers`) that backs this Durable Object once the

            transfer settles. Valid only on live entries.

            '
          type: string
          example: my-container
          maxLength: 128
        state:
          description: Target side of a two-phase transfer.
          type: string
          enum:
          - expecting-transfer
        storage:
          $ref: '#/components/schemas/workers_export_storage'
        transfer_from:
          description: 'The source script name to receive the namespace from. Must be

            in the same account and dispatch-namespace context. Present on

            reads for `expecting-transfer` entries.

            '
          type: string
          example: source-worker
          maxLength: 128
        type:
          description: Marks this entry as a Durable Object export.
          type: string
          enum:
          - durable-object
      additionalProperties: false
      required:
      - type
      - state
      - storage
      - transfer_from
    workers_api-response-common:
      type: object
      properties:
        errors:
          $ref: '#/components/schemas/workers_messages'
        messages:
          $ref: '#/components/schemas/workers_messages'
        success:
          description: Whether the API call was successful.
          type: boolean
          example: true
          enum:
          - true
      required:
      - success
      - errors
      - messages
    workers_exports_reconciliation_transfer_pending:
      description: 'A single phase-1 transfer hint recorded on the target side (a live

        `expecting-transfer` entry).

        '
      type: object
      properties:
        class:
          description: The target-side class name awaiting transfer.
          type: string
        from:
          description: The source script the namespace will be transferred from.
          type: string
      required:
      - class
      - from
    workers_migration_tag_conditions:
      type: object
      properties:
        new_tag:
          description: Tag to set as the latest migration tag.
          type: string
          example: v2
          writeOnly: true
          x-auditable: true
        old_tag:
          description: Tag used to verify against the latest migration tag for this Worker. If they don't match, the upload is rejected.
          type: string
          example: v1
          writeOnly: true
          x-auditable: true
    workers_exports_reconciliation_rename:
      description: A single applied `renamed` tombstone.
      type: object
      properties:
        from:
          description: The original (source) class name.
          type: string
        to:
          description: The new class name (`renamed_to`).
          type: string
      required:
      - from
      - to
    workers_binding_kind_messaging:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/workers_binding_name'
        namespace:
          description: The Messaging namespace to bind to.
          type: string
          example: production
          x-auditable: true
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - messaging
          x-auditable: true
      required:
      - name
      - type
      - namespace
    workers_durable_object_export_variants:
      description: 'Any Durable Object export entry (`type: durable-object`), across

        all lifecycle states. The optional `state` field selects the

        variant (default `created`); the tombstone states (`deleted`,

        `renamed`, `transferred`) and the live transfer target

        (`expecting-transfer`) are the alternatives. The server validates

        the exact per-state field combinations; fields not listed for a

        variant are rejected.

        '
      oneOf:
      - $ref: '#/components/schemas/workers_durable_object_export'
      - $ref: '#/components/schemas/workers_durable_object_deleted_export'
      - $ref: '#/components/schemas/workers_durable_object_renamed_export'
      - $ref: '#/components/schemas/workers_durable_object_transferred_export'
      - $ref: '#/components/schemas/workers_durable_object_expecting_transfer_export'
    workers_binding_kind_k2:
      description: A K2 stream binding. Available only to accounts enabled for K2.
      type: object
      properties:
        name:
          $ref: '#/components/schemas/workers_binding_name'
        stream:
          description: ID of a K2 stream owned by the account deploying the Worker.
          type: string
          example: 0123456789abcdef0123456789abcdef
          pattern: ^[a-f0-9]{32}$
          x-auditable: true
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - k2
          x-auditable: true
      required:
      - name
      - type
      - stream
    workers_entrypoint_cache_options:
      description: 'CacheW configuration for a single `type: worker` entrypoint.

        When present it overrides the Worker''s global

        `cache_options.enabled` for that entrypoint, so a Worker can turn

        caching on globally and opt one entrypoint out, or the reverse.

        '
      type: object
      properties:
        enabled:
          description: Whether caching is enabled for this entrypoint.
          type: boolean
          example: true
          x-auditable: true
      additionalProperties: false
      required:
      - enabled
    workers_exports_reconciliation_error:
      description: 'A single blocking reconciliation error. Returned in the v4 error

