              `type: worker` entries do not contribute to this summary.

              '
            allOf:
            - $ref: '#/components/schemas/workers_exports_reconciliation_result'
          id:
            description: Deployment identifier.
            type: string
            format: uuid
            readOnly: true
            x-auditable: true
          migration_tag:
            description: Durable Object migration tag. Omitted if the Preview does not use Durable Objects.
            type: string
            example: v1
            readOnly: true
          number:
            description: The integer deployment number, starting from one.
            type: integer
            readOnly: true
            x-auditable: true
          source:
            description: The client used to create the deployment.
            type: string
            example: wrangler
            readOnly: true
            x-auditable: true
          startup_time_ms:
            description: Time in milliseconds spent on Worker startup.
            type: integer
            example: 10
            readOnly: true
            x-auditable: true
          urls:
            description: All routable URLs that always point to this deployment.
            type: array
            items:
              format: uri
              type: string
            example:
