    cc_ContainersModifyApplicationRequestBody:
      description: 'Request body for modifying a Containers application without replacing its instances.

        Durable Object-managed applications support only top-level observability.logs.enabled.

        The other fields apply to scheduler-backed applications, where deployment configuration

        changes such as image, resource allocation, command, and environment variables require

