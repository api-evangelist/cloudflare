openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Applications API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Applications
paths:
  /accounts/{account_id}/containers/applications:
    parameters:
    - $ref: '#/components/parameters/cc_AccountId'
    get:
      operationId: listApplications
      summary: List Applications associated with your account
      description: Lists all the applications that are associated with your account.
      parameters:
      - name: per_page
        in: query
        description: Maximum number of applications to return per page. Defaults to all, or 100 when `page_token` is set.
        schema:
          type: integer
          maximum: 500
          minimum: 1
      - name: page_token
        in: query
        description: Opaque token from a previous response to retrieve the next page.
        schema:
          type: string
      - name: name
        in: query
        description: Filter applications by name.
        schema:
          $ref: '#/components/schemas/cc_ApplicationName'
      - name: image
        in: query
        description: Filter applications by image.
        schema:
          $ref: '#/components/schemas/cc_Image'
      responses:
        '200':
          description: Get all application associated with your account.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/cc_V4BaseResponse'
                - properties:
                    result:
                      $ref: '#/components/schemas/cc_ContainersListApplications'
                    result_info:
                      $ref: '#/components/schemas/cc_V4PaginatedResultInfo'
                  required:
                  - result
                  - result_info
                  type: object
        '400':
          description: Bad Request that contains a specific constant code and details object about the error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
        '500':
          description: An internal error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Applications
      x-fern-availability: generally-available
      x-fern-pagination:
        cursor: $request.page_token
        next_cursor: $response.result_info.next_page_token
        results: $response.result
      x-fern-sdk-group-name: containers.applications
      x-fern-sdk-method-name: list
    post:
      operationId: createApplication
      summary: Create a new application
      description: 'Create a Containers application.


        Use `scheduling_policy: "default"` for a scheduler-backed application. The

        Containers scheduler maintains the requested instance count and manages

        deployment configuration, placement, scaling, versions, and rollouts.


        Use `scheduling_policy: "durable_object"` for a Durable Object-managed

        application. Each Durable Object creates and manages the lifecycle of its

        container instance. Supply `name`, `scheduling_policy`, and `durable_objects`,

        with optional `configuration` and optional top-level `observability` settings.

        Deployment configuration, scaling, constraints, versions, and rollouts do not apply.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cc_ContainersCreateApplicationRequest'
      responses:
        '201':
          description: A newly created application.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/cc_V4BaseResponse'
                - properties:
                    result:
                      $ref: '#/components/schemas/cc_ContainersApplicationResponse'
                  required:
                  - result
                  type: object
        '400':
          description: Could not create the application because of input/limits reasons, more details in the error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
        '403':
          description: The account is deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
        '500':
          description: An internal error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Applications
      x-fern-availability: generally-available
      x-fern-sdk-group-name: containers.applications
      x-fern-sdk-method-name: create
  /accounts/{account_id}/containers/applications/{application_id}:
    parameters:
    - $ref: '#/components/parameters/cc_AccountId'
    delete:
      operationId: deleteApplication
      summary: Delete a single application by id
      description: Deletes a single application by id.
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cc_ApplicationID'
      responses:
        '200':
          description: Delete application response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/cc_V4BaseResponse'
                - properties:
                    result:
                      $ref: '#/components/schemas/cc_ContainersDeleteApplicationResponseBody'
                  required:
                  - result
                  type: object
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
        '404':
          description: Response body when an Application is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
        '500':
          description: An internal error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Applications
      x-api-token-group:
      - Workers Containers Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: containers.applications
      x-fern-sdk-method-name: delete
      x-forge-require-confirmation: This operation permanently deletes the application and stops its containers.
    get:
      operationId: getApplication
      summary: Get a single application by id
      description: Returns a single application by id.
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cc_ApplicationID'
      responses:
        '200':
          description: A single application.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/cc_V4BaseResponse'
                - properties:
                    result:
                      $ref: '#/components/schemas/cc_ContainersApplicationResponse'
                  required:
                  - result
                  type: object
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
        '404':
          description: Response body when an Application is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
        '500':
          description: An internal error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Applications
      x-api-token-group:
      - Workers Containers Write
      - Workers Containers Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: containers.applications
      x-fern-sdk-method-name: get
    patch:
      operationId: modifyApplication
      summary: Modify an application
      description: 'Modifies a single application by id. Durable Object-managed application settings are

        published to runtime metadata without creating deployments or rollouts. Top-level

        `observability` for these applications supports only `logs.enabled`.

        The supported fields depend on the existing

        application''s scheduling policy. For scheduler-backed applications, changes that

        replace instance deployment configuration, including the image, require a rollout.'
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cc_ApplicationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cc_ContainersModifyApplicationRequestBody'
      responses:
        '200':
          description: Modify application response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/cc_V4BaseResponse'
                - properties:
                    result:
                      $ref: '#/components/schemas/cc_ContainersApplicationResponse'
                  required:
                  - result
                  type: object
        '400':
          description: Could not modify the application because of input/limits reasons, more details in the error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
        '403':
          description: The account is deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
        '404':
          description: Response body when an Application is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
        '500':
          description: An internal error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Applications
      x-api-token-group:
      - Workers Containers Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: containers.applications
      x-fern-sdk-method-name: edit
  /accounts/{account_id}/containers/applications/{application_id}/versions:
    parameters:
    - $ref: '#/components/parameters/cc_AccountId'
    get:
      operationId: listApplicationVersions
      summary: List all application versions
      description: 'Returns all versions for a scheduler-backed application with

        `scheduling_policy: "default"`. Versions and rollouts do not apply to

        applications with `scheduling_policy: "durable_object"`.'
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/cc_ApplicationID'
      responses:
        '200':
          description: List application versions.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/cc_V4BaseResponse'
                - properties:
                    result:
                      type: array
                      items:
                        $ref: '#/components/schemas/cc_ApplicationVersion'
                  required:
                  - result
                  type: object
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
        '404':
          description: Response body when an Application is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
        '500':
          description: An internal error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cc_V4BaseErrorResponse'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Applications
      x-api-token-group:
      - Workers Containers Write
      - Workers Containers Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: containers.applications.versions
      x-fern-sdk-method-name: list
  /accounts/{account_id}/one/applications:
    get:
      operationId: list_applications_v2
      summary: List applications
      description: Returns a list of available applications with use cases and permissions.
      parameters:
      - name: account_id
        in: path
        description: Cloudflare account identifier.
        required: true
        schema:
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
      - name: environment
        in: query
        description: Filter by supported environment (standard, fedramp).
        schema:
          type: string
      - name: page
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      responses:
        '200':
          description: List of applications.
          content:
            application/json:
              examples:
                SampleSuccessfulReturn:
                  summary: Example application list response
                  value:
                    errors: []
                    messages: []
                    result:
                    - auth_methods:
                      - display_name: OAuth 2.0 Admin Consent
                        id: oauth2_standard
                      category: Productivity
                      description: Monitor OneDrive, SharePoint, Teams, and Outlook.
                      display_name: Microsoft
                      dlp_enabled: true
                      id: MICROSOFT_INTERNAL
                      logo: https://dash.cloudflare.com/v2/static/microsoft_internal.svg
                      permissions:
                      - display_name: Read all users' full profiles
                        scope: User.Read.All
                        severity: high
                      - display_name: Read all files
                        scope: Files.Read.All
                        severity: high
                      - display_name: Read and write mail
                        scope: Mail.ReadWrite
                        severity: critical
                      supported_environments:
                      - standard
                      - fedramp
                      use_cases:
                      - display_name: Cloud Access Security Broker
                        id: casb
                      - display_name: Cloud Email Security
                        id: ces
                    result_info:
                      count: 1
                      next: null
                      page: 1
                      per_page: 10
                      previous: null
                      total_count: 1
                    success: true
              schema:
                $ref: '#/components/schemas/one_PaginatedApplicationListList'
        '400':
          description: Invalid request.
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Applications
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.casb.applications
      x-fern-sdk-method-name: list
      x-stability: beta
  /accounts/{account_id}/one/applications/{application_id}:
    get:
      operationId: get_application_v2
      summary: Get application details
      description: Returns full application details including auth methods, use cases, and permissions.
      parameters:
      - name: account_id
        in: path
        description: Cloudflare account identifier.
        required: true
        schema:
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
      - name: application_id
        in: path
        description: Application/vendor identifier.
        required: true
        schema:
          type: string
          enum:
          - ANTHROPIC
          - AWS
          - BITBUCKET
          - BOX
          - CONFLUENCE
          - DROPBOX
          - GITHUB
          - GOOGLE_CLOUD_PLATFORM
          - GOOGLE_WORKSPACE
          - JIRA
          - MICROSOFT_INTERNAL
          - OPENAI
          - SALESFORCE
          - SERVICENOW
          - SLACK
      responses:
        '200':
          description: Application details.
          content:
            application/json:
              examples:
                SampleSuccessfulReturn:
                  summary: Example application detail response
                  value:
                    errors: []
                    messages: []
                    result:
                      auth_methods:
                      - display_name: OAuth 2.0 Admin Consent
                        id: oauth2
                        is_default: true
                        supported_environments:
                        - standard
                        - fedramp
                      category: Productivity
                      description: Monitor OneDrive, SharePoint, Teams, and Outlook.
                      display_name: Microsoft
                      dlp_enabled: true
                      id: MICROSOFT_INTERNAL
                      instructions: You'll need a Microsoft 365 admin account with Global Admin or Application Admin role.
                      logo: https://dash.cloudflare.com/v2/static/microsoft_internal.svg
                      use_cases:
                      - base_scopes:
                        - display_name: Read all users' full profiles
                          scope: User.Read.All
                          severity: high
                        - display_name: Read all files
                          scope: Files.Read.All
                          severity: high
                        description: Discover and secure SaaS applications
                        display_name: Cloud Access Security Broker
                        features:
                        - description: Automatically remediate security issues
                          display_name: Auto Remediation
                          id: auto_remediation
                          scopes:
                          - display_name: Read and write all files
                            scope: Files.ReadWrite.All
                            severity: critical
                        id: casb
                    success: true
              schema:
                $ref: '#/components/schemas/one_ApplicationDetailResponse'
        '404':
          description: Application not found.
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Applications
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.casb.applications
      x-fern-sdk-method-name: get
      x-stability: beta
  /accounts/{account_id}/one/applications/{application_id}/auth-methods:
    get:
      operationId: get_application_auth_methods_v2
      summary: Get auth methods
      description: Returns available auth methods for the specified vendor, including credential schema, instructions, and example payloads. Use this to understand what credentials are required before calling POST /v2/integrations.
      parameters:
      - name: account_id
        in: path
        description: Cloudflare account identifier.
        required: true
        schema:
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
      - name: application_id
        in: path
        description: Application/vendor identifier.
        required: true
        schema:
          type: string
          enum:
          - ANTHROPIC
          - AWS
          - BITBUCKET
          - BOX
          - CONFLUENCE
          - DROPBOX
          - GITHUB
          - GOOGLE_CLOUD_PLATFORM
          - GOOGLE_WORKSPACE
          - JIRA
          - MICROSOFT_INTERNAL
          - OPENAI
          - SALESFORCE
          - SERVICENOW
          - SLACK
      - name: page
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      responses:
        '200':
          description: Auth methods available for this application.
          content:
            application/json:
              examples:
                SampleSuccessfulReturn:
                  summary: Example auth methods response
                  value:
                    errors: []
                    messages: []
                    result:
                    - display_name: API Key
                      human_interaction_required: false
                      id: api_key
                      instructions:
                        markdown: '## Getting your API Key


                          1. Log in to your admin console

                          2. Navigate to Settings > API

                          3. Generate a new API key'
                      payload_example:
                        api_key: sk-xxxxxxxxxxxxxxxxxxxx
                      payload_schema:
                        properties:
                          api_key:
                            description: Your API key
                            type: string
                        required:
                        - api_key
                        type: object
                      redirect_url: null
                    result_info:
                      count: 1
                      next: null
                      page: 1
                      per_page: 10
                      previous: null
                      total_count: 1
                    success: true
              schema:
                $ref: '#/components/schemas/one_PaginatedAuthMethodDetailList'
        '404':
          description: Application not found.
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Applications
      x-fern-availability: generally-available
      x-fern-sdk-group-name: zero-trust.casb.applications.auth-methods
      x-fern-sdk-method-name: list
      x-stability: beta
  /accounts/{account_id}/one/applications/{application_id}/setup-flows:
    get:
      operationId: get_application_setup_flows_v2
      summary: Get application setup flows
      description: Returns all available setup flows for the application, one per auth method.
      parameters:
      - name: account_id
        in: path
        description: Cloudflare account identifier.
        required: true
        schema:
          type: string
          example: 023e105f4ecef8ad9ca31a8372d0c353
      - name: application_id
        in: path
        description: Application/vendor identifier.
        required: true
        schema:
          type: string
          enum:
          - ANTHROPIC
          - AWS
          - BITBUCKET
          - BOX
          - CONFLUENCE
          - DROPBOX
          - GITHUB
          - GOOGLE_CLOUD_PLATFORM
          - GOOGLE_WORKSPACE
          - JIRA
          - MICROSOFT_INTERNAL
          - OPENAI
          - SALESFORCE
          - SERVICENOW
          - SLACK
      - name: auth_method
        in: query
        description: Filter by auth method id. Get available ids from GET /v2/applications.
        schema:
          type: string
      - name: environment
        in: query
        description: Filter by environment.
        schema:
          type: string
          enum:
          - fedramp
          - standard
      - name: page
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      responses:
        '200':
          description: List of setup flows.
          content:
            application/json:
              examples:
                SampleSuccessfulReturn:
                  summary: Example setup flow response
                  value:
                    errors: []
                    messages: []
                    result:
                    - auth_config:
                        authorization_url: https://login.microsoftonline.com/common/adminconsent
                        client_id: abc123-def456
                        requires_pkce: false
                        scopes:
                        - https://graph.microsoft.com/.default
                        url_placeholders: []
                      default: true
                      description: Connect to Microsoft using OAuth 2.0 Admin Consent.
                      id: microsoft_internal_oauth2
                      name: Microsoft (OAuth 2.0 Admin Consent)
                      steps:
                      - component_id: common/name_integration
                        parameters: null
                        type: component
                      - description: Click the button to be redirected to the vendor and grant access.
                        dynamic_content: null
                        title: Authorize Application
                        type: oauth_redirect
                      supported_environments:
                      - standard
                      - fedramp
                    result_info:
                      count: 1
                      next: null
                      page: 1
                      per_page: 10
                      previous: null
                      total_count: 1
                    success: true
              schema:
                $ref: '#/components/schemas/one_PaginatedSetupFlowList'
        '404':
          description: Application not found or no flows available.
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Applications
      x-fern-availability: generally-available
      x-fern-ignore: true
      x-fern-sdk-group-name: zero-trust.casb.applications.setup-flows
      x-fern-sdk-method-name: list
      x-stability: beta
  /accounts/{account_id}/resource-library/applications:
    get:
      operationId: getResourceLibraryApplications
      summary: List applications
      description: 'List the applications available to an account, both the applications Cloudflare

        curates and the custom applications the account has defined.


        Results are paginated. Use `filter` and `search` to narrow the list, `order_by` to

        sort it, and `fields` to reduce each result to only the properties you need.


        The authenticated principal must have access to the account identified by

        `account_id`.'
      parameters:
      - name: account_id
        in: path
        description: Account ID.
        required: true
        schema:
          type: string
        example: 023e105f4ecef8ad9ca31a8372d0c353
      - name: filter
        in: query
        description: 'Filter applications using key:value format. Supported filter keys:

          - name: Filter by application name (e.g., name:HR)

          - id: Filter by application ID (e.g., id:498)

          - human_id: Filter by human-readable ID (e.g., human_id:HR)

          - hostname: Filter by hostname or support domain (e.g., hostname:portal.example.com)

          - source: Filter by application source name (e.g., source:cloudflare)

          - ip_subnet: Filter by IP subnet using CIDR containment — returns applications where any stored subnet contains the search value (e.g., ip_subnet:10.0.1.5/32 matches apps with 10.0.0.0/16)

          - category_id: Filter by category ID (e.g., category_id:12).

          - category_name: Filter by category name (e.g., category_name:HR).

          - supported: Filter by supported Cloudflare product (e.g., supported:ACCESS). Values: GATEWAY, ACCESS, CASB.

          - review_status: Filter by the account''s Gateway review status. Values: approved, unapproved, in_review, unreviewed.

          .

          '
        schema:
          type: string
        example: filter=name:HR&filter=source:cloudflare&filter=id:498
      - name: limit
        in: query
        description: Limit of number of results to return (max 250).
        schema:
          type: integer
          default: 25
      - name: offset
        in: query
        description: Offset of results to return.
        schema:
          type: integer
          default: 0
      - name: order_by
        in: query
        description: 'Order results using field:direction format. Supported fields are name, id, human_id,

          category_id, application_type, application_confidence_score, and gen_ai_score.

          Supported directions are asc and desc. Ignored when search is provided; results are

          ranked by relevance instead.

          '
        schema:
          type: string
        example: name:asc
      - name: search
        in: query
        description: Fuzzy search across application name and hostnames. Results are ranked by relevance. Must be between 2 and 200 characters. Can be combined with filter parameters.
        schema:
          type: string
          maxLength: 200
          minLength: 2
        example: MyNewApp
      - name: fields
        in: query
        description: 'Return only the listed properties on each application, as a comma-separated list.

          Use this to keep responses small when you only need part of each application — for

          example populating a picker with `fields=id,name` instead of downloading every

          hostname and IP subnet.


          Omit this parameter to receive the full application object.


          `id` is always returned.


          Selectable properties: `id`, `name`, `human_id`, `version`, `hostnames`,

          `support_domains`, `ip_subnets`, `port_protocols`, `supported`, `gen_ai_score`,

          `application_confidence_score`, `created_at`, `updated_at`, `review_status`.


          Unknown or empty property names return `400`.

          '
        schema:
          type: string
        example: id,name
      responses:
        '200':
          description: Get the application response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/alexandria_get_applications_response'
        '403':
          description: The authenticated principal does not have access to the requested account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/alexandria_api_response_common_failure'
        '502':
          description: Application review statuses could not be retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/alexandria_api_response_common_failure'
        '503':
          description: Application review statuses were requested but are not available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/alexandria_api_response_common_failure'
        4XX:
          description: Get application response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/alexandria_api_response_common_failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Applications
      x-fern-availability: generally-available
      x-fern-sdk-group-name: accounts.applications.get
      x-fern-sdk-method-name: applications
