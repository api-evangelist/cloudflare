components:
  schemas:
    cc_ContainersCreateScheduledApplicationRequest:
      description: 'Create a scheduler-backed Containers application. The Containers scheduler

        maintains the requested instance count and applies deployment configuration,

        placement, scaling, versions, and rollouts.

        '
      type: object
      properties:
        configuration:
          description: 'Defines the deployment configuration for every deployment in this application.

            '
          allOf:
          - $ref: '#/components/schemas/cc_UserDeploymentConfiguration'
        constraints:
          $ref: '#/components/schemas/cc_ApplicationConstraints'
        durable_objects:
          description: Optionally associates this scheduler-backed application with a Durable Object namespace.
          allOf:
          - $ref: '#/components/schemas/cc_DurableObjectsConfiguration'
        instances:
          description: The initial number of deployments to create.
          type: integer
          minimum: 0
        max_instances:
          description: Sets the maximum number of instances that the application can run.
          type: integer
          minimum: 0
        name:
          description: The name for this application.
          type: string
        observability:
          description: 'Top-level observability settings for the application.

            This field is mutually exclusive with configuration.observability.

            '
          allOf:
          - $ref: '#/components/schemas/cc_ApplicationObservability'
        rollout_active_grace_period:
          $ref: '#/components/schemas/cc_ApplicationRolloutActiveGracePeriod'
        scheduling_policy:
          $ref: '#/components/schemas/cc_ScheduledApplicationSchedulingPolicy'
      additionalProperties: false
      required:
      - name
      - scheduling_policy
      - instances
      - max_instances
      - configuration
    one_AuthMethodDetail:
      description: Detailed auth method info including credentials schema and instructions.
      type: object
      properties:
        display_name:
          description: Human-readable auth method name.
          type: string
        human_interaction_required:
          description: Whether setup requires human interaction or integration can be created purely using API (e.g., For OAuth can not be created without user interaction).
          type: boolean
        id:
          description: Auth method identifier.
          type: string
        instructions:
          description: Step-by-step instructions for obtaining credentials.
          allOf:
          - $ref: '#/components/schemas/one_Instructions'
        payload_example:
          description: Example credentials payload with placeholder values.
          type:
          - object
          - 'null'
          additionalProperties: true
        payload_schema:
          description: JSON Schema for the credentials object in POST /v2/integrations request.
          type:
          - object
          - 'null'
          additionalProperties: true
        redirect_url:
          description: OAuth redirect URL for vendors requiring human interaction.
          type:
          - string
          - 'null'
      required:
      - display_name
      - human_interaction_required
      - id
      - instructions
      - payload_example
      - payload_schema
      - redirect_url
    alexandria_application_updated_at:
      description: Returns the application update time.
      type: string
      example: '2025-01-01T00:00:00Z'
    alexandria_application_gen_ai_score:
      description: GenAI score for the application. Returns -1 when no score is available.
      type: number
      format: float
      example: 1.5
    alexandria_application_ip_subnets:
      description: IP subnets for this application. Custom application create and update requests accept IPv4 prefix lengths /8 through /32 and IPv6 prefix lengths /32 through /128.
      type: array
      items:
        type: string
      example:
      - 192.168.1.0/24
      - 2001:db8::/48
      x-stainless-collection-type: set
    cc_ApplicationConstraints:
      type: object
      properties:
        jurisdiction:
          $ref: '#/components/schemas/cc_ApplicationJurisdiction'
        regions:
          type: array
          items:
            $ref: '#/components/schemas/cc_Region'
    cc_DurableObjectsConfiguration:
      description: Set of properties to configure a Durable Object-backed application.
      oneOf:
      - $ref: '#/components/schemas/cc_DurableObjectsConfigurationNamespaceId'
      - $ref: '#/components/schemas/cc_DurableObjectsConfigurationScriptAndClass'
    cc_V4BaseErrorResponse:
      type: object
      properties:
        errors:
          example:
          - code: 7003
            message: No route for the URI
          allOf:
          - $ref: '#/components/schemas/cc_Messages'
          minLength: 1
        messages:
          example: []
          allOf:
          - $ref: '#/components/schemas/cc_Messages'
        result:
          type:
          - object
          - 'null'
          enum:
          - null
        success:
          description: Whether the API call was successful.
          type: boolean
      required:
      - success
      - errors
      - messages
      - result
    one_Permission:
      description: Permission/scope with severity for display.
      type: object
      properties:
        display_name:
          description: Human-readable permission name.
          type: string
        scope:
          description: Vendor-native scope identifier.
          type: string
        severity:
          description: 'Permission sensitivity level.


            * `low` - low

            * `medium` - medium

            * `high` - high

            * `critical` - critical'
          type: string
          enum:
          - low
          - medium
          - high
          - critical
      required:
      - display_name
      - scope
      - severity
    alexandria_application_id:
      description: Returns the application ID.
      type: integer
      format: int64
      example: 498
      maximum: 4294967295
      minimum: 0
    alexandria_application_confidence_score:
      description: Confidence score for the application. Returns -1 when no score is available.
      type: number
      format: float
      example: 0.92
    alexandria_get_application_response:
      allOf:
      - $ref: '#/components/schemas/alexandria_api-response-common'
      - properties:
          result:
            $ref: '#/components/schemas/alexandria_application'
        type: object
    cc_UserSSHPublicKey:
      description: User-provided SSH public key.
      type: object
      properties:
        name:
          description: Optional human readable name for this key.
          type: string
        public_key:
          $ref: '#/components/schemas/cc_SSHPublicKey'
      required:
      - public_key
    cc_DurableObjectApplicationSchedulingPolicy:
      description: 'Selects a Durable Object-managed application. Each Durable Object creates and

        manages the lifecycle of its container instance. Configure application-wide

        observability settings here. Deployment configuration, scaling, placement

        constraints, versions, and rollouts do not apply.

        '
      type: string
      enum:
      - durable_object
    cc_Entrypoint:
      description: 'The entry point for the container, specifying the executable to run when the container starts.

        You can override this at run-time. If you do, the default command from the image is ignored.

        Specify both entrypoint and command at run-time to completely replace the image defaults.

        '
      type: array
      items:
        $ref: '#/components/schemas/cc_ExecFormParam'
      example:
      - /bin/bash
    alexandria_delete_application_conflict_response:
      type: object
      properties:
        errors:
          type: array
          items:
            properties:
              code:
                type: integer
                minimum: 1000
              message:
                type: string
                example: Application is referenced by other resources
              meta:
                type: object
                properties:
                  references:
                    description: The complete list of resources in the account that reference the application.
                    type: array
                    items:
                      $ref: '#/components/schemas/alexandria_application_reference'
                    minItems: 1
                required:
                - references
            required:
            - code
            - message
            - meta
            type: object
          maxItems: 1
          minItems: 1
        messages:
          $ref: '#/components/schemas/alexandria_messages'
        result:
          type:
          - object
          - 'null'
          enum:
          - null
        success:
          type: boolean
          enum:
          - false
      required:
      - success
      - errors
      - messages
      - result
    cc_Region:
      description: 'Represents a group of datacenters. Choose one of "AFR", "APAC", "EEUR", "ENAM", "WNAM", "ME", "OC", "SAM", or "WEUR".

        '
      type: string
      example: WNAM
    cc_ApplicationName:
      description: The application name.
      type: string
    cc_Application:
      description: Describes an application and the parameters that govern how it places its instances.
      type: object
      properties:
        account_id:
          $ref: '#/components/schemas/cc_AccountID'
        active_rollout_id:
          $ref: '#/components/schemas/cc_RolloutID'
        configuration:
          $ref: '#/components/schemas/cc_UserDeploymentConfiguration'
        constraints:
          $ref: '#/components/schemas/cc_ApplicationConstraints'
        created_at:
          $ref: '#/components/schemas/cc_ISO8601Timestamp'
        durable_objects:
          $ref: '#/components/schemas/cc_ApplicationDurableObjectsConfiguration'
        health:
          $ref: '#/components/schemas/cc_ApplicationHealth'
        id:
          $ref: '#/components/schemas/cc_ApplicationID'
        instances:
          description: Number of deployments to create.
          type: integer
        max_instances:
          description: Maximum number of instances the application allows. This is relevant for applications that auto-scale.
          type: integer
        name:
          $ref: '#/components/schemas/cc_ApplicationName'
        observability:
          description: 'Top-level observability settings for the application.

            This field is mutually exclusive with configuration.observability.

            '
          allOf:
          - $ref: '#/components/schemas/cc_ApplicationObservability'
        rollout_active_grace_period:
          $ref: '#/components/schemas/cc_ApplicationRolloutActiveGracePeriod'
        scheduling_policy:
          $ref: '#/components/schemas/cc_SchedulingPolicy'
        updated_at:
          $ref: '#/components/schemas/cc_ISO8601Timestamp'
        version:
          type: integer
      required:
      - id
      - created_at
      - updated_at
      - account_id
      - name
      - version
      - scheduling_policy
      - instances
      - configuration
    alexandria_messages:
      type: array
      items:
        properties:
          code:
            type: integer
            minimum: 1000
          documentation_url:
            type: string
          message:
            type: string
          source:
            type: object
            properties:
              pointer:
                type: string
        required:
        - code
        - message
        type: object
        uniqueItems: true
      example: []
    cc_ContainersListApplications:
      description: The public Containers API returns a list of applications.
      type: array
      items:
        $ref: '#/components/schemas/cc_ContainersApplicationResponse'
    alexandria_application_type_description:
      description: Returns the application type description.
      type: string
      example: Applications used to manage employees and workforce tools.
    alexandria_application_reference:
      type: object
      properties:
        id:
          description: The public identifier of the referencing resource.
          type: string
          example: f174e90a-fafe-4643-bbbc-4a0ed4fc8415
        name:
          description: The name of the referencing resource.
          type: string
          example: Allow Spotify
        type:
          description: The resource type, such as Rule or Profile. Additional types may be returned.
          type: string
          example: Rule
      required:
      - id
      - name
      - type
    cc_ContainersCreateApplicationRequest:
      description: 'Create a Containers application.

        Set `scheduling_policy` to `default` for a

        scheduler-backed application with deployment configuration, instance counts,

        constraints, versions, and rollouts. Set it to `durable_object` for a

        Durable Object-managed application where each Durable Object creates and manages

        the lifecycle of its container instance. For `durable_object` requests, supply

        `name`, `scheduling_policy`, and `durable_objects`, with optional `configuration`

        and top-level `observability` settings.

        '
      oneOf:
      - $ref: '#/components/schemas/cc_ContainersCreateScheduledApplicationRequest'
      - $ref: '#/components/schemas/cc_ContainersCreateDurableObjectApplicationRequest'
    cc_DurableObjectApplicationConfiguration:
      description: Application-wide settings for a Durable Object-managed application.
      type: object
      properties:
        authorized_keys:
          type: array
          items:
            $ref: '#/components/schemas/cc_UserSSHPublicKey'
        wrangler_ssh:
          $ref: '#/components/schemas/cc_WranglerSSHConfig'
      additionalProperties: false
    alexandria_application_type:
      description: Returns the application type.
      type: string
      example: Human Resources
    cc_EventType:
      type: string
      enum:
      - Info
      - Error
      - Warn
      - UserError
      - SystemError
    one_FormField:
      description: A form field within a form_input step.
      type: object
      properties:
        label:
          description: Human-readable field label.
          type: string
        name:
          description: Field identifier (maps to credentials key).
          type: string
        placeholder:
          description: Placeholder text.
          type:
          - string
          - 'null'
        required:
          description: Whether field is required.
          type: boolean
        supported_file_types:
          description: Allowed file extensions for file_upload type.
          type:
          - array
          - 'null'
          items:
            type: string
        type:
          description: 'Field input type.


            * `text` - text

            * `password` - password

            * `email` - email

            * `file_upload` - file_upload'
          type: string
          enum:
          - text
          - password
          - email
          - file_upload
      required:
      - label
      - name
      - placeholder
      - required
      - supported_file_types
      - type
    cc_AccountID:
      description: A unique identifier for the user's account.
      type: string
    alexandria_application_version:
      description: Returns the application version.
      type: string
      example: '2025-01-01T00:00:00Z'
    cc_InstanceID:
      description: An instance ID represents an identifier of an instance configuration that maintains an underlying placement.
      type: string
    cc_ObservabilityLogs:
      description: Observability logging settings.
      type: object
      properties:
        enabled:
          type: boolean
          default: false
    cc_ApplicationObservability:
      description: 'Settings for application observability such as logging. Supported fields depend

        on the application''s scheduling policy. Durable Object-managed applications

        accept only `logs.enabled`.

        '
      type: object
      properties:
        logs:
          $ref: '#/components/schemas/cc_ObservabilityLogs'
    cc_WranglerSSHConfig:
      description: Configuration properties for connecting with SSH to a container using Wrangler.
      type: object
      properties:
        enabled:
          type: boolean
          default: true
        port:
          type: integer
          default: 22
          maximum: 65535
          minimum: 1
    cc_ContainersDeleteApplicationResponseBody:
      description: Result of starting asynchronous deletion for a Containers application.
      type: object
      properties:
        message:
          type: string
      required:
      - message
    cc_V4BaseResponse:
      type: object
      properties:
        errors:
          $ref: '#/components/schemas/cc_Messages'
        messages:
          $ref: '#/components/schemas/cc_Messages'
        success:
          description: Whether the API call was successful.
          type: boolean
          example: true
      required:
      - success
      - errors
      - messages
    alexandria_category_id:
      description: Returns the category ID.
      type: integer
      format: int64
      example: 12
      maximum: 4294967295
      minimum: 1
    cc_DurableObjectApplication:
      description: Each Durable Object creates and manages the lifecycle of its container instance.
      type: object
      properties:
        account_id:
          $ref: '#/components/schemas/cc_AccountID'
        configuration:
          $ref: '#/components/schemas/cc_DurableObjectApplicationConfiguration'
        created_at:
          $ref: '#/components/schemas/cc_ISO8601Timestamp'
        durable_objects:
          $ref: '#/components/schemas/cc_DurableObjectsConfigurationNamespaceId'
        health:
          $ref: '#/components/schemas/cc_DurableObjectApplicationHealth'
        id:
          $ref: '#/components/schemas/cc_ApplicationID'
        name:
          $ref: '#/components/schemas/cc_ApplicationName'
        observability:
          $ref: '#/components/schemas/cc_DurableObjectApplicationObservability'
        scheduling_policy:
          $ref: '#/components/schemas/cc_DurableObjectApplicationSchedulingPolicy'
        updated_at:
          $ref: '#/components/schemas/cc_ISO8601Timestamp'
      required:
      - id
      - created_at
      - updated_at
      - account_id
      - name
      - scheduling_policy
      - durable_objects
    one_AuthMethod:
      description: Authentication method available for a vendor.
      type: object
      properties:
        display_name:
          description: Human-readable auth method name.
          type: string
        id:
          description: Auth method identifier.
          type: string
        is_default:
          description: Whether this is the default auth method.
          type: boolean
        supported_environments:
          description: Environments this auth method supports.
          type: array
          items:
            type: string
      required:
      - display_name
      - id
      - is_default
      - supported_environments
    alexandria_application_source:
      description: Returns the application source.
      type: string
      example: cloudflare
    cc_DeploymentObservability:
      description: Settings for deployment observability such as logging.
      type: object
      properties:
        logs:
          $ref: '#/components/schemas/cc_ObservabilityLogs'
    cc_ApplicationRolloutActiveGracePeriod:
      description: 'Grace period for active instances to stay alive before becoming eligible for shutdown signal due to a rollout, in seconds.

        Defaults to 0.

        '
      type: integer
      default: 0
      maximum: 604800
      minimum: 0
    one_PaginatedSetupFlowList:
      type: object
      properties:
        errors:
          description: List of errors.
          type: array
          items:
            type: object
          default: []
        messages:
          description: List of messages.
          type: array
          items:
            type: string
          default: []
        result:
          description: List of items.
          type: array
          items:
            $ref: '#/components/schemas/one_SetupFlow'
        result_info:
          description: Pagination metadata.
          type: object
          properties:
            count:
              description: Number of items in current page.
              type: integer
            next:
              description: URL for next page.
              type:
              - string
              - 'null'
              format: uri
            page:
              description: Current page number.
              type: integer
            per_page:
              description: Number of items per page.
              type: integer
            previous:
              description: URL for previous page.
              type:
              - string
              - 'null'
              format: uri
            total_count:
              description: Total number of items.
              type: integer
        success:
          description: Whether the request succeeded.
          type: boolean
      required:
      - result
      - success
      - errors
      - messages
      - result_info
