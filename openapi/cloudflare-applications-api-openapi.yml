            application/json:
              schema:
                $ref: '#/components/schemas/alexandria_get_application_response'
        4XX:
          description: Create application response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/alexandria_api_response_common_failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Applications
      x-fern-availability: generally-available
      x-fern-sdk-group-name: accounts.applications
      x-fern-sdk-method-name: create
  /accounts/{account_id}/resource-library/applications/{id}:
    delete:
      operationId: deleteResourceLibraryApplication
