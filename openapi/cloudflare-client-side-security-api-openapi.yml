      - Page Shield
      - Domain Page Shield Read
      - Domain Page Shield
      - Page Shield Read
      - Zone Settings Write
      - Zone Settings Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: true
      x-fern-availability: generally-available
