openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Client-Side Security API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Client-Side Security
paths:
  /zones/{zone_id}/page_shield:
    get:
      operationId: page-shield-get-settings
      summary: Get client-side security settings
      description: Returns the client-side security product enablement status and reporting behaviors.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/client-side-security_id'
      responses:
        '200':
          description: Get Client-Side Security settings response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/client-side-security_api-get-response-collection'
                - properties:
                    result:
                      $ref: '#/components/schemas/client-side-security_get-zone-settings-response'
        4XX:
          description: Get Client-Side Security settings response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Client-Side Security
      x-api-token-group:
      - Page Shield
      - Domain Page Shield Read
      - Domain Page Shield
      - Page Shield Read
      - Zone Settings Write
      - Zone Settings Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: client-side-security.settings
      x-fern-sdk-method-name: get
      x-forge-hidden: true
    put:
      operationId: page-shield-update-settings
      summary: Update client-side security settings
      description: Updates client-side security enablement and reporting behaviors for the zone.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/client-side-security_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                enabled:
                  $ref: '#/components/schemas/client-side-security_enabled'
                use_cloudflare_reporting_endpoint:
                  $ref: '#/components/schemas/client-side-security_use_cloudflare_reporting_endpoint'
                use_connection_url_path:
                  $ref: '#/components/schemas/client-side-security_use_connection_url_path'
      responses:
        '200':
          description: Update Client-Side Security settings response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/client-side-security_zone_settings_response_single'
                - properties:
                    result:
                      $ref: '#/components/schemas/client-side-security_update-zone-settings-response'
        4XX:
          description: Update Client-Side Security settings response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Client-Side Security
      x-api-token-group:
      - Page Shield
      - Domain Page Shield
      - Zone Settings Write
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: client-side-security.settings
      x-fern-sdk-method-name: update
      x-forge-hidden: true
  /zones/{zone_id}/page_shield/connections:
    get:
      operationId: page-shield-list-connections
      summary: List detected connections
      description: Lists outbound connections made by webpages in the zone.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/client-side-security_id'
      - name: exclude_urls
        in: query
        schema:
          description: 'Excludes connections whose URL contains one of the URL-encoded URLs separated by commas.

            '
          type: string
          example: blog.cloudflare.com,www.example
      - name: urls
        in: query
        schema:
          description: 'Includes connections whose URL contain one or more URL-encoded URLs separated by commas.

            '
          type: string
          example: blog.cloudflare.com,www.example
      - name: hosts
        in: query
        schema:
          description: 'Includes connections that match one or more URL-encoded hostnames separated by commas.


            Wildcards are supported at the start and end of each hostname to support starts with, ends with

            and contains. If no wildcards are used, results will be filtered by exact match

            '
          type: string
          example: blog.cloudflare.com,www.example*,*cloudflare.com
      - name: page
        in: query
        schema:
          description: 'The current page number of the paginated results.


            We additionally support a special value "all". When "all" is used, the API will return all the connections

            with the applied filters in a single page. This feature is best-effort and it may only work for zones with

            a low number of connections

            '
          type: string
          example: 2
      - name: per_page
        in: query
        schema:
          description: The number of results per page.
          type: number
          example: 100
          maximum: 100
          minimum: 1
      - name: order_by
        in: query
        schema:
          description: The field used to sort returned connections.
          type: string
          example: first_seen_at
          enum:
          - first_seen_at
          - last_seen_at
      - name: direction
        in: query
        schema:
          description: The direction used to sort returned connections.
          type: string
          example: asc
          enum:
          - asc
          - desc
      - name: prioritize_malicious
        in: query
        schema:
          description: When true, malicious connections appear first in the returned connections.
          type: boolean
          example: true
      - name: exclude_cdn_cgi
        in: query
        schema:
          description: When true, excludes connections seen in a `/cdn-cgi` path from the returned connections. The default value is true.
          type: boolean
          example: true
      - name: status
        in: query
        schema:
          description: 'Filters the returned connections using a comma-separated list of connection statuses. Accepted values: `active`, `infrequent`, and `inactive`. The default value is `active`.'
          type: string
          example: active,inactive
      - name: page_url
        in: query
        schema:
          description: 'Includes connections that match one or more page URLs (separated by commas) where they were last seen


            Wildcards are supported at the start and end of each page URL to support starts with, ends with

            and contains. If no wildcards are used, results will be filtered by exact match

            '
          type: string
          example: example.com/page,*/checkout,example.com/*,*checkout*
      - name: export
        in: query
        schema:
          description: Export the list of connections as a file, limited to 50000 entries.
          type: string
          example: csv
          enum:
          - csv
      responses:
        '200':
          description: List Client-Side Security connections response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_list-zone-connections-response'
        4XX:
          description: List Client-Side Security connections response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Client-Side Security
      x-api-token-group:
      - Page Shield
      - Domain Page Shield Read
      - Domain Page Shield
      - Page Shield Read
      - Zone Settings Write
      - Zone Settings Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: client-side-security.connections
      x-fern-sdk-method-name: list
      x-forge-hidden: true
  /zones/{zone_id}/page_shield/connections/{connection_id}:
    get:
      operationId: page-shield-get-connection
      summary: Get a detected connection
      description: Returns a webpage connection detected on the zone by connection ID.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/client-side-security_id'
      - name: connection_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/client-side-security_id'
      responses:
        '200':
          description: Get a Client-Side Security connection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_get-zone-connection-response'
        4XX:
          description: Get a Client-Side Security connection response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Client-Side Security
      x-api-token-group:
      - Page Shield
      - Domain Page Shield Read
      - Domain Page Shield
      - Page Shield Read
      - Zone Settings Write
      - Zone Settings Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: client-side-security.connections
      x-fern-sdk-method-name: get
      x-forge-hidden: true
  /zones/{zone_id}/page_shield/cookies:
    get:
      operationId: page-shield-list-cookies
      summary: List detected cookies
      description: Lists cookies detected on the zone.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/client-side-security_id'
      - name: hosts
        in: query
        schema:
          description: 'Includes cookies that match one or more URL-encoded hostnames separated by commas.


            Wildcards are supported at the start and end of each hostname to support starts with, ends with

            and contains. If no wildcards are used, results will be filtered by exact match

            '
          type: string
          example: blog.cloudflare.com,www.example*,*cloudflare.com
      - name: page
        in: query
        schema:
          description: 'The current page number of the paginated results.


            We additionally support a special value "all". When "all" is used, the API will return all the cookies

            with the applied filters in a single page. This feature is best-effort and it may only work for zones with

            a low number of cookies

            '
          type: string
          example: 2
      - name: per_page
        in: query
        schema:
          description: The number of results per page.
          type: number
          example: 100
          maximum: 100
          minimum: 1
      - name: order_by
        in: query
        schema:
          description: The field used to sort returned cookies.
          type: string
          example: first_seen_at
          enum:
          - first_seen_at
          - last_seen_at
      - name: direction
        in: query
        schema:
          description: The direction used to sort returned cookies.'
          type: string
          example: asc
          enum:
          - asc
          - desc
      - name: page_url
        in: query
        schema:
          description: 'Includes connections that match one or more page URLs (separated by commas) where they were last seen


            Wildcards are supported at the start and end of each page URL to support starts with, ends with

            and contains. If no wildcards are used, results will be filtered by exact match

            '
          type: string
          example: example.com/page,*/checkout,example.com/*,*checkout*
      - name: export
        in: query
        schema:
          description: Export the list of cookies as a file, limited to 50000 entries.
          type: string
          example: csv
          enum:
          - csv
      - name: name
        in: query
        schema:
          description: 'Filters the returned cookies that match the specified name.

            Wildcards are supported at the start and end to support starts with, ends with

            and contains. e.g. session*

            '
          type: string
          example: session_id
          maxLength: 1024
      - name: secure
        in: query
        schema:
          description: Filters the returned cookies that are set with Secure
          type: boolean
          example: true
      - name: http_only
        in: query
        schema:
          description: Filters the returned cookies that are set with HttpOnly
          type: boolean
          example: true
      - name: same_site
        in: query
        schema:
          description: Filters the returned cookies that match the specified same_site attribute
          type: string
          example: strict
          enum:
          - lax
          - strict
          - none
      - name: type
        in: query
        schema:
          description: Filters the returned cookies that match the specified type attribute
          type: string
          example: first_party
          enum:
          - first_party
          - unknown
      - name: path
        in: query
        schema:
          description: Filters the returned cookies that match the specified path attribute
          type: string
          example: /
          maxLength: 1024
      - name: domain
        in: query
        schema:
          description: Filters the returned cookies that match the specified domain attribute
          type: string
          example: example.com
          maxLength: 1024
      responses:
        '200':
          description: List Client-Side Security cookies response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_list-zone-cookies-response'
        4XX:
          description: List Client-Side Security cookies response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Client-Side Security
      x-api-token-group:
      - Page Shield
      - Domain Page Shield Read
      - Domain Page Shield
      - Page Shield Read
      - Zone Settings Write
      - Zone Settings Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: client-side-security.cookies
      x-fern-sdk-method-name: list
      x-forge-hidden: true
  /zones/{zone_id}/page_shield/cookies/{cookie_id}:
    get:
      operationId: page-shield-get-cookie
      summary: Get a detected cookie
      description: Returns a cookie detected on the zone by cookie ID.
      parameters:
      - name: zone_id
