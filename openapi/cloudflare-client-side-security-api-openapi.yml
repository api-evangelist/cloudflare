            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Client-Side Security
      x-api-token-group:
      - Page Shield
      - Domain Page Shield Read
      - Domain Page Shield
      - Page Shield Read
      - Zone Settings Write
      - Zone Settings Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: false
      x-fern-availability: generally-available
      x-fern-sdk-group-name: client-side-security.cookies
      x-fern-sdk-method-name: get
      x-forge-hidden: true
  /zones/{zone_id}/page_shield/policies:
    get:
      operationId: page-shield-list-policies
      summary: List content security rules
      description: Lists content security rules configured for the zone.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/client-side-security_id'
      responses:
        '200':
          description: List Client-Side Security policies response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_list-zone-policies-response'
        4XX:
          description: List Client-Side Security policies response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Client-Side Security
      x-api-token-group:
      - Page Shield
      - Domain Page Shield Read
      - Domain Page Shield
      - Page Shield Read
      - Zone Settings Write
      - Zone Settings Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: client-side-security.policies
      x-fern-sdk-method-name: list
      x-forge-hidden: true
    post:
      operationId: page-shield-create-policy
      summary: Create a content security rule
      description: Creates a rule that applies a client-side security action when its filter expression matches.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/client-side-security_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/client-side-security_policy'
      responses:
        '200':
          description: Create a Client-Side Security policy response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_get-zone-policy-response'
        4XX:
          description: Create a Client-Side Security policy response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Client-Side Security
      x-api-token-group:
      - Page Shield
      - Domain Page Shield
      - Zone Settings Write
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: client-side-security.policies
      x-fern-sdk-method-name: create
      x-forge-hidden: true
  /zones/{zone_id}/page_shield/policies/{policy_id}:
    delete:
      operationId: page-shield-delete-policy
      summary: Delete a content security rule
      description: Permanently deletes a content security rule by ID.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/client-side-security_id'
      - name: policy_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/client-side-security_id'
      responses:
        '204':
          description: Delete a Client-Side Security policy response
        4XX:
          description: Delete a Client-Side Security policy response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Client-Side Security
      x-api-token-group:
      - Page Shield
      - Domain Page Shield
      - Zone Settings Write
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: client-side-security.policies
      x-fern-sdk-method-name: delete
      x-forge-hidden: true
      x-forge-require-confirmation: This operation permanently deletes the content security rule from the zone.
    get:
      operationId: page-shield-get-policy
      summary: Get a content security rule
      description: Returns a content security rule by ID.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/client-side-security_id'
      - name: policy_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/client-side-security_id'
      responses:
        '200':
          description: Get a Client-Side Security policy response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_get-zone-policy-response'
        4XX:
          description: Get a Client-Side Security policy response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Client-Side Security
      x-api-token-group:
      - Page Shield
      - Domain Page Shield Read
      - Domain Page Shield
      - Page Shield Read
      - Zone Settings Write
      - Zone Settings Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: client-side-security.policies
      x-fern-sdk-method-name: get
      x-forge-hidden: true
    put:
      operationId: page-shield-update-policy
      summary: Update a content security rule
      description: Updates the description, action, expression, enabled state, and policy value for a content security rule.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/client-side-security_id'
      - name: policy_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/client-side-security_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                action:
                  $ref: '#/components/schemas/client-side-security_policy-action'
                description:
                  $ref: '#/components/schemas/client-side-security_policy-description'
                enabled:
                  $ref: '#/components/schemas/client-side-security_policy-enabled'
                expression:
                  $ref: '#/components/schemas/client-side-security_policy-expression'
                value:
                  $ref: '#/components/schemas/client-side-security_policy-value'
      responses:
        '200':
          description: Update a Client-Side Security policy response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_get-zone-policy-response'
        4XX:
          description: Update a Client-Side Security policy response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Client-Side Security
      x-api-token-group:
      - Page Shield
      - Domain Page Shield
      - Zone Settings Write
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: client-side-security.policies
      x-fern-sdk-method-name: update
      x-forge-hidden: true
  /zones/{zone_id}/page_shield/scripts:
    get:
      operationId: page-shield-list-scripts
      summary: List detected scripts
      description: Lists scripts detected on webpages in the zone, with filtering and pagination.
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/client-side-security_id'
      - name: exclude_urls
        in: query
        schema:
          description: 'Excludes scripts whose URL contains one of the URL-encoded URLs separated by commas.

            '
          type: string
          example: blog.cloudflare.com,www.example
      - name: urls
        in: query
        schema:
          description: 'Includes scripts whose URL contain one or more URL-encoded URLs separated by commas.

            '
          type: string
          example: blog.cloudflare.com,www.example
      - name: hosts
        in: query
        schema:
          description: 'Includes scripts that match one or more URL-encoded hostnames separated by commas.


            Wildcards are supported at the start and end of each hostname to support starts with, ends with

            and contains. If no wildcards are used, results will be filtered by exact match

            '
          type: string
          example: blog.cloudflare.com,www.example*,*cloudflare.com
      - name: page
        in: query
        schema:
          description: 'The current page number of the paginated results.


            We additionally support a special value "all". When "all" is used, the API will return all the scripts

            with the applied filters in a single page. This feature is best-effort and it may only work for zones with

            a low number of scripts

            '
          type: string
          example: 2
      - name: per_page
        in: query
        schema:
          description: The number of results per page.
          type: number
          example: 100
          maximum: 100
          minimum: 1
      - name: order_by
        in: query
        schema:
          description: The field used to sort returned scripts.
          type: string
          example: first_seen_at
          enum:
          - first_seen_at
          - last_seen_at
      - name: direction
        in: query
        schema:
          description: The direction used to sort returned scripts.
          type: string
          example: asc
          enum:
          - asc
          - desc
      - name: prioritize_malicious
        in: query
        schema:
          description: When true, malicious scripts appear first in the returned scripts.
          type: boolean
          example: true
      - name: exclude_cdn_cgi
        in: query
        schema:
          description: When true, excludes scripts seen in a `/cdn-cgi` path from the returned scripts. The default value is true.
          type: boolean
          example: true
          default: true
      - name: exclude_duplicates
        in: query
        schema:
          description: 'When true, excludes duplicate scripts. We consider a script duplicate of another if their javascript

            content matches and they share the same url host and zone hostname. In such case, we return the most

            recent script for the URL host and zone hostname combination.

            '
          type: boolean
          example: true
          default: true
      - name: status
        in: query
        schema:
          description: 'Filters the returned scripts using a comma-separated list of scripts statuses. Accepted values: `active`, `infrequent`, and `inactive`. The default value is `active`.'
          type: string
          example: active,inactive
      - name: page_url
        in: query
        schema:
          description: 'Includes scripts that match one or more page URLs (separated by commas) where they were last seen


            Wildcards are supported at the start and end of each page URL to support starts with, ends with

            and contains. If no wildcards are used, results will be filtered by exact match

            '
          type: string
          example: example.com/page,*/checkout,example.com/*,*checkout*
      - name: export
        in: query
        schema:
          description: Export the list of scripts as a file, limited to 50000 entries.
          type: string
          example: csv
          enum:
          - csv
      responses:
        '200':
          description: List Client-Side Security scripts response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_list-zone-scripts-response'
        4XX:
          description: List Client-Side Security scripts response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/client-side-security_api-response-common-failure'
      security:
      - api_email: []
        api_key: []
      tags:
      - Client-Side Security
      x-api-token-group:
      - Page Shield
      - Domain Page Shield Read
      - Domain Page Shield
      - Page Shield Read
      - Zone Settings Write
      - Zone Settings Read
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: false
        pro: true
