openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare AI Gateway Logs API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: AI Gateway Logs
paths:
  /accounts/{account_id}/ai-gateway/gateways/{gateway_id}/logs:
    delete:
      operationId: aig-config-delete-gateway-logs
      summary: Delete Gateway Logs
      description: Deletes gateway log entries matching the specified criteria.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          example: 0d37909e38d3e99c29fa2cd343ac421a
      - name: gateway_id
        in: path
        required: true
        schema:
          description: Unique identifier of the AI Gateway within the account.
          type: string
          example: my-gateway
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9_]+(?:-[a-z0-9_]+)*$
          x-auditable: true
      - name: order_by
        in: query
        schema:
          type: string
          default: created_at
          enum:
          - created_at
          - provider
          - model
          - model_type
          - success
          - cached
          - cost
          - tokens_in
          - tokens_out
          - duration
          - feedback
      - name: order_by_direction
        in: query
        schema:
          type: string
          default: asc
          enum:
          - asc
          - desc
      - name: filters
        in: query
        schema:
          type: array
          items:
            properties:
              key:
                type: string
                enum:
                - id
                - created_at
                - request_content_type
                - response_content_type
                - request_type
                - success
                - cached
                - provider
                - model
                - model_type
                - cost
                - tokens
                - tokens_in
                - tokens_out
                - duration
                - feedback
                - event_id
                - metadata.key
                - metadata.value
                - authentication
                - wholesale
                - compatibilityMode
                - dlp_action
                - user_agent
              operator:
                type: string
                enum:
                - eq
                - neq
                - contains
                - lt
                - gt
              value:
                description: Filter values.
                type: array
                items:
                  anyOf:
                  - type:
                    - string
                    - 'null'
                  - type: number
                  - type: boolean
            required:
            - key
            - operator
            - value
            type: object
      - name: limit
        in: query
        schema:
          type: integer
          default: 10000
          maximum: 10000
          minimum: 1
      responses:
        '200':
          description: Returns if the delete was successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                - success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                  result:
                    type: object
                  success:
                    type: boolean
                    example: false
                required:
                - result
                - success
                - errors
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - AI Gateway Logs
      x-api-token-group:
      - AI Gateway Write
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.aig
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: ai-gateway.logs
      x-fern-sdk-method-name: delete
      x-forge-require-confirmation: This permanently deletes every stored log entry on the gateway that matches the filters. Deleted logs cannot be recovered.
    get:
      operationId: aig-config-list-gateway-logs
      summary: List Gateway Logs
      description: Lists request/response log entries for the AI gateway with filtering and pagination.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          example: 0d37909e38d3e99c29fa2cd343ac421a
      - name: gateway_id
        in: path
        required: true
        schema:
          description: Unique identifier of the AI Gateway within the account.
          type: string
          example: my-gateway
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9_]+(?:-[a-z0-9_]+)*$
          x-auditable: true
      - name: search
        in: query
        schema:
          description: Free-text search over log metadata.
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 20
          maximum: 50
          minimum: 1
      - name: order_by
        in: query
        schema:
          type: string
          default: created_at
          enum:
          - created_at
          - provider
          - model
          - model_type
          - success
          - cached
      - name: order_by_direction
        in: query
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
      - name: filters
        in: query
        schema:
          type: array
          items:
            properties:
              key:
                type: string
                enum:
                - id
                - created_at
                - request_content_type
                - response_content_type
                - request_type
                - success
                - cached
                - provider
                - model
                - model_type
                - cost
                - tokens
                - tokens_in
                - tokens_out
                - duration
                - feedback
                - event_id
                - metadata.key
                - metadata.value
                - authentication
                - wholesale
                - compatibilityMode
                - dlp_action
                - user_agent
              operator:
                type: string
                enum:
                - eq
                - neq
                - contains
                - lt
                - gt
              value:
                description: Filter values.
                type: array
                items:
                  anyOf:
                  - type:
                    - string
                    - 'null'
                  - type: number
                  - type: boolean
            required:
            - key
            - operator
            - value
            type: object
      - name: meta_info
        in: query
        schema:
          type: boolean
      - name: direction
        in: query
        schema:
          type: string
          deprecated: true
          enum:
          - asc
          - desc
      - name: start_date
        in: query
        schema:
          type: string
          format: date-time
          deprecated: true
      - name: end_date
        in: query
        schema:
          type: string
          format: date-time
          deprecated: true
      - name: min_cost
        in: query
        schema:
          type: number
          deprecated: true
      - name: max_cost
        in: query
        schema:
          type: number
          deprecated: true
      - name: min_tokens_in
        in: query
        schema:
          type: number
          deprecated: true
      - name: max_tokens_in
        in: query
        schema:
          type: number
          deprecated: true
      - name: min_tokens_out
        in: query
        schema:
          type: number
          deprecated: true
      - name: max_tokens_out
        in: query
        schema:
          type: number
          deprecated: true
      - name: min_total_tokens
        in: query
        schema:
          type: number
          deprecated: true
      - name: max_total_tokens
        in: query
        schema:
          type: number
          deprecated: true
      - name: min_duration
        in: query
        schema:
          type: number
          deprecated: true
      - name: max_duration
        in: query
        schema:
          type: number
          deprecated: true
      - name: feedback
        in: query
        schema:
          anyOf:
          - enum:
            - -1
            type: number
          - enum:
            - 0
            type: number
          - enum:
            - 1
            type: number
          deprecated: true
      - name: success
        in: query
        schema:
          type: boolean
          deprecated: true
      - name: cached
        in: query
        schema:
          type: boolean
          deprecated: true
      - name: model
        in: query
        schema:
          description: Model filter.
          type: string
          deprecated: true
      - name: model_type
        in: query
        schema:
          type: string
          deprecated: true
      - name: provider
        in: query
        schema:
          type: string
          deprecated: true
      - name: request_content_type
        in: query
        schema:
          type: string
          deprecated: true
      - name: response_content_type
        in: query
        schema:
          type: string
          deprecated: true
      responses:
        '200':
          description: Returns a list of Gateway Logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      properties:
                        cached:
                          type: boolean
                        cost:
                          type: number
                        created_at:
                          type: string
                          format: date-time
                        custom_cost:
                          type: boolean
                        duration:
                          type: integer
                        id:
                          type: string
                        metadata:
                          type: string
                        model:
                          type: string
                        model_type:
                          type: string
                        path:
                          type: string
                        provider:
                          type: string
                        request_content_type:
                          type: string
                        request_type:
                          type: string
                        response_content_type:
                          type: string
                        status_code:
                          type: integer
                        step:
                          type: integer
                        success:
                          type: boolean
                        tokens_in:
                          type:
                          - integer
                          - 'null'
                        tokens_out:
                          type:
                          - integer
                          - 'null'
                      required:
                      - id
                      - created_at
                      - provider
                      - model
                      - path
                      - duration
                      - success
                      - cached
                      - tokens_in
                      - tokens_out
                      type: object
                  result_info:
                    type: object
                    properties:
                      count:
                        type: number
                      max_cost:
                        type: number
                      max_duration:
                        type: number
                      max_tokens_in:
                        type: number
                      max_tokens_out:
                        type: number
                      max_total_tokens:
                        type: number
                      min_cost:
                        type: number
                      min_duration:
                        type: number
                      min_tokens_in:
                        type: number
                      min_tokens_out:
                        type: number
                      min_total_tokens:
                        type: number
                      page:
                        type: number
                      per_page:
                        type: number
                      total_count:
                        type: number
                  success:
                    type: boolean
                required:
                - success
                - result
                - result_info
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        message:
                          type: string
                      required:
                      - message
                      type: object
                  result:
                    type: object
                  success:
                    type: boolean
                    example: false
                required:
                - result
                - success
                - errors
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - AI Gateway Logs
      x-api-token-group:
      - AI Gateway Write
      - AI Gateway Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.aig
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: ai-gateway.logs
      x-fern-sdk-method-name: list
  /accounts/{account_id}/ai-gateway/gateways/{gateway_id}/logs/{id}:
    get:
      operationId: aig-config-get-gateway-log-detail
      summary: Get Gateway Log Detail
      description: Retrieves detailed information for a specific AI Gateway log entry.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: gateway_id
        in: path
        required: true
        schema:
          description: Unique identifier of the AI Gateway within the account.
          type: string
          example: my-gateway
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9_]+(?:-[a-z0-9_]+)*$
          x-auditable: true
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          example: 0d37909e38d3e99c29fa2cd343ac421a
      responses:
        '200':
          description: Returns the log details
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      cached:
                        type: boolean
                      cost:
                        type: number
                      created_at:
                        type: string
                        format: date-time
                      custom_cost:
                        type: boolean
                      duration:
                        type: integer
                      id:
                        type: string
                      metadata:
                        type: string
                      model:
                        type: string
                      model_type:
                        type: string
                      path:
                        type: string
                      provider:
                        type: string
                      request_content_type:
                        type: string
                      request_head:
                        type: string
                      request_head_complete:
                        type: boolean
                      request_size:
                        type: integer
                      request_type:
                        type: string
                      response_content_type:
                        type: string
                      response_head:
                        type: string
                      response_head_complete:
                        type: boolean
                      response_size:
                        type: integer
                      status_code:
                        type: integer
                      step:
                        type: integer
                      success:
                        type: boolean
                      tokens_in:
                        type:
                        - integer
                        - 'null'
                      tokens_out:
                        type:
                        - integer
                        - 'null'
                    required:
                    - id
                    - created_at
                    - provider
                    - model
                    - path
                    - duration
                    - success
                    - cached
                    - tokens_in
                    - tokens_out
                  success:
                    type: boolean
                required:
                - success
                - result
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          type: number
                          example: 7002
                        message:
                          type: string
                          example: Not Found
                      required:
                      - code
                      - message
                      type: object
                  success:
                    type: boolean
                required:
                - success
                - errors
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - AI Gateway Logs
      x-api-token-group:
      - AI Gateway Write
      - AI Gateway Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.aig
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: ai-gateway.logs
      x-fern-sdk-method-name: get
    patch:
      operationId: aig-config-patch-gateway-log
      summary: Patch Gateway Log
      description: Updates metadata for an AI Gateway log entry.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: gateway_id
        in: path
        required: true
        schema:
          description: Unique identifier of the AI Gateway within the account.
          type: string
          example: my-gateway
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9_]+(?:-[a-z0-9_]+)*$
          x-auditable: true
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          example: 0d37909e38d3e99c29fa2cd343ac421a
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                feedback:
                  type:
                  - number
                  - 'null'
                  maximum: 1
                  minimum: -1
                metadata:
                  type:
                  - object
                  - 'null'
                  additionalProperties:
                    anyOf:
                    - type: string
                    - type: number
                    - type: boolean
                score:
                  type:
                  - number
                  - 'null'
                  maximum: 100
                  minimum: 0
      responses:
        '200':
          description: Returns the log details
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                  success:
                    type: boolean
                required:
                - success
                - result
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          type: number
                          example: 7002
                        message:
                          type: string
                          example: Not Found
                      required:
                      - code
                      - message
                      type: object
                  success:
                    type: boolean
                required:
                - success
                - errors
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - AI Gateway Logs
      x-api-token-group:
      - AI Gateway Write
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.aig
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: ai-gateway.logs
      x-fern-sdk-method-name: update
  /accounts/{account_id}/ai-gateway/gateways/{gateway_id}/logs/{id}/request:
    get:
      operationId: aig-config-get-gateway-log-request
      summary: Get Gateway Log Request
      description: Retrieves the original request payload for an AI Gateway log entry.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: gateway_id
        in: path
        required: true
        schema:
          description: Unique identifier of the AI Gateway within the account.
          type: string
          example: my-gateway
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9_]+(?:-[a-z0-9_]+)*$
          x-auditable: true
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          example: 0d37909e38d3e99c29fa2cd343ac421a
      responses:
        '200':
          description: Returns the request body from a specific log
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          type: number
                          example: 7002
                        message:
                          type: string
                          example: Not Found
                      required:
                      - code
                      - message
                      type: object
                  success:
                    type: boolean
                required:
                - success
                - errors
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - AI Gateway Logs
      x-api-token-group:
      - AI Gateway Write
      - AI Gateway Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.aig
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: ai-gateway.logs
      x-fern-sdk-method-name: get-request
  /accounts/{account_id}/ai-gateway/gateways/{gateway_id}/logs/{id}/response:
    get:
      operationId: aig-config-get-gateway-log-response
      summary: Get Gateway Log Response
      description: Retrieves the response payload for an AI Gateway log entry.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: gateway_id
        in: path
        required: true
        schema:
          description: Unique identifier of the AI Gateway within the account.
          type: string
          example: my-gateway
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9_]+(?:-[a-z0-9_]+)*$
          x-auditable: true
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          example: 0d37909e38d3e99c29fa2cd343ac421a
      responses:
        '200':
          description: Returns the response body from a specific log
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          type: number
                          example: 7002
                        message:
                          type: string
                          example: Not Found
                      required:
                      - code
                      - message
                      type: object
                  success:
                    type: boolean
                required:
                - success
                - errors
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - AI Gateway Logs
      x-api-token-group:
      - AI Gateway Write
      - AI Gateway Read
      x-cfPermissionsRequired:
        enum:
        - com.cloudflare.api.account.aig
      x-cfPlanAvailability:
        business: true
        enterprise: true
        free: true
        pro: true
      x-fern-availability: generally-available
      x-fern-sdk-group-name: ai-gateway.logs
      x-fern-sdk-method-name: get-response
components:
  securitySchemes:
    api_email:
      in: header
      name: X-Auth-Email
      type: apiKey
    api_key:
      in: header
      name: X-Auth-Key
      type: apiKey
    api_token:
      scheme: bearer
      type: http
    user_service_key:
      in: header
      name: X-Auth-User-Service-Key
      type: apiKey
externalDocs:
  description: Cloudflare Radar Documentation
  url: https://developers.cloudflare.com/radar/
x-forge-commands:
  abuse-reports:
    description: Submit and track abuse reports for phishing, malware, and other policy violations on Cloudflare-proxied sites
    groups:
      appeals:
        description: Appeal eligibility for abuse reports
      emails:
        description: Emails sent for abuse reports
      mitigations:
        description: Mitigation actions taken in response to abuse reports
  accounts:
    description: Account settings, members, roles, subscriptions, and API tokens for your Cloudflare account
    groups:
      applications:
        description: Applications operations
      categories:
        description: Categories operations
      organizations:
        description: Move accounts between organizations
      profile:
        description: View and manage the profile for a Cloudflare account
      roles:
        description: View the roles available for assigning to account members, each defining a set of permissions
      subscriptions:
        description: View and manage plan subscriptions attached to this account
      tokens:
        description: Create and manage scoped API tokens for programmatic access to the Cloudflare API
  ai-gateway:
    description: Proxy, cache, rate-limit, and observe requests to AI providers — OpenAI, Anthropic, Workers AI, and more
    groups:
      custom-domains:
        description: Manage custom hostnames that route requests through an AI Gateway
      custom-providers:
        description: Manage account-level custom AI providers and their endpoint settings
      datasets:
