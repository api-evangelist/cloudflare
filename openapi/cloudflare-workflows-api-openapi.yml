      - name: workflow_name
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z0-9_][a-zA-Z0-9-_]*$
      - name: instance_id
        in: path
        description: Instance identifier. User-created instances match `^[a-zA-Z0-9_][a-zA-Z0-9-_]*$` (max 100 characters); cron-triggered instances can use a longer, system-generated id derived from the cron expression.
        required: true
        schema:
          type: string
          maxLength: 271
          minLength: 1
      - name: name
        in: query
        description: Exact step name from the instance logs response, including the generated counter suffix.
        required: true
        schema:
          type: string
          minLength: 1
      - name: type
        in: query
        description: Step type to disambiguate step.do and waitForEvent entries that share the same name.
        required: true
        schema:
          type: string
          enum:
          - step
          - waitForEvent
      - name: attempt
        in: query
        description: Specific attempt number to retrieve output or error for.
        schema:
          type: integer
          maximum: 9007199254740991
          exclusiveMinimum: 0
      - name: account_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Get the full output from a specific instance step.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          type: number
                        message:
                          type: string
                      required:
                      - code
                      - message
                      type: object
                    maxItems: 0
                  messages:
                    type: array
                    items:
                      properties:
                        code:
                          type: number
                        message:
                          type: string
                      required:
                      - code
                      - message
                      type: object
                  result:
                    type: object
                    properties:
                      error:
                        description: Error details when status='errored'; null otherwise.
                        type:
                        - object
                        - 'null'
                        properties:
                          message:
                            type: string
                          name:
                            type: string
                        required:
                        - name
                        - message
                      event_type:
                        description: The event type the step is waiting on, as supplied to step.waitForEvent. Only present when type='waitForEvent'.
                        type: string
                      output:
                        description: Contains the full step output or waitForEvent payload without truncation. Uses '[REDACTED]' for sensitive outputs. Contains a value when status='complete'. May contain a ReadableStream when step.do returns one; the response serves stream outputs as application/octet-stream rather than JSON.
                        type: object
                      status:
                        type: string
                        enum:
                        - queued
                        - running
                        - paused
                        - errored
                        - terminated
                        - complete
                        - waitingForPause
                        - waiting
                        - rollingBack
                    required:
                    - status
                    - error
                  result_info:
                    type: object
                    properties:
                      count:
                        type: number
                      cursor:
                        type: string
                      page:
                        type: number
                      per_page:
                        type: number
                      total_count:
                        type: number
                      total_pages:
                        type: number
                    required:
                    - per_page
                    - count
                    - total_count
                  success:
                    type: boolean
                    enum:
                    - true
                required:
                - success
                - errors
                - result
                - messages
            application/octet-stream:
              schema:
                description: Raw bytes of the ReadableStream returned from step.do.
                type: string
                format: binary
        '400':
          description: Bad Request (e.g. 'attempt' parameter supplied with type='waitForEvent').
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
