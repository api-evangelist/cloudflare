  /accounts/{account_id}/workflows:
    get:
      operationId: wor-list-workflows
      summary: List all Workflows
      description: Lists all workflows configured for the account.
      parameters:
      - name: per_page
        in: query
        schema:
          type: number
          default: 10
          maximum: 100
          minimum: 1
      - name: page
        in: query
        schema:
          type: number
          default: 1
          minimum: 1
      - name: search
        in: query
        description: Allows filtering workflows` name.
        schema:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z0-9_][a-zA-Z0-9-_]*$
      - name: account_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of all Workflows belonging to a account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      properties:
                        code:
                          type: number
                        message:
                          type: string
                      required:
                      - code
                      - message
                      type: object
                    maxItems: 0
                  messages:
                    type: array
                    items:
                      properties:
                        code:
                          type: number
                        message:
                          type: string
                      required:
                      - code
                      - message
                      type: object
                  result:
                    type: array
                    items:
