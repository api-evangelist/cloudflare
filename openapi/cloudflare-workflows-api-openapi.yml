                                type: string
                              next_instance:
                                type: string
                            required:
                            - cron
                            - next_instance
                            type: object
                        script_deleted:
                          description: Whether the bound Worker was deleted, leaving this Workflow inactive.
                          type: boolean
                        script_name:
                          type: string
                        triggered_on:
                          type:
                          - string
                          - 'null'
                          format: date-time
                      required:
                      - name
                      - id
                      - created_on
                      - modified_on
                      - script_name
                      - class_name
                      - triggered_on
                      - instances
                      type: object
