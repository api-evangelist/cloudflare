                        modified_on:
                          type: string
                          format: date-time
                        name:
                          type: string
                          maxLength: 64
                          minLength: 1
                          pattern: ^[a-zA-Z0-9_][a-zA-Z0-9-_]*$
                        schedules:
                          type: array
                          items:
                            properties:
