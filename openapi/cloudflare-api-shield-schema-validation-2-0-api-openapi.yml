          type: string
        example:
        - thresholds
        uniqueItems: true
    api-shield_zone_id:
      in: path
      name: zone_id
      required: true
      schema:
        $ref: '#/components/schemas/api-shield_identifier-2'
    api-shield_operation_id:
      description: Identifier for the operation
      example: f174e90a-fafe-4643-bbbc-4a0ed4fc8415
      in: path
      name: operation_id
      required: true
      schema:
        $ref: '#/components/schemas/api-shield_uuid'
    api-shield_endpoint_parameter:
      in: query
      name: endpoint
      schema:
        description: Filter results to only include endpoints containing this pattern.
        type: string
        example: /api/v1
    api-shield_old_omit_source:
      description: Omit the source-files of schemas and only retrieve their meta-data.
      in: query
      name: omit_source
      schema:
        type: boolean
        default: false
    api-shield_per_page:
      description: Maximum number of results per page.
      in: query
      name: per_page
      schema:
        type: integer
        default: 20
        maximum: 50
        minimum: 5
