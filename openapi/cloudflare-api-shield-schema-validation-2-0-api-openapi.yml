  title: Cloudflare API Shield Schema Validation 2.0 API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: API Shield Schema Validation 2.0
paths:
  /zones/{zone_id}/api_gateway/operations/schema_validation:
    parameters:
    - $ref: '#/components/parameters/api-shield_zone_id'
    patch:
      operationId: api-shield-schema-validation-update-multiple-operation-level-settings
      summary: Update multiple operation-level schema validation settings
      description: Updates multiple operation-level schema validation settings on the zone. Deprecated; use `/zones/{zone_id}/schema_validation/settings/operations` instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-shield_old_operation_schema_validation_settings_multiple_request'
      responses:
        '200':
          description: Update multiple operation-level schema validation settings response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/api-shield_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/api-shield_old_operation_schema_validation_settings_multiple_request'
                  required:
                  - result
                  type: object
        4XX:
          description: Update multiple operation-level schema validation settings response failure
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/api-shield_api-response-common-failure'
      deprecated: true
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - API Shield Schema Validation 2.0
      x-api-token-group:
      - Account API Gateway
      - Domain API Gateway
      x-fern-ignore: true
      x-fern-sdk-group-name: api-security.schema-validation.legacy.settings.operations
      x-fern-sdk-method-name: bulk-edit
      x-forge-hidden: true
      x-stainless-deprecation-message: Use [Schema Validation API](https://developers.cloudflare.com/api/resources/schema_validation/) instead.
  /zones/{zone_id}/api_gateway/operations/{operation_id}/schema_validation:
    parameters:
    - $ref: '#/components/parameters/api-shield_zone_id'
    - $ref: '#/components/parameters/api-shield_operation_id'
    get:
      operationId: api-shield-schema-validation-retrieve-operation-level-settings
      summary: Retrieve operation-level schema validation settings
      description: Retrieves operation-level schema validation settings on the zone. Deprecated; use `/zones/{zone_id}/schema_validation/settings/operations/{operation_id}` instead.
      responses:
        '200':
          description: Operation-level schema validation settings response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-shield_old_operation_schema_validation_settings'
        4XX:
          description: Operation-level schema validation settings response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-shield_api-response-common-failure'
      deprecated: true
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - API Shield Schema Validation 2.0
      x-api-token-group:
      - Account API Gateway
      - Account API Gateway Read
      - Domain API Gateway
      - Domain API Gateway Read
      x-fern-ignore: true
      x-fern-sdk-group-name: api-security.schema-validation.legacy.settings.operations
      x-fern-sdk-method-name: get
      x-forge-hidden: true
      x-stainless-deprecation-message: Use [Schema Validation API](https://developers.cloudflare.com/api/resources/schema_validation/) instead.
    put:
      operationId: api-shield-schema-validation-update-operation-level-settings
      summary: Update operation-level schema validation settings
      description: Updates operation-level schema validation settings on the zone. Deprecated; use `/zones/{zone_id}/schema_validation/settings/operations/{operation_id}` instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-shield_old_operation_schema_validation_settings_modify_request'
      responses:
        '200':
          description: Update operation-level schema validation settings response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-shield_old_operation_schema_validation_settings'
        4XX:
          description: Update operation-level schema validation settings response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-shield_api-response-common-failure'
      deprecated: true
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - API Shield Schema Validation 2.0
      x-api-token-group:
      - Account API Gateway
      - Domain API Gateway
      x-fern-ignore: true
      x-fern-sdk-group-name: api-security.schema-validation.legacy.settings.operations
      x-fern-sdk-method-name: update
      x-forge-hidden: true
      x-stainless-deprecation-message: Use [Schema Validation API](https://developers.cloudflare.com/api/resources/schema_validation/) instead.
  /zones/{zone_id}/api_gateway/settings/schema_validation:
    parameters:
    - $ref: '#/components/parameters/api-shield_zone_id'
    get:
      operationId: api-shield-schema-validation-retrieve-zone-level-settings
      summary: Retrieve zone level schema validation settings
      description: Retrieves zone level schema validation settings currently set on the zone. Deprecated; use `/zones/{zone_id}/schema_validation/settings` instead.
      responses:
        '200':
          description: Zone level schema validation settings response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-shield_old_zone_schema_validation_settings'
        4XX:
          description: Zone level schema validation settings response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-shield_api-response-common-failure'
      deprecated: true
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - API Shield Schema Validation 2.0
      x-api-token-group:
      - Account API Gateway
      - Account API Gateway Read
      - Domain API Gateway
      - Domain API Gateway Read
      x-fern-ignore: true
      x-fern-sdk-group-name: api-security.schema-validation.legacy.settings
      x-fern-sdk-method-name: get
      x-forge-hidden: true
      x-stainless-deprecation-message: Use [Schema Validation API](https://developers.cloudflare.com/api/resources/schema_validation/) instead.
    patch:
      operationId: api-shield-schema-validation-patch-zone-level-settings
      summary: Update zone level schema validation settings
      description: Updates zone level schema validation settings on the zone. Deprecated; use `/zones/{zone_id}/schema_validation/settings` instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-shield_old_zone_schema_validation_settings_patch'
      responses:
        '200':
          description: Update zone level schema validation settings response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-shield_old_zone_schema_validation_settings'
        4XX:
          description: Update zone level schema validation settings response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-shield_api-response-common-failure'
      deprecated: true
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - API Shield Schema Validation 2.0
      x-api-token-group:
      - Account API Gateway
      - Domain API Gateway
      x-fern-ignore: true
      x-fern-sdk-group-name: api-security.schema-validation.legacy.settings
      x-fern-sdk-method-name: edit
      x-forge-hidden: true
      x-stainless-deprecation-message: Use [Schema Validation API](https://developers.cloudflare.com/api/resources/schema_validation/) instead.
    put:
      operationId: api-shield-schema-validation-update-zone-level-settings
      summary: Update zone level schema validation settings
      description: Updates zone level schema validation settings on the zone. Deprecated; use `/zones/{zone_id}/schema_validation/settings` instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-shield_old_zone_schema_validation_settings_put'
      responses:
        '200':
          description: Update zone level schema validation settings response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-shield_old_zone_schema_validation_settings'
        4XX:
          description: Update zone level schema validation settings response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-shield_api-response-common-failure'
      deprecated: true
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - API Shield Schema Validation 2.0
      x-api-token-group:
      - Account API Gateway
      - Domain API Gateway
      x-fern-ignore: true
      x-fern-sdk-group-name: api-security.schema-validation.legacy.settings
      x-fern-sdk-method-name: update
      x-forge-hidden: true
      x-stainless-deprecation-message: Use [Schema Validation API](https://developers.cloudflare.com/api/resources/schema_validation/) instead.
  /zones/{zone_id}/api_gateway/user_schemas:
    parameters:
    - $ref: '#/components/parameters/api-shield_zone_id'
    get:
      operationId: api-shield-schema-validation-retrieve-information-about-all-schemas
      summary: Retrieve information about all schemas on a zone
      description: Lists all OpenAPI schemas uploaded to API Shield for the zone, including their validation status and associated operations. Deprecated; use `/zones/{zone_id}/schema_validation/schemas` instead.
      parameters:
      - $ref: '#/components/parameters/api-shield_page'
      - $ref: '#/components/parameters/api-shield_per_page'
      - $ref: '#/components/parameters/api-shield_old_omit_source'
      - name: validation_enabled
        in: query
        schema:
          $ref: '#/components/schemas/api-shield_old_validation_enabled'
      responses:
        '200':
          description: Retrieve information about all schemas on a zone response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/api-shield_api-response-collection'
                - properties:
                    result:
                      type: array
                      items:
                        $ref: '#/components/schemas/api-shield_old_public_schema'
                  required:
                  - result
                  type: object
        4XX:
          description: Retrieve information about all schemas on a zone response failure
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/api-shield_api-response-common-failure'
      deprecated: true
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - API Shield Schema Validation 2.0
      x-api-token-group:
      - Account API Gateway
      - Account API Gateway Read
      - Domain API Gateway
      - Domain API Gateway Read
      x-fern-ignore: true
      x-fern-sdk-group-name: api-security.schema-validation.legacy.schemas
      x-fern-sdk-method-name: list
      x-forge-hidden: true
      x-stainless-deprecation-message: Use [Schema Validation API](https://developers.cloudflare.com/api/resources/schema_validation/) instead.
    post:
      operationId: api-shield-schema-validation-post-schema
      summary: Upload a legacy schema
      description: Uploads an OpenAPI schema that defines expected request formats for API endpoints. Deprecated; use `/zones/{zone_id}/schema_validation/schemas` instead.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  description: Schema file bytes
                  type: string
                  format: binary
                kind:
                  $ref: '#/components/schemas/api-shield_old_kind'
                name:
                  description: Name of the schema
                  type: string
                  example: petstore schema
                validation_enabled:
                  description: Flag whether schema is enabled for validation.
                  type: string
                  enum:
                  - 'true'
                  - 'false'
              required:
              - file
              - kind
      responses:
        '200':
          description: Upload a schema response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/api-shield_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/api-shield_old_schema_upload_response'
                  required:
                  - result
                  type: object
        4XX:
          description: Upload a schema response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-shield_old_schema_upload_failure'
      deprecated: true
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - API Shield Schema Validation 2.0
      x-api-token-group:
      - Account API Gateway
      - Domain API Gateway
      x-fern-ignore: true
      x-fern-sdk-group-name: api-security.schema-validation.legacy.schemas
      x-fern-sdk-method-name: create
      x-forge-hidden: true
      x-stainless-deprecation-message: Use [Schema Validation API](https://developers.cloudflare.com/api/resources/schema_validation/) instead.
  /zones/{zone_id}/api_gateway/user_schemas/hosts:
    parameters:
    - $ref: '#/components/parameters/api-shield_zone_id'
    - $ref: '#/components/parameters/api-shield_page'
    - $ref: '#/components/parameters/api-shield_per_page'
    get:
      operationId: api-shield-schema-validation-retrieve-user-schema-hosts
      summary: Retrieve schema hosts in a zone
      description: Lists all unique hosts found in uploaded OpenAPI schemas for the zone. Useful for understanding which domains have schema coverage. Deprecated; use `/zones/{zone_id}/schema_validation/schemas/hosts` instead.
      responses:
        '200':
          description: Retrieve schema hosts in a zone response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/api-shield_api-response-collection'
                - properties:
                    result:
                      type: array
                      items:
                        $ref: '#/components/schemas/api-shield_old_response_user_schemas_hosts'
                  type: object
        4XX:
          description: Retrieve schema hosts in a zone response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-shield_api-response-common-failure'
      deprecated: true
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - API Shield Schema Validation 2.0
      x-api-token-group:
      - Account API Gateway
      - Account API Gateway Read
      - Domain API Gateway
      - Domain API Gateway Read
      x-fern-ignore: true
      x-fern-sdk-group-name: api-security.schema-validation.legacy.schemas.hosts
      x-fern-sdk-method-name: list
      x-forge-hidden: true
      x-stainless-deprecation-message: Use [Schema Validation API](https://developers.cloudflare.com/api/resources/schema_validation/) instead.
  /zones/{zone_id}/api_gateway/user_schemas/{schema_id}:
    parameters:
    - $ref: '#/components/parameters/api-shield_zone_id'
    - $ref: '#/components/parameters/api-shield_old_schema_id'
    delete:
      operationId: api-shield-schema-delete-a-schema
      summary: Delete a schema
      description: Permanently removes an uploaded OpenAPI schema from API Shield schema validation. Operations using this schema will lose their validation rules. Deprecated; use `/zones/{zone_id}/schema_validation/schemas/{schema_id}` instead.
      responses:
        '200':
          description: Delete a schema response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-shield_api-response-single'
        4XX:
          description: Delete a schema response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-shield_api-response-common-failure'
      deprecated: true
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - API Shield Schema Validation 2.0
      x-api-token-group:
      - Account API Gateway
      - Domain API Gateway
      x-fern-ignore: true
      x-fern-sdk-group-name: api-security.schema-validation.legacy.schemas
      x-fern-sdk-method-name: delete
      x-forge-hidden: true
      x-forge-require-confirmation: This operation permanently deletes the legacy uploaded schema and removes its validation coverage.
      x-stainless-deprecation-message: Use [Schema Validation API](https://developers.cloudflare.com/api/resources/schema_validation/) instead.
    get:
      operationId: api-shield-schema-validation-retrieve-information-about-specific-schema
      summary: Retrieve information about a specific schema on a zone
      description: Gets detailed information about a specific uploaded OpenAPI schema, including its contents and validation configuration. Deprecated; use `/zones/{zone_id}/schema_validation/schemas/{schema_id}` instead.
      parameters:
      - $ref: '#/components/parameters/api-shield_old_omit_source'
      responses:
        '200':
          description: Retrieve information about a specific schema on a zone response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/api-shield_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/api-shield_old_public_schema'
                  required:
                  - result
                  type: object
        4XX:
          description: Retrieve information about a specific schema zone response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-shield_api-response-common-failure'
      deprecated: true
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - API Shield Schema Validation 2.0
      x-api-token-group:
      - Account API Gateway
      - Account API Gateway Read
      - Domain API Gateway
      - Domain API Gateway Read
      x-fern-ignore: true
      x-fern-sdk-group-name: api-security.schema-validation.legacy.schemas
      x-fern-sdk-method-name: get
      x-forge-hidden: true
      x-stainless-deprecation-message: Use [Schema Validation API](https://developers.cloudflare.com/api/resources/schema_validation/) instead.
    patch:
      operationId: api-shield-schema-validation-enable-validation-for-a-schema
      summary: Enable validation for a schema
      description: Activates schema validation for an uploaded OpenAPI schema. Requests to matching endpoints will be validated against the schema definitions. Deprecated; use `/zones/{zone_id}/schema_validation/schemas/{schema_id}` instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                validation_enabled:
                  allOf:
                  - $ref: '#/components/schemas/api-shield_old_validation_enabled'
                  - enum:
                    - true
                    type: boolean
      responses:
        '200':
          description: Enable validation for a schema response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/api-shield_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/api-shield_old_public_schema'
                  required:
                  - result
                  type: object
        4XX:
          description: Enable validation for a schema response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-shield_api-response-common-failure'
      deprecated: true
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - API Shield Schema Validation 2.0
      x-api-token-group:
      - Account API Gateway
      - Domain API Gateway
      x-fern-ignore: true
      x-fern-sdk-group-name: api-security.schema-validation.legacy.schemas
      x-fern-sdk-method-name: set-validation
      x-forge-hidden: true
      x-stainless-deprecation-message: Use [Schema Validation API](https://developers.cloudflare.com/api/resources/schema_validation/) instead.
  /zones/{zone_id}/api_gateway/user_schemas/{schema_id}/operations:
    parameters:
    - $ref: '#/components/parameters/api-shield_old_schema_id'
    - $ref: '#/components/parameters/api-shield_zone_id'
    get:
      operationId: api-shield-schema-validation-extract-operations-from-schema
      summary: Retrieve all operations from a schema
      description: Retrieves all operations from the schema. Operations that already exist in API Shield Endpoint Management will be returned as full operations. Deprecated; use `/zones/{zone_id}/schema_validation/schemas/{schema_id}/operations` instead.
      parameters:
      - $ref: '#/components/parameters/api-shield_operation_feature_parameter'
      - $ref: '#/components/parameters/api-shield_host_parameter'
      - $ref: '#/components/parameters/api-shield_method_parameter'
      - $ref: '#/components/parameters/api-shield_endpoint_parameter'
      - $ref: '#/components/parameters/api-shield_page'
      - $ref: '#/components/parameters/api-shield_per_page'
      - name: operation_status
        in: query
        description: Filter results by whether operations exist in API Shield Endpoint Management or not. `new` will just return operations from the schema that do not exist in API Shield Endpoint Management. `existing` will just return operations from the schema that already exist in API Shield Endpoint Management.
        schema:
          type: string
          example: new
          enum:
          - new
          - existing
      responses:
        '200':
          description: Retrieve all operations from a schema response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/api-shield_api-response-collection'
                - properties:
                    result:
                      type: array
                      items:
                        anyOf:
                        - $ref: '#/components/schemas/api-shield_operation'
                        - $ref: '#/components/schemas/api-shield_basic_operation'
                  required:
                  - result
                  type: object
        4XX:
          description: Retrieve all operations from a schema response failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-shield_api-response-common-failure'
      deprecated: true
      security:
      - api_email: []
        api_key: []
        api_token: []
      tags:
      - API Shield Schema Validation 2.0
      x-api-token-group:
      - Account API Gateway
      - Account API Gateway Read
      - Domain API Gateway
      - Domain API Gateway Read
      x-fern-ignore: true
      x-fern-sdk-group-name: api-security.schema-validation.legacy.schemas.operations
      x-fern-sdk-method-name: list
      x-forge-hidden: true
      x-stainless-deprecation-message: Use [Schema Validation API](https://developers.cloudflare.com/api/resources/schema_validation/) instead.
components:
  schemas:
    api-shield_uuid-2:
      allOf:
      - minLength: 36
        type: string
        x-auditable: true
      - $ref: '#/components/schemas/api-shield_uuid'
    api-shield_uuid:
      description: UUID.
      type: string
      example: f174e90a-fafe-4643-bbbc-4a0ed4fc8415
      maxLength: 36
      x-auditable: true
    api-shield_api-response-single:
      type: object
      allOf:
      - $ref: '#/components/schemas/api-shield_api-response-common'
    api-shield_operation_features:
      type: object
      anyOf:
      - $ref: '#/components/schemas/api-shield_operation_feature_thresholds'
      - $ref: '#/components/schemas/api-shield_operation_feature_parameter_schemas'
      - $ref: '#/components/schemas/api-shield_operation_feature_api_routing'
      - $ref: '#/components/schemas/api-shield_operation_feature_confidence_intervals'
      - $ref: '#/components/schemas/api-shield_operation_feature_schema_info'
      readOnly: true
    api-shield_old_response_user_schemas_hosts:
      type: object
      properties:
        created_at:
          $ref: '#/components/schemas/api-shield_timestamp-2'
        hosts:
          description: Hosts serving the schema, e.g zone.host.com
          type: array
          items:
            type: string
        name:
          description: Name of the schema
          type: string
          example: petstore schema
          x-auditable: true
        schema_id:
          $ref: '#/components/schemas/api-shield_uuid-2'
      required:
      - schema_id
      - name
      - hosts
      - created_at
    api-shield_old_validation_default_mitigation_action_patch:
      description: "The default mitigation action used when there is no mitigation action defined on the operation\nMitigation actions are as follows:\n\n  * `log` - log request when request does not conform to schema\n  * `block` - deny access to the site when request does not conform to schema\n\nA special value of of `none` will skip running schema validation entirely for the request when there is no mitigation action defined on the operation\n\n`null` will have no effect.\n"
      type:
      - string
      - 'null'
      example: block
      enum:
      - none
      - log
      - block
      - null
      x-auditable: true
    api-shield_old_kind:
      description: Kind of schema
      type: string
      example: openapi_v3
      enum:
      - openapi_v3
      x-auditable: true
    api-shield_operation_feature_confidence_intervals:
      type: object
      properties:
        confidence_intervals:
          type: object
          properties:
            last_updated:
              $ref: '#/components/schemas/api-shield_timestamp'
            suggested_threshold:
              type: object
              properties:
                confidence_intervals:
                  type: object
                  properties:
                    p90:
                      $ref: '#/components/schemas/api-shield_confidence_intervals_bounds'
                    p95:
                      $ref: '#/components/schemas/api-shield_confidence_intervals_bounds'
                    p99:
                      $ref: '#/components/schemas/api-shield_confidence_intervals_bounds'
                mean:
                  description: Suggested threshold.
                  type: number
                  example: 25.5
                  x-auditable: true
      example:
        confidence_intervals:
          last_updated: '2014-01-01T05:20:00.12345Z'
          suggested_threshold:
            confidence_intervals:
              p90:
                lower: 23.1
                upper: 23.9
              p95:
                lower: 22
                upper: 24.1
              p99:
                lower: 20.2
                upper: 30
            mean: 23.5
      readOnly: true
    api-shield_old_zone_schema_validation_settings:
      type: object
