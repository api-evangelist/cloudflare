openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Worker Script API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Worker Script
paths:
  /accounts/{account_id}/workers/assets/upload:
    post:
      operationId: worker-assets-upload
      summary: Upload Worker Assets
      description: Upload Worker assets ahead of creating a Worker version. To learn more about the direct uploads of assets, see https://developers.cloudflare.com/workers/static-assets/direct-upload/.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: base64
        in: query
        required: true
        schema:
          description: Whether the file contents are base64-encoded. Must be `true`.
          type: boolean
          enum:
          - true
      requestBody:
        required: true
        content:
          multipart/form-data:
            encoding:
              '*':
                contentType: '*/*'
            schema:
              type: object
              additionalProperties:
                description: Base-64 encoded contents of the file. The content type of the file should be included to ensure a valid "Content-Type" header is included in asset responses.
                type: string
      responses:
        '201':
          description: Upload Assets response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_completed-upload-assets-response'
        '202':
          description: Upload Assets response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_upload-assets-response'
        4XX:
          description: Upload Assets response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_api-response-common-failure'
      security:
      - assets_jwt: []
      tags:
      - Worker Script
      x-fern-audiences:
      - sdk
      x-fern-availability: generally-available
      x-fern-sdk-group-name: workers.assets.upload
      x-fern-sdk-method-name: create
  /accounts/{account_id}/workers/scripts:
    get:
      operationId: worker-script-list-workers
      summary: List Worker Scripts
      description: Fetch a list of uploaded Worker scripts.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: tags
        in: query
        description: 'Filter scripts by tags. Format: comma-separated list of tag:allowed pairs where allowed is ''yes'' or ''no''.'
        schema:
          type: string
          example: production:yes,staging:no
      responses:
        '200':
          description: List Workers response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_script-response-collection'
        4XX:
          description: List Workers response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Worker Script
      x-api-token-group:
      - Workers Tail Read
      - Workers Scripts Write
      - Workers Scripts Read
      x-fern-audiences:
      - sdk
      x-fern-availability: deprecated
      x-fern-sdk-group-name: workers.legacy.scripts
      x-fern-sdk-method-name: list
  /accounts/{account_id}/workers/scripts-search:
    get:
      operationId: worker-script-search-workers
      summary: Search Worker Scripts
      description: Search for Worker scripts in an account.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: name
        in: query
        schema:
          description: Worker name to search for. Both exact and partial matches are returned.
          type: string
          example: my-worker
      - name: id
        in: query
        schema:
          description: Worker ID (also called tag) to search for. Only exact matches are returned.
          type: string
          example: bdf3567828824b74aadd550004cf4913
      - name: order_by
        in: query
        schema:
          description: Property to sort results by. Results are sorted in ascending order.
          type: string
          example: created_on
          default: name
          enum:
          - created_on
          - modified_on
          - name
      - name: page
        in: query
        description: Current page.
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        description: Items per page.
        schema:
          type: integer
          default: 10
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: Search Workers success.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers_api-response-collection'
                - properties:
                    result:
                      type: array
                      items:
                        properties:
                          created_on:
                            $ref: '#/components/schemas/workers_created_on'
                          environment_is_default:
                            description: Whether the environment is the default environment.
                            type: boolean
                            example: true
                          environment_name:
                            description: Name of the environment.
                            type: string
                            example: production
                          id:
                            $ref: '#/components/schemas/workers_identifier'
                          modified_on:
                            $ref: '#/components/schemas/workers_modified_on'
                          script_name:
                            $ref: '#/components/schemas/workers_script_name'
                          service_name:
                            description: Name of the service.
                            type: string
                            example: my-service
                        required:
                        - id
                        - script_name
                        - created_on
                        - modified_on
                        type: object
                  required:
                  - result
                  type: object
        4XX:
          description: Search Workers failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Worker Script
      x-api-token-group:
      - Workers Tail Read
      - Workers Scripts Write
      - Workers Scripts Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: workers.scripts
      x-fern-sdk-method-name: search
  /accounts/{account_id}/workers/scripts/{script_name}:
    delete:
      operationId: worker-script-delete-worker
      summary: Delete Worker
      description: Delete your worker. This call has no response body on a successful delete.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: script_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_script_name'
      - name: force
        in: query
        description: If true, delete the Worker even when other Workers still reference it. Service bindings in those Workers may be left broken. Durable Object namespaces implemented by the deleted Worker are deleted even if other Workers reference them.
        schema:
          type: boolean
        x-fern-parameter-name: delete-with-references
      responses:
        '200':
          description: Delete Worker response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_api-response-null-result'
        4XX:
          description: Delete Worker response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Worker Script
      x-api-token-group:
      - Workers Scripts Write
      x-fern-audiences:
      - sdk
      x-fern-availability: deprecated
      x-fern-sdk-group-name: workers.legacy.scripts
      x-fern-sdk-method-name: delete
      x-forge-require-confirmation: This will permanently delete the Worker script.
    get:
      operationId: worker-script-download-worker
      summary: Download Worker Script
      description: Fetch raw content for a Worker script. Note this is the original script content, not JSON encoded.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: script_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_script_name'
      responses:
        '200':
          description: Worker successfully downloaded. Returns script content as a multipart form, with no metadata part and no JSON encoding applied.
          content:
            application/javascript:
              schema:
                type: string
                example: "export default {\n  async fetch(request, env, ctx) {\n    return new Response(\"Hello, world!\");\n  }\n};\n"
            multipart/form-data:
              schema:
                type: object
                additionalProperties:
                  description: Modules used by the Worker, including JavaScript files and source maps.
                  format: binary
                  type: string
        4XX:
          description: Download Worker response failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Worker Script
      x-api-token-group:
      - Workers Tail Read
      - Workers Scripts Write
      - Workers Scripts Read
      x-fern-audiences:
      - sdk
      x-fern-availability: deprecated
      x-fern-sdk-group-name: workers.legacy.scripts
      x-fern-sdk-method-name: get
    put:
      operationId: worker-script-upload-worker-module
      summary: Upload Worker Module
      description: 'Upload a worker module. You can find more about the multipart metadata on our docs: https://developers.cloudflare.com/workers/configuration/multipart-upload-metadata/.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: script_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_script_name'
      - name: bindings_inherit
        in: query
        description: When set to "strict", the upload will fail if any `inherit` type bindings cannot be resolved against the previous version of the Worker. Without this, unresolvable inherit bindings are silently dropped.
        schema:
          type: string
          enum:
          - strict
      requestBody:
        $ref: '#/components/requestBodies/workers_script_upload'
      responses:
        '200':
          description: Upload Worker Module response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers_script-response-upload-single'
                - example:
                    errors: []
                    messages: []
                    result:
                      created_on: '2022-05-05T05:15:11.602148Z'
                      etag: 777f24a43bef5f69174aa69ceaf1dea67968d510a31d1vw3e49d34a0187c06d1
                      handlers:
                      - fetch
                      id: this-is_my_script-01
                      logpush: false
                      modified_on: '2022-05-20T19:02:56.446492Z'
                      placement:
                        mode: smart
                      startup_time_ms: 10
                      tail_consumers:
                      - environment: production
                        service: my-log-consumer
                      usage_model: standard
                    success: true
                  type: object
        4XX:
          description: 'Upload Worker Module response failure. When the upload uses the

            declarative `exports` field and one or more entries fail

            reconciliation, the response is the exports reconciliation

            error envelope (error code 100402) with per-class detail in

            `errors[].meta.details`.

            '
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/workers_api-response-common-failure'
                - $ref: '#/components/schemas/workers_exports_reconciliation_error_response'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Worker Script
      x-api-token-group:
      - Workers Scripts Write
      x-fern-audiences:
      - sdk
      x-fern-availability: deprecated
      x-fern-sdk-group-name: workers.legacy.scripts
      x-fern-sdk-method-name: update
  /accounts/{account_id}/workers/scripts/{script_name}/assets-upload-session:
    post:
      operationId: worker-script-update-create-assets-upload-session
      summary: Create Worker Assets Upload Session
      description: Start uploading a collection of assets for use in a Worker version. To learn more about the direct uploads of assets, see https://developers.cloudflare.com/workers/static-assets/direct-upload/.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: script_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_script_name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workers_create-assets-upload-session-object'
      responses:
        '200':
          description: Create Assets Upload Session response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_create-assets-upload-session-response'
        4XX:
          description: Create Assets Upload Session response failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers_create-assets-upload-session-response'
                - $ref: '#/components/schemas/workers_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Worker Script
      x-api-token-group:
      - Workers Scripts Write
      x-fern-audiences:
      - sdk
      x-fern-availability: generally-available
      x-fern-sdk-group-name: workers.assets.upload
      x-fern-sdk-method-name: create-session
  /accounts/{account_id}/workers/scripts/{script_name}/content:
    put:
      operationId: worker-script-put-content
      summary: Replace Worker Script Content
      description: Replace Worker script content without touching config or metadata.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: script_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_script_name'
      - name: CF-WORKER-BODY-PART
        in: header
        description: The multipart name of a script upload part containing script content in service worker format. Alternative to including in a metadata part.
        schema:
          type: string
      - name: CF-WORKER-MAIN-MODULE-PART
        in: header
        description: The multipart name of a script upload part containing script content in es module format. Alternative to including in a metadata part.
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            encoding:
              files:
                contentType: application/javascript+module, text/javascript+module, application/javascript, text/javascript, text/x-python, text/x-python-requirement, application/wasm, text/plain, application/octet-stream, application/source-map
              metadata:
                contentType: application/json
            schema:
              type: object
              properties:
                files:
                  description: 'An array of modules (often JavaScript files) comprising a Worker script. At least one module must be present and referenced in the metadata as `main_module` or `body_part` by filename.<br/>Possible Content-Type(s) are: `application/javascript+module`, `text/javascript+module`, `application/javascript`, `text/javascript`, `text/x-python`, `text/x-python-requirement`, `application/wasm`, `text/plain`, `application/octet-stream`, `application/source-map`.'
                  type: array
                  items:
                    format: binary
                    type: string
                  x-stainless-collection-type: set
                metadata:
                  description: JSON-encoded metadata about the uploaded parts and Worker configuration.
                  type: object
                  properties:
                    body_part:
                      description: Name of the uploaded file that contains the Worker script (e.g. the file adding a listener to the `fetch` event). Indicates a `service worker syntax` Worker.
                      type: string
                      example: worker.js
                    main_module:
                      description: Name of the uploaded file that contains the main module (e.g. the file exporting a `fetch` handler). Indicates a `module syntax` Worker.
                      type: string
                      example: worker.js
              required:
              - metadata
      responses:
        '200':
          description: Put script content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_script-response-single'
        4XX:
          description: Put script content failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Worker Script
      x-api-token-group:
      - Workers Scripts Write
      x-fern-audiences:
      - sdk
      x-fern-availability: deprecated
      x-fern-sdk-group-name: workers.legacy.scripts.content
      x-fern-sdk-method-name: update
  /accounts/{account_id}/workers/scripts/{script_name}/content/v2:
    get:
      operationId: worker-script-get-content
      summary: Get Worker Script Content
      description: Fetch Worker script content only.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: script_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_script_name'
      responses:
        '200':
          description: Fetch script content.
          content:
            string:
              schema:
                type: string
                example: "export default {\n  async fetch(request, env, ctx) {\n    return new Response(\"Hello, world!\");\n  }\n};\n"
        4XX:
          description: Fetch script content failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Worker Script
      x-api-token-group:
      - Workers Tail Read
      - Workers Scripts Write
      - Workers Scripts Read
      x-fern-audiences:
      - sdk
      x-fern-availability: deprecated
      x-fern-sdk-group-name: workers.legacy.scripts.content
      x-fern-sdk-method-name: get
  /accounts/{account_id}/workers/scripts/{script_name}/script-settings:
    get:
      operationId: worker-script-settings-get-settings
      summary: Get Worker Script Settings
      description: Get Worker script-level settings when using Worker Versions. Includes Logpush and Tail Consumers.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: script_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_script_name'
      responses:
        '200':
          description: Fetch script settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_script-settings-response'
        4XX:
          description: Fetch script settings failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Worker Script
      x-api-token-group:
      - Workers Tail Read
      - Workers Scripts Write
      - Workers Scripts Read
      x-fern-audiences:
      - sdk
      x-fern-availability: deprecated
      x-fern-sdk-group-name: workers.legacy.scripts.settings
      x-fern-sdk-method-name: get
    patch:
      operationId: worker-script-settings-patch-settings
      summary: Patch Worker Script Settings
      description: Patch Worker script-level settings when using Worker Versions. Including but not limited to Logpush and Tail Consumers.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: script_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_script_name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workers_script-settings-item'
      responses:
        '200':
          description: Patch script settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_script-settings-response'
        4XX:
          description: 'Patch script settings failure. When the patch uses the

            declarative `exports` field and one or more entries fail

            reconciliation, the response is the exports reconciliation

            error envelope (error code 100402) with per-class detail in

            `errors[].meta.details`.

            '
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/workers_api-response-common-failure'
                - $ref: '#/components/schemas/workers_exports_reconciliation_error_response'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Worker Script
      x-api-token-group:
      - Workers Scripts Write
      x-fern-audiences:
      - sdk
      x-fern-availability: deprecated
      x-fern-sdk-group-name: workers.legacy.scripts.settings
      x-fern-sdk-method-name: edit
  /accounts/{account_id}/workers/scripts/{script_name}/secrets:
    get:
      operationId: worker-list-script-secrets
      summary: List secrets bound to a Worker script
      description: List the names of secrets bound to a Worker script.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: script_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_script_name'
      responses:
        '200':
          description: List script secrets.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers_api-response-common'
                - properties:
                    result:
                      type: array
                      items:
                        $ref: '#/components/schemas/workers_secret'
                  type: object
        4XX:
          description: List script secrets failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Worker Script
      x-api-token-group:
      - Workers Tail Read
      - Workers Scripts Write
      - Workers Scripts Read
      x-fern-availability: generally-available
      x-fern-sdk-group-name: workers.secrets
      x-fern-sdk-method-name: list
    put:
      operationId: worker-put-script-secret
      summary: Add a secret to a Worker script
      description: 'Add a secret to a Worker script by creating a new version with that secret.


        When changing more than one secret at a time, prefer the "Patch multiple

        script secrets" API instead of changing many secrets individually.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: script_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_script_name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workers_secret'
      responses:
        '200':
          description: Put script secret binding success.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/workers_api-response-common'
                - properties:
                    result:
                      $ref: '#/components/schemas/workers_secret'
                  type: object
        '429':
          description: Too many requests are currently modifying the script.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_api-response-common-failure'
        4XX:
          description: Put script secret binding failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workers_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Worker Script
      x-api-token-group:
      - Workers Scripts Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: workers.secrets
      x-fern-sdk-method-name: update
  /accounts/{account_id}/workers/scripts/{script_name}/secrets-bulk:
    patch:
      operationId: worker-patch-script-secrets-bulk
      summary: Patch multiple Worker script secrets
      description: 'Create, update, or delete multiple secrets on a Worker script in a single operation using JSON Merge Patch (RFC 7396).

        This operation creates a single version with all changes included.

        Prefer this API instead of changing many secrets individually.


        Usage:


        - To create or update a secret, set its value to a secret object.

        - To delete a secret, set its value to `null`.

        - Secrets not included in the request are left unchanged.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_identifier'
      - name: script_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/workers_script_name'
      requestBody:
        required: true
