components:
  schemas:
    workers_placement_mode:
      description: Configuration for [Smart Placement](https://developers.cloudflare.com/workers/configuration/smart-placement). Specify mode='smart' for Smart Placement, or one of region/hostname/host.
      type: string
      enum:
      - smart
      - targeted
      x-auditable: true
    workers_api-response-collection:
      type: object
      allOf:
      - $ref: '#/components/schemas/workers_api-response-common'
      - properties:
          result_info:
            type: object
            properties:
              count:
                description: Total number of results for the requested service.
                type: number
                example: 1
              page:
                description: Current page within paginated list of results.
                type: number
                example: 1
              per_page:
                description: Number of results per page of results.
                type: number
                example: 20
              total_count:
                description: Total results available without any search parameters.
                type: number
                example: 2000
              total_pages:
                description: The number of total pages in the entire result set.
                type: number
                example: 100
        type: object
    workers_user_limits:
      description: User-defined resource limits for Workers with standard usage model.
      type:
      - object
      - 'null'
      properties:
        cpu_ms:
          description: The amount of CPU time this Worker can use in milliseconds.
          type:
          - integer
          - 'null'
          example: 50
    workers_binding_kind_secrets_store_secret:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/workers_binding_name'
        secret_name:
          description: Name of the secret in the store.
          type: string
          example: my_secret
          x-auditable: true
        store_id:
          description: ID of the store containing the secret.
          type: string
          example: 8c8b1387108e49be85669169793e7bd2
          x-auditable: true
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - secrets_store_secret
          x-auditable: true
      required:
      - name
      - type
      - store_id
      - secret_name
    workers_tail_consumers:
      description: List of Workers that will consume logs from the attached Worker.
      type:
      - array
      - 'null'
      items:
        $ref: '#/components/schemas/workers_tail_consumers_script'
      x-stainless-collection-type: set
    workers_binding_kind_data_blob:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/workers_binding_name'
        part:
          description: The name of the file containing the data content. Only accepted for `service worker syntax` Workers.
          type: string
          example: my-module.bin
          x-auditable: true
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - data_blob
          deprecated: true
          x-auditable: true
      required:
      - name
      - type
      - part
    workers_secret:
      description: A secret value accessible through a binding.
      type: object
      discriminator:
        mapping:
          secret_key: '#/components/schemas/workers_binding_kind_secret_key'
          secret_text: '#/components/schemas/workers_binding_kind_secret_text'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/workers_binding_kind_secret_text'
      - $ref: '#/components/schemas/workers_binding_kind_secret_key'
    workers_durable_object_export:
      description: 'A live Durable Object export (`state: created`, the default). The

        platform auto-provisions the namespace on first deploy, matches it

        on subsequent deploys, and never mutates or deletes it as a side

        effect of a code-only change. `storage` is required; `renamed_to`,

        `transferred_to` and `transfer_from` are not allowed on a live

        entry.

        '
      type: object
      properties:
        container:
          description: 'Name of the container (declared in the upload''s

            `metadata.containers`) that backs this Durable Object. When

            set, the namespace is container-enabled. Valid only on live

            entries.

            '
          type: string
          example: my-container
          maxLength: 128
        state:
          description: Live export. May be omitted; defaults to `created`.
          type: string
          default: created
          enum:
          - created
        storage:
          $ref: '#/components/schemas/workers_export_storage'
        type:
          description: Marks this entry as a Durable Object export.
          type: string
          enum:
          - durable-object
      additionalProperties: false
      required:
      - type
      - storage
    workers_placement_status:
      description: Status of [Smart Placement](https://developers.cloudflare.com/workers/configuration/smart-placement).
      type: string
      enum:
      - SUCCESS
      - UNSUPPORTED_APPLICATION
      - INSUFFICIENT_INVOCATIONS
      readOnly: true
      x-auditable: true
    workers_usage_model:
      description: Usage model for the Worker invocations.
      type: string
      example: standard
      default: standard
      enum:
      - standard
      - bundled
      - unbound
      x-auditable: true
    workers_binding_kind_ratelimit:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/workers_binding_name'
        namespace_id:
          description: Identifier of the rate limit namespace to bind to.
          type: string
          example: '1234'
          x-auditable: true
        simple:
          description: The rate limit configuration.
          type: object
          properties:
            limit:
              description: The limit (requests per period).
              type: number
              example: 100
              x-auditable: true
            mitigation_timeout:
              description: 'Duration in seconds to apply the mitigation action after the rate limit is exceeded. Valid values are 0 (disabled), 10, or multiples of 60 up to 86400. Must be greater than or equal to the period when non-zero.

                '
              type: integer
              example: 60
              x-auditable: true
            period:
              description: The period in seconds.
              type: integer
              example: 60
              x-auditable: true
          required:
          - limit
          - period
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - ratelimit
          x-auditable: true
      required:
      - name
      - type
      - namespace_id
      - simple
    workers_binding_kind_assets:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/workers_binding_name'
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - assets
          x-auditable: true
      required:
      - name
      - type
    workers_binding_kind_vectorize:
      type: object
      properties:
        index_name:
          description: Name of the Vectorize index to bind to.
          type: string
          example: my-index-name
          x-auditable: true
        name:
          $ref: '#/components/schemas/workers_binding_name'
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - vectorize
          x-auditable: true
      required:
      - name
      - type
      - index_name
    workers_binding_kind_inherit:
      type: object
      properties:
        name:
          description: The name of the inherited binding.
          type: string
          example: MY_BINDING
          x-auditable: true
        old_name:
          description: The old name of the inherited binding. If set, the binding will be renamed from `old_name` to `name` in the new version. If not set, the binding will keep the same name between versions.
          type: string
          example: MY_OLD_BINDING
          x-auditable: true
        type:
          description: The kind of resource that the binding provides.
          type: string
          enum:
          - inherit
          x-auditable: true
        version_id:
          description: Identifier for the version to inherit the binding from, which can be the version ID or the literal "latest" to inherit from the latest version. Defaults to inheriting the binding from the latest version.
          type: string
          example: 8969331f-7192-434c-9938-6aea24ed58bf
          default: latest
          x-auditable: true
      required:
      - name
      - type
    workers_script-settings-item:
      type: object
      properties:
        logpush:
          $ref: '#/components/schemas/workers_logpush'
        observability:
          allOf:
          - $ref: '#/components/schemas/workers_observability-2'
          - type:
            - object
            - 'null'
            x-auditable: true
        tags:
          allOf:
          - $ref: '#/components/schemas/workers_tags'
          - items:
              $ref: '#/components/schemas/workers_tag'
            type:
            - array
            - 'null'
            x-auditable: true
        tail_consumers:
          description: List of Workers that will consume logs from the attached Worker.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/workers_tail_consumers_script'
          x-stainless-collection-type: set
    workers_exports_config_map:
      description: 'Declarative exports for the Worker, keyed by export name. Worker

        entrypoint entries (`type: worker`) carry cache configuration for

        that entrypoint. Durable Object entries (`type: durable-object`)

        are also configured here and drive namespace reconciliation. At

        most 100 entries; class names are at most 128 characters.

        '
      type: object
      example:
        Admin:
          cache:
            enabled: true
          type: worker
        Counter:
          storage: sqlite
          type: durable-object
        OldCounter:
          renamed_to: Counter
          state: renamed
          type: durable-object
        default:
          cache:
            enabled: false
          type: worker
      additionalProperties:
        $ref: '#/components/schemas/workers_export_config'
      maxProperties: 100
    workers_binding_name:
      description: A JavaScript variable name for the binding.
      type: string
      example: myBinding
      x-auditable: true
    workers_exports_reconciliation_result:
      description: 'Summary of what the declarative exports reconciliation did on this

        upload. Present only on uploads that included an `exports` block.

        Reconciliation acts on Durable Object entries; `type: worker`

        entries in the same map do not participate. Every array is always

        present (possibly empty) so clients can iterate unconditionally.

        Clients should surface `warnings` prominently, render `info` at

        lower visibility, and use `removable_entries` as the "safe to

        delete from your config" hint.

        '
      type: object
      properties:
        created:
          description: Class names for which a new namespace was provisioned.
          type: array
          items:
            type: string
        deleted:
          description: Class names whose namespace was deleted by a `deleted` tombstone.
          type: array
          items:
            type: string
        info:
          description: 'Non-blocking info entries (stale tombstones, tombstone applied

            with class still in code). See `exports_reconciliation_info`.

            '
          type: array
          items:
            $ref: '#/components/schemas/workers_exports_reconciliation_info'
        removable_entries:
          description: 'Source class names whose tombstone entry is now stale and safe

            to delete from `exports` (no remaining referencing scripts).

            '
          type: array
          items:
            type: string
        renamed:
          description: Applied `renamed` tombstones.
          type: array
          items:
            $ref: '#/components/schemas/workers_exports_reconciliation_rename'
        transfer_pending:
          description: Phase-1 transfer hints recorded on the target side.
          type: array
          items:
            $ref: '#/components/schemas/workers_exports_reconciliation_transfer_pending'
        transferred:
          description: Committed `transferred` tombstones (phase-2).
          type: array
          items:
            $ref: '#/components/schemas/workers_exports_reconciliation_transfer'
        updated:
          description: Class names whose provisioned namespace was mutated in place.
          type: array
          items:
            type: string
        warnings:
          description: Non-blocking warnings. See `exports_reconciliation_warning`.
          type: array
          items:
            $ref: '#/components/schemas/workers_exports_reconciliation_warning'
      readOnly: true
      required:
      - created
      - updated
      - deleted
      - renamed
      - transferred
      - transfer_pending
      - warnings
      - info
      - removable_entries
