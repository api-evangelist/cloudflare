        chat_download_url_expiry:
          description: Time when the download URL will expire
          type: string
      required:
      - chat_download_url
      - chat_download_url_expiry
  responses:
    realtimekit_GetSessions:
      description: Get all sessions success response
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/realtimekit_ActiveSession'
              paging:
                type: object
                properties:
                  end_offset:
                    type: number
                  start_offset:
                    type: number
                  total_count:
                    type: number
                    minimum: 0
              success:
                type: boolean
    realtimekit_GetSessionDetails:
      description: Get details about a particular session
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/realtimekit_ActiveSession'
              success:
                type: boolean
    realtimekit_GetSessionParticipants:
      description: Get participants list of a particular session
      content:
        application/json:
          examples:
            ParticipantListSuccess:
              $ref: '#/components/examples/realtimekit_ParticipantListSuccess'
            ParticipantListWithPeerStatsSuccess:
              $ref: '#/components/examples/realtimekit_ParticipantListWithPeerEventSucces'
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  participants:
                    type: array
                    items:
                      $ref: '#/components/schemas/realtimekit_ParticipantsList'
              success:
                type: boolean
    realtimekit_GetSessionChat:
      description: Returns all chat messages of a session.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/realtimekit_ChatMessage'
              success:
                type: boolean
    realtimekit_GetSessionTranscriptSummary:
      description: Returns a complete summary of transcripts of a session.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/realtimekit_TranscriptSummary'
              success:
                type: boolean
    realtimekit_GetParticipantDataFromPeerId:
      description: Returns details of a participant using peer ID, including the peer report.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  participant:
                    $ref: '#/components/schemas/realtimekit_PeerParticipantDetails'
              success:
                type: boolean
    realtimekit_GetParticipantDetails:
      description: Returns details of a participant.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  participant:
                    $ref: '#/components/schemas/realtimekit_ParticipantsList'
              success:
                type: boolean
    realtimekit_GetSessionTranscript:
      description: Returns the complete transcript of a session.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/realtimekit_Transcript'
              success:
                type: boolean
