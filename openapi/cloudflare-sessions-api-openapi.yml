        fir_count:
          type: number
        frame_height:
          type: number
        frame_width:
          type: number
        frames_encoded:
          type: number
        frames_per_second:
          type: number
        jitter:
          type: number
        key_frames_encoded:
          type: number
        mid:
          type: string
        mos_quality:
          type: number
        packets_lost:
          type: number
        packets_sent:
          type: number
        pli_count:
          type: number
        producer_id:
          type: string
        quality_limitation_durations:
