        p75:
          type: number
        p90:
          type: number
    realtimekit_AudioConsumerStats:
      description: Per-sample inbound (consumer) audio statistics.
      type: object
      properties:
        bytes_received:
          type: number
        concealment_events:
          type: number
        consumer_id:
          type: string
        jitter:
          type: number
        jitter_buffer_delay:
          type: number
        jitter_buffer_emitted_count:
          type: number
        mid:
          type: string
        mos_quality:
          type: number
        packets_lost:
          type: number
        packets_received:
          type: number
        peer_id:
          type: string
        producer_id:
          type: string
        ssrc:
          type: number
        timestamp:
          type: string
    realtimekit_ActiveSession:
      type: object
      properties:
        associated_id:
          description: ID of the meeting this session is associated with. In the case of V2 meetings, it is always a UUID. In V1 meetings, it is a room name of the form `abcdef-ghijkl`
          type: string
        breakout_rooms:
          type: array
          items:
            $ref: '#/components/schemas/realtimekit_ActiveSession'
          readOnly: true
        created_at:
          description: timestamp when session created
          type: string
        ended_at:
          description: timestamp when session ended
          type: string
        id:
          description: ID of the session
          type: string
          readOnly: true
        live_participants:
          description: number of participants currently in the session
          type: number
        max_concurrent_participants:
          description: number of maximum participants that were in the session
          type: number
        meeting_display_name:
          description: Title of the meeting this session belongs to
          type: string
        minutes_consumed:
          description: number of minutes consumed since the session started
          type: number
        organization_id:
          description: App id that hosted this session
          type: string
        started_at:
          description: timestamp when session started
          type: string
        status:
          description: current status of session
          type: string
          enum:
          - LIVE
          - ENDED
        type:
          description: type of session
          type: string
          enum:
          - meeting
          - livestream
          - participant
        updated_at:
          description: timestamp when session was last updated
          type: string
      required:
      - id
      - associated_id
      - meeting_display_name
      - type
      - status
      - live_participants
      - max_concurrent_participants
      - minutes_consumed
      - organization_id
      - started_at
      - created_at
      - updated_at
    realtimekit_ParticipantsList:
      type: object
      properties:
        created_at:
          description: timestamp when this participant was created.
          type: string
        custom_participant_id:
          description: ID passed by client to create this participant.
          type: string
        display_name:
          description: Display name of participant when joining the session.
          type: string
        duration:
          description: number of minutes for which the participant was in the session.
          type: number
        id:
          description: Participant ID. This maps to the corresponding peerId.
          type: string
        joined_at:
          description: timestamp at which participant joined the session.
          type: string
        left_at:
          description: timestamp at which participant left the session.
          type: string
        peer_events:
          description: Connection lifecycle events for the participant's peer. Only included when `include_peer_events` is true.
          type: array
          items:
            $ref: '#/components/schemas/realtimekit_PeerEvent'
        preset_name:
          description: Name of the preset associated with the participant.
          type: string
        updated_at:
          description: timestamp when this participant's data was last updated.
          type: string
        user_id:
          description: User id for this participant.
          type: string
    realtimekit_PeerParticipantDetails:
      type: object
      properties:
        created_at:
          description: timestamp when this participant was created.
          type: string
        custom_participant_id:
          description: ID passed by client to create this participant.
          type: string
        display_name:
          description: Display name of participant when joining the session.
          type: string
        duration:
          description: number of minutes for which the participant was in the session.
          type: number
        id:
          description: ID of the participant.
          type: string
          format: uuid
        joined_at:
          description: timestamp at which participant joined the session.
          type: string
        left_at:
          description: timestamp at which participant left the session.
          type: string
        peer_events:
          description: Connection lifecycle events for the participant's peer.
          type: array
          items:
            $ref: '#/components/schemas/realtimekit_PeerEvent'
        peer_report:
          $ref: '#/components/schemas/realtimekit_PeerReport'
        role:
          description: Name of the preset associated with the participant.
          type: string
        session_id:
          type: string
          format: uuid
        updated_at:
          description: timestamp when this participant's data was last updated.
          type: string
        user_id:
          description: User id for this participant.
          type: string
    realtimekit_PeerReportEvent:
      description: A timestamped event recorded during the participant's connection.
      type: object
      properties:
        metadata:
          description: Event-specific metadata. Keys vary per event; values are primitive scalars (string, number, boolean, or null).
          type: object
          additionalProperties:
            oneOf:
            - type: string
            - type: number
            - type: boolean
        name:
          description: Name of the event.
          type: string
        timestamp:
          description: Timestamp when the event occurred.
          type: string
    realtimekit_PeerReport:
      description: Peer call statistics report.
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/realtimekit_PeerReportMetadata'
        quality:
          $ref: '#/components/schemas/realtimekit_PeerReportQuality'
    realtimekit_Transcript:
      type: object
      properties:
        sessionId:
          type: string
