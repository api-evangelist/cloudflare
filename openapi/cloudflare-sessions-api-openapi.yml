openapi: 3.2.0
info:
  description: Welcome to Cloudflare's API documentation site.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Cloudflare Sessions API
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
security:
- api_email: []
  api_key: []
- api_token: []
- user_service_key: []
tags:
- name: Sessions
paths:
  /accounts/{account_id}/realtime/kit/{app_id}/sessions:
    get:
      operationId: GetSessions
      summary: Fetch all sessions of an App
      description: Returns details of all sessions of an App.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_account_identifier'
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_app_id'
      - $ref: '#/components/parameters/realtimekit_pageNo'
      - $ref: '#/components/parameters/realtimekit_perPage'
      - $ref: '#/components/parameters/realtimekit_sortBy'
      - $ref: '#/components/parameters/realtimekit_sortOrder'
      - $ref: '#/components/parameters/realtimekit_startTime'
      - $ref: '#/components/parameters/realtimekit_endTime'
      - $ref: '#/components/parameters/realtimekit_participants'
      - $ref: '#/components/parameters/realtimekit_status'
      - name: search
        in: query
        description: Search string that matches sessions based on meeting title, meeting ID, and session ID
        schema:
          type: string
      - name: associated_id
        in: query
        description: ID of the meeting that sessions should be associated with
        schema:
          type: string
          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/realtimekit_GetSessions'
      security:
      - api_token: []
      tags:
      - Sessions
      x-api-token-group:
      - Realtime Admin
      - Realtime
      x-fern-availability: beta
      x-fern-sdk-group-name: realtime.kit.sessions
      x-fern-sdk-method-name: list
  /accounts/{account_id}/realtime/kit/{app_id}/sessions/peer-report/{peer_id}:
    get:
      operationId: GetParticipantDataFromPeerId
      summary: Fetch details of peer
      description: Returns participant details for the given peer ID along with call statistics.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_account_identifier'
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_app_id'
      - name: filters
        in: query
        description: Filter to apply to the peer report.
        schema:
          type: string
          example: device_info
          enum:
          - device_info
          - ip_information
          - precall_network_information
          - events
          - quality_stats
      - name: include_peer_events
        in: query
        description: if true, response includes all the peer events of participant.
        schema:
          type: boolean
          default: false
      - name: peer_id
        in: path
        description: ID of the peer
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/realtimekit_GetParticipantDataFromPeerId'
      security:
      - api_token: []
      tags:
      - Sessions
      x-api-token-group:
      - Realtime Admin
      - Realtime
      x-fern-availability: beta
      x-fern-sdk-group-name: realtime.kit.sessions.peers
      x-fern-sdk-method-name: get
  /accounts/{account_id}/realtime/kit/{app_id}/sessions/{session_id}:
    get:
      operationId: GetSessionDetails
      summary: Fetch details of a session
      description: Returns data of the given session ID including recording details.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_account_identifier'
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_app_id'
      - name: include_breakout_rooms
        in: query
        description: List all breakout rooms
        schema:
          type: boolean
          default: false
      - name: session_id
        in: path
        description: ID of the session
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/realtimekit_GetSessionDetails'
      security:
      - api_token: []
      tags:
      - Sessions
      x-api-token-group:
      - Realtime Admin
      - Realtime
      x-fern-availability: beta
      x-fern-sdk-group-name: realtime.kit.sessions
      x-fern-sdk-method-name: get
  /accounts/{account_id}/realtime/kit/{app_id}/sessions/{session_id}/chat:
    get:
      operationId: GetSessionChat
      summary: Fetch all chat messages of a session
      description: Returns a URL to download all chat messages of the session ID in CSV format.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_account_identifier'
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_app_id'
      - name: session_id
        in: path
        description: ID of the session
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/realtimekit_GetSessionChat'
      security:
      - api_token: []
      tags:
      - Sessions
      x-api-token-group:
      - Realtime Admin
      - Realtime
      x-fern-availability: beta
      x-fern-sdk-group-name: realtime.kit.sessions.chat
      x-fern-sdk-method-name: export
  /accounts/{account_id}/realtime/kit/{app_id}/sessions/{session_id}/participants:
    get:
      operationId: GetSessionParticipants
      summary: Fetch participants list of a session
      description: Returns a list of participants for the given session ID.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_account_identifier'
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_app_id'
      - name: search
        in: query
        description: The search query string. You can search using participant ID, custom participant ID, or display name.
        schema:
          type: string
      - $ref: '#/components/parameters/realtimekit_pageNo'
      - name: per_page
        in: query
        description: Number of results per page.
        schema:
          type: integer
          default: 25
          maximum: 200
          minimum: 1
      - $ref: '#/components/parameters/realtimekit_sortOrder'
      - $ref: '#/components/parameters/realtimekit_participantsSortBy'
      - name: include_peer_events
        in: query
        description: if true, response includes all the peer events of participants.
        schema:
          type: boolean
          default: false
      - name: view
        in: query
        description: In breakout room sessions, the view parameter can be set to `raw` for session specific duration for participants or `consolidated` to accumulate breakout room durations.
        schema:
          type: string
          default: raw
          enum:
          - raw
          - consolidated
      - name: session_id
        in: path
        description: ID of the session
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/realtimekit_GetSessionParticipants'
      security:
      - api_token: []
      tags:
      - Sessions
      x-api-token-group:
      - Realtime Admin
      - Realtime
      x-fern-availability: beta
      x-fern-sdk-group-name: realtime.kit.sessions.participants
      x-fern-sdk-method-name: list
  /accounts/{account_id}/realtime/kit/{app_id}/sessions/{session_id}/participants/{participant_id}:
    get:
      operationId: GetParticipantDetails
      summary: Fetch details of a participant
      description: Returns details of the given participant ID for the given session ID. Use the peer report endpoint to retrieve call statistics.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_account_identifier'
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_app_id'
      - name: include_peer_events
        in: query
        description: if true, response includes all the peer events of participant.
        schema:
          type: boolean
          default: false
      - name: participant_id
        in: path
        description: ID of the participant
        required: true
        schema:
          type: string
          format: uuid
      - name: session_id
        in: path
        description: ID of the session
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/realtimekit_GetParticipantDetails'
      security:
      - api_token: []
      tags:
      - Sessions
      x-api-token-group:
      - Realtime Admin
      - Realtime
      x-fern-availability: beta
      x-fern-sdk-group-name: realtime.kit.sessions.participants
      x-fern-sdk-method-name: get
  /accounts/{account_id}/realtime/kit/{app_id}/sessions/{session_id}/summary:
    get:
      operationId: GetSessionSummary
      summary: Fetch summary of transcripts for a session
      description: Returns a Summary URL to download the Summary of Transcripts for the session ID as plain text.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_account_identifier'
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_app_id'
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/realtimekit_GetSessionTranscriptSummary'
      security:
      - api_token: []
      tags:
      - Sessions
      x-api-token-group:
      - Realtime Admin
      - Realtime
      x-fern-availability: beta
      x-fern-sdk-group-name: realtime.kit.sessions.summaries
      x-fern-sdk-method-name: export
    post:
      operationId: post-sessions-session_id-summary
      summary: Generate summary of Transcripts for the session
      description: Trigger Summary generation of Transcripts for the session ID.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_account_identifier'
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_app_id'
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session_id:
                        type: string
                        format: uuid
                      status:
                        type: string
                  success:
                    type: boolean
      security:
      - api_token: []
      tags:
      - Sessions
      x-api-token-group:
      - Realtime Admin
      - Realtime
      x-fern-availability: beta
      x-fern-sdk-group-name: realtime.kit.sessions.summaries
      x-fern-sdk-method-name: generate
  /accounts/{account_id}/realtime/kit/{app_id}/sessions/{session_id}/transcript:
    get:
      operationId: GetSessionTranscript
      summary: Fetch the complete transcript for a session
      description: Returns a URL to download the transcript for the session ID in CSV format.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_account_identifier'
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/realtimekit_app_id'
      - name: session_id
        in: path
        description: ID of the session
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        description: Transcript file format to fetch.
        schema:
          type: string
          default: CSV
          enum:
          - SRT
          - VTT
          - JSON
          - CSV
      responses:
        '200':
          $ref: '#/components/responses/realtimekit_GetSessionTranscript'
      security:
      - api_token: []
      tags:
      - Sessions
      x-api-token-group:
      - Realtime Admin
      - Realtime
      x-fern-availability: beta
      x-fern-sdk-group-name: realtime.kit.sessions.transcripts
      x-fern-sdk-method-name: export
components:
  parameters:
    realtimekit_status:
      in: query
      name: status
      schema:
        type: string
        enum:
        - LIVE
        - ENDED
    realtimekit_startTime:
      description: The start time range for which you want to retrieve the meetings. The time must be specified in ISO format.
      in: query
      name: start_time
      schema:
        type: string
        format: date-time
    realtimekit_perPage:
      allowEmptyValue: true
      description: Number of results per page
      in: query
      name: per_page
      schema:
        type: number
        minimum: 0
    realtimekit_endTime:
      description: The end time range for which you want to retrieve the meetings. The time must be specified in ISO format.
      in: query
      name: end_time
      schema:
        type: string
        format: date-time
    realtimekit_sortBy:
      in: query
      name: sort_by
      schema:
        type: string
        enum:
        - minutesConsumed
        - createdAt
    realtimekit_sortOrder:
      in: query
      name: sort_order
      schema:
        type: string
        enum:
        - ASC
        - DESC
    realtimekit_participants:
      examples:
        default:
          value: '1:10'
      in: query
      name: participants
      schema:
        type: string
        example: '1:10'
    realtimekit_participantsSortBy:
      in: query
      name: sort_by
      schema:
        type: string
        enum:
        - joinedAt
        - duration
    realtimekit_pageNo:
      allowEmptyValue: true
      description: The page number from which you want your page search results to be displayed.
      in: query
      name: page_no
      schema:
        type: number
        minimum: 0
  schemas:
    realtimekit_PeerReportMetadata:
      description: Connection and device metadata for the participant.
      type: object
      properties:
        audio_devices_updates:
          type: array
          items:
            $ref: '#/components/schemas/realtimekit_PeerReportDeviceUpdate'
        browser_metadata:
          type: object
          properties:
            browser:
              type: string
            browser_version:
              type: string
            engine:
              type: string
            user_agent:
              type: string
            webgl_support:
              type:
              - boolean
              - 'null'
        candidate_pairs:
          type: object
          properties:
            consuming_transport:
              type: array
              items:
                $ref: '#/components/schemas/realtimekit_CandidatePairStats'
            producing_transport:
              type: array
              items:
                $ref: '#/components/schemas/realtimekit_CandidatePairStats'
        device_info:
          type: object
          properties:
            cpus:
              type: number
            is_mobile:
              type: boolean
            os:
              type: string
            os_version:
              type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/realtimekit_PeerReportEvent'
        ip_information:
          type: object
          properties:
            asn:
              type: object
              properties:
                asn:
                  type: string
                domain:
                  type: string
                name:
                  type: string
                route:
                  type: string
                type:
                  type: string
            city:
              type: string
            country:
              type: string
            ipv4:
              type: string
            org:
              type: string
            region:
              type: string
            timezone:
              type: string
        native_metadata:
          type: object
          properties:
            audio_encoder:
              type: string
            video_encoder:
              type: string
        pc_metadata:
          type: array
          items:
            properties:
              effective_network_type:
                type: string
              reflexive_connectivity:
                type: boolean
              relay_connectivity:
                type: boolean
              sdp:
                type: array
                items:
                  type: string
              timestamp:
                type: string
              turn_connectivity:
                type: boolean
            type: object
        room_view_type:
          type: string
        sdk_name:
          type: string
        sdk_type:
          type: string
        sdk_version:
          type: string
        selected_device_updates:
          type: array
          items:
            properties:
              device:
                $ref: '#/components/schemas/realtimekit_PeerReportDevice'
              timestamp:
                type: string
            type: object
        speaker_devices_updates:
          type: array
          items:
            $ref: '#/components/schemas/realtimekit_PeerReportDeviceUpdate'
        video_devices_updates:
          type: array
          items:
            $ref: '#/components/schemas/realtimekit_PeerReportDeviceUpdate'
    realtimekit_PeerReportDeviceUpdate:
      description: A change to the set of available devices at a point in time.
      type: object
      properties:
        added:
          description: Devices that became available.
          type: array
          items:
            $ref: '#/components/schemas/realtimekit_PeerReportDevice'
        removed:
          description: Devices that became unavailable.
          type: array
          items:
            $ref: '#/components/schemas/realtimekit_PeerReportDevice'
        timestamp:
          description: Timestamp of the device update.
          type: string
    realtimekit_LatencyCumulative:
      description: Cumulative latency distribution (milliseconds-based thresholds).
      type: object
      properties:
        100ms_or_greater_event_fraction:
          type: number
        250ms_or_greater_event_fraction:
          type: number
        500ms_or_greater_event_fraction:
          type: number
        avg:
          type: number
    realtimekit_PeerReportQuality:
      description: Media quality statistics for the participant.
      type: object
      properties:
        audio_consumer:
          type: array
          items:
            $ref: '#/components/schemas/realtimekit_AudioConsumerStats'
        audio_consumer_cumulative:
          $ref: '#/components/schemas/realtimekit_AudioConsumerStatsCumulative'
        audio_producer:
          type: array
          items:
            $ref: '#/components/schemas/realtimekit_AudioProducerStats'
        audio_producer_cumulative:
          $ref: '#/components/schemas/realtimekit_AudioProducerStatsCumulative'
        screenshare_audio_consumer:
          type: array
          items:
            $ref: '#/components/schemas/realtimekit_AudioConsumerStats'
        screenshare_audio_consumer_cumulative:
          $ref: '#/components/schemas/realtimekit_AudioConsumerStatsCumulative'
        screenshare_audio_producer:
          type: array
          items:
            $ref: '#/components/schemas/realtimekit_AudioProducerStats'
        screenshare_audio_producer_cumulative:
          $ref: '#/components/schemas/realtimekit_AudioProducerStatsCumulative'
        screenshare_video_consumer:
          type: array
          items:
            $ref: '#/components/schemas/realtimekit_VideoConsumerStats'
        screenshare_video_consumer_cumulative:
          $ref: '#/components/schemas/realtimekit_VideoConsumerStatsCumulative'
        screenshare_video_producer:
          type: array
          items:
            $ref: '#/components/schemas/realtimekit_VideoProducerStats'
        screenshare_video_producer_cumulative:
          $ref: '#/components/schemas/realtimekit_VideoProducerStatsCumulative'
        video_consumer:
          type: array
          items:
            $ref: '#/components/schemas/realtimekit_VideoConsumerStats'
        video_consumer_cumulative:
          $ref: '#/components/schemas/realtimekit_VideoConsumerStatsCumulative'
        video_producer:
          type: array
          items:
            $ref: '#/components/schemas/realtimekit_VideoProducerStats'
        video_producer_cumulative:
          $ref: '#/components/schemas/realtimekit_VideoProducerStatsCumulative'
    realtimekit_VideoConsumerStats:
      description: Per-sample inbound (consumer) video statistics.
      type: object
      properties:
        bytes_received:
          type: number
        consumer_id:
          type: string
        fir_count:
          type: number
        frame_height:
          type: number
        frame_width:
          type: number
        frames_decoded:
          type: number
        frames_dropped:
          type: number
        frames_per_second:
          type: number
        jitter:
          type: number
        jitter_buffer_delay:
          type: number
        jitter_buffer_emitted_count:
          type: number
        key_frames_decoded:
          type: number
        mid:
          type: string
        mos_quality:
          type: number
        packets_lost:
          type: number
        packets_received:
          type: number
        peer_id:
          type: string
        producer_id:
          type: string
        ssrc:
          type: number
        timestamp:
          type: string
    realtimekit_PeerReportDevice:
      description: A media device (camera, microphone, or speaker).
      type: object
      properties:
        device_id:
          description: ID of the device.
          type: string
        kind:
          description: Kind of device, for example audioinput or videoinput.
          type: string
        label:
          description: Human-readable label of the device.
          type: string
    realtimekit_PeerEvent:
      description: A connection lifecycle event recorded for a participant's peer.
      type: object
      properties:
        created_at:
          description: Timestamp when this peer event was created.
          type: string
        event_name:
          description: Name of the peer event.
          type: string
          enum:
          - PEER_CREATED
          - PEER_JOINING
          - PEER_LEAVING
        id:
          description: ID of the peer event.
          type: string
        minutes_consumed:
          description: Minutes consumed attributed to this event.
          type: number
        participant_id:
          description: ID of the participant this event belongs to.
          type:
          - string
          - 'null'
        peer_id:
          description: Peer ID this event belongs to.
          type: string
        preset_view_type:
          description: View type of the preset associated with the peer.
          type:
          - string
          - 'null'
          enum:
          - GROUP_CALL
          - WEBINAR
          - AUDIO_ROOM
          - LIVESTREAM
          - CHAT
        session_id:
          description: ID of the session this event belongs to.
          type:
          - string
          - 'null'
        socket_session_id:
          description: ID of the socket session associated with this event.
          type:
          - string
          - 'null'
        updated_at:
          description: Timestamp when this peer event was last updated.
          type: string
    realtimekit_AudioProducerStats:
      description: Per-sample outbound (producer) audio statistics.
      type: object
      properties:
        bytes_sent:
          type: number
        jitter:
          type: number
        mid:
          type: string
        mos_quality:
          type: number
        packets_lost:
          type: number
        packets_sent:
          type: number
        producer_id:
          type: string
        rtt:
          type: number
        ssrc:
          type: number
        timestamp:
          type: string
    realtimekit_VideoProducerStatsCumulative:
      description: Aggregated outbound (producer) video statistics for the session.
      type: object
      properties:
        frame_per_second:
          $ref: '#/components/schemas/realtimekit_PercentileStats'
        frame_width:
          $ref: '#/components/schemas/realtimekit_PercentileStats'
        high_negative_feedback_fraction:
          type: number
        issues:
          type: object
          properties:
            bandwidth_quality_limitation_fraction:
              type: number
            cpu_quality_limitation_fraction:
              type: number
            no_video_fraction:
              type: number
            poor_resolution_fraction:
              type: number
            quality_limitation_fraction:
              type: number
        key_frames_encoded_fraction:
          type: number
        packet_loss:
          $ref: '#/components/schemas/realtimekit_PacketLossCumulative'
        quality_mos:
          $ref: '#/components/schemas/realtimekit_PercentileStats'
        rtt:
          $ref: '#/components/schemas/realtimekit_LatencyCumulative'
    realtimekit_VideoConsumerStatsCumulative:
      description: Aggregated inbound (consumer) video statistics for the session.
      type: object
      properties:
        frame_per_second:
          $ref: '#/components/schemas/realtimekit_PercentileStats'
        frame_width:
          $ref: '#/components/schemas/realtimekit_PercentileStats'
        issues:
          type: object
          properties:
            lag_fraction:
              type: number
            no_video_fraction:
              type: number
            poor_resolution_fraction:
              type: number
        jitter_buffer_delay:
          $ref: '#/components/schemas/realtimekit_LatencyCumulative'
        key_frames_decoded_fraction:
          type: number
        packet_loss:
          $ref: '#/components/schemas/realtimekit_PacketLossCumulative'
        quality_mos:
