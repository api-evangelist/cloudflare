      properties:
        10_or_greater_event_fraction:
          type: number
        25_or_greater_event_fraction:
          type: number
        50_or_greater_event_fraction:
          type: number
        5_or_greater_event_fraction:
          type: number
        avg:
          type: number
    realtimekit_app_id:
      description: The app identifier tag.
      type: string
      example: 14a396e7-ca44-4937-bf1f-050a69118543
    realtimekit_ChatMessage:
      type: object
      properties:
        chat_download_url:
          description: URL where the chat logs can be downloaded
