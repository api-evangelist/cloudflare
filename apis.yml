  description: >-
    The Cloudflare Cache API enables developers to manage CDN caching behavior across Cloudflare's global
    network. It provides endpoints for purging cached content by URL, prefix, cache tag, or hostname,
    as well as configuring cache rules, cache reserve, and tiered caching.
- aid: cloudflare:cloudflare-argo-smart-routing-api
  name: Cloudflare Argo Smart Routing API
  tags:
  - Network Optimization
  - Performance
  - Routing
  humanURL: https://developers.cloudflare.com/argo-smart-routing/
