  description: >-
    The Cloudflare Argo Smart Routing API enables developers to manage intelligent traffic routing that
    detects real-time network congestion and routes web traffic across the fastest network paths. It provides
    endpoints for enabling, disabling, and monitoring smart routing performance.
- aid: cloudflare:cloudflare-page-shield-api
