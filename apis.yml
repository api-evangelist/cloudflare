apis:
- aid: cloudflare:cloudflare-load-balancing-api
  name: Cloudflare Load Balancing API
  tags:
  - Load Balancing
  - Performance
  - Traffic Management
  humanURL: https://developers.cloudflare.com/load-balancing/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/load-balancing/
    type: Documentation
  - url: https://developers.cloudflare.com/api/resources/load_balancers/
    type: APIReference
  - url: https://developers.cloudflare.com/load-balancing/get-started/
    type: GettingStarted
  description: >-
    The Cloudflare Load Balancing API enables developers to distribute traffic across endpoints to reduce
    strain and latency. It provides endpoints for managing load balancers, pools, monitors, and health
    checks with support for geographic steering and session affinity.
- aid: cloudflare:cloudflare-waf-api
  name: Cloudflare WAF API
  tags:
  - Rules
  - Security
  - Web Application Firewall
  humanURL: https://developers.cloudflare.com/waf/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/waf/
    type: Documentation
  - url: https://developers.cloudflare.com/waf/get-started/
    type: GettingStarted
  description: >-
    The Cloudflare Web Application Firewall API checks incoming web and API requests and filters undesired
    traffic using rulesets. It supports managed rules, custom rules, rate limiting rules, and provides
    endpoints for deploying and managing rulesets via the Rulesets API.
- aid: cloudflare:cloudflare-graphql-analytics-api
  name: Cloudflare GraphQL Analytics API
  tags:
  - Analytics
  - GraphQL
  - Reporting
  humanURL: https://developers.cloudflare.com/analytics/graphql-api/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/analytics/graphql-api/
    type: Documentation
  - url: https://developers.cloudflare.com/analytics/graphql-api/getting-started/
    type: GettingStarted
  - url: graphql/cloudflare-graphql.md
    type: GraphQL
  description: >-
    The Cloudflare GraphQL Analytics API provides flexible access to analytics data across Cloudflare
    products including HTTP requests, firewall events, and load balancing metrics. Developers can query
    specific datasets, filter by dimensions, and aggregate data for custom reporting.
- aid: cloudflare:cloudflare-magic-transit-api
  name: Cloudflare Magic Transit API
  tags:
  - DDoS Protection
  - Network Security
  - Networking
  humanURL: https://developers.cloudflare.com/magic-transit/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/magic-transit/
    type: Documentation
  - url: https://developers.cloudflare.com/api/resources/magic_transit/
    type: APIReference
  - url: https://developers.cloudflare.com/magic-transit/get-started/
    type: GettingStarted
  description: >-
    The Cloudflare Magic Transit API provides endpoints for managing network security and performance
    for on-premises, cloud-hosted, and hybrid networks. It supports managing sites, site ACLs, static
    routes, GRE tunnels, and network interconnects for DDoS protection and traffic acceleration.
- aid: cloudflare:cloudflare-email-routing-api
  name: Cloudflare Email Routing API
  tags:
  - Email
  - Messaging
  - Routing
  humanURL: https://developers.cloudflare.com/email-routing/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/email-routing/
    type: Documentation
  description: >-
    The Cloudflare Email Routing API enables developers to create and manage custom email addresses and
    routing rules for their domains. It supports forwarding emails to destination addresses, creating
    catch-all rules, and integrating with Workers for programmatic email processing.
- aid: cloudflare:cloudflare-waiting-room-api
  name: Cloudflare Waiting Room API
  tags:
  - Performance
  - Queue
  - Traffic Management
  humanURL: https://developers.cloudflare.com/waiting-room/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/waiting-room/
    type: Documentation
  description: >-
    The Cloudflare Waiting Room API allows developers to manage virtual waiting rooms that route excess
    visitors to a customizable queue during high traffic. It provides endpoints for creating waiting rooms,
    configuring thresholds, and managing rules for session handling.
- aid: cloudflare:cloudflare-spectrum-api
  name: Cloudflare Spectrum API
  tags:
  - DDoS Protection
  - TCP
  - UDP
  humanURL: https://developers.cloudflare.com/spectrum/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/spectrum/
    type: Documentation
  description: >-
    Cloudflare Spectrum extends Cloudflare's DDoS protection and performance benefits to any TCP or UDP
    application. The API enables developers to manage Spectrum applications, configure origin connections,
    and apply IP firewall rules to non-HTTP traffic.
- aid: cloudflare:cloudflare-api-shield-api
  name: Cloudflare API Shield API
  tags:
  - API Gateway
  - API Security
  - Schema Validation
  humanURL: https://developers.cloudflare.com/api-shield/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/api-shield/
    type: Documentation
  - url: https://developers.cloudflare.com/api-shield/get-started/
    type: GettingStarted
  - url: https://developers.cloudflare.com/api/resources/api_gateway/
    type: APIReference
  description: >-
    Cloudflare API Shield provides API discovery, schema validation, and security features to protect
    APIs from abuse. It includes API Gateway capabilities for routing, authentication, and rate limiting,
    along with sequence-based fraud detection and mTLS client certificate enforcement.
- aid: cloudflare:cloudflare-zero-trust-api
  name: Cloudflare Zero Trust API
  tags:
  - Access Control
  - Security
  - Zero Trust
  humanURL: https://developers.cloudflare.com/cloudflare-one/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/cloudflare-one/
    type: Documentation
  - url: https://developers.cloudflare.com/cloudflare-one/api-terraform/
    type: APIReference
  description: >-
    The Cloudflare Zero Trust API enables developers to manage secure access to applications and networks
    without a traditional VPN. It includes Access policies, Gateway DNS and HTTP filtering, Tunnel management,
    device posture checks, and Data Loss Prevention configuration.
- aid: cloudflare:cloudflare-registrar-api
  name: Cloudflare Registrar API
  tags:
  - DNS
  - Domains
  - Registration
  humanURL: https://developers.cloudflare.com/registrar/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/registrar/
    type: Documentation
  description: >-
    The Cloudflare Registrar API allows developers to manage domain registrations at cost. It provides
    endpoints for listing domains, updating domain contacts, configuring DNSSEC, and managing domain transfers
    and renewals.
- aid: cloudflare:cloudflare-workflows-api
  name: Cloudflare Workflows API
  tags:
  - Durable Execution
  - Serverless
  - Workflows
  humanURL: https://developers.cloudflare.com/workflows/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/workflows/
    type: Documentation
  - url: https://developers.cloudflare.com/api/resources/workflows/
    type: APIReference
  - url: https://developers.cloudflare.com/workflows/get-started/
    type: GettingStarted
  description: >-
    Cloudflare Workflows enables developers to build durable, multi-step applications on Workers that
    automatically retry failed tasks and persist state for minutes, hours, or weeks. The API provides
    endpoints for creating, managing, and monitoring workflow instances with support for step functions,
    sleep, and event-driven execution.
- aid: cloudflare:cloudflare-browser-rendering-api
  name: Cloudflare Browser Rendering API
  tags:
  - Browser Automation
  - Headless Browser
  - Rendering
  humanURL: https://developers.cloudflare.com/browser-rendering/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/browser-rendering/
    type: Documentation
  - url: https://developers.cloudflare.com/browser-rendering/rest-api/
    type: APIReference
  - url: https://developers.cloudflare.com/api/resources/browser_rendering/
    type: APIReference
  description: >-
    The Cloudflare Browser Rendering API enables developers to control headless browser instances on Cloudflare's
    global network. The REST API provides endpoints for capturing screenshots, extracting HTML content,
    generating PDFs, scraping elements, and converting pages to markdown, with support for Puppeteer and
    Playwright automation.
- aid: cloudflare:cloudflare-realtime-api
  name: Cloudflare Realtime API
  tags:
  - Audio
  - Real-Time Communication
  - Video
  - WebRTC
  humanURL: https://developers.cloudflare.com/realtime/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/realtime/
    type: Documentation
  - url: https://developers.cloudflare.com/realtime/sfu/https-api/
    type: APIReference
  - url: https://developers.cloudflare.com/realtime/turn/
    type: APIReference
  description: >-
    The Cloudflare Realtime API provides WebRTC infrastructure for building real-time audio and video
    applications. It includes a Selective Forwarding Unit (SFU) for media routing across Cloudflare's
    global network, a managed TURN relay service for NAT traversal, and the RealtimeKit SDK for simplified
    integration.
- aid: cloudflare:cloudflare-containers-api
  name: Cloudflare Containers API
  tags:
  - Compute
  - Containers
  - Serverless
  humanURL: https://developers.cloudflare.com/containers/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/containers/
    type: Documentation
  - url: https://developers.cloudflare.com/containers/get-started/
    type: GettingStarted
  description: >-
    The Cloudflare Containers API allows developers to run container workloads on Cloudflare's global
    network, managed directly from Workers code. Containers support full isolation, on-demand scaling,
    GPU access, and a hybrid model that combines serverless speed with container flexibility for stateful
    and stateless workloads.
- aid: cloudflare:cloudflare-ai-search-api
  name: Cloudflare AI Search API
  tags:
  - Artificial Intelligence
  - RAG
  - Search
  humanURL: https://developers.cloudflare.com/ai-search/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/ai-search/
    type: Documentation
  - url: https://developers.cloudflare.com/ai-search/usage/rest-api/
    type: APIReference
  - url: https://developers.cloudflare.com/ai-search/get-started/
    type: GettingStarted
  description: >-
    The Cloudflare AI Search API provides fully managed retrieval-augmented generation (RAG) pipelines.
    Developers upload documents to R2 and AI Search handles embeddings, indexing, retrieval, and response
    generation via a REST API, enabling context-aware AI search without managing infrastructure.
- aid: cloudflare:cloudflare-agents-api
  name: Cloudflare Agents API
  tags:
  - Agents
  - Artificial Intelligence
  - Serverless
  humanURL: https://developers.cloudflare.com/agents/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/agents/
    type: Documentation
  - url: https://developers.cloudflare.com/agents/api-reference/
    type: APIReference
  - url: https://developers.cloudflare.com/agents/getting-started/
    type: GettingStarted
  description: >-
    The Cloudflare Agents SDK enables developers to build and deploy AI-powered agents that autonomously
    perform tasks, communicate with clients in real time, call AI models, persist state, schedule tasks,
    and support human-in-the-loop interactions. It integrates with Workers AI, Durable Objects, and MCP.
- aid: cloudflare:cloudflare-pipelines-api
  name: Cloudflare Pipelines API
  tags:
  - Data Ingestion
  - ETL
  - Streaming
  humanURL: https://developers.cloudflare.com/pipelines/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/pipelines/
    type: Documentation
  - url: https://developers.cloudflare.com/pipelines/getting-started/
    type: GettingStarted
  description: >-
    The Cloudflare Pipelines API enables developers to ingest events via HTTP endpoints or Worker bindings,
    transform data with SQL, and deliver it to R2 as Apache Iceberg tables or Parquet and JSON files.
    Pipelines support durable buffered queues with exactly-once delivery guarantees.
- aid: cloudflare:cloudflare-ddos-protection-api
  name: Cloudflare DDoS Protection API
  tags:
  - DDoS Protection
  - Rules
  - Security
  humanURL: https://developers.cloudflare.com/ddos-protection/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/ddos-protection/
    type: Documentation
  - url: https://developers.cloudflare.com/ddos-protection/get-started/
    type: GettingStarted
  description: >-
    The Cloudflare DDoS Protection API provides managed rulesets for mitigating DDoS attacks at both the
    application and network layers. Developers can configure HTTP and network-layer attack protection
    overrides, adjust sensitivity levels, and customize actions via the Rulesets API.
- aid: cloudflare:cloudflare-zaraz-api
  name: Cloudflare Zaraz API
  tags:
  - Analytics
  - Performance
  - Third-Party Tools
  humanURL: https://developers.cloudflare.com/zaraz/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/zaraz/
    type: Documentation
  - url: https://developers.cloudflare.com/zaraz/get-started/
    type: GettingStarted
  description: >-
    The Cloudflare Zaraz API allows developers to load and manage third-party tools in the cloud instead
    of the browser. It provides a unified web API with track, set, and ecommerce methods for sending events
    to third-party tools, improving page load performance and privacy.
- aid: cloudflare:cloudflare-secrets-store-api
  name: Cloudflare Secrets Store API
  tags:
  - Configuration
  - Secrets Management
  - Security
  humanURL: https://developers.cloudflare.com/secrets-store/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/secrets-store/
    type: Documentation
  - url: https://developers.cloudflare.com/api/resources/secrets_store/
    type: APIReference
  description: >-
    The Cloudflare Secrets Store API enables developers to securely encrypt and store sensitive information
    as secrets that are reusable across a Cloudflare account. It provides endpoints for managing stores
    and secrets, with integration into Workers and AI Gateway for runtime access.
- aid: cloudflare:cloudflare-web-analytics-api
  name: Cloudflare Web Analytics API
  tags:
  - Analytics
  - Performance
  - RUM
  humanURL: https://developers.cloudflare.com/web-analytics/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/web-analytics/
    type: Documentation
  - url: https://developers.cloudflare.com/web-analytics/get-started/
    type: GettingStarted
  description: >-
    The Cloudflare Web Analytics API provides privacy-first real user measurement (RUM) analytics for
    websites. It uses a lightweight JavaScript beacon to collect performance data via the Performance
    API without cookies or IP tracking, with support for automatic and manual injection.
- aid: cloudflare:cloudflare-cache-api
  name: Cloudflare Cache API
  tags:
  - Caching
  - CDN
  - Performance
  humanURL: https://developers.cloudflare.com/cache/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/cache/
    type: Documentation
  - url: https://developers.cloudflare.com/api/resources/cache/
    type: APIReference
  description: >-
    The Cloudflare Cache API enables developers to manage CDN caching behavior across Cloudflare's global
    network. It provides endpoints for purging cached content by URL, prefix, cache tag, or hostname,
    as well as configuring cache rules, cache reserve, and tiered caching.
- aid: cloudflare:cloudflare-argo-smart-routing-api
  name: Cloudflare Argo Smart Routing API
  tags:
  - Network Optimization
  - Performance
  - Routing
  humanURL: https://developers.cloudflare.com/argo-smart-routing/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/argo-smart-routing/
    type: Documentation
  - url: https://developers.cloudflare.com/api/resources/argo/subresources/smart_routing/
    type: APIReference
  - url: https://developers.cloudflare.com/argo-smart-routing/get-started/
    type: GettingStarted
  description: >-
    The Cloudflare Argo Smart Routing API enables developers to manage intelligent traffic routing that
    detects real-time network congestion and routes web traffic across the fastest network paths. It provides
    endpoints for enabling, disabling, and monitoring smart routing performance.
- aid: cloudflare:cloudflare-page-shield-api
  name: Cloudflare Page Shield API
  tags:
  - Client-Side Security
  - Script Monitoring
  - Security
  humanURL: https://developers.cloudflare.com/page-shield/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/page-shield/
    type: Documentation
  - url: https://developers.cloudflare.com/page-shield/reference/page-shield-api/
    type: APIReference
  - url: https://developers.cloudflare.com/page-shield/get-started/
    type: GettingStarted
  description: >-
    The Cloudflare Page Shield API enables developers to monitor and manage client-side resources loaded
    by website visitors. It provides endpoints for detecting scripts, connections, and cookies, with malicious
    script detection alerts and configurable security policies.
- aid: cloudflare:cloudflare-workers-for-platforms-api
  name: Cloudflare Workers for Platforms API
  tags:
  - Multi-Tenant
  - Platform
  - Serverless
  humanURL: https://developers.cloudflare.com/cloudflare-for-platforms/workers-for-platforms/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/cloudflare-for-platforms/workers-for-platforms/
    type: Documentation
  - url: https://developers.cloudflare.com/api/resources/workers_for_platforms/
    type: APIReference
  - url: >-
      https://developers.cloudflare.com/cloudflare-for-platforms/workers-for-platforms/get-started/
    type: GettingStarted
  description: >-
    The Cloudflare Workers for Platforms API enables SaaS providers to deploy and manage customer code
    at scale using dispatch namespaces. It provides endpoints for creating namespaces, uploading user
    worker scripts, and dynamically routing requests to the appropriate worker with unlimited script limits
    and isolation.
- aid: cloudflare:cloudflare-1111-dns-resolver-api
  name: Cloudflare 1.1.1.1 DNS Resolver API
  tags:
  - DNS
  - Privacy
  - Resolver
  humanURL: https://developers.cloudflare.com/1.1.1.1/
  properties:
  - url: https://developers.cloudflare.com/1.1.1.1/
    type: Documentation
  - url: https://developers.cloudflare.com/1.1.1.1/setup/
    type: GettingStarted
  description: >-
    The Cloudflare 1.1.1.1 DNS Resolver is a fast and privacy-focused public DNS resolver. It supports
    DNS over HTTPS (DoH) and DNS over TLS (DoT) for encrypted DNS queries, with WARP integration for device-level
    traffic protection and family-friendly filtering options.
- aid: cloudflare:cloudflare-r2-sql-api
  name: Cloudflare R2 SQL API
  tags:
  - Analytics
  - Data Warehouse
  - SQL
  humanURL: https://developers.cloudflare.com/r2-sql/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/r2-sql/
    type: Documentation
  description: >-
    The Cloudflare R2 SQL API enables developers to query data stored in R2 using standard SQL syntax
    including JOINs, subqueries, and multi-table queries (added May 2026). It provides a serverless query
    engine for analyzing Iceberg tables and structured data in R2 buckets without requiring separate data
    warehouse infrastructure.
- aid: cloudflare:cloudflare-workers-vpc-api
  name: Cloudflare Workers VPC API
  tags:
  - Networking
  - Private Connectivity
  - VPC
  humanURL: https://developers.cloudflare.com/workers-vpc/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/workers-vpc/
    type: Documentation
  - url: https://developers.cloudflare.com/workers-vpc/get-started/
    type: GettingStarted
  description: >-
    Cloudflare Workers VPC allows Workers to connect to private APIs, services, and databases in external
    clouds (AWS, Azure, GCP, on-premise) that are not accessible from the public Internet. As of May 2026
    Workers can also reach destinations connected through Cloudflare WAN on-ramps (GRE, IPsec, CNI), Cloudflare
    Mesh, and routes announced through Cloudflare Tunnel. Bindings are configured via wrangler.jsonc rather
    than a separate REST surface.
- aid: cloudflare:cloudflare-artifacts-api
  name: Cloudflare Artifacts API
  tags:
  - Git
  - Storage
  - Version Control
  humanURL: https://developers.cloudflare.com/artifacts/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/artifacts/
    type: Documentation
  - url: https://developers.cloudflare.com/artifacts/api/
    type: APIReference
  description: >-
    Cloudflare Artifacts is a versioned file storage system that speaks Git, enabling programmatic repository
    creation and access via Workers, REST API, and Git clients. Recent additions (May 2026) include event
    subscriptions for repository lifecycle events and Wrangler CLI management commands. Currently in closed
    beta.
- aid: cloudflare:cloudflare-agents-managed-api
  name: Claude Managed Agents on Cloudflare API
  tags:
  - Agents
  - Anthropic
  - Artificial Intelligence
  - Managed Agents
  humanURL: https://blog.cloudflare.com/announcing-claude-managed-agents-on-cloudflare/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://blog.cloudflare.com/announcing-claude-managed-agents-on-cloudflare/
    type: Documentation
  description: >-
    Claude Managed Agents on Cloudflare is a partnership offering announced May 19, 2026 that exposes
    Anthropic-managed Claude agents running on Cloudflare's Agents SDK / Durable Objects substrate. It
    integrates with Workers AI, AI Gateway, and Cloudflare CASB's Claude Compliance API support announced
    the same week.
