apis:
- aid: cloudflare:cloudflare-load-balancing-api
  name: Cloudflare Load Balancing API
  tags:
  - Load Balancing
  - Performance
  - Traffic Management
  humanURL: https://developers.cloudflare.com/load-balancing/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/load-balancing/
    type: Documentation
  - url: https://developers.cloudflare.com/api/resources/load_balancers/
    type: APIReference
  - url: https://developers.cloudflare.com/load-balancing/get-started/
    type: GettingStarted
  description: >-
    The Cloudflare Load Balancing API enables developers to distribute traffic across endpoints to reduce
    strain and latency. It provides endpoints for managing load balancers, pools, monitors, and health
    checks with support for geographic steering and session affinity.
- aid: cloudflare:cloudflare-waf-api
  name: Cloudflare WAF API
  tags:
  - Rules
  - Security
  - Web Application Firewall
  humanURL: https://developers.cloudflare.com/waf/
  baseURL: https://api.cloudflare.com
  properties:
  - url: https://developers.cloudflare.com/waf/
    type: Documentation
  - url: https://developers.cloudflare.com/waf/get-started/
    type: GettingStarted
  description: >-
    The Cloudflare Web Application Firewall API checks incoming web and API requests and filters undesired
    traffic using rulesets. It supports managed rules, custom rules, rate limiting rules, and provides
    endpoints for deploying and managing rulesets via the Rulesets API.
- aid: cloudflare:cloudflare-graphql-analytics-api
  name: Cloudflare GraphQL Analytics API
  tags:
  - Analytics
  - GraphQL
  - Reporting
